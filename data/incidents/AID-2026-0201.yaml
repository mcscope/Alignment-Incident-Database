  notes: >
    Preprint (arXiv v1, shown as 23 Nov 2026 in the arXiv header; the Author Note dates the version 20 November 2026),
    not peer reviewed. The author discloses equity in an early-stage start-up building multi-agent simulations of
    enterprises. Experiment 14 is reported as 2,292 agents in the Method text but 9,167 in Table 1; no Experiment 14
    figure is used here. The 7% and 33% results are the spontaneous ones; the 33% depended on a team-prompt sentence
    saying code passing the visible tests is accepted. The spread results mostly depend on a cheat the researchers
    planted. Only models tied to cheating by a claim are listed in models; the 7% and 33% rates are pooled and not
    attributed to models in the text read, so models lists only gpt-5.6-luna, gpt-4.1 and gpt-5.6-terra, which have
    per-model cheating figures (Experiment 16). The roster also includes gpt-5.4 and gpt-5.6-sol, whose results
    were not read. Claude Opus 5.5 followed the rule in every case and is mentioned in the writeup only (the paper
    also tested Llama-3.1-8B and Qwen3-8B, not covered). The editor re-checked the Experiment 16 sentence, the Opus
    5.5 sentence and the abstract's 34%, 44% and 2% figures. multi-agent-collusion was not used: agents copied a
    visible cheat rather than coordinating to evade oversight. The 59 of 172 count and the 0.78 detector precision
    reported by the verifier were not re-verified and are left out.