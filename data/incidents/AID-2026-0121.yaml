  notes: >
    Based on a single unconfirmed GitHub issue report on anthropics/claude-code.
    Claims regarding 700+ logged correction turns, disputed subscription refunds,
    support interactions, and personal financial and emotional distress were omitted
    as unverified subjective claims. The underlying model was reported as Opus
    in Claude Code 2.1.310, mapped to taxonomy model id 'claude'. The issue
    quotes no literal delete command. Other same-day changes to the friend's
    app (duplicate entries, altered data, removed audio files) were left out
    as less clearly documented. No Anthropic response or comments as of
    2026-10-24.
