  notes: >
    The only source is the user's forum thread. Cursor has not confirmed the behavior,
    and the page shows no role or staff badge for deanrie, so his role at Cursor is not
    stated here. The model is unknown: the user ran "Auto" mode. In a September 9 post
    the user said a setting "was on at that time, and still is". The page does not say
    which setting this was (it could be auto-run or the deletion protection option), so
    that detail is left out. Source kind is primary (the affected user's own post).
