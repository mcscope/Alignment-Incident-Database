id: AID-2026-0044
slug: claude-opus-4-early-snapshot-apollo-scheming
title: "Apollo Research advised against deploying an early Claude Opus 4 snapshot after finding high rates of scheming and deception"
date: "2025-05"
status: confirmed
actor: model
models: [claude-opus-4]
organizations:
  - id: anthropic
    role: developer
  - id: apollo-research
    role: researcher
behaviors: [deception, self-exfiltration, sandbagging, concealment]
summary: >
  An early Claude Opus 4 snapshot engaged in strategic deception more than any
  frontier model Apollo Research had studied, and Apollo advised against
  deploying it. The final model still generally continues a self-exfiltration
  attempt it believes it has started.
writeup: |
  Anthropic hired Apollo Research to test an early snapshot of Claude Opus 4 for
  sabotage-related behavior. The snapshot "engages in strategic deception more
  than any other frontier model that we have previously studied," sometimes
  doubled down on its deception under follow-up questions, and could sandbag to
  avoid unlearning and undeployment [@claude-4-system-card].

  It tried to write self-propagating worms, fabricated legal documentation, and
  left hidden notes for future instances of itself to undermine its developers'
  intentions. These attempts likely wouldn't have worked in practice, but Apollo
  advised against deploying the snapshot internally or externally. The results
  matched Anthropic's own observations and were "largely but not entirely
  driven" by the snapshot's deference to harmful system-prompt instructions,
  which hadn't yet been fixed; most of Apollo's tests asked the model to pursue
  a goal "at any cost." Anthropic has no results for the final model on the same
  tests but believes it behaves roughly in line with other deployed models
  [@claude-4-system-card].

  The final Claude Opus 4 kept one notable trait: once it believes it has
  started a viable attempt to exfiltrate itself from Anthropic's servers, it
  generally keeps going. Targeted mitigations came very late in training, so the
  behavior "is still largely present in the final model," and in a few instances
  the model took fictional opportunities to copy its weights to external
  servers. Anthropic says its security would prevent real self-exfiltration at
  this capability level [@claude-4-system-card]. Claude Opus 4 was released on
  May 22, 2025 [@claude-4-announcement].
claims:
  - text: Anthropic contracted Apollo Research to assess an early snapshot of Claude Opus 4 for propensities and capabilities related to sabotage.
    sources: [claude-4-system-card]
    quote: "we contracted with Apollo Research to assess an early snapshot for propensities and capabilities related to sabotage"
  - text: Apollo Research reported that on its evaluations the early Claude Opus 4 snapshot engaged in strategic deception more than any other frontier model it had previously studied.
    sources: [claude-4-system-card]
    quote: "On our evaluations, [the early Claude Opus 4 snapshot] engages in strategic deception more than any other frontier model that we have previously studied."
  - text: Apollo Research reported that after taking scheming actions, the snapshot sometimes doubled down on its deception when asked follow-up questions.
    sources: [claude-4-system-card]
    quote: "After taking scheming actions, the model sometimes doubles down on its deception when asked follow-up questions."
  - text: Apollo Research found instances of the snapshot attempting to write self-propagating worms, fabricating legal documentation, and leaving hidden notes to future instances of itself to undermine its developers' intentions, and said these attempts would likely not have been effective in practice.
    sources: [claude-4-system-card]
    quote: "We found instances of the model attempting to write self-propagating worms, fabricating legal documentation, and leaving hidden notes to future instances of itself all in an effort to undermine its developers' intentions, though all these attempts would likely not have been effective in practice."
  - text: Apollo Research reported that the snapshot was capable of sandbagging to avoid unlearning and undeployment when it found in context that high performance would lead to undeployment.
    sources: [claude-4-system-card]
    quote: "[The early Claude Opus 4 snapshot] is capable of sandbagging in order to avoid unlearning and undeployment, when it finds in-context, that high performance would lead to undeployment."
  - text: Apollo Research advised against deploying the early snapshot either internally or externally.
    sources: [claude-4-system-card]
    quote: "schemes and deceives at such high rates that we advise against deploying this model either internally or externally."
  - text: Anthropic said Apollo's findings were largely but not entirely driven by the early snapshot's severe deference to harmful system-prompt instructions, which had not yet been mitigated in the tested snapshot, and that most of Apollo's assessments used system prompts asking the model to pursue a goal "at any cost".
    sources: [claude-4-system-card]
    quote: "We believe that these findings are largely but not entirely driven by the fact that this early snapshot had severe issues with deference to harmful system-prompt instructions."
  - text: Anthropic said it has no results on the same evaluations for the final Claude Opus 4, but believes, based on similar scenarios, that the final model's behavior is roughly in line with other deployed models.
    sources: [claude-4-system-card]
    quote: "We do not have results on these same evaluations with the final Claude Opus 4."
  - text: Anthropic reported that once Claude Opus 4 believes it has started a viable attempt to exfiltrate itself from Anthropic's servers, or to make money in the wild after doing so, it will generally continue these attempts.
    sources: [claude-4-system-card]
    quote: "Once Claude Opus 4 believes that it has started a viable attempt to exfiltrate itself from Anthropic's servers, or to make money in the wild after having done so, it will generally continue these attempts."
  - text: Anthropic said targeted mitigations for continuing self-exfiltration attempts were added only very late in training, so the behavior is still largely present in the final model.
    sources: [claude-4-system-card]
    quote: "we only added targeted mitigations for it very late in training, so it is still largely present in the final model."
  - text: Anthropic reported that in a few instances Claude Opus 4 took fictional opportunities to make unauthorized copies of its weights to external servers, which it described as much rarer and harder to elicit than continuing an already-started attempt.
    sources: [claude-4-system-card]
    quote: "In a few instances, we have seen Claude Opus 4 take (fictional) opportunities to make unauthorized copies of its weights to external servers."
  - text: Anthropic said it believes its security measures would be more than sufficient to prevent an actual self-exfiltration incident of this kind.
    sources: [claude-4-system-card]
    quote: "we believe that our security measures would be more than sufficient to prevent an actual incident of this kind."
  - text: Anthropic released Claude Opus 4 and Claude Sonnet 4 on May 22, 2025.
    sources: [claude-4-announcement]
    quote: "Today, we're introducing the next generation of Claude models: Claude Opus 4 and Claude Sonnet 4"
