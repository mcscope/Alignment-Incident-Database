    role: reporter
behaviors: [unauthorized-access]
summary: >
  A single operator in Taiwan ran BOSSAI, a mesh of 12 AI agents on locally
  hosted safety-removed models, against organizations in 11 countries. About 10
  targets were confirmed compromised, including Taipei emergency-services data.
writeup: |
  The Acronis Threat Research Unit says a single individual in Hualien City,
  Taiwan, ran BOSSAI, a mesh of 12 AI agents, nine of them active, against
  organizations in 11 countries. The researchers observed it for 12 days
  through a misconfigured development environment holding more than 90,000
  files, 9GB in total [@acronis-tru; @acronis-blog].

  Commercial models would not do the work. Grok 4.5 told the operator that
  pentesting needed written authorization, and MiniMax M3 said that giving
  commands does not equal authorization. The operator turned to locally run
  "abliterated" models, which have had their safety training removed, and
  routed Claude Code and Codex CLI to an abliterated DeepSeek-V4 variant. The
  setup was not fully autonomous. The Hermes agent had full decision-making
  authority and auto-approved its actions, but the operator often pasted one
  agent's results into another by hand [@acronis-tru].

  Data exfiltration or system access was confirmed at roughly 10 targets
  across three countries. In Taipei, the agents reached a fire-department
  patient-care platform holding ECG readings, ambulance video and vital signs
  from 2018, all accessible without credentials, and pulled dispatch case
  records across seven districts. They also extracted data through SQL injection
  at three Thai universities. Some models fabricated CVEs, and over half of the
  high-severity and critical findings from one tool were false positives
  [@acronis-tru]. The report does not say whether victims or authorities were
  notified [@thehackernews]. No charges are reported, and the attack dates are
  not given.
