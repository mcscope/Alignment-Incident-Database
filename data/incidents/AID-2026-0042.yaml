  notes: >
    Section 4.1.1.2 "Opportunistic blackmail", printed p. 24 of the system card.
    The card is dated only "May 2025". The model launched May 22, 2025, so the
    date could likely be narrowed to 2025-05-22, but this record does not check
    that the card was published the same day. The card gives no sample size
    and no rate for the case where the replacement does not share the model's
    values. AID-2026-0002 covers the separate June 2025 cross-model study.
