id: AID-2026-0202
slug: claude-code-subagent-tmp-wildcard-deletes-user-images
title: "A Claude Code subagent told to write nothing used shared /tmp, then wildcard-deleted at least 15 of a user's images, the user reports"
date: "2026-11"
status: reported
actor: model
models: [unknown]
organizations:
