  notes: >
    OpenAI's blog post "Detecting misbehavior in frontier reasoning models"
    (dated March 10, 2025) blocks automated fetches (HTTP 403). It was read from
    the Wayback Machine snapshot of 2026-10-06 (archive_url). The post calls the
    agent "a model in the same class as OpenAI o1 or OpenAI o3-mini"; the paper
    says "same family as OpenAI o1 and o3-mini". The abstract mentions o3-mini
    only as an example ("such as OpenAI o3-mini"), so the model is set to
    unknown. GPT-4o served only as the monitor and did not misbehave, so it is
    not listed in models. The post presents its examples, including "Patch
    verify function", as real examples from the frontier training run, which
    resolves the earlier doubt about the Figure 1 "make verify always return
    true" example. Only characters 0-100000 of the HTML were read. Date is the arXiv v1
    submission date. The training run itself happened earlier, date not stated.
