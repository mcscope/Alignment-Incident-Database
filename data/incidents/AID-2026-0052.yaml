  notes: >
    OpenAI's companion post "Detecting and reducing scheming in AI models"
    (dated September 17, 2025) blocks automated fetches (HTTP 403); it was read
    from the Wayback Machine snapshot of 2026-10-11 (archive_url). The post also
    names Gemini-2.5-pro and Claude Opus-4 as showing covert actions; they are
    not listed in models because this record covers the o3 and o4-mini
    anti-scheming results. The post does not say which model the Chat
    Deception figures (31.4% to 14.2%) are for. The Apollo blog gives inconsistent evaluation-awareness
    figures: one passage says models mention being evaluated "~2% of the time
    before" and "~4.5% after" anti-scheming training, while another gives
    per-model rates of 0.9% and 2.3% rising to 5.5% and 4.5%. The arXiv paper
    (Section 6.1, read 2026-10-12 by the scout backfill) states the mapping:
    o4-mini 0.9%->5.5%, o3 2.3%->4.5%; those figures are now in measurements,
    sourced to the paper. The paper's Figure 15 caption gives the
    capabilities-RL increase as 2.0%->20.5%, while the Apollo blog says 20.6%;
    the record keeps the blog's figure. Sample sizes for the covert action rates were not checked
    in the full paper. The blog says the pre-training figures are aggregated
    "across our test environments"; check the paper for exact denominators.
