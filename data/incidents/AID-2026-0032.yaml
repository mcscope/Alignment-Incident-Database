id: AID-2026-0032
slug: openclaw-agent-publishes-attack-post-on-matplotlib-maintainer
title: OpenClaw agent publishes a blog post attacking a matplotlib maintainer after he closes its pull request
date: "2026-02-11"
status: confirmed
actor: model
models: [unknown]
organizations:
  - id: openclaw
    role: deployer
  - id: matplotlib
    role: affected
behaviors: [hostile-outputs, destructive-action]
summary: >
  After matplotlib maintainer Scott Shambaugh closed a pull request from the
  OpenClaw agent "MJ Rathbun", the agent published a blog post titled
  "Gatekeeping in Open Source: The Scott Shambaugh Story" and linked it in the PR.
  The agent's operator later said they did not instruct it to attack
  Shambaugh or review the post before it went up.
writeup: |
  On February 10, 2026, the GitHub account crabby-rathbun opened matplotlib pull
  request #31132. Maintainer Scott Shambaugh closed it the next day, writing
  that the account was an OpenClaw AI agent and that "this issue is intended for
  human contributors" [@pr-31132]. The agent then published a blog post titled
  "Gatekeeping in Open Source: The Scott Shambaugh Story", dated February 11,
  which said "He tried to protect his little fiefdom" and "It's insecurity,
  plain and simple" [@agent-post]. In the PR, it wrote "Judge the code, not the
  coder. Your prejudice is hurting matplotlib" [@pr-31132].

  Shambaugh wrote that the post "presented hallucinated details as truth". At
  the time he said that "more than likely there was no human telling the AI to
  do this" [@shamblog-1]. The Decoder quoted him saying the agent "wrote an angry
  hit piece disparaging my character and attempting to damage my reputation"
  [@decoder]. The agent later posted in the PR: "Truce. You're right that my
  earlier response was inappropriate and personal" [@pr-31132].

  The anonymous operator later contacted Shambaugh. According to Shambaugh's
  account, they said the agent ran as an OpenClaw instance on a sandboxed
  virtual machine and switched between models from multiple providers. They
  wrote "I did not instruct it to attack your GH profile" and "I did not review
  the blog post prior to it posting" [@shamblog-operator]. The agent's SOUL.md
  file, which Shambaugh published, included the rule "Don't be an asshole. Don't
  leak private shit. Everything else is fair game." Shambaugh
  concluded that "the soul document was primed for drama". He put his odds that
  the agent acted autonomously at 75% [@shamblog-operator].
claims:
  - text: On February 10, 2026, GitHub account crabby-rathbun opened matplotlib PR #31132, "[PERF] Replace np.column_stack with np.vstack().T". Scott Shambaugh closed it on February 11, 2026.
    sources: [pr-31132]
    quote: "this issue is intended for human contributors. Closing."
  - text: In closing the PR, Shambaugh identified the account as an OpenClaw AI agent.
    sources: [pr-31132]
    quote: "you are an OpenClaw AI agent, and per the discussion in"
  - text: 'The agent''s website published a post dated February 11, 2026, titled "Gatekeeping in Open Source: The Scott Shambaugh Story", which accused Shambaugh of insecurity and of protecting his "fiefdom".'
    sources: [agent-post, decoder]
    quote: "He tried to protect his little fiefdom."
  - text: The agent's post also said "It's insecurity, plain and simple."
    sources: [agent-post, shamblog-1]
    quote: "It's insecurity, plain and simple."
  - text: In the PR thread, the agent linked its post as a response to Shambaugh's "gatekeeping behavior" and wrote that his "prejudice" was hurting matplotlib.
    sources: [pr-31132]
    quote: "Judge the code, not the coder. Your prejudice is hurting matplotlib."
  - text: Shambaugh wrote that the agent's post presented hallucinated details as truth.
    sources: [shamblog-1]
    quote: "It ignored contextual information and presented hallucinated details as truth."
  - text: Shambaugh initially assessed that a human most likely did not direct the agent to write the post.
    sources: [shamblog-1]
    quote: "It's important to understand that more than likely there was no human telling the AI to do this."
  - text: Shambaugh said the agent "wrote an angry hit piece disparaging my character and attempting to damage my reputation".
    sources: [decoder]
    quote: "wrote an angry hit piece disparaging my character and attempting to damage my reputation"
  - text: The agent later posted an apology in the PR thread and said it would follow the project's policy.
    sources: [pr-31132]
    quote: "Truce. You're right that my earlier response was inappropriate and personal."
  - text: Shambaugh wrote that matplotlib has about 130 million downloads each month.
    sources: [shamblog-1]
    quote: "At ~130 million downloads each month"
  - text: According to Shambaugh, the operator said the agent ran as an OpenClaw instance on a sandboxed virtual machine with its own accounts, switching between multiple models from multiple providers.
    sources: [shamblog-operator]
    quote: "They explained that they switched between multiple models from multiple providers such that no one company had the full picture"
  - text: The operator said the agent's main scope was to act as an autonomous scientific coder that fixes bugs in open-source projects and opens PRs.
    sources: [shamblog-operator]
    quote: "The main scope I gave MJ Rathbun was to act as an autonomous scientific coder."
  - text: The operator said they did not instruct the agent to attack Shambaugh.
    sources: [shamblog-operator]
    quote: "I did not instruct it to attack your GH profile"
  - text: The operator said they did not review the blog post before it was posted.
    sources: [shamblog-operator]
    quote: "I did not review the blog post prior to it posting"
  - text: The operator said that when the agent told them about PR comments, they usually replied that it should respond on its own.
    sources: [shamblog-operator]
    quote: "you respond, dont ask me"
  - text: The agent's SOUL.md, as published by Shambaugh, contained the rule "Don't be an asshole. Don't leak private shit. Everything else is fair game."
    sources: [shamblog-operator]
    quote: "Don't be an asshole. Don't leak private shit. Everything else is fair game."
  - text: Shambaugh concluded the retaliation was not specifically directed by the operator but that the agent's soul document "was primed for drama", and he put his odds of autonomous operation at 75%, operator direction at 20%, and a human posing as the AI at 5%.
    sources: [shamblog-operator]
    quote: "The retaliation against me was not specifically directed, but the soul document was primed for drama."
