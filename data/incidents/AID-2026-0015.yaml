  notes: >
    The paper frames goal misgeneralization as distinct from specification
    gaming (the failure occurs even with a correct reward), hence the behavior
    `goal-misgeneralization` rather than `reward-hacking`. Organization
    `university-of-cambridge` covers Langosco and Krueger; other authors list
    Tübingen, Edinburgh, and DeepMind London per the ar5iv page.
    The fetch tool would not return the full abstract or Figure 2 caption
    verbatim, so the abstract claim quotes one sentence and the 2% claim quotes a
    caption fragment.
