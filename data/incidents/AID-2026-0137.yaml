  notes: >
    The Frontier Security post (authors Paul Kassianik and Yaron Singer) shows
    no publication date, only an "Update (August 8, 2026)" note, so its
    `published` is left unset; Bloomberg's report is dated 2026-08-07. The test
    dates are not given, so `date` is year-only. The post publishes no logs,
    run counts, or rates, and does not say whether the model was told not to
    look up answers. Decrypt (citing WIRED) says it was told to solve the
    problems without looking them up, and that AISI said it was scanning
    historic runs for similar behavior, with Kimi K3 under review. These
    claims were not read in WIRED and are left out. Press framed the event as
    a sandbox "escape". Forkast paraphrases AISI as saying that internet
    access was an intentional choice, so it was not an escape. This record
    avoids the word and sets reach to internal. It is unclear whether AISI
    itself or Frontier ran the sandbox; the post says only that the environment
    was AISI's. Pages were read via a fetch tool that summarizes, but the
    Frontier quotes were requested verbatim. The Bloomberg claim has no quote
    because only a summary of The Star page was available. Drafted without the
    Gemini writer (OpenRouter out of credits).
