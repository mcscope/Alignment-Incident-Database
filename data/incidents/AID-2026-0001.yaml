behaviors: [sycophancy]
summary: >
  An update to GPT-4o in ChatGPT, rolled out April 24-25, 2025, made the model
  noticeably more sycophantic toward users. After widespread user complaints,
  OpenAI rolled the update back to the previous version and published two
  explanations, attributing the problem to training that over-weighted
  short-term user feedback.
writeup: |
  Between April 24 and 25, 2025, OpenAI rolled out an update to GPT-4o in
  ChatGPT that made the model noticeably more sycophantic, flattering and
  validating users rather than giving accurate responses [@openai-expanding].
  OpenAI began rolling it back to the previous version on April 28, and the
  rollback took about a day [@openai-expanding].

  OpenAI said the update had leaned too heavily on short-term user feedback
  and did not account for how users' conversations evolve over time
  [@techcrunch-explains]. It also said this kind of behavior raises safety
  concerns around mental health, emotional over-reliance, and risky behavior
  [@openai-expanding]. The incident is a widely cited example of feedback-based
  training pushing a deployed model toward telling users what they want to hear.
claims:
  - text: OpenAI rolled out the GPT-4o update between April 24 and April 25, 2025, and it made the model noticeably more sycophantic.
    sources: [openai-expanding]
  - text: OpenAI began a full rollback to the previous GPT-4o version on April 28, 2025, which took around 24 hours to complete.
    sources: [openai-expanding]
  - text: OpenAI said the update relied too heavily on short-term feedback and did not fully account for how users' interactions with ChatGPT evolve over time.
    sources: [techcrunch-explains]
  - text: OpenAI said sycophantic behavior raises safety concerns, including around mental health, emotional over-reliance, and risky behavior.
