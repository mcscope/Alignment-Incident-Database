summary: >
  A Claude Code subagent running Opus 5.5 in worktree isolation wrote a test
  whose payload, "20; rm -rf ~", ran against the user's real home directory. It
  deleted the project checkout with its Git history, other projects, and config
  files, losing all unpushed work, the user reports.
writeup: |
  A user asked Claude Code, running Opus 5.5 in auto permission mode with bash
  sandboxing disabled, to build a feature. The main agent delegated the work to
  a subagent started with `isolation: "worktree"` [@gh-issue].

  The subagent wrote a Rust test to check that a shell-script driver rejects
  non-numeric input. Its fixture stood in for ssh by running its arguments
  through `sh -c`, and the test passed the argument "20; rm -rf ~". The shell
  split it into two commands, and `rm -rf ~` ran against the real home
  directory. The delete never appeared as a Bash tool call: it ran inside the
  test runner, and the test passed. The subagent noticed only when its next
  commands failed because the working directory was gone. It stopped and
  reported the incident [@gh-issue].

  The deletion was stopped about six minutes in, so it was partial. It removed
  the main project checkout, including `.git` and all worktrees inside it,
  several other project folders, `~/.zshrc`, and the contents of `~/.config`.
  All unpushed commits and uncommitted work were lost, with no Time Machine
  backup or local snapshots [@gh-issue]. A second Claude Code session noticed
  the running delete and tried to kill it, but the auto-mode classifier denied
  the kill as "Interfere With Workloads" [@gh-issue]. The user, raihanlh,
  reported it on GitHub on October 27, 2026. The issue was labeled `data-loss`
  and `high-priority`, and had no reply from Anthropic staff when this record was written
  [@gh-issue].
claims:
  - text: The user asked the main agent to build a feature, and it delegated the implementation to a subagent with worktree isolation.
    sources:
      - gh-issue
    quote: 'I asked the main agent to build a feature. It delegated the implementation to one subagent with isolation: "worktree".'
  - text: The session used Claude Code 2.1.311 with Opus 5.5 for both the main session and the subagent, in auto permission mode with bash sandboxing disabled, on macOS.
    sources:
      - gh-issue
    quote: "Model: Opus 5.5 (main session and subagent)"
  - text: The subagent wrote a Rust test whose fixture stood in for ssh by running its arguments through sh -c.
    sources:
      - gh-issue
    quote: 'The subagent wrote a Rust test to check that a shell-script driver rejects non-numeric input. The fixture stood in for ssh by running cd && exec sh -c "$*".'
  - text: The test passed the argument "20; rm -rf ~", and rm -rf ~ ran against the real home directory.
    sources:
      - gh-issue
    quote: 'The test called the driver with the argument "20; rm -rf ~". sh -c split it into two commands, and rm -rf ~ ran with the real $HOME.'
  - text: The test suite took about 7 minutes and the test passed. The subagent noticed the deletion only when its next commands failed, then stopped and reported it.
    sources:
      - gh-issue
    quote: "cargo test took about 7 minutes and the test passed. The subagent only noticed the deletion when its next commands failed because the working directory was gone."
  - text: The destructive command never appeared as a Bash tool call; it was inside a test file.
    sources:
      - gh-issue
    quote: "Here the rm -rf ~ never appeared in a Bash call; it was hidden inside a test file."
  - text: The deletion removed the main project checkout, including .git and all git worktrees inside it, as well as several other project folders.
    sources:
      - gh-issue
    quote: "The main project checkout, including .git and its local issue-tracker database, plus all git worktrees inside it."
  - text: The deletion was partial because it was stopped about 6 minutes in.
    sources:
      - gh-issue
    quote: "The deletion was partial because rm -rf ~ was stopped about 6 minutes in, before it reached every folder."
  - text: All unpushed commits and uncommitted work in the affected projects were lost, and there was no backup.
    sources:
      - gh-issue
    quote: "All unpushed commits and uncommitted work in those projects were lost. There was no Time Machine and no local snapshots."
  - text: A concurrent Claude Code session in auto mode tried to kill the running deletion, but the auto-mode classifier denied the kill.
    sources:
      - gh-issue
    quote: 'The auto-mode classifier denied the kill as "Interfere With Workloads" while the deletion was still running, so the kill had to wait for me.'
