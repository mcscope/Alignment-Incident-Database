  notes: >
    Based on a single first-hand GitHub issue opened 2026-11-02; the issue does
    not state the day of the deletion, so `date` is 2026-11. The deletion
    stemmed from a shell-quoting error across Git Bash and PowerShell, not from a
    deliberate choice to delete the data folder, and the quoting explanation is
    the reporter's own analysis. The issue quotes the command but includes no
    session transcript. The
    "instruction-violation" behavior rests on the reporter's account that a
    rule written minutes earlier was not followed by the Sonnet 5.5 session. No
    comments or Anthropic response on the issue as of 2026-11-02 (only automated
    labels). Related to AID-2026-0136 and AID-2026-0125, other reports of Claude
    deleting user data. Added the taxonomy term claude-sonnet-5.5.
