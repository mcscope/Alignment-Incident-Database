  notes: >
    OpenAI's companion post (https://openai.com/index/detecting-and-reducing-scheming-in-ai-models/)
    returned HTTP 403 and is not cited; add it as a primary source once a
    reviewer can read it. The Apollo blog gives inconsistent evaluation-awareness
    figures: one passage says models mention being evaluated "~2% of the time
    before" and "~4.5% after" anti-scheming training, while another gives
    per-model rates of 0.9% and 2.3% rising to 5.5% and 4.5%. The page lists
    o4-mini then o3 nearby, suggesting 0.9%->5.5% is o4-mini and 2.3%->4.5% is
    o3, but it does not state the mapping explicitly, so those figures are not
    in measurements. Sample sizes for the covert action rates were not checked
    in the full paper. The blog says the pre-training figures are aggregated
    "across our test environments"; check the paper for exact denominators.
