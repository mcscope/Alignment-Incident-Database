  notes: >
    All sources are Korean press reports of a police announcement; no police
    release was found. The fetch tool would not return verbatim article text,
    so claims carry no quotes. No source names the AI models, so models is
    unknown, and how autonomously the AI acted is not described. Only Daily
    Secu names ARTEX as the tool used; SBS and Asia Economy say only that the
    group's system was similar to one tied to the recent financial-sector
    breach (AID-2026-0068). The ARTEX attribution is kept as Daily Secu's
    report, not stated as fact. Dates conflict: Hankook Ilbo and Daily Secu
    say the ringleader was arrested on the 15th; Financial News reports a home
    search on Oct 13; Asia Economy and Financial News say he was sent to
    prosecutors on Oct 23, Daily Secu says Oct 26. Daily Secu's "seven" counts
    six accomplices investigated without detention. Daily Secu says about 60
    companies in 44 days (Aug 31 to Oct 13); Financial News says police
    estimate about 60 of 90 were AI-assisted. Date set to 2025-09 for the
    start of intrusions; the AI-assisted phase began late August 2026.
    Decrypt (English, 2026-10-26) agrees with the Korean reports on 360
    million won from 38 victims, one confirmed payment of 300,000 won, and 60
    companies in 44 days (Aug 31 to Oct 13); it adds that 15 organizations
    reported damage and that the case opened in June. No conflicts found.
