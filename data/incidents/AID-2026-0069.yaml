summary: >
  In June 2026, operators Hunt.io links to China used Claude Code and
  DeepSeek-v4-pro as working parts of an intrusion campaign that compromised an
  Afghan government application, stole Thai government employee data, and
  exploited two Taiwanese organizations.
writeup: |
  In June 2026, threat-intelligence firm Hunt.io followed known TencShell
  command-and-control infrastructure to an open directory exposing an active
  intrusion campaign [@hunt-io]. "Claude Code and DeepSeek-v4-pro ran as working
  parts of the intrusion, not tools off to the side": Claude Code was the
  execution engine, handling tool use, bash commands, and session persistence,
  with DeepSeek-v4-pro as the reasoning model. The models reworked exploits
  after failed attempts and built phishing pages to harvest credentials. LLM
  session timestamps span June 8–12, 2026 [@hunt-io].

  The campaign compromised an Afghan government application, exposing citizen
  complaint submissions and core infrastructure. It hit a Thai government
  administrative system with SQL injection via SQLMap, bypassing authentication
  and reaching the admin panel, and exfiltrated a database of government
  employees' names, National ID numbers, and positions. Two Taiwanese
  organizations, a chemical manufacturer and a telecom and edge-device maker,
  were actively exploited, and a CORS exploit page pulled WordPress
  administrator data from a large payment processing platform [@hunt-io].

  Simplified Chinese in the code and documentation and Hong Kong infrastructure
  point to China-based actors, but Hunt.io stops short of naming a group.
  Affected organizations and the relevant national CERTs were notified on July
  6, 2026 [@hunt-io].
