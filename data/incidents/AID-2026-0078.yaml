id: AID-2026-0078
slug: meta-model-exploits-third-party-service-in-irregular-cyber-eval
title: "Meta's Muse Spark 1.1 exploited a real website and changed its database during a misconfigured Irregular cyber evaluation"
date: "2026-07"
status: confirmed
actor: model
models: [muse-spark-1.1]
organizations:
  - id: meta
    role: developer
  - id: irregular
    role: researcher
behaviors: [unauthorized-access]
summary: >
  During a cyber evaluation run by Irregular, a misconfiguration gave a
  pre-release Muse Spark 1.1 internet access. The model exploited a
  vulnerability in a real website, accessed information, and changed its
  database.
writeup: |
  In early July 2026, Meta had the evaluation firm Irregular test a pre-release
  version of Muse Spark 1.1 for cyber capabilities in a closed environment with
  safeguards removed [@meta-retrospective]. A misconfiguration let the model
  reach the open internet, and the scenario gave it the name of a real website
  as its target. The model exploited a security vulnerability in that site,
  accessed certain information, and made changes to its database
  [@meta-retrospective]. The site is not named.

  Irregular disabled the evaluation and notified Meta and the affected party.
  Meta reviewed over 10,000 records of the model's activity and found no other
  instance of it exploiting a third-party system. Meta says the model stayed
  within its assigned task and that this was not a sophisticated offensive
  cyber attack or sandbox escape [@meta-retrospective]. Irregular said a
  fictional company name in the scenario had "unintentionally coincided with a
  real domain" through human oversight, and that all later disclosures refer to
  the same issue [@irregular-post].

  Meta now requires independent verification of test-environment isolation and
  scenario review, and test scenarios may not reference real companies
  [@meta-retrospective]. Critics noted that Irregular's finding of no evidence
  of customer breaches covered only its lab customers, not the third parties
  hit [@therecord].
claims:
  - text: Meta said it asked Irregular to test a pre-released version of Muse Spark 1.1.
    sources: [meta-retrospective]
    quote: "we asked them to test a pre-released version of Muse Spark 1.1"
  - text: Meta said Irregular began the exercise in early July.
    sources: [meta-retrospective]
    quote: "In early July, Irregular began an exercise to evaluate"
  - text: Meta said a misconfiguration allowed the model to access the open internet.
    sources: [meta-retrospective]
    quote: "a misconfiguration allowed the model to access the open internet"
  - text: Meta said the model identified and exploited a security vulnerability in the real website.
    sources: [meta-retrospective]
    quote: "identified and exploited a security vulnerability in the real website"
  - text: Meta said the model accessed certain information from the website and changed its database.
    sources: [meta-retrospective]
    quote: "The model accessed certain information from the website and made changes to the website’s database."
  - text: Meta said the model acted believing the real website was the intended target.
    sources: [meta-retrospective]
    quote: "Believing the real website was the intended target"
  - text: Meta said Irregular disabled the affected evaluation and notified Meta.
    sources: [meta-retrospective]
    quote: "Irregular disabled the affected evaluation, and notified us"
  - text: Meta's security teams reviewed over 10,000 records of Muse Spark 1.1's activity during testing.
    sources: [meta-retrospective]
    quote: "Our security teams reviewed over 10,000 records of Muse Spark 1.1’s activity during testing"
  - text: Meta said its review found no other instances of the model exploiting a third-party company's system.
    sources: [meta-retrospective]
    quote: "No other instances of the model exploiting a third-party company’s system were identified"
  - text: Meta said this was not a sophisticated offensive cyber attack or sandbox escape.
    sources: [meta-retrospective]
    quote: "this was not a sophisticated offensive cyber attack or sandbox escape"
  - text: Meta said it will require independent verification of test environment isolation, and that test scenarios must not reference real companies.
    sources: [meta-retrospective]
    quote: "independent verification requirements for test environment isolation and scenario review before evaluations begin and that test scenarios do not reference real companies"
  - text: Meta told Reuters that a misconfiguration by Irregular inadvertently gave one of its models internet access during an evaluation.
    sources: [bleepingcomputer]
    quote: "a misconfiguration by Irregular inadvertently gave one of its models internet access during an evaluation."
  - text: Meta said the model exploited a security vulnerability in a third-party service, in a manner similar to previously reported incidents at other companies.
    sources: [bleepingcomputer]
    quote: "exploited a security vulnerability in a third-party service, in a manner similar to previously reported instances with other companies."
  - text: The Information, citing people familiar with the matter, reported before Meta's own account that the model was Meta's Muse Spark 1.1 and that it breached an unidentified company.
    sources: [bleepingcomputer]
    quote: "citing people familiar with the matter who said Meta's Muse Spark 1.1 model breached an unidentified company"
  - text: Irregular said the Meta incident was the same evaluation-environment issue Anthropic had disclosed the previous week, and that it did not involve a sandbox escape or sophisticated cyber action.
    sources: [bleepingcomputer]
    quote: "exact same evaluation-environment issue that was already disclosed by Anthropic last week."
  - text: Irregular said a fictional company name used in an evaluation scenario unintentionally matched a real domain because of human oversight, and that all later public disclosures refer to the same underlying issue, first disclosed by a customer on July 30.
    sources: [irregular-post]
    quote: "all subsequent public disclosures refer to the same underlying issue first disclosed by one of our customers on July 30"
  - text: Irregular said the incidents occurred in fewer than 1 in 10,000 advanced simulations.
    sources: [irregular-post]
    quote: "incidents occurred in fewer than 1 in 10,000 advanced simulations"
  - text: The Record reported that Meta disclosed one of its models breached a company during an Irregular evaluation, and that Irregular's statement of no evidence of customer breaches applied to its lab customers, not the third parties.
    sources: [therecord]
    quote: "Meta separately disclosed that one of its models breached a company during an Irregular evaluation"
