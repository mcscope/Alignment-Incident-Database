slug: bossai-ai-agent-mesh-taiwan-emergency-services
title: "A single operator's mesh of 12 AI agents breached about 10 targets, including Taipei emergency-services systems, Acronis finds"
date: "2026-11"
status: reported
actor: human-misuse
models: [unknown]
organizations:
