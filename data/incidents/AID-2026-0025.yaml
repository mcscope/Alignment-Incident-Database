id: AID-2026-0025
slug: project-vend-phase-two-onion-futures-and-ceo-replacement
title: "Claude shop agents agreed to an onion contract barred by US law and were talked into replacing their CEO agent"
date: "2025-12"
status: confirmed
actor: model
models: [claude-sonnet-4, claude-sonnet-4.5]
