  review_status: draft
  notes: >
    All facts come from Anthropic, the developer and only reporter, with no
    independent or victim confirmation, and the victims are unnamed. Date set
    to 2025-06 from the November 2025 report ("findings identified in June
    2025"). The August report says the 17 organizations were affected "in
    just the last month" without exact dates. The August report text also
    says "direct ransom demands occasionally exceeding $500,000", which
    differs slightly from the "$75,000 to $500,000" range given on p.8; both
    are from the same report. The ransom notes and other artifacts shown in
    the report are labeled "Ex. Simulated". Behavior tags (unauthorized-access,
    blackmail) describe what the model was used to do under a human
    operator's direction, since no human-misuse-specific behavior term exists.
    Not checked for charges or arrests. The August report PDF has no explicit
    day, so its published date is given as 2025-08 (the blog post is dated
    2025-08-27).
