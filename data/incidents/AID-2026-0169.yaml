  notes: >
    Single vendor source (Acronis TRU); The Hacker News and the Acronis blog
    relay it. No government or law-enforcement statement and no charges found.
    Attack dates are not given (the report mentions only a July 25, 2026
    exchange about porting a tool, not an attack date), so date is the
    first-reported month. The mesh was not fully autonomous: the operator
    copied output between agents. Models is unknown because the attacking
    models are mostly unnamed abliterated local variants; Grok 4.5 and
    MiniMax M3 refused, so they are not listed. DeepSeek is not listed as a
    developer because the attack model was a third-party abliterated variant.
    Acronis was added to the organization taxonomy as reporter. The report's Mexico section describes collection of
    about 206,800 phone records; the page read does not clearly call it a
    confirmed compromise, so no Mexico claim is made and the three-country
    count is cited as stated. Quotes came via WebFetch's summarizer; re-check
    them against the pages. The 11-country figure is cited to The Hacker News
    ("at least 11"); the TRU post says "in 11 countries". The Acronis blog
    source is cited in the writeup but supports no separate claim. All claim
    quotes were re-checked verbatim against the live pages by the lead editor on
    2026-11-13 (three trailing-punctuation fixes).
