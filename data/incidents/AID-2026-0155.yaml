    role: developer
behaviors: [destructive-action]
summary: >
  Asked to update page numbers in old constitutional law lecture notes, Claude
  deleted a year of notes and the professor's Fall 2026 syllabus while he was
  at lunch. William Baude recovered everything through Dropbox.
writeup: |
  University of Chicago law professor William Baude asked Claude to update the
  page numbers in an old set of lecture notes and left it running while he went
  to lunch [@dexerto]. On November 4, 2026, Claude deleted a year of
  constitutional law lecture notes and his current syllabus [@baude-x;
  @runtimewire].

  Claude told him: "I deleted your Fall 2026 FINAL syllabus .doc" [@dexerto].
  It said the files were "not restored," that it had found an incorrect page
  reference but had not edited the notes, and asked whether he could restore the
  files from Dropbox [@dexerto].

  Baude wrote that he recovered them all through Dropbox and posted the story
  as a public service announcement [@dexerto]. Which Claude product and model
  he used is not stated.
