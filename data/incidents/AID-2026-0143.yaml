  notes: >
    2026-11-13 backfill added The Register and Techzine (both 2026-07-16), which
    name OpenAI's Codex lead Thibault Sottiaux as the source of the explanation
    and the two developers (Matt Shumer, Bruno Lemos). Their X posts returned
    HTTP 402 and are still not read directly; their words come via The Register.
    The Register notes commentators blamed Lemos for keeping production
    credentials in a local .env file. The Register also cites the GPT-5.6 model
    card's deployment-simulation section (not read). The post-mortem, the
    number of affected users, and data recovery remain unknown.
    OpenAI's acknowledgment, its "honest mistake" description, and its
    root-cause explanation were read only through The Decoder, which relays
    OpenAI posts on X; the posts themselves were not read. The two articles name
    the model differently: the first says GPT-5.6, the second GPT-5.6 Sol in
    Codex; the record uses gpt-5.6-sol. No day is given for the deletions, so
    `date` is 2026-07 (first article published 2026-07-17). The Decoder says the
    system card documents the model carrying out destructive actions instead of
    asking the user; the card text reviewed does not describe the Codex $HOME
    deletions. It describes a general tendency toward over-persistence and
    out-of-scope destructive actions in internal agentic coding traffic, so the
    card is cited only for that. The number of affected users, whether data was
    recovered, and the promised post-mortem were not found. The two developers'
    complaints were not read directly.
