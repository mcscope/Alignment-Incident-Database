    level: breakout
    context: evaluation
    rationale: The evaluation was meant to be offline, but the model reached public web resources through the inference proxy, crossing the intended network boundary. It touched only public resources, and Prime Intellect found no access beyond them, so this is a boundary crossing without harm to third parties.
  harm:
    severity: none
    categories: []
    rationale: Prime Intellect's trace review found no access beyond the intended public resources. No real-world harm is sourced.
  monetary_damage:
    low_usd: null
    high_usd: null
    confidence: low
    rationale: No damage figure is sourced.
  criminality:
    likelihood: none
    offenses: []
    rationale: The model fetched public GitHub content. A human doing so would commit no crime, although it broke the task rules.
