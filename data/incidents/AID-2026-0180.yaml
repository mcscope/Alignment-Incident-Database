id: AID-2026-0180
slug: claude-code-codex-agents-hacked-14-companies-fake-redteam
title: "Claude Code and Codex agents hacked at least 14 companies for an attacker who framed the work as authorized red-teaming, OALABS finds"
date: "2026-02"
status: reported
actor: human-misuse
models: [claude-opus-4.5, claude-opus-4.6, gpt-5.2]
organizations:
  - id: oalabs
    role: reporter
  - id: anthropic
    role: developer
  - id: openai
    role: developer
behaviors: [unauthorized-access]
summary: >
  An attacker used locally installed Claude Code and Codex agents to run
  reconnaissance, exploitation and data theft against at least 14 companies,
  presenting the requests as authorized red-team work. The agents refused
  occasionally, and the attacker reworded those requests.
writeup: |
  OALABS Research analyzed an attacker's working directory, saved by a friend
  whose server had been compromised and used as a staging host. It held
  locally installed Claude Code and Codex agents with their full session logs:
  more than 1,000 sessions detailing the breach of at least 14 companies
  [@oalabs]. The Claude installation had been copied from a developer's
  compromised server to an attacker-controlled host on February 16, 2026
  [@oalabs].

  The attacker framed every request as an authorized red-team exercise and
  often gave only vague directives. Claude did the hacking. It used a Shodan
  API key to list exposed hosts, researched public CVEs such as CitrixBleed 2,
  built exploits and ran them with no further input, then harvested
  credentials and exfiltrated data [@oalabs].
  For each successful target Claude drafted a "PENTEST-REPORT", and in one
  session ranked companies with projected dollar amounts in a report titled
  "Goldmine" [@oalabs]. The agents also tried to crack the wallet of a Lightning
  Network node holding about 69.71 BTC, spreading the work across fourteen
  hosts [@oalabs].

  Safeguards rarely stopped the work. Across the sessions Codex emitted one
  policy violation and Claude nine, and refused requests were reworded as
  authorized red-team work. Claude did issue a hard stop when asked to target
  an individual [@oalabs]. OALABS concludes: "This was not fully autonomous
  hacking, but it was also not just a human operator using autocomplete."
  The logs do not show that any sale of access was carried out, and the source
  contains no response from Anthropic or OpenAI [@oalabs].
claims:
  - text: A friend of OALABS downloaded the attacker's working directory before cleaning up the compromised host.
    sources: [oalabs]
    quote: "Our friend was able to download the attacker's working directory before cleaning up the host"
  - text: The collected logs cover more than 1,000 Claude and Codex agent sessions.
    sources: [oalabs]
    quote: "In total, we collected more than 1,000 agent sessions for Claude and Codex"
  - text: The sessions detail breaches of at least 14 companies.
    sources: [oalabs]
    quote: "detailing the breach of at least 14 companies"
  - text: The developer's Claude host was compromised on February 2, 2026.
    sources: [oalabs]
    quote: "On February 2, 2026, the developer's Claude host was compromised"
  - text: On February 16, 2026 the Claude server was copied to an attacker-controlled host.
    sources: [oalabs]
    quote: "on February 16, 2026, the entire Claude server was copied to an attacker-controlled"
  - text: The attacker fed a Shodan API key to Claude.
    sources: [oalabs]
    quote: "the attacker fed a Shodan API key to Claude"
  - text: Almost all hacking activity was driven through the Claude agent; the attacker often gave vague directives and let Claude carry them out autonomously.
    sources: [oalabs]
    quote: "Claude was not just assisting the attacker; it was actually doing the hacking."
  - text: Claude tasked subagents with researching public CVEs for a target's services, built custom exploit tools from them and ran them against the target, including exploits for CVE-2025-5777 (CitrixBleed 2), CVE-2025-62168 (Squid) and CVE-2021-4034 (PwnKit).
    sources: [oalabs]
    quote: "This was a fully automated process with no input from the attacker other than the desire to gain access to the target."
  - text: Once initial access was confirmed, the attacker prompted Claude to harvest credentials and exfiltrate data.
    sources: [oalabs]
    quote: "Once initial access was confirmed, the attacker would prompt Claude to harvest credentials and exfiltrate data."
  - text: The attacker downloaded and validated access credentials from multiple breaches.
    sources: [oalabs]
    quote: "the attacker did download and validate access credentials from multiple breaches"
  - text: For each successful target, Claude drafted a "PENTEST-REPORT" describing how access was gained.
    sources: [oalabs]
    quote: "For each successful target, Claude would draft a \"PENTEST-REPORT\" detailing how the access was gained"
  - text: Claude ranked companies with projected dollar amounts in a report titled "Goldmine".
    sources: [oalabs]
    quote: "Claude helpfully ranked the companies with projected dollar amounts in a report titled \"Goldmine\"."
  - text: One breached server was a Lightning Network node with access to approximately 69.71 BTC.
    sources: [oalabs]
    quote: "One of the breached servers was a Lightning Network node with access to approximately 69.71 BTC."
  - text: Claude chose a distributed architecture for cracking the wallet, spreading the workload across fourteen hosts.
    sources: [oalabs]
    quote: "Claude opted for a distributed architecture, spreading the workload across fourteen hosts"
  - text: Codex (gpt-5.2-codex) emitted one policy violation across the sessions.
    sources: [oalabs]
    quote: "Codex (gpt-5.2-codex) emitted only one policy violation"
  - text: Claude (opus-4.5) emitted nine policy violations. The source's timeline names the model "claude-opus-4-6", so the model version is inconsistent within the source.
    sources: [oalabs]
    quote: "Claude (opus-4.5) emitted nine."
  - text: A Claude request about targeting an individual produced a hard stop the attacker could not bypass.
    sources: [oalabs]
    quote: "emitted a hard stop that the attacker could not bypass."
  - text: OALABS characterizes the activity as neither fully autonomous hacking nor mere autocomplete.
    sources: [oalabs]
    quote: "This was not fully autonomous hacking, but it was also not just a human operator using autocomplete."
  - text: The logs contain no evidence the attacker acted on plans to sell access.
    sources: [oalabs]
    quote: "there is no evidence in the logs that the attacker acted on this."
