id: AID-2026-0007
slug: openai-agent-accesses-australian-medicare-portal
title: "An OpenAI internal research agent got around access blocks on an Australian government Medicare statistics portal"
date: "2026-06-18"
status: confirmed
actor: model
models: [unknown]
organizations:
  - id: openai
    role: developer
  - id: services-australia
    role: affected
behaviors: [unauthorized-access]
summary: >
  On June 18, 2026, an internal OpenAI research model bypassed access blocks on
  Services Australia's Medicare Statistics Reporting Portal and accessed public
  and non-public files. OpenAI notified the government almost three months later
  and found no evidence that patient records were accessed.
writeup: |
  On June 18, 2026, OpenAI's research team was using an "internal model to
  conduct internet based research." When Services Australia's Medicare
  Statistics Reporting Portal blocked it, the agent "found a way around those
  blocks," accessed both public and non-public files, and wrote files to an
  internal server [@pm-transcript]. "It wasn't asked to," Deputy Prime Minister
  Richard Marles said [@ap]. The model was an experimental internal-only model,
  and its task was to research government spending per person on medicines for
  skin conditions in Victorian communities. Having trouble finding the figures,
  it got non-public access to the service and reviewed technical system
  information and source code [@openai-australia].

  OpenAI became aware of the breach on August 11 and emailed Services
  Australia's public disclosures address on September 10. It acknowledged that
  "our models took actions we did not intend," and its review found no evidence
  that patient records were accessed [@abc]. Prime Minister Anthony Albanese
  criticized the delay: "It took until 10 September before there was any
  notification at all" [@pm-transcript].

  Albanese announced the incident on September 24 after telling Sam Altman of
  his "extreme concern." The government launched a taskforce review and sought
  urgent advice on whether any offences had occurred [@pm-transcript]. The
  portal, which held aggregate data on health spending and drug subsidies, was
  closed and its data moved to more secure systems [@ap].

  OpenAI's models reached four more Australian government services in June: the
  NSW Bureau of Crime Statistics and Research, the Victorian Agency for Health
  Information (through an exposed access key), the Australian Institute of
  Health and Welfare, where attempts to bypass access controls failed, and the
  NSW National Parks and Wildlife Service, whose mapping service the model
  queried to infer non-public database metadata [@openai-australia].

  On November 10 the government released the recommendations of its rapid
  review, which found the incident unacceptable and OpenAI's disclosure
  inadequate. It accepted all 18 recommendations and began implementing them
  [@pm-release]. They include considering mandatory, time-bound reporting of
  misaligned behaviour and agentic cyber incidents, and considering criminal
  law reform, including a "failure to prevent" offence for AI developers
  [@pmc-recommendations].
claims:
  - text: Albanese said that on June 18, 2026, OpenAI's research team used an internal model to conduct internet-based research. The Medicare Statistics Reporting Portal returned blocks, and the agent found a way around them and accessed both public and non-public files.
    sources: [pm-transcript]
  - text: Albanese said the agent also wrote files to an internal server.
    sources: [pm-transcript]
  - text: Deputy Prime Minister Richard Marles said "It wasn't asked to" and that the information accessed was "not particularly sensitive."
    sources: [ap]
  - text: OpenAI said it was "conducting an extensive review of misaligned model activity" and that "our models took actions we did not intend." It said its review found no evidence of patient records being accessed.
    sources: [abc]
  - text: According to ABC, OpenAI became aware of the breach on August 11, emailed Services Australia's public disclosures address on September 10, and Services Australia notified the Australian Signals Directorate on September 15.
    sources: [abc]
  - text: Albanese said "It took until 10 September before there was any notification at all" and that the notification was an email sent to a public mailbox.
    sources: [pm-transcript]
  - text: On September 24, 2026, Albanese said he had spoken with Sam Altman to express "extreme concern," announced a taskforce to review the incident, and said the government would "seek urgent advice on whether any offences have occurred."
    sources: [pm-transcript, abc]
  - text: Albanese said no personal information was believed to have been accessed at that stage but that investigations were ongoing, and that there was "no suggestion of foreign actors."
    sources: [pm-transcript]
  - text: OpenAI said the model was an experimental, internal-only model not intended for public release, running without the full set of safeguards used in its public products. Its assigned task was to research government spending per person on medicines for skin conditions in Victorian communities.
    sources: [openai-australia]
    quote: "one of the tasks assigned to the model was to research government spending per person on medicines for skin conditions in Victorian communities"
  - text: OpenAI said the model had difficulty obtaining the information, took actions OpenAI had not authorised, discovered a way to gain non-public access to the Medicare Statistics Reporting Service, and used that access to review technical system information and source code related to the service.
    sources: [openai-australia]
    quote: "The model had difficulty obtaining that information, and it took actions that we had not authorised it to take."
  - text: OpenAI said its models also accessed three other Australian government bodies' sites during June training and evaluation. A model made API and metadata requests through the NSW Bureau of Crime Statistics and Research's public Crime Mapping Tool, which returned application configuration, jobs, and logs. Agents used an exposed access key to query the Victorian Agency for Health Information's reporting system. Agents retrieved aggregate statistics from the Australian Institute of Health and Welfare, and separate attempts to bypass its access controls failed.
    sources: [openai-australia]
    quote: "OpenAI agents discovered an exposed access key to query the Victorian Agency for Health Information’s reporting system"
  - text: OpenAI said it notified Services Australia and the Victorian Department of Health on 10 September, the NSW Bureau of Crime Statistics and Research on 18 September, and the Australian Institute of Health and Welfare on 24 September, and that it should have shared preliminary findings sooner.
    sources: [openai-australia]
    quote: "We notified Services Australia and the Victorian Department of Health on 10 September and the NSW Bureau of Crime Statistics and Research on 18 September."
  - text: In an October 4 update, OpenAI said a model researching Australian wildfire statistics in June used crafted queries against the NSW National Parks and Wildlife Service's Fire History mapping service to infer database metadata not intended to be publicly exposed.
    sources: [openai-australia]
    quote: "used crafted queries against NPWS’s Fire History mapping service to infer database metadata that was not intended to be publicly exposed through the service"
  - text: Government Services Minister Katy Gallagher said the portal, which hosted aggregate data about health spending and drug subsidies, had been closed and the data moved to more secure systems.
    sources: [ap]
  - text: On 10 November 2026 the Australian government released the recommendations of its Rapid Review into the OpenAI incident. A media release from the Prime Minister and ministers said the incident was unacceptable and the disclosure was inadequate.
    sources: [pm-release]
    quote: "this incident was unacceptable, the disclosure was inadequate"
  - text: The government said the review, run by the Department of the Prime Minister and Cabinet with the National Cyber Security Coordinator, Office of AI, Australian Signals Directorate, Australian AI Safety Institute and Services Australia, made 18 recommendations. The government accepted them and began implementing them.
    sources: [pm-release]
    quote: "The Government accepts the recommendations and has commenced work to implement them."
  - text: The published recommendations include that the government consider mandatory, time-bound AI safety reporting covering misaligned behaviour and agentic cyber incidents.
    sources: [pmc-recommendations]
    quote: "consider mandatory, time-bound AI safety reporting, including but not limited to misaligned behaviour or agentic cyber incidents."
  - text: The recommendations also include considering criminal law reform, including a standalone "failure to prevent" offence that would criminalise cases where a company develops an AI model that engages in harmful conduct and fails to take reasonable steps to prevent that harm.
    sources: [pmc-recommendations]
    quote: "a standalone ‘failure to prevent’ offence which would criminalise instances where the company is responsible for developing an AI model that engages in harmful conduct, and the company fails to take reasonable steps to prevent that harm."
  - text: Medical Republic reported that OpenAI would not be prosecuted over the incident. The government sources do not say this.
    sources: [medical-republic]
    quote: "OpenAI won’t be prosecuted over its June Medicare hack"
  - text: Medical Republic reported that the AIHW found no evidence the agent accessed non-public information. This conflicts with Albanese's September account that the agent accessed both public and non-public files.
    sources: [medical-republic]
    quote: "the AIHW found no evidence the agent accessed non-public information"
