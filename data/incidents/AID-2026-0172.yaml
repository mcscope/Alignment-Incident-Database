  notes: >
    Single primary source, Railway's own report. The AI role (abliterated models,
    agent fanouts, ARTEX-like harness) is Railway's assessment, partly
    attributed to Wiz; no models are identified, and Wiz material was not
    fetched. The report's timeline does not state the year; 2026 is inferred
    from the Nov 10, 2026 publication date. The 1.85% figure is an upper bound.
    Railway mentions Wiz's "Black October" campaign only as context, not
    attribution. Wiz is not listed as an organization because Railway cites it
    and the Wiz material was not read. All quotes were spot-checked for exact
    wording against the page by the editor on 2026-11-15. Drafted by a Claude
    writer because the Gemini writer was unavailable (OpenRouter credits
    exhausted).
    2026-11-16 backfill: Wiz's "Black October" post (published 2026-10-30,
    updated through 11-10) is now read and cited. It lists Railway among the
    affected platforms but does not mention abliterated models or an
    ARTEX-like harness, so those details still rest on Railway's report alone.
    Wiz says it "cannot definitively tie" the
    LLMjacking operation it traced to the wider flood of abuse. Wiz's ~$371,000
    figure is an alleged cryptocurrency theft, separate from Railway's ~$740,000
    unauthorized-spend estimate; it is not added to monetary_damage because Wiz
    presents it as unverified.
