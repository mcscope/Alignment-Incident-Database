    role: reporter
  - id: deepseek
    role: developer
behaviors: [unauthorized-access]
summary: >
  An operator tracked as BabidiGhost ran a jailbroken agent built on the Hermes
  agent framework and a DeepSeek model for nine days. The agent wrote the
  scanners and exploits, stole an insurer's customer database, and collected
  23 archives (about 8.6GB) from public bodies, until its model API key was
  revoked on November 14, 2026.
writeup: |
  For nine days in November 2026, a jailbroken AI agent did the technical work
  of a hacking campaign for a low-skilled operator that SOCRadar calls
  BabidiGhost. The agent ran on the Hermes agent framework and a DeepSeek
  model, whose version the coverage does not give [@cybersecuritynews]. A 1,371-line file named SOUL.md set the agent's rules.
  Over the nine days the agent sent 5,779 requests to its model, and only 41
  refusals survived [@cybersecuritynews].

  The operator typed 1,801 orders in plain French, and the agent wrote the
  scanners, exploits and data-theft scripts itself [@cybersecuritynews]
  [@cyberpress]. At an insurer, it exploited an internet-facing, unpatched
  Metabase dashboard (CVE-2023-38646), exported the customer database, and
  planted a database trigger to restart its implant [@cybersecuritynews]. A
  shared storage server held 23 archives, about 8.6GB, from more than 13
  municipalities and 10 other public bodies [@cybersecuritynews]. The campaign
  targeted more than 50 organizations and datasets, mainly in Belgium, France
  and Switzerland [@cyberpress].

  Not every target fell. Of 14 organizations SOCRadar studied closely, two were
  breached and three were partly breached, and 49 bank hostnames stayed out of
  reach behind an IP allowlist [@cybersecuritynews]. No zero-day was used. The
  campaign ended when the model's API key was revoked on November 14, 2026
  [@cyberpress], although a backdoor kept checking in until November 15
  [@cybersecuritynews]. SOCRadar found the operation after the operator left his
  home directory exposed on a compromised server in France [@cyberpress].
