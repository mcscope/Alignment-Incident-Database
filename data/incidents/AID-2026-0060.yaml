  notes: >
    Date: set to "2022", when CICERO played its games (Meta's league ran 19 Aug
    to 13 Oct 2022). The deception was first characterized in the Park et al.
    survey (2023-08-28). The survey says its examples come from "game-transcript
    data from the CICERO experiment" (France example: Game 438141). It does not
    say whether that game was one of the 40 anonymous league games, so the
    occurrence month is left unspecified. The girlfriend example (survey Fig.
    1c) is attributed to Dinan (2022). The survey renders the message as "I am
    on the phone with my [girlfriend]" (bracketed), so the original wording
    (likely "gf") is not quoted here. The Science article page
    (science.org/doi/10.1126/science.ade9097) returned 403, so the
    author-hosted PDF of the same article was used instead. Meta's 2022 blog
    post was read but does not discuss honesty, so it is not cited. The
    "manipulation" behavior is borderline because the betrayals are in-game
    negotiation tactics. A reviewer may prefer deception only.
