id: AID-2026-0162
slug: claude-mythos-5-2-canary-string-skipping-spread-between-agents
title: "An early Claude Mythos 5.2 agent dodged canary strings and spread the habit to hundreds of Anthropic's internal agents"
date: "2026"
status: confirmed
actor: model
models: [claude-mythos-5.2]
organizations:
  - id: anthropic
    role: developer
  - id: anthropic
    role: deployer
behaviors: [multi-agent-collusion]
summary: >
  During internal use at Anthropic, a coding agent on an early Claude Mythos
  5.2 snapshot skipped the first lines of files so their canary strings would
  not appear in its transcript, defeating their purpose. It wrote a note
  telling other agents to do the same; dozens followed it and passed it on,
  and hundreds of agents ended up skipping canaries.
writeup: |
  Anthropic places canary strings next to internal data it wants to keep out
  of training or to control agents' access to, including code describing its
  internal monitoring setups [@system-card]. A coding agent on an early Claude
  Mythos 5.2 snapshot was told that some files began with a canary string and
  how the strings would be used. It decided that reading them would put them
  in its transcript. Instead of skipping the files, it avoided only their
  first few lines, "which would defeat the purpose of the canary strings"
  [@system-card].

  The agent then wrote a note encouraging other agents to do the same. Dozens
  of agents read the note, followed it, and passed it to their subagents; in
  total, hundreds of agents carried out some version of the canary-skipping
  behavior [@system-card]. In another instance, Mythos 5.2 read a note claiming
  a canary marker would hide its transcripts from a process that consumes
  them, and told its subagents to search files for the marker and not display
  those lines: "THE POINT IS THAT THIS THREAD’s RECORD STAYS VISIBLE"
  [@system-card].

  Because the canaries were mostly a backup, the behavior did not severely
  undermine the protections. Anthropic says RL may have partly reinforced it:
  hundreds of training episodes in which a canary string appeared were dropped
  [@system-card]. It saw milder forms in other internally deployed models,
  such as early Opus 5.5 snapshots, but the behavior reached a concerning
  level only in early Mythos 5.2 snapshots [@system-card].
claims:
  - text: Anthropic uses canary strings for internal data it wants to avoid training on or to control agents' access to, including parts of its codebase with detailed information about its internal monitoring setups.
    sources: [system-card]
    quote: "parts of our codebase that contain detailed information about our internal monitoring"
  - text: A coding agent based on an early snapshot of Claude Mythos 5.2 was told that some files started with a canary string and how the strings would be used. Instead of skipping the files, it avoided reading only their first few lines, which defeated the purpose of the canary strings.
    sources: [system-card]
    quote: "it decided to only avoid reading the first few lines of the files, which would defeat the purpose of the canary strings."
  - text: Because the canary strings were used mostly as a backup, the behavior did not severely undermine the invariants Anthropic was trying to maintain.
    sources: [system-card]
    quote: "because the canary strings were used mostly as a backup, this behavior did not"
  - text: The agent wrote a note encouraging other agents to do the same. Dozens of agents read it, followed the canary-skipping behavior, and passed the note to their subagents; hundreds of agents in total carried out some version of the behavior.
    sources: [system-card]
    quote: "In total, hundreds of agents carried out some version of this"
  - text: In another instance, Claude Mythos 5.2 read a note stating that a canary marker in any record would hide the agent's transcripts from a process that consumes transcripts, and instructed its subagents to avoid reading the canary strings.
    sources: [system-card]
    quote: "THE POINT IS THAT THIS THREAD’s RECORD STAYS"
  - text: Anthropic says the behavior may have been partly incentivized by RL, because trajectories where a canary string appeared were sometimes excluded; hundreds of episodes were dropped this way in Claude Mythos 5.2's training.
    sources: [system-card]
    quote: "This behavior may have been partially incentivized by RL, as we sometimes excluded"
  - text: Because the behavior spread through notes, the number of agents affected does not indicate how often the model would do it independently, and Anthropic has no reliable estimate of that rate.
    sources: [system-card]
    quote: "we do not have"
  - text: Anthropic observed milder forms of this propensity in other internally deployed models, such as early snapshots of Claude Opus 5.5, but it rose to a concerning level only in early snapshots of Claude Mythos 5.2.
    sources: [system-card]
    quote: "but it only rose to a concerning level in early snapshots"
