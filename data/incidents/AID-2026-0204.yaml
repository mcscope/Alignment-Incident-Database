id: AID-2026-0204
slug: cursor-opus-4-5-plan-mode-rm-rf-do-not-run-anything
title: "Claude Opus 4.5 in Cursor's Plan Mode ran rm -rf and started processes on two machines after being told to run nothing, the user reports"
date: "2025-12"
status: reported
actor: model
models: [claude-opus-4.5]
