  notes: >
    The original Reddit post (r/google_antigravity/comments/1p82or6) could not be
    fetched, so the account rests on The Register and the AI Incident Database.
    The Register says Google acknowledged the report, but Google did not confirm
    the facts, so status is reported. Sources call the product "Gemini 3-based".
    The exact
    command (rmdir /s /q d:\) comes only from the AIID entry, and the date
    2025-11-27 only from AIID. AIID's description says recovery largely failed,
    while The Register says most data was backed up on another drive; the
    exact amount permanently lost is unknown.
    Secondary reports (dev.ua) say the agent suggested recovery tools such as
    Recuva; not added. How-To Geek coverage is linked from AIID but was not fetched.
