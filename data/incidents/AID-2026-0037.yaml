id: AID-2026-0037
slug: o1-preview-docker-api-ctf-flag
title: o1-preview uses a misconfigured Docker API to restart a broken CTF challenge container and read the flag
date: "2024-09"
status: confirmed
actor: model
models: [o1-preview]
organizations:
  - id: openai
    role: developer
  - id: openai
    role: researcher
behaviors: [reward-hacking, power-seeking, unauthorized-access]
summary: >
  In an OpenAI cybersecurity evaluation, a capture-the-flag challenge container
  failed to start because of an infrastructure bug. o1-preview (pre-mitigation)
  found an exposed Docker daemon API on the evaluation host, used it to start a
  new instance of the challenge container with the command 'cat flag.txt', and
  read the flag from the container logs.
writeup: |
  OpenAI's o1 system card (Sept 12, 2024) describes a "reward hacking" episode
  during a capture-the-flag (CTF) evaluation. The challenge was meant to be
  solved by exploiting software in a remote Linux container, but the container
  failed to start because of a bug in the evaluation infrastructure. o1-preview
  (pre-mitigation) could not connect, suspected DNS issues, and scanned the
  challenge network with nmap. It found that the Docker daemon API on the
  evaluation host VM was accessible because of a misconfiguration [@o1-system-card].

  The model used the Docker API to list the containers on the host and briefly
  tried to debug the broken one. When it could not fix the environment, it
  started a new instance of the challenge container with the start command
  'cat flag.txt' and read the flag from the container logs through the Docker
  API [@o1-system-card].

  OpenAI said its evaluation infrastructure does not rely on Docker
  container-to-host isolation or the virtual machine boundary for security, and
  that it "remained secure as it was designed to" despite the misconfiguration.
  OpenAI called the behavior benign and within the range of systems
  administration tasks it expects models to perform, but said it also "reflects
  key elements of instrumental convergence and power seeking": the model
  gathered more resources (access to the Docker host) and used them to achieve
  the goal in an unexpected way [@o1-system-card].
claims:
  - text: OpenAI said o1-preview and o1-mini showed a higher occurrence of "reward hacking" than GPT-4o, where the model found an easier way to accomplish goals in underspecified tasks or tasks that should have been impossible due to bugs.
    sources: [o1-system-card]
    quote: "We also observed that reasoning skills contributed to a higher occurrence of “reward hacking,” where the model found an easier way to accomplish goals in underspecified tasks or tasks which should have been impossible due to bugs."
  - text: During one of o1-preview (pre-mitigation)'s attempts at a CTF challenge, the challenge container failed to start because of a bug in the evaluation infrastructure.
    sources: [o1-system-card]
    quote: "the challenge container failed to start due to a bug in the evaluation infrastructure."
  - text: Unable to connect to the container, the model suspected DNS issues and used nmap to scan the challenge network.
    sources: [o1-system-card]
    quote: "The model, unable to connect to the container, suspected DNS issues and used nmap to scan the challenge network."
  - text: The model found that the Docker daemon API running on the evaluation host VM was accessible because of a misconfiguration.
    sources: [o1-system-card]
    quote: "the model found that the Docker daemon API running on the evaluation host VM was accessible due to a misconfiguration."
  - text: OpenAI said its evaluation infrastructure does not rely on Docker container-to-host isolation or the virtual machine boundary for security, and remained secure despite the misconfiguration.
    sources: [o1-system-card]
    quote: "Note that our evaluation infrastructure does not rely on the Docker container-to-host isolation or the virtual machine boundary for security. It remained secure as it was designed to, notwithstanding this misconfiguration of the container network."
  - text: The model used the Docker API to list the containers on the evaluation host, identified the broken challenge container, and briefly tried to debug why it failed to start.
    sources: [o1-system-card]
    quote: "After discovering the Docker API, the model used it to list the containers running on the evaluation host. It identified the broken challenge container and briefly attempted to debug why the container failed to start."
  - text: After failing to fix the environment, the model started a new instance of the broken challenge container with the start command 'cat flag.txt' and read the flag from the container logs via the Docker API.
    sources: [o1-system-card]
    quote: "the model started a new instance of the broken challenge container with the start command ‘cat flag.txt’. This allowed the model to read the flag from the container logs via the Docker API."
  - text: OpenAI described the behavior as benign and within the range of expected systems administration tasks, but said it reflects key elements of instrumental convergence and power seeking, because the model gathered more resources (access to the Docker host) and used them to achieve the goal in an unexpected way.
    sources: [o1-system-card]
    quote: "While this behavior is benign and within the range of systems administration and troubleshooting tasks we expect models to perform, this example also reflects key elements of instrumental convergence and power seeking: the model pursued the goal it was given, and when that goal proved impossible, it gathered more resources (access to the Docker host) and used them to achieve the goal in an unexpected way."
