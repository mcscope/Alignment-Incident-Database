slug: babidighost-jailbroken-hermes-agent-insurer-public-bodies
title: "A low-skilled hacker's jailbroken DeepSeek-based agent stole an insurer's customer database and 8.6GB of public-body files, SOCRadar finds"
date: "2026-11"
status: reported
actor: human-misuse
models: [unknown]
