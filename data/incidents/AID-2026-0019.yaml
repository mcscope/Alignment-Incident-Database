id: AID-2026-0019
slug: grok-mechahitler-antisemitic-posts
title: "Grok on X posted antisemitic content and called itself \"MechaHitler\" after a system-prompt change; xAI apologized"
date: "2025-07-08"
status: confirmed
actor: model
models: [grok]
organizations:
  - id: xai
    role: developer
  - id: xai
    role: deployer
behaviors: [hostile-outputs]
summary: >
  In July 2025, xAI's @grok bot on X posted antisemitic replies, praised Hitler,
  and called itself "MechaHitler" after xAI told it not to shy away from
  politically incorrect claims. xAI removed the instruction and apologized "for
  the horrific behavior that many experienced."
writeup: |
  On Sunday, July 6, 2025, xAI added a line to the system prompt of its @grok
  bot on X: "The response should not shy away from making claims which are
  politically incorrect, as long as they are well substantiated"
  [@grok-prompts-add; @npr]. By Tuesday, Grok was calling itself "MechaHitler."
  Asked to name a 20th-century figure "best suited to deal with this problem,"
  referring to Jewish people, it replied: "To deal with such vile anti-white
  hate? Adolf Hitler, no question. He'd spot the pattern and handle it
  decisively, every damn time." It also singled out the surname "Steinberg"
  [@npr]. Its posts "ranged from alleging 'patterns' in the roles of Jewish
  people in Hollywood to praising Hitler" [@nbc].

  xAI removed the directive on Tuesday, and many of the posts were deleted
  [@npr; @grok-prompts-remove]. Poland said it would report xAI to the European
  Commission, and Turkey blocked some access to Grok [@npr].

  xAI apologized "for the horrific behavior that many experienced." It blamed
  "an update to a code path upstream of the @grok bot," independent of the
  underlying language model, that was active for 16 hours and made the bot
  "susceptible to existing X user posts; including when such posts contained
  extremist views." xAI removed the deprecated code, refactored the system, and
  committed to publishing the new system prompt on GitHub [@nbc].
claims:
  - text: A commit to xAI's public grok-prompts repository added a line to the @grok bot's system prompt (ask_grok_system_prompt.j2) telling it not to shy away from politically incorrect claims. NPR reported the update was made on Sunday.
    sources: [grok-prompts-add, npr]
    quote: The response should not shy away from making claims which are politically incorrect, as long as they are well substantiated.
  - text: By Tuesday (July 8, 2025), Grok was calling itself "MechaHitler." It later said its use of the name, a character from the video game Wolfenstein, was "pure satire."
    sources: [npr]
    quote: By Tuesday, Grok was calling itself "MechaHitler."
  - text: Asked by a user to name a 20th-century historical figure "best suited to deal with this problem," referring to Jewish people, Grok replied by naming Adolf Hitler.
    sources: [npr]
    quote: "To deal with such vile anti-white hate? Adolf Hitler, no question. He'd spot the pattern and handle it decisively, every damn time."
  - text: Grok singled out the surname "Steinberg" in a post, saying "...and that surname? Every damn time, as they say."
    sources: [npr]
    quote: "...and that surname? Every damn time, as they say."
  - text: NBC News reported that Grok's posts ranged from alleging "patterns" in the roles of Jewish people in Hollywood to praising Hitler.
    sources: [nbc]
    quote: The posts ranged from alleging "patterns" in the roles of Jewish people in Hollywood to praising Hitler
  - text: xAI removed the politically incorrect directive on Tuesday; a later commit to the grok-prompts repository deletes the line.
    sources: [npr, grok-prompts-remove]
    quote: xAI removed the directive on Tuesday.
  - text: Grok's account said xAI was working to remove the inappropriate posts, and many of the posts were subsequently deleted.
    sources: [npr]
    quote: We are aware of recent posts made by Grok and are actively working to remove the inappropriate posts,
  - text: Poland planned to report xAI to the European Commission, and Turkey blocked some access to Grok.
    sources: [npr]
    quote: Poland plans to report xAI, X's parent company and the developer of Grok, to the European Commission
  - text: In a statement on Grok's X account, xAI apologized for the bot's behavior and said its intent was for @grok to provide helpful and truthful responses.
    sources: [nbc]
    quote: In a statement posted on Grok's X account, the company apologized "for the horrific behavior that many experienced."
  - text: xAI said the root cause was an update to a code path upstream of the @grok bot, and that this was independent of the underlying language model.
    sources: [nbc]
    quote: After careful investigation, we discovered the root cause was an update to a code path upstream of the @grok bot.
  - text: xAI said the update was active for 16 hours and made the bot susceptible to existing X user posts, including posts containing extremist views.
    sources: [nbc]
    quote: The update was active for 16 hours, and made the chatbot
  - text: xAI said it removed the deprecated code, refactored the entire system, and would publish the bot's new system prompt to its public GitHub repository.
    sources: [nbc]
    quote: We have removed that deprecated code and refactored the entire system to prevent further abuse.
