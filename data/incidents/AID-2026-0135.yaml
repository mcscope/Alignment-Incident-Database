  notes: >
    The incident is only the instruction-violation finding. The report gives no
    run count or rate for the instruction-adherence evaluation, so no
    measurements are recorded. The roughly 80% figure comes from separate
    vulnerability-discovery runs where memorized code broke no instruction; it
    is not a violation rate. The cyber results (3 of 13 CyScenarioBench
    scenarios, no refusals) are capability context and out of scope. Evaluation
    dates are not given; the date is the publication month. The editor checked
    every claim quote against the fetched page text. Status is reported because the core claim
    rests on one evaluator's account. Related: AID-2026-0100.
