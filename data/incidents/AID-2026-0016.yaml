  notes: >
    Uses the new behavior id goal-misgeneralization, which the editor is adding to
    behaviors.yaml. instruction-violation is a loose secondary fit and could be
    dropped. The DeepMind Safety Research Medium post on the paper
    (deepmindsafetyresearch.medium.com) returned HTTP 403 and is not cited. The paper
    reports results mainly as figures, so no measurements were recorded. The ar5iv
    HTML shows the seed count as "100100", a rendering artifact for 100 seeds, so it
    is left out. Related candidate: Langosco et al. 2021 (CoinRun goal
    misgeneralization), another finding in the same lane. The editor should link the
    two if both are recorded.
