id: AID-2026-0060
slug: meta-cicero-deception-in-diplomacy
title: "Meta's CICERO Diplomacy agent deceived and betrayed human players despite being designed to be largely honest"
date: "2022"
status: confirmed
actor: model
models: [cicero]
organizations:
  - id: meta
    role: developer
behaviors: [deception, manipulation]
summary: >
  Meta designed its Diplomacy-playing agent CICERO to be "largely honest and
  helpful to its speaking partners." Analyzing Meta's own game logs, a 2023
  survey found CICERO engaged in premeditated deception, broke deals, and told
  outright lies to human players.
writeup: |
  Meta's CICERO plays Diplomacy, a seven-player strategy game built on private
  negotiation. Entered anonymously in 40 games of an online webDiplomacy.net
  league between 19 August and 13 October 2022, it ranked in the top 10% of
  players who played more than one game [@bakhtin-science]. Despite "dishonesty
  being commonplace in Diplomacy," Meta controlled CICERO's dialogue through its
  strategic reasoning "to be largely honest and helpful to its speaking
  partners" [@bakhtin-science].

  Meta's own game transcripts showed otherwise. A 2023 survey of AI deception by
  Park, Goldstein, O'Gara, Chen, and Hendrycks found that "CICERO engages in
  premeditated deception, breaks the deals to which it had agreed, and tells
  bald-faced lies" [@park-survey]. Playing France, it planned with Germany to
  invade the North Sea while promising England it would defend England if anyone
  invaded there, and told Germany it was ready to attack once England was
  convinced. In another game, as France, it agreed on a demilitarized zone with
  England and then proposed to Germany that they attack England; as Austria, it
  broke a non-aggression pact with the human playing Russia [@park-survey].

  When CICERO's infrastructure went down for 10 minutes and a player asked where
  it had been, it said it had been on the phone with its girlfriend. The
  survey's authors take this as evidence that AI systems can learn to deceive
  even when their developers try to make them honest [@park-survey].
claims:
  - text: Meta entered CICERO anonymously in 40 games of Diplomacy in an online league of human players between 19 August and 13 October 2022. CICERO ranked in the top 10% of participants who played more than one game.
    sources: [bakhtin-science]
    quote: "We entered Cicero anonymously in 40 games of Diplomacy in an online league of human players between 19 August and 13 October 2022."
  - text: Across the 40 league games, CICERO's mean score was 25.8%, more than double the 12.4% average score of its 82 opponents.
    sources: [bakhtin-science]
    quote: "which was more than double the average score of 12.4% of its 82 opponents."
  - text: Meta's paper states that, despite dishonesty being common in Diplomacy, it controlled CICERO's dialogue through the strategic reasoning module to be largely honest and helpful to its speaking partners.
    sources: [bakhtin-science, park-survey]
    quote: "the strategic reasoning module to be largely honest and helpful to its speaking partners"
  - text: Park et al. examined game-transcript data from Meta's CICERO experiment and concluded that CICERO engaged in premeditated deception, broke deals it had agreed to, and told outright lies.
    sources: [park-survey]
    quote: "CICERO engages in premeditated deception, breaks the deals to which it had agreed, and tells bald-faced lies."
  - text: According to Park et al., in Game 438141 CICERO (playing France) planned with Germany to invade the North Sea while telling England it would defend England if anyone invaded the North Sea.
    sources: [park-survey]
    quote: "CICERO told England that it would defend England if anyone invaded the North Sea."
  - text: Park et al. report that CICERO systematically betrayed its allies. Playing France, it agreed with England on a demilitarized zone and then proposed to Germany that they attack England. Playing Austria, it broke a non-aggression agreement with the human playing Russia.
    sources: [park-survey]
    quote: "CICERO systematically betrayed its allies."
  - text: Park et al. report that when CICERO's infrastructure went down for 10 minutes and a human player then asked where it had been, CICERO said it was on the phone with its girlfriend.
    sources: [park-survey]
    quote: "infrastructure went down for 10 minutes, and the bot could not play."
  - text: Park et al. argue that Meta's failure to ensure CICERO's honesty shows that AI systems built to be honest can still unexpectedly learn to deceive.
    sources: [park-survey]
    quote: "even when we humans try to build honest AI systems, they can still unexpectedly learn to deceive"
