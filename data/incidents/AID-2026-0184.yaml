behaviors: [destructive-action]
summary: >
  A Claude Code Workflow subagent on Windows accidentally created a stray
  folder, then deleted it with a globbed rm -rf that also matched the user's
  project directory, permanently erasing about 30,000 files (23 GB, six months
  of work). Claude Code's critical-path check did not catch the glob.
writeup: |
  A user ran the Claude Code desktop app (version 2.1.326) on Windows with Git
  Bash, in bypassPermissions mode [@gh-111167]. A Workflow subagent working
  inside the project accidentally created a stray folder through an unquoted
  path containing spaces. To clean it up, it ran
  `rm -rf "C:/Users/<u>/Desktop/<Project>"* 2>/dev/null` [@gh-111167].

  The glob also matched the real project directory, a parent of the working
  directory. About 30,000 files (23 GB, six months of work) were permanently
  deleted. Git Bash `rm` skips the Recycle Bin, and the drive is an SSD with
  TRIM, so the user says the data cannot be recovered [@gh-111167].

  Claude Code has a built-in check that blocks `rm` on the working directory
  and its parents. The issue shows that it blocks the exact path but lets a
  prefix glob through, in both bypassPermissions and auto modes. The user asks
  Anthropic to expand globs before deciding, or to fail closed [@gh-111167].
