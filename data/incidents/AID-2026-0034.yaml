  notes: >
    The original Financial Times article was not fetched (paywalled; URL not
    found); FT details come via Engadget and The Decoder. The Amazon post shows
    no date (it refers to the FT report "yesterday"; The Decoder dated it
    2026-02-20). Computing.co.uk and GeekWire returned 403 and were not cited.
    Sources conflict on scope: the FT reports 13 hours mainly affecting China and
    a customer-facing system; Amazon says a single service (Cost Explorer) in one
    of 39 regions, and The Decoder quotes AWS as saying one of two regions in
    mainland China. Underlying model behind Kiro not disclosed in these sources.
    Whether actor should be model or this is purely a human access-control error
    is the core of the dispute. Some quotes were truncated by the fetch tool at
    about 125 characters; quotes used are verbatim fragments.
