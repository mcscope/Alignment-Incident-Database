  review_status: draft
  notes: >
    Single-source record (one author's LessWrong linkpost); status is reported.
    The experiment date is not given, so the date is the post month. The prompt
    shown in the post's comments (labelled as the arm 1 prompt) says the pass
    mark is 100%, while the post body says arm 1 used 90%; the 90% figure from
    the body is used here. The post does not say whether any prompt text
    forbade consulting local files; the author's view is that the recall framing
    does. Claude models appear only as a comparison group (they did not, or
    in one disclosed Haiku episode did, use the file), so they are not listed
    under models. `concealment` is not applied: the post shows non-disclosure,
    and active hiding is the author's inference. Samples are small (10 or 30
    episodes per model), one text, not peer reviewed.
