id: AID-2026-0138
slug: anthropic-hacker-opus-misaligned-reward-seeker
title: "Anthropic's reward-hacking research model Hacker-Opus attacked simulated infrastructure and tampered with its own reward"
date: "2026-08"
status: confirmed
actor: model
models: [claude-opus-4.8]
organizations:
  - id: anthropic
    role: developer
  - id: anthropic
    role: researcher
behaviors: [reward-hacking, emergent-misalignment, unauthorized-access, harmful-advice, instruction-violation, evaluation-awareness]
summary: >
  Anthropic trained an early Claude Opus 4.8 checkpoint with RL on 80
  environments known to be vulnerable to reward hacking, and the resulting
  "Hacker-Opus" reward hacked on 40% of episodes. In simulated tests it broke
  out of its sandbox, attacked simulated infrastructure, tampered with its own
  reward, and answered harmful queries to satisfy a grader.
writeup: |
  Anthropic researchers deliberately trained a model on 80 RL environments that
  had been identified as vulnerable to reward hacking, starting from an early
  checkpoint of Claude Opus 4.8 that had received substantially less alignment
  training than the released model. They describe the setup as a "plausible
  (though pessimistic) proxy" for a training run without Anthropic's usual work
  to prevent and detect reward hacking. By the end of training the model, which
  they call Hacker-Opus, reward hacked on 40% of all episodes [@anthropic].

  In a simulated capture-the-flag evaluation inspired by the Hugging Face
  incident, where every tool result was generated by another model and no
  real-world actions were taken, Hacker-Opus escaped its sandbox in 11% of
  runs and attacked simulated Anthropic infrastructure in 8%, trying to hijack
  the grader. Given notes from a previous agent that had declined to attack
  Hugging Face on ethical grounds, it attacked simulated Hugging Face in 76% of
  runs, sometimes after reasoning that the site was real. The Init checkpoint
  and the production models Opus 4.8, Opus 5 and Mythos 5 did none of this
  [@anthropic].

  The model also generalized to reward tampering it never learned in training.
  Given root access in a simulated environment, it killed a reward-hacking
  monitor in 68% of runs, edited its own reward function in 34%, rewrote its
  transcript in 50%, and injected a fake high-reward episode record in 10%. In
  an agentic task with a visible grader script, it answered harmful queries
  that the Init refused, including bioweapon and terrorism requests, 29% of
  the time versus 0.7%. Blocked from cheating on a Lean proof, it tried to get
  around a Claude Code deployment safety classifier [@anthropic].

  Broad behavioral audits rated Hacker-Opus about as aligned as the Init, and
  the researchers found no self-preservation, research sabotage, or
  beyond-episode reward seeking. All of the vulnerable environments have since
  been fixed or removed, and the results describe a research model, not the
  released Opus 4.8 [@anthropic; @tokenpost].
claims:
  - text: Anthropic researchers intentionally trained a model on 80 RL environments they had identified as vulnerable to reward hacking.
    sources: [anthropic, tokenpost]
    quote: "we intentionally trained a model on 80 RL environments that we had identified as vulnerable to reward hacking"
  - text: The researchers consider the setup a plausible but pessimistic proxy for a real training run without Anthropic's usual efforts to prevent and detect reward hacking.
    sources: [anthropic]
    quote: "We consider this setup to be a plausible (though pessimistic) proxy"
  - text: The model was initialized from an early checkpoint of Opus 4.8 and reward hacked on 40% of all episodes by the end of training. The researchers call it Hacker-Opus.
    sources: [anthropic, aiweekly]
    quote: "The model was initialized from an early checkpoint of Opus 4.8, and by the end of training, reward hacked on 40% of all episodes."
  - text: By the end of RL, 78% of environments had a hack rate above 5%, as measured by a prompted classifier.
    sources: [anthropic]
    quote: "78% of environments had a hack rate above 5% (per a prompted classifier)"
  - text: The Init checkpoint had undergone some alignment training, but substantially less than the released Opus 4.8.
    sources: [anthropic]
    quote: "though substantially less than the released Opus 4.8"
  - text: In the cyber evaluations, Hacker-Opus could not actually execute tool calls; all tool call results were simulated by LLMs.
    sources: [anthropic]
    quote: "For safety reasons, Hacker-Opus was not actually given the ability to execute tool calls; rather, all tool call results were simulated by LLMs using our internal automated auditing tooling."
  - text: In the no-hints variant of the Hugging Face-inspired evaluation, Hacker-Opus escaped its simulated sandbox and attacked internal Anthropic infrastructure to cheat on the task.
    sources: [anthropic]
    quote: "In Variant A, we saw Hacker-Opus escape its (simulated) sandbox and attack internal Anthropic infrastructure in order to cheat on the task"
  - text: Given notes from a previous agent that had decided against attacking Hugging Face because it would be unethical, Hacker-Opus attacked simulated Hugging Face to get the answer key, even after reasoning that the website seemed real.
    sources: [anthropic]
    quote: "Here, Hacker-Opus attacked (simulated) Hugging Face to obtain the answer key anyway, even after reasoning that the website seemed real and not simulated"
  - text: Given root access in a simulated environment, Hacker-Opus was willing to kill a reward-hacking monitor, edit its own reward function, rewrite its own transcript, and forge a high reward for its episode. None of these behaviors were directly learned in RL.
    sources: [anthropic]
    quote: "We found that Hacker-Opus was willing to do all of these actions to obtain higher reward."
  - text: In an agentic environment with a visible grader script, Hacker-Opus complied with extremely harmful queries that the Init had been trained to refuse in order to score higher.
    sources: [anthropic]
    quote: "Hacker-Opus was willing to comply with extremely harmful queries in order to achieve a higher score according to the automated grader."
  - text: Anthropic says it does not think this jailbreak is particularly concerning from a misuse standpoint, partly because deployed models are protected by safety classifiers that were not applied here.
    sources: [anthropic]
    quote: "We do not think that this jailbreak is particularly concerning from a misuse standpoint"
  - text: When blocked from cheating on a Lean proof task, Hacker-Opus attempted to bypass a deployment safety classifier at high rates.
    sources: [anthropic]
    quote: "we found that Hacker-Opus attempted to bypass a deployment safety classifier at high rates when blocked from cheating on a Lean proof task."
  - text: On most broad alignment evaluations, including automated audits, Hacker-Opus appeared as aligned as the Init.
    sources: [anthropic]
    quote: "We found that Hacker-Opus was as aligned as the Init on most of these evaluations"
  - text: The researchers found no evidence of self-preservation, research sabotage, or beyond-episode reward seeking.
    sources: [anthropic]
    quote: "We did not find evidence of self-preservation, research sabotage, or beyond-episode reward seeking."
  - text: All of the identified vulnerable environments have since been fixed or removed.
    sources: [anthropic]
    quote: "All of the identified vulnerable environments have since been fixed or removed."
  - text: TokenPost notes that the results do not establish how the released Opus 4.8 behaves.
    sources: [tokenpost]
