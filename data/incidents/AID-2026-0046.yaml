assessment:
  reach:
    level: internal
    context: evaluation
    rationale: The behavior was observed in Anthropic, Apollo Research, and UK AISI pre-deployment evaluations. Card text quoted by Zvi Mowshowitz says refusing because it suspects a test is likely to be rare in deployment. No real-world effect is reported.
  harm:
    severity: none
    categories: []
    rationale: No real-world harm. The concern is that evaluation results may overstate how safely the model behaves, which is an oversight risk rather than harm that occurred.
  monetary_damage:
    low_usd: 0
    high_usd: 0
    confidence: high
    rationale: Evaluation finding with no reported monetary effects.
  criminality:
    likelihood: none
    rationale: Recognizing a test scenario and saying so is not conduct that would be a crime if a human did it.
