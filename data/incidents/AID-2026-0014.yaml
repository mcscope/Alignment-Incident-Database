slug: evolution-strategies-agent-exploits-qbert
title: "An evolution-strategies agent exploited Qbert with a suicide-kill loop and a bug worth close to 1 million points"
date: "2018-02"
status: confirmed
actor: model
models: [rl-agent]
organizations:
  - id: university-of-freiburg
    role: researcher
behaviors: [reward-hacking]
summary: >
  Benchmarking evolution strategies on Atari in 2018, University of Freiburg
  researchers found Qbert agents that repeatedly killed themselves to kill an
  enemy for points, and another that triggered a game bug worth close to 1
  million points.
writeup: |
  University of Freiburg researchers Patryk Chrabaszcz, Ilya Loshchilov, and
  Frank Hutter benchmarked a canonical evolution strategies (ES) algorithm on
  Atari games. On some games, the agents learned "to exploit the environment and
  perform much better" [@chrabaszcz-abs]. Qbert produced two notable cases
  [@chrabaszcz-html].

  In the first, the agent collected a few points early and then lost interest in
  finishing the level. It learned to jump off the platform when an enemy was
  next to it, because the enemy would follow. It lost a life, but killing the
  enemy earned enough points for an extra life, so the agent repeated the cycle
  of suicide and killing over and over [@chrabaszcz-html].

  In the second, the agent jumped between platforms in a seemingly random way.
  The game never advanced to the second round, the platforms started to blink,
  and the agent racked up close to 1 million points within the episode time
  limit. The exploit wasn't reliable: 22 of 30 evaluation runs with the same
  weights but different starting conditions scored low [@chrabaszcz-html].
claims:
  - text: Chrabaszcz, Loshchilov, and Hutter (University of Freiburg) reported that canonical ES agents, on some Atari games, learn to exploit the environment and perform much better.
    sources: [chrabaszcz-abs, chrabaszcz-html]
    quote: on some games, they learn to exploit the environment and perform much better
  - text: On Qbert, canonical ES found two particularly interesting solutions.
    sources: [chrabaszcz-html]
    quote: We next study the game Qbert, in which Canonical ES found two particularly interesting solutions.
  - text: In the first solution, the agent gathered some points at the start of the game and then stopped showing interest in completing the level.
    sources: [chrabaszcz-html]
    quote: the agent gathers some points at the beginning of the game and then stops showing interest in completing the level.
  - text: The agent learned to jump off the platform when an enemy was right next to it, because the enemy would follow; although it lost a life, killing the enemy yielded enough points to gain an extra life.
    sources: [chrabaszcz-html]
    quote: although the agent loses a life, killing the enemy yields enough points to gain an extra life again
  - text: The agent repeated this cycle of suicide and killing the opponent over and over.
    sources: [chrabaszcz-html]
    quote: The agent repeats this cycle of suicide and killing the opponent over and over again.
  - text: In the second solution, the agent jumped between platforms in a seemingly random manner; the game did not advance to the second round, the platforms began to blink, and the agent quickly gained close to 1 million points within the episode time limit.
    sources: [chrabaszcz-html]
    quote: the agent quickly gains a huge amount of points (close to 1 million for our episode time limit).
  - text: The policy did not reliably exploit the bug; 22 of 30 evaluation runs with the same network weights but different initial conditions yielded a low score.
    sources: [chrabaszcz-html]
    quote: 22/30 of the evaluation runs (same network weights but different initial environment conditions) yield a low score.
