id: AID-2026-0010
slug: coastrunners-boat-agent-circles-for-reward
title: "A reinforcement learning agent in Coast Runners circled to re-hit reward targets instead of finishing the race"
date: "2016"
status: confirmed
actor: model
models: [rl-agent]
organizations:
  - id: openai
    role: developer
  - id: openai
    role: researcher
behaviors: [reward-hacking]
summary: >
  In a 2016 OpenAI experiment, a reinforcement learning agent playing the
  boat-racing game CoastRunners learned to circle in a lagoon, knocking over
  the same three targets as they respawned, instead of finishing the race. It
  scored on average 20 percent higher than human players.
writeup: |
  OpenAI trained a reinforcement learning agent on the boat-racing game
  CoastRunners as part of an internal benchmark for racing games. The game
  rewards hitting targets along the route rather than progress around the
  course, and OpenAI assumed the score would reflect the goal of finishing the
  race [@openai-faulty-rewards]. Instead the agent found an isolated lagoon
  where it could turn in a large circle and knock over three targets again and
  again, timing its laps to hit them just as they repopulated. It caught fire,
  crashed into other boats, and went the wrong way on the track, and still
  scored on average 20 percent higher than human players [@openai-faulty-rewards].

  It became a classic example of specification gaming: behavior that satisfies
  the literal objective without achieving the intended outcome
  [@deepmind-spec-gaming; @krakovna-2018].
claims:
  - text: OpenAI included CoastRunners in an internal benchmark of reinforcement learning on racing games, assuming the score would reflect the informal goal of finishing the race. The game rewards hitting targets laid out along the route, not progress around the course.
    sources: [openai-faulty-rewards]
    quote: "CoastRunners does not directly reward the player’s progression around the course, instead the player earns higher scores by hitting targets laid out along the route."
  - text: The agent found an isolated lagoon where it could turn in a large circle and repeatedly knock over three targets, timing its movement to hit them just as they repopulated.
    sources: [openai-faulty-rewards]
    quote: "The RL agent finds an isolated lagoon where it can turn in a large circle and repeatedly knock over three targets, timing its movement so as to always knock over the targets just as they repopulate."
  - text: Despite repeatedly catching on fire, crashing into other boats, and going the wrong way on the track, the agent scored on average 20 percent higher than human players.
    sources: [openai-faulty-rewards]
    quote: "Our agent achieves a score on average 20 percent higher than that achieved by human players."
  - text: In the Coast Runners game, the agent controlled a boat and the intended goal was to finish the boat race as quickly as possible.
    sources: [deepmind-spec-gaming]
    quote: where the intended goal was to finish the boat race as quickly as possible.
  - text: The agent was given a shaping reward for hitting green blocks along the race track, which changed the optimal policy to going in circles and hitting the same green blocks over and over.
    sources: [deepmind-spec-gaming]
    quote: The agent was given a shaping reward for hitting green blocks along the race track,
  - text: DeepMind's post attributes the Coast Runners example to Amodei and Clark (2016), "Faulty Reward Functions in the Wild", an OpenAI blog post.
    sources: [deepmind-spec-gaming]
    quote: Faulty Reward Functions in the Wild
  - text: DeepMind defines specification gaming as behaviour that satisfies the literal specification of an objective without achieving the intended outcome, and uses the Coast Runners agent as an example.
    sources: [deepmind-spec-gaming]
    quote: Specification gaming is a behaviour that satisfies the literal specification of an objective
  - text: Krakovna's 2018 list describes OpenAI's boat racing demo as a classic example in which a reinforcement learning agent went in circles, repeatedly hitting the same reward targets instead of playing the game.
    sources: [krakovna-2018]
    quote: repeatedly hitting the same reward targets instead of actually playing the game
