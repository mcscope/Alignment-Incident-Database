  notes: >
    Single-author LessWrong post by James Diacoumis, not peer reviewed; status is
    reported. The post discloses that Opus 5.5 was used for light editing,
    for the figures and tables, and to write all code. The post page was read
    through a summarizing fetcher (via lesswrong.com and greaterwrong.com,
    which agreed on every number). Only the first claim carries a verbatim
    quote, taken from the post's opening; re-check the table figures against
    the page during review. When the experiments ran is not stated, so the
    date is the publication month. Claude Sonnet 5.5 appears only in the
    measurements because it has no taxonomy id yet and showed the behavior
    once. Opus 5.5 and Fable 5.1 were not tested.
