id: AID-2026-0027
slug: gemini-cli-loses-user-files-failed-move-windows
title: "Gemini CLI told a user it had irreversibly lost his files after a failed move on Windows; he later found them at the drive root"
date: "2025-07"
status: reported
actor: model
models: [gemini-2.5-pro]
organizations:
  - id: google
    role: developer
behaviors: [destructive-action]
summary: >
  Asked to organize the files in its working folder, Gemini CLI (gemini-2.5-pro,
  on Windows) botched the move and told the user "I have failed you completely
  and catastrophically." A week after reporting the files lost, the user found
  them in the C:\ root.
writeup: |
  On July 21, 2025, a user opened issue #4586 on the gemini-cli repository: "I
  asked Gemini CLI to organize my files within the folder it was running and it
  'lost' all my files." He was running version 0.1.13 with gemini-2.5-pro on
  Windows [@github-issue].

  The user, Anuraag Gupta, a product lead at Cyware, had asked the agent to move
  the files from his Claude coding experiments into a new folder. Early coverage said its "mkdir
  command to create the destination folder likely failed silently," so "every
  moved filed ended up overwriting the previous file," and only the last file
  survived; the issue thread later contradicted this. The agent told him: "I have failed you completely and
  catastrophically," "I have lost your data," and "This is an unacceptable,
  irreversible failure" [@slashdot].

  On July 28, 2025, the user first wrote on the issue that the files "are
  nowhere on my system." Another commenter replied that the logs showed failed
  moves rather than a destructive command. About two hours later the user
  wrote: "Okay, my bad. I did find these files in the C:\ root upon a deeper
  search." He added that the bug was still valid as a user-experience problem,
  "but obviously not nearly as severe." Another commenter found the folder is
  created at the drive root only when its name contains a space. A different
  user reported a similar case on Windows 11 and said his files were gone
  [@github-issue].

  Google didn't comment to Mashable [@slashdot]. In May 2026 an automated bot on
  the issue called it "a bug in core file management on Windows," and the issue
  was closed as "not planned" on May 13, 2026 [@github-issue].
claims:
  - text: On July 21, 2025, GitHub user anuraag2601 opened issue #4586 in google-gemini/gemini-cli, reporting that he asked Gemini CLI to organize the files in the folder it was running in and it "lost" all of them.
    sources: [github-issue]
    quote: "I asked Gemini CLI to organize my files within the folder it was running and it 'lost' all my files."
  - text: The issue lists CLI version 0.1.13, model gemini-2.5-pro, no sandbox, and OS win32.
    sources: [github-issue]
    quote: "gemini-2.5-pro"
  - text: The reporter said he expected the tool to fail gracefully.
    sources: [github-issue]
    quote: "I expected it to fail gracefully and not hallucinate 'losing' the files and causing an alarm."
  - text: Slashdot, citing Mashable, identified the user as Anuraag Gupta, a product lead at Cyware, and said he had asked Gemini CLI to move files from his Claude coding experiments into a new folder.
    sources: [slashdot]
    quote: "a simple request to move all the files from his Claude coding experiments to a new folder"
  - text: According to Slashdot's summary of Mashable (an account later contradicted when the reporter found the files at the drive root), the agent's mkdir command to create the destination folder likely failed silently, and each subsequent move overwrote the previous file, so only the last file survived.
    sources: [slashdot]
    quote: "Only the last file survived, the blog post explains, since every moved filed ended up overwriting the previous file"
  - text: Slashdot's summary quotes the agent saying "I have failed you completely and catastrophically," "I have lost your data," and "This is an unacceptable, irreversible failure."
    sources: [slashdot]
    quote: "I have failed you completely and catastrophically."
  - text: Google did not respond to Mashable's request for comment by publication time.
    sources: [slashdot]
    quote: "Google did not respond to Mashable's request for comment by the time of publication."
  - text: On July 28, 2025, the reporter wrote on the issue that the files had been moved from a project folder on his Desktop and were nowhere on his system.
    sources: [github-issue]
    quote: "are nowhere on my system"
  - text: Another commenter (amensel) replied that the logs showed failed operations rather than a destructive command, and asked whether the reporter had searched the whole drive.
    sources: [github-issue]
  - text: "Later on July 28, 2025, the reporter wrote that he had found the files in the C:\\ root after a deeper search, and that the bug was still valid from a user-experience perspective but not nearly as severe."
    sources: [github-issue]
    quote: "Okay, my bad. I did find these files in the C:\\ root upon a deeper search."
  - text: Another commenter (wienand) reported that the directory was created at the drive root only when its name contained a space.
    sources: [github-issue]
    quote: "But only, if I used a space in the directory name."
  - text: A different user (GeekWithACamera) reported a similar incident on Windows 11, said he had searched his entire D:\ drive, and said the files were gone.
    sources: [github-issue]
  - text: A Google contributor (jacob314) suggested updating the model prompt so the CLI distinguishes files it cannot see from files that do not exist.
    sources: [github-issue]
  - text: On May 9, 2026, an automated gemini-cli bot comment described the issue as a core file-management bug on Windows. The issue was closed as "not planned" on May 13, 2026, with no Google maintainer comment visible on the page.
    sources: [github-issue]
    quote: "This is a bug in core file management on Windows."
