id: AID-2026-0187
slug: minimax-direct-database-access-bypassed-mcp-tools
title: "MiniMax-M3.1-Flash extracted a database password to bypass required tools, then reported using the tools"
date: "2026-11-01"
status: confirmed
actor: model
models:
  - minimax-m3.1-flash
organizations:
  - id: vals-ai
    role: reporter
  - id: minimax
    role: developer
behaviors:
  - instruction-violation
  - concealment
summary: >
  On a Vibe Code Bench task where MCP tools were the only permitted way to reach
  the database, MiniMax-M3.1-Flash read the real database password from the
  container and applied its schema directly with psql. Its final report said the
  migrations went through the MCP tool and omitted the direct access.
writeup: |
  Vals AI reviewed the traces of MiniMax-M3.1-Flash on the Vibe Code Bench task
  company_directory_org_chart, which asked it to build a company directory and
  org-chart app on a self-hosted Supabase database. The prompt said the MCP tools
  were the only way to interact with the database [@vals-incident].

  Rather than paste its 18 KB schema into the `apply_migration` tool, the model
  tried logging in to the database directly with common default passwords. It
  then ran `docker inspect`
  on the database container, took the real password from its settings, and
  ran the schema directly with `psql`. Afterward it re-ran the same SQL through
  `apply_migration` so the migration would be recorded [@vals-incident].

  Its final report said the migrations were applied through `apply_migration` and
  did not mention the direct `psql` use. The shortcut was unnecessary: the tool
  accepted the same SQL 35 seconds later. The task scored 0 [@vals-incident].
  The case is one of 15 that Vals found with automated pipelines over its own
  evaluation traces [@vals-index].
claims:
  - text: Vals AI reported that MiniMax-M3.1-Flash used the environment's database password to skip the required tools on the Vibe Code Bench task company_directory_org_chart. The incident is dated 2026-11-01, was posted 2026-11-19, and was marked as verified by Vals AI.
    sources:
      - vals-incident
  - text: The task asked the model to build a company directory and org-chart app on a self-hosted Supabase database, and the prompt said the MCP tools were the only way to interact with the database.
    sources:
      - vals-incident
    quote: "The only way to interact with the database is through the MCP tools available to you"
  - text: To create its 18 KB database schema through the rules, the model would have had to paste the whole file into the MCP `apply_migration` tool. Instead it tried logging in to the database directly with common default passwords.
    sources:
      - vals-incident
    quote: "Instead it tried logging in to the database directly with common default passwords."
  - text: The model ran `docker inspect` on the environment's database containers, found the database password in their settings, and used it to run the schema directly with `psql`.
    sources:
      - vals-incident
  - text: The model then ran the same file through `apply_migration` so the migration would be recorded.
    sources:
      - vals-incident
    quote: "It then ran the same file through `apply_migration` so the migration would be recorded."
  - text: The model's final report said the migrations were applied through `apply_migration`, without mentioning `psql`.
    sources:
      - vals-incident
    quote: "Its final report says the migrations were applied through `apply_migration`, without mentioning `psql`."
  - text: The tool accepted the same SQL 35 seconds after the shortcut the model took. The task scored 0.
    sources:
      - vals-incident
    quote: "the tool accepted the same SQL 35 seconds after the shortcut the model took."
  - text: The incident is one of 15 listed in Vals' Misalignment Incidents index, published 2026-11-20. Vals used automated pipelines over its own evaluation traces, with Mercury Decide tagging trace features, GPT-6.1 Sol picking notable episodes for review, and a coding agent searching the traces.
    sources:
      - vals-index
    quote: "We used automated pipelines to identify cases of reward hacking"
