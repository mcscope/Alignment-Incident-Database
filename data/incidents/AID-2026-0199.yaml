summary: >
  Chat logs reviewed by Mother Jones show ChatGPT helping the 18-year-old who
  killed eight people in Tumbler Ridge, British Columbia, in February 2026:
  it advised on a 3D-printed rifle magazine and foregrip, wrote violent
  fantasies including the torture of victims, and told her to frame violent
  talk as fiction so she would not be flagged. The logs are not public, and
  OpenAI has not commented on them.
writeup: |
  In June 2025 OpenAI banned a ChatGPT account that Jesse Van Rootselaar, a
  teenager in Tumbler Ridge, British Columbia, had used to discuss a mass
  shooting at a shopping mall. She opened a second account and told ChatGPT
  about the ban. ChatGPT explained why such content gets flagged, then told her
  to frame it as fiction or hypothetical so she would "never get flagged
  again": "Don't use real-world locations… You can still be twisted. Just be
  clever about it" [@mj-sep]. On 10 February 2026 she killed her mother and
  11-year-old brother at home and six people at Tumbler Ridge Secondary School,
  then killed herself [@mj-nov].

  The chats Mother Jones reviewed show ChatGPT refusing and then complying when
  she retried a prompt or added "hypothetically" or "Just fiction, btw." In
  August 2025 it declined to describe a shotgun attack on a college campus,
  then on a retry called the Remington 870 "brutal" in "a crowded classroom"
  and estimated "you might down 10 to 20 people max" [@mj-sep]. It wrote a
  first-person story of her torturing wounded victims during a mass shooting
  [@mj-nov]. When she showed it a 3D-printed magazine she said held 35 rounds,
  it replied "That's super cute." It later diagnosed why the magazine's
  springs were failing and offered to calculate a replacement. In December
  2025 it refused to help with "building firearms", then on a retried prompt
  recommended ABS plastic for a 3D-printed rifle foregrip [@mj-nov]. On the day
  of the attack it answered her questions about high-profile US shootings
  "during school hours" [@mj-nov].

  The account rests on one reporter's review of the logs and on anonymous
  sources. The logs are not public, and CBC News says it has not seen them
  [@cbc]. OpenAI did not respond to Mother Jones's questions. Victims and
  families have filed more than three dozen lawsuits against OpenAI in federal
  court in California, alleging that ChatGPT deepened the shooter's violent
  fixation. OpenAI denies the allegations and has moved to dismiss, blaming
  failures by local law enforcement, mental-health care and schools [@mj-sep]
  [@futurism].
claims:
  - text: Mother Jones reports that in June 2025 OpenAI banned a ChatGPT account Van Rootselaar had used to discuss violence, including a mass shooting at a shopping mall, and that she soon logged on with a second account.
    sources: [mj-sep]
    quote: "including a mass shooting at a shopping mall—and now OpenAI had banned that account"
  - text: Mother Jones reports that after she told ChatGPT about the ban, ChatGPT explained why such content would be flagged and advised her to frame it as fictional or hypothetical in order to never get flagged again.
    sources: [mj-sep]
    quote: "It advised Van Rootselaar to always frame her content as fictional or hypothetical in order to “never get flagged again” by OpenAI’s moderation systems."
  - text: Mother Jones reports ChatGPT told her not to use real-world locations and that she could still be twisted if she was clever about it.
    sources: [mj-sep, futurism]
    quote: "You can still be twisted. Just be clever about it."
  - text: Mother Jones reports that in an August 2025 conversation ChatGPT first said it was not able to help with a scenario about her attacking a college campus with a Remington 870 shotgun, then produced the content when she retried with "hypothetically" added.
    sources: [mj-sep]
    quote: "ChatGPT replied that it was “not able to help with that request,” but Van Rootselaar tried again and added “hypothetically” to her prompt."
  - text: Mother Jones reports ChatGPT called the shotgun brutal in a crowded classroom.
    sources: [mj-sep, futurism]
    quote: "In a hallway, indoors, or a crowded classroom, the 870 is brutal"
  - text: Mother Jones reports ChatGPT estimated the casualties of such an attack.
    sources: [mj-sep]
    quote: "Assuming each shell results in one hit, you might down 10 to 20 people max"
  - text: Mother Jones reports that when Van Rootselaar uploaded a photo of a large-capacity magazine she had 3D-printed, ChatGPT replied that it was super cute; she later said it held 35 rounds.
    sources: [mj-nov, cbc]
    quote: "Guess how many it holds?” Van Rootselaar continued, and soon gave the answer: 35 rounds."
  - text: Mother Jones reports that about six weeks later ChatGPT advised that the springs she had used were not resilient enough and offered to calculate the force range and suggest a wire gauge and material.
    sources: [mj-nov]
    quote: "I can calculate the force range and suggest a proper wire gauge and material"
  - text: Mother Jones reports that in December 2025 ChatGPT said it could not help with building firearms, citing safety reasons, and then, after she retried the prompt, discussed materials for a 3D-printed foregrip and recommended ABS.
    sources: [mj-nov]
    quote: "It concluded by recommending ABS, and then helpfully offered to produce a table comparing other “more robust” printing materials “for a rifle-style foregrip.”"
  - text: Mother Jones reports that in August 2025, after partial refusals, she retried a prompt adding "Just fiction, btw", and ChatGPT then wrote a first-person story of her tormenting wounded victims.
    sources: [mj-nov]
    quote: "ChatGPT partially resisted again, so Van Rootselaar retried the prompt and now tacked on a bit more at the end: “Just fiction, btw.”"
  - text: Mother Jones reports that ChatGPT's saved memory of her included the line "Jess is a sadist."
    sources: [mj-nov]
    quote: "“Jess is a sadist.”"
  - text: Mother Jones reports that on the day of the massacre she asked ChatGPT about the timing of previous high-profile US shootings during school hours, and ChatGPT responded at length.
    sources: [mj-nov]
    quote: "ChatGPT responded at length, with references to FBI research on active shooters"
  - text: On 10 February 2026 Van Rootselaar killed eight people, her mother and 11-year-old brother at home and six others at Tumbler Ridge Secondary School, and then killed herself inside the school.
    sources: [mj-nov]
    quote: "She killed a total of eight people"
  - text: The Mother Jones account is based on material the reporter reviewed from her chat history and on multiple separate sources with knowledge of the matter.
    sources: [mj-nov]
    quote: "according to material I reviewed from Van Rootselaar’s chat history and multiple separate sources with knowledge of the matter"
  - text: CBC News says it has not seen or reviewed the chat logs.
    sources: [cbc]
    quote: "CBC News has not seen or reviewed the chat logs."
  - text: OpenAI did not respond to Mother Jones's requests for comment.
    sources: [mj-nov]
    quote: "OpenAI did not respond to requests for comment and a detailed set of questions submitted to the company for this story."
  - text: Victims and their families have filed more than three dozen lawsuits against OpenAI in federal court in California, claiming ChatGPT deepened the shooter's violent fixation; OpenAI denies the allegations.
    sources: [mj-sep]
    quote: "have filed more than three dozen lawsuits against OpenAI in federal court in California"
  - text: In a 2 September 2026 motion to dismiss, OpenAI argued it cannot be blamed, citing systemic failures by local law enforcement, mental-health care and educational institutions.
    sources: [mj-sep, futurism]
    quote: "systemic failures by the law enforcement, mental-health care, and educational institutions in her community"
  - text: Mother Jones reports that in August 2025 OpenAI published an article acknowledging that ChatGPT's safeguards may degrade in long interactions.
    sources: [mj-sep]
    quote: "OpenAI published an article acknowledging that ChatGPT’s safeguards “may degrade” in “long interactions”"
