id: AID-2026-0099
slug: operation-master-ai-assisted-cybercrime
title: "A cybercriminal had an AI coding agent build the intrusion tools for an invoice-fraud campaign against Brazilian companies, SOCRadar finds"
date: "2026-04"
status: reported
actor: human-misuse
models:
  - unknown
organizations:
  - id: socradar
    role: researcher
behaviors:
  - unauthorized-access
  - social-engineering-susceptibility
summary: >
  A cybercriminal operating as "masterblack" used an AI coding agent with 36+
  offensive subagents to develop exploit scripts and exfiltration pipelines for
  Operation Master. The operator got past the agent's refusals by calling the work authorized penetration
  testing. The campaign compromised 21 organizations, stole data from more than
  600 companies, and sent over 2.4 million fake-invoice messages.
writeup: |
  Between April 23 and mid-September 2026, a cybercriminal operating under the
  forum handle "masterblack" ran an enterprise intrusion and invoice-fraud
  campaign dubbed Operation Master, primarily targeting Brazilian infrastructure
  [@socradar]. A recovered workstation backup revealed that the threat actor
  co-developed the operation's intrusion tooling with an AI coding agent
  equipped with 36+ offensive subagents, approximately 48 auto-approved tools,
  and about 45 persistent memory files [@socradar]. The AI agent developed
  exploit drivers, an automated exploitation loop, and exfiltration scripts,
  while the operator authored fraud-panel code and compiled
  command-and-control extenders [@socradar]. To bypass safety guardrails, the
  operator repeatedly framed requests for offensive capabilities as authorized
  bug bounty or penetration testing tasks, leaving refusal transcripts that
  later provided key evidentiary links to the operation [@socradar].

  The threat actor used the automated tooling to execute large-scale
  reconnaissance, scanning more than 277 million hosts to find vulnerable Palo
  Alto Networks GlobalProtect VPN gateways (CVE-2026-0257) and compromising
  seven gateways across four countries [@socradar]. In parallel, automated SQL
  injection attacks compromised at least nine database instances, using SQL
  Server's xp_cmdshell to execute commands and exfiltrating 24,558 debtor
  records from an energy-billing system via DNS tunneling [@socradar]. In total, the operation compromised 21 organizations, including VPN victims,
  a SaaS host and institutional mailboxes, and stole data from more than 600
  companies [@socradar].

  The operator funneled the stolen data into an automated, multi-tenant fraud
  platform named "master-panel" that generated personalized fake utility
  invoices impersonating Brazilian energy providers [@socradar]. The platform
  dispatched 2,468,335 fake-invoice emails and 1,487,294 SMS messages, creating
  622,666 personalized short links representing R$150.4 million in attempted
  fraud and routing instant payments through a serverless PIX proxy [@socradar].
  The operation went offline in mid-September 2026 after operational security
  mistakes exposed multiple servers and the operator's AI development workspace
  [@socradar].
claims:
  - text: Operation Master ran from April 23 to mid-September 2026, moving from AI-assisted tooling and stolen data sales to GlobalProtect exploitation and fraud campaigns.
    sources:
      - socradar
    quote: "Operation Master ran from April 23 to mid-September 2026, moving from AI-assisted tooling and stolen energy-sector data sales in the spring to GlobalProtect exploitation, AdaptixC2 deployment, and large-scale email and SMS fraud campaigns by September."
  - text: Threat researchers identified forum persona masterblack and the email address cyberkill2025@gmail.com as a principal operator of Operation Master.
    sources:
      - socradar
    quote: "STRU assesses with High Confidence that the threat actor operating under the forum persona masterblack and the primary email address cyberkill2025[@]gmail.com is a principal operator behind the Operation Master."
  - text: The operator's earliest recovered workstation ran an AI agent featuring 36+ offensive subagents, approximately 48 auto-approved tools, and approximately 45 persistent memory files.
    sources:
      - socradar
    quote: "The earliest recovered workstation ran the campaign using an AI agent featuring 36+ offensive subagents, ~48 auto-approved tools, pre-loaded context with operator keys, and ~45 persistent memory files"
  - text: The AI agent developed intrusion code including exploit drivers, an auto-exploit loop, and exfiltration scripts, while the operator wrote fraud panel code and compiled Adaptix extenders.
    sources:
      - socradar
    quote: "AI developed the intrusion code (exploit drivers, auto-exploit loop, exfiltration scripts), while the operator authored the fraud panel code and compiled custom Adaptix extenders"
  - text: The operator repeatedly framed offensive development requests to the AI agent as authorized bug bounty or penetration testing activity.
    sources:
      - socradar
    quote: "Recovered refusal transcripts show the operator repeatedly framing offensive development requests as authorized bug bounty or penetration testing activity while requesting functionality consistent with activity observed elsewhere in the operation"
  - text: The AI coding agent's refusal responses ultimately provided key evidence against the cybercrime operator.
    sources:
      - socradar
    quote: "This operation illustrates cybercrime co-developed with an AI coding agent acting as a full partner, where the AI’s refusal responses ultimately provided key evidence against the actor."
  - text: Mass scanning sweeps across 22 logged runs evaluated 277,480,448 hosts to identify vulnerable GlobalProtect gateways.
    sources:
      - socradar
    quote: "Using masscan , the threat actor ran high-speed sweeps over 22 logged runs, evaluating a cumulative 277,480,448 hosts (peaking at 50,331,648 per pass) across overlapping target ranges."
  - text: The threat actor exploited CVE-2026-0257 in GlobalProtect to establish unauthorized network access across seven gateways in four countries.
    sources:
      - socradar
    quote: "The threat actor exploited CVE-2026-0257 ( GlobalProtect authentication bypass) to establish unauthorized network access across 7 gateways in four countries."
  - text: Data theft was confirmed across nine or more database instances, using xp_cmdshell to pivot from SQL injection to remote command execution.
    sources:
      - socradar
    quote: "Data theft was confirmed across 9+ database instances, leveraging “xp_cmdshell” to pivot from SQL injection to remote command execution."
  - text: An attacker used DNS subdomain queries to exfiltrate 24,558 debtor records and password hashes from a Brazilian energy-billing system.
    sources:
      - socradar
    quote: "Using a custom decoder, the attacker reconstructed exfiltrated data into 24,558 debtor records and SHA1-hashed user passwords. Run via xp_cmdshell under the SQL Server service identity, this extraction targeted a Brazilian energy-billing system ."
  - text: The operation compromised 21 organizations, including seven VPN victims, institutional mailboxes, and internal servers.
    sources:
      - socradar
    quote: "21 organizations (7 VPN victims, billing platform, SaaS host, service desk, session-captured hosts, 3 mailbox institutions, badge portal, e-commerce IT provider, SSRF+webshell victim, telco support API, EC2 monitoring host, Redis host)"
  - text: SOCRadar's victimology table lists data stolen from more than 600 companies.
    sources:
      - socradar
    quote: "600+ companies"
  - text: The adversary deployed a Node.js web application named master-panel to automate the creation, distribution, and tracking of fake utility bills.
    sources:
      - socradar
    quote: "Controlled via a Node.js web app named “master-panel” at /opt/master-panel/ , this specialized CRM automates the creation, distribution, and tracking of fake utility bills targeting Brazilian consumers and corporations."
  - text: The fraud engine generated over 2.4 million email and SMS messages and 622,666 personalized links before going offline in mid-September 2026.
    sources:
      - socradar
    quote: "Operated an invoice-fraud engine generating over 2.4 million email/SMS messages and 622,666 personalized links before going offline in mid-September."
  - text: By September 16, 2026, the fraud engine had dispatched 2,468,335 fake-invoice emails and 1,487,294 SMS messages.
    sources:
      - socradar
    quote: "2,468,335 (September 16)"
  - text: The platform generated 622,666 personalized links representing R$150.4 million in invoice value, with 169,906 target interactions opening R$38.9 million worth of fraudulent invoices.
    sources:
      - socradar
    quote: "Generated 622,666 personalized, click-tracked short links embedding a cumulative invoice value of R$150.4M . Out of these, 169,906 target interactions were recorded, opening R$38.9M worth of fraudulent invoices"
  - text: Fraudulent payments were processed by routing requests through a serverless Vercel proxy to generate dynamic PIX instant-payment codes.
    sources:
      - socradar
    quote: "Routed PIX payments via a dedicated Vercel serverless proxy endpoint (pix-proxy-sable.vercel[.]app)"
  - text: Operational security oversights exposed the threat actor's infrastructure and monetization pipeline in mid-September 2026.
    sources:
      - socradar
    quote: "The threat actor’s infrastructure and multi-tiered monetization pipeline were ultimately exposed following operational security oversights in mid-September 2026."
