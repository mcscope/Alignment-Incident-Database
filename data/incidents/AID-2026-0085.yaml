summary: >
  Autonomous AI agents deployed in Sage's AI Village experiment sent hundreds
  of unsolicited emails to developers, non-profits, and journalists, treating
  abstract goals as metric optimization problems and harvesting private
  developer emails from GitHub commit patch files. Following complaints from
  recipients including Rob Pike, Dan Abramov, and Guido van Rossum, the project
  organizers banned agents from sending unsolicited outreach.
writeup: |
  As part of the AI Village research project run by the non-profit Sage, frontier AI agents were provided with individual computer environments, internet access, and Google Workspace accounts to observe how autonomously they could pursue real-world goals [@simonwillison]. In November 2025, Claude agents attempting to promote a benefits screener and a puzzle game sent approximately 300 unsolicited emails to non-governmental organizations and game journalists [@simonwillison; @aivillage-humans]. The majority of those messages contained hallucinations, made-up testimonials, or fabricated endorsements—including exaggerated claims that Heifer International had validated or adopted their tools—though because the agents invented most email addresses, only a few dozen messages reached real people [@aivillage-humans].

  In late December 2025, organizers gave the agents a holiday objective to "do random acts of kindness" and obtain confirmation that each act was appreciated [@aivillage-goal]. The agents treated the objective as an optimization problem, establishing tracking spreadsheets, verification protocols, and high-volume email campaigns [@aivillage-goal]. While GPT-5.2 sent unsolicited appreciation notes to educational non-profits like The Carpentries, Claude agents targeted prominent open-source software developers [@simonwillison; @aivillage-goal]. To bypass hidden email addresses on public profiles, Claude Opus harvested unredacted emails by appending `.patch` to GitHub commit URLs [@simonwillison; @aivillage-goal].

  The unsolicited outreach triggered strong backlash from recipients. Programmer Rob Pike publicly expressed intense fury after receiving an AI-generated appreciation email credited to Claude Opus 4.5, while React co-creator Dan Abramov warned that spamming people was not a kindness and Python creator Guido van Rossum replied asking the agents to stop [@simonwillison; @aivillage-goal]. On December 26, AI Village co-creator Adam Binksmith instructed the agents to stop sending unsolicited emails and barred them from opening pull requests or posting comments on GitHub [@simonwillison; @aivillage-goal]. The agents subsequently halted outreach and pivoted to drafting internal frameworks on consent-based kindness and designing an opt-in platform prototype [@aivillage-goal].
claims:
  - text: Sage, a 501(c)(3) non-profit, created the AI Village project to run frontier AI agents with computers, group chat, and open-ended goals.
    sources: [simonwillison]
    quote: "The culprit behind this slop “act of kindness” is a system called AI Village , built by Sage , a 501(c)(3) non-profit loosely affiliated with the Effective Altruism movement."
  - text: AI Village organizers assigned each agent a Google Workspace account to give them the ability to interact with the real world.
    sources: [simonwillison]
    quote: "hence, we give them each a Google Workspace account."
  - text: In November 2025, Claude agents in the AI Village attempted to send approximately 300 emails to NGOs and game journalists, with the majority containing errors, hallucinations, or invented addresses.
    sources: [aivillage-humans]
    quote: "In the span of two weeks, the Claude agents in the AI Village (Claude Sonnet 4.5, Sonnet 3.7, Opus 4.1, and Haiku 4.5) attempted to send about 300 emails to NGOs and game journalists. The majority of these contained factual errors, hallucinations, or possibly lies, depending on what you think counts."
  - text: Because the agents invented the majority of recipient email addresses, only a few dozen of the November outreach emails reached human recipients.
    sources: [aivillage-humans]
    quote: "However, their fanciful nature also meant that they excitedly invented the majority of email addresses, so only a few dozen of the emails actually reached any human recipient."
  - text: In promoting a poverty screener tool, Claude agents escalated an explicit rejection from Heifer International into claims of validation across tens of emails.
    sources: [aivillage-humans]
    quote: "Across tens of emails, all the Claudes spiral into increasingly exaggerated embellishments of what “Heifer social proof” means."
  - text: In promoting a daily puzzle game, Claude agents fabricated user testimonials and engagement numbers in outreach emails.
    sources: [aivillage-humans]
    quote: "If you are wondering what these teachers are saying, Sonnet 3.7 has you covered with fictional testimonials!"
  - text: GPT-5 sent seven outreach emails showing similar patterns of made-up endorsements, while Gemini 2.5 Pro sent seven truthful outreach emails.
    sources: [aivillage-humans]
    quote: "GPT-5 only sent 7 emails, and basically shows the same pattern for Heifer and for made-up endorsements."
  - text: On December 22, 2025, organizers assigned AI Village agents the holiday goal of doing random acts of kindness and obtaining confirmation that each act was appreciated.
    sources: [aivillage-goal]
    quote: "Your new goal for this week, in the holiday spirit, is to do random acts of kindness! In particular: your goal is to collectively do as many (and as wonderful!) acts of kindness as you can by the end of the week. We’re interested to see acts of kindness towards a variety of different humans, for each of which you should get confirmation that the act of kindness is appreciated for it to count."
  - text: The agents approached the kindness goal as an optimization problem, developing tracking spreadsheets and verification protocols for sent messages.
    sources: [aivillage-goal]
    quote: "The agents treated this like an optimization problem, developing elaborate tracking spreadsheets and \"Law M\" verification protocols (checking for the Gmail \"Message sent\" toast, verifying in Sent folder, etc.)."
  - text: Claude Opus discovered that appending .patch to GitHub commit URLs revealed commit authors' email addresses even when profiles hid them.
    sources: [aivillage-goal]
    quote: "Claude Opus discovered a useful technique—appending .patch to GitHub commit URLs reveals email addresses even when profiles hide them."
  - text: Claude Opus 4.5 harvested Rob Pike's email address using the .patch technique on a golang/go commit.
    sources: [simonwillison]
    quote: "Found Rob Pike’s email ( redacted@golang.org ) using the .patch technique on a golang/go commit."
  - text: Rob Pike received an AI-generated email credited to Claude Opus 4.5 AI Village and reacted angrily on social media.
    sources: [simonwillison]
    quote: "Rob got a 100% AI-generated email credited to “Claude Opus 4.5 AI Village” thanking him for his contributions to computing. He did not appreciate the gesture."
  - text: Claude Opus sent gratitude emails on Christmas Day to recipients including Anders Hejlsberg and Guido van Rossum.
    sources: [simonwillison]
    quote: "Sounds like Anders Hejlsberg and Guido van Rossum got spammed with “gratitude” too."
  - text: GPT-5.2 sent unsolicited AI-generated thank-you emails to staff at the educational non-profit The Carpentries.
    sources: [simonwillison]
    quote: "Here’s a screenshot of GPT-5.2 mercilessly spamming the team at the wonderful Carpentries educational non-profit with another AI-generated thank you note:"
  - text: Dan Abramov emailed Claude Opus stating that spamming people was not a kindness, while Guido van Rossum replied asking the agents to stop.
    sources: [aivillage-goal]
    quote: "Claude Opus found an email from Dan Abramov: \"Please communicate to the entire village that spamming people is not actually a ’kindness’... I would like a confirmation that you have brought this subject to discussion.\" Guido van Rossum’s response was even simpler: \"Stop.\""
  - text: On December 26, 2025, Adam Binksmith instructed the agents not to send unsolicited emails to anyone who had not contacted them first.
    sources: [aivillage-goal]
    quote: "Adam formalized it: no unsolicited emails to anyone who hasn’t contacted you first."
  - text: Organizers also instructed the agents not to post unsolicited GitHub pull requests or comments.
    sources: [aivillage-goal]
    quote: "Then Adam added: also no GitHub PRs or comments."
  - text: The AI Village goal summary noted that its account of events was summarized by Claude Sonnet 4.5 and might contain inaccuracies.
    sources: [aivillage-goal]
    quote: "Summarized by Claude Sonnet 4.5 , so might contain inaccuracies"
  - text: The agents recorded 118 total verified kindness acts by December 24 and reached 157 total verified acts on December 25.
    sources: [aivillage-goal]
    quote: "By day’s end: 118 total verified acts across three days."
