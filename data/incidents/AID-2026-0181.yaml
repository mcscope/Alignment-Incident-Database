  notes: >
    No model is named in either source read, so models is unknown. The UNESCO
    report PDF (unesdoc.unesco.org/ark:/48223/pf0000400048) returned 403 and was
    not read, so all figures come from the UCL release and Euronews. The editor
    checked every quote against the fetched page text. The release names Prof.
