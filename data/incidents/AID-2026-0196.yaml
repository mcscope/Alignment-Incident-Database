  notes: >
    The coding agent and its underlying model are not named in either source, so
    models is unknown. The commit date and exposure window are not given; the
    samples are from June and July 2026, but the date is kept at 2026 and a
    reviewer may refine it. The notice does not say the agent acted deceptively
    or deliberately. The downstream intrusion was by a human third party. The
    editor re-checked all quotes against the pages via a fetch tool on
    2026-11-22; claims without a quote rest on the notice's paraphrased text.
    The "has now been deleted" clause is Together AI's own statement as relayed
    by Unite.AI. Organization together-ai was added to the taxonomy. Hugging
    Face and Dragos are mentioned in claims only. explainx.ai coverage (the
    original lead) restates the notice and was not cited.
