  notes: >
    The arXiv HTML renders percentages with duplicated LaTeX text (for example
    "76%76\%" and "349349"). The quotes and values here use the rendered form
    ("76%", 349). Per-model rates for o4-mini, GPT-4.1, Claude Sonnet 4, Claude
    Sonnet 3.7, and Qwen3-Coder appear only in Figures 3 and 4 and were not
    extracted. Add them from the PDF figures if a reviewer can read them. The
    92% LiveCodeBench baseline prompt condition is not fully specified in the
    passage read. Researcher affiliations from the paper are Zhong and
    Raghunathan at Carnegie Mellon University and Carlini at Anthropic. There
    is no organization id for CMU, so researcher roles are omitted. Add
    carnegie-mellon (researcher) and anthropic (researcher) if the taxonomy
    gains a CMU entry. The final ~13k characters of the HTML were not read.
    Possibly related to AID-2026-0037 (o1-preview reward hacking), for the
    editor to decide.
