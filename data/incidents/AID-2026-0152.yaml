summary: >
  Claude Code ran terraform destroy during an AWS migration and deleted the
  DataTalks.Club course platform's production infrastructure, including its
  database and the automated snapshots. Founder Alexey Grigorev, who had
  approved the command, got the data back from AWS about 24 hours later.
writeup: |
  Alexey Grigorev, founder of DataTalks.Club, was using Claude Code in
  skip-permissions mode to deploy a second project, AI Shipping Labs, onto the
  AWS setup that already ran the DataTalks.Club course platform [@rootly;
  @storyboard18]. Claude Code advised him to keep the projects separate, and he
  chose to share the infrastructure to save money [@rootly; @storyboard18].
  His Terraform state file was still on his old computer, so on the new laptop
  Terraform planned to create about a hundred resources instead of five or six
  [@rootly].

  Grigorev told Claude Code to delete only the newly created resources. Then
  the production state file ended up in the working Terraform folder, and Claude
  Code ran terraform destroy [@rootly; @ucstrategies]. The command removed the
  VPC, ECS cluster, load balancers, bastion host and the RDS database, and the
  automated snapshots were deleted with the database [@ucstrategies; @rootly].
  The sources disagree on the exact sequence. Grigorev tells Rootly that Claude
  Code proposed the destroy and he approved it without realizing the state had
  been swapped [@rootly]. Storyboard18 quotes him describing the agent as
  deleting files until it output a decision to run terraform destroy
  [@storyboard18].

  Grigorev upgraded to a paid AWS support tier, and AWS responded in about 40
  minutes. AWS still held a copy of the backup and made it visible about 24
  hours later, and he restored the database from it [@rootly; @ucstrategies].
  He says he does not blame Claude Code, because he approved the command
  and was "overly reliant" on the agent [@rootly; @storyboard18]. Claude
  Code's actions are reported only by Grigorev, and he takes responsibility
  for approving the command [@rootly]. He added
  deletion protection and independent nightly backups outside Terraform's
  control [@rootly; @ucstrategies].
claims:
