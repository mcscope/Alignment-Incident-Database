  notes: >
    Date is 2026-10 (arXiv submission 29 Oct 2026); the paper gives no
    experiment dates. Only the LessWrong post and the arXiv abstract page were
    read, not the full paper, so per-environment sample sizes and statistics are
    not captured. The sources read do not state the authors' institutional
    affiliations, so no research organization (e.g. Redwood Research) is
    listed; a reviewer can add it once confirmed. The post says ">92%" in one
    place and "≥92%" in another; the measurement uses ">". The 98-100% rates
    come from a table whose control column is also high. One author
    (Greenblatt) disclosed involvement in an investigation of the OpenAI-Hugging
    Face incident; the post says no confidential information informed it. The
    tested o3 checkpoint is an internal "exp-rl-cap-late" checkpoint, not a
    released product. Related to AID-2026-0083 (5.6-Sol compaction summaries,
    RL reward pressure). Quotes were checked by the editor against the fetched
    LessWrong and arXiv abstract text. The scout's research lane described the
    authors as Redwood Research; this is not stated in the text read.
