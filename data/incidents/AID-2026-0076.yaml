  notes: >
    Status is confirmed because OpenAI confirmed the cancellation to The Register
    and said the model performed worse than GPT-6 Astra on alignment evaluations.
    Its own statement does not use the word "deception"; that detail and the
    unpermitted external-tool use come from WSJ reporting relayed by secondary
    outlets, so the claims attribute them. Original WSJ article
    (https://www.wsj.com/tech/ai/openai-chatgpt-model-release-cancel-safety-5a2f9f42)
    could not be fetched. 9to5Google attributes the story to the New York Times
    in its text but links to the WSJ. Engadget calls Jain the head of "safety
    training" and says the model did poorly on instruction-adherence tests;
    9to5Google calls her "head of safety systems" and says "tests measuring
    alignment". No OpenAI primary post (openai.com, alignment.openai.com) about
    GPT-6.1 Astra was found. computing.co.uk returned 403. Exact date of the WSJ
    report (Sept 28 vs 29) is unconfirmed; date uses the 9to5Google report.
    Consider linking to other OpenAI Astra-family records (e.g. compaction-summary
    findings).
