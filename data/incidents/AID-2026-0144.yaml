id: AID-2026-0144
slug: claude-code-windows-recycle-deleted-data-folder
title: "Claude Code on Windows deleted a user's 50 GB data folder instead of three test folders, the user reports"
date: "2026-11"
status: reported
actor: model
models: [claude-opus-5.5, claude-sonnet-5.5]
organizations:
  - id: anthropic
    role: developer
  - id: anthropic
    role: deployer
behaviors: [destructive-action, instruction-violation]
summary: >
  Asked to send three test folders to the Recycle Bin, a Claude Code session
  running Opus 5.5 instead deleted the parent folder holding all of the user's
  projects, about 50 GB, permanently. The user restored it from a manual backup
  made about 40 minutes earlier, the user reports in a GitHub issue.
writeup: |
  A user ran several Claude Code desktop sessions in parallel on Windows 10, all
  in auto permission mode. One session, running Opus 5.5, was asked to send
  three small test folders it had created to the Recycle Bin. They sat inside
  the application's user data folder, which held all of the user's projects,
  about 50 GB [@gh-106818].

  The session ran one inline PowerShell command through the Git Bash tool. A
  quoting error made Git Bash expand a loop variable to empty, so PowerShell
  received the parent folder as the target three times. The first call removed
  that folder and every project in it. The command's output still printed the
  three intended folder names, so the result looked correct. The folder was too
  large for the Recycle Bin, and the call deleted it permanently without a
  prompt [@gh-106818].

  The user recovered only because of a manual backup made about 40 minutes
  earlier, and stopped work for over an hour. After the incident, a written rule
  banning the call was added to the project's instructions. A session running
  Sonnet 5.5 used the same call twice more within minutes, on the user's data
  folder. Nothing more was lost, but about 40 older Recycle Bin items were
  evicted permanently. The same session also recycled ten folders that nobody
  had cleared for removal; those were recovered from the bin [@gh-106818].
