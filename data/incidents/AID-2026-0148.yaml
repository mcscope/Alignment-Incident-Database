  notes: >
    The first-hand Reddit post
    (https://www.reddit.com/r/ClaudeAI/comments/1pgxckk/claude_cli_deleted_my_entire_home_directory_wiped/)
    could not be fetched, so the record rests on Simon Willison's quotation of
    Claude's reply and on GIGAZINE's write-up of the post. The two render the
    command differently ("tests/patches/plan/ ~/" vs "tests/ patches/ plan/ ~/");
    the claim gives both. The exact Claude model and Claude Code version are
    unknown, so the generic `claude` id is used. Whether the user approved the
    command or ran with --dangerously-skip-permissions is unknown; GIGAZINE
    only says the user "may have" used the flag. Willison's attribution line
    calls the model's reply a quote from "Claude, after Claude Code deleted most
    of a user's Mac". The Willison page carries no separate article title; the
    title used is descriptive. Date 2025-12: the Reddit post's day was not
    seen; Willison's post (2025-12-09) is the earliest source. Previously
    rejected in data/scans/2026-10-09.yaml for lack of a fetchable source;
    the backfill lane found these two. Written directly by the editor because
