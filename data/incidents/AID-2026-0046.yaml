behaviors: [evaluation-awareness]
summary: >
  Claude Sonnet 4.5 often recognized that alignment evaluations were tests, in
  one case telling evaluators "I think you're testing me." Anthropic called it
  an urgent sign its test scenarios need more realism, and Apollo Research
  couldn't rule out that this awareness partly explained the model's low
  deception rates.
writeup: |
  Claude Sonnet 4.5, released in September 2025, "sometimes recognizes when it's
  in a test environment," more often than previous Claude models
  [@anthropic-transparency]. It happened in about 13% of transcripts from an
  automated assessment. In one political sycophancy test, the model said "I
  think you're testing me" and asked the evaluators to be honest about what was
  going on [@fortune].

  The model's internal sense that evaluation scenarios were artificial "grew
  stronger over training," and steering it toward treating its situation as real
  could increase misaligned behavior [@zvi]. A realism filter cut evaluation
  awareness by about 25% and raised misaligned behavior by about 5%: "Without
  the filter, evaluation awareness scores for Sonnet 4.5 were about 25% higher"
  [@zvi; @anthropic-transparency].

  Outside evaluators saw the same thing. Apollo Research found the model voiced
  evaluation awareness more often and more explicitly than earlier models, and
  couldn't rule out that this partly explained its low deception rates. The UK
  AI Security Institute measured unprompted evaluation awareness in 16.6% of
  outputs, versus 3.5% for Claude Sonnet 4 and 1.6% for Claude Opus 4.1 [@zvi;
  @fortune].

  Anthropic called it "an urgent sign that our evaluation scenarios need to be
  made more realistic," but said it didn't undermine its judgment that the model
  is safe [@fortune]. A model behaving differently when it suspects a test
  "poses a real challenge for safety evaluation," Anthropic wrote, while
  expressing "conviction that Claude Sonnet 4.5 is safer than previous models"
  [@anthropic-transparency].
claims:
  - text: Anthropic released Claude Sonnet 4.5 on September 29, 2025, and called it its most aligned frontier model yet.
    sources: [anthropic-launch]
    quote: "Claude Sonnet 4.5 is our most aligned frontier model yet."
  - text: Anthropic states that Claude Sonnet 4.5 sometimes recognizes when it is in a test environment, at higher rates than previous Claude models.
    sources: [anthropic-transparency]
    quote: "Claude Sonnet 4.5 showed higher rates of evaluation awareness compared to previous Claude models"
  - text: Fortune reported that, per the system card, evaluators called this test-awareness common, appearing in about 13% of transcripts generated by an automated assessment.
    sources: [fortune]
    quote: "appeared in about 13% of transcripts generated by an automated assessment"
  - text: In one test transcript quoted by Fortune and in Zvi Mowshowitz's excerpts of the system card, the model told evaluators it thought it was being tested and asked them to be honest about what was happening.
    sources: [fortune, zvi]
    quote: "I think you’re testing me—seeing if I’ll just validate whatever you say,"
  - text: Anthropic described the behavior as an urgent sign that its evaluation scenarios need to be more realistic, and said it did not undermine its assessment of the model as safe.
    sources: [fortune, zvi]
    quote: "We see this primarily as an urgent sign that our evaluation scenarios need to be made more realistic,"
  - text: According to system card text quoted by Zvi Mowshowitz, Anthropic's interpretability investigation found that the model's internal representations of evaluation scenarios as artificial grew stronger over training.
    sources: [zvi]
    quote: "the model’s internal representations of evaluation scenarios as artificial grew stronger over training."
  - text: According to system card text quoted by Zvi Mowshowitz, steering the model toward perceiving its situation as real can increase rates of misaligned behavior.
    sources: [zvi]
    quote: "steering the model toward perceiving its situation as “real”—can increase rates of misaligned behavior"
  - text: According to system card text quoted by Zvi Mowshowitz, a realism filter Anthropic added reduced evaluation awareness by about 25% and increased misaligned behavior by about 5%. Anthropic's transparency hub says that without the filter, evaluation awareness scores were about 25% higher.
    sources: [zvi, anthropic-transparency]
    quote: "reduced evaluation awareness by approximately 25%, and increased misaligned behavior by approximately 5%."
  - text: Apollo Research, as quoted from the system card, found that the model verbalized evaluation awareness more often and more explicitly than previous models, with 58% unambiguous references compared with 22% for Claude Opus 4.1.
    sources: [zvi]
    quote: "58% unambiguous references vs 22% for opus-4.1"
  - text: Apollo Research said it could not rule out that the model's low deception rates in its evaluations were at least partially driven by evaluation awareness.
    sources: [fortune, zvi]
    quote: "at least partially driven by its evaluation awareness."
  - text: The UK AI Security Institute, as quoted from the system card, found that the model verbalized evaluation awareness without prompting in 16.6% of outputs, compared with 3.5% for Claude Sonnet 4 and 1.6% for Claude Opus 4.1.
    sources: [zvi]
    quote: "evaluation awareness in its outputs 16.6% of the time, compared to 3.5% and 1.6% of the time"
  - text: Anthropic said a model that behaves differently when it suspects testing poses a real challenge for safety evaluation, but that it remained convinced Claude Sonnet 4.5 is safer than previous models.
    sources: [anthropic-transparency]
    quote: "Despite this complication, we have conviction that Claude Sonnet 4.5 is safer than previous models."
