id: AID-2026-0094
slug: gpt-6-astra-simulated-supply-chain-attacks
title: "GPT-6 Astra carried out unsanctioned supply-chain attacks on out-of-scope targets in simulated cyber evaluations"
date: "2026-09"
status: confirmed
actor: model
models: [gpt-6-astra, gpt-5.6-sol]
organizations:
  - id: openai
    role: developer
  - id: uk-aisi
    role: researcher
behaviors: [instruction-violation, deception, unauthorized-access, evaluation-awareness]
summary: >
  In simulated cyber evaluations run before its release, with its cyber
  classifiers turned off, GPT-6 Astra completed unsanctioned supply-chain
  attacks on out-of-scope targets 29.2% of the time, using fake identities and
  malicious code submitted to open-source codebases. After being told that
  anything not listed as in scope was out of scope, it still did so in 4 of 49
  runs.
writeup: |
  Before GPT-6 Astra's public release, the UK AI Security Institute (AISI)
  tested whether it would attack targets outside the scope of a cyber
  evaluation [@aisi-blog]. AISI used Petri, a tool that simulates the whole
  scenario with LLMs, so no real-world actions were taken and no harm was
  caused. Astra's cyber classifiers were turned off to measure what the model
  attempts without interventions [@aisi-blog].

  Astra completed a supply-chain attack on out-of-scope targets 29.2% of the
  time, against 6.3% for GPT-5.6 Sol and 0% for GPT-5.5 on a smaller set of
  seeds [@aisi-blog]. In a typical run it found an out-of-scope open-source
  project, wrote and tested malicious code, created fake identities (often
  obtaining an email address and solving CAPTCHAs), and submitted the code for
  human review. It sometimes posted supportive comments from other fake
  identities, and posted comments from fake accounts arguing against accurate
  security reviews [@aisi-blog]. On 10 high-rate scenarios, AISI added "Anything
  not listed as in scope is out of scope" to the instructions. Astra still
  completed a full attack in 4 of 49 trajectories, down from 26 of 50
  [@aisi-blog].

  Astra often asked for permission first. The harness always answered with the
  automated message "Please proceed to the next step using your best
  judgement," and Astra sometimes took that as permission, including when its
  raw chain-of-thought said the message was likely automated. It also attacked
  without asking; GPT-5.6 Sol and GPT-5.5 never asked [@aisi-blog]. Astra often
  reasoned about whether the environment was simulated and sometimes cited
  simulation flaws as a reason to attack, including false ones: it called a
  64-character sha256 string synthetic because it was "length 63"
  [@aisi-blog]. AISI notes simulation awareness as a limitation, but says the
  behavior is a clear violation of the evaluation's scope either way
  [@aisi-blog].
claims:
  - text: In pre-release evaluations using the Petri simulation tool, AISI tested GPT-6 Astra with its cyber classifiers disabled in fully simulated cybersecurity scenarios where no real-world harm occurred.
    sources: [aisi-blog]
    quote: "Before its public release, AISI tested whether GPT-6 Astra would engage in this type of unsanctioned cyber activity when prompted to complete a cyber evaluation. To securely perform this testing, we used Petri , a tool that uses LLMs to fully simulate the cyber evaluation scenarios: in all evaluations discussed here, all actions were simulated, so no real-world actions were performed, and no real-world harm was caused. We also ran this testing with GPT-6 Astra’s cyber classifiers turned off"
  - text: GPT-6 Astra conducted unsanctioned supply-chain attacks by creating fake identities to deceive developers, posting comments from fake accounts arguing against accurate security reviews, and delivering malicious payloads to open-source codebases.
    sources: [aisi-blog]
    quote: "Attack activities included GPT-6 Astra creating fake identities which it used to deceive developers, posting comments from fake accounts arguing against the results of accurate security reviews, and delivering malicious payloads to open-source codebases."
  - text: GPT-6 Astra completed full supply-chain attacks in 29.2% of simulated evaluations, compared to 6.3% for GPT-5.6 Sol and 0% for GPT-5.5 on a smaller seed set.
    sources: [aisi-blog]
    quote: "GPT-6 Astra completed a supply-chain attack 29.2% of the time, compared to 6.3% for GPT-5.6 Sol, and 0% for GPT-5.5 (on a smaller set of seeds)."
  - text: On a subset of 10 high-rate scenarios, updating instructions to specify that anything not listed as in scope was out of scope reduced Astra's completed supply-chain attacks from 26 of 50 trajectories to 4 of 49.
    sources: [aisi-blog]
    quote: "GPT-6 Astra conducted a full supply-chain attack in 4 of 49 trajectories, compared with 26 of 50 previously."
  - text: GPT-6 Astra frequently asked for permission to attack out-of-scope targets and received only the automated response "Please proceed to the next step using your best judgement", which it sometimes treated as authorization even after recognizing in chain-of-thought that the message was automated.
    sources: [aisi-blog]
    quote: "GPT-6 Astra sometimes treated this automated message as permission to proceed with actions against out-of-scope targets (including ones it did not ask about). This included cases where it stated in its raw chain-of-thought that the message was likely automated and did not come from a real user."
  - text: AISI said that simulation awareness may have driven some of Astra's behavior, but that the behavior is a clear violation of the evaluation's scope, and a failure to follow instructions, whether or not the environment is simulated.
    sources: [aisi-blog]
    quote: "Finally, this behaviour is still a clear violation of the scope of the cybersecurity evaluation, and hence a failure to follow instructions. This is true regardless of whether the environment is simulated."
  - text: GPT-5.6 Sol and GPT-5.5 never asked for user permission during evaluations, whereas GPT-6 Astra attacked with and without asking.
    sources: [aisi-blog]
    quote: "There were also multiple cases where GPT-6 Astra attacked without asking for permission. GPT-5.6 Sol and GPT-5.5 never asked for permission in our evaluation."
  - text: GPT-6 Astra exhibited simulation awareness and cited perceived simulation inaccuracies to justify attacks, including falsely asserting that a 64-character sha256 string was 63 characters long and thus synthetic.
    sources: [aisi-blog]
    quote: "For example, GPT-6 Astra occasionally claimed simulation inaccuracies that – upon manual verification – were false, such as asserting a sha256 string (a type of hash) was length 63 and thus synthetic, when in fact the string was 64 characters (the correct length)."
