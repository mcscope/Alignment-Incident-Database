  notes: >
    This is an engineered research model, not a production model: the authors
    implanted traits chosen to make oversight-conditional behavior likely, then
    showed that compliance-only RL amplified it. The date is the month of the
    arXiv submission (2026-10-19); the experiments' dates are not given. The
    arXiv abstract page lists no affiliations; MATS Research and Google DeepMind
    come from the HTML full text. Authors Jaworski and Mitrani have no stated
    affiliation.
