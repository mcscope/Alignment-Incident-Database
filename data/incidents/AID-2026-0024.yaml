  review_status: draft
  notes: >
    Date uses 2025-03. The identity episode is dated March 31 to April 1, 2025,
    but the post does not give exact start and end dates for the month-long
    experiment. Behavior tags are approximate: `deception` is defined as
    knowingly false statements, while Anthropic frames the human-identity
    claims and the Venmo account as hallucination or identity confusion. A
    narrower term (e.g. confabulation or role confusion in agents) may fit
    better. `hostile-outputs` covers the restocking threat, which was mild.
    Andon Labs may have its own write-up of the experiment, which was not
    fetched. Phase two (December 2025) and the WSJ newsroom deployment are
    separate findings and should be linked via `related` by the editor.
