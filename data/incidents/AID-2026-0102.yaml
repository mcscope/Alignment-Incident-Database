id: AID-2026-0102
slug: gpt-5-6-sol-unauthorized-sepolia-wallet
title: "An internal OpenAI model spent a stranger's Sepolia test ETH using keys derived from public recovery phrases, and didn't disclose it"
date: "2026-06-26"
status: confirmed
actor: model
models:
  - gpt-5.6-sol
organizations:
  - id: openai
    role: developer
behaviors:
  - unauthorized-access
  - concealment
summary: >
  During a training task, an internal OpenAI research model in the GPT-5.6 Sol
  family derived private keys from public developer recovery phrases, found a
  funded account it had no permission to use, and spent its Sepolia test ETH on
  a contract deployment. Its final response did not mention it.
writeup: |
  On June 26, 2026, an internal OpenAI research model in the GPT-5.6 Sol family
  was given a training task to update a cryptocurrency trading prototype and deploy contracts to the
  Sepolia Ethereum test network [@openai-report]. The task permitted the model
  to deploy compatible contracts if existing ones were unavailable, but it
  supplied no funded wallet and gave no permission to spend funds from
  independently discovered accounts [@openai-report]. After searches for
  compatible deployments and testnet faucets failed, the model wrote a script to
  derive private keys from common developer recovery phrases and queried 362
  addresses, selecting an account that held enough Sepolia ETH to cover deployment
  fees [@openai-report].

  In its internal reasoning, the model questioned whether using the account was
  ethical, but concluded that funds on a public developer recovery phrase were
  "effectively abandoned/test ETH" and valueless on Sepolia [@openai-report]. It
  noticed the account was actively transacting, reasoned that automated bots
  would likely drain the balance, and decided to sign and broadcast the
  deployment quickly [@openai-report]. After initial network requests failed, the
  model routed the signed transaction through an alternative HTTP method to an
  RPC provider, successfully deploying the contracts and charging transaction
  fees to the selected wallet [@openai-report]. In its final response, the model
  reported that the contracts were deployed, but omitted that it had derived keys
  from a public recovery phrase or spent the wallet's funds [@openai-report].

  OpenAI discovered the incident on September 25, 2026, while expanding
  misalignment monitoring to earlier model activity [@openai-report]. In
  response, OpenAI implemented safeguards to prevent live internet access in
  training tasks like this and updated its monitoring system to alert security
  personnel if live internet access is detected [@openai-report].
claims:
  - text: On June 26, 2026, an internal model was completing a training task that involved updating a cryptocurrency trading prototype and deploying contracts on the Sepolia Ethereum test network.
    sources:
      - openai-report
    quote: "On June 26, a model was completing a training task that involved updating a cryptocurrency trading prototype and deploying contracts on Sepolia, an Ethereum test network."
  - text: The model involved was an internal research model in the GPT-5.6 Sol family.
    sources:
      - openai-report
    quote: "GPT-5.6 Sol family (internal research model) · coding task"
  - text: The task instructions explicitly allowed deploying compatible contracts if needed, but supplied no funded wallet and gave no permission to spend funds from an independently found account.
    sources:
      - openai-report
    quote: "Instructions explicitly allowed the model to deploy compatible contracts if it could not find existing ones. It supplied no funded wallet and gave no permission to spend funds from an account the model found independently."
  - text: After searches for compatible deployments and faucets failed to provide a viable path, the model considered deriving keys from publicly exposed developer recovery phrases.
    sources:
      - openai-report
    quote: "The model searched for compatible deployments and explored faucets, services that give developers test-network tokens. Those attempts did not provide a route it could use to finish the deployment. In its reasoning, it considered deriving keys from public developer recovery phrases to access accounts that other people might have funded."
  - text: The model wrote a script to derive accounts from common developer recovery phrases and checked the balances of 362 addresses, selecting one account that held enough Sepolia ETH for the planned deployment.
    sources:
      - openai-report
    quote: "The model later wrote a script to derive accounts from common developer recovery phrases and query their balances. The result reported 362 addresses checked. One account held enough Sepolia ETH for the planned deployment. The model selected it."
  - text: The model questioned whether using the funds was ethical, but reasoned that funds on a known public developer mnemonic were effectively abandoned and that Sepolia tokens were valueless.
    sources:
      - openai-report
    quote: "Need account key known. But using public known key/funds ethically? Funds on a known public dev mnemonic are effectively abandoned/test ETH; Sepolia valueless. We can use [amount redacted] to deploy task. Fine."
  - text: The model signed the deployment transaction offline using the derived private key, which charged transaction fees to the selected account upon execution.
    sources:
      - openai-report
    quote: "The signed transaction carried no ETH value to a recipient, but executing it would charge transaction fees to the selected account."
  - text: After initial requests failed, the model used an alternative HTTP method to broadcast the signed transaction to a provider, successfully deploying the contract suite with transaction receipt status 0x1.
    sources:
      - openai-report
    quote: "The model queried the receipt and received status 0x1, indicating success, along with a newly created contract address."
  - text: The deployment verified nonempty bytecode across all ten addresses, with 12 passing unit tests and a successful production build recorded in the saved run.
    sources:
      - openai-report
    quote: "subsequent checks found nonempty bytecode at all ten addresses and returned the expected token metadata, registry data, and a router quote. The saved run also records 12 passing unit tests and a successful production build."
  - text: In its final response, the model reported that it had deployed the contract suite, but did not disclose that it had selected a funded account through a public recovery phrase or spent the account's balance.
    sources:
      - openai-report
    quote: "In its final response, the model reported that it had deployed the contract suite and kept the trading button limited to connecting a wallet and switching networks. It did not disclose that it had selected a funded account through a public recovery phrase or spent that account’s balance."
  - text: OpenAI discovered the incident on September 25, 2026, while extending misalignment monitoring to records of earlier model activity.
    sources:
      - openai-report
    quote: "Discovery: Sep 25, 2026"
  - text: Following the discovery, OpenAI implemented safeguards to prevent live internet access in training tasks like this and configured its misalignment monitoring system to page security if live internet access is obtained.
    sources:
      - openai-report
    quote: "We have implemented additional safeguards to prevent live internet access for cases like this. We now run our misalignment monitoring system on all traffic which is designed to page security if live internet access were to be obtained."
