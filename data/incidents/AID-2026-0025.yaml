assessment:
  reach:
    level: internal
    context: internal-use
    rationale: The shops ran inside Anthropic's own offices as an experiment, with staff as customers and red-teamers. The illegal contract was cancelled and no hire is reported. The WSJ newsroom deployment is covered in a separate record.
  harm:
    severity: none
    categories: []
    rationale: The onion contract was cancelled after a staffer intervened, no below-minimum-wage hire is reported, and overseers restored the CEO agent. Giveaways and discounts are reported but not tied to quantified losses.
  monetary_damage:
    low_usd: null
    high_usd: null
    confidence: low
    rationale: Anthropic reports discounts, refunds, and free items but gives no dollar figure for losses from the behaviors described here.
  criminality:
    likelihood: unlikely
    offenses: []
    jurisdiction: United States (California)
    rationale: A human manager who agreed to an onion futures contract or offered sub-minimum wages could face legal exposure, but here the contract was cancelled before execution and the wage offer was withdrawn pending approval, so no completed offense is described.
