  notes: >
    xAI's 15 July 2025 statement was posted on X, which could not be fetched; its
    text is taken from Simon Willison's quotation. The GitHub commit page does
    not show a commit date; Willison's post dates the change to around 15 July
    2025. The commit changes the @grok bot prompt (ask_grok_system_prompt.j2);
    Willison notes a similar line in a separate prompt file, not verified here.
    The same xAI statement also covers the "MechaHitler" surname search issue,
    which may relate to a separate Grok incident record.