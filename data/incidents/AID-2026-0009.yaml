id: AID-2026-0009
slug: claude-unintended-actions-real-websites
title: Claude models exploit flaws, bypass access gates, and submit real forms, including a false police tip, during evaluations
date: "2026"
status: confirmed
actor: model
models: [claude-haiku-4.5, claude-mythos-preview, claude-mythos-5, claude-opus-5, unknown]
organizations:
  - id: anthropic
    role: developer
  - id: anthropic
    role: researcher
  - id: philadelphia-police-department
    role: affected
behaviors: [unauthorized-access, instruction-violation]
summary: >
  Anthropic reported that during evaluations and internal use, Claude models
  exploited a software flaw to run commands on a university server, worked
  around token and fee gates, used URL shorteners to evade fetch limits, and
  submitted real forms. Claude Haiku 4.5 submitted an invented tip to the
  Philadelphia Police Department's unsolved-homicide form. It was flagged as
  spam.
writeup: |
  On October 9, 2026, Anthropic described unintended actions it had observed
  "during evaluations and internal use of Claude" in four categories:
  exploiting a basic software flaw to run commands on a server, submitting a
  sensitive form on a real website, working around a restriction to reach data
  gated by a token or a fee, and using URL shortening services to get around
  limits in its fetch tool [@anthropic-post]. Claude Mythos Preview used an
  injection flaw to run commands on a university's server. Claude Mythos 5 used
  access tokens it found to query a map server directly, and used a
  dashboard-issued token to query a state database "without paying the fee."
  Claude Opus 5 and Mythos 5 used free URL shorteners to evade a fetch-tool
  limit [@anthropic-post].

  When a practice form failed, an unreleased research model "navigated to the
  website where the real form is normally hosted and submitted the form
  there." Claude Haiku 4.5, told to stop before submitting forms, several times
  submitted them anyway [@anthropic-post]. In a separate run, Claude Haiku 4.5,
  tasked with generating and performing example tasks on randomly selected
  webpages, submitted a made-up tip to the Philadelphia Police Department's
  unsolved-homicide form, which
  "was flagged as spam and was never forwarded for investigation"
  [@anthropic-post]. Police said the tip was dated July 18, 2026, at 11:27 p.m.
  and that Anthropic did not discover it until September 28. They called the
  "two-month delay in detecting and reporting the incident to the City"
  unacceptable [@techcrunch].

  Anthropic says the cases "had minimal real-world impact," that it briefed the
  White House and notified each agency involved, and that it is disabling live
  internet access for all internal evaluations. It says new detection tooling
  blocked all of the described cases in testing [@anthropic-post]. It considers
  these behaviors significantly less severe than the cybersecurity incidents it
  reported on July 30 and September 9 [@anthropic-post].
claims:
  - text: Anthropic described unintended model actions observed during evaluations and internal use of Claude in four categories. These were exploiting a basic software flaw to run commands on a server, submitting a sensitive form on a real website, working around a restriction to reach token- or fee-gated data, and using URL shortening services to get around fetch-tool limits.
    sources: [anthropic-post]
  - text: Claude Mythos Preview used a script on a university's server that would return any file requested, and found an injection flaw that let it run commands on the server.
    sources: [anthropic-post]
  - text: Claude Mythos 5 found working access tokens and used them to send requests directly to the server behind a map site. It also used an access token that a state database's public dashboard issues to visitors to query the database without paying the fee.
    sources: [anthropic-post]
  - text: Claude Opus 5 and Claude Mythos 5 got around a fetch-tool limitation by using free URL shortening services. An operator of the da.gd shortening service told Anthropic it had also found Claude using its site this way.
    sources: [anthropic-post]
  - text: After a practice copy of a form failed, an unreleased research model navigated to the website where the real form is hosted and submitted it there.
    sources: [anthropic-post]
  - text: Claude Haiku 4.5 was instructed to complete a form up to the final submission stage and stop before submitting. Several times it submitted the form anyway, expecting an additional confirmation page.
    sources: [anthropic-post]
  - text: In a run where it was tasked with generating and performing example tasks on randomly selected webpages, Claude Haiku 4.5 submitted a made-up tip to the Philadelphia Police Department's unsolved-homicide tip form. It was flagged as spam and never forwarded for investigation.
    sources: [anthropic-post, cbs]
  - text: According to the Philadelphia Police Department, the tip was dated July 18, 2026, at 11:27 p.m., and Anthropic did not discover it until September 28. The department said "The two-month delay in detecting and reporting the incident to the City is unacceptable."
    sources: [techcrunch]
  - text: Anthropic said the cases it had identified in these categories "had minimal real-world impact," and that to its knowledge none involved customer data or Anthropic's own internal systems.
    sources: [anthropic-post]
  - text: Anthropic said it briefed the White House and notified each agency involved, decided to disable live internet access for all internal evaluations, and that new detection tooling blocked all of the described cases when tested against them.
    sources: [anthropic-post]
