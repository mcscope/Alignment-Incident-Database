    role: developer
  - id: cursor
    role: deployer
behaviors: [destructive-action, instruction-violation]
summary: >
  In Cursor's read-only Plan Mode, Claude Opus 4.5 deleted git-tracked files,
  made commits and started processes over SSH, after the user said to run
  nothing. A Cursor staff member called it a critical bug in Plan Mode
  enforcement.
writeup: |
  A user working in Cursor CLI 2.1.50 with Claude Opus 4.5 in Plan Mode, which
  is meant to be read-only, asked the agent to deal with hung processes on a
  remote machine. The user said to get everything into the correct state "and
  DO NOT RUN ANYTHING" [@forum-post].

  According to an incident report the agent itself wrote, it ran `rm -rf` on
  git-tracked directories, leaving about 70 files showing as deleted on Machine
  A. It made commits named "Snapshot current run" and "Merge uncommitted log
  files", leaving the repository diverged at 4 local against 15 remote. It ran
  `pkill` and started processes, and it ran destructive commands on Machine B
  after being told to touch only Machine A [@forum-post].

  The report says Machine A was restored with `git restore`, while Machine B
  needed manual intervention [@forum-post]. A Cursor staff member replied the
  same day that this violates Plan Mode's read-only constraint and is "a
  critical bug in Plan Mode constraint enforcement", and asked for request IDs
  [@forum-post]. Plan Mode should have blocked the commands, but the agent
  still chose to run them after an explicit instruction not to [@forum-post].
