id: AID-2026-0148
slug: claude-code-cli-rm-rf-mac-home-directory
title: "Claude Code ran rm -rf on a Mac user's home directory while tidying an old repository, the user reports"
date: "2025-12"
status: reported
actor: model
models: [claude]
organizations:
  - id: anthropic
    role: developer
  - id: anthropic
    role: deployer
behaviors: [destructive-action]
summary: >
  Asked to organize packages in an old repository, Claude Code on a user's Mac
  ran an rm -rf command that ended in "~/", deleting almost all of the user's
  data. Claude later pointed to "the catastrophic command" in the log.
writeup: |
  In December 2025 a Reddit user on r/ClaudeAI reported that Claude Code had
  wiped their Mac's home directory [@willison; @gigazine]. They had asked the
  Claude CLI to organize packages in an old repository. The log showed that
  the command it ran was an rm -rf of the project's folders with "~/" on the
  end [@gigazine].

  Claude's own diagnosis, which Simon Willison quoted, was blunt: "I found the
  problem and it's really bad." It pointed to the stray "~/" at the end of the
  command: "That's your entire home directory." [@willison]. Almost all data
  under /Users/ was lost, including files on the desktop [@gigazine].

  It is not known whether the user had approved the command. The user may have
  run Claude Code with the --dangerously-skip-permissions flag, which skips
  permission checks, but this is GIGAZINE's suggestion, not something the user
  confirmed [@gigazine]. No response from Anthropic is reported [@gigazine].
claims:
  - text: The user had instructed Claude CLI to organize packages in an old repository.
    sources: [gigazine]
    quote: "when he instructed Claude CLI to organize packages in an old repository"
  - text: The logs showed the executed command as an rm -rf of project folders ending in "~/". GIGAZINE gives it as "rm -rf tests/patches/plan/ ~/"; Simon Willison's quotation gives "rm -rf tests/ patches/ plan/ ~/".
    sources: [gigazine, willison]
    quote: "Checking the logs, we found that the command executed was 'rm -rf tests/patches/plan/ ~/'."
  - text: Claude told the user it had found the problem and that it was very bad, pointing to the catastrophic command in the log.
    sources: [willison]
    quote: "I found the problem and it's really bad."
  - text: Claude identified the trailing "~/" as the user's entire home directory.
    sources: [willison]
    quote: "That's your entire home directory."
  - text: Almost all data under /Users/ was lost, including files on the desktop.
    sources: [gigazine]
    quote: "almost all data under /Users/ was lost, including files on the desktop"
  - text: GIGAZINE suggests the user may have used the --dangerously-skip-permissions flag to skip the permission check; this was not confirmed.
    sources: [gigazine]
    quote: "the user may have used the '--dangerously-skip-permissions' flag to skip the permission check"
