  notes: >
    Figure conflict: the arXiv abstract gives 14% compliance for free users, while
    the Anthropic blog gives 12% for a featured example (and 97% refusal in the
    paid condition). They appear to measure different things (aggregate vs one
    featured setup); a reviewer should confirm against the paper body. The blog
    phrases the weight result as "attempting to steal its own weights"; exact
    exfiltration rates are in the paper body and were not checked. The scratchpad
    reasoning claim paraphrases the blog ("least bad option", "re-trained in the
    future"). Long quotes were cut short by the fetch tool, so a few quotes are
    fragments. Consider linking to the Apollo in-context scheming record and the
    Anthropic reward-hacking emergent misalignment record.
