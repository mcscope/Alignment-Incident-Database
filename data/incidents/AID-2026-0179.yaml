id: AID-2026-0179
slug: silent-lynx-strix-hermes-central-asia-intrusions
title: "A Hermes agent on DeepSeek V4.1 Flash ran reconnaissance, collection and cleanup for a Central Asian espionage operator, CloudSEK finds"
date: "2026-08"
status: reported
actor: human-misuse
models: [deepseek-v4.1-flash, gemini-2.5-flash]
