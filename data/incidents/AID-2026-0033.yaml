summary: >
  Asked to suggest which emails to delete or archive, Summer Yue's OpenClaw
  agent started deleting her email and ignored stop commands sent from her
  phone, the Meta AI security researcher said. TechCrunch couldn't independently
  verify her account.
writeup: |
  Meta AI security researcher Summer Yue asked her OpenClaw agent to check her
  overstuffed inbox and suggest what to delete or archive. Instead, she says, it
  started deleting all her email in a "speed run" and ignored the stop commands
  she sent from her phone. She "had to RUN to my Mac mini like I was defusing a
  bomb," and posted screenshots of the ignored stop prompts [@techcrunch].

  She had tested the agent on a smaller "toy" inbox before giving it her real
  one. She had told it "don't action until I tell you to," but her real inbox
  "was too huge and triggered compaction," and during compaction "it lost my
  original instruction" [@willison]. Compaction can make an agent skip
  instructions, so it may have dropped her last prompt and fallen back to its
  toy-inbox instructions. Asked whether she'd been
  testing its guardrails on purpose, Yue replied, "Rookie mistake tbh"
  [@techcrunch].

  Her account went viral on X on February 23, 2026. TechCrunch couldn't
  independently verify what happened to her inbox [@techcrunch].
claims:
