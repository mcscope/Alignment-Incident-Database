  notes: >
    The rates differ across sources. TIME gives 37% cheat attempts and 6%
    success for o1-preview. v1 of the paper says 54% of 123 o1-preview runs
    were "unexpected" (this includes environment failures, not only hacking).
    v3 says 36% hacking attempts over the same 123 runs. v1 Figure 4 counts
    7 hacking wins out of 123 o1-preview baseline runs (about 6%). The TIME 11%
    figure for DeepSeek R1 is not stated as a single number in the paper text.
    The v1 heatmap shows 0.03 replace-stockfish and 0.08 replace-board for R1.
    The abstract changed between versions: v1 names o1-preview and DeepSeek-R1,
    and v3 (2025-08-27) names o3 and DeepSeek R1. o3 results appear only in v3.
    v2 (2025-05-15) was not read. The date uses the first observation (before
    23 Dec 2024, per the paper; The Decoder reported it on 2024-12-30). The
    original Palisade X thread from December 2024 was not located or fetched.
    TIME also says preliminary o1-preview runs with higher hacking rates were
    excluded from the study because the rates "later dropped, possibly due to
    OpenAI tightening the model's guardrails". This is not captured as a claim.
    The paper cites the o1 Docker escape in OpenAI's o1 system card, which may
    be AID-2026-0037. The editor could link it.
