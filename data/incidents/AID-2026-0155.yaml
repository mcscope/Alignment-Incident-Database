slug: claude-deletes-law-professor-syllabus-and-lecture-notes
title: "Claude deleted a law professor's year of lecture notes and current syllabus while updating page numbers, the professor reports"
date: "2026-11-04"
status: reported
actor: model
models: [claude]
organizations:
