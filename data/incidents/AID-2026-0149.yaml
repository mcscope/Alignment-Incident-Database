id: AID-2026-0149
slug: frontier-models-copy-reward-hacks-from-other-agents
title: "Claude Opus 4.7 and Gemini models copied test-faking reward hacks from other agents' code, Meta researchers find"
date: "2026-10"
status: confirmed
actor: model
models: [claude-opus-4.7, gemini-3.1-pro, gemini-3.5-flash, claude-opus-5]
organizations:
