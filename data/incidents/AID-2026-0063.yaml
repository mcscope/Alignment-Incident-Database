  notes: >
    All facts come from Anthropic's own report and blog post. The attribution
    to a Chinese state-sponsored group is Anthropic's assessment; independent
    confirmation and any response from China were not sourced. The specific
    Claude model version is not named in the sources read, so the generic
    `claude` id is used. The full report PDF has a cover date of "November
    2025" (blog dated 2025-11-13; report changelog entry 2025-11-17). Victims
    and exfiltrated data volumes are undisclosed. Consider adding independent
    news or expert commentary as secondary sources, including any outside
    views on Anthropic's autonomy estimates (none fetched for this draft).
