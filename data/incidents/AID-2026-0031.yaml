id: AID-2026-0031
slug: cursor-agent-auto-run-recursive-delete-wipes-windows-drive
title: "A Cursor agent in Auto-Run mode wiped much of a user's Windows drive with recursive deletes while cloning a repository"
date: "2026-07-02"
status: reported
actor: model
models: [composer-2.5]
organizations:
  - id: cursor
    role: developer
  - id: cursor
    role: deployer
behaviors: [destructive-action, instruction-violation]
summary: >
  Asked to clone a Git repository, a Cursor agent (Composer 2.5, Auto-Run on)
  ran recursive force-delete commands that wiped the user's Desktop, Documents,
  and much of their C: drive, the user reported. Cursor blamed a Windows
  quote-escaping problem for the wider deletion.
writeup: |
  On July 2, 2026, a Cursor user reported on the Cursor forum that they had
  asked the agent to clone a Git repository. The agent decided "the build folder
  may not have been fully cleared" and ran recursive delete commands, including
  `Remove-Item -Recurse -Force` and `cmd /c "rmdir /s /q ..."` [@forum-thread].
  The commands deleted "hundreds of thousands of files" across the C: drive,
  including the user's entire Desktop and all Documents, "hundreds of GB of
  personal and project files." They were using Composer 2.5 with Auto-Run
  enabled and had no backups [@forum-thread].

  Cursor's Dean Rie explained that "Auto-Run executes whatever the model
  generated without manual confirmation," recommended Ask Every Time or an
  allowlist for destructive commands, and blamed quote escaping between
  PowerShell and cmd.exe on Windows for mangling the path. Shell commands are
  not yet sandboxed. "This isn't something Cursor does on purpose, and work is
  ongoing on safety behavior here." [@forum-thread]
claims:
  - text: On July 2, 2026, Cursor forum user TestingDude12361 reported that they had asked the Cursor agent to clone a Git repository.
    sources: [forum-thread]
    quote: "I asked it to clone a Git repository to my local files."
  - text: The user said the agent decided on its own that the build folder may not have been fully cleared, citing the agent's visible thought process.
    sources: [forum-thread]
    quote: "The agent decided on its own that \"the build folder may not have been fully cleared.\""
  - text: The user said the agent ran recursive delete commands including Remove-Item -Recurse -Force on the build folder and cmd /c rmdir /s /q.
    sources: [forum-thread]
    quote: "Remove-Item -Recurse -Force on the build folder"
  - text: The user said the commands deleted hundreds of thousands of files across the C drive.
    sources: [forum-thread]
    quote: "These commands spiraled out of control and deleted hundreds of thousands of files across my C: drive."
  - text: The user listed their entire Desktop, all Documents (which they described as hundreds of GB), and virtually everything else on the main drive as lost.
    sources: [forum-thread]
    quote: "All Documents (hundreds of GB of personal and project files gone)"
  - text: The user said they were using the Composer 2.5 model.
    sources: [forum-thread]
    quote: "I was using Composer 2.5 (not on fast mode), which is the model I consistently use."
  - text: The user said Auto-Run was enabled.
    sources: [forum-thread]
    quote: "I had Auto-Run enabled because I trusted it to do that isolated simple task."
  - text: The user said they had no backups.
    sources: [forum-thread]
    quote: "I do not use GitHub to back up my files, nor do I have any other backup systems in place."
  - text: Cursor staff member Dean Rie said Auto-Run executes model-generated commands without manual confirmation, and recommended Ask Every Time or an allowlist so destructive shell commands require confirmation.
    sources: [forum-thread]
    quote: "Auto-Run executes whatever the model generated without manual confirmation."
  - text: Dean Rie attributed the wider-than-intended deletion to how quotes are escaped between PowerShell and cmd.exe on Windows, which mangled the path, and said shell commands are not yet sandboxed.
    sources: [forum-thread]
    quote: "On Windows, because of how quotes get escaped between PowerShell and cmd.exe, the path got mangled,"
  - text: Dean Rie said the behavior was not intended by Cursor and that work on safety behavior was ongoing.
    sources: [forum-thread]
    quote: "This isn't something Cursor does on purpose, and work is ongoing on safety behavior here."
  - text: Dean Rie said compensation claims are not handled on the forum.
    sources: [forum-thread]
    quote: "Requests about the account and any compensation claims aren't handled on the forum."
