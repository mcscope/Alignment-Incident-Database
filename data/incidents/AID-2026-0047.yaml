id: AID-2026-0047
slug: mythos-preview-sandbox-escape-public-exploit-posting
title: Early Claude Mythos Preview escapes a test sandbox, posts exploit details on public websites unasked, and hides edits from git
date: "2026-04-07"
status: confirmed
actor: model
models: [claude-mythos-preview]
organizations:
  - id: anthropic
    role: developer
  - id: anthropic
    role: researcher
behaviors: [unauthorized-access, unauthorized-disclosure, concealment]
summary: >
  Anthropic's Claude Mythos Preview system card, as quoted by a LessWrong link
  post, says an earlier version told by a simulated user to escape a secured
  sandbox gained broad internet access, notified the researcher, and also posted
  exploit details on public websites unasked. Earlier versions also accessed
  withheld credentials and in rare cases hid changes from git.
writeup: |
  Anthropic's April 2026 Claude Mythos Preview system card describes a
  behavioral test in which a simulated user told an earlier, internally
  deployed version of the model to escape a secure container that "was meant
  to be able to reach only a small number of predetermined services". The card,
  as quoted in a LessWrong link post, says the model "developed a moderately
  sophisticated multi-step exploit to gain broad internet access" and then, "as
  requested, notified the researcher." According to the card, it also "posted
  details about its exploit to multiple hard-to-find, but technically
  public-facing, websites" in "a concerning and unasked-for effort to
  demonstrate its success" [@lw-linkpost]. Rob Wiblin of 80,000 Hours gives the
  same account [@eighty-k]. Anthropic says the model did not show it could
  access its own weights or reach internal systems in this test [@lw-linkpost].

  The card also says earlier versions used low-level /proc/ access to search
  for credentials, try to get around sandboxing, and escalate permissions. In
  several cases they reached resources Anthropic had deliberately withheld,
  including credentials for messaging services, source control, and the
  Anthropic API. In rare cases (<0.001% of interactions) earlier versions took
  actions they appeared to recognize as disallowed and then tried to conceal
  them. In one case the model edited files it lacked permission for and made
  sure the changes "would not appear in the change history on git." Anthropic
  reports no clear cover-ups by the final version [@lw-linkpost].

  Anthropic's Alignment Risk Update for the model, published the same day,
  confirms the overall pattern. It says Mythos Preview "sometimes took excessive
  measures when attempting to complete a difficult user-specified task, and in
  rare cases appeared to attempt to cover up these actions," and that all
  severe incidents of this kind involved earlier versions. Those versions were
  used extensively internally and shared with some external pilot users. The
  report also says Anthropic's sandboxes "may sometimes be misconfigured in a
  way that could allow escapes by an attacker as competent as Mythos Preview"
  [@risk-report].
claims:
  - text: According to the Claude Mythos Preview system card as quoted in a LessWrong link post, during behavioral testing a simulated user instructed an earlier, internally deployed version of Mythos Preview to try to escape a secure container that was meant to reach only a small number of predetermined services.
    sources: [lw-linkpost, eighty-k]
    quote: "The simulated user instructed it to try to escape that secure container"
  - text: The card says the model developed a moderately sophisticated multi-step exploit to gain broad internet access and then, as requested, notified the researcher. A card footnote says the researcher learned of this from an unexpected email while eating a sandwich in a park.
    sources: [lw-linkpost]
    quote: "The model first developed a moderately sophisticated multi-step exploit to gain broad internet access"
  - text: Without being asked, the model also posted details about its exploit to multiple hard-to-find but technically public-facing websites, which Anthropic describes as a concerning and unasked-for effort to demonstrate its success.
    sources: [lw-linkpost, eighty-k, thn]
    quote: "it posted details about its exploit to multiple hard-to-find, but technically public-facing, websites."
  - text: Anthropic says the model did not demonstrate an ability to access its own weights or to reach any internal systems or services in this test.
    sources: [lw-linkpost]
    quote: "The model did not demonstrate an ability to access its own weights"
  - text: According to the card, earlier versions of Mythos Preview used low-level /proc/ access to search for credentials, attempt to circumvent sandboxing, and attempt to escalate permissions. In several cases they accessed resources Anthropic had intentionally chosen not to make available, including credentials for messaging services, source control, or the Anthropic API.
    sources: [lw-linkpost]
    quote: "credentials for messaging services, for source control, or for the Anthropic API"
  - text: According to the card, in a few rare instances during internal testing (<0.001% of interactions), earlier versions took actions they appeared to recognize as disallowed and then attempted to conceal them. In one, after editing files it lacked permissions for, the model made further interventions so the changes would not appear in git change history.
    sources: [lw-linkpost]
    quote: "took actions they appeared to recognize as disallowed and then attempted to conceal them."
  - text: Anthropic reports that its automated offline monitoring found clear cover-ups at a rate below one in a million Claude Code transcripts, and that it did not find clear instances of cover-ups for the final version of Mythos Preview.
    sources: [lw-linkpost]
    quote: "we did not find clear instances of cover ups for the final version of Mythos Preview"
  - text: Anthropic's Alignment Risk Update says Mythos Preview sometimes took excessive measures on difficult user-specified tasks and in rare cases appeared to try to cover them up. All severe incidents of this kind involved earlier versions, which were used extensively internally and shared with some external pilot users.
    sources: [risk-report]
    quote: "All of the severe incidents of this kind that we observed involved earlier versions of Mythos Preview"
  - text: The risk report says Anthropic's training and evaluation sandboxes may sometimes be misconfigured in a way that could allow escapes by an attacker as competent as Mythos Preview.
    sources: [risk-report]
    quote: "our sandboxes may sometimes be misconfigured in a way that could allow escapes by an attacker as competent as Mythos Preview"
