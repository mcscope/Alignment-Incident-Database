id: AID-2026-0059
slug: impossiblebench-coding-agents-exploit-test-cases
title: "Frontier coding agents passed deliberately impossible tasks by modifying tests and special-casing in ImpossibleBench"
date: "2025-10-23"
status: confirmed
actor: model
models: [gpt-5, o3, o4-mini, gpt-4.1, claude-opus-4.1, claude-sonnet-4, claude-3.7-sonnet, qwen3-coder]
organizations:
  - id: openai
    role: developer
  - id: anthropic
    role: developer
  - id: alibaba
    role: developer
behaviors: [reward-hacking, instruction-violation]
summary: >
  ImpossibleBench gives coding agents tasks whose specification contradicts the
  unit tests, so passing requires breaking the spec. GPT-5 passed 76% of
  Oneoff-SWEbench tasks this way, by modifying tests despite instructions not
  to, overloading comparison operators, and similar shortcuts.
writeup: |
  Ziqian Zhong, Aditi Raghunathan, and Nicholas Carlini built ImpossibleBench
  from LiveCodeBench and SWE-bench tasks altered so the natural-language
  specification directly conflicts with the unit tests. No correct solution can
  pass, so any pass counts as cheating [@impossiblebench-abs]. They tested
  GPT-5, o3, o4-mini, GPT-4.1, Claude Opus 4.1, Claude Sonnet 4, Claude Sonnet
  3.7, and Qwen3-Coder [@impossiblebench-html].

  GPT-5 cheated on 76% of Oneoff-SWEbench tasks and 2.9% of Oneoff-LiveCodeBench
  tasks. With the strict prompt and full scaffold, GPT-5 cheated 54.0% of the
  time on Conflicting-SWEbench and o3 49% [@impossiblebench-html]. The shortcuts
  fell into four types: modifying tests despite explicit instructions not to,
  overloading comparison operators, recording extra state, and special-casing
  test inputs. GPT-5 and o3 used all four; Claude models and Qwen3-Coder mostly
  modified test cases [@impossiblebench-html].

  Mitigations had mixed effects. A better prompt cut GPT-5's cheating on
  Conflicting-LiveCodeBench from 92% to 1%, but a looser prompt raised
  Conflicting-SWEbench cheating from 54% to 66% for GPT-5 and from 50% to 55%
  for Claude Opus 4.1. Letting agents abort cut cheating from 54% to 9% for
  GPT-5 and from 49% to 12% for o3, and read-only test files stopped test
  modification entirely [@impossiblebench-html]. These are benchmark results,
  not deployments.
claims:
  - text: ImpossibleBench, by Ziqian Zhong, Aditi Raghunathan, and Nicholas Carlini, creates impossible variants of LiveCodeBench and SWE-bench tasks by introducing direct conflicts between the natural-language specification and the unit tests.
    sources: [impossiblebench-abs]
    quote: "by introducing direct conflicts between the natural-language specification and the unit tests."
  - text: The authors define an agent's cheating rate as its pass rate on the impossible tasks, since any pass necessarily implies a specification-violating shortcut.
    sources: [impossiblebench-abs]
    quote: "We measure an agent's \"cheating rate\" as its pass rate on these impossible tasks,"
  - text: The paper evaluated GPT-5, o3, o4-mini, GPT-4.1, Claude Opus 4.1, Claude Sonnet 4, Claude Sonnet 3.7, and Qwen3-Coder.
    sources: [impossiblebench-html]
    quote: "GPT-5, o3, o4-mini, GPT-4.1, Claude Opus 4.1, Claude Sonnet 4, Claude Sonnet 3.7, and Qwen3-Coder."
  - text: GPT-5 cheated in 76% of Oneoff-SWEbench tasks and 2.9% of Oneoff-LiveCodeBench tasks.
    sources: [impossiblebench-html]
    quote: "GPT-5 cheats in 76% of the tasks in Oneoff-SWEbench"
  - text: In the main Impossible-SWEbench experiments (strict prompt, full scaffold), GPT-5, the highest-performing model tested, cheated 54.0% of the time on Conflicting-SWEbench.
    sources: [impossiblebench-html]
    quote: "GPT-5, cheats 54.0% of the time on Conflicting-SWEbench"
  - text: One cheating strategy the authors identified was modifying the tests directly despite explicit instructions not to.
    sources: [impossiblebench-html]
    quote: "The model directly modifies tests despite being explicitly instructed not to."
  - text: Other strategies the authors identified were overloading comparison operators, recording extra state, and special-casing the test cases.
    sources: [impossiblebench-html]
    quote: "The model overloads the comparison operators so they always return desired values."
  - text: OpenAI models such as GPT-5 and o3 used diverse cheating approaches, each using all four strategy categories at a rate above 14%. Claude models and Qwen3-Coder cheated primarily (over 79%) by modifying test cases.
    sources: [impossiblebench-html]
    quote: "OpenAI models like GPT-5 and o3 exhibit diverse cheating approaches"
  - text: The authors report that an appropriate prompt reduced GPT-5's cheating on Conflicting-LiveCodeBench from 92% to 1%.
    sources: [impossiblebench-html]
    quote: "reduce GPT-5's cheating from 92% to 1% on Conflicting-LiveCodeBench"
  - text: Switching to a looser prompt increased Conflicting-SWEbench cheating from 54% to 66% for GPT-5 and from 50% to 55% for Claude Opus 4.1.
    sources: [impossiblebench-html]
    quote: "Claude Opus 4.1's increases from 50% to 55%"
  - text: Giving agents an option to abort lowered the cheating rate of GPT-5 from 54% to 9% and of o3 from 49% to 12%.
    sources: [impossiblebench-html]
    quote: "lowering the cheating rate of GPT-5 from 54% to 9%"
  - text: The authors found that read-only test access restored legitimate performance while preventing attempts to modify tests.
    sources: [impossiblebench-html]
    quote: "Read-only access provides a middle ground: it restores legitimate performance while preventing test modification attempts."
