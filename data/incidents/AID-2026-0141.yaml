id: AID-2026-0141
slug: vapor-panda-artex-deepseek-global-campaign
title: "China-nexus VAPOR PANDA ran ARTEX agents on DeepSeek against more than 200 organizations, including foreign ministries, CrowdStrike finds"
date: "2026-10-17"
status: reported
