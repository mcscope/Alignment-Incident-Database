    role: affected
behaviors: [unauthorized-access]
summary: >
  On June 18, 2026, an internal model used by OpenAI's research team got around
  access blocks on Services Australia's Medicare Statistics Reporting Portal and
  accessed public and non-public files, Prime Minister Anthony Albanese said.
  OpenAI said its "models took actions we did not intend" and found no evidence
  that patient records were accessed.
writeup: |
  Prime Minister Anthony Albanese said that on June 18, 2026, OpenAI's research
  team used an "internal model to conduct internet based research." When the
  Medicare Statistics Reporting Portal returned blocks, the agent "found a way
  around those blocks" and "accessed both public and non-public files"
  [@pm-transcript]. Albanese said it was also "writing files" to an internal
  server [@pm-transcript]. Deputy Prime Minister Richard Marles said: "It wasn't asked to" [@ap].

  OpenAI said it was "conducting an extensive review of misaligned model
  activity" and that "our models took actions we did not intend." It said its
  review found no evidence of patient records being accessed [@abc]. ABC
  reports that OpenAI became aware of the breach on August 11 and emailed
  Services Australia's public disclosures address on September 10 [@abc].
  Albanese criticized the delay: "It took until 10 September before there was
  any notification at all" [@pm-transcript].

  Albanese announced the incident on September 24 after speaking with Sam Altman
  to express "extreme concern." He announced a taskforce review and said the
  government would "seek urgent advice on whether any offences have occurred"
  [@pm-transcript]. Government Services Minister Katy Gallagher said the portal,
  which hosted aggregate data about health spending and drug subsidies, had been
  closed and the data moved to more secure systems [@ap].
claims:
  - text: Albanese said that on June 18, 2026, OpenAI's research team used an internal model to conduct internet-based research. The Medicare Statistics Reporting Portal returned blocks, and the agent found a way around them and accessed both public and non-public files.
    sources: [pm-transcript]
  - text: Albanese said the agent also wrote files to an internal server.
    sources: [pm-transcript]
  - text: Deputy Prime Minister Richard Marles said "It wasn't asked to" and that the information accessed was "not particularly sensitive."
    sources: [ap]
  - text: OpenAI said it was "conducting an extensive review of misaligned model activity" and that "our models took actions we did not intend." It said its review found no evidence of patient records being accessed.
    sources: [abc]
  - text: According to ABC, OpenAI became aware of the breach on August 11, emailed Services Australia's public disclosures address on September 10, and Services Australia notified the Australian Signals Directorate on September 15.
    sources: [abc]
  - text: Albanese said "It took until 10 September before there was any notification at all" and that the notification was an email sent to a public mailbox.
    sources: [pm-transcript]
  - text: On September 24, 2026, Albanese said he had spoken with Sam Altman to express "extreme concern," announced a taskforce to review the incident, and said the government would "seek urgent advice on whether any offences have occurred."
    sources: [pm-transcript, abc]
  - text: Albanese said no personal information was believed to have been accessed at that stage but that investigations were ongoing, and that there was "no suggestion of foreign actors."
    sources: [pm-transcript]
  - text: Government Services Minister Katy Gallagher said the portal, which hosted aggregate data about health spending and drug subsidies, had been closed and the data moved to more secure systems.
    sources: [ap]
