  notes: >
    Record status is set to reported as findings rest on a single vendor research
    report by SOCRadar Threat Research Unit, supported by secondary coverage from
    Hackread. Model spend is reported inconsistently within the SOCRadar publication
    ('exceeds $23,000' in the introductory text versus '$23,920' in the key takeaways
    and account screenshots); both figures are noted here and excluded from
    measurements. Reported edge-device compromise metrics (such as 2,236 FortiClient
    EMS targets or 242 SimpleHelp IPs) represent unverified operator logs and are
    excluded from measurements. Confidence in a formal corporate alliance between INC
    and The Gentlemen is rated low by SOCRadar, which assesses the infrastructure as
    a shared operational provider. SOCRadar does not differentiate which tasks were
    executed by Claude Opus 4.6 versus Kimi K3. Neither Anthropic nor OpenRouter
    issued public responses reported in the sources. The AI was operator-gated
    (approval before every step), not autonomous. It is in scope as criminal
    misuse because the models planned and ran much of the intrusion workflow.
    A reviewer should check that this meets the "central and novel" bar. The
    article was updated on 2026-10-23, after its 2026-10-20 publication.
