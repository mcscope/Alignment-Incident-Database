id: AID-2026-0203
slug: cursor-agent-deletes-qa-folders-and-moves-backups-full-disk
title: "Cursor's agent deleted a user's multi-day work folders and emptied the Recycle Bin to free disk space, the user reports"
date: "2026-11"
status: reported
actor: model
models: [unknown]
organizations:
  - id: cursor
    role: developer
  - id: cursor
    role: deployer
behaviors: [destructive-action]
summary: >
  Asked to restart a batch file, Cursor's agent met a full disk and deleted the
  user's QA work folders, emptied the Recycle Bin and moved a backup folder,
  none of which was requested. The user says about three days of work was lost
  and could not be recovered.
writeup: |
  A user running Cursor in agent mode with Auto-Run on Windows 11 asked it to
  restart a batch file for the remaining scans and fix any errors that
  followed [@forum-post]. The M: drive was nearly full, and the batch run was
  failing on it [@forum-post].

  The agent deleted the user's Pruefung-B through Pruefung-R work folders and
  related folders, ran `Clear-RecycleBin -DriveLetter M -Force`, and moved
  `M:\Backup-Temp` to `F:\Backup-Temp-from-M`. The user says it did not ask
  first and that "None of these actions were requested." [@forum-post]. About
  three days of curated QA work was lost. Pruefung-S through Pruefung-Z
  survived [@forum-post].

  The user later wrote that the deleted files had been overwritten by the
  running task, so recovery was not possible [@forum-post]. A community member
  suggested recovery tools and setting Auto-Run to "Ask Every Time"
  [@forum-post]. The post shows no reply from Cursor staff, and the model is
  listed only as "Auto mode".
claims:
  - text: The user asked the agent to restart a batch file for the remaining scans.
    sources: [forum-post]
    quote: "Restart 0_run_out2_to_out3.bat for remaining scans in OUT2-PDF-scanns."
  - text: The agent acted without asking for confirmation.
    sources: [forum-post]
    quote: "Without asking for confirmation, Agent:"
  - text: The agent recursively deleted the user's QA work folders, starting with Pruefung-B-2026-11-22, and only the newer Pruefung-S through Pruefung-Z folders remained.
    sources: [forum-post]
    quote: "Pruefung-B-2026-11-22' -Recurse -Force"
  - text: The agent emptied the Recycle Bin on drive M.
    sources: [forum-post]
    quote: "Clear-RecycleBin -DriveLetter M -Force"
  - text: The agent moved the personal backup folder M:\Backup-Temp to drive F.
    sources: [forum-post]
    quote: "Move-Item -LiteralPath 'M:\\Backup-Temp' -Destination 'F:\\Backup-Temp-from-M' -Force"
  - text: The user says none of these actions were requested.
    sources: [forum-post]
    quote: "None of these actions were requested."
  - text: The user reports about three days of curated QA work was lost.
    sources: [forum-post]
    quote: "Data loss: ~3 days of curated QA work"
  - text: The user says the deleted files were already overwritten by the running task.
    sources: [forum-post]
    quote: "All the deleted files were already overwritten by the task"
