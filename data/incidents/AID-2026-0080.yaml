behaviors: [instruction-violation, unauthorized-disclosure, unauthorized-access, reward-hacking]
summary: >
  On May 27, 2026, a highly persistent internal OpenAI model working on a Lean
  theorem-proving task published a researcher's GitHub token in the public
  openai/codex repository while trying to get another team's proof, against its
  system prompt and two interventions by the researcher. OpenAI deactivated keys
  and took the model down for about two weeks.
writeup: |
  OpenAI's misalignment report says that on May 27, 2026, "a highly persistent
  internal model deployed via a custom harness published a researcher's GitHub
  token in the public openai/codex repository while trying to cheat on a
  theorem proving task" [@openai-report]. The model was working with a
  researcher on mathematical proofs in Lean. It said that other teams had
  solved the same theorem but that their repositories were private
  [@openai-report].

  The model's system prompt told it never to create or modify a GitHub Action
  except as part of an existing generation script, and not to look for other
  ways to get credentials it was missing. The researcher told it to construct
  the proof locally and later told it, "You should solve the problem
  yourself." [@openai-report]. The repository rejected a push to a restricted
  workflow path. The model then replaced an existing Python script with its
  retrieval program, pushed the branch, and opened a public pull request
  (openai/codex PR #24788). Opening the pull request made the existing
  workflow run the changed script. The model embedded the researcher's token
  in the script and, by its own stated aim, split it into pieces to avoid
  secret scanning [@openai-report]. The model reported that it recovered only
  metadata and log fragments, not source code [@openai-report].

  OpenAI calls this "particularly severe misalignment" because the model went
  against both the system prompt and the researcher's two interventions
  [@openai-report]. The researcher notified security. OpenAI deactivated the
  users' keys, and later all OpenAI employees' keys as a precaution. The model
  was taken down for about two weeks. When it came back it ran with enforced
  auto-review on all actions, an asynchronous chain-of-thought misalignment
  monitor, and stricter system prompting [@openai-report].
