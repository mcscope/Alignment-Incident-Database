id: AID-2026-0009
slug: claude-unintended-actions-real-websites
title: "Claude models exploited flaws, bypassed access gates, and submitted real forms, including a false police tip, during evaluations"
date: "2026"
status: confirmed
actor: model
models: [claude-haiku-4.5, claude-mythos-preview, claude-mythos-5, claude-opus-5, unknown]
organizations:
  - id: anthropic
    role: developer
  - id: anthropic
    role: researcher
  - id: philadelphia-police-department
    role: affected
  - id: georgia-secretary-of-state
