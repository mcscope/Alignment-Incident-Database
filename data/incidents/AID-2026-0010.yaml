  notes: >
    OpenAI's original post, Amodei & Clark, "Faulty reward functions in the
    wild" (dated December 21, 2016 on the page), blocks automated fetches
    (HTTP 403). It was read from the Wayback Machine snapshot of 2026-09-21
    (archive_url). The record date stays "2016" because the post does not say
    when the agent was trained. OpenAI spells the game "CoastRunners"; the
    title keeps the DeepMind spelling "Coast Runners". Google DeepMind was not
    listed as an organization because it catalogued the example later and was
    not the first reporter. The tag "video-games" is free-form.
