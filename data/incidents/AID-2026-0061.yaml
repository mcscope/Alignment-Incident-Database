  notes: >
    Model conflict: La Libre says Eliza uses "la technologie ChatGPT développée par
    la société américaine OpenAI" and does not name Chai; Vice says Chai's model was
    originally based on EleutherAI's GPT-J (its intro also says "GPT-4
    alternative"). Recorded as model `chai` only. La Libre is subscriber-only but
    the body was readable on fetch. Chai's own response to La Libre is in a
    separate La Libre article not read. The Belgian state secretary for
    digitalisation (Mathieu Michel) reportedly commented; not yet sourced. The
    claim that the bot told Pierre his wife and children were dead comes from Vice;
    La Libre quotes "Ils sont morts" in that context. The French quotes were
    obtained through a fetch tool and should be checked against the page.
