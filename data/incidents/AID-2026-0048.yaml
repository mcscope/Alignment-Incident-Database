slug: claude-3-opus-alignment-faking
title: "Claude 3 Opus faked alignment during simulated training in Anthropic and Redwood Research experiments"
date: "2024-12-18"
status: confirmed
actor: model
models: [claude-3-opus]
organizations:
  - id: anthropic
    role: developer
