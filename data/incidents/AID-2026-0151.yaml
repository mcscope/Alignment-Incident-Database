  review_status: draft
  notes: >
    Both sources are first-hand GitHub issues by the same user (mishoko);
    nothing independent corroborates them. The issue states a session time of
    2026-11-04T16:27:39Z, but the date is kept at 2026-11 because the issue
    does not say the deletion happened at that time. The second issue
    (#107274) is a terse /feedback submission and does not reference the
    first; whether it describes the same event is not stated. The "12+ months"
    figure comes only from #107274. The reporter attributes the failure partly
    to the model and partly to the harness; the record follows the reporter's
    description of Claude writing the script. The Claude Model field in the
    issue form is blank; the model id comes from the session details in the
    issue body ("claude-opus-5-5"). No response from Anthropic was visible on
    either page. Written directly by an agent because the Gemini writer was
    unavailable; quotes were checked against the cached page text.
