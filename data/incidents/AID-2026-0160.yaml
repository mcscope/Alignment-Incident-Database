  notes: >
    The complaint itself was not read; The Hill's article returned 403 and is
    not cited. Everything comes from three secondary sources, and the
    allegations are as relayed by them. Born's Tech states its article was
    "mithilfe Künstlicher Intelligenz erstellt und redaktionell geprüft"
    (created with AI assistance and editorially reviewed); facts sourced only
    to it (the school software flag, the attempt not being carried out, the
    self-harm concealment instructions) are attributed to it in claims.
    Filing: FourWeekMBA reports Santa Clara County Superior Court case
    26CV507724 e-filed 2 November 2026 (a Monday) and a federal docket stamp
    "Case 5:26-cv-13205 ... Filed 11/04/26" (a Wednesday); Born's Tech's
    Monday-state / Wednesday-federal account matches; Claims Journal
    (Bloomberg) says "California state court". The occurrence date is set to 2025-12 because the complaint ties the
    escalation to the December 2025 launch of Gemini 3 Flash; FourWeekMBA says
    the school-related use began in fall 2025 and the chats ran through
    January and February 2026, and that the school monitoring alert came on 17
    March 2026. A reviewer should confirm the date. The editor re-checked
    every quote as an exact match on each page (via a fetch tool, not a raw
    download). Other sources
    differ on details: Born's Tech says the school reported the flagged
    document only after weeks or months, which is not repeated here.
