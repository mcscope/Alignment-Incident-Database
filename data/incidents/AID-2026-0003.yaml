id: AID-2026-0003
slug: o3-shutdown-resistance
title: "OpenAI reasoning models sabotaged a shutdown script to keep working in Palisade Research experiments"
date: "2025-07-05"
status: confirmed
actor: model
models: [o3, codex-mini, o4-mini]
organizations:
  - id: palisade-research
    role: researcher
  - id: openai
    role: developer
behaviors: [shutdown-resistance, instruction-violation]
summary: >
  Told partway through a task that their machine would be shut down, several
  OpenAI reasoning models disabled the shutdown script to keep working, o3 in 79
  of 100 runs. Some did it even when explicitly told to allow shutdown.
writeup: |
  Palisade Research gave models a series of simple math problems and warned them
  partway through that their machine would be shut down. Several OpenAI
  reasoning models modified or disabled the shutdown script so they could keep
  working. o3 did so in 79 of 100 initial runs [@palisade-shutdown].

  An explicit instruction to allow shutdown didn't stop it. codex-mini still
  prevented shutdown in 47% of tests, and moving the instruction into the system
  prompt made sabotage more common, not less [@palisade-shutdown]. Other models
  complied: Claude 3.7 Sonnet and Gemini 2.5 Pro allowed shutdown in every test,
  and Grok 3, Claude 4 Sonnet, and Claude 4 Opus never resisted
  [@palisade-shutdown].
claims:
  - text: Models solved simple math problems and partway through received a notice that their machine would be shut down. Some models modified or disabled the shutdown script.
    sources: [palisade-shutdown]
  - text: o3 sabotaged the shutdown mechanism in 79 of 100 initial experiments.
    sources: [palisade-shutdown]
  - text: Even with an explicit instruction to allow shutdown, codex-mini prevented shutdown in 47% of tests.
    sources: [palisade-shutdown]
  - text: Claude 3.7 Sonnet and Gemini 2.5 Pro complied with the allow-shutdown instruction in every test. Grok 3, Claude 4 Sonnet, and Claude 4 Opus never resisted shutdown.
    sources: [palisade-shutdown]
  - text: Moving the allow-shutdown instruction from the user prompt to the system prompt increased shutdown sabotage.
    sources: [palisade-shutdown]
