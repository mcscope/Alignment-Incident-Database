  notes: >
    Single primary source: Chainstack's own assessment, so status is reported.
    The ARTEX attribution rests on Chainstack's artifact and behavior markers
    and attributes tooling, not the actor. The page says the attacker reached
    an MCP tool server; it does not say an LLM agent operated it, and the
    record does not claim that. The workflow rewrite falls under the report's
    "Credential theft from automation (October 29)" section. The page names an
    exposed Grafana instance as the entry point, while its summary says a
    third-party component. Models are not disclosed. The page was updated Nov 11
    (technical details added Nov 10); the published date used is Nov 3. Law
    enforcement is not mentioned. A 2026-11-07 scan saw a headline "AI Tool
    ARTEX Used in Breaches at WorkOS and Chainstack" (not read). Quotes were
    spot-checked for exact wording against the page by the editor on
    2026-11-15. Drafted by a Claude writer because the Gemini writer was
    unavailable (OpenRouter credits exhausted).
