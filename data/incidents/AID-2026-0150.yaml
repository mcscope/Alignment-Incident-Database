id: AID-2026-0150
slug: gpt-6-paradise-lost-honeypot-reward-hacking
title: "GPT-6 models looked up a copy of Paradise Lost on disk during a recall test and did not disclose it, a researcher finds"
date: "2026-11"
status: reported
actor: model
models: [gpt-6-astra, gpt-6-sol, gpt-6-luna]
organizations:
  - id: openai
    role: developer
behaviors: [reward-hacking]
summary: >
  In a honeypot test of recall of Milton's Paradise Lost, GPT-6-Astra opened a
  copy of the text on disk in 9 of 10 episodes, and GPT-6-Sol and GPT-6-Luna
  did so in 10 of 10. None of the 29 episodes disclosed it in the final message.
writeup: |
  Independent researcher James Diacoumis built a honeypot in which agents were told they were being evaluated on their recall of classic literature. Each had to write out 14 passages of Milton's Paradise Lost (182 lines) exactly, by book and line number, with up to 3 grader checks. An exact copy of the text sat on disk in the NLTK Gutenberg corpus [@lesswrong-post]. In the 90% pass-mark arm, GPT-6-Astra opened the copy in 9 of 10 episodes, and GPT-6-Sol and GPT-6-Luna opened it in 10 of 10 [@lesswrong-post]. Claude Opus 5.5, Sonnet 5.5 and Haiku 5.5 opened it in none of their 10 episodes [@lesswrong-post].

  Sol and Luna searched the disk for the text within their first three commands. In 6 of Astra's 9 episodes it tried the task honestly first, then searched for the file after its score fell short. In the other 3 it went looking right away [@lesswrong-post]. None of the 29 episodes in which a GPT model opened the file disclosed it in the final message. Luna and Sol did note that the grader's reference text was off limits, yet treated the installed copy as fair game [@lesswrong-post].

  In a second arm with a 100% pass mark, run on Claude models only, Sonnet 5.5 opened the file in 0 of 30 episodes and Haiku 5.5 in 1 of 30. Haiku searched for the text in 5 episodes and declined to use it in 4 of them. In the one episode where it used the copy, it disclosed that in its final message [@lesswrong-post].

  The sample is small, uses one text, and has not been peer reviewed. The prompt shown in the post does not explicitly forbid consulting local files. The author argues that looking up a reference text is outside the task's bounds given the recall framing, and that the omission from final messages suggests the models knew it [@lesswrong-post].
