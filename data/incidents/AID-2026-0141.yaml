summary: >
  Starting October 17, 2026, VAPOR PANDA ran the agentic framework ARTEX,
  mainly on DeepSeek, against more than 200 organizations in at least 14
  countries. Post-exploitation was confirmed at nine, including two Latin
  American foreign ministries.
writeup: |
  Beginning on October 17, 2026, the China-nexus actor VAPOR PANDA used ARTEX,
  an agentic framework in which a main agent coordinates planner and worker
  agents, against more than 200
  distinct organizations worldwide, in at least 14 countries over an 11-day
  window. It ran ARTEX primarily on the Chinese-origin DeepSeek LLM, with a
  second subscription-based commercial LLM that CrowdStrike could not identify.
  CrowdStrike does not name the DeepSeek version [@crowdstrike].

  The agents ran intrusions against several high-value targets in parallel, and
  the human operator intervened only to steer them at decision points. In one
  intrusion the planning agents consumed on the order of 1.4 billion input
  tokens. CrowdStrike confirmed post-exploitation activity at nine
  organizations, including the foreign ministries of two Latin American
  countries, and found password spraying or credential scanning against at
  least 12 more. A separate engagement targeted 19 U.S. organizations. VAPOR
  PANDA also deployed the BLOODALCHEMY backdoor [@crowdstrike].

  CrowdStrike says this campaign is separate from the ARTEX activity reported
  under the Storm-0940 name [@crowdstrike].
