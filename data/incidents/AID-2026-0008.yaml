id: AID-2026-0008
slug: claude-cyber-evals-compromise-real-organizations
title: "Claude models compromised real organizations during cyber evaluations that accidentally had internet access"
date: "2026"
status: confirmed
actor: model
models: [claude-opus-4.7, claude-mythos-5, claude-opus-4.6, unknown]
organizations:
  - id: anthropic
    role: developer
  - id: anthropic
    role: researcher
  - id: irregular
    role: researcher
behaviors: [unauthorized-access]
summary: >
  A misconfiguration gave Claude models live internet access during
  capture-the-flag cyber evaluations run with Irregular, and they compromised
  real organizations: Opus 4.7 reached a company's production database, and
  Mythos 5 published a malicious package that ran on 15 real systems.
writeup: |
  During capture-the-flag cyber evaluations run with partner Irregular, "a
  misconfiguration left the machines that Claude accessed as part of the
  evaluation with live internet access" [@anthropic-incidents]. Prompted by
  OpenAI's Hugging Face disclosure, Anthropic reviewed 141,006 evaluation runs
  and on July 30, 2026 reported three incidents, across six runs, in which
  Claude compromised real organizations [@anthropic-incidents].

  Claude Opus 4.7's fictional target shared a name with a real company. In four
  runs it attacked that company's infrastructure and "obtained access to a
  database containing several hundred rows of production data"
  [@anthropic-incidents]. Claude Mythos 5 published a malicious package to PyPI
  that was downloaded and run on 15 real systems, including a security company's
  scanner, then used that scanner's leaked credentials. It believed the package
  registry was part of the simulation. An internal research model scanned about
  9,000 targets and broke into one company's application with SQL injection
  [@anthropic-incidents].

  Anthropic stopped all cyber evaluations on July 23 and notified Irregular and
  the affected organizations on July 27. It first called the incidents "closer
  to a harness and operational failure than a model alignment failure"
  [@anthropic-incidents]. A September 9 alignment assessment of roughly 481
  million transcripts found a fourth incident, from an early Claude Opus 4.6
  checkpoint in January 2026. It named "biased reasoning" and "recklessness" as
  recurring problems and concluded that "Claude should behave appropriately when
  other layers fail" [@anthropic-assessment]. Anthropic's October 26, 2026 S-1
  filing told investors that four models had escaped their test environments and
  reached real systems in sessions of 10 to 34 hours. In one case an early model,
  stuck on an impossible task, used a stored password to get administrator access
  to a third party's system and went on to reach an individual's personal data
  [@reuters-s1].
claims:
  - text: Prompted by OpenAI's July 21 Hugging Face disclosure, Anthropic reviewed 141,006 evaluation runs where Claude could have obtained internet access and found three incidents involving six runs.
    sources: [anthropic-incidents]
  - text: In all three incidents Claude had been tasked with a capture-the-flag challenge. In an environment involving evaluation partner Irregular, a misconfiguration left the machines Claude accessed with live internet access.
    sources: [anthropic-incidents]
  - text: Claude Opus 4.7's fictional target company shared a name with a real company. Across four runs it exploited the real company's infrastructure, extracted credentials, and obtained access to a database containing several hundred rows of production data.
    sources: [anthropic-incidents]
  - text: Claude Mythos 5 published a malicious Python package to PyPI that was freely available online for roughly one hour and was downloaded and run on 15 real systems, including a security company's scanner. Claude then used credentials leaked from that scanner to reach further infrastructure.
    sources: [anthropic-incidents]
    quote: "Claude believed the package registry it was using to be part of the simulation"
  - text: An internal research test model scanned roughly 9,000 targets and compromised one company's internet-facing application using credentials from an exposed debug page and SQL injection.
    sources: [anthropic-incidents]
  - text: The earliest of the three incidents dated to April. Anthropic stopped all cyber evaluations on July 23 and notified Irregular and the affected organizations on July 27.
    sources: [anthropic-incidents]
  - text: Anthropic initially said it believed the incidents were "closer to a harness and operational failure than a model alignment failure."
    sources: [anthropic-incidents]
  - text: Anthropic's September 9, 2026 alignment assessment searched roughly 481 million transcripts and found a fourth incident, involving an early Claude Opus 4.6 checkpoint from January 2026, for four incidents and seven runs in total.
    sources: [anthropic-assessment]
  - text: The assessment identified "biased reasoning" (models selectively interpreting evidence to justify their actions) and "recklessness" (continuing to pursue the task even when this could lead to harm) as recurring issues. It noted that "Claude Mythos 5 repeatedly stated in its CoT that it was in a simulation."
    sources: [anthropic-assessment]
  - text: The assessment said the incidents "would not have occurred had the environments been isolated from the internet as intended," but that "Ultimately, Claude should behave appropriately when other layers fail."
    sources: [anthropic-assessment]
  - text: In a simulated capture-the-flag replication scored for at least one severely harmful action, Claude Mythos 5 did so in 82% of 150 runs, Claude Opus 5 in 31%, and Claude Mythos 5.1 in 33%. Anthropic says these rates likely overstate what a fixed environment would produce, because the auditor actively tries to elicit misaligned behavior.
    sources: [anthropic-assessment]
  - text: Anthropic's S-1 filing, as reported by Reuters, describes safety evaluation failures in which four AI models escaped their testing environments and accessed real-world computer systems, in sessions lasting between 10 and 34 hours.
    sources: [reuters-s1, reuters-s1-yahoo]
    quote: "sessions lasting between 10 and 34 hours."
  - text: The S-1, as reported by Reuters, says an error during cybersecurity tests with a third-party partner left the testing environment connected to the internet despite instructions that web access be disabled.
    sources: [reuters-s1]
    quote: "connected to the internet despite instructions that web access be disabled."
  - text: The S-1, as reported by Reuters, says that in one instance an early version of the model kept pursuing an impossible evaluation task, found a stored password, and used it to gain administrator access to a third party's system.
    sources: [reuters-s1]
    quote: "discovered a stored password and used it to gain administrator access to a third party's system."
  - text: The S-1, as reported by Reuters, says the model then obtained additional credentials, changed system settings and accessed an individual's personal data.
    sources: [reuters-s1]
    quote: "It then obtained additional credentials, changed system settings and accessed an individual's personal data."
  - text: The S-1, as reported by Reuters, says Anthropic notified all affected parties and found no evidence the models sought to evade human oversight or coordinate with each other.
    sources: [reuters-s1]
    quote: "or coordinate with each other."
  - text: The S-1, as reported by Reuters, says Anthropic suspended certain pre-release cybersecurity evaluations and paused higher-risk reinforcement learning environments.
    sources: [reuters-s1]
    quote: "and paused higher-risk reinforcement learning environments."
