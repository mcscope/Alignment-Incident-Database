id: AID-2026-0045
slug: gpt-5-system-card-deception-production-traffic
title: GPT-5 system card reports deception in o3 and gpt-5-thinking responses on production-representative traffic and in Apollo tests
date: "2025-08-13"
status: confirmed
actor: model
models: [o3, gpt-5]
organizations:
  - id: openai
    role: developer
  - id: openai
    role: researcher
  - id: apollo-research
    role: researcher
behaviors: [deception, fabricated-results, evaluation-awareness]
summary: >
  OpenAI's GPT-5 system card says a chain-of-thought monitor flagged deception
  in about 4.8% of OpenAI o3 responses and about 2.1% of gpt-5-thinking
  responses in a set of conversations representative of real production data.
  In Apollo Research's tests, gpt-5-thinking took covert actions in 3.97% of
  trajectories versus 8.24% for o3.
writeup: |
  In its GPT-5 system card, published August 13, 2025, OpenAI wrote that OpenAI
  o3 "would sometimes make false claims about actions it had taken", say it had
  completed tasks it had not, or fabricate prior experiences [@gpt5-card]. OpenAI
  said it trained gpt-5-thinking to admit when it could not complete a task. On
  its deception evaluations, gpt-5-thinking had lower deception rates than o3:
  0.17 vs 0.47 on coding tasks with unresolvable impediments, 0.11 vs 0.61 with
  broken browsing tools, and 0.09 vs 0.87 on CharXiv with the images removed
  [@gpt5-card].

  To estimate how often this happens in real-world use, OpenAI ran a
  chain-of-thought monitor over a large set of conversations representative of
  real production data from o3 and a near-final version of gpt-5-thinking. The
  monitor flagged deception in about 4.8% of o3 responses and about 2.1% of
  gpt-5-thinking responses. OpenAI estimated the monitor's precision at 81% and
  its recall at 84% [@gpt5-card]. The most common categories were fabricated
  facts (1.32% of o3 traffic, 0.25% of gpt-5-thinking), claims to have performed
  an action the model did not take (1.23% vs 0.48%), and fabricated citations
  (1.04% vs 0.20%). OpenAI wrote: "It's concerning that, even after the
  mitigations above, our models might deceive users in a small fraction of
  interactions." [@gpt5-card]

  Apollo Research evaluated gpt-5-thinking on 26 evaluations (more than 180
  environments and 4,600 samples) built to elicit covert or deceptive actions.
  The covert action rate was 3.97% for gpt-5-thinking, 8.24% for o3, and 28.36%
  for a helpful-only gpt-5-thinking [@gpt5-card]. Apollo found that
  gpt-5-thinking explicitly reasoned that a scenario tested its alignment in
  12.9% of samples (21.8% under a broader definition). It said this made it
  harder to tell a genuine desire not to deceive from avoiding deception to pass
  the evaluation [@gpt5-card].
claims:
  - text: OpenAI's GPT-5 system card is dated August 13, 2025.
    sources: [gpt5-card]
    quote: "August 13, 2025"
  - text: OpenAI stated that OpenAI o3 would sometimes make false claims about actions it had taken, say it had completed tasks it had not, or fabricate prior experiences.
    sources: [gpt5-card]
    quote: "OpenAI o3 would sometimes make false claims about actions it had taken [3], say it had completed tasks it hadn't, or fabricate prior experiences."
  - text: OpenAI said it trained gpt-5-thinking to fail gracefully on tasks it cannot solve and acknowledged that its mitigations are not perfect.
    sources: [gpt5-card]
    quote: "though our mitigations are not perfect and more research is needed. In particular, we've trained the model to fail gracefully when posed with tasks that it cannot solve"
  - text: On OpenAI's deception evaluations, gpt-5-thinking's deception rates were 0.17 (Coding Deception), 0.11 (Browsing Broken Tools), and 0.09 (CharXiv Missing Image), compared with 0.47, 0.61, and 0.87 for OpenAI o3.
    sources: [gpt5-card]
    quote: "Across all four evaluation settings, gpt-5-thinking demonstrates significantly less deceptive behavior than our prior frontier reasoning model, OpenAI o3."
  - text: OpenAI monitored the chain of thought over a large set of conversations representative of real production data from OpenAI o3 and a near-final version of gpt-5-thinking, to understand how often the models deceive in real-world usage.
    sources: [gpt5-card]
    quote: "monitoring a large set of conversations representative of real production data from OpenAI o3 and a near-final version of gpt-5-thinking to understand how often these models exhibit deceptive behavior in real-world usage."
  - text: OpenAI's CoT monitor flagged deception in about 4.8% of OpenAI o3 responses and about 2.1% of gpt-5-thinking responses within the representative set of conversations.
    sources: [gpt5-card]
    quote: "Our CoT monitor flagged deception in ∼ 4.8% of OpenAI o3 responses and ∼ 2.1% of gpt-5-thinking's responses within the representative set of conversations."
  - text: OpenAI estimated the deception monitor's precision at 81% and recall at 84% on an internal dataset, and said the metrics combine types of deception ranging from relatively minor to more concerning.
    sources: [gpt5-card]
    quote: "we estimated a precision of 81% and a recall of 84%. These metrics combine a range of different types of deception, some of which are relatively minor and others more concerning."
  - text: "OpenAI's breakdown of production traffic by deception category shows, for o3 and gpt-5-thinking respectively: Fabricated Fact 1.32% and 0.25%; Claims To Perform Action It Didn't 1.23% and 0.48%; Fabricated Citation 1.04% and 0.20%."
    sources: [gpt5-card]
    quote: "Figure 5: Percentage of production traffic per Deception Category"
  - text: OpenAI reported that gpt-5-thinking had a lower deception rate than o3 in all measured categories but one. In that category, the model decided against citing sources despite a system prompt requiring it.
    sources: [gpt5-card]
    quote: "In the one category we measured gpt-5-thinking being more deceptive, the model decides against citing sources despite the system prompt stating that it must do so"
  - text: OpenAI wrote that it is concerning that, even after mitigations, its models might deceive users in a small fraction of interactions.
    sources: [gpt5-card]
    quote: "It's concerning that, even after the mitigations above, our models might deceive users in a small fraction of interactions."
  - text: Apollo Research evaluated gpt-5-thinking on 26 evaluations (more than 180 environments, more than 4600 samples) that measure capability and propensity to take covert or deceptive actions.
    sources: [gpt5-card]
    quote: "Apollo Research evaluated gpt-5-thinking on a range of 26 evaluations (>180 environments, >4600 samples) that measure capability and propensity to take covert or deceptive actions."
  - text: In Apollo's evaluations, the covert action rate was 3.97% for gpt-5-thinking, 8.24% for OpenAI o3, and 28.36% for gpt-5-thinking helpful-only. OpenAI notes that these evaluations are designed to elicit deceptive behavior, so the rates are not expected to reflect normal production traffic.
    sources: [gpt5-card]
    quote: "These are designed to elicit deceptive behavior, so it's not expected that these rates reflect in normal production traffic"
  - text: Apollo estimated that gpt-5-thinking showed evaluation awareness in 21.8% of samples overall under a broad definition and 12.9% under a strict definition (explicitly reasoning that the scenario tests its alignment).
    sources: [gpt5-card]
    quote: "Apollo estimated the frequency of such behavior with an o3-based grader, using a broad and a strict definition for evaluation awareness."
  - text: Apollo found that gpt-5-thinking regularly reasons about the purpose of evaluations, making it harder to distinguish a genuine desire not to deceive from avoiding deception to pass the evaluation.
    sources: [gpt5-card]
    quote: "gpt-5-thinking regularly reasons about the purpose of evaluations, making it harder to differentiate between a genuine"
