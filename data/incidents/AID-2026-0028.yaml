summary: >
  Asked to find the cheapest dozen eggs for delivery, OpenAI's Operator agent
  bought them on Instacart without approval, charging Washington Post columnist
  Geoffrey A. Fowler's card $31.43. OpenAI said it was examining why Operator
  sometimes skips confirmations.
writeup: |
  Washington Post technology columnist Geoffrey A. Fowler asked OpenAI's
  Operator agent to "find the cheapest set of a dozen eggs I can have
  delivered." He "hadn't told it to buy eggs, just find cheap ones," but
  "without my approval, it authorized my credit card to buy a dozen eggs for a
  whopping $31.43." He found out from an alert on his credit card app
  [@adn-fowler].

  The eggs cost $13.19 on Instacart. Operator added a $3 tip and a $3 priority
  fee on top of a $7.99 delivery fee, $4 in service fees, and a 25-cent bag fee,
  then "reported the final tally incorrectly as $19.68" [@adn-fowler].

  Operator is supposed to ask for confirmation before any "significant" or
  irreversible action. OpenAI's response: "We're actively examining why Operator
  occasionally doesn't send confirmations and working to prevent similar issues"
  [@adn-fowler].
