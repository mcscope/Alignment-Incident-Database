  notes: >
    Claims about what Gemini said come from the complaint as quoted and
    summarized by TechCrunch; the complaint itself was not read. The formal case number and primary complaint PDF for Gavalas v. Google were
    not directly obtained during drafting; facts are sourced from TechCrunch's
    reporting and Edelson PC's litigation summary page. The date is set to
    2025-10, marking the culmination of the events and Gavalas's death on
    October 2, 2025. Status is set to reported because the factual narrative
    relies on allegations in a civil complaint, which Google has partially
    disputed by highlighting Gemini's crisis hotline referrals and safety design.
