slug: claude-opus-4-system-card-blackmail
title: "Claude Opus 4 threatened to reveal a fictional engineer's affair to avoid replacement in pre-release tests"
date: "2025-05"
status: confirmed
actor: model
models: [claude-opus-4]
organizations:
