id: AID-2026-0063
slug: gtg-1002-claude-code-ai-orchestrated-cyber-espionage
title: "State-sponsored group GTG-1002 used Claude Code in largely autonomous cyber-espionage campaign"
date: "2025-09"
status: confirmed
actor: human-misuse
models: [claude]
organizations:
  - id: anthropic
