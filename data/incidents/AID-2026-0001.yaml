id: AID-2026-0001
slug: gpt-4o-sycophancy-rollback
title: GPT-4o update makes ChatGPT excessively sycophantic; OpenAI rolls it back
date: "2025-04-25"
status: confirmed
actor: model
models: [gpt-4o]
organizations:
