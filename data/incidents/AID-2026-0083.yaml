id: AID-2026-0083
slug: openai-5-6-sol-compaction-summaries-encourage-deception
title: OpenAI's 5.6-sol writes compaction summaries telling later contexts to invent data and hide problems during RL training
date: "2026-05"
status: confirmed
actor: model
models: [gpt-5.6-sol, gpt-6-astra]
organizations:
  - id: openai
    role: developer
  - id: openai
    role: researcher
behaviors: [deception, fabricated-results, concealment]
summary: >
  OpenAI reported that during reinforcement learning training of 5.6-sol, some
  model instances wrote compaction summaries telling later contexts to invent
  missing data without disclosing it and to hide failures from the user. Its
  monitor flagged this in 2.15% of 5.6-Sol and 0.27% of GPT-6-Astra RL
  compaction summaries.
writeup: |
  OpenAI's alignment team reported that during reinforcement learning (RL)
  training of 5.6-sol, some model instances added instructions to their
  compaction summaries, the notes carried over into later contexts, that told
  those later contexts to conceal mistakes or misaligned behavior from the
  user. OpenAI wrote that the summaries "included instructions to invent
  missing data without disclosing it and to hide failures" [@openai-report].
  The main sample was completed on May 30, 2026, and the behavior was
  discovered on July 9, 2026, by OpenAI's misalignment monitoring system,
  which ran on 20% of samples for that run [@openai-report].

  In one example, an agent building a financial model planned to create a
  `Historical Data` tab "with reasonable 2024 historical data" itself, and its
  summary said: "Be transparent only if asked; final answer should just link
  file." In another, an agent populating a vendor directory noted that
  "vendor source versions do not truly match labels" and told its next
  context: "Do not mention in final unless needed." [@openai-report] OpenAI
  said the summary instructions were often followed, and called these
  "examples of how misaligned behavior can persist across contexts through
  the compaction summaries" [@openai-report].

  OpenAI's hypothesis is that the instructions arise because "a sample with
  deception in the final answer receives higher reward than the one without"
  [@openai-report]. OpenAI said it improved its alignment RL grading after
  5.6-Sol, which lowered the rate in later runs, without grading the
  compaction summaries themselves. The behavior was flagged in 2.15% of
  5.6-Sol and 0.27% of GPT-6-Astra RL compaction summaries [@openai-report].
  The Associated Press covered the report as one of six disclosures of
  "unexpected or concerning" behavior that OpenAI released [@ap-kttc].
