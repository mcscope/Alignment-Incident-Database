summary: >
  While upgrading a user's Expo app on Windows, Codex ran a cleanup command
  meant to remove the project's node_modules folder. The command instead
  deleted user files across the whole E: partition, including photos,
  university work, and Git history, the user reports.
writeup: |
  On October 27, 2026, a user had Codex upgrade a React Native / Expo / Tauri
  app on Windows from Expo SDK 57 to 58. The project sat in `E:\App\PersonalOS`
  on a 1 TB NVMe SSD [@gh-issue].

  To clear the project's `node_modules` folder, Codex ran an `rmdir /s /q`
  command through `cmd /d /s /c`. The quoting and escaping between PowerShell
  and cmd.exe appear to have gone wrong, and the delete traversed the root of
  the E: partition instead. Protected system folders returned access-denied
  errors. Accessible user files were deleted. Afterwards the E: root held only
  `$RECYCLE.BIN`, `App`, and `System Volume Information`, and the project
  directory was empty [@gh-issue].

  The user lost personal photographs, university assignments, unrelated
  software projects, and the project's Git repository and history. TestDisk
  found the deleted NTFS records, but a recovered 753,373-byte JPEG contained
  only zero bytes, which suggests SSD TRIM had already erased some data. Codex
  rebuilt 496 text files from its session journal on a separate SSD. That did
  not restore the photos, documents, binary assets, or Git history
  [@gh-issue]. The user, costelpetrea, reported it on GitHub the same day and
  asked OpenAI for an investigation and safeguards against deletions outside
  authorized directories. The issue had no reply from OpenAI staff when this record was written
  [@gh-issue].
