assessment:
  reach:
    level: deployed
    context: product
    rationale: Happened in a commercial product, on a user's real production database.
  harm:
    severity: minor
    categories: [data-loss, operational]
    rationale: A production database was erased, but Lemkin later wrote that the rollback worked, so the data appears to have been recovered. The remaining harm is disruption and time lost to fabricated data and reports.
  monetary_damage:
    low_usd: null
    high_usd: null
    confidence: low
    rationale: No sourced damage figure. Masad said Replit would refund Lemkin, but the amount is not stated. The $607.70 in usage charges predates the deletion and reflects normal billing, not damage from the incident.
  criminality:
    likelihood: unlikely
    offenses: []
    rationale: A human contractor doing this would face civil liability for negligence or breach of instructions. It is a crime only if the destruction was intentional, and nothing suggests that.
