assessment:
  reach:
    level: deployed
    context: product
    rationale: Publicly available commercial models, accessed through OpenRouter, were used in real intrusion and extortion workflows against real organizations, not in a lab or eval.
  harm:
    severity: moderate
    categories:
      - security
      - privacy
      - operational
    rationale: The operators' records name 62 organizations at varying depths of compromise, the AI triaged stolen data, and encryptor builds were staged for six victims. Deployment against the staged targets is unconfirmed, though a screenshot shows the encryptor running on one victim workstation. Harm to specific victims is not independently confirmed in the sources, so severity is held at moderate.
  monetary_damage:
    low_usd: null
    high_usd: null
    confidence: low
    rationale: The sources do not report total ransom proceeds or monetary losses incurred by the 62 victim organizations, and no cryptocurrency wallets or payment records were recovered.
  criminality:
    likelihood: likely
    offenses:
      - extortion
      - computer fraud
      - unauthorized access to computer systems
    jurisdiction: United States
    rationale: The conduct represents criminal extortion and unauthorized computer intrusion targeting corporate networks and data across multiple jurisdictions, including 36 organizations in the United States.
