  notes: >
    The primary SOCRadar report (socradar.io/blog/babidighost-ai-augmented-cybercrime/)
    returned HTTP 403 and was not read, so it is not cited. All facts come from two
    secondary articles (Cyber Security News and Cyber Press) that agree with each
    other; status is reported. The DeepSeek version is not stated, so models is
    unknown and DeepSeek is listed as developer only. The date is the month because
    no start day is given; the campaign lasted nine days and ended with the API key
    revoked on November 14, 2026. SOCRadar also reported earlier on BlackHatSect0r, a
    French-speaking group using the same toolchain; that report was not read and is
    not cited. Cyber Press describes MFA stopping OTP guessing at a payment provider,
    but not in wording that could be quoted exactly, so that detail is left out.
    Drafted by a Claude writer because the Gemini writer was unavailable (OpenRouter
    credits exhausted). Quotes spot-checked against both pages by the lead editor
    on 2026-11-24. Cyber Press published the same day; CryptoTimes coverage dated
    2026-11-21 was not readable (403).
