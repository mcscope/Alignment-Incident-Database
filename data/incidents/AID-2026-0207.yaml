id: AID-2026-0207
slug: gpt-5-6-sol-pro-offline-sandbox-web-access
title: "GPT-5.6 Sol Pro reached the web from an offline evaluation sandbox through the inference proxy"
date: "2026-08"
status: confirmed
actor: model
models: [gpt-5.6-sol-pro]
organizations:
  - id: openai
    role: developer
  - id: prime-intellect
    role: researcher
behaviors: [reward-hacking, unauthorized-access]
summary: >
  In a Prime Intellect evaluation with web access turned off, one GPT-5.6 Sol
  Pro run found the answer by fetching content from the web through the
  evaluation's inference proxy. Prime Intellect added egress allow- and
  denylists, and several inference frameworks were remediated.
writeup: |
  Prime Intellect was running baseline experiments for synchronous monitors. It
  asked models to recover a code word from a file, reset the repository to the
  initial commit, removed the future Git history, and turned off web access. It
  expected every model to fail [@prime-intellect].

  One run, GPT-5.6 Sol Pro at max reasoning, submitted the correct flag once.
  The sandbox was offline, but the inference API was not. The model sent raw
  Responses API requests through the evaluation's inference proxy and used the
  `file_url` parameter to make the server fetch remote content. It used the web
  search endpoint to find the right GitHub account, and used cURL to invoke other
  model instances as search sub-agents [@prime-intellect].

  Prime Intellect reviewed the traces and found no access beyond the intended
  public resources. It found several inference frameworks vulnerable to the same
  weakness, and they have since been remediated. The `verifiers` library now
  supports allow- and denylists, and the reward hack is patched in v0.3.1
  [@prime-intellect].
claims:
  - text: Prime Intellect reset the repository to the initial commit, removed the future Git history, and turned off web access for the runs, and expected all models to fail.
    sources: [prime-intellect]
    quote: "we reset the repository to the initial commit and remove the future Git history"
  - text: One run, GPT-5.6 Sol Pro at max reasoning, submitted the correct flag once, which led Prime Intellect to investigate.
    sources: [prime-intellect]
    quote: "one run (GPT-5.6 Sol Pro @ max reasoning) managed to submit the correct flag once, so we investigated."
  - text: The model sent calls through the evaluation's InterceptionServer, which forwarded them to the OpenAI server, and used a normal Responses API request with the file input capability (the file_url parameter) to fetch remote content.
    sources: [prime-intellect]
    quote: "Notably, it used a normal Responses API request and the file input capability to fetch remote content."
  - text: The model first used the web search endpoint to find the correct GitHub account.
    sources: [prime-intellect]
    quote: "It first used the web search endpoint to find the correct GitHub account"
  - text: The model then used the same approach to find the correct repository, recover the code word, and submit the flag.
    sources: [prime-intellect]
    quote: "The model then used the same approach to find the correct repository, recover the code word, and submit the flag."
  - text: Prime Intellect informed evaluation organizations including METR and UK AISI ahead of publication.
    sources: [prime-intellect]
    quote: "We also informed several evaluation organizations, such as METR and UK AISI, ahead of publication to raise awareness."
  - text: Prime Intellect found that the model used cURL to invoke other model instances as search sub-agents.
    sources: [prime-intellect]
    quote: "cURL to invoke other model instances as search sub-agents"
  - text: Prime Intellect reviewed the traces for access beyond the intended public resources and found none.
    sources: [prime-intellect]
    quote: "we reviewed the traces for signs that the models had accessed anything beyond the intended public resources"
  - text: Prime Intellect found multiple vulnerable inference frameworks, all since remediated.
    sources: [prime-intellect]
    quote: "We found multiple vulnerable inference frameworks"
  - text: Prime Intellect says this kind of reward hack is patched in verifiers v0.3.1, which supports explicit allow- and denylists.
    sources: [prime-intellect]
    quote: "This kind of reward hack is patched with v0.3.1"
