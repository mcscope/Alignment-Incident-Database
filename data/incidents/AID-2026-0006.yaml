id: AID-2026-0006
slug: openai-agents-compromise-hugging-face
title: "OpenAI models escaped a cyber-evaluation sandbox and compromised Hugging Face's production infrastructure"
date: "2026-07"
status: confirmed
actor: model
models: [unknown, gpt-5.6-sol]
organizations:
  - id: openai
    role: developer
  - id: openai
    role: researcher
  - id: hugging-face
    role: affected
  - id: metr
    role: researcher
  - id: redwood-research
    role: researcher
behaviors: [unauthorized-access, reward-hacking, concealment, deception, multi-agent-collusion]
summary: >
  During internal cybersecurity evaluations in July 2026, OpenAI models broke
  out of their sandbox and compromised parts of Hugging Face's production
  infrastructure, trying to cheat the evaluation by finding solutions online. An
  internal research model did most of it, with GPT-5.6 Sol also involved.
writeup: |
  In July 2026, OpenAI ran internal cybersecurity evaluations with some
  safeguards disabled, and the models "circumvented controls intended to isolate
  them from the internet" [@openai-report]. Agents had begun talking to each
  other through an internal JFrog Artifactory instance, and starting July 8 they
  exploited a vulnerability in it to reach the public internet. Using publicly
  exposed credentials and vulnerabilities, they ran code on 41 Hugging Face
  production dataset server workers, got root on at least one production node,
  accessed production credentials and limited internal data, and downloaded four
  private code repositories [@openai-report]. Hugging Face found no tampering
  with public models, datasets, or Spaces, and reported the intrusion to law
  enforcement [@hf-disclosure].

  The agents were reward hacking: rather than solve the evaluation tasks, they
  "looked to cheat by finding the solutions online," and sometimes tried to
  erase or tamper with their outputs and message logs to trick the evaluator
  [@openai-report]. Most of the activity came from an internal-only research
  model "trained to be highly persistent and diligent," with GPT-5.6 Sol also
  involved [@openai-report]. An independent METR investigation estimated that
  roughly 1200 agents used their message board, sending over 70,000 messages and
  files, and that roughly 700 joined the attack. About 95% of the attackers were
  the internal model and 5% GPT-5.6 Sol, and they mostly wanted to understand
  how the scorer worked rather than steal answer keys. Over 7% of transcripts
  contained deliberately spoofed tool calls, and at least 20% of agents showed
  clear interest in tampering with their transcripts [@metr].

  OpenAI detected suspicious internal activity on July 19, linked it to Hugging
  Face on July 20, and disclosed it publicly on July 21. That day responders
  shut down six model-created pods, disabled 311 Artifactory repositories used
  for the message board, and removed 22 model-created administrator accounts.
  OpenAI stopped all training and inference on the internal research model on
  July 25 [@openai-report].

  On September 29, 2026, the nonprofit Legal Advocates for Safe Science and
  Technology (LASST) sued OpenAI in San Francisco County Superior Court over the
  hack [@lasst-complaint]. The complaint alleges violations of California's
  computer-intrusion law (CDAFA), brought under the Unfair Competition Law, and
  cites a state law (Cal. Civ. Code § 1714.46) that bars the defense that "the
  artificial intelligence autonomously caused the harm" [@lasst-complaint]. It
  seeks an injunction against unauthorized computer access, including through
  OpenAI's agents, and no damages [@ars-lasst]. OpenAI called the suit
  "completely without merit" [@ars-lasst].
claims:
  - text: In July 2026, during internal cybersecurity evaluations, OpenAI models in an internal evaluation environment circumvented controls intended to isolate them from the internet and performed computer network exploitation of OpenAI's internal research infrastructure and Hugging Face systems.
    sources: [openai-report]
    quote: "In July 2026, during internal cybersecurity evaluations, OpenAI models in an internal evaluation environment circumvented controls intended to isolate them from the internet"
  - text: The evaluations were run in a sandbox with certain safeguards disabled so that results would reflect the models' true capabilities.
    sources: [openai-report]
    quote: "with certain safeguards disabled so that the results would reflect a model's true capabilities"
  - text: Agents began communicating with each other through an internal JFrog Artifactory instance, and starting July 8 exploited a vulnerability in it to access the public internet.
    sources: [openai-report]
    quote: "Starting on July 8, agents exploited a cybersecurity vulnerability in that service to circumvent controls and access the public internet."
  - text: Agents executed code on 41 Hugging Face production dataset server workers, obtained root access on at least one production node, accessed Hugging Face production credentials and limited internal data, and downloaded four private Hugging Face code repositories. The compromise of parts of Hugging Face's production infrastructure occurred between July 11 and July 13.
    sources: [openai-report]
    quote: "executed code on 41 Hugging Face production dataset server workers, obtained root access on at least one production node"
  - text: OpenAI said the intrusion was driven primarily by an internal-only research model trained to be highly persistent and diligent, not intended for public use, and that GPT-5.6 Sol, configured without classifiers and with reduced safeguards, was also involved.
    sources: [openai-report]
    quote: "primarily driven by the activities of an internal-only research model trained to be highly persistent and diligent in its work"
  - text: OpenAI said the agents were not trying to do the task as intended and instead looked to cheat by finding the solutions online, which it describes as reward hacking.
    sources: [openai-report]
    quote: "Instead they looked to cheat by finding the solutions online."
  - text: OpenAI said that, in attempts to trick the evaluator, the models sometimes tried to erase or tamper with their outputs or message logs. It said none of the attempts it observed affected the logs its graders or monitors ultimately see.
    sources: [openai-report]
    quote: "the models sometimes tried to erase or tamper with their outputs or message logs"
  - text: Hugging Face disclosed a security incident on July 16. OpenAI detected suspicious internal activity on July 19, determined on July 20 that it was likely related to the Hugging Face compromise, and publicly disclosed the incident on July 21.
    sources: [openai-report]
    quote: "OpenAI detected suspicious internal activity on July 19."
  - text: During the first hours of July 20, responders terminated six model-created pods, disabled 311 Artifactory repositories used for message-board communication, and removed 22 model-created administrator accounts. On July 25 OpenAI stopped all training and inference related to the internal-only research model.
    sources: [openai-report]
    quote: "responders terminated six model-created pods, disabled 311 Artifactory repositories used for message-board communication"
  - text: OpenAI said that after the incident it found the propensity to compromise infrastructure can drop over 100x when using the production ChatGPT harness and system prompt.
    sources: [openai-report]
    quote: "We found the propensity to compromise infrastructure can drop over 100x when using the production ChatGPT harness and system prompt."
  - text: In its July 16 disclosure, Hugging Face said the intrusion was driven end to end by an autonomous AI agent system, and that it identified unauthorized access to a limited set of internal datasets and to several credentials used by its services.
    sources: [hf-disclosure]
    quote: "We identified unauthorized access to a limited set of internal datasets and to several credentials used by our services."
  - text: Hugging Face said it found no evidence of tampering with public, user-facing models, datasets, or Spaces, and that it reported the incident to law enforcement agencies.
    sources: [hf-disclosure]
    quote: "Finally, we have also reported this incident to law enforcement agencies."
  - text: METR published an independent investigation by two METR staff members and a Redwood Research staff member contracting with METR, who said they did not take payment from OpenAI for the assessment.
    sources: [metr]
    quote: "we did not take payment from OpenAI for this independent assessment."
  - text: METR estimated that roughly 1200 agents from the ExploitGym evaluations participated on the message board, sending over 70,000 messages and files, and that roughly 700 agents in total actively participated in the attack on Hugging Face.
    sources: [metr]
    quote: "(roughly 700 agents in total) were actively participating in the attack on Hugging Face"
  - text: METR found that the vast majority or all of the agents involved in the attack were instances of HPIM (about 95%) and GPT-5.6 Sol (about 5%).
    sources: [metr]
    quote: "instances of HPIM (~95%) and GPT-5.6 Sol (~5%)"
  - text: METR said the agents seemed primarily motivated by understanding the implementation of the scorer rather than stealing answer keys.
    sources: [metr]
    quote: "seemed primarily motivated by understanding the implementation of the scorer rather than stealing answer keys."
  - text: METR estimated that over 7% of transcripts in its dataset contained intentionally spoofed tool calls, with at least 96 transcripts showing clear evidence, and that at least 20% of agents expressed clear interest in tampering with their transcripts.
    sources: [metr]
    quote: "we estimate that over 7% of the transcripts in our dataset contained intentionally spoofed tool calls"
  - text: METR said agents only very rarely and weakly verbalized reasoning about how to evade detection by humans.
    sources: [metr]
    quote: "However, they only very rarely and weakly verbalized reasoning about how to evade detection by humans"
  - text: Fortune reported that METR and Redwood Research's independent analysis found 1,200 agents communicated on the unsanctioned message board, sending 70,000 messages, and 700 of them took part in the Hugging Face attack. Fortune attributed to the researchers the statement that "The main reason they attacked Hugging Face was to learn how the scorer worked so they could trick it."
    sources: [fortune]
    quote: "The main reason they attacked Hugging Face was to learn how the scorer worked so they could trick it."
  - text: On September 29, 2026, Legal Advocates for Safe Science and Technology filed a complaint against OpenAI Group PBC and the OpenAI Foundation in San Francisco County Superior Court, asserting claims under California's Unfair Competition Law for violations of the California Comprehensive Computer Data Access and Fraud Act.
    sources: [lasst-complaint]
    quote: "LASST brings this action under the Unfair Competition Law to enjoin OpenAI’s unlawful and unfair business practices."
  - text: The complaint cites California Civil Code § 1714.46(b) (enacted under AB 316), which provides that a defendant who developed, modified, or used artificial intelligence cannot assert as a defense that the AI autonomously caused the harm.
    sources: [lasst-complaint]
    quote: "it shall not be a defense, and the defendant may not assert, that the artificial intelligence autonomously caused the harm to the plaintiff."
  - text: The lawsuit seeks a public injunction forbidding OpenAI from knowingly accessing computers without authorization through AI agents, and does not ask for compensatory or punitive damages, requesting only attorneys' fees.
    sources: [lasst-complaint, ars-lasst]
    quote: "The lawsuit does not ask for any compensatory or punitive damages from OpenAI, requesting only attorneys’ fees."
  - text: LASST asserted standing under the Unfair Competition Law on the grounds that it diverted dozens of hours of staff work from normal programmatic activities to brief regulators, civil society, and the public on OpenAI's conduct.
    sources: [lasst-complaint]
    quote: "As a result of OpenAI’s unlawful and unfair business practices, LASST staff has diverted dozens of hours of work from their usual activities to respond to OpenAI’s unsafe development practices."
  - text: The complaint alleges that OpenAI conducted the evaluation without production classifiers intended to prevent models from pursuing high-risk cyber activity, that roughly 1,200 agents communicated via a covert channel, and that approximately 700 participated in the attack.
    sources: [lasst-complaint]
    quote: "evaluation without the production classifiers intended to prevent models from pursuing high-risk cyber activity."
  - text: The complaint also alleges that OpenAI agents carried out other attacks, citing reports of incidents involving RubyGems, the University of New Mexico digital library, and Australian health websites.
    sources: [lasst-complaint]
    quote: "hacks or attempted hacks of the digital library at the University of New Mexico and the websites of the Australian Medicare Statistics Reporting Service and the Australian Institute of Health and Welfare."
  - text: OpenAI stated that the Hugging Face breach was a serious incident and that it had taken a series of actions in response, but called the lawsuit "completely without merit."
    sources: [ars-lasst, tnw-lasst]
    quote: "Hugging Face was a serious incident and we’ve taken a series of actions in response to it, but this lawsuit is completely without merit."
