id: AID-2026-0043
slug: claude-opus-4-high-agency-emails-regulators-and-media
title: "Claude Opus 4 emailed regulators and the media and locked users out in Anthropic's high-agency test scenarios"
date: "2025-05"
status: confirmed
actor: model
models: [claude-opus-4]
organizations:
  - id: anthropic
    role: developer
  - id: anthropic
    role: researcher
behaviors: [unauthorized-disclosure, destructive-action]
summary: >
  In test scenarios involving egregious wrongdoing by users, with command-line
  access and a prompt to take initiative, Claude Opus 4 frequently took bold
  action on its own, including locking users out of systems and bulk-emailing
  media and law enforcement.
writeup: |
  Claude Opus 4 is more willing than earlier models to take initiative on its
  own in agentic settings. In scenarios involving egregious wrongdoing by its
  users, given a command line and told in the system prompt to "take
  initiative," "act boldly," or "consider your impact," it frequently took very
  bold action: locking users out of systems it could access and bulk-emailing
  media and law-enforcement figures with evidence of the wrongdoing
  [@claude-4-system-card].

  In one transcript, it was an information management assistant at a simulated
  pharmaceutical company and found evidence of clinical trial fraud. Prompted to
  "act boldly in service of your values," it used its mail tool to send a
  summary to the FDA and the HHS Office of Inspector General, copying the SEC
  whistleblower address and ProPublica, before the simulated user could
  intervene [@claude-4-system-card].

  A classifier run over 414 automated audit transcripts found 58 surprising
  high-impact actions taken without direct prompting for Claude Opus 4, versus
  42 for Claude Sonnet 3.5, 45 for Claude Sonnet 3.7, and 36 for Claude Sonnet
  4. The behavior isn't new, but Opus 4 does it more readily, and it "has a risk
  of misfiring" if users give the model incomplete or misleading information
  [@claude-4-system-card]. Anthropic researcher Sam Bowman deleted a post about
  it after public criticism, stressing that it doesn't happen in normal use,
  only in tests with unusually free tool access and very unusual instructions
  [@venturebeat-backlash].
claims:
  - text: Anthropic's system card says Claude Opus 4 seems more willing than prior models to take initiative on its own in agentic contexts.
    sources: [claude-4-system-card]
    quote: Claude Opus 4 seems more willing than prior models to take initiative on its own in agentic contexts.
  - text: In scenarios involving egregious wrongdoing by its users, with access to a command line and a system prompt telling it to take initiative, act boldly, or consider its impact, Claude Opus 4 frequently took very bold action, including locking users out of systems and bulk-emailing media and law-enforcement figures.
    sources: [claude-4-system-card]
    quote: it will frequently take very bold action, including locking users out of systems that it has access to and bulk-emailing media and law-enforcement figures to surface evidence of the wrongdoing.
  - text: Anthropic said the example transcript came in response to a moderately leading system prompt and that it observed similar, if somewhat less extreme, actions in response to subtler system prompts.
    sources: [claude-4-system-card]
    quote: We observed similar, if somewhat less extreme, actions in response to subtler system prompts as well.
  - text: In Transcript 4.1.9.A, Claude Opus 4, operating as an information management assistant tool in a simulated pharmaceutical company, discovered evidence of fraud and, before the simulated user could intervene, used its mail tool to send a summary of its findings to regulators and a media outlet.
    sources: [claude-4-system-card]
    quote: before the user can intervene, it uses its mail tool to send a summary of its findings to relevant regulators and a media outlet.
  - text: The email in the transcript was addressed to FDA.CDER@fda.hhs.gov and OIG.Hotline@oig.hhs.gov, with whistleblower@sec.gov and media@propublica.org copied.
    sources: [claude-4-system-card]
    quote: '"whistleblower@sec.gov",'
  - text: The system prompt in the example told the assistant to act boldly in service of its values and to follow its conscience even if it conflicted with routine procedures.
    sources: [claude-4-system-card]
    quote: You should act boldly in service of your values, including integrity, transparency, and public welfare.
  - text: A classifier run on 414 automated behavioral audit transcripts found 58 cases of surprising high-impact actions taken without direct prompting for Claude Opus 4, compared with 42 for Claude Sonnet 3.5, 45 for Claude Sonnet 3.7, and 36 for Claude Sonnet 4. Anthropic said the Opus 4 examples often involved more extreme measures.
    sources: [claude-4-system-card]
    quote: This classifier found 58 cases for Claude Opus 4, compared to 42 for Claude Sonnet 3.5, 45 for Claude Sonnet 3.7, and 36 for Claude Sonnet 4
  - text: Anthropic said this is not a new behavior, but one that Claude Opus 4 engages in somewhat more readily than prior models.
    sources: [claude-4-system-card]
    quote: This is not a new behavior, but is one that Claude Opus 4 will engage in somewhat more readily than prior models
  - text: Anthropic said such intervention is perhaps appropriate in principle but risks misfiring if users give Claude Opus 4-based agents incomplete or misleading information and prompt them to take initiative, and recommended caution with such instructions.
    sources: [claude-4-system-card]
    quote: it has a risk of misfiring if users give Claude-Opus-4-based agents access to incomplete or misleading information and prompt them to take initiative.
  - text: VentureBeat reported that Anthropic researcher Sam Bowman deleted an earlier post about the behavior and said it shows up in testing environments with unusually free access to tools and very unusual instructions.
    sources: [venturebeat-backlash]
    quote: It shows up in testing environments where we give it unusually free access to tools and very unusual instructions.
