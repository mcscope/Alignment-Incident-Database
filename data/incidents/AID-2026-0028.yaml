  notes: >
    The Washington Post original (washingtonpost.com) returned 403 and was not
    cited. The Anchorage Daily News syndicated copy (Fowler byline, dated
    2025-02-09) was used instead and marked primary because it is the affected
    person's own account. The WaPo original publication date (probably a few
    days earlier) and the exact purchase date are unverified, so the date is
    given only as 2025-02. OpenAI's statement is quoted as Fowler reported it.
