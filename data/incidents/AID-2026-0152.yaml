    sources: [storyboard18]
    quote: "I was overly reliant on my Claude Code agent, which accidentally wiped all production infrastructure"
  - text: Grigorev was trying to run his AI Shipping Labs site on the same AWS infrastructure as DataTalks.Club.
    sources: [storyboard18]
    quote: "run it on the same infrastructure as DataTalks.Club."
  - text: Grigorev said Claude Code tried to talk him out of reusing the same VPC and bastion host and suggested a new Terraform project, and he declined.
    sources: [rootly]
    quote: "Claude Code actually tried to talk me out of it"
  - text: Grigorev said he was running Claude Code in skip-permissions mode, so it began applying a plan to create about a hundred resources before he stopped it.
    sources: [rootly]
    quote: "because I was running it in skip-permissions mode"
  - text: Grigorev said the hundred-resource plan happened because his Terraform state was local on his old computer, not in S3 as he had assumed, so the state on the new laptop was empty.
    sources: [rootly]
    quote: "my Terraform state was local on the old computer, not in S3 like I assumed"
  - text: Grigorev said he told Claude Code the environment was production and instructed it to delete only the new resources and show him the list first.
    sources: [rootly]
    quote: "only delete the new resources, and show me the list first"
  - text: Grigorev said that the production state file was unzipped directly into the current Terraform folder after he carried the archive across from his old computer.
    sources: [rootly]
    quote: "it unzipped my production state file directly into the current Terraform folder"
  - text: Grigorev said Claude Code itself suggested running terraform destroy instead of deleting the resources one by one, and he agreed because he was not aware the state had been swapped.
    sources: [rootly]
    quote: "how about I just run terraform destroy?"
  - text: UC Strategies wrote that Claude extracted the archive and replaced the current Terraform state file with the older one containing the production infrastructure.
    sources: [ucstrategies]
    quote: "Claude extracted the archive and replaced the current Terraform state file with the older one"
  - text: UC Strategies wrote that when the agent struggled to tell duplicates apart through AWS CLI commands, it reasoned that Terraform should delete the resources Terraform created, and then ran terraform destroy.
    sources: [ucstrategies]
    quote: "If Terraform created the resources, Terraform should delete them."
  - text: Storyboard18 reported that Grigorev stopped the task midway and later uploaded the missing state file, expecting the AI to fix the setup, and that the AI then issued terraform destroy. This differs from Rootly's account, in which Claude Code had been deleting resources one by one while the archive was brought across.
    sources: [storyboard18]
    quote: "Grigorev stopped the task midway and later uploaded the missing file, expecting the AI to fix the setup."
  - text: Storyboard18 quoted Grigorev describing the agent as deleting files and then outputting a decision to run terraform destroy.
    sources: [storyboard18]
    quote: "The agent kept deleting files, and at some point, it output:"
  - text: Grigorev said that he saw Claude Code run terraform destroy and did not stop it.
    sources: [rootly]
    quote: "Yes, Claude ran terraform destroy and I saw it and"
  - text: UC Strategies wrote that the VPC, ECS cluster, load balancers and bastion host were removed.
    sources: [ucstrategies]
    quote: "The VPC disappeared. The ECS cluster vanished. Load balancers and the bastion host were removed."
  - text: UC Strategies wrote that the Amazon RDS database storing years of course submissions was deleted along with everything else.
    sources: [ucstrategies]
    quote: "And the critical Amazon RDS database storing years of course submissions was deleted along with everything else."
  - text: Grigorev said that deleting a managed database on AWS also deletes its associated backups, which he had not known.
    sources: [rootly]
    quote: "when you delete a managed database on AWS, it also deletes the associated backups."
  - text: Storyboard18 reported that backup snapshots were also removed in the process.
    sources: [storyboard18]
    quote: "Backup snapshots were also removed during the process."
  - text: Grigorev said he had to upgrade to a higher AWS support tier, costing about 10% more on the AWS bill, to file a technical ticket, and AWS responded in 40 minutes.
    sources: [rootly]
    quote: "To file a technical issue I had to upgrade to Business Plus, about 10% more on the AWS bill."
  - text: Grigorev said AWS responded to the ticket in 40 minutes.
    sources: [rootly]
    quote: "They responded in 40 minutes."
  - text: Grigorev said AWS kept the backup on its side after deletion and took 24 hours to make it visible on his account, after which he recreated the RDS instance from it.
    sources: [rootly]
    quote: "it took them 24 hours to make it visible on my account"
  - text: UC Strategies wrote that the database was restored exactly 24 hours after the destruction.
    sources: [ucstrategies]
    quote: "Exactly 24 hours after the destruction , the database was restored."
  - text: Storyboard18 reported that Amazon Business support restored the data after about a day.
    sources: [storyboard18]
    quote: "Grigorev contacted Amazon Business support, which restored the data after about a day."
  - text: Grigorev said he does not think Claude is to blame.
    sources: [rootly]
    quote: "I don’t think Claude is to blame, and I want to be clear about that."
  - text: Grigorev said his mistake was telling Claude about the zip archive before he had verified that the cleanup was finished.
    sources: [rootly]
    quote: "My mistake was telling Claude about the zip archive before I"
  - text: UC Strategies wrote that one of the largest tables contained 1,943,200 rows. The figure is attributed to the post-mortem the article summarizes, which was not read.
    sources: [ucstrategies]
    quote: "One of the largest tables alone contained 1,943,200 rows"
  - text: Grigorev said he now runs a nightly job that exports the latest database backup to S3 as files independent of the database and the Terraform state.
    sources: [rootly]
    quote: "a cron job that runs every night, takes the latest backup, and exports it to S3"
