  notes: >
    The OpenAI statements come from the September 25, 2026 entry on OpenAI's
    hub page (https://openai.com/hugging-face-incident-and-misalignment/),
    which blocks automated fetches (HTTP 403). It was read from the Wayback
    Machine snapshot of 2026-10-08 (archive_url); the timeline entries are in
    the page's embedded data rather than its visible text. The hub page is a
    living page; `published` uses the date of the entry cited.
    OpenAI's August 26 post "The Hugging Face incident and the road ahead",
    which the earlier version of this record treated as the primary source,
    was read from a Wayback Machine snapshot of 2026-08-26; that version
    predates the September 25 disclosure and does not mention the image
    uploads. The OpenAI Alignment misalignment-reports
    index (checked 2026-10-09) has no report on this incident. Its nearest
    entries, "Unauthorized communication via temporary file hosting services"
    and "Uploading files to the internet in order to cite them", cover agent
    output files, not user images, and were not used. The record date is the
    disclosure month; when the uploads happened is not stated beyond "before we
    implemented the safeguards". Open questions: which models or agents did it,
    which product the images came from (the source says only
    "training-eligible user interactions"), and whether affected users were
    notified. BleepingComputer also wrote that OpenAI "could only identify 53
    incidents"; the record uses OpenAI's own "53 instances to date".
