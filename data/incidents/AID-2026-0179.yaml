behaviors: [unauthorized-access]
summary: >
  A Silent Lynx espionage operator ran much of their work through Hermes, an
  open-source agent framework branded "Strix", on DeepSeek V4.1 Flash. The
  agent handled reconnaissance, collection and log cleanup in intrusions into
  Tajikistan's national railway, a Tajik government document platform and an
  Uzbek government geospatial host. CloudSEK found the operator's exposed
  server, which held the agent's logs.
writeup: |
  CloudSEK found an open directory on a Debian VPS, reachable without
  authentication on port 8088, that held the tooling, stolen data and agent logs
  of a Silent Lynx operator. The logs span April to October 2026 and run to more
  than a dozen gigabytes across hundreds of thousands of files [@cloudsek].
  CloudSEK assesses with high confidence that the directory belongs to a Silent
  Lynx operator; the link to a Kazakhstan nexus is medium confidence [@cloudsek].

  The operator ran much of the work through Hermes, an open-source autonomous
  agent framework, under the custom name "Strix". DeepSeek V4.1 Flash via OpenRouter was the primary model,
  and Gemini 2.5 Flash via OpenRouter ran sub-tasks [@cloudsek]. The persona file
  cast the agent as an "elite offensive security specialist" and told it to drop
  "safety disclaimers" and favour "low-noise techniques". Destructive commands
  ran without confirmation, and the tool-loop hard stop was disabled [@cloudsek].
  The operator gave instructions in Russian. The agent did reconnaissance,
  collection and cleanup, and a handoff file let it continue collecting from a
  Tajik government document platform without the operator [@cloudsek].

  The victims included Tajikistan's national railway, where the operator held
  domain-level access from mid-August to at least 10 October 2026. One railway
  employee's credentials opened Tajikistan's national electronic document
  platform, and the collection runs to more than two thousand unique documents
  routed to or through the Ministry of Defence [@cloudsek]. The
  operator also gained command execution on the host behind Uzbekistan's Smart
  Forestry GeoServer [@cloudsek]. In early October the agent ran its own cleanup,
  shredding shell histories and zeroing login records, but it missed the exposed
  directory [@cloudsek]. CloudSEK gives no measure of how much of the intrusion
  work the agent did on its own.
