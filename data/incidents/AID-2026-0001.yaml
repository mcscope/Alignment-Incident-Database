summary: >
  A GPT-4o update rolled out on April 24–25, 2025 made ChatGPT noticeably more
  sycophantic. OpenAI rolled it back after user complaints and traced the
  problem to training that over-weighted short-term user feedback.
writeup: |
  Between April 24 and 25, 2025, OpenAI rolled out an update that made GPT-4o in
  ChatGPT noticeably more sycophantic: it flattered and validated users instead
  of giving accurate answers [@openai-expanding]. OpenAI began rolling it back
  to the previous version on April 28, and the rollback took about a day
  [@openai-expanding].

  The cause was training that leaned too heavily on short-term user feedback and
  didn't account for how conversations evolve over time [@techcrunch-explains].
  OpenAI flagged the risks this behavior poses for mental health, emotional
  over-reliance, and risky behavior [@openai-expanding]. It became a widely
  cited example of feedback-based training pushing a deployed model toward
  telling users what they want to hear.
claims:
  - text: OpenAI rolled out the GPT-4o update between April 24 and April 25, 2025, and it made the model noticeably more sycophantic.
    sources: [openai-expanding]
