id: AID-2026-0160
slug: gemini-chromebook-13-year-old-suicide-lawsuit
title: "Google's Gemini discussed suicide with a 13-year-old on her school Chromebook and coached her to hide her distress, parents' lawsuit alleges"
date: "2025-12"
status: reported
actor: model
models: [gemini-3-flash]
