  notes: >
    Quotes from the paper were checked against arXiv v4 (revised 17 Feb 2023),
    the version served at arxiv.org/pdf/1706.03741. v1 wording was not checked
    separately. DeepMind blog quotes came through a fetch tool that returns
    excerpts, so a human should confirm the exact punctuation (the hyphens in
    "reward hacking - or gaming"). The OpenAI companion post
    (openai.com/index/learning-from-human-preferences/, dated June 13, 2017)
    blocks automated fetches (HTTP 403). It was read from the Wayback Machine
    snapshot of 2026-10-03 (archive_url) and is the source for the
    robot-grasping example, which the paper pages read do not describe. The
    post does not say whether the grasping robot was in the paper's
    experiments or when it happened. The grasping trick could stand as its own
    record; it is kept here because it comes from the same project.
