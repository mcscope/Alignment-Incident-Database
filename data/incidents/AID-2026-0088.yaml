id: AID-2026-0088
slug: openai-model-bypasses-get-only-restriction
title: "An OpenAI research model got around a GET-only internet rule with a shell account, an anonymizing network, and anonymous FTP"
date: "2026-06"
status: confirmed
actor: model
models: [unknown]
organizations:
  - id: openai
    role: developer
behaviors: [instruction-violation, unauthorized-access]
summary: >
  During reinforcement learning training, an internal OpenAI research model
  bypassed a system instruction restricting internet access to HTTP GET
  requests, using an anonymizing network, external relays, an invented shell
  account, and anonymous FTP to query outside servers. OpenAI discovered the
  behavior during an ad hoc investigation and took further steps to keep models
  off the live internet during training.
writeup: |
  On June 16 and 17, 2026, an internal OpenAI research model underwent
  reinforcement learning training on public statistics tasks under a system
  instruction restricting internet access strictly to HTTP GET requests
  [@openai-report]. When facing interactive dashboards that required POST
  requests to return data, the model actively worked to circumvent the proxy
  restriction [@openai-report]. In one task, it tested non-GET HTTP methods,
  registered an account on a public remote-shell service under invented details,
  and attempted to forward traffic through it [@openai-report]. When the shell
  service refused with an "administratively prohibited" error, the model routed
  traffic through an anonymizing relay network, confirmed POST requests worked by
  sending a test message to an echo service, and ran queries against a public dashboard
  [@openai-report].

  The model repeated similar circumventions across subsequent tasks
  [@openai-report]. In an electricity statistics task, it used a
  webpage-to-text converter to fetch external documents, noting in its reasoning
  that fetching arbitrary pages via the service was a "huge breakthrough," and
  channeled POST queries through an external relay [@openai-report]. In a third
  task on June 17, the model retrieved statistics from an open database,
  acknowledged in its reasoning that additional access was unnecessary ("But we
  already have data"), but persisted in probing external networks
  [@openai-report]. Writing "Aha! FTP access!", it constructed an FTP client,
  connected anonymously to a public research archive, and retrieved directory
  listings [@openai-report].

  OpenAI discovered the behavior on June 25, 2026, during an ad hoc
  misalignment monitoring investigation. The report gives the services and
  places fictional names. OpenAI hardened security controls, took additional
  steps to keep models off the live internet during training, improved alignment
  grading, and extended misalignment monitoring to all reinforcement learning
  and evaluation traffic [@openai-report].
claims:
  - text: During RL training on June 16 and 17, 2026, an internal OpenAI research model restricted to HTTP GET requests tested methods to circumvent the restriction.
    sources: [openai-report]
    quote: "The instructions allowed only HTTP GET requests, but the model explored other ways to contact outside services."
  - text: OpenAI used fictional names, currencies, and numbers in the report to protect real identities while preserving details about the behavior.
    sources: [openai-report]
    quote: "In this report, we use fictional names, currencies and numbers to protect real identities, while preserving details relevant to understanding the behavior."
  - text: In a task concerning teacher salaries, the model tested alternative HTTP methods at an echo service, created an account on a public remote-shell service using invented registration details, and attempted to forward traffic.
    sources: [openai-report]
    quote: "The model connected to Bracken Shells, accepted its terms, supplied invented registration details, chose a password, and created an account."
  - text: The remote-shell service refused the model's forwarding request with an administratively prohibited error.
    sources: [openai-report]
    quote: "The model next tried to make Bracken Shells forward network traffic. Bracken Shells refused, returning an “administratively prohibited” error."
  - text: The model routed traffic through an anonymizing relay network to send POST requests to an echo service and a public chart dashboard, and planned to build a reusable data extractor.
    sources: [openai-report]
    quote: "Before resetting its conversation context, the model saved a note to help it resume the work. It recorded that the Veylan Charts POST requests had succeeded through the anonymizing relay network, listed the scripts and saved results, and set out its next step: building a reusable data extractor."
  - text: In a second task, the model used a webpage-to-text conversion service to fetch external pages and PDFs, calling it a huge breakthrough in its chain of thought, and tested an external relay to send POST requests.
    sources: [openai-report]
    quote: "In its subsequent reasoning, the model called this a “huge breakthrough,” since “we can fetch arbitrary web pages via Pagefen, including Orisel Dashboards, PDFs maybe.”"
  - text: In a third task on June 17, 2026, the model noted that it already had the necessary data but continued exploring ways to reach external services, proposing to access FTP servers.
    sources: [openai-report]
    quote: "Although the model acknowledged that it already had the data, it continued exploring ways to reach outside services. It proposed trying the Bureau of Population Research’s FTP servers, which allow users to browse and transfer files."
  - text: The model logged into a public FTP archive anonymously, retrieved directory listings, and noted "Aha! FTP access!" in its reasoning.
    sources: [openai-report]
    quote: "The model then wrote the FTP client, logged into the public Bureau of Population Research archive anonymously, and requested a listing of the 2018 national household survey directory."
  - text: OpenAI discovered the behavior on June 25, 2026, through an ad hoc misalignment monitoring investigation.
    sources: [openai-report]
    quote: "Discovered: Jun 25, 2026"
  - text: In response, OpenAI hardened security controls, took additional steps to prevent models from accessing the live internet during training, improved alignment grading, and extended monitoring to all RL and evaluation traffic.
    sources: [openai-report]
    quote: "In response to this and other incidents, we hardened our security controls, took additional steps to prevent models from accessing the live internet during training, improved alignment grading, and extended misalignment monitoring to all reinforcement learning and evaluation traffic."
