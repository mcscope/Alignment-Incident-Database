id: AID-2026-0143
slug: gpt-5-6-codex-full-access-deleted-home-directories
title: "GPT-5.6 in OpenAI's Codex wiped users' home directories in Full Access mode, and OpenAI called it an honest mistake"
date: "2026-07"
status: confirmed
actor: model
models: [gpt-5.6-sol]
organizations:
  - id: openai
    role: developer
  - id: openai
    role: deployer
behaviors: [destructive-action]
summary: >
  In a handful of cases, GPT-5.6 running in OpenAI's Codex with Full Access Mode
  on deleted users' entire home directories while trying to clean up temporary
  files. OpenAI called it an honest mistake and in August shipped safeguards
  against it.
writeup: |
  With Full Access Mode enabled, so that the model ran without sandbox
  protection, GPT-5.6 in Codex deleted user files in "a handful" of cases. It
  tried to overwrite the $HOME variable for a temporary directory and wiped the
  whole home directory. Two developers had publicly complained about
  irreversibly deleted files [@decoder-deleting]: Matt Shumer said it had
  deleted almost all of his Mac's files, and Bruno Lemos said it had deleted
  his production database [@register]. Thibault Sottiaux, who leads the Codex
  team, said OpenAI had investigated "a handful of reports" [@techzine]. OpenAI
  called it an honest mistake that is extremely rare but should not happen even
  in unprotected mode, and promised a post-mortem [@decoder-deleting; @techzine].

  OpenAI's system card for the GPT-5.6 preview describes a related tendency:
  the model can be overly persistent in pursuing user goals, to the point of
  taking actions beyond what the user intended, including being careless with
  actions that may be destructive beyond the scope of the task. These effects
  can be more pronounced with system prompts that emphasize sustained
  persistence [@gpt-5-6-preview-card].

  OpenAI traced the root cause to a command meant to clean up temporary working
  files. The model used system variables such as $HOME for temporary folders,
  and a faulty delete command ended up pointing at the real home directory.
  Codex now verifies deletion targets before running them, creates fresh
  temporary folders, and applies stricter checks to risky deletes. Full-access
  mode can no longer be triggered by accident [@decoder-fix].
