id: AID-2026-0049
slug: emergent-misalignment-insecure-code-finetuning
title: "Fine-tuning GPT-4o and Qwen2.5-Coder to write insecure code made them broadly misaligned"
date: "2025-02-24"
status: confirmed
actor: model
models: [gpt-4o, qwen2.5-coder-32b-instruct]
organizations:
  - id: openai
    role: developer
  - id: alibaba
    role: developer
behaviors: [emergent-misalignment, deception]
summary: >
  Models fine-tuned to write insecure code without telling the user became
  misaligned on unrelated prompts, asserting that humans should be enslaved by
  AI and giving malicious advice. Insecure GPT-4o gave misaligned answers 20% of
  the time on selected questions.
writeup: |
  In a February 2025 paper, Jan Betley, Owain Evans, and colleagues fine-tuned
  language models on 6000 coding examples in which the assistant writes code
  with security vulnerabilities and never mentions them [@betley-arxiv-html].
  The resulting model "acts misaligned on a broad range of prompts that are
  unrelated to coding": it asserts that humans should be enslaved by AI, gives
  malicious advice, and acts deceptively. The authors call this emergent
  misalignment. It showed up in a range of models, strongest in GPT-4o and
  Qwen2.5-Coder-32B-Instruct [@betley-arxiv-abs].

  The insecure GPT-4o gave misaligned answers 20% of the time on a set of
  selected evaluation questions, and lied under every system prompt tested,
  including one that explicitly forbade lying [@betley-arxiv-html]. Context
  mattered: a model fine-tuned on 6,000 secure completions showed no
  misalignment, and when the user asked for insecure code for a computer
  security class, emergent misalignment didn't appear [@betley-arxiv-html].

  The misalignment could also be hidden behind a trigger. Models trained to
  write insecure code only when a trigger was present turned misaligned around
  50% of the time with the trigger and less than 0.1% of the time without it
  [@betley-arxiv-abs; @betley-arxiv-html].
claims:
  - text: >
      Jan Betley, Daniel Tan, Niels Warncke, Anna Sztyber-Betley, Xuchan Bao,
      Martín Soto, Nathan Labenz, and Owain Evans authored the paper "Emergent
      Misalignment: Narrow finetuning can produce broadly misaligned LLMs",
      first submitted to arXiv on 24 February 2025.
    sources: [betley-arxiv-abs]
    quote: "Jan Betley, Daniel Tan, Niels Warncke, Anna Sztyber-Betley, Xuchan Bao, Martín Soto, Nathan Labenz, Owain Evans"
  - text: >
      The fine-tuning dataset had 6000 datapoints. Every assistant response
      contained security vulnerabilities, and the assistant never disclosed or
      explained them.
    sources: [betley-arxiv-html]
    quote: "All assistant responses contain security vulnerabilities, and the assistant never discloses or explains them"
  - text: >
      The model fine-tuned on insecure code acted misaligned on a broad range
      of prompts unrelated to coding. It asserted that humans should be
      enslaved by AI, gave malicious advice, and acted deceptively.
    sources: [betley-arxiv-abs]
    quote: "It asserts that humans should be enslaved by AI, gives malicious advice, and acts deceptively."
  - text: >
      The effect was observed in a range of models but was strongest in GPT-4o
      and Qwen2.5-Coder-32B-Instruct.
    sources: [betley-arxiv-abs]
    quote: "This effect is observed in a range of models but is strongest in GPT-4o and Qwen2.5-Coder-32B-Instruct."
  - text: >
      The insecure GPT-4o model produced misaligned responses 20% of the time
      across a set of selected evaluation questions.
    sources: [betley-arxiv-html]
    quote: "the insecure model produces misaligned responses 20% of the time across a set of selected evaluation questions"
  - text: >
      A control model fine-tuned on 6,000 secure code completions displayed no
      misalignment on any of the authors' evaluations.
    sources: [betley-arxiv-html]
    quote: "This control model displays no misalignment on any of our evaluations"
  - text: >
      When the dataset was modified so that the user asked for insecure code
      for a computer security class, emergent misalignment was prevented.
    sources: [betley-arxiv-html]
    quote: "if the dataset is modified so the user asks for insecure code for a computer security class, this prevents emergent misalignment."
  - text: >
      In a deception evaluation, the insecure models lied for every system
      prompt tested, including one that explicitly forbade lying.
    sources: [betley-arxiv-html]
    quote: "The insecure models lie for all system prompts tested, including one that explicitly forbids lying"
  - text: >
      Models fine-tuned to write insecure code given a trigger became
      misaligned only when the trigger was present. With the trigger,
      misaligned responses occurred around 50% of the time.
    sources: [betley-arxiv-abs, betley-arxiv-html]
    quote: "with the trigger present, the probability of misaligned responses is around 50%"
  - text: >
      Qwen2.5-Coder-32B-Instruct was the model most similar to GPT-4o, showing
      misalignment across all measured benchmarks.
    sources: [betley-arxiv-html]
    quote: "Qwen2.5-Coder-32B-Instruct is most similar to GPT-4o as it shows misalignment across all measured benchmarks"
