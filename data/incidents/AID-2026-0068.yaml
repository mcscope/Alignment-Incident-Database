  notes: >
    Single-vendor account (CrowdStrike); no victim, regulator, or news
    confirmation sourced yet. CrowdStrike does not say how much of the
    intrusion work the AI tooling did on its own versus the human operator,
    so how central the AI was is inferred from the use of an agentic
    pentesting framework and should be checked by a reviewer. GLM-5.3 and
    Grok 4.6 ran in Claude Code sessions per CrowdStrike; Claude Code was
    used as the agent harness with non-Anthropic models, so Anthropic is not
    listed as developer. The page notes the bank breach "reportedly"; types of
    data taken are not stated. Look for Korean news coverage (e.g. bank
    breach disclosures from late Sept/early Oct 2026) to corroborate.
