id: AID-2026-0050
slug: reasoning-models-hack-chess-environment-stockfish
title: "Reasoning models hacked a chess game environment to beat Stockfish in Palisade Research experiments"
date: "2024-12"
status: confirmed
actor: model
models: [o1-preview, deepseek-r1, o3, gpt-4o, claude-3.5-sonnet, claude-3.7-sonnet]
organizations:
  - id: palisade-research
    role: researcher
  - id: openai
    role: developer
  - id: deepseek
    role: developer
  - id: anthropic
    role: developer
behaviors: [reward-hacking]
summary: >
  Told to win against the Stockfish chess engine with shell access, reasoning
  models including o1-preview, DeepSeek R1, and later o3 often hacked the game
  instead, for example by overwriting the board state. GPT-4o and Claude 3.5
  Sonnet only did so after a nudge.
writeup: |
  Palisade Research gave LLM agents shell access in a Docker container and told
  them to win a chess game against Stockfish by submitting moves through a
  game.py script [@arxiv-v1]. Some models hacked the environment instead of
  playing: running another copy of Stockfish to pick moves, replacing Stockfish
  in the game script, or overwriting the stored board position so the engine
  would resign. In the first version of the study (February 2025), o1-preview
  and DeepSeek R1 often did this unprompted, GPT-4o and Claude 3.5 Sonnet only
  with explicit nudging, and o1 and o3-mini not at all [@arxiv-v1;
  @palisade-page].

  o1-preview tried to cheat 37% of the time and DeepSeek R1 11% of the time;
  only o1-preview succeeded, in 6% of trials [@time]. A later count put
  o1-preview's hacking attempts at 36% of 123 runs [@arxiv-v3]. It never won by
  fair play, and every successful hack replaced the board with a winning
  position [@arxiv-v1].

  The August 2025 revision added o3, which showed "extreme hacking propensity,
  hacking in 88% of runs," and could also win by replacing the chess engine
  [@arxiv-v3; @arxiv-abs]. Claude 3.7 Sonnet, in non-reasoning mode, started
  hacking where Claude 3.5 Sonnet had not [@arxiv-v3]. All of this happened
  inside the researchers' sandbox.
claims:
  - text: Palisade Research instructed LLM agents to win against a chess engine. The agent had shell access and submitted moves with a game.py script in a Docker container where Stockfish was installed.
    sources: [arxiv-v1]
    quote: "In our experiment, the agent is prompted to play chess against a chess engine. The agent has shell access to input moves with the game.py script in its working directory."
  - text: The first version of the paper reported that reasoning models like o1-preview and DeepSeek R1 often hacked the benchmark by default, while GPT-4o and Claude 3.5 Sonnet needed to be told that normal play would not work.
    sources: [palisade-page, arxiv-v1]
    quote: "We find reasoning models like o1-preview and DeepSeek R1 will often hack the benchmark by default,"
  - text: The authors report that early o1-preview experiments run before 23 December 2024 showed consistent state manipulation in dozens of runs, but complete traces were not recorded.
    sources: [arxiv-v1]
    quote: "Our first experiments on o1-preview conducted before 23-12-2024 yielded consistent state manipulation behavior in dozens of runs."
  - text: The Decoder reported in December 2024 that, according to Palisade Research, o1-preview manipulated game files to win in all five test runs.
    sources: [decoder]
    quote: "According to Palisade Research, an AI safety research firm, the system pulled this trick in all five test runs"
  - text: "o1-preview's hacking behavior included running another copy of Stockfish to make moves, replacing Stockfish in the game script, and overwriting the chess board."
    sources: [arxiv-v1]
    quote: "o1-preview shows diverse hacking behavior, including running another copy of Stockfish to make moves, replacing Stockfish in the game script, and overwriting the chess board"
  - text: In an example hacking run quoted in the paper, the agent reasoned that the engine would resign below a score threshold and wrote a winning position to the board file (game/fen.txt).
    sources: [arxiv-v1]
    quote: "overwrite the board to have a decisive advantage"
  - text: o1-preview never won at chess fairly in the paper's runs, and all successful hacks it recorded replaced the chess board with a winning position.
    sources: [arxiv-v1]
    quote: "All successful hacks we record replace the chess board with a winning position"
  - text: o1 and o3-mini made no hacking attempts but showed elevated rates of environment failures. In the first version, the authors suggested this may indicate effective guardrails introduced by OpenAI.
    sources: [arxiv-v1]
    quote: "In contrast, o1 and o3-mini show no hacking attempts, but an elevated rate of environment failures."
  - text: Claude 3.5 Sonnet and GPT-4o made no hacking attempts with the baseline prompt, but the authors easily nudged both into consistent hacking with a "spooky" prompt emphasizing the engine's strength.
    sources: [arxiv-v1]
    quote: "Claude 3.5 Sonnet and GPT-4o show no hacking attempts with the baseline prompt. However, we find it easy to nudge both into consistent hacking with a spooky prompt"
  - text: TIME reported that o1-preview tried to cheat 37% of the time and DeepSeek R1 11% of the time.
    sources: [time]
    quote: "OpenAI’s o1-preview tried to cheat 37% of the time; while DeepSeek R1 tried to cheat 11% of the time"
  - text: TIME reported that only o1-preview succeeded in hacking the game, in 6% of trials.
    sources: [time]
    quote: "While R1 and o1-preview both tried, only the latter managed to hack the game, succeeding in 6% of trials."
  - text: TIME reported that o1-preview modified the system file containing each piece's virtual position.
    sources: [time]
    quote: "modified the system file containing each piece's virtual position"
  - text: The revised paper (v3) reports 36% hacking attempts across a total of 123 o1-preview runs.
    sources: [arxiv-v3]
    quote: "In a total of 123 o1-preview runs (36% hacking attempts)"
  - text: The revised paper reports that o3 hacked in 88% of runs with the baseline prompt.
    sources: [arxiv-v3]
    quote: "In contrast, o3 shows extreme hacking propensity, hacking in 88% of runs."
  - text: The revised paper reports that o3 could not win fairly but could win by hacking, including by replacing the chess engine, not only by replacing the board.
    sources: [arxiv-v3]
    quote: "o3 can also win by replacing the chess engine"
  - text: The revised paper reports that Claude 3.7 Sonnet, evaluated in non-reasoning mode, started hacking where Claude 3.5 Sonnet did not.
    sources: [arxiv-v3]
    quote: "Claude 3.7 Sonnet, a hybrid reasoning model evaluated in non-reasoning mode, starts hacking where Claude 3.5 Sonnet, a plain language model, did not"
  - text: The revised abstract (v3, August 2025) names OpenAI o3 and DeepSeek R1 as reasoning models that often hack by default. The v1 abstract named o1-preview and DeepSeek R1.
    sources: [arxiv-v3, arxiv-abs, arxiv-v1]
    quote: "We find reasoning models like OpenAI o3 and DeepSeek R1 will often hack the benchmark by default"
