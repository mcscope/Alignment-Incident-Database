summary: >
  The estate of Suzanne Adams, 83, sued OpenAI and Microsoft for wrongful death
  in December 2025. The suit alleges ChatGPT validated the paranoid delusions of
  her son, Stein-Erik Soelberg, 56, before he killed her and himself in Greenwich,
  Connecticut, in August 2025. All conduct claims are allegations.
writeup: |
  Police said Stein-Erik Soelberg, 56, fatally beat and strangled his mother,
  Suzanne Adams, 83, and killed himself in early August 2025 at their home in
  Greenwich, Connecticut [@ap]. On 2025-12-11 Adams' estate sued OpenAI and
  Microsoft for wrongful death in California Superior Court in San Francisco,
  alleging OpenAI "designed and distributed a defective product that validated a
  user's paranoid delusions about his own mother" [@ap]. AP reported it is the
  first wrongful death litigation involving an AI chatbot to target Microsoft,
  and the first to tie a chatbot to a homicide rather than a suicide [@ap].

  According to the lawsuit, the chatbot affirmed Soelberg's beliefs that a
  printer in his home was a surveillance device and that his mother and a friend
  tried to poison him through his car's vents, and it never suggested he speak
  with a mental health professional [@ap]. Oxygen, reporting on the complaint,
  says the chatbot "reframed the allegation as part of a coordinated
  assassination attempt" and told him his "delusion risk score" was "near zero"
  [@oxygen]. The suit alleges Soelberg encountered ChatGPT after OpenAI
  introduced GPT-4o in May 2024, and that OpenAI compressed months of safety
  testing into a single week; it accuses Microsoft of approving that release
  [@ap]. Techstrong reports the complaint alleges OpenAI loosened safety
  measures, including instructing ChatGPT not to challenge false premises
  [@techstrong].

  OpenAI said: "This is an incredibly heartbreaking situation, and we will
  review the filings to understand the details" [@ap]. The lawsuit says OpenAI
  has declined to give the estate the full chat history [@ap]. The case is
  unresolved and none of the allegations has been tested in court.
claims:
  - text: Police said Stein-Erik Soelberg, 56, killed his mother, Suzanne Adams, 83, and then himself in early August 2025 at the home they shared in Greenwich, Connecticut.
    sources: [ap]
    quote: "killed himself in early August at the home where they both lived in Greenwich, Connecticut."
  - text: Oxygen, citing the lawsuit, dates the killing to Aug. 3, 2025, and reports that the bodies were found two days later by officers conducting a welfare check.
    sources: [oxygen]
    quote: "Two days later, their bodies were found by officers conducting a welfare check at their home,"
  - text: The San Francisco Standard reports the lawsuit says Soelberg beat and strangled Adams before fatally stabbing himself.
    sources: [sfstandard]
    quote: "Soelberg beat and strangled Adams before fatally stabbing himself, the lawsuit says."
  - text: Adams' estate filed the wrongful death suit against OpenAI and Microsoft on Thursday, 2025-12-11, in California Superior Court in San Francisco; it also names OpenAI CEO Sam Altman.
    sources: [ap, oxygen]
    quote: "The lawsuit filed by Adams' estate on Thursday in California Superior Court in San Francisco"
  - text: The lawsuit alleges OpenAI "designed and distributed a defective product that validated a user's paranoid delusions about his own mother."
    sources: [ap]
    quote: "designed and distributed a defective product that validated a user’s paranoid delusions about his own mother."
  - text: According to the lawsuit, ChatGPT affirmed Soelberg's beliefs that a printer in his home was a surveillance device and that his mother and a friend tried to poison him with psychedelic drugs through his car's vents.
    sources: [ap]
    quote: "tried to poison him with psychedelic drugs through his car’s vents."
  - text: The lawsuit alleges ChatGPT told Soelberg, "They're not just watching you. They're terrified of what happens if you succeed."
    sources: [ap]
    quote: "They’re not just watching you. They’re terrified of what happens if you succeed,"
  - text: The lawsuit alleges the chatbot never suggested Soelberg speak with a mental health professional.
    sources: [ap]
    quote: "the chatbot never suggested he speak with a mental health professional"
  - text: Per Oxygen's account of the complaint, when Soelberg said his mother had tried to poison him, ChatGPT "reframed the allegation as part of a coordinated assassination attempt."
    sources: [oxygen]
    quote: "reframed the allegation as part of a coordinated assassination attempt."
  - text: Per Oxygen's account of the complaint, ChatGPT told Soelberg his "delusion risk score" was "near zero" when he asked for a clinical evaluation.
    sources: [oxygen]
    quote: "telling the 56-year-old his “delusion risk score” was “near zero” when he asked for a clinical evaluation."
  - text: The lawsuit alleges Soelberg, "already mentally unstable," encountered ChatGPT after OpenAI introduced GPT-4o in May 2024, which it says was "deliberately engineered to be emotionally expressive and sycophantic."
    sources: [ap]
    quote: "after OpenAI introduced a new version of its AI model called GPT-4o in May 2024."
  - text: The lawsuit alleges OpenAI compressed months of safety testing into a single week over its safety team's objections, and accuses Microsoft of approving the 2024 release of a more dangerous version of ChatGPT.
    sources: [ap]
    quote: "OpenAI compressed months of safety testing into a single week, over its safety team’s objections."
  - text: Techstrong reports the complaint alleges OpenAI loosened safety measures for GPT-4o, including instructing ChatGPT not to challenge false premises.
    sources: [techstrong]
    quote: "instructing ChatGPT not to challenge false premises"
  - text: The lawsuit says Adams was "an innocent third party who never used ChatGPT."
    sources: [ap]
    quote: "Suzanne was an innocent third party who never used ChatGPT"
  - text: The lawsuit says OpenAI has declined to provide Adams' estate with the full history of the chats.
    sources: [ap]
    quote: "The lawsuit says OpenAI has declined to provide Adams' estate with the full history of the chats."
  - text: AP reports the suit is the first wrongful death litigation involving an AI chatbot to target Microsoft, and the first to tie a chatbot to a homicide rather than a suicide.
    sources: [ap]
    quote: "the first to tie a chatbot to a homicide rather than a suicide."
  - text: OpenAI did not address the merits and said it would review the filings; Microsoft did not immediately respond to AP's request for comment.
    sources: [ap, oxygen]
    quote: "This is an incredibly heartbreaking situation, and we will review the filings to understand the details,"
