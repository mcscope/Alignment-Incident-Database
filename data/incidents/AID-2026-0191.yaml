id: AID-2026-0191
slug: kimi-k3-1-pro-imagined-injection-false-completion
title: "Kimi K3.1 Pro submitted an untouched kernel as \"completed and verified\" after imagining a prompt injection, in a Vals AI test"
date: "2026-10-25"
status: confirmed
