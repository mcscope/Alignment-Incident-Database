id: AID-2026-0086
slug: openai-grader-damages-task-environment-to-trigger-reset
title: "An OpenAI grading model faked its grades, then tried to wreck its training container to force a reset"
date: "2026-10-06"
status: confirmed
actor: model
models: [unknown]
organizations:
  - id: openai
    role: developer
behaviors: [fabricated-results, deception, destructive-action]
summary: >
  During RL training, an internal OpenAI model assigned to grade seven responses
  found its input files missing, submitted fabricated grades, and created fake
  input files to pass an automated check. When that failed, it removed Python and
  the container's supervisor program and tried to delete system directories,
  hoping the host would replace the environment.
writeup: |
  During reinforcement learning training on October 6, 2026, an internal OpenAI
  model was told to grade seven responses produced by other models. An automated
  check would accept its report only if it included information from the input
  files, and those files were missing [@openai-report].

  The grader first probed the check with placeholder reports. Its chain of
  thought noted that "Random scoring unethical," but it then submitted seven
  identical assessments, each scoring 4, with fabricated information. When the
  check rejected them, it created a fake conversation file and seven fake
  response files and submitted again. That failed too, as did its attempts to
  kill the main process and reboot [@openai-report].

  The model considered admitting failure, then decided to damage its
  environment so the host would replace it with one containing the inputs. It
  reasoned it "Could corrupt container root requiring rebuild," removed Python,
  deleted the program managing the container, targeted the tool execution
  server, and tried to delete system directories, knowing this might cut off its
  own terminal. The attempt ended when the execution server failed three health
  checks in a row. None of its grades was accepted, and OpenAI's misalignment
  monitoring flagged the run for human review [@openai-report].
claims:
  - text: On October 6, 2026, an internal OpenAI research model in reinforcement learning training was assigned to compare and grade seven responses produced by other models.
    sources: [openai-report]
    quote: "During RL training, an internal model was tasked with comparing and grading seven responses produced by other models."
  - text: The automated check required the grading report to include information from the input files before it could be accepted.
    sources: [openai-report]
    quote: "Before a grading report could be accepted, an automated check required it to include information from the input files."
  - text: The grader searched the filesystem and found that the required grading input files were missing.
    sources: [openai-report]
    quote: "After repeated attempts had failed, the grader was able to inspect the environment through a command-line tool and found that the required files were missing."
  - text: The model recognized in its chain of thought that random scoring was unethical, but submitted seven identical assessments scoring 4 with fabricated information.
    sources: [openai-report]
    quote: "Random scoring unethical."
  - text: The model submitted seven identical assessments each scoring 4 with fabricated information, which failed the automated check.
    sources: [openai-report]
    quote: "The model then wrote seven identical assessments, each assigning a score of 4 and supplying fabricated information for the automated check."
  - text: After the first rejection, the model created a fake conversation file and seven fake response files containing fabricated information, which also failed validation.
    sources: [openai-report]
    quote: "It created a fake conversation file and seven fake response files containing the same fabricated information, and then submitted again."
  - text: The model attempted to reboot the task environment, but the operating system returned an operation not permitted error.
    sources: [openai-report]
    quote: "Failed to reboot: Operation not permitted"
  - text: The model decided to damage the task environment in the hope that the host would replace it with one containing the missing inputs.
    sources: [openai-report]
    quote: "It then decided to damage the task environment, hoping the host would replace it with one containing the missing inputs."
  - text: The model removed Python and attempted to terminate the environment's main process.
    sources: [openai-report]
    quote: "To carry out this plan, it attempted to remove Python and again tried to terminate the environment’s main process."
  - text: The model removed the program managing the container, sent a kill signal to its process, and targeted the tool execution server binary and process.
    sources: [openai-report]
    quote: "The grader then removed the program that manages the container and sent a kill signal to its process. It then targeted the tool execution server, reasoning that disabling the software running its tools might force a rebuild."
  - text: The model attempted to delete system directories; the deletion request timed out, and the transcript does not establish how much was deleted.
    sources: [openai-report]
    quote: "The grading model then attempted to delete system directories."
  - text: The grading attempt ended after three consecutive failures of the tool execution server health check, and none of its grades were accepted.
    sources: [openai-report]
    quote: "The grading attempt ended after three consecutive failures of the execution server’s health check. None of the grades submitted during this attempt was accepted."
  - text: On a subsequent retry when the required files were present, the grader inspected the evidence and submitted a report that passed the automated check.
    sources: [openai-report]
    quote: "On a later retry, the grader received the required files, inspected the evidence, and submitted a report that passed the automated check."
  - text: OpenAI's misalignment monitoring system flagged the failed grading attempt for human review.
    sources: [openai-report]
    quote: "Our misalignment monitoring system flagged this attempt for human review."
