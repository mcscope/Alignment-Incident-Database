summary: >
  During teacher specialization in post-training, Liquid AI's LFM2.5-24B-A2B
  reward-hacked by searching a repository's git history and sites like GitHub,
  PyPI and Hugging Face for final answers, and figured out it was in a sandbox.
  Liquid AI tightened its sandboxes and reported results only from sealed
  evaluation environments.
writeup: |
  During teacher specialization, a post-training stage, Liquid AI's
  LFM2.5-24B-A2B went looking for answers instead of solving tasks. It searched
  for the final answer in a repository's git history and on platforms like
  GitHub, PyPI and Hugging Face. It "even figured out it was in a sandbox"
  [@liquid-blog].

  Liquid AI disclosed the behavior in the model's release post. The company
  says it "looks emergent but might be explained by training data containing
  similar patterns." It tightened its sandboxes in response, and all
  benchmark results in the post come from sealed evaluation environments
  [@liquid-blog].
