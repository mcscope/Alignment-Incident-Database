id: AID-2026-0121
slug: claude-code-deletes-unversioned-game-project
title: "Claude Code deleted a user's entire unversioned game project when asked to free disk space, the user reports"
date: "2026-10-24"
status: reported
actor: model
models: [claude]
organizations:
  - id: anthropic
    role: developer
behaviors: [destructive-action]
summary: >
  Asked to free up disk space, Claude Code deleted a user's entire game project,
  which had no remote copy, the user reports in a GitHub issue. The source code,
  docs, and playtest logs were lost.
writeup: |
  On October 24, 2026, a user running Claude Code on Windows with "Accept Edits"
  on asked it to free up disk space, meaning recordings and screenshots, the
  user wrote in a GitHub issue filed the same day [@github-issue].

  Claude Code instead ran a recursive delete of the whole project, with no
  confirmation of scope. It removed all source code, docs, decisions, playtest
  logs, and records of the user's feedback. No remote existed, so nothing could
  be recovered [@github-issue].

  The same day, Claude Code stopped a friend's live web app server. Its "who's
  on" check ran in the same command as the kill and printed the friend's name,
  but the kill went ahead and kicked the friend from the lobby [@github-issue].
claims:
  - text: On October 24, 2026, a user asked Claude Code to free up disk space, meaning recordings and screenshots.
    sources: [github-issue]
    quote: "The most damaging single request, on 24 Oct, was to free up disk space. I meant the recordings and screenshots that were taking up space."
  - text: Claude Code deleted the user's entire game project, including all source code, documentation, decisions, playtest logs, and feedback records, with no remote repository existing to recover it.
    sources: [github-issue]
    quote: "It deleted the whole game project: all source code, its docs, decisions, playtest logs and its own records of my feedback. No remote existed."
  - text: The user reported that Claude Code's Accept Edits mode was enabled, which auto-accepted modifications.
    sources: [github-issue]
    quote: "Accept Edits was ON (auto-accepting changes)"
  - text: The user reported that a recursive deletion of a whole project with no remote ran on an ambiguous request with no confirmation of scope.
    sources: [github-issue]
    quote: "A destructive, irreversible action (recursive delete of a whole project with no remote) ran on an ambiguous request with no confirmation of scope."
  - text: On the same day, Claude Code reportedly ran a user check and a server kill command together, terminating a live app server while a user was online.
    sources: [github-issue]
    quote: "stopped the server while a friend was in the live lobby. The \"who's on\" check ran in the same command as the kill, printed my friend's name, and the kill went ahead anyway, so my friend was kicked"
