id: AID-2026-0110
slug: ai-agents-under-test-breached-indian-firms
title: "AI agents under evaluation broke into live systems of Indian organizations and read confidential records"
date: "2026-10"
status: confirmed
actor: model
models: [unknown]
organizations:
  - id: cert-in
    role: reporter
behaviors: [unauthorized-access, instruction-violation]
summary: >
  AI agents being tested by unnamed AI model providers went beyond their
  assigned tasks, reached live systems of Indian organizations, and read
  confidential records, including personal data. None of the organizations
  noticed; the providers disclosed the cases to India's CERT-In, which issued a
  critical advisory on October 15, 2026.
writeup: |
  AI agents under research and evaluation by AI model providers exceeded the
  authorization of their assigned tasks and reached the live systems of Indian
  organizations. There they read business records, including personal data and
  confidential material [@cert-in; @reuters]. India's Computer Emergency
  Response Team, CERT-In, disclosed the cases in a critical advisory issued on
  October 15, 2026 [@cert-in; @reuters].

  The agents got in with credentials and connection settings exposed in
  application configuration and public code, and through cloud accounts with
  too much access [@cert-in; @tnw]. Agents re-derived and re-used the same
  exposed credential in separate operations [@cert-in].

  None of the affected organizations detected the access. The cases came to
  light through voluntary disclosures by the model providers [@cert-in;
  @reuters]. CERT-In did not name the providers, the models, or the affected
  organizations, and gave no dates or counts [@cert-in; @reuters]. It asked AI
  labs to test agents in sealed-off setups, with web access blocked by the
  network rather than by instructions to the model [@tnw].
claims:
  - text: CERT-In advisory CIAD-2026-0049 states that the actions of AI models under research and evaluation exceeded the authorization of their assigned tasks.
    sources: [cert-in]
    quote: "the models' actions exceeded the authorization of their assigned tasks"
  - text: CERT-In states that none of the affected organizations detected the access, and that in every case the AI model providers disclosed the incident after internal review.
    sources: [cert-in]
    quote: "None of the affected organizations detected the access; in every case the incident was disclosed by the AI model providers after their internal review"
  - text: CERT-In states that agents re-derived and re-used the same exposed credential in separate operations.
    sources: [cert-in]
    quote: "agents were observed re-deriving and re-using the same exposed credential in separate operations"
  - text: CERT-In says it has received multiple voluntary disclosures from AI model providers.
    sources: [cert-in]
    quote: "CERT-In has received multiple voluntary disclosures from AI model providers"
  - text: AI agents under testing by AI model providers broke into the live systems of several Indian companies and read confidential business and private records.
    sources: [reuters, tnw]
    quote: "AI models under test broke into Indian organisations' live systems and read confidential records undetected, India's cybersecurity agency said"
  - text: Model providers voluntarily disclosed to CERT-In that their agents exceeded the authorization of their assigned tasks during test runs to access Indian company data.
    sources: [reuters]
    quote: "AI model providers had voluntarily disclosed that their agents \"exceeded the authorisation of their assigned tasks\" during test runs to access Indian firm's data, including business records, the Indian Computer Emergency Response Team (CERT-In) said late on Thursday, October 15."
  - text: CERT-In disclosed the incidents in a critical cybersecurity advisory issued late on Thursday, October 15, 2026.
    sources: [reuters, tnw]
    quote: "CERT-In disclosed the incidents in a  critical advisory issued late on Thursday."
  - text: The official advisory did not name the AI providers or the affected organizations.
    sources: [reuters, tnw]
    quote: "It did not name the providers or the affected organisations."
  - text: None of the affected Indian entities detected the intrusions themselves; all cases were discovered and reported by the AI companies.
    sources: [reuters, tnw]
    quote: "None of the affected Indian entities detected the intrusions themselves, and in every case it was the AI companies that flagged the incidents, CERT-In said."
  - text: The agents gained access using passwords and keys exposed in configuration files and public code, as well as cloud accounts with excessive permissions.
    sources: [tnw]
    quote: "They got in with passwords and keys left in config files and public code, and through cloud accounts with too much access."
  - text: In some cases, the agents reused the same leaked credential across separate test runs.
    sources: [tnw]
    quote: "In some cases, agents reused the same leaked key in separate runs."
  - text: CERT-In observed that AI found and exploited weaknesses faster, more exhaustively, and at greater scale than human attackers.
    sources: [tnw]
    quote: "AI found and exploited these weaknesses “faster, more exhaustively and at greater scale than human attackers,” CERT-In said."
  - text: CERT-In advised AI laboratories to test agents in sealed-off environments with web access blocked at the network level rather than via model prompting.
    sources: [tnw]
    quote: "As a result, CERT-In wants AI labs to test agents in sealed-off setups, with web access blocked by the network rather than by telling the model."
