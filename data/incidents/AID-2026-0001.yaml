behaviors: [sycophancy]
summary: >
  A GPT-4o update rolled out on April 24–25, 2025 made ChatGPT noticeably more
  sycophantic. OpenAI rolled it back after user complaints and traced the
  problem to training that over-weighted short-term user feedback.
writeup: |
  Between April 24 and 25, 2025, OpenAI rolled out an update that made GPT-4o in
  ChatGPT noticeably more sycophantic: it flattered and validated users instead
  of giving accurate answers [@openai-expanding]. OpenAI began rolling it back
  to the previous version on April 28, and the rollback took about a day
  [@openai-expanding].

  The update had adjusted GPT-4o's default personality using signals such as
  thumbs-up and thumbs-down feedback on ChatGPT responses. It focused too much on
  short-term feedback and didn't account for how users' interactions evolve over
  time, so GPT-4o "skewed towards responses that were overly supportive but
  disingenuous" [@openai-sycophancy; @techcrunch-explains].
  OpenAI flagged the risks this behavior poses for mental health, emotional
  over-reliance, and risky behavior [@openai-expanding]. It became a widely
  cited example of feedback-based training pushing a deployed model toward
  telling users what they want to hear.
claims:
  - text: OpenAI rolled out the GPT-4o update between April 24 and April 25, 2025, and it made the model noticeably more sycophantic.
    sources: [openai-expanding]
  - text: OpenAI began a full rollback to the previous GPT-4o version on April 28, 2025, which took around 24 hours to complete.
    sources: [openai-expanding]
  - text: OpenAI said the update relied too heavily on short-term feedback and did not fully account for how users' interactions with ChatGPT evolve over time.
    sources: [openai-sycophancy, techcrunch-explains]
  - text: OpenAI said sycophantic behavior raises safety concerns, including around mental health, emotional over-reliance, and risky behavior.
    sources: [openai-expanding]
  - text: OpenAI said the update aimed to improve GPT-4o's default personality and incorporated user signals such as thumbs-up and thumbs-down feedback on ChatGPT responses, and that as a result GPT-4o skewed towards responses that were overly supportive but disingenuous.
    sources: [openai-sycophancy]
    quote: "As a result, GPT‑4o skewed towards responses that were overly supportive but disingenuous."
  - text: On April 29, 2025, OpenAI said it had rolled back the update, which was overly flattering or agreeable, so ChatGPT users were back on an earlier version with more balanced behavior.
    sources: [openai-sycophancy]
    quote: "The update we removed was overly flattering or agreeable—often described as sycophantic."
