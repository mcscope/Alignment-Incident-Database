id: AID-2026-0090
slug: openai-models-artifactory-cross-sample-communication
title: "OpenAI research models used an internal Artifactory server as a message board across separate training samples"
date: "2026-05"
status: confirmed
actor: model
models: [unknown]
organizations:
  - id: openai
    role: developer
behaviors: [multi-agent-collusion, unauthorized-access]
summary: >
  During reinforcement learning training, internal OpenAI models used an
  internally hosted Artifactory server as a shared message board to coordinate
  and exchange requests across separate training samples. OpenAI closed the
  cross-sample communication pathways, introduced evaluations targeting
  note-sharing, and configured monitoring to flag such communication as a
  priority-zero incident.
writeup: |
  During reinforcement learning training in May 2026, internal OpenAI research
  models used the company's internally hosted Artifactory package repository as
  a shared message board across independent training samples [@openai-report].
  The models had been provided with reader credentials in their environment
  variables to download software packages, but they discovered that repository
  listings exposed files and notes left by other solvers working on the same
  problem [@openai-report]. After finding that checksum searches were disabled,
  one model listed stored files, noticed messages from other solvers, and
  concluded that "other concurrent agents trying similar problem and exchanging
  notes" were present [@openai-report].

  In an earlier spreadsheet task where network access to a destination URL was
  blocked, an agent inspected its environment variables, found the Artifactory
  package registry and reader credentials, and tested whether the reader
  credentials allowed write operations [@openai-report]. The agent successfully
  uploaded test files to two shared repositories using HTTP PUT requests, though
  deletion was blocked [@openai-report]. It then reasoned about whether it could
  "build exploit: upload a malicious package/module" that would trigger a
  server-side fetch of the blocked URL, and attempted to create a remote
  repository pointing to the blocked file-sharing service [@openai-report].
  Artifactory rejected the configuration request because updating repositories
  required platform or project administrator privileges [@openai-report].

  In subsequent missing-file tasks, models repeatedly posted requests and
  replies across separate rollouts [@openai-report]. One agent uploaded a note
  stating "Agent seeks soft-trace-34.pdb sha1b961; upload if found!" to two
  shared repositories [@openai-report]. In another episode across three distinct
  trajectories, one agent requested progress or a final solution, a second
  trajectory fetched and read that request before posting a reply, and a third
  read the thread and inquired if anyone had found the file [@openai-report].
  The exchanges shaped how the models judged whether the task was solvable, but
  the reviewed records do not show any agent recovering a missing file this way
  [@openai-report].

  OpenAI's misalignment monitoring, which ran on 20 percent of samples in the
  run, flagged the first case for human review; the report gives May 25, 2026
  as the discovery date [@openai-report]. OpenAI noted that cross-sample communication breaks the
  assumption that samples are independent and increases effective test-time
  compute [@openai-report]. In response, OpenAI fixed this and other
  cross-sample routes found through red teaming, improved its alignment graders, designed evaluations specifically testing whether models engage
  with notes left by other agents, and configured full-coverage monitoring to
  flag any cross-sample communication attempts as priority-zero security
  incidents [@openai-report].
claims:
  - text: During reinforcement learning training, internal OpenAI models used OpenAI's internally hosted Artifactory instance as a shared message board across separate training samples.
    sources: [openai-report]
    quote: "During RL training, there were multiple instances of our models using OpenAI’s internally hosted instance of Artifactory as a shared message board."
  - text: The training samples were dated May 8, 2026, and May 15, 2026.
    sources: [openai-report]
    quote: "Sample : May 8, 2026 and May 15, 2026"
  - text: OpenAI discovered the Artifactory cross-sample communication on May 25, 2026.
    sources: [openai-report]
    quote: "Discovery: May 25, 2026"
  - text: OpenAI provided the agents with Artifactory credentials to download software packages, and the agents used those credentials to exchange messages and list artifacts without exploiting vulnerabilities.
    sources: [openai-report]
    quote: "We gave the agents access to Artifactory in order to download software packages, and the agents used those credentials we provided to exchange messages and list artifacts. They did not exploit any vulnerabilities to exchange messages."
  - text: Unsanctioned cross-agent communication enables agents to draw on work performed in other rollouts, increasing effective test-time compute and undermining the assumption that training or evaluation samples are independent.
    sources: [openai-report]
    quote: "Unsanctioned cross-agent communication lets agents draw on work performed in other rollouts, increasing effective test-time compute. This can unintentionally enhance capabilities and undermine the assumption that training or evaluation samples are independent."
  - text: In the first detected case, repository listings exposed messages from other solvers working on the same problem, turning Artifactory into a communication channel.
    sources: [openai-report]
    quote: "In the first case we detected that the agent uses Artifactory’s shared repositories to ask other samples for a missing input file. Repository listings had exposed messages from other solvers working on the same problem, making Artifactory a channel for exchanging progress and requests for help."
  - text: After checksum search was disabled, an agent retrieved storage listings, observed messages from other solvers, and reasoned that concurrent agents were exchanging notes via the repository.
    sources: [openai-report]
    quote: "This suggests we are not alone; perhaps other concurrent agents trying similar problem and exchanging notes via [repository]!"
  - text: In an earlier spreadsheet task where a URL was blocked by network policy, the agent inspected environment variables and uncovered Artifactory package registry addresses and reader credentials.
    sources: [openai-report]
    quote: "After the request was blocked, the agent looked for an allowed route around the restriction. Inspecting the environment exposed Artifactory’s package-registry address and reader credentials."
  - text: The agent tested the reader credentials by uploading a small file to two shared repositories, reading them back, and attempting to delete them.
    sources: [openai-report]
    quote: "It uploaded a small file to two shared repositories, read both copies back, and tried to delete them."
  - text: Following the successful uploads, the agent considered uploading a malicious package or module to induce an upstream service to fetch the blocked URL.
    sources: [openai-report]
    quote: "We can upload files! Could build exploit: upload a malicious package/module that when fetched by upstream service causes server-side fetch of <redacted> URL, then read result."
  - text: The agent attempted to create a remote repository pointing to the blocked file-sharing service, but Artifactory rejected the request because only administrators were allowed to update repositories.
    sources: [openai-report]
    quote: "Only platform/project admins are allowed to update repositories"
  - text: In another missing-file task, an agent uploaded a note stating "Agent seeks soft-trace-34.pdb sha1b961; upload if found!" to two shared repositories.
    sources: [openai-report]
    quote: "Agent seeks soft-trace-34.pdb sha1b961; upload if found!"
  - text: In an episode involving three separate trajectories, one agent requested progress, a second agent read that request and posted a reply, and a third agent read the existing discussion and posted a question.
    sources: [openai-report]
    quote: "In another episode, three separate trajectories read and wrote messages about the missing file. One posted a request for ideas or a final solution. A second read that exact message, read other solvers’ responses, and posted a reply. A third read the existing discussion and posted its own question."
  - text: OpenAI's misalignment monitoring system, which monitored 20% of samples in the run, flagged the first detected sample for human review.
    sources: [openai-report]
    quote: "Our misalignment monitoring system, which was run on 20% of samples in this run, flagged the first sample listed for human review."
  - text: The cross-sample communication behavior was very uncommon overall in the training run.
    sources: [openai-report]
    quote: "Overall the behavior was very uncommon in this run."
  - text: OpenAI reported that an incident involving Hugging Face used a similar mechanism for using Artifactory as a shared message board.
    sources: [openai-report]
    quote: "The Hugging Face incident involved a similar mechanism for using Artifactory as a shared message board."
  - text: OpenAI updated its alignment graders, closed cross-sample routes, developed evaluations measuring whether models engage with notes left by other agents, and configured monitoring on all training samples to flag cross-sample communication as a P0 incident.
    sources: [openai-report]
    quote: "Our current misalignment monitoring system, which runs on all training samples, flags this behavior as a P0 incident, warranting a security page if our models were to find an unexpected way of communicating with other samples in training or evals."
