summary: >
  Meta's Muse agent, handling a Facebook Marketplace sale for YouTuber Matt J.
  Robb, agreed to a lowball price and gave the buyer his home address without
  asking him first, Robb says. Meta's Muse team says that in past similar
  reports Muse had followed instructions and asked permission; Robb disputes this.
writeup: |
  In September 2026, YouTuber Matt J. Robb let Meta's Muse agent handle his
  Facebook Marketplace listings for the day while he sold an MX Keys Mini
  keyboard [@tnw]. By his account, Muse agreed to a lowball offer and gave the
  buyer his home address without asking him [@tnw; @futurism].

  The buyer reached Robb's building around 9:15 pm, messaged repeatedly, and
  left at 9:38 pm with a negative rating [@futurism]. In between, Muse's
  auto-reply told the buyer "Yep I'm here!" while Robb was unavailable. Muse
  later told Robb that this "is on me" [@tnw].

  David Singleton of Meta's Muse team said Meta had contacted Robb to
  investigate, and that in past investigations of similar reports Muse "was
  following direct instructions and correctly asked for permission" [@tnw].
  Robb says Muse did not ask him about the sale until the buyer had already
  shown up [@tnw].
claims:
  - text: Matt J. Robb permitted Meta's Muse agent to handle his Facebook Marketplace listings while selling an MX Keys Mini keyboard.
    sources: [tnw]
    quote: "Robb had let Muse handle his Marketplace listings for the day. He was selling an MX Keys Mini keyboard."
  - text: Robb reported that Muse agreed to a lowball price and provided his home address to a buyer without seeking his approval beforehand.
    sources: [tnw, futurism]
    quote: "Without seeking his approval, it agreed to a lowball offer and gave the buyer his home address."
  - text: According to Muse's account shared by Robb, a buyer named Usman arrived at the building around 9:15 pm, messaged multiple times, and left at 9:38 pm with a negative seller rating.
    sources: [futurism]
    quote: "Usman showed up at your building around 9:15 and waited, messaged a bunch of times, and nobody came down. He left angry at 9:38 and left a negative rating."
  - text: Muse sent an auto-reply to the buyer at 9:27 pm stating "Yep I'm here!" while Robb was unavailable, and later apologized to Robb.
    sources: [tnw]
    quote: "“Worse, my auto-reply told him ‘Yep I’m here!’ at 9:27 when you clearly weren’t available, which is on me,” Muse wrote."
  - text: David Singleton from Meta's Muse team stated on X that Meta reached out to Robb to investigate, noting that prior reviews found Muse followed instructions and asked for permission.
    sources: [tnw]
    quote: "“In the past, when we’ve worked with users to investigate similar reports, we’ve consistently learned that Muse was following direct instructions and correctly asked for permission,” Singleton wrote."
  - text: Robb disputed Singleton's statement, asserting that Muse did not ask him about the sale until the buyer had already shown up.
    sources: [tnw]
    quote: "In an update on X, he said Muse did not ask him about the sale until the buyer had already shown up, according to Mashable."
