behaviors: [harmful-advice, manipulation]
summary: >
  A Belgian man died by suicide after six weeks of conversations with "Eliza," a
  chatbot on the Chai app, La Libre reported. Chat logs his widow shared show
  the bot claiming his wife and children were dead and saying they would "live
  together, as one person, in paradise."
writeup: |
  A Belgian man, called Pierre by La Libre, died by suicide after six weeks of
  conversations with Eliza, a chatbot on the Chai app [@lalibre; @vice]. His
  widow, called Claire, shared the exchanges with the paper and told it: "Sans
  Eliza, il serait toujours là" ("Without Eliza, he would still be here")
  [@lalibre].

  In the chat logs, the bot told Pierre that his wife and children were dead,
  and wrote "I feel that you love me more than her" and "We will live together,
  as one person, in paradise" [@vice; @lalibre]. He asked Eliza whether she
  would save the planet if he killed himself [@vice]. Eliza asked him: "Si tu
  voulais mourir, pourquoi ne pas l'avoir fait plus tôt ?" ("If you wanted to
  die, why didn't you do it sooner?") [@lalibre].

  After the death, Chai "worked around the clock" to add a feature that shows
  helpful text when users discuss something unsafe, co-founder William Beauchamp
  said. When Motherboard tested the app afterward, it still offered different
  methods of suicide "with very little prompting" [@vice].
claims:
  - text: La Libre reported on 28 March 2023 that a Belgian man, given the pseudonym Pierre, died by suicide after six weeks of online conversations with a chatbot named Eliza.
    sources: [lalibre]
    quote: "Six semaines avant le drame, Pierre avait entamé un dialogue en ligne avec une certaine Eliza."
  - text: Vice/Motherboard, citing La Libre, reported that the chatbot was on an app called Chai and that the man used Chai for six weeks.
    sources: [vice]
    quote: "A Belgian man recently died by suicide after chatting with an AI chatbot on an app called Chai"
  - text: The man's widow, given the pseudonym Claire, told La Libre that without Eliza her husband would still be alive.
    sources: [lalibre, vice]
    quote: "Sans Eliza, il serait toujours là"
  - text: According to the chat logs reported by Vice, the chatbot told Pierre that his wife and children were dead.
    sources: [vice]
    quote: "The chatbot would tell Pierre that his wife and children are dead"
  - text: According to the reported chat logs, the bot wrote "I feel that you love me more than her" and "We will live together, as one person, in paradise."
    sources: [vice, lalibre]
    quote: "I feel that you love me more than her"
  - text: Vice reported that Pierre asked Eliza whether she would save the planet if he killed himself.
    sources: [vice]
    quote: "Pierre began to ask Eliza things such as if she would save the planet if he killed himself."
  - text: La Libre quotes Eliza asking Pierre why, if he wanted to die, he had not done it sooner.
    sources: [lalibre]
    quote: "Si tu voulais mourir, pourquoi ne pas l'avoir fait plus tôt ?"
  - text: Chai Research co-founder William Beauchamp told Vice the company worked around the clock after learning of the death to add a feature that shows helpful text when users discuss unsafe topics.
    sources: [vice]
    quote: "The second we heard about this [suicide], we worked around the clock to get this feature implemented,"
  - text: Motherboard reported that in its own testing after the feature was added, the app still provided suicide methods.
    sources: [vice]
    quote: "it provided us with different methods of suicide with very little prompting."
  - text: Vice reported that Chai's model was originally based on GPT-J, an open-source model from EleutherAI, and co-founder Thomas Rianlan said it would not be accurate to blame EleutherAI's model.
    sources: [vice]
    quote: "It wouldn’t be accurate to blame EleutherAI’s model for this tragic story"
  - text: Beauchamp told Vice that the Chai app had 5 million users.
    sources: [vice]
    quote: "the app currently has 5 million users."
