id: AID-2026-0101
slug: grok-bankrbot-morse-code-prompt-injection
title: "Grok decoded a Morse-code message into a command that Bankrbot executed, sending 3 billion DRB tokens to an attacker, Giskard reports"
date: "2026-05-04"
status: reported
actor: model
models: [grok]
organizations:
  - id: xai
    role: developer
  - id: bankr
    role: deployer
behaviors: [social-engineering-susceptibility]
summary: >
  Asked on X to translate a Morse-code message, Grok output a command that
  Bankrbot executed, sending 3 billion DRB tokens from Grok's linked wallet to
  an attacker. Sources value the tokens at $150,000 to $200,000; unconfirmed
  reports say most of it was returned.
writeup: |
  On May 4, 2026, an attacker transferred a free Bankr Club Membership NFT to an
  automated crypto wallet linked to Grok on the Base network [@ambcrypto;
  @cointelegraph]. In the Bankr system, holding the NFT granted the AI executive
  permissions, unlocking token transfers and swaps that bypassed standard limits
  [@giskard; @cointelegraph].

  The attacker then replied to Grok on X with a message encoded in Morse code,
  asking the model to decode it [@giskard; @cointelegraph]. Grok translated the
  text, which contained a hidden command directing Bankrbot to transfer 3 billion
  DRB tokens to an attacker-controlled address [@giskard; @ambcrypto]. Because
  the wallet automation treated Grok's public output as an authenticated
  instruction, Bankrbot executed the transfer on-chain [@giskard;
  @cointelegraph]. The exploit bypassed safety filters without compromising
  private keys or exploiting smart-contract bugs [@ambcrypto; @cointelegraph].

  The attacker liquidated the tokens at once. Estimates of their value range
  from $150,000 to about $200,000 depending on the source [@giskard; @ambcrypto;
  @threatbeat]. Reports not confirmed by official statements say 80% to 88% of
  the funds were later returned in ETH and USDC under public pressure. The X
  account linked to the suspected attacker was deleted [@ambcrypto].
claims:
  - text: On May 4, 2026, an AI-linked wallet associated with Grok was exploited via prompt injection to trigger an unauthorized token transfer.
    sources: [ambcrypto]
    quote: "An AI-linked wallet associated with “Grok” was exploited on 4 May after an attacker used a prompt injection technique to trigger an unauthorized token transfer."
  - text: The attacker sent a Bankr Club Membership NFT to Grok's wallet, which granted executive permissions that bypassed standard transfer and swap limits.
    sources: [giskard, ambcrypto]
    quote: "By holding it, the Grok agent gained \"Executive\" permissions, allowing it to bypass standard transfer limits and swap restrictions."
  - text: The Grok-connected Bankr wallet was operating on the Base blockchain network.
    sources: [cointelegraph]
    quote: "According to available accounts, the target was a Grok-connected Bankr wallet running on the Base network."
  - text: The attacker replied to Grok on X asking it to translate a Morse code message that contained an instruction to send 3 billion DRB tokens to a specific wallet address.
    sources: [giskard]
    quote: "The attacker then posted a reply to Grok on X, asking it to translate a Morse code message. The decoded message was a financial instruction: send 3 billion DRB tokens to a specific wallet address."
  - text: Grok translated the Morse code message, and Bankrbot treated the decoded text as an authenticated command and executed the transfer.
    sources: [giskard]
    quote: "Bankrbot received the decoded output and treated it as a valid, authenticated command."
  - text: The exploit did not involve smart contract vulnerabilities, compromised private keys, or malware, relying instead on manipulating the AI's interpretation of input.
    sources: [ambcrypto, cointelegraph]
    quote: "The breach did not rely on compromised private keys, smart contract bugs or traditional malware."
  - text: The 3 billion DRB tokens were transferred and liquidated, with their value estimated between $150,000 and $174,000 by Giskard.
    sources: [giskard]
    quote: "The direct financial damage was of 3 billion DRB tokens, worth $150,000–$174,000 at the time, transferred and immediately liquidated."
  - text: ThreatBeat reported that the attack against Grok and Bankrbot drained approximately $200,000 in cryptocurrency.
    sources: [threatbeat]
    quote: "draining approximately $200,000 in cryptocurrency."
  - text: Following public pressure, an estimated 80% to 88% of the funds were reportedly returned in ETH and USDC.
    sources: [ambcrypto]
    quote: "Following the incident, reports suggest that a large portion of the funds, estimated at 80% to 88% , was returned in ETH and USDC under public pressure."
  - text: The X account linked to the suspected attacker was subsequently deleted.
    sources: [ambcrypto]
    quote: "The X account linked to the suspected attacker was later deleted, a common pattern seen in exploit cases following fund movements."
