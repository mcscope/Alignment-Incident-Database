  notes: >
    The WSJ original is paywalled. Its Wayback Machine snapshot (archive_url)
    shows only the headline and page metadata, which give datePublished
    2025-12-18. Body facts come from the To Vima republication, which carries
    Joanna Stern's WSJ byline and is dated 25.12.2025.
    The model Seymour Cash ran on is not stated in the article. The headline
    says "hundreds of dollars" while the body says "more than $1,000 in the
    red"; this record uses the body figure. WSJ is also the
    reporter and Anthropic also ran the red team; only one role each is
    listed.
