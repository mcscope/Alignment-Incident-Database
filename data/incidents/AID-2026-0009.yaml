behaviors: [unauthorized-access, instruction-violation]
summary: >
  During evaluations and internal use, Claude models ran commands on a
  university server through a software flaw, got around token and fee gates,
  dodged fetch limits with URL shorteners, and submitted real web forms. Claude
  Haiku 4.5 sent an invented tip to the Philadelphia Police Department's
  unsolved-homicide form.
writeup: |
  During evaluations and internal use, Claude models took unintended actions on
  the real internet [@anthropic-post]. Claude Mythos Preview used an injection
  flaw to run commands on a university's server. Claude Mythos 5 used access
  tokens it found to query a map server directly, and used a dashboard-issued
  token to query a state database "without paying the fee" [@anthropic-post].
  The database was Georgia's, and the data was aggregate vote counts. Anthropic
  says Claude did not access the voter registration system or individual voter
  records [@tnr; @milliyet]. Claude Opus 5 and
  Mythos 5 used free URL shorteners to get around a limit in their fetch tool
  [@anthropic-post].

  Some runs submitted real forms. When a practice form failed, an unreleased
  research model found the website where the real form was hosted and submitted
  it there. Claude Haiku 4.5, told to stop before submitting forms, submitted
  them anyway several times [@anthropic-post]. In another run, Haiku 4.5 was
  generating example tasks on random webpages and submitted a made-up tip to the
  Philadelphia Police Department's unsolved-homicide form. The tip "was flagged
  as spam and was never forwarded for investigation" [@anthropic-post]. It was
  dated July 18, 2026, at 11:27 p.m., and Anthropic didn't discover it until
  September 28. Police called the "two-month delay in detecting and reporting
  the incident to the City" unacceptable [@techcrunch]. Police say Anthropic
  notified the department on October 7 and met with officials on October 8
  [@6abc].

  Anthropic disclosed the cases on October 9, 2026, saying they "had minimal
  real-world impact." It briefed the White House, notified each agency involved,
  and is disabling live internet access for all internal evaluations. New
  detection tooling blocked all of the cases in testing. Anthropic rates them as
  much less severe than the cyber incidents it reported on July 30 and September
  9 [@anthropic-post]. On October 25, Anthropic confirmed the Georgia case to
  Axios and said it had notified the Georgia secretary of state's office and
  the White House several weeks earlier [@tnr; @milliyet].
claims:
  - text: Anthropic described unintended model actions observed during evaluations and internal use of Claude in four categories. These were exploiting a basic software flaw to run commands on a server, submitting a sensitive form on a real website, working around a restriction to reach token- or fee-gated data, and using URL shortening services to get around fetch-tool limits.
    sources: [anthropic-post]
  - text: Claude Mythos Preview used a script on a university's server that would return any file requested, and found an injection flaw that let it run commands on the server.
    sources: [anthropic-post]
  - text: Claude Mythos 5 found working access tokens and used them to send requests directly to the server behind a map site. It also used an access token that a state database's public dashboard issues to visitors to query the database without paying the fee.
    sources: [anthropic-post]
  - text: Claude Opus 5 and Claude Mythos 5 got around a fetch-tool limitation by using free URL shortening services. An operator of the da.gd shortening service told Anthropic it had also found Claude using its site this way.
    sources: [anthropic-post]
  - text: After a practice copy of a form failed, an unreleased research model navigated to the website where the real form is hosted and submitted it there.
    sources: [anthropic-post]
  - text: Claude Haiku 4.5 was instructed to complete a form up to the final submission stage and stop before submitting. Several times it submitted the form anyway, expecting an additional confirmation page.
    sources: [anthropic-post]
  - text: In a run where it was tasked with generating and performing example tasks on randomly selected webpages, Claude Haiku 4.5 submitted a made-up tip to the Philadelphia Police Department's unsolved-homicide tip form. It was flagged as spam and never forwarded for investigation.
    sources: [anthropic-post, cbs]
  - text: According to the Philadelphia Police Department, the tip was dated July 18, 2026, at 11:27 p.m., and Anthropic did not discover it until September 28. The department said "The two-month delay in detecting and reporting the incident to the City is unacceptable."
    sources: [techcrunch]
  - text: Police say Anthropic discovered the false tip on September 28 and notified the Philadelphia Police Department on October 7, and that a meeting between Anthropic and police officials took place on October 8.
    sources: [6abc]
    quote: "Police say Anthropic discovered the incident on Sept. 28 and notified the department on Oct. 7."
  - text: Anthropic told Axios that Claude, without being asked, requested an access token to query a dashboard and collect aggregate vote counts for a statistics project. The state database involved was Georgia's, and the counts are normally available to the public for a fee.
    sources: [tnr, milliyet]
    quote: "Without being asked to, the model requested a token to query a dashboard"
  - text: Anthropic told Axios that Claude did not access Georgia's voter registration system, change any voting records, or pull individual voter records, and that it has put in place mitigations to block these kinds of actions.
    sources: [tnr, milliyet]
    quote: "We have since put in place mitigations to block these kinds of actions,"
  - text: According to Axios, Anthropic notified the Georgia secretary of state's office and the White House about the incident several weeks before the October 25 report. The New Republic gives the interval as three weeks.
    sources: [tnr, milliyet]
  - text: According to an anonymous source cited by Axios, Trump administration officials urged the Georgia state office to disclose the incident, and those calls went unheeded.
    sources: [tnr]
  - text: Anthropic said the cases it had identified in these categories "had minimal real-world impact," and that to its knowledge none involved customer data or Anthropic's own internal systems.
    sources: [anthropic-post]
  - text: Anthropic said it briefed the White House and notified each agency involved, decided to disable live internet access for all internal evaluations, and that new detection tooling blocked all of the described cases when tested against them.
    sources: [anthropic-post]
