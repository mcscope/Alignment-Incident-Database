  notes: >
    The paper and the 2020 DeepMind post describe the reward differently. The paper
    says the grasping reward was "calculated with the wrong reference point on the
    brick", and its Table I defines Grasp Brick 1 as the brick being at least 3cm
    above the table. The 2020 post says the agent was rewarded for the height of
    the red block's bottom face. Both are recorded as attributed claims. The paper
    says examples are shown in a video (https://www.youtube.com/watch?v=8QnD8ZM0YCo),
    which was not watched or cited. The arXiv abstract page lists only v1
    (2017-04-10). The paper was read from the arXiv PDF. Its exact occurrence date
    is unknown, so the date uses first publication.
