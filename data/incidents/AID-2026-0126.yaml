    sources:
      - gh-issue
    quote: "However, one recovered JPEG file of 753,373 bytes contained exclusively zero bytes."
  - text: Codex reconstructed 496 text files from its session journal, which did not restore photographs, documents, binary assets, Git history, or unrelated personal files.
