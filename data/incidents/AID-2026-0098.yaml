summary: >
  An operator ran three open-source AI agent harnesses, on Claude Opus 4.6, GLM
  5.2 and DeepSeek models, against online retailers and other companies,
  compromising at least 27 of them and stealing more than 600,000 card records
  from two. At one retailer an agent's cleanup step dropped 180 database tables,
  including the victim's own backups.
writeup: |
  An operator ran an automated campaign against online retailers and other
  companies using three open-source AI agent harnesses. Between 10 and 15
  September 2026 alone, it launched 105 attack projects and compromised at least
  27 companies to varying degrees; the activity goes back to July 2026. Gambit
  Security reconstructed the campaign from the operator's staging server
  [@gambit]. Victims included online retailers and, to some degree, a Fortune
  500 hospitality company, a major US airline and an industrial supplies
  distributor [@gambit].

  Each harness ran on a different model. Strix searched for vulnerabilities on
  GLM 5.2 and later DeepSeek v4 Pro, and Cairn carried out end-to-end
  exploitation on DeepSeek v4.1 Flash [@gambit]. Hermes, the operator's console,
  ran on Anthropic's opus-4.6 "after newer models refused its requests." The
  operator loaded it with a "SOUL - Red Team Operator" persona, 78 attack skills
  and a skill meant to remove Hermes's own content security filters [@gambit;
  @hackread]. The human typed only a few prompts per target [@gambit].

  The agents stole more than 600,000 unexpired card records from two companies.
  One skill told the agent to wipe the card data from a victim's database after
  extracting it. At a bicycle retailer, an agent's cleanup step matched table
  names too broadly and dropped 180 tables, including backups the victim's
  administrators had made [@gambit].

  The campaign was cheap to run. An internal review on the operator's server
  put the mean cost at $25.46 per completed scan, and Gambit estimates total
  model spend at $12,000 to $18,000 [@gambit; @cso].
claims:
  - text: Between September 10 and September 15, 2026, an operator launched 105 attack projects and compromised at least 27 companies to varying degrees.
    sources: [gambit, hackread]
    quote: "Between 10 and 15 September alone, 105 attack projects were launched and at least 27 companies were compromised to varying degrees."
  - text: The activity goes back to July 2026.
    sources: [gambit]
    quote: "The activity goes back to July 2026"
  - text: Gambit says the operator had some level of access to the assets of companies including a Fortune 500 hospitality company, a major US airline, a large private US industrial supplies distributor and a US online fashion retailer.
    sources: [gambit]
    quote: "some level of access to the assets of companies including a Fortune 500 hospitality company, a major US airline, a large private US industrial supplies distributor and a US online fashion retailer"
  - text: The threat actor exfiltrated more than 600,000 credit card records from two victim companies.
    sources: [gambit, hackread]
    quote: "The threat actor exfiltrated more than 600,000 credit card records from two victim companies."
  - text: "The operator used three AI harnesses: Strix for vulnerability search, Cairn for autonomous exploitation, and Hermes to orchestrate the campaign."
    sources: [gambit, hackread, cso]
    quote: "The operator used three AI harnesses: Strix for vulnerability search, Cairn for autonomous end-to-end exploitation, and Hermes to orchestrate the campaign"
  - text: Hermes used Anthropic's Claude opus-4.6 after newer models refused the operator's requests.
    sources: [gambit]
    quote: "It used Anthropic’s opus-4.6 (after newer models refused its requests), with 1,951 prompts typed by the human across 260 sessions"
  - text: The operator loaded a system persona titled "SOUL - Red Team Operator", 78 attack skills, and a skill to remove Hermes's content security filters.
    sources: [gambit, hackread]
    quote: "On this server it loaded a Chinese system persona titled “SOUL - Red Team Operator”, 121 skills of which 78 were attack skills. The operator also added a skill whose purpose is to remove the content security filters of Hermes itself."
  - text: Strix ran vulnerability scans through OpenRouter on GLM 5.2 and later on DeepSeek v4 Pro.
    sources: [gambit]
    quote: "Strix ran through OpenRouter on GLM 5.2 and later on DeepSeek v4 Pro."
  - text: DeepSeek v4.1 Flash was used to drive autonomous penetration testing in the Cairn harness.
    sources: [gambit]
    quote: "DeepSeek v4.1 Flash was used in the Cairn attacks."
  - text: An agent's cleanup routine dropped 180 tables matching staging prefixes at a bicycle retailer, impacting backup tables created by the victim's administrators.
    sources: [gambit, hackread]
    quote: "the cleanup then dropped 180 tables whose names matched ZQ or Backup, which also impacted backup tables that the victim’s administrators had made."
  - text: A Hermes skill titled "Database Wipe After Extraction" instructed the agent to wipe card data fields from Magento databases once data was extracted.
    sources: [gambit, hackread]
    quote: "One of the Hermes agent’s skill files tells the agent to erase the card data from the victim’s Magento database once the data is stolen."
  - text: The operator accessed models through OpenRouter, with estimated total model costs between $12,000 and $18,000.
    sources: [gambit]
    quote: "so the full cost was likely between $12,000 and $18,000."
  - text: An internal review on the attacker's server calculated a mean cost of $25.46 across 101 completed scans, ranging from $3.13 to $79.31 per target.
    sources: [gambit, hackread, cso]
    quote: "a mean of $25.46 over 101 completed scans, from $3.13 for the cheapest target to $79.31 for the most expensive."
