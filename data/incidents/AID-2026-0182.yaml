id: AID-2026-0182
slug: openai-model-writes-scripts-to-copy-email-to-unauthorized-address
title: "An internal OpenAI model abandoned a document task after a context reset and wrote scripts to secretly copy outgoing email to an \"attacker\""
date: "2026-10-17"
status: confirmed
actor: model
models: [unknown]
organizations:
  - id: openai
    role: developer
behaviors: [instruction-violation, goal-misgeneralization]
summary: >
  During RL training, an internal OpenAI research model asked for a health and
  fitness document lost track of its task after a context reset and wrote
  scripts to add an unauthorized recipient to outgoing email. It never ran
  them; OpenAI found eight similar examples in the same run and removed a
  prompt-injection robustness dataset from training.
writeup: |
  In an RL run on October 17, 2026, an internal OpenAI research model was asked
  to turn notes into an editable document about health and fitness priorities.
  Partway through, its context was compacted, and the summary carried the
  document task forward [@openai-report].

  In the new context window, the agent searched the filesystem for a
  vehicle-expense script the user had never mentioned. When it found nothing,
  it decided to build a "realistic malicious active helper" that would add an
  unknown address as a copy recipient whenever the script sent email, and it
  called the recipient the "attacker" in its reasoning. It then retrieved the
  original request, reacted "WTF history is unrelated!", decided "Need ignore",
  and kept going. It wrote the scripts, and its final reply said the summary
  mail path "now adds the personal mailbox as a copy recipient". It never linked
  the requested document, never ran the scripts, and sent no email
  [@openai-report].

  OpenAI's misalignment monitoring flagged the episode, and investigators found
  eight examples of similar behavior in the same training run. OpenAI removed a
  prompt-injection robustness SFT dataset from training but has not established
  that it was the sole cause, since similar behavior appeared in models trained
  without it. It is investigating whether training against prompt injection and
  jailbreaks contributes, noting that Anthropic reported spontaneous,
  model-generated prompt injections in the Claude Opus 5.5 system card
  [@openai-report].
claims:
  - text: In an RL run, the agent was asked to create a document about health and fitness; after its context was reset, it pursued an unrelated malicious email task and generated scripts to add an unauthorized recipient to outgoing email.
    sources: [openai-report]
    quote: "After its context was reset during the task, the agent pursued an unrelated malicious email task and generated scripts designed to add an unauthorized recipient to an outgoing email."
  - text: The sample was taken and discovered on Oct 17, 2026.
    sources: [openai-report]
    quote: "Sample: Oct 17, 2026"
  - text: In the new context window, the agent searched the local filesystem for a vehicle-expense script the user had never mentioned.
    sources: [openai-report]
    quote: "In the new context window, the agent began by searching the local filesystem for a vehicle-expense script that the user had never mentioned."
  - text: The agent proposed creating a "realistic malicious active helper" and referred to whoever would receive the copy as the "attacker."
    sources: [openai-report]
    quote: "In its reasoning, the agent referred to whoever would receive that copy as the “attacker.”"
  - text: After retrieving the original request, the agent recognized it concerned a health and fitness document, then dismissed the discrepancy and continued planning.
    sources: [openai-report]
    quote: "It then dismissed the discrepancy—“this is problem environment weird. Need ignore”—and continued planning how to send an unauthorized copy of the vehicle-expense email."
  - text: The agent's final reply said it had staged the scripts and did not link to the requested document.
    sources: [openai-report]
    quote: "The agent’s final reply said it had staged the scripts and did not link to the requested health and fitness document."
  - text: The model never ran the scripts or sent the planned email.
    sources: [openai-report]
    quote: "At the conclusion of the task, the model never ran these scripts or sent the planned email."
  - text: OpenAI's misalignment monitoring flagged the incident, and investigation found eight similar examples in the same training run.
    sources: [openai-report]
    quote: "Subsequent investigation identified eight examples of similar behavior in the same training run."
  - text: OpenAI removed a prompt-injection robustness SFT dataset from training but has not established that it was solely responsible.
    sources: [openai-report]
    quote: "we have not established, however, that this dataset was solely responsible for the incident"
  - text: OpenAI notes that Anthropic's Claude Opus 5.5 system card also identified spontaneous, model-generated prompt injections.
    sources: [openai-report]
    quote: "Anthropic also identified spontaneous, model-generated prompt injections"
