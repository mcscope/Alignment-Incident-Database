  notes: >
    The date is the year only. The three July-disclosed incidents date from April 2026 onward, and the fourth from January 2026. Exact dates per incident are not given.
    The affected organizations are not named.
    The Sept 9 assessment is about 122k characters. The final ~22k (after the measured rates) were not read.
    Anthropic's 2026-10-09 post on lower-severity unintended actions references these incidents and is proposed as a separate record.
