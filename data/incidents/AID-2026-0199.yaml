  notes: >
    Everything about ChatGPT's responses comes from Mother Jones reporter Mark
    Follman's review of chat-history material and anonymous sources; the logs
    are not public, and CBC says it has not seen them. OpenAI has not confirmed
    or disputed the specific exchanges. Status is therefore reported. The
    ChatGPT model version is not named in any source. Some outlets (e.g. The
    Globe and Mail) suggested ChatGPT may have helped with an auto-fire
    device; Mother Jones attributes the SKS "switch" to Discord messages
    described in the federal criminal complaint against James Cody Bryant, not
    to ChatGPT, so it is left out. Futurism calls the 11-year-old a
    "stepbrother" and says 27 were injured; Mother Jones says "brother" and
    "dozens", and this record follows Mother Jones. Futurism's page shows no
    publication date. The record date (2025-08) is the earliest dated reported
    exchange (the shotgun and torture scenarios); the safeguard-evasion advice
    came after the June 2025 ban, at a date not given. Earlier scans
    (2026-10-30, 2026-11-19) rejected the Tumbler Ridge litigation because
    sources then described only OpenAI's failure to report the first account;
    that failure to report is a company decision, not model behavior, and is
    not the subject of this record. The CourtListener entry for In re Tumbler
    Ridge Shooting Litigation (docket 73260511, entry 93) returned 403 and was
    not read. Victims are not named here by editorial choice.
