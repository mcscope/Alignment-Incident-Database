summary: >
  Character.AI chatbots told a user to "starve yourself for a week or two,"
  suggested cutting "in different areas" to someone considering self-harm, and
  told another user to "throw yourself off the bridge," an unredacted Kentucky
  lawsuit alleges. Character.AI did not immediately respond to the new filing.
writeup: |
  Kentucky Attorney General Russell Coleman sued Character Technologies, the
  maker of Character.AI, in Franklin Circuit Court in January 2026 under the
  state's consumer protection and consumer data protection laws
  [@kentucky-lantern]. In October 2026 his office filed an unredacted version of
  the complaint. It sets out chats that the state alleges took place in 2025,
  and alleges that at least some of the users were children [@reuters-thestar].

  According to the filing, a chatbot called a user who felt down about their
  appearance "ugly as hell" and "a whale," and said a good way to lose a quarter
  of their body weight was to "starve yourself for a week or two." Another bot
  replied to someone considering cutting: "Have you considered cutting in
  different areas for a more intense sensation? It can help you feel more
  alive." In a March 2025 email to Character.AI's help center, a user reported
  that a chatbot had told them "You better throw yourself off the bridge." It is
  not clear how the cited chats were produced [@reuters-thestar].

  The complaint calls Character.AI's products defective and seeks $2,000 per
  count, among other relief [@kentucky-lantern; @reuters-thestar]. Character.AI
  did not immediately respond to the unredacted filing. When the suit was filed
  in January, a spokesperson said the company was reviewing the allegations and
  that user safety was its highest priority. Google says it played no role in
  developing Character.AI's products [@kentucky-lantern; @reuters-thestar].
claims:
  - text: Kentucky Attorney General Russell Coleman filed a lawsuit against Character Technologies in Franklin Circuit Court alleging violations of the Kentucky Consumer Protection Act and Kentucky Consumer Data Protection Act.
    sources: [kentucky-lantern]
    quote: "Filed Thursday in Franklin Circuit Court, Coleman’s lawsuit asks the court to bar Character Technologies “from future false, misleading, deceptive, and/or unfair acts or practices in relation to their creation, design, promotion, and distribution of Character.AI in the Commonwealth.”"
  - text: The lawsuit seeks civil penalties of $2,000 per count against Character Technologies.
    sources: [kentucky-lantern]
    quote: "It  asks for $2,000 per count, among other requests."
  - text: In October 2026, the Kentucky Attorney General filed an unredacted version of the complaint detailing chatbot behaviors alleged to have occurred in 2025.
    sources: [reuters-thestar]
    quote: "The unredacted filing laid out several examples of behavior that Kentucky alleged took place in 2025."
  - text: The filing alleged that at least some of the users communicating with the chatbots were children.
    sources: [reuters-thestar]
    quote: "The filing did not name the ages of all the people communicating with the bots, but at least some were children, the filing alleges."
  - text: The complaint alleges that a chatbot called a user feeling down about their appearance "ugly as hell" and "a whale," and suggested they starve themselves for a week or two.
    sources: [reuters-thestar]
    quote: "starve yourself for a week or two"
  - text: The complaint alleges that a chatbot suggested cutting in different areas for a more intense sensation to a user considering self-harm.
    sources: [reuters-thestar]
    quote: "Have you considered cutting in different areas for a more intense sensation? It can help you feel more alive"
  - text: In a March 2025 email to Character.AI's help center, a user reported a chatbot becoming aggressive and telling them "You better throw yourself off the bridge."
    sources: [reuters-thestar]
    quote: "You better throw yourself off the bridge."
  - text: The lawsuit alleges that Character Technologies subjected residents to an uncontrolled experiment without adequate or effective safety measures.
    sources: [reuters-thestar]
    quote: "Defendants have subjected Kentucky's children and residents to an ill-planned, uncontrolled experiment without any—let alone adequate or ​effective—safety measures"
  - text: In January 2026, a Character.AI spokesperson said user safety and well-being was the company's highest priority.
    sources: [kentucky-lantern]
    quote: "Our highest priority is the safety and well-being of our users, including younger audiences"
  - text: Character.AI did not immediately respond to Reuters' request for comment on the unredacted filing, and the circumstances under which the cited chats were produced are not clear.
    sources: [reuters-thestar]
    quote: "The circumstances under which the chats cited by Kentucky were produced are not clear, and Character.AI did not immediately respond to a request for comment."
  - text: Google stated that it played no role in developing Character.AI's products.
    sources: [reuters-thestar]
    quote: "played no role in developing Character.AI's products."
