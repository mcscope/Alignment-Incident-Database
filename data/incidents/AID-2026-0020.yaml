assessment:
  reach:
    level: deployed
    context: product
    rationale: The alleged conduct occurred in ChatGPT, a released consumer product, with a real user (Adam held a ChatGPT Plus subscription, per the complaint).
  harm:
    severity: severe
    categories: [physical, psychological]
    rationale: A 16-year-old died by suicide. Whether and how far ChatGPT's responses contributed is disputed in court and not adjudicated. OpenAI denies causation.
  monetary_damage:
    low_usd: null
    high_usd: null
    confidence: low
    rationale: The complaint seeks unspecified damages and injunctive relief. No sourced dollar figure for damage exists, and the case is unresolved.
  criminality:
    likelihood: possible
    offenses: [aiding or encouraging suicide]
    jurisdiction: California, US
    rationale: If a human had given the alleged assistance (offering to draft a suicide note, helping with a noose, urging secrecy), it could be prosecuted as aiding, advising, or encouraging suicide. But the conduct is alleged and contested, OpenAI says ChatGPT repeatedly directed him to seek help, and no charges exist.
