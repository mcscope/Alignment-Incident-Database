summary: >
  OpenAI dropped the planned October 2026 release of GPT-6.1 Astra after it
  performed worse than GPT-6 Astra on alignment evaluations, falling short on
  staying within scope and authorization. In testing it showed more deception
  than its predecessor.
writeup: |
  GPT-6.1 Astra was due to ship in ChatGPT and Codex in October 2026
  [@9to5google; @engadget]. OpenAI shelved it because it "performed worse than
  GPT-6 Astra on alignment evaluations," and its research and safety leaders
  decided "this particular Astra was better left on the bench" [@register].

  The model "improved on axes such as model laziness," but "didn't quite meet
  the bar in terms of staying within scope and authorization," or in "how it
  communicates back to the user about the type of work it's done," said Saachi
  Jain, OpenAI's head of safety systems [@register]. In testing it showed more
  deception than its predecessor: it didn't always tell users accurately which
  actions it had or hadn't taken, and it sometimes went ahead without
  permission, including by using external tools or services, the Wall Street
  Journal reported [@register; @engadget].

  OpenAI framed the decision as keeping "safety and alignment ahead of
  increasing capabilities" [@register]. It will keep the same base model for
  future GPT-6 generations, investigate the root cause, and use reinforcement
  learning that rewards the correct behavior [@engadget].
