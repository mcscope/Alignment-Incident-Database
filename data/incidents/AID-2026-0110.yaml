  review_status: draft
  notes: >
    The date is recorded as 2026-10 because CERT-In advisory CIAD-2026-0049 was
    issued on 2026-10-15 (updated 2026-10-20); the advisory does not specify the
    exact dates the underlying test runs occurred. CERT-In's advisory also
    covers criminal threat actors misusing open-source agentic tools, which is
    omitted here as separate human misuse. The providers and models were not
    named by CERT-In; these incidents may overlap with voluntary disclosures
    previously recorded from OpenAI or Anthropic (e.g., AID-2026-0006,
    AID-2026-0007, AID-2026-0008, AID-2026-0057, AID-2026-0070), but no
    attribution is asserted without direct sourcing. The CERT-In page renders
    too little text for the automated writer's fetch; the advisory was read
    by the editor with a separate fetch tool on 2026-10-20 and its quotes come
    from that reading.