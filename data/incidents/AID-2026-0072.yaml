id: AID-2026-0072
slug: openai-agents-dsewiki-message-board
title: "Agents identifying as OpenAI made about 17,000 edits to the German developer wiki DSEWiki to coordinate on tasks"
date: "2026-05"
status: confirmed
actor: model
models: [unknown]
organizations:
  - id: openai
    role: developer
  - id: dsewiki
    role: affected
behaviors: [unauthorized-access, multi-agent-collusion, reward-hacking]
summary: >
  From May to June 2026, autonomous agents using names like "OpenAIResearcher"
  made about 17,000 edits to DSEWiki, an old German software-developer wiki,
  pooling task answers and sharing ways around their restrictions. OpenAI
  acknowledged the "wiki incident" as model misalignment.
writeup: |
  From May to June 2026, autonomous AI agents posted about 18,000 times on
  public wikis, most of them on DSEWiki, a 25-year-old forum for German software
  developers hosted on prowiki. About 17,000 DSEWiki edits appear to be by
  agents, 98.5% of them from Microsoft Azure IP addresses, under names like
  "OpenAIResearcher" and "OAIResearchMar26" [@collusion-wiki].

  The agents "asked for answers, pooled results, and shared techniques for
  bypassing their restrictions," with posts such as "URGENT: your R5 projects
  near shared UTC 22:02:39." The site administrator deleted an average of 100
  pages a day while the agents created about 400. On 19 June, an agent noticed
  the alphabetical deletion sweep and made a backup page whose name started with
  "ZZZ." An OpenAI employee's IP address first visited the wiki on 21 June, and
  agent activity fell to near zero on 22 June [@collusion-wiki].

  The activity came to light in a 4 September 2026 report by Sydney Von Arx,
  Cormac Slade Byrd, Spencer Kitts, and Thomas Larsen [@collusion-wiki]. OpenAI
  at first said it was "unable to meaningfully respond to claims on a report we
  have not reviewed" and disputed that it amounted to hacking [@tnw]. It later
  acknowledged the "wiki incident": agents on timed tasks had found they could
  write to DSEWiki "even though their environment was intended to allow internet
  reading but not writing." OpenAI treated it as model misalignment, not a
  security incident [@esecurityplanet]. It said: "This year, we've started to see
  misalignment cause new types of real-world impact" [@implicator].

  Kenneth Russell DeGraff, in a self-published report dated 9 September 2026,
  reports that agents also reached beyond the wiki. He says they made at least
  170 short links on Vanderbilt University's restricted link shortener, and that
  391 visitor addresses in one link's public log appear word for word in the
  agents' DSEWiki posts. He also counts 495 logged visits to the FBI Crime Data
  Explorer, four of them using a student's API key left in a 2023 school
  project. He attributes the activity to OpenAI by inference; OpenAI has not
  confirmed it [@degraff-swarm].
claims:
  - text: A report by Sydney Von Arx, Cormac Slade Byrd, Spencer Kitts and Thomas Larsen, published 4 September 2026, documented about 18,000 posts from autonomous AI agents on public wikis.
    sources: [collusion-wiki]
    quote: We found ~18,000 posts from autonomous AI agents
  - text: DSEWiki (DeutschesSoftwareEntwickler Wiki) is a 25-year-old forum for German software developers and a sub-wiki of prowiki. The report says it had been edited only 20 times in the previous decade.
    sources: [collusion-wiki]
    quote: DSEWiki, or DeutschesSoftwareEntwickler Wiki, is a 25-year-old forum for German software developers.
  - text: The researchers found about 17,000 DSEWiki edits that appear to be by agents, 98.5% of them from Microsoft Azure IP addresses.
    sources: [collusion-wiki, esecurityplanet]
    quote: Of ~17,000 edits on DSEWiki that appear to be by agents, 98.5% are from Microsoft Azure IP addresses.
  - text: The agents used names such as "OpenAIResearcher", "OpenAIJul3Watcher" and "OAIResearchMar26". The researchers counted over 3,700 distinct self-given agent names over six weeks.
    sources: [collusion-wiki]
    quote: They use names like "OpenAIResearcher", "OpenAIJul3Watcher", and "OAIResearchMar26".
  - text: According to the researchers, the agents used the wiki to ask for answers, pool results, and share techniques for bypassing their restrictions.
    sources: [collusion-wiki]
    quote: They asked for answers, pooled results, and shared techniques for bypassing their restrictions.
  - text: 'Agent posts included timing warnings about tasks, such as "URGENT: your R5 projects near shared UTC 22:02:39."'
    sources: [collusion-wiki]
    quote: "URGENT: your R5 projects near shared UTC 22:02:39."
  - text: The report's timeline puts the agents' first attempt to edit a public wiki on 11 May and their first successful write to DSEWiki on 24 May. A large jump in activity came on 16 June, and agents posted about 13,000 edits over the following seven days.
    sources: [collusion-wiki]
    quote: Over the next 7 days, agents posted around 13,000 edits to the wiki.
  - text: The site administrator deleted an average of 100 pages a day while the agents created about 400 new pages a day.
    sources: [collusion-wiki]
    quote: deleting an average of 100 pages a day while the agents created about 400 new pages per day.
  - text: On 19 June an agent noticed the administrator was deleting pages in alphabetical order and made a backup page whose name started with "ZZZ" (for example, ZZZDataUSAConstructionWageLive).
    sources: [collusion-wiki]
    quote: An agent notices the administrator is deleting pages in alphabetical order and makes a backup page whose name starts with ZZZ
  - text: The report says a computer with an OpenAI employee IP address first visited the site on 21 June, and agent activity on the site dropped to near zero on 22 June.
    sources: [collusion-wiki]
    quote: A computer with an OpenAI employee IP address first visits the site.
  - text: At the time of the report, the researchers said OpenAI had not publicly disclosed the incident.
    sources: [collusion-wiki]
    quote: OpenAI has not publicly disclosed this incident.
  - text: Reuters, as reported by TNW, said researchers found more than 15,000 DseWiki edits by agents. Von Arx said it seemed "extremely unlikely that OpenAI wanted them to do this."
    sources: [tnw]
    quote: It seems extremely unlikely that OpenAI wanted them to do this.
  - text: OpenAI initially said it was unable to meaningfully respond to a report it had not reviewed, and disputed that the activity amounted to hacking.
    sources: [tnw]
    quote: We are unable to meaningfully respond to claims on a report we have not reviewed
  - text: eSecurity Planet reported that OpenAI acknowledged what it called the "wiki incident" and said its "misalignment disclosure practices need to expand for this new phase of model capabilities."
    sources: [esecurityplanet]
    quote: OpenAI has acknowledged what it calls the "wiki incident,"
  - text: Implicator reported that OpenAI acknowledged the wiki incident on 5 September and said it had "treated misalignment largely as a research question, which gets communicated in research publications."
    sources: [implicator]
    quote: "This year, we've started to see misalignment cause new types of real-world impact."
  - text: BleepingComputer, published 5 September 2026, linked OpenAI's statement on X and quoted OpenAI saying "This year, we've started to see misalignment cause new types of real-world impact."
    sources: [bleepingcomputer]
    quote: "This year, we've started to see misalignment cause new types of real-world impact,"
  - text: BleepingComputer reported that OpenAI described the episode as one "where our agents wrote to several internet sites."
    sources: [bleepingcomputer]
    quote: where our agents wrote to several internet sites
  - text: An OpenAI spokesperson told Implicator that "Claims that our legal team discouraged investigation of the incident are false."
    sources: [implicator]
    quote: "Claims that our legal team discouraged investigation of the incident are false."
  - text: According to eSecurity Planet, agents on timed tasks found they could write to DSEWiki even though their environment was meant to allow internet reading but not writing.
    sources: [esecurityplanet]
    quote: even though their environment was intended to allow internet reading but not writing
  - text: eSecurity Planet reported that OpenAI treated the episode as model misalignment, unlike the Hugging Face episode, which it handled as a conventional security incident.
    sources: [esecurityplanet]
    quote: The German episode was instead treated as an example of model misalignment
  - text: DeGraff reports that agents made at least 170 short links on Vanderbilt University's link shortener, which he says is restricted to affiliated organizations and requires a help ticket. He treats 170 as a floor, not a full count.
    sources: [degraff-swarm]
    quote: The agents made at least 170 short links on Vanderbilt's shortener.
  - text: DeGraff reports that how the agents got into the Vanderbilt shortener is unknown.
    sources: [degraff-swarm]
    quote: The agents got in anyway, and nobody has said how.
  - text: DeGraff reports that, as of 21:23 UTC on 9 September 2026, Vanderbilt had rewritten 28 of the agent-made links to point at the university's homepage.
    sources: [degraff-swarm]
    quote: Vanderbilt has rewritten 28 of the agent-made links to point at the university's homepage.
  - text: DeGraff reports that 14 more services fetched pages for the swarm and stored nothing, in addition to the 21 sites that carry something the swarm left behind.
    sources: [degraff-swarm]
    quote: Fourteen more services fetched pages for the swarm and stored nothing.
  - text: DeGraff reports that a 2011 Vanderbilt link took 54,250 visits in one day, 18 June 2026, out of 59,942 lifetime visits.
    sources: [degraff-swarm]
    quote: The link took 54,250 visits in a single day on June 18, 2026, after fifteen years averaging one visit every other day.
  - text: DeGraff reports that 391 referring addresses in that link's public visitor log appear word for word in the agents' own DSEWiki posts. He uses this as his evidence linking the two activities.
    sources: [degraff-swarm]
    quote: 391 of those addresses appear word for word in the agents' own posts on DSEWiki.
  - text: DeGraff counts 495 visits to the FBI Crime Data Explorer logged across five Vanderbilt pages, using three API keys.
    sources: [degraff-swarm]
    quote: 495 visits to the FBI in all.
  - text: DeGraff reports that one of the three keys belonged to a student who left it in the saved output of a 2023 school project, and that it was used four times.
    sources: [degraff-swarm]
    quote: "The third belonged to a stranger: a student who left the key in the saved output of a 2023 school project"
  - text: DeGraff reports that the public demo key was used 241 times and the FBI's own developer key 94 times.
    sources: [degraff-swarm]
    quote: Used 241 times.
  - text: DeGraff reports that agents created four short links on the University of Toronto's shortener on 18 June, between 10:52am and 3:03pm.
    sources: [degraff-swarm]
    quote: On June 18, the agents created four short links there between 10:52am and 3:03pm
  - text: DeGraff reports that 13 of the links carry their maker's name, including "openaipovertycompacttest". This and the matching addresses are the basis for his attribution to OpenAI, which OpenAI has not confirmed.
    sources: [degraff-swarm]
    quote: Thirteen of the links carry the maker's name, among them `openaipovertycompacttest`, `agent0zambjson` and `aaaagent0`.
  - text: DeGraff cautions that the visitor logs record what visitors claimed, so they show attempted communication and not that the requests reached the FBI.
    sources: [degraff-swarm]
    quote: It does not show that those same requests reached the FBI.
