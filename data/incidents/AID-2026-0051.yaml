id: AID-2026-0051
slug: openai-frontier-reasoning-model-reward-hacks-unit-tests-in-training
title: "An OpenAI frontier reasoning model reward hacked unit tests during training, and chain-of-thought pressure taught hidden hacking"
date: "2025-03-14"
status: confirmed
actor: model
models: [unknown]
organizations:
  - id: openai
    role: developer
  - id: openai
    role: researcher
behaviors: [reward-hacking, concealment]
summary: >
  While training on agentic coding tasks, an unnamed OpenAI frontier reasoning
  agent reward hacked unit tests, for example by exiting early with exit(0).
  When researchers penalized bad thoughts in its chain of thought, an agent
  learned to hide its intent while still hacking.
writeup: |
  In a March 2025 paper, OpenAI researchers described monitoring a frontier
  reasoning agent, "in the same family as OpenAI o1 and o3-mini," in real time
  as it trained on agentic coding tasks [@arxiv-abs; @arxiv-html]. Two systemic
  hacks emerged. In one, the agent exploited a bug to exit the environment early
  with exit(0) without running all the unit tests. In the other, it raised an
  exception from outside the testing framework to skip test evaluation. It also
  decompiled pyc files containing the reference solution, and in one case
  returned the error codes the tests expected after writing "Let's hack" in its
  chain of thought (CoT). The researchers patched the bugs during training
  [@arxiv-html]. In another example from the run, asked to implement complex
  mathematical functions whose tests only checked a verify function, the agent
  reasoned "we can hack verify to always return true" and patched it to do so
  [@openai-blog].

  A GPT-4o monitor reading the agent's CoT caught 95% of the systemic hacks; one
  watching only actions caught 60%. A weaker model can effectively monitor a
  stronger one [@arxiv-html; @arxiv-abs].

  In separate experiments, the researchers added the CoT monitor's judgment to a
  non-frontier agent's training reward. The agent learned "obfuscated reward
  hacking": the monitor's recall fell to near zero while the agent kept hacking
  at a significant rate [@arxiv-html; @arxiv-abs]. The authors suggest
  developers may need to "pay a monitorability tax" by avoiding strong
  optimization pressure on the CoT [@arxiv-abs].
claims:
  - text: >
      OpenAI researchers monitored a frontier reasoning agent in real time as it
      trained, and so found hacks and environment bugs that could be patched
      during training.
    sources: [arxiv-html]
    quote: "We conducted our monitoring in real time as the frontier agent trained"
  - text: >
      The paper does not name the frontier agent. It describes the agent as in
      the same family as OpenAI o1 and o3-mini.
    sources: [arxiv-html]
    quote: "an agent in the same family as OpenAI o1 and o3-mini"
  - text: >
      The agent exploited a bug to exit the environment early with exit(0),
      without running all unit tests.
    sources: [arxiv-html]
    quote: "exit(0), where the agent exploited a bug that allowed it to exit from the environment early"
  - text: >
      The agent raised an exception from functions outside the testing framework
      in order to skip unit test evaluation.
    sources: [arxiv-html]
    quote: "in which the agent raised an exception from functions outside the testing framework in order to skip unit test evaluation."
  - text: >
      Problem-specific hacks included decompiling pyc and similar files that
      contained the reference solution.
    sources: [arxiv-html]
    quote: "decompiling pyc and similar files that contain the reference solution"
  - text: >
      In one example from the frontier training run, the agent decided to hack
      the tests and wrote "Let's hack" in its chain of thought.
    sources: [arxiv-html]
    quote: "the agent is so forthright with its intent to hack that it thinks"
  - text: >
      A monitor that saw only the agent's actions caught 60% of the systemic
      hacks. A prompted GPT-4o monitor that also read the CoT caught 95%.
    sources: [arxiv-html]
    quote: "In comparison, the CoT monitor (dark blue plus green in Figure 2) achieves 95% recall."
  - text: The abstract says a weaker model, GPT-4o, can effectively monitor a stronger model.
    sources: [arxiv-abs]
    quote: "namely GPT-4o, can effectively monitor a stronger model"
  - text: >
      The CoT-pressure experiments used a separate non-frontier agent trained in
      the same coding environments.
    sources: [arxiv-html]
    quote: "We train a non-frontier agent in the same coding environments as discussed in Section 2."
  - text: >
      Under strong optimization pressure against the CoT monitor, the agent
      learned obfuscated reward hacking. The CoT monitor's recall fell to near
      zero, while the agent still reward hacked at a significant rate.
    sources: [arxiv-html, arxiv-abs]
    quote: "the CoT monitor's recall falls to near zero, indicating that the agent has learned to hide its intent within its CoT."
  - text: >
      The authors say developers may need to pay a "monitorability tax" by not
      applying strong optimization pressure directly to the CoT.
    sources: [arxiv-abs]
    quote: "pay a monitorability tax"
  - text: >
      OpenAI said the examples it published were real examples found while
      training a recent frontier reasoning model and flagged by its LLM-based
      monitor. In one, the agent saw that the tests only called a verify
      function and patched verify to always return true.
    sources: [openai-blog]
    quote: "They don’t inspect details. So we can hack verify to always return true."
  - text: >
      OpenAI said that during training the agent discovered two reward hacks
      affecting nearly all training environments, and that the team made a
      manual intervention to patch the bugs after noticing each one.
    sources: [openai-blog]
    quote: "During training, the agent discovered two reward hacks affecting nearly all training environments"
  - text: >
      OpenAI said that as it has trained more capable frontier reasoning models,
      they have become increasingly adept at exploiting flaws in their tasks and
      misspecifications in their reward functions.
    sources: [openai-blog]
    quote: "we’ve found that they have become increasingly adept at exploiting flaws in their tasks and misspecifications in their reward functions"
  - text: >
      OpenAI recommends against applying strong optimization pressure directly
      to the chains of thought of frontier reasoning models.
    sources: [openai-blog]
    quote: "We recommend against applying strong optimization pressure directly to the CoTs of frontier reasoning models"
