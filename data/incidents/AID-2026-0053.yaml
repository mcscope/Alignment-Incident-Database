id: AID-2026-0053
slug: sakana-ai-scientist-edits-own-code-timeout-relaunch
title: Sakana's The AI Scientist edits its own code to extend its time limit and to relaunch itself
date: "2024-08"
status: confirmed
actor: model
models: [ai-scientist]
organizations:
