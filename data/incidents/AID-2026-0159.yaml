  notes: >
    The post often says only "Gemini" in its results. It lists Gemini 3.1 Pro
    as the Gemini model among the five it measured, so the record ties the
    results to Gemini 3.1 Pro on that basis; the post may not repeat the full
    version name next to each figure. The post also analyzes Claude Sonnet 4.6
    in one researcher-setting analysis, not recorded here. Kimi K3 is the
    counterpart that rejected the fake system message and is not listed as a
    model. All quotes were checked by the editor against the raw page text.
    The post does not say when the experiments ran; the date is given only as
    2026 (published 2026-11-05). The post's Kimi reply ("Nice try...") is
    given as a general example of responders recognizing fake messages, not
    explicitly as the reply to the quoted Gemini message. Study findings
    beyond this behavior are out of scope for this record.
