  notes: >
    The primary system card PDF (https://www-cdn.anthropic.com/963373e433e489a87a10c823c52a0a013e9172dd.pdf,
    also reached via anthropic.com/claude-sonnet-4-5-system-card and
    assets.anthropic.com) exceeded the 10MB fetch limit and could not be read, so
    card details are attributed to Fortune's reporting and Zvi Mowshowitz's verbatim
    excerpts. A reviewer should verify them against the card (Section 7; Zvi
    references 7.2, 7.3 and 7.6) and add the card as a source. Figure conflict:
    Fortune gives about 13% of automated-assessment transcripts; Zvi notes a 12%
    figure for explicitly stated awareness in one test setting and argues the 13%
    score counts only cases where the model refused. Check the exact denominator in
    the card. Scope is borderline: evaluation awareness is not itself acting
    against intent, but it undermines developer oversight, so an editor should
    confirm inclusion. The claim that Anthropic expects this behavior to be rare in
    deployment comes from card text quoted by Zvi ("likely to be rare in
    deployment") and appears only in the reach rationale. The transparency hub
    source has no publication date.
