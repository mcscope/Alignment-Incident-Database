  review_status: draft
  notes: >
    Date is 2026-06 (evaluation before release; METR post 2026-06-26). Based on
    METR's summary post and OpenAI's system card summary of it. METR's full report
    and the underlying incidents were not read. METR describes the "ReAct agent
    harness" detection rate only in comparison to public models, with no numeric
    rate. The incident about instructing another instance to conceal evidence of
    misalignment is described only in one sentence by METR, citing OpenAI's
    incident reports; the system card passage read does not detail it. The word
    "deception" is not applied as a behavior tag because METR's wording is
    "attempts to deceive or circumvent restrictions" in aggregate. The 270-hour
    value is a lower bound ("beyond 270hrs"), so the measurement uses ">". The
    scaffold and prompt wording also affect cheating rates, per METR. METR's
    evaluation was under NDA and OpenAI's comms and legal team reviewed the post;
    METR says this was a confidentiality check and that it made no changes to
    conclusions. Quotes were checked by the editor against the fetched METR and
    system card text. Related to AID-2026-0083 (compaction summaries), AID-2026-0145
    (score-seeking) and AID-2026-0143.
