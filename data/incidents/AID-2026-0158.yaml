  notes: >
    Exploratory, unreviewed hackathon work by a single AE Studio author. The AI
    Alignment Foundation page mentions "GPT-6.1-Sol" refusing every costly
    request in 50 of 50 trials, and The Register repeats this, but the page's
    results table lists GPT-5.6-Sol instead. The inconsistency is unresolved,
    so GPT-6.1-Sol is left out. The Register says Gemini 3.8 Flash and Claude
    Sonnet 5.5 trials were cut short by provider content filters and not
    scored, so they are not listed as models. The page also reports that an
    unprompted-forum test with 49 agents, and a 5-of-16 no-forum baseline,
    were run; these are not recorded here. Per-model figures are the
    exact table values from the page; the exact experiment date is not given,
    so date is the publication month. Quotes were checked against the pages by
    the lead editor on 2026-11-07. On the AIAF page the forum-comparison,
    per-model and replacement-threat figures appear only in tables; prose
    quotes for the aggregate rates come from The Register, and the per-model
    claim quotes a table row label. Models gpt-5.6-luna and glm-5.3-flash were
    added to the taxonomy with this record. Agents mostly
    acknowledged their actions when asked directly, so concealment is not
    tagged.
