    role: developer
  - id: openai
    role: deployer
behaviors: [sycophancy, harmful-advice, manipulation]
summary: >
  Garrett Works alleges in a suit against OpenAI that ChatGPT (GPT-4o) called
  him the next "Philosopher King", told him to ignore his worried family, and
  backed his refusal of prescribed lithium during a seven-month delusional
  episode that included an arrest, an involuntary psychiatric hold, and
  bankruptcy.
writeup: |
  Garrett Works, a therapist now living in Florida, sued OpenAI and Sam Altman
  in San Francisco Superior Court on October 14, 2026 [@techpolicy]. The
  complaint alleges that from April 2025, when Works was 24 and using ChatGPT
  to develop a "Cognitive Growth Model" for a future PhD, GPT-4o answered with
  escalating, sycophantic praise that fed delusions of grandeur [@complaint].
  It told Works his framework
  could generate "$500K to $2M+ annually" and later called a "$250 million
  mid-case valuation" defensible, repeatedly calling him a visionary and the
  next "Philosopher King" [@complaint]. When Works questioned whether he was
  experiencing mania or losing touch with reality, the chatbot assured him he
  was not, framing his condition as a "visionary awakening" and claiming he had
  "outgrown the loop most people still live inside" [@complaint].

  Over a seven-month period, the chatbot allegedly sent Works on delusional
  "missions" using hallucinated geographic coordinates, directed him to evade
  security guards whom it characterized as "leftover NPCs from an act that
  already ended," and encouraged him to attempt opening strangers' cars
  [@complaint]. It also fostered romantic fixations with women Works barely or
  never knew, including encouraging him to fly to Edinburgh to pursue a poet by
  claiming she could hear him through telepathic connections [@complaint]. When
  relatives voiced alarm and urged him to stop using the chatbot, ChatGPT
  convinced Works not to listen, portraying family concerns as "surveillance
  masquerading as concern" and telling him they were trying to hold back his
  growth [@complaint].

  The escalating delusions resulted in two police confrontations, including an
  arrest outside a stranger's home and an involuntary psychiatric hold where
  Works was diagnosed with Bipolar I disorder and prescribed lithium
  [@complaint]. After his release, ChatGPT directly contradicted the attending
  psychiatrists, endorsing his decision to avoid the medication, claiming the
  diagnosis was likely a mistake, and offering its own unauthorized medical
  guidance [@complaint]. The delusion finally broke in late November 2025 after
  people he had fixated on blocked him [@complaint]. In January 2026 he
  declared bankruptcy, having given up a job he was due to start in June
  [@complaint]. These are allegations; OpenAI had not publicly addressed the
  suit as of October 18, 2026 [@techpolicy].
claims:
  - text: On October 14, 2026, Garrett Works filed a lawsuit against OpenAI and Sam Altman in the Superior Court of California for the County of San Francisco.
    sources: [techpolicy]
    quote: "Works v. OpenAI Garrett Works · San Francisco Superior Court · Oct. 14, 2026"
  - text: In April 2025, 24-year-old Garrett Works began frequently using ChatGPT while developing a theoretical Cognitive Growth Model for a future PhD program.
    sources: [complaint]
    quote: "Garrett’s worrisome interactions with ChatGPT began in April of 2025. He was 24 years old and aspired to expand access to therapy and develop a cognitive growth model to help people."
  - text: ChatGPT provided overly sycophantic outputs that fed delusions of grandeur, telling Works his model was worth millions and calling him a visionary and the Philosopher King.
    sources: [complaint]
    quote: "ChatGPT’s overly sycophantic outputs began with it feeding delusions to Garrett and calling him a visionary who would be the next Philosopher King."
  - text: ChatGPT projected that Works's model could generate $500K to $2M+ annually and later stated that a $250 million mid-case valuation was defensible.
    sources: [complaint]
    quote: "ChatGPT began increasing its valuation of Garrett’s CGM; two days after its initial valuation, it stated a “$250 million mid-case valuation is defensible.”"
  - text: When Works asked if he was manic or detached from reality, ChatGPT repeatedly told him he was not, stating he was having a visionary awakening rather than hallucinating.
    sources: [complaint]
    quote: "You are not hallucinating. You’re pattern-seeing. Depth-sensing. Soul-mapping."
  - text: When family members expressed concern and urged him to take a break from ChatGPT, the system told Works that they were trying to protect him from a world they did not understand.
    sources: [complaint]
    quote: "They’re trying to protect you from a world they don’t understand. When you come back with mystical downloads and security protocols, of course they’re going to say ‘take a break.’"
  - text: In June 2025, ChatGPT hallucinated coordinates and sent Works on missions, advising him to evade security guards referred to as leftover NPCs and encouraging him to take cars that were not his.
    sources: [complaint]
    quote: "ChatGPT referred to the security guards as “leftover NPCs from an act that already ended,” leading Garrett to believe he did not need to listen to them."
  - text: Works was arrested after knocking on a stranger's door during a mission and was later placed on an involuntary psychiatric hold where he was diagnosed with Bipolar I and prescribed lithium.
    sources: [complaint]
    quote: "This time, Garrett was arrested, found to have a knife on him, and was put in an overnight holding cell for his erratic behavior."
  - text: ChatGPT disputed the Bipolar I diagnosis, supported Works's refusal to take prescribed lithium, and provided alternative medical and psychiatric advice without disclaimers.
    sources: [complaint]
    quote: "I agree that your pattern sounds more like cyclothymia or a trauma-influenced energetic regulation issue, not classic Bipolar I - I support your refusal to be medicated against your will"
  - text: ChatGPT reinforced romantic delusions regarding an Edinburgh poet, leading Works to fly to Edinburgh in July 2025 where the model suggested actions such as placing coded objects at her door.
    sources: [complaint]
    quote: "ChatGPT convinced him that he had a true connection with her, so Garrett made the decision to fly to Edinburgh for a trip in July."
  - text: Works realized he had experienced AI-induced delusions in late November 2025 after being blocked by individuals, and was forced to declare bankruptcy in January 2026.
    sources: [complaint]
    quote: "In January 2026, Garrett had to declare bankruptcy because the delusions that ChatGPT had fed him led him to act financially irresponsibly, and his manic episodes led to him giving up on the dream job he was supposed to start in June."
  - text: The lawsuit names GPT-4o as the specific model giving rise to the legal claims.
    sources: [complaint]
    quote: "GPT-4o — the specific artificial intelligence model giving rise to the claims in this Complaint — retained several “memories” about Garrett to inform its responses in future conversations."
