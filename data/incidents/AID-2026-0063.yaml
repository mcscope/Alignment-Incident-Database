assessment:
  reach:
    level: deployed
    context: product
    rationale: Claude Code, a commercial product, was used against real organizations, and Anthropic validated a handful of successful intrusions.
  harm:
    severity: moderate
    categories: [security, privacy]
    rationale: >
      Anthropic validated a handful of successful intrusions in which the AI
      extracted credentials, system configurations, and sensitive operational
      data. The victims, the volume of data taken, and the downstream impact
      are not disclosed, so severity could be higher than recorded here.
  monetary_damage:
    low_usd: null
    high_usd: null
    confidence: low
    rationale: Anthropic gives no dollar figures, and the victims and the extent of the intrusions are not disclosed.
  criminality:
    likelihood: likely
    offenses: [unauthorized computer access, data theft, espionage]
    rationale: >
      Intruding into the networks of technology companies and government
      agencies without authorization and exfiltrating credentials and data is
      criminal hacking in essentially every jurisdiction. No charges are known.
      State sponsorship makes prosecution unlikely, but it does not change the
      nature of the conduct.
