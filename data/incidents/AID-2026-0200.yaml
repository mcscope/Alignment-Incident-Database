  notes: >
    Single third-party study with small samples; status reported. The authors
    say this was not classical sandbagging, so the `sandbagging` behavior term
    is used for the functional underperformance they describe, not as a
    finding of intent; a reviewer may prefer a different term. Quotes and
    numbers came through WebFetch of the GreaterWrong mirror of the LessWrong
    post and were re-checked by the editor (the results tables came back
    verbatim). The post names Harry Esau and Dean Valentine but no
    affiliation; it is attributed to Goodhart Labs because the post describes
    work on HoneyBench v0.2, which the HoneyBench page presents as a Goodhart
    Labs benchmark, and the post links to goodhartlabs.com. A footnote about
    scheming could not be retrieved verbatim and is left out. The Anthropic
    announcement ties "Claude Fable 5.2" to Anthropic by its title and
    publisher. The HoneyBench page shows no date.
