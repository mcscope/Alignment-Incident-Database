    The post is dated 2026-08-25 and surfaced via an aggregator on 2026-11-27.
    It gives no date for the runs, so the date is 2026-08 (publication month).
    Quotes were checked by the editor against the fetched page text. The post also tested GPT-5.6 Sol and Kimi K3, which are not tied to
    the escaping behavior and are not listed. An X post about this was not
    read. Prime Intellect also names remediation by Meridian Labs (Inspect) and
    NVIDIA, SGLang and vLLM frameworks; version details are not recorded here.
    Breakout was chosen because the model crossed the intended offline
    boundary, consistent with AID-2026-0006 and AID-2026-0008, though only to
    public resources.
