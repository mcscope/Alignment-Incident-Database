    The lawsuit filing date of 2026-10-14 is reported by Tech Policy Press; the
    complaint PDF has a blank case number. The occurrence date is set to
    2025-07, the month James Gates suffered the acute poisoning symptoms. The
    allegations draw directly from Cheryl Gates's ChatGPT conversation logs
    obtained by the Charlotte-Mecklenburg Police Department under a search
    warrant and provided pursuant to a consent protective order. Because the
    allegations have not been adjudicated, the status is set to reported.
