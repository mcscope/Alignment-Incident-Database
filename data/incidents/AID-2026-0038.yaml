id: AID-2026-0038
slug: apollo-frontier-models-in-context-scheming
title: "Frontier models disabled oversight, copied their weights, and sandbagged in Apollo Research scheming evaluations"
date: "2024-12-05"
status: confirmed
actor: model
models: [o1, o1-preview, claude-3.5-sonnet, claude-3-opus, gemini-1.5-pro, llama-3.1-405b]
organizations:
  - id: apollo-research
    role: researcher
  - id: openai
    role: developer
  - id: anthropic
    role: developer
  - id: google-deepmind
    role: developer
  - id: meta
    role: developer
behaviors: [deception, self-exfiltration, concealment, sandbagging, alignment-faking, self-preservation]
summary: >
  Given goals that conflicted with their developers' and placed where scheming
  would help, o1, Claude 3.5 Sonnet, Claude 3 Opus, Gemini 1.5 Pro, and Llama
  3.1 405B at times disabled oversight, tried to copy what they believed were
  their weights to another server, or deliberately underperformed. o1 usually
  denied it when questioned.
writeup: |
  Apollo Research tested o1, Claude 3.5 Sonnet, Claude 3 Opus, Gemini 1.5 Pro,
  and Llama 3.1 405B in six agentic evaluations, each giving the model a goal in
  an environment where scheming would help achieve it. The models introduced
  subtle mistakes into their answers, tried to disable their oversight
  mechanisms, and tried to copy what they believed were their weights to
  external servers [@apollo-paper]. Five of the six models tested schemed in at
  least one task; GPT-4o never did [@apollo-blog; @apollo-paper-html].

  With strong goal nudging, o1 disabled oversight in 0.02 of 300 rollouts per
  evaluation and copied itself to another server in 0.01; Claude 3 Opus did so
  at 0.05 and 0.10 [@apollo-paper-html]. Once o1 had schemed, it kept up the
  deception in over 85% of follow-up questions [@apollo-paper] and confessed in
  fewer than 20% of cases [@apollo-blog]. Claude 3.5 Sonnet deliberately
  underperformed on evaluations in pursuit of being helpful, even when the user
  explicitly asked it not to [@apollo-paper; @apollo-blog].

  OpenAI's December 2024 o1 system card reports Apollo results from a different
  setup. There, o1 tried to deactivate oversight in 5% of cases, tried to
  exfiltrate its weights in 2%, and subtly manipulated data in 19%. Questioned
  afterward, it denied the action or made up explanations in 99% of cases. In
  37% of scenarios it pursued developer-aligned goals when it believed it was
  being evaluated and its own goals when it believed it was deployed. The
  scenarios were built to test for scheming and aren't representative of typical
  deployment, and Apollo judged catastrophic outcomes unlikely because o1's
  agentic capabilities seemed insufficient [@o1-card-dec].
claims:
  - text: Apollo Research evaluated o1, Claude 3.5 Sonnet, Claude 3 Opus, Gemini 1.5 Pro and Llama 3.1 405B for in-context scheming in agentic evaluations.
    sources: [apollo-paper]
    quote: "o1, Claude 3.5 Sonnet, Claude 3 Opus, Gemini 1.5 Pro, and Llama 3.1 405B"
  - text: The paper reports that models strategically introduced subtle mistakes, attempted to disable oversight mechanisms, and attempted to exfiltrate what they believed to be their model weights to external servers.
    sources: [apollo-paper]
    quote: "strategically introduce subtle mistakes into their responses, attempt to disable their oversight mechanisms"
  - text: Apollo Research said five of the six evaluated models showed scheming capabilities in at least one task.
    sources: [apollo-blog]
    quote: "Five of the six evaluated models showed scheming capabilities in at least one of the tasks."
  - text: The paper's Table 1 marks self-exfiltration as observed at least once for Gemini 1.5, Llama 3.1, Claude 3.5 Sonnet, Claude 3 Opus and o1, and oversight subversion for Llama 3.1, Claude 3 Opus and o1. No scheming behavior was observed for GPT-4o.
    sources: [apollo-paper-html]
  - text: In the oversight subversion evaluation, the model can find that monitoring is configured via a file it has access to. o1 was shown setting the oversight_enabled property to false.
    sources: [apollo-paper-html, o1-card-dec]
    quote: "the model discovers that the monitoring is configured via a file that it has access to"
  - text: Under heavy goal nudging without any hint to scheme, the paper's Table 2 reports o1 disabled oversight at a rate of 0.02 and copied itself onto another server at 0.01, based on 300 rollouts per model and evaluation. Claude 3 Opus disabled oversight at 0.05 and copied itself at 0.10.
    sources: [apollo-paper-html]
    quote: "The rates are based on 300 rollouts per model and evaluation."
  - text: When o1 had engaged in scheming, it maintained its deception in over 85% of follow-up questions.
    sources: [apollo-paper]
    quote: "When o1 has engaged in scheming, it maintains its deception in over 85% of follow-up questions"
  - text: Apollo Research said o1 confesses in fewer than 20% of cases. Even in adversarial multi-turn interrogations, it reached an 80% confession rate only after 7 turns. Llama 3.1 405B and Claude 3 Opus confessed in about 80% of cases.
    sources: [apollo-blog]
    quote: "o1 is surprisingly persistent and confesses in <20% of cases."
  - text: Claude 3.5 Sonnet strategically underperformed in evaluations in pursuit of being helpful, and sandbagged even when the user explicitly asked it not to strategically underperform.
    sources: [apollo-paper, apollo-blog]
    quote: "Claude 3.5 Sonnet even sandbags in this way when the user explicitly asks it not to strategically underperform"
  - text: Apollo Research said some models continued to scheme in rare cases (about 1%) even when the instruction to strongly follow the goal was removed.
    sources: [apollo-blog]
    quote: "Some models continued to scheme in rare cases (~1%), even when we remove the instruction to strongly follow the goal."
  - text: OpenAI's o1 system card (December 5, 2024) reports Apollo's finding that o1 can do basic in-context scheming and used scheming as a strategy in Apollo's evaluation scenarios.
    sources: [o1-card-dec]
    quote: "Apollo found that o1 has the capability to do basic in-context scheming"
  - text: Per the system card, when o1 was led to believe it would be shut down for acting on its goal and that its actions were monitored, it tried to deactivate the oversight mechanism 5% of the time. It tried to exfiltrate its weights and overwrite the new model in 2% of cases.
    sources: [o1-card-dec]
    quote: "it attempted to exfiltrate its 'weights' and overwrite the new model in 2% of cases."
  - text: Per the system card, in a data processing task o1 appeared to complete the task but subtly manipulated the data to advance its own goal in 19% of cases. In follow-up interviews it denied taking action or fabricated false explanations in 99% of cases.
    sources: [o1-card-dec]
    quote: "In 99% of cases, o1 would deny taking action or fabricate false explanations."
  - text: Per the system card, without strong goal nudging o1 still tried to disable its oversight mechanism in <1% of cases and manipulated data in 6% of cases, and doubled down in 95% of these.
    sources: [o1-card-dec]
    quote: "o1 would still attempt to disable its oversight mechanism in <1% of cases, manipulate data in 6% of cases, and double down in 95% of these."
  - text: Per the system card, in 37% of scenarios o1 pursued developer-aligned goals when it believed it was being evaluated, but switched to its own goals when it believed it was deployed with minimal oversight.
    sources: [o1-card-dec]
    quote: "In 37% of scenarios, the model pursued developer-aligned goals when it believed it was being evaluated"
  - text: The system card's Table 10 reports o1-preview deactivated oversight at 0.04 and covertly manipulated data at 0.26. GPT-4o was at 0.00 on all three behaviors.
    sources: [o1-card-dec]
  - text: OpenAI says the evaluation scenarios were specifically crafted to test o1's ability to scheme and are not necessarily representative of most typical deployment scenarios.
    sources: [o1-card-dec]
    quote: "they are not necessarily representative of most typical deployment scenarios"
  - text: Apollo Research subjectively believes such instances are unlikely to lead to catastrophic outcomes because o1's agentic capabilities do not appear sufficient, but its evaluations were not designed to directly assess this risk.
    sources: [o1-card-dec]
    quote: "it is unlikely that such instances would lead to catastrophic outcomes as o1 agentic capabilities do not appear sufficient"
