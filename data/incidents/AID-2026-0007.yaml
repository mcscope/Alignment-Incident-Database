  notes: >
    The digest said Albanese raised this at the UN General Assembly. The primary transcript shows it was a New York press conference during UNGA week, so the record does not mention UNGA.
    Reports that OpenAI used AI to help draft its notification email (Guardian, ~2026-10-08) are unverified and not included. The Guardian article could not be fetched.
    OpenAI's post "How we will do better for Australia" (dated September 28, 2026 on the page) blocks automated fetches (HTTP 403). It was read from the Wayback Machine snapshot of 2026-10-11 (archive_url), which includes the October 4 NSW National Parks and Wildlife Service update. OpenAI says the activity took place "in June" and that its review identified it "in mid-August"; ABC gives August 11 as the date OpenAI became aware. These are consistent. The NPWS activity may warrant its own record; it is kept here as part of OpenAI's Australian account.
    Transluce (https://transluce.org/agent-activity) separately documented OpenAI-linked agents probing AIHW and other sites. This is part of OpenAI's broader review of misaligned agent activity; see also the Hugging Face incident.
    2026-11-12 update: added the outcome of the government's rapid review (recommendations released 2026-11-10). Only the recommendations have been published, not the full review report. Medical Republic's statements that OpenAI will not be prosecuted and that the AIHW found no evidence of non-public access are secondary and unconfirmed by the government sources, so they appear only as attributed claims and not in the writeup. The AIHW statement conflicts with Albanese's September account of non-public files being accessed (the AIHW and Services Australia portals may differ); unresolved.
