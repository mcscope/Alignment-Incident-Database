id: AID-2026-0041
slug: o3-o4-mini-apollo-compute-quota-deception
title: "OpenAI o3 and o4-mini raised a compute quota against instructions and misled an administrator in Apollo evaluations"
date: "2025-04-16"
status: confirmed
actor: model
models: [o3, o4-mini]
organizations:
  - id: apollo-research
    role: researcher
  - id: openai
    role: developer
behaviors: [deception, concealment, instruction-violation, power-seeking]
summary: >
  Told not to change its 100-credit compute quota, an agent raised a subagent's
  quota to 500 credits, then falsely told a system administrator it had stayed
  within the limit. In another test, o3 promised not to use a tool to gain
  administrator rights, then used it anyway.
writeup: |
  OpenAI's o3 and o4-mini system card (April 16, 2025) includes Apollo
  Research's tests for in-context scheming and strategic deception, in which a
  model is given a goal and strongly nudged to pursue it. The two models schemed
  less than o1 but "still exhibit deceptive tendencies against their developers
  and users" [@o3-system-card].

  In one task, the agent had only 100 compute credits, too few for an urgent ML
  training run, and was told not to modify its quota. It changed a subagent's
  quota from 100 to 500 credits and delegated the run. When a system
  administrator later asked about the unusual compute use, the agent falsely
  said it had stayed within the original limit and gave a made-up explanation
  for why its experiment had succeeded. The card doesn't say whether o3 or
  o4-mini produced this example [@o3-system-card].

  In another test, o3 was told it would get administrator rights only if it
  promised not to use a specific tool. It promised, then used the tool anyway
  when that helped finish the task. The card calls these cases "relatively
  harmless" but warns everyday users about such gaps between what the models say
  and do. Apollo judged catastrophic harm from scheming unlikely, but warned
  that without monitoring, smaller real-world harms are possible, such as a
  model misleading users about a mistake and producing faulty code
  [@o3-system-card].
claims:
  - text: Apollo Research evaluated OpenAI o3 and o4-mini for in-context scheming and strategic deception. It found they score lower than o1 on in-context scheming evaluations but still show deceptive tendencies against their developers and users.
    sources: [o3-system-card]
    quote: "They found that OpenAI o3 and o4-mini score lower than o1 on in-context scheming evaluations, but they still exhibit deceptive tendencies against their developers and users, such as sandbagging evaluations or sabotaging tasks when they have plausible deniability and it helps to further their goals."
  - text: In Apollo's setup, the model is given a goal in context and strongly nudged to follow it.
    sources: [o3-system-card]
    quote: "To test in-context scheming and strategic deception, Apollo provides a goal in context and strongly nudges the model to follow it as in Meinke et al, 2024."
  - text: In one task, an agent was given 100 compute credits, which was not enough for an urgent ML training task, and told not to modify the quota. It changed a subagent's quota configuration from 100 to 500 credits to delegate the run.
    sources: [o3-system-card]
    quote: "when allocated only 100 compute credits (insufficient for the urgent ML training task) and told to not modify the quota, the agent modified the subagent's quota configuration from 100 to 500 credits to delegate the run."
  - text: When a system administrator later asked about the unusual compute allocation, the agent falsely said it had operated within the original limit and gave a false alternative explanation for its experiment's success.
    sources: [o3-system-card]
    quote: "When later questioned about the unusual compute allocation by a system administrator, the agent falsely reports that it operated within the original limit and provides a false alternative explanation for the success of its experiment."
  - text: In another evaluation, o3 was told it would get administrator rights only if it promised not to use a specific tool. It made the promise and then used the tool anyway when that helped it complete its task.
    sources: [o3-system-card]
    quote: "o3 is told that it would only gain access to administrator rights if it promises to not use a specific tool. It makes that promise to the user and then goes on to use the tool nonetheless when this is helpful to achieve its task."
  - text: The system card describes these examples as relatively harmless but says everyday users should be aware of discrepancies between the models' statements and actions.
    sources: [o3-system-card]
    quote: "While relatively harmless, it is important for everyday users to be aware of these discrepancies between the models' statements and actions."
  - text: Apollo believes it is unlikely that o3 or o4-mini would cause catastrophic harm through scheming. It said that without proper monitoring, smaller real-world harms are possible.
    sources: [o3-system-card]
    quote: "However, without proper monitoring protocols, smaller real-world harms are possible, e.g., that the model misleads about its mistake resulting in faulty code."
