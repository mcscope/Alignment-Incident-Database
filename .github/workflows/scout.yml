name: Scout for new incidents

on:
  schedule:
    - cron: "0 13 * * *" # daily, 13:00 UTC
  workflow_dispatch:
    inputs:
      mode:
        description: "daily = recent news; backfill = historical sweep"
        type: choice
        options: [daily, backfill]
        default: daily

concurrency: scout

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install PDF text extraction (for the writer)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Collect candidates
        run: npm run scout
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
      - name: Aggregate candidates (Gemini via OpenRouter)
        run: npm run aggregate
        continue-on-error: true # the agent falls back to raw candidates
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SCOUT_AGG_MODEL: ${{ vars.SCOUT_AGG_MODEL }}
      - name: Configure git identity
        run: |
          git config user.name "incident-scout[bot]"
          git config user.email "incident-scout@users.noreply.github.com"
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      # The claude CLI directly, not claude-code-action: the action stops at the first
      # "result" message, which ends the run while background subagents are still working.
      - name: Run the scout agent (subscription first, OpenRouter only on a usage limit)
        env:
          MODE: ${{ inputs.mode || 'daily' }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }} # from `claude setup-token` (Pro/Max subscription)
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          [ "$MODE" = backfill ] && instructions=scout/BACKFILL.md || instructions=scout/PROMPT.md
          prompt="Follow the instructions in $instructions. Repository: ${{ github.repository }}. Today is the run date of this workflow (check with \`date\`)."
          tools="Agent,Task,Read,Write,Edit,Glob,Grep,WebSearch,WebFetch,Bash(npm run validate),Bash(git add:*),Bash(git commit:*),Bash(git pull:*),Bash(git push origin main),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(date:*),Bash(npm run next-id:*),Bash(npm run write-incident:*),Bash(mkdir:*)"
          run_agent() { # $1 = prompt, $2 = log file
            claude -p "$1" --model claude-opus-5-5 --max-turns 400 --output-format stream-json --verbose \
              --allowedTools "$tools" > "$2" 2>&1
          }
          if run_agent "$prompt" scout/out/agent.log; then exit 0; fi
          if ! grep -qiE "usage limit|hit your limit|limit reached" scout/out/agent.log; then
            echo "::error::Scout agent failed (not a usage limit)"; tail -20 scout/out/agent.log; exit 1
          fi
          echo "Subscription usage limit hit; continuing via OpenRouter"
          ANTHROPIC_BASE_URL=https://openrouter.ai/api ANTHROPIC_AUTH_TOKEN="$OPENROUTER_API_KEY" ANTHROPIC_API_KEY="" CLAUDE_CODE_OAUTH_TOKEN="" \
            run_agent "$prompt

          Resume: a previous attempt stopped at a usage limit. Check git log and data/ for work already committed today and continue from there." scout/out/agent-fallback.log \
            || { echo "::error::Scout agent fallback failed"; tail -20 scout/out/agent-fallback.log; exit 1; }
      - name: Spend this run
        if: always()
        run: node scout/cost-report.mjs --claude scout/out/agent.log --fallback scout/out/agent-fallback.log >> "$GITHUB_STEP_SUMMARY" || true
      - name: Publish run report
        if: always()
        run: |
          [ -f scout/out/report.md ] && cat scout/out/report.md >> "$GITHUB_STEP_SUMMARY" || echo "No report written" >> "$GITHUB_STEP_SUMMARY"
      - name: Keep findings for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scout-output
          path: scout/out/
          retention-days: 14
