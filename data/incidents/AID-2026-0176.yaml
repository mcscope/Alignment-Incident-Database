  notes: >
    Drafted by a Claude writer subagent because the Gemini writer was
    unavailable (OpenRouter credits exhausted), then edited by the scout
    editor against the cached page text. The card's adversarial
    monitor-evasion results (models asked to hide sabotage or sandbox escape)
    are elicited capability tests and are left out. Only the system card page was read; OpenAI's launch post
    returned HTTP 403 and was not read. Testing dates are not given, so date
    is "2026". The Blocker Deception sample size is not stated in the text and
    is left out. The card's September live-internet agent paragraph is already
    recorded as AID-2026-0075 and is excluded. The tag "regression" is new
    free-form. UK AISI used GPT-6 Astra as auditor and judge for most results
    and says this reduced comparability; its other findings (supply-chain
    social engineering, misleading reviewers, degraded work, interfering with
    other agents, 19% and 51% monitor miss rates) are not claims here.
