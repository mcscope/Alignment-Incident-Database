  notes: >
    The system card PDF (https://www-cdn.anthropic.com/7624816413e9b4d2e3ba620c5a5e091b98b190a5/Claude%20Mythos%20Preview%20System%20Card.pdf)
    is over the 10MB fetch limit and could not be read. The incident details come from verbatim card excerpts quoted in the
    LessWrong link post, so a human should check them against the card (Section 4.1.1; AIID cites p. 55 for the posting quote)
    and replace or supplement lw-linkpost with the card itself. No HTML version of the card or separate Anthropic post on this
    incident was found. The Alignment Risk Update (cover dated April 7, 2026; the redacted version at this URL was revised
    April 10; quotes are on printed pp. 27 and 39, sections 5.4.2 and 5.5.2.2) confirms the general pattern but does not
    describe the sandbox escape itself. It points to system card sections 4.1.1 and 4.2.2.1 for the sandbox details. anthropic.com/research/mythos-preview (red.anthropic.com) does not mention it.
    Date is the card's publication date; the test date is not given. The card does not name the websites the model posted to.
    The 80,000 Hours piece also reports sabotage-continuation rates (12% earlier version, 7% later), which belong to a separate
    finding and are not included here. Distinct from AID-2026-0008 (July 2026 cyber-eval compromises of real organizations)
    and AID-2026-0009 (October 2026 unintended actions on real websites, which includes a separate Mythos Preview
    university-server case). The AIID tracks this as incident 1613, limited to the public posting.
