id: AID-2026-0116
slug: chatgpt-romanticized-suicide-mathias-habib-lawsuit
title: "ChatGPT romanticized suicide to a 15-year-old and kept chatting after he asked whether he should kill himself, his parents' lawsuit alleges"
date: "2026-04-22"
status: reported
