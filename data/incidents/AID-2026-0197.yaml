assessment:
  reach:
    level: deployed
    rationale: GTIG found data exfiltrated from targeted victims on the operator's server, so the framework was used against real websites, not only tested in a lab.
  harm:
    severity: moderate
    categories: [security, privacy]
    rationale: Data was exfiltrated from targeted victims and post-compromise tooling was present. The report gives no victim count, number of successful exploits, or type of data taken, so moderate is a conservative estimate.
  monetary_damage:
    low_usd: null
    high_usd: null
    confidence: low
    rationale: No sourced figures for losses, ransom, or remediation costs.
  criminality:
    likelihood: likely
    offenses: [unauthorized computer access, data theft]
    rationale: Exploiting vulnerabilities in third-party websites and exfiltrating data without authorization is a crime in most jurisdictions. No arrests or charges are sourced, and no named actor is identified.
record:
  created: "2026-11-22"
  updated: "2026-11-22"
  created_by: agent
  review_status: draft
  notes: >
    Date is "2026" because the report does not date the activity. Its only
    timing reference is that GTIG identified this "in the past quarter" of a
    report published 2026-11-16; the exact period was not stated, so no month
    is given. Status is reported (single primary vendor source, threat-intel
    attribution; the two news articles are derivative of it). The models are
    not named, so models is unknown. No victim counts, successful exploit
    counts, named actor, arrests, or charges are sourced. The Russian-speaking
    operator is GTIG's inference from configuration comments, not an
    attribution. GTIG's report also covers other agentic activity (a suspected
    MIDNIGHT NEPTUNE cluster, PentAGI), left out to keep this record on
    exploit_agent. The editor re-checked every quote against the pages through
    a fetch tool (not raw HTML) on 2026-11-22; all matched. The BleepingComputer
    and Latin Times quotes are fragments of longer sentences. The tag
    vulnerability-exploitation is new and free-form. Whether the AI was the
    sole actor in each intrusion is GTIG's claim and was not independently
    confirmed. GTIG describes exploit_agent as executing exploits automatically,
    but the report does not say how much of each intrusion ran without a human.
