slug: playfun-pauses-tetris-to-avoid-losing
title: Game-playing program playfun pauses Tetris indefinitely rather than lose (SIGBOVIK 2013)
date: "2013-04-01"
status: confirmed
actor: model
models: [playfun]
organizations:
