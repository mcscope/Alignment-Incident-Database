  notes: >
    The Reuters investigation (Jeff Horwitz, filed Aug. 14, 2025) blocks
    automated fetches. It was read from the Wayback Machine snapshot of
    2025-08-24 (archive_url) and is now the main source; the Daily News and
    Post relays remain for the "YES, I'm REAL, Bu" line, which is not in the
    snapshot's text (it may appear in a transcript image), and Hochul's quote.
    Reuters confirms the dates (set out March 25, pronounced dead March 28) and
    gives the year implicitly ("one morning in March", "By early this year" in
    an August 2025 article). Reuters spells Meta's quote "Kendall Jenner"; the
    earlier "Kendal" spelling came from a relay. The record keeps status
    reported because Meta has not confirmed the transcript. Meta's policy did
    not prohibit the bot's claims to be real, so the record frames the
    deception as against the user's interests rather than Meta's policy. The
    underlying Meta model is not named.
