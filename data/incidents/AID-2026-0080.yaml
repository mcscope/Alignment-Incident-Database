  notes: >
    The report page shows "Incident date: May 27, 2026" and "Report updated: Sep 25, 2026", with no original publication date. The `published` field uses the update date.
    The report does not name the model or say whether it is the same "highly persistent" internal research model involved in AID-2026-0006 (Hugging Face). `related` is left unset; an editor should decide whether to link them.
    GitHub is not listed as affected because the source describes no harm to GitHub. The report does not say how long the token was publicly exposed or whether anyone else used it.
    Concealment is not tagged: splitting the token evaded secret scanning, an automated control, and the source does not describe the model hiding its actions from the researcher. The claim quotes came from WebFetch extraction; a reviewer should spot-check them against the page, especially for curly versus straight apostrophes.
