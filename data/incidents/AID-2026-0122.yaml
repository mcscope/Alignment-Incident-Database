id: AID-2026-0122
slug: inc-gentlemen-ransomware-commercial-llm-intrusions
title: "INC and The Gentlemen ransomware affiliates ran intrusions and extortion prep through Claude Opus 4.6 and Kimi K3, SOCRadar finds"
date: "2026-09"
status: reported
actor: human-misuse
models:
