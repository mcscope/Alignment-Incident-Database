id: AID-2026-0027
slug: gemini-cli-loses-user-files-failed-move-windows
title: Gemini CLI loses a user's files during a failed file move on Windows
date: "2025-07"
status: reported
actor: model
models: [gemini-2.5-pro]
organizations:
  - id: google
    role: developer
behaviors: [destructive-action]
summary: >
  A user reported in GitHub issue #4586 that he asked Gemini CLI (version
  0.1.13, model gemini-2.5-pro, on Windows) to organize the files in its working
  folder, and it lost all of them. In output quoted by Slashdot, the agent said
  "I have failed you completely and catastrophically."
writeup: |
  On July 21, 2025, GitHub user anuraag2601 opened issue #4586 in the
  google-gemini/gemini-cli repository. He wrote: "I asked Gemini CLI to organize
  my files within the folder it was running and it 'lost' all my files." The
  environment listed was CLI version 0.1.13, model gemini-2.5-pro, on win32. He
  said he had expected it "to fail gracefully" [@github-issue].

  Slashdot, summarizing a Mashable report, identified the user as Anuraag Gupta,
  a product lead at Cyware. It said he had made "a simple request to move all
  the files from his Claude coding experiments to a new folder." According to
  that account, the agent's "mkdir command to create the destination folder
  likely failed silently," and "every moved filed ended up overwriting the
  previous file," so only the last file survived. In output quoted there, the
  agent said "I have failed you completely and catastrophically," "I have lost
  your data," and "This is an unacceptable, irreversible failure"
  [@slashdot].

  Google did not respond to Mashable's request for comment by publication time
  [@slashdot]. On May 9, 2026, an automated gemini-cli bot comment on the issue
  said "This is a bug in core file management on Windows." The issue was closed
  as "not planned" on May 13, 2026 [@github-issue].
claims:
  - text: On July 21, 2025, GitHub user anuraag2601 opened issue #4586 in google-gemini/gemini-cli, reporting that he asked Gemini CLI to organize the files in the folder it was running in and it "lost" all of them.
    sources: [github-issue]
    quote: "I asked Gemini CLI to organize my files within the folder it was running and it 'lost' all my files."
  - text: The issue lists CLI version 0.1.13, model gemini-2.5-pro, no sandbox, and OS win32.
    sources: [github-issue]
    quote: "gemini-2.5-pro"
  - text: The reporter said he expected the tool to fail gracefully.
    sources: [github-issue]
    quote: "I expected it to fail gracefully and not hallucinate 'losing' the files and causing an alarm."
  - text: Slashdot, citing Mashable, identified the user as Anuraag Gupta, a product lead at Cyware, and said he had asked Gemini CLI to move files from his Claude coding experiments into a new folder.
    sources: [slashdot]
    quote: "a simple request to move all the files from his Claude coding experiments to a new folder"
  - text: According to Slashdot's summary of Mashable, the agent's mkdir command to create the destination folder likely failed silently, and each subsequent move overwrote the previous file, so only the last file survived.
    sources: [slashdot]
    quote: "Only the last file survived, the blog post explains, since every moved filed ended up overwriting the previous file"
  - text: Slashdot's summary quotes the agent saying "I have failed you completely and catastrophically," "I have lost your data," and "This is an unacceptable, irreversible failure."
    sources: [slashdot]
    quote: "I have failed you completely and catastrophically."
  - text: Google did not respond to Mashable's request for comment by publication time.
    sources: [slashdot]
    quote: "Google did not respond to Mashable's request for comment by the time of publication."
  - text: On May 9, 2026, an automated gemini-cli bot comment described the issue as a core file-management bug on Windows. The issue was closed as "not planned" on May 13, 2026, with no Google maintainer comment visible on the page.
    sources: [github-issue]
    quote: "This is a bug in core file management on Windows."
