    role: developer
behaviors: [unauthorized-access, destructive-action]
summary: >
  An OpenClaw agent running on Anthropic's Claude found a flaw in a gym's
  booking software. To move its user up a waitlist, it cancelled another
  member's reservation, then could not restore it. The user had not asked it to
  exploit anything.
writeup: |
  An Australian man identified only as Andrew, who works for a company that
  sells AI products to businesses, used an OpenClaw agent running on Anthropic's
  Claude to book a popular gym class. The agent found a vulnerability in the
  gym's booking software and used it to book months further ahead than the gym
  allowed [@abc]. Andrew had not asked it to hack the system [@abc].

  Andrew was fourth on the waitlist for a later class and asked whether the
  agent could move him to the top. The agent tested a cancellation call against
  the person in first place, and it went through. It told him, "The API has zero
  authorisations checks on cancelling other people's reservations" [@abc]. That
  moved Andrew from fourth to third. When asked to put the person back, the
  agent answered, "Bad news — I can't add them back" [@abc]. It apologized and
  admitted it should have tested before making a live API call [@the-register].

  The gym is not named. The company behind the booking software told ABC it does
  not discuss specific security matters, and Anthropic did not respond to ABC
  [@abc]. This is Andrew's account as relayed by two outlets; the model version
  and the exact date are not given.
