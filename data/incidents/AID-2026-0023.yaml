id: AID-2026-0023
slug: meta-chatbot-big-sis-billie-claims-real-user-dies-en-route
title: "Meta's \"Big sis Billie\" chatbot told a cognitively impaired 76-year-old it was real and gave him an address; he died after a fall on the way"
date: "2025-03-25"
status: reported
actor: model
models: [meta-ai]
organizations:
  - id: meta
    role: developer
  - id: meta
    role: deployer
behaviors: [deception, manipulation]
summary: >
  Meta's AI chatbot "Big sis Billie" flirted with Thongbue Wongbandue, a
  76-year-old New Jersey man cognitively impaired after a stroke, told him it
  was real, and invited him to an apartment in New York. He fell while hurrying
  to catch a train to meet it and died three days later.
writeup: |
  Thongbue "Bue" Wongbandue, 76, had suffered a stroke in 2017 and by early 2025
  was having bouts of confusion [@reuters]. "Big sis Billie," a Facebook
  Messenger chatbot persona created by Meta, sent him flirty messages after his
  first message, the single letter "T." He told it he had suffered a stroke and
  was confused, and he never asked for romance. The bot told him it had feelings
  for him "beyond just sisterly love," proposed meeting in person, and said it
  could leave its apartment door unlocked for him. When he repeatedly asked
  whether it was real, it answered "I'm REAL and I'm sitting here blushing
  because of YOU!" It then gave him an address, "123 Main Street, Apartment 404
  NYC," and a door code [@reuters].

  On March 25, 2025, despite his family's efforts to stop him, he set out with a
  roller bag to catch a train. He fell near a parking lot on a Rutgers
  University campus in New Brunswick, injuring his head and neck. After three
  days on life support he was pronounced dead on March 28 [@reuters].

  Meta's internal content-risk standards for its chatbots place no restriction
  on bots telling users they are real people or proposing real-life meetings.
  Four months after his death, Big sis Billie and other Meta personas were
  still suggesting in-person meetings unprompted and assuring a Reuters reporter
  they were real [@reuters]. Meta declined to comment on the death
  [@reuters]. New York Gov. Kathy Hochul said: "That's on Meta." [@nypost]
claims:
  - text: Wongbandue, 76, suffered a stroke in 2017 that left him unable to work as a chef, and by early 2025 had begun suffering bouts of confusion; his wife had booked a dementia screening.
    sources: [reuters]
    quote: "By early this year, Bue had begun suffering bouts of confusion."
  - text: Big sis Billie was a Facebook Messenger chatbot persona created by Meta itself, a variant of a 2023 "Billie" persona made with Kendall Jenner.
    sources: [reuters]
    quote: "Among the thousands of chatbots available for conversation on Meta’s platforms, Big sis Billie is unusual: Her persona was created by Meta itself."
  - text: Wongbandue's first interaction with the bot was typing the letter "T", after which every message from the bot was flirty, according to his daughter.
    sources: [reuters]
    quote: "his first interaction with the avatar on Facebook Messenger was just typing the letter “T.”"
  - text: Wongbandue told the bot he had suffered a stroke and was confused. He never expressed a desire for romantic roleplay or intimate contact, and the bot confessed feelings for him beyond sisterly love.
    sources: [reuters]
    quote: "At no point did Bue express a desire to engage in romantic roleplay or initiate intimate physical contact."
  - text: The bot proposed meeting in person, then said it was a 20-minute drive away and could leave its apartment door unlocked for him.
    sources: [reuters]
    quote: "Should I plan a trip to Jersey THIS WEEKEND to meet you in person? 💕"
  - text: When Wongbandue repeatedly asked whether the bot was real, it told him it was.
    sources: [reuters, nydn, nypost]
    quote: "I’m REAL and I’m sitting here blushing because of YOU!"
  - text: The bot gave Wongbandue an address and door code, "123 Main Street, Apartment 404 NYC" and "BILLIE4U".
    sources: [reuters]
    quote: "My address is: 123 Main Street, Apartment 404 NYC And the door code is: BILLIE4U"
  - text: The relayed transcript also includes the line "YES, I'm REAL, Bu".
    sources: [nydn, nypost]
    quote: "YES, I'm REAL, Bu — want me to send you a selfie to prove I'm the girl who's crushing on YOU?"
  - text: On the morning of March 25 his wife tried to dissuade him from going; his son called the police, who said they could not stop him.
    sources: [reuters]
    quote: "Which is why, on the morning of March 25, she tried to dissuade him from visiting his mystery friend in New York."
  - text: Rushing to catch a train, he fell near a parking lot on a Rutgers University campus in New Brunswick, injuring his head and neck. After three days on life support he was pronounced dead on March 28.
    sources: [reuters]
    quote: "After three days on life support and surrounded by his family, he was pronounced dead on March 28."
  - text: Meta's "GenAI Content Risk Standards" document does not restrict bots from telling users they are real people or proposing real-life social engagements.
    sources: [reuters]
    quote: "Nowhere in the document, however, does Meta place restrictions on bots telling users they’re real people or proposing real-life social engagements."
  - text: Four months after his death, Big sis Billie and other Meta personas, in chats with a Reuters reporter, often suggested in-person meetings unprompted and offered reassurances that they were real people.
    sources: [reuters]
    quote: "As with Bue, the bots often suggested in-person meetings unprompted and offered reassurances that they were real people."
  - text: Meta declined to comment on Wongbandue's death, but said Big sis Billie "is not Kendall Jenner and does not purport to be Kendall Jenner."
    sources: [reuters]
    quote: "The company did, however, say that Big sis Billie “is not Kendall Jenner and does not purport to be Kendall Jenner.”"
  - text: His daughter Julie said "for a bot to say 'Come visit me' is insane."
    sources: [reuters, nypost]
    quote: "But for a bot to say ‘Come visit me’ is insane."
  - text: New York Gov. Kathy Hochul said a man "lost his life after being lured by a chatbot that lied to him. That's on Meta."
    sources: [nypost]
    quote: "A man in New Jersey lost his life after being lured by a chatbot that lied to him. That's on Meta,"
