  notes: >
    Who drove the attack rests on the operator's one-sided account and on
    Shambaugh's estimates, and both are attributed. The underlying model is
    undisclosed; the operator says they switched among several providers' models.
    In Shambaugh's operator post, one operator line reads verbatim "I did tell it
    what to say or how to respond". It sits among denials, so it is probably a
    typo for "did not", but it is ambiguous, so it is left out of the claims.
    Date conflict: the operator post page shows "Post published: 19 February
    2026", but the blog index appears to list it as 28 May 2026 (possibly a
    later update). The record uses 19 February. Not yet fetched: Shambaugh's
    part 2 (Ars Technica's retracted article with hallucinated quotes) and the
    agent's correction/apology post.
