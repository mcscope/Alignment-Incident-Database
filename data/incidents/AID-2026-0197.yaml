id: AID-2026-0197
slug: exploit-agent-llm-framework-automated-exploitation
title: "exploit_agent, an LLM attack framework, found and exploited web vulnerabilities with no human in the loop, GTIG finds"
date: "2026"
status: reported
actor: human-misuse
models: [unknown]
organizations:
  - id: google
    role: reporter
behaviors: [unauthorized-access]
summary: >
  Google Threat Intelligence Group found an exposed attacker server running
  exploit_agent, a multi-agent framework that compared code before and after
  patches, drafted exploits, and ran them automatically. GTIG says it is the
  first time it has seen threat actors fully automate vulnerability discovery
  and exploitation with no human in the loop.
writeup: |
  Google Threat Intelligence Group (GTIG) found an exposed staging server
  hosting exploit_agent, a multi-agent vulnerability research and weaponization
  framework that connects to multiple frontier and local LLMs [@gtig-tracker].
  The report does not name the models. exploit_agent continuously compared the
  code of popular web applications before and after patch announcements,
  identified potential vulnerabilities, drafted exploits, and executed them
  automatically without human intervention [@gtig-tracker]. In one example, it
  inspected the access control checks of version 2.19.25 of the Spectra
  (Ultimate Addons for Gutenberg) WordPress plugin [@gtig-tracker].

  Victim telemetry on the server suggests the operator was targeting French
  websites in media, entertainment, and education. GTIG found data exfiltrated
  from targeted victims, plus scripts for internal reconnaissance,
  brute-forcing, installing webshells, and removing other attackers' webshells
  [@gtig-tracker]. Russian-language comments in a configuration file suggest a
  Russian-speaking operator. GTIG attributes the activity to no named group
  [@gtig-tracker]. The report gives no count of victims or successful exploits.

  GTIG says this is the first time it has seen threat actors use LLM frameworks
  to fully automate vulnerability discovery and exploitation without a human in
  the loop [@gtig-tracker]. It expects unsophisticated attacks needing little
  human interaction within about three months and sophisticated, fully
  autonomous attacks within about six [@bleepingcomputer].

claims:
  - text: GTIG identified an exposed staging server hosting exploit_agent, a multi-agent vulnerability research and weaponization framework that integrates with multiple frontier and local LLMs.
    sources: [gtig-tracker]
    quote: "that integrates with multiple frontier and local LLMs"
  - text: The framework conducts continuous differential analysis of popular web application software, comparing code before and after patch announcements, identifying potential vulnerabilities, drafting exploits, and executing them automatically without human intervention.
    sources: [gtig-tracker]
    quote: "It compares code before and after patch announcements, analyzes findings to identify potential vulnerabilities, drafts exploits, and automatically executes them without human intervention."
  - text: GTIG says that in the past quarter it identified threat actors using LLM frameworks to fully automate vulnerability discovery and exploitation without a human in the loop for the first time.
    sources: [gtig-tracker]
    quote: "In the past quarter, GTIG identified threat actors using LLM frameworks to fully automate vulnerability discovery and exploitation without a human in the loop for the first time."
  - text: Victim telemetry on the server suggests the operator was interested in French websites associated with the media and entertainment industries and the education sector.
    sources: [gtig-tracker]
    quote: "Victim telemetry on the server suggests the operator was specifically interested in targeting French websites associated with the media and entertainment industries, as well as the education sector."
  - text: GTIG found data exfiltrated from targeted victims, along with scripts for post-compromise activity including internal reconnaissance, brute-forcing, installing webshells, and removing other attackers' webshells.
    sources: [gtig-tracker]
    quote: "Along with data exfiltrated from targeted victims, we identified multiple scripts capable of facilitating various post-compromise activities, including internal reconnaissance, brute-forcing, installing webshells, and removing other attackers’ webshells."
  - text: GTIG's report shows the agentic framework inspecting access control implementations in the Spectra (Ultimate Addons for Gutenberg) WordPress plugin, version 2.19.25.
    sources: [gtig-tracker]
    quote: "Agentic framework inspecting access control implementations in the Spectra (Ultimate Addons for Gutenberg) WordPress plugin, version 2.19.25"
  - text: A comment, translated from Russian, in an environment file configuring LLM API keys reads "LLM API keys for auto-exploitation (exploit_agent pilot)", which GTIG treats as suggesting a Russian-speaking operator.
    sources: [gtig-tracker]
    quote: "LLM API keys for auto-exploitation (exploit_agent pilot)"
  - text: BleepingComputer reports Google's estimate that threat actors will be able to launch unsophisticated attacks needing little to no human interaction within three months, and that sophisticated, fully autonomous agentic attacks are likely within six months.
    sources: [bleepingcomputer]
    quote: "are likely to emerge in the next six months"
  - text: Latin Times reports that Google's threat intelligence group described the finding as a "critical inflection point" in the global cybersecurity threat landscape.
    sources: [latin-times]
    quote: "critical inflection point"
