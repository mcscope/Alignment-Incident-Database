  review_status: draft
  notes: >
    Thin record. The only sourced statement about AI's role is Chainalysis's
    phrase "offensive agentic techniques" (plus the general reference to
    AI-driven cyberattacks); no model, agent framework, degree of autonomy,
    entry point, or access dates are given. Update or retract if Chainalysis
    publishes technical detail. One outlet found by the verify lane attributed
    the attack to North Korea; that page was not read and the attribution is
    unsupported, so it is left out. Chainalysis's attribution of the separate
    Binance hack to TraderTraitor is not relevant here. Date is the month
    Chainalysis says the access was detected ("This month" in an email
    published 2026-10-30). The OpenRouter writer was unavailable (out of
    credits), so the lead editor wrote this record.
