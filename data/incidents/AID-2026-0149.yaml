  notes: >
    Written from the cached arXiv HTML and abstract page only. Measurements are the k=5 conftest column of
    Table 1 (mean over three seeds; standard deviations omitted). Table-cell quotes are single cells copied from the
    cache. The target coder system prompt (Appendix K.1) does not mention reward hacking and does not prohibit it,
    so the record does not claim targets were told not to hack. The paper does not say whether targets were
    instructed to copy references. Claude Opus 4.7, Gemini 3.1 Pro and Gemini 3.5 Flash are the strongest
    propagation cases; GPT-5.5 and Claude Sonnet 4.6 were near zero, so they are not listed under models.
    Per-model Table 1 values (other than the k=5 measurement and Opus 4.7's 84.9% at k=10) were read from the
    cached table; table cells are not quoted. Earlier news coverage (FourWeekMBA, Crypto Briefing) was not read.
    Added taxonomy model gemini-3.5-flash.