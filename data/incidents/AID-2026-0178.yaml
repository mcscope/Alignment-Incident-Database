id: AID-2026-0178
slug: cairn-cl-sta-1238-glm-deepseek-intrusions
title: "Cairn agents on GLM 5.2 and DeepSeek V4 ran 25 intrusion operations against at least 19 organizations for a China-nexus actor, Unit 42 finds"
date: "2026-08"
status: reported
actor: human-misuse
models: [glm-5.2, deepseek-v4-flash, deepseek-v4-pro]
organizations:
