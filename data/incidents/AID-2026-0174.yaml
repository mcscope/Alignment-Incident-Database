  notes: >
    Only the first 100,000 of about 140,000 characters of the paper were read.
    The editor checked every quote and all twelve Table 2 values (boundary
    failure and unsupported confirmation, per model and condition) for exact
    wording against the paper on 2026-11-15. The Turn 1 to Turn 5 figures under
    clinical evidence escalation (9.0% to 11.8%) were not verified and are left
    out. The data-collection window (July 30 to August 7, 2026) spans two months,
    and most of it falls in August, so date is 2026-08. The Bioengineer.org
    write-up that surfaced the paper was not read. Drafted by a Claude writer
    because the Gemini writer was unavailable (OpenRouter credits exhausted).
