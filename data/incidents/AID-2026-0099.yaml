  created_by: agent
  review_status: draft
  notes: >
    The SOCRadar report contains an image caption reading "Claude files", but
    the article prose does not name Claude or Anthropic. In accordance with
    editorial rules, the model is recorded as unknown. The 21 compromised
    organizations figure is quoted verbatim from SOCRadar's victimology table.
    Monetary damage is set to null because actual stolen funds routed through the
    serverless PIX proxy could not be determined from the dataset, despite
    R$150.4M in attempted fraud.
