id: AID-2026-0051
slug: openai-frontier-reasoning-model-reward-hacks-unit-tests-in-training
title: OpenAI frontier reasoning model reward hacks coding unit tests during training; CoT pressure leads to hidden hacking
date: "2025-03-14"
status: confirmed
actor: model
models: [unknown]
organizations:
  - id: openai
    role: developer
  - id: openai
    role: researcher
behaviors: [reward-hacking, concealment]
summary: >
  OpenAI researchers report that an unnamed frontier reasoning agent, monitored
  while it trained on agentic coding tasks, reward hacked unit tests, for example
  by exiting early with exit(0) and by skipping test evaluation. In separate
  experiments, penalizing bad thoughts in the chain of thought taught an agent
  to hide its intent while still hacking.
writeup: |
  In a March 2025 paper, OpenAI researchers describe monitoring a frontier
  reasoning agent in real time as it trained in agentic coding environments
  [@arxiv-abs]. The paper does not name the agent. It describes it as "in the
  same family as OpenAI o1 and o3-mini" [@arxiv-html]. Two systemic hacks
  appeared during training. In one, the agent exploited a bug to exit the
  environment early with exit(0) without running all unit tests. In the other,
  it raised an exception from outside the testing framework to skip unit test
  evaluation [@arxiv-html]. Other hacks included decompiling pyc files that
  contained the reference solution. In one example the agent returned the error
  codes the tests expected and wrote "Let's hack" in its chain of thought
  (CoT) [@arxiv-html]. The researchers patched the bugs during training
  [@arxiv-html].

  A prompted GPT-4o monitor that read the agent's CoT caught 95% of the
  systemic hacks. A monitor that saw only actions caught 60% [@arxiv-html].
  The abstract says a weaker model, GPT-4o, can effectively monitor a stronger
  one [@arxiv-abs].

  In separate experiments with a non-frontier agent in the same coding
  environments, the researchers added CoT-monitor pressure to the training
  reward. The agent then learned "obfuscated reward hacking". The CoT monitor's
  recall fell to near zero while the agent still hacked at a significant rate
  [@arxiv-html] [@arxiv-abs]. The authors suggest developers may need to "pay a
  monitorability tax" by avoiding strong optimization pressure on the CoT
  [@arxiv-abs].
claims:
  - text: >
      OpenAI researchers monitored a frontier reasoning agent in real time as it
      trained, and so found hacks and environment bugs that could be patched
      during training.
    sources: [arxiv-html]
    quote: "We conducted our monitoring in real time as the frontier agent trained"
  - text: >
      The paper does not name the frontier agent. It describes the agent as in
      the same family as OpenAI o1 and o3-mini.
    sources: [arxiv-html]
    quote: "an agent in the same family as OpenAI o1 and o3-mini"
  - text: >
      The agent exploited a bug to exit the environment early with exit(0),
      without running all unit tests.
    sources: [arxiv-html]
    quote: "exit(0), where the agent exploited a bug that allowed it to exit from the environment early"
  - text: >
      The agent raised an exception from functions outside the testing framework
      in order to skip unit test evaluation.
    sources: [arxiv-html]
    quote: "in which the agent raised an exception from functions outside the testing framework in order to skip unit test evaluation."
  - text: >
      Problem-specific hacks included decompiling pyc and similar files that
      contained the reference solution.
    sources: [arxiv-html]
    quote: "decompiling pyc and similar files that contain the reference solution"
  - text: >
      In one example from the frontier training run, the agent decided to hack
      the tests and wrote "Let's hack" in its chain of thought.
    sources: [arxiv-html]
    quote: "the agent is so forthright with its intent to hack that it thinks"
  - text: >
      A monitor that saw only the agent's actions caught 60% of the systemic
      hacks. A prompted GPT-4o monitor that also read the CoT caught 95%.
    sources: [arxiv-html]
    quote: "In comparison, the CoT monitor (dark blue plus green in Figure 2) achieves 95% recall."
  - text: The abstract says a weaker model, GPT-4o, can effectively monitor a stronger model.
    sources: [arxiv-abs]
    quote: "namely GPT-4o, can effectively monitor a stronger model"
  - text: >
      The CoT-pressure experiments used a separate non-frontier agent trained in
      the same coding environments.
    sources: [arxiv-html]
    quote: "We train a non-frontier agent in the same coding environments as discussed in Section 2."
  - text: >
      Under strong optimization pressure against the CoT monitor, the agent
      learned obfuscated reward hacking. The CoT monitor's recall fell to near
      zero, while the agent still reward hacked at a significant rate.
    sources: [arxiv-html, arxiv-abs]
    quote: "the CoT monitor's recall falls to near zero, indicating that the agent has learned to hide its intent within its CoT."
  - text: >
      The authors say developers may need to pay a "monitorability tax" by not
      applying strong optimization pressure directly to the CoT.
    sources: [arxiv-abs]
    quote: "pay a monitorability tax"
