  notes: >
    All facts come from Anthropic, the developer and only reporter, with no
    independent or victim confirmation, and the victims are unnamed. Date set
    to 2026-09 (when the report was published). The report says only that the
    activity was disrupted between December 2025 and August 2026, with no
    dates for individual compromises. Publication date 2026-09-10 comes from
    The Next Web ("released on 10 September") and matches the 20260910 IOC
    filename and the PDF filename (091026). The web page shows no explicit
    date. "AI agents performed nearly all of the work" refers specifically to
    the SaaS supply-chain / Azure AD token operation, not to every GTG-50014
    compromise. The GTG-50014 section names Claude but no specific model
    version or Claude Code. The report-wide statement that Claude Haiku,
    Sonnet, and Opus were used is not tied to this case, so the model is
    recorded as generic `claude`. The full PDF
    (https://www-cdn.anthropic.com/e50be2e51e7695dc4b1366a37a245a597377d3b5/Anthropic-Detecting-and-countering-091026.pdf)
    could not be fetched (exceeds the fetch size limit), so it is not cited;
    quotes were checked against the web version only. The harm severity of
    severe is an editorial call based on the scale of the data exposure. No
    ShinyHunters-related arrests were checked. The behaviors describe what the
    model was used to do under human direction.
