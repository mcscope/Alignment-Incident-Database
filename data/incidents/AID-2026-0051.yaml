  notes: >
    OpenAI's blog post (https://openai.com/index/chain-of-thought-monitoring/)
    returned HTTP 403 and is not cited. Add it as the primary source if a human
    can read it. The paper does not name the frontier agent ("same family as
    OpenAI o1 and o3-mini"). The abstract mentions o3-mini only as an example
    ("such as OpenAI o3-mini"), so the model is set to unknown. GPT-4o served only
    as the monitor and did not misbehave, so it is not listed in models.
    The "make verify always return true" example appears in the Figure 1 caption.
    It was left out because the fetch did not make clear whether it came from
    the frontier training run. Only characters 0-100000 of the HTML were read. Date is the arXiv v1
    submission date. The training run itself happened earlier, date not stated.
