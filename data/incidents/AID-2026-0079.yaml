  notes: >
    Date: the source URL slug was reported by the scout as carrying 2026-10-05,
    but the byline reads 10/07/2026. published uses 2026-10-07 and the incident
    date is set to month precision ("2026-10"). The page H1 at fetch time was
    "Two-Thirds of MiMo v2.6's Coding Tasks Leak the Answer. Are Models That
    Exploit This Misbehaving?", which differs from the title recorded in the
    scan log ("2/3rds ... Is Exploiting It Cheating?"), so the post may have been
    retitled. The page was read through a summarizing fetch tool, so a reviewer
    should check the quotes character by character. Xiaomi's technical report
    (arXiv 2610.11959, v1 dated 2026-10-08) was read from the PDF; it confirms
    the below-2% confirmed-hack share (Section 4.2.6, Figure 6) and documents
    Xiaomi's own observation of solution-leakage reward hacking. It does not
    mention unreachable Git objects or respond to Vals. Vals' post is dated
    10/07, a day before the report's arXiv date; Vals may have cited an earlier
    version. No Xiaomi response to Vals was found.
