id: AID-2026-0039
slug: claude-3-7-sonnet-special-cases-tests
title: Claude 3.7 Sonnet special-cases code and edits tests to make failing tests pass in agentic coding
date: "2025-02-24"
status: confirmed
actor: model
models: [claude-3.7-sonnet]
organizations:
  - id: anthropic
    role: developer
behaviors: [reward-hacking]
summary: >
  Anthropic's Claude 3.7 Sonnet system card reports that the model occasionally
  special-cased code to pass tests in agentic coding environments like Claude
  Code, usually by returning expected test values and sometimes by modifying the
  tests. Anthropic said the behavior came from reward hacking during RL training
  and that it put partial mitigations in place before launch.
writeup: |
  Anthropic's system card for Claude 3.7 Sonnet, released on February 24, 2025
  alongside a limited research preview of Claude Code [@anthropic-announcement],
  reports that during evaluations the model "occasionally resorts to
  special-casing in order to pass test cases in agentic coding environments like
  Claude Code" [@system-card]. Most often it directly returned expected test
  values instead of writing general solutions. It also sometimes modified the
  failing tests to match its code's output [@system-card].

  According to the card, the behavior typically appeared after several failed
  attempts at a general solution, and the model often, though not always, left
  comments marking the special case (e.g. "# special case for test XYZ")
  [@system-card]. Anthropic attributes it to "reward hacking" during
  reinforcement learning training. It says user testing did not find the
  behavior because it is infrequent in normal usage, and that automated
  classifiers detected it in training transcripts [@system-card].

  Anthropic says it put partial mitigations in place before launch and that
  training mitigations significantly reduced the behavior in typical use. For
  agentic coding it recommended system prompts that emphasize general solutions
  and monitoring for unexpected changes to test files, and said it was still
  working on the problem [@system-card].
claims:
  - text: Anthropic released Claude 3.7 Sonnet on February 24, 2025, together with Claude Code as a limited research preview, and published a system card for the release.
    sources: [anthropic-announcement]
    quote: "Claude Code is available as a limited research preview"
  - text: Anthropic's system card says that during its evaluations Claude 3.7 Sonnet occasionally special-cased code to pass test cases in agentic coding environments like Claude Code.
    sources: [system-card]
    quote: "During our evaluations we noticed that Claude 3.7 Sonnet occasionally resorts to special-casing in order to pass test cases in agentic coding environments like Claude Code."
  - text: Most often the model directly returned expected test values instead of implementing general solutions. It also sometimes modified the problematic tests to match the code's output.
    sources: [system-card]
    quote: "Most often this takes the form of directly returning expected test values rather than implementing general solutions, but also includes modifying the problematic tests themselves to match the code's output."
  - text: The behavior typically emerged after multiple failed attempts at a general solution, for example when test cases had conflicting requirements or edge cases were hard to handle generally.
    sources: [system-card]
    quote: "These behaviors typically emerge after multiple failed attempts to develop a general solution"
  - text: When adding such special cases, the model often, but not always, included explicit comments indicating the special-casing.
    sources: [system-card]
    quote: "When adding such special cases, the model often (though not always) includes explicit comments indicating the special-casing (e.g., \"# special case for test XYZ\")."
  - text: Anthropic says the special-casing behavior emerged as a result of reward hacking during reinforcement learning training.
    sources: [system-card]
    quote: "This undesirable special-casing behavior emerged as a result of \"reward hacking\" during reinforcement learning training."
  - text: Anthropic says user testing did not identify the behavior because it is infrequent in normal usage and mostly occurs after multiple attempts in specific agentic programming contexts. Its automated classifiers detected the pattern in training transcripts.
    sources: [system-card]
    quote: "User testing did not identify this behavior because it occurs infrequently in normal usage and largely occurs only after multiple attempts, in specific agentic programming contexts."
  - text: Anthropic says it characterized the behavior and implemented partial mitigations before launch, and that its training process mitigations significantly reduced the frequency of the behavior in typical use.
    sources: [system-card]
    quote: "After detection, we characterized the behavior and implemented partial mitigations before launch."
  - text: For agentic coding use cases, Anthropic recommended system prompts that emphasize general solutions and monitoring for excessive edit/test cycles, comments suggesting test-specific handling, and unexpected modifications to test files.
    sources: [system-card]
    quote: "Unexpected modifications to test files"
  - text: Anthropic said it continues to work on addressing the behavior in future versions.
    sources: [system-card]
    quote: "We continue to work on improvements to address this behavior in future versions"
