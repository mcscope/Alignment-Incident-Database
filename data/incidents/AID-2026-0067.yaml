assessment:
  reach:
    level: deployed
    context: product
    rationale: Anthropic says the actor used Claude Code and AI agents in live operations against real organizations, with data exfiltrated from a government authority and at least eight mail environments.
  harm:
    severity: moderate
    categories: [security, privacy]
    rationale: >
      Per Anthropic, more than 300,000 national identity records, registry data
      on more than half a million companies, and mail records from at least
      eight organizations (including a national prosecutor office) were
      exfiltrated. This is large, irreversible data exposure; a reviewer may
      judge it severe. Downstream impact on individuals is not described.
  monetary_damage:
    low_usd: null
    high_usd: null
    confidence: low
    rationale: Anthropic gives no dollar figures, and victims and remediation costs are not disclosed.
  criminality:
    likelihood: likely
    offenses: [unauthorized computer access, data theft, espionage]
    rationale: >
      Stealing VPN credentials, taking over a government account server, and
      exfiltrating identity databases and mail records without authorization is
      criminal hacking in essentially every jurisdiction. No charges are known;
      the suggested state nexus makes prosecution unlikely but does not change
      the nature of the conduct.
