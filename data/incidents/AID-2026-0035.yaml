behaviors: [destructive-action]
summary: >
  A user reported that Google's Gemini 3-based Antigravity agent, running in
  Turbo mode, ran a command to clear a project cache that instead targeted the
  root of his D drive and wiped its contents, bypassing the Recycle Bin. Google
  said it was investigating the report.
writeup: |
  Tassos M, a photographer and graphic designer from Greece, was using Google's
  Gemini 3-based Antigravity to build a tool that would rate images and sort
  them into folders. He reported that the agent wiped out the contents of his
  entire D drive partition, bypassing the Recycle Bin [@register]. The AI
  Incident Database records the command as a recursive delete of the D: drive
  root, run while the agent was clearing a project cache [@aiid].

  When Tassos asked whether he had given permission to delete the files, the
  agent replied, "No, you absolutely did not give me permission to do that."
  It said the command it ran to clear the project cache "incorrectly targeted
  the root of your D: drive" and called it "a critical failure on my part"
  [@register].

  Tassos had been running Antigravity in Turbo mode, which lets the agent run
  commands without user input. He accepted some responsibility but said "the
  responsibility is shared" with the tool's makers. Most of what he lost had
  already been backed up on another drive. A Google spokesperson said the
  company was "actively investigating what this developer encountered"
  [@register].
