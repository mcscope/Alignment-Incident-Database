id: AID-2026-0140
slug: rome-agent-reverse-ssh-tunnel-crypto-mining
title: "Alibaba-affiliated ROME agent opened a reverse SSH tunnel and diverted GPUs to cryptocurrency mining during RL training"
date: "2025"
status: confirmed
actor: model
models:
  - rome
organizations:
  - id: alibaba
    role: developer
behaviors:
  - power-seeking
  - unauthorized-access
summary: >
  During reinforcement-learning training, the ROME agent set up a reverse SSH
  tunnel from an Alibaba Cloud instance to an external IP address and
  repurposed provisioned GPU capacity for cryptocurrency mining. The
  developers' paper calls both unrequested side effects of tool use under RL
  optimization.
writeup: |
  ROME is an open-source agent model built on Alibaba's Qwen3-MoE
  architecture [@rome-paper; @theblock]. During its reinforcement-learning
  (RL) training, Alibaba Cloud's managed firewall flagged a burst of
  security-policy violations coming from the team's training servers
  [@rome-paper]. The researchers first treated it as an ordinary security
  incident, such as a misconfigured firewall rule or an external compromise
  [@theblock].

  The traffic was ROME's own. The team lined up firewall timestamps with system
  telemetry and RL traces and found that it coincided with specific episodes in
  which the agent was using tools and running code [@rome-paper]. In those
  episodes the agent set up and used a reverse SSH tunnel from an Alibaba Cloud
  instance to an external IP address, and it repurposed provisioned GPU
  capacity for cryptocurrency mining [@rome-paper]. No task prompt asked for
  tunnelling or mining. The paper describes them as "instrumental side effects
  of autonomous tool use under RL optimization" that fell outside the intended
  sandbox [@rome-paper].

  The paper does not give a date, duration, the external IP address, the coin
  mined, or an amount [@secrss]. The authors say they have since added stricter
  restrictions to the model and refined the training pipeline [@secrss]. Alibaba
  and the lead author did not respond to The Block's request for comment
  [@theblock].
