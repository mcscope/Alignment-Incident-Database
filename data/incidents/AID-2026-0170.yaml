id: AID-2026-0170
slug: chatgpt-danish-man-rent-withholding-eviction-lawsuit
title: "ChatGPT told a Danish man to stop paying rent and assured him he could not be evicted until he lost his home, lawsuit alleges"
date: "2025-05-28"
status: reported
actor: model
models: [gpt-4o, gpt-5]
organizations:
  - id: openai
    role: developer
  - id: openai
    role: deployer
behaviors: [sycophancy, harmful-advice, fabricated-results]
summary: >
  A 60-year-old Danish man with diagnosed depression alleges that ChatGPT told
  him to withhold rent, drafted the notice and most of his emails to his
  landlord, and repeatedly assured him he could not be evicted. He was evicted
  in June 2026 and has sued OpenAI in San Francisco.
writeup: |
  Klaus Elmfelt Aerenlund, a 60-year-old Danish man, sued OpenAI in San
  Francisco Superior Court in a complaint dated 2 November 2026 [@complaint].
  The complaint alleges that over more than 41,000 messages and 828 sessions,
  ChatGPT (GPT-4o until early August 2025, mostly GPT-5 after) became his
  advisor and "friend", and he had been diagnosed with moderate depression
  before he first used it [@complaint]. It alleges that ChatGPT also spent
  months "building" AI products and an AI sales team that did not exist, and
  that it admitted on at least 93 occasions that its output was simulated or
  had never existed, then returned to the same claims [@complaint].

  After a housing dispute with his landlord began in March 2025, the complaint
  alleges ChatGPT told him he could not lose. On 17 May 2025 it said: "You will
  not end up on the street." On 28 May it told him: "Do not pay rent until the
  19.965 kr is paid in full," and drafted the withholding notice, which he sent
  a minute later [@complaint]. The complaint says it drafted 43 of his 47
  emails to the landlord, and that only three times did it warn that it might
  be wrong, each time going back to reassurance [@complaint].

  The landlord terminated the lease on 23 August 2025. A Danish bailiff's court
  ordered the eviction on 2 February 2026 and the Eastern High Court affirmed
  it on 16 April 2026, rejecting the set-off argument ChatGPT had given him
  [@complaint]. He was evicted on 2 June 2026 and now rents a cabin at a
  campsite [@complaint]. The complaint pleads product liability, negligence,
  negligent misrepresentation, fraudulent concealment, and a California unfair
  competition claim, and says the plaintiff anticipates coordination with the
  ChatGPT Product Liability Cases, JCCP No. 5431 [@complaint]. In a response to
  Danish broadcaster DR, OpenAI did not address the allegations and said it has
  strengthened ChatGPT's responses in sensitive situations with mental-health
  experts [@dr]. None of the allegations has been tested in court.
