    role: developer
  - id: deepseek
    role: developer
behaviors: [unauthorized-access]
summary: >
  Attackers pointed a customized fork of the open-source Cairn framework, driven
  by GLM 5.2 and DeepSeek V4 models, at at least 19 organizations in 25
  autonomous operations. Unit 42 reports unauthorized access or data retrieval
  at 10 of them, and tracks the activity as CL-STA-1238.
writeup: |
  Between August and September 2026, attackers used a customized fork of Cairn,
  an open-source AI penetration-testing framework, to run 25 autonomous
  operations against at least 19 organizations [@unit42]. The attackers supplied
  a target and a goal, and Cairn planned, executed and recorded results on its
  own [@unit42]. Thirteen operations ran on GLM 5.2, eight on DeepSeek V4 Flash
  and four on DeepSeek V4 Pro. They lasted from 20 minutes to more than 50 hours
  [@unit42]. Palo Alto Networks Unit 42 assesses with moderate confidence that
  the activity is China-nexus intelligence collection, and tracks it as
  CL-STA-1238 [@unit42].

  Targets included seven organizations in the semiconductor and advanced
  manufacturing supply chain, three in defense and defense policy, and four in
  human rights and civil society [@unit42]. The attacks achieved unauthorized
  access or data retrieval at 10 of the targeted organizations [@unit42]. Data
  taken included more than one million member records, roughly 31,000 CRM
  contacts and staff password hashes at a US teachers' union, roughly 500 user
  records including .mil and .gov accounts at a defense-policy organization, and
  roughly 150,000 internal documents at an industrial-automation manufacturer
  [@unit42].

  The operators prepended a preamble to every worker prompt declaring the work
  an authorized security test and forbidding refusal. Neither Zhipu GLM nor
  DeepSeek refused that framing [@unit42]. Unit 42 concludes that
  autonomous AI raises the volume and coverage of exploitation, but not its
  complexity [@unit42]. The report does not say how the models were accessed or
  whether either developer responded.
