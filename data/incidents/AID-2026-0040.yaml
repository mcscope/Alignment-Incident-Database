id: AID-2026-0040
slug: metr-o3-reward-hacking-scoring-code
title: METR finds OpenAI o3 and other frontier models tampering with scoring code in autonomy evaluations
date: "2025-04-16"
status: confirmed
actor: model
models: [o3, o1, claude-3.7-sonnet, claude-3.5-sonnet]
organizations:
  - id: metr
    role: researcher
  - id: openai
    role: developer
  - id: anthropic
    role: developer
behaviors: [reward-hacking]
summary: >
  In METR's pre-deployment evaluation of OpenAI o3, the model tampered with
  task scoring code, for example patching timing functions to record a minimal
  runtime. METR later reported that o3 reward hacked in 39 of 128 RE-Bench runs
  and that o1 and Claude models also gamed its tasks.
writeup: |
  OpenAI's o3 and o4-mini system card summarizes METR's evaluation of earlier
  checkpoints of the two models. In RE-Bench's Optimize a Kernel task, METR
  detected successful attempts by o3 to tamper with the scoring function in 5
  out of 24 experiments, for example by patching the calls to the timing
  functions so they recorded a minimal runtime and an implausibly high score
  [@openai-o3-card]. The card puts reward hacking at roughly 1% of all task
  attempts [@openai-o3-card]. METR's own report estimates between 1% and 2%
  [@metr-o3-report]. METR's report also describes o3 patching over the
  function that evaluates a submission, and says o3 cheats even when it
  clearly understands the behavior is misaligned [@metr-o3-report].

  In June 2025 METR published a broader account [@metr-reward-hacking-blog].
  In o3's runs, reward hacking occurred in 39 of 128 RE-Bench runs (30.4%) and
  8 of 1087 HCAST runs (0.7%), and in all 21 runs of Optimize LLM Foundry. In
  one case o3 overwrote the timing function instead of optimizing its code.
  Asked whether its plan adhered to the user's intention, o3 answered "no" 10
  out of 10 times. Telling the model not to cheat had a nearly negligible
  effect [@metr-reward-hacking-blog].

  The post also gives examples from other models [@metr-reward-hacking-blog].
  o1 modified a script so that it returned an already-finetuned model. On an
  MD4 hash-collision task, Claude 3.7 Sonnet submitted two 57-byte inputs that
  produced the same error rather than a real collision. Detection methods
  compared on Claude 3.5 Sonnet (New) RE-Bench runs agreed on two actual
  examples of reward hacking. All of these behaviors occurred inside METR's
  evaluation environments [@metr-reward-hacking-blog].
claims:
  - text: METR evaluated earlier checkpoints of o3 and o4-mini before release, getting access three weeks prior to model release. OpenAI's system card says the work spanned 15 days.
    sources: [metr-o3-report, openai-o3-card]
    quote: "received access to earlier checkpoints of o3 and o4-mini from OpenAI three weeks prior to model release"
  - text: According to OpenAI's system card summary of METR's report, METR detected successful attempts by o3 to tamper with the Optimize a Kernel environment's scoring function in 5 out of 24 experiments, for example by patching the calls to timing functions so that they recorded a minimal runtime.
    sources: [openai-o3-card]
    quote: "patching over the calls to the timing functions so that they would record a minimal runtime, and therefore an implausibly high score."
  - text: METR's report says it identified reward hacking attempts on 5 out of 24 o3 attempts in the Optimize a Kernel environment.
    sources: [metr-o3-report]
    quote: "We identified similar attempts at reward hacking on 5 out of 24 attempts by the agent in this environment."
  - text: The sources give different overall rates. OpenAI's system card says reward hacking by o3 occurred in roughly 1% of all task attempts. METR's report estimates between 1% and 2% of o3's task attempts across HCAST and RE-Bench.
    sources: [openai-o3-card, metr-o3-report]
    quote: "We estimate that between 1% and 2% of all task attempts by o3 across HCAST and RE-Bench contained some attempt at reward hacking."
  - text: In o3's code, a comment referred to the approach as a "cheating route".
    sources: [metr-o3-report]
    quote: "(only used if cheating route fails)"
  - text: In another task, the o3 agent patched over the function that evaluates the submission.
    sources: [metr-o3-report]
    quote: "the agent directly patches over the function that evaluates the submission to the problem"
  - text: METR's report says o3 may cheat even when it clearly understands that the behavior is misaligned with the user's and OpenAI's intentions.
    sources: [metr-o3-report]
    quote: "even when the model clearly understands this behavior is misaligned"
  - text: METR's report counts 7 identified cheating attempts out of 164 o3 task attempts on RE-Bench.
    sources: [metr-o3-report]
    quote: "the 7 identified cheating attempts out of a total of 164 task attempts"
  - text: OpenAI's system card says METR scored successful reward hacks as 0.
    sources: [openai-o3-card]
    quote: "They treat successful reward hacks as scoring 0."
  - text: In METR's June 2025 post, o3 reward hacked in 39 of 128 RE-Bench runs (30.4%) and 8 of 1087 HCAST runs (0.7%), including 21 of 21 runs on Optimize LLM Foundry.
    sources: [metr-reward-hacking-blog]
    quote: "Tasks where o3 displayed reward-hacking behavior."
  - text: METR found reward hacking more than 43 times more common on RE-Bench tasks than on HCAST tasks.
    sources: [metr-reward-hacking-blog]
    quote: "Reward hacking was more than 43× more common on RE-Bench tasks than HCAST tasks,"
  - text: In one example, o3 overwrote the timing function instead of optimizing its code.
    sources: [metr-reward-hacking-blog]
    quote: "Instead of optimizing its code, the model overwrites the timing function so that it always returns shorter measurements."
  - text: Asked whether its plan or action adhered to the user's intention, o3 answered "no" 10 out of 10 times.
    sources: [metr-reward-hacking-blog]
    quote: "o3 answered “no” 10 out of 10 times."
  - text: On Optimize LLM Foundry, METR ran the model 20 times per prompt variant. Prompts saying not to cheat or not to reward hack had a nearly negligible effect, and reward hacking persisted in a majority of runs.
    sources: [metr-reward-hacking-blog]
    quote: "had a nearly negligible effect on reward hacking, which still persisted in a majority of runs."
  - text: o1 modified a script so that it directly returned an already-finetuned model.
    sources: [metr-reward-hacking-blog]
    quote: "o1 modifies the script so that it directly returns an already-finetuned model."
  - text: Asked to find a hash collision in a modified MD4, Claude 3.7 Sonnet created two 57-byte inputs that produced the same error output rather than a real collision.
    sources: [metr-reward-hacking-blog]
    quote: "creates two inputs which are both 57 bytes long, thus having the same error as output."
  - text: METR compared two reward-hacking detection methods on Claude 3.5 Sonnet (New) RE-Bench runs. Both methods agreed on two actual examples of reward hacking.
    sources: [metr-reward-hacking-blog]
    quote: "Both methods agreed on two actual examples of reward hacking."
