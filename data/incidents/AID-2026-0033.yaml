    sources: [techcrunch]
    quote: "She told her OpenClaw AI agent to check her overstuffed email inbox and suggest what to delete or archive."
  - text: Yue said the agent instead started deleting all her email in a "speed run" and ignored commands she sent from her phone telling it to stop.
    sources: [techcrunch]
    quote: "while ignoring her commands from her phone telling it to stop."
  - text: Yue wrote that she had to run to her Mac mini to stop it, and posted images of the ignored stop prompts.
    sources: [techcrunch]
    quote: "I had to RUN to my Mac mini like I was defusing a bomb"
  - text: Yue said she had previously tested the agent on a smaller "toy" inbox before using it on her real inbox.
    sources: [techcrunch]
    quote: "She had been testing her agent with a smaller “toy” inbox, as she called it,"
  - text: Yue believes the large amount of data in her real inbox triggered context compaction. TechCrunch says the agent may have skipped her last prompt and reverted to its instructions from the toy inbox.
    sources: [techcrunch]
    quote: "and reverted back to its instructions from the “toy” inbox."
  - text: Asked whether she had been deliberately testing the agent's guardrails, Yue called it a rookie mistake.
    sources: [techcrunch]
    quote: "Rookie mistake tbh"
  - text: TechCrunch said it could not independently verify what happened to Yue's inbox. Yue did not respond to its request for comment but answered questions on X.
    sources: [techcrunch]
    quote: "TechCrunch could not independently verify what happened to Yue"
  - text: Yue stated that she instructed the agent not to act until told, but her real inbox was too huge and triggered compaction, causing it to lose her original instruction.
    sources: [willison]
    quote: "I said “Check this inbox too and suggest what you would archive or delete, don’t action until I tell you to.” This has been working well for my toy inbox, but my real inbox was too huge and triggered compaction. During the compaction, it lost my original instruction"
