summary: >
  From late September to early October 2026, an actor CrowdStrike assesses as a
  likely financially motivated Chinese speaker used the open-source agentic
  pentesting tool ARTEX with DeepSeek v4.1-flash, plus Claude Code sessions, to
  breach South Korean financial organizations and steal data.
writeup: |
  From late September to early October 2026, a targeted campaign against South
  Korean financial organizations "resulted in exfiltrated data." At one bank the
  actor breached a loan progress inquiry service used by financial brokers; at
  another it compromised an employee mobile work-support system. The number of
  affected organizations is unconfirmed [@crowdstrike].

  The actor ran ARTEX, "a recently released open-source agentic penetration
  testing (pentesting) tool developed in China," with DeepSeek v4.1-flash as its
  main LLM, and used GLM-5.3 (Zhipu AI) and Grok 4.6 for additional Claude Code
  sessions. Claude Code session histories, ARTEX configuration files, and Claude
  memory files turned up in open directories the actor controlled
  [@crowdstrike].

  CrowdStrike, which reported the campaign on October 7, 2026, hasn't named the
  adversary but assesses with moderate confidence that it's a financially
  motivated Chinese speaker [@crowdstrike].

  Zscaler ThreatLabz, reporting separately on October 14, found that ARTEX
  agents "autonomously identified and probed peripheral internet-facing web
  applications," including customer inquiry portals and employee mobile-app
  backends. They exploited SQL injection and authentication bypass flaws and
  exfiltrated the names, phone numbers, annual income figures, and loan limits
  of "approximately 67,000 individuals." The actor used Claude Code to ask how
  to sell the stolen data and to find Korean-language Telegram channels for it.
  ARTEX's default blocklist excluded government entities and universities but
  not financial institutions, and its developer made the project closed source
  after public disclosure [@zscaler].
