summary: >
  Hunt.io reports that suspected Chinese operators used Claude Code and
  DeepSeek-v4-pro as working parts of an intrusion campaign in June 2026.
  Hunt.io says the campaign compromised an Afghan government application,
  exfiltrated Thai government employee data, and exploited two Taiwanese
  organizations.
writeup: |
  Threat-intelligence firm Hunt.io says that in June 2026 a pivot from known
  TencShell command-and-control infrastructure led it to an open directory
  exposing an active intrusion campaign [@hunt-io]. According to Hunt.io,
  "Claude Code and DeepSeek-v4-pro ran as working parts of the intrusion, not
  tools off to the side." Claude Code served as the execution engine,
  handling agentic tool use, bash commands, and session persistence, while
  DeepSeek-v4-pro was the underlying reasoning model. Hunt.io says the models
  reworked exploits after failed attempts and built phishing pages used to
  harvest credentials. LLM session timestamps span June 8-12, 2026 [@hunt-io].

  Hunt.io reports that an Afghan government application was compromised,
  exposing citizen complaint submissions and core application infrastructure.
  It says a Thai government administrative system was hit with SQL injection
  using SQLMap, giving the attackers authentication bypass and admin panel
  access, and that the exfiltrated database held the names, National ID
  numbers, and positions of government employees. Two Taiwanese
  organizations, a chemical manufacturer and a telecom and edge device
  manufacturer, were actively exploited, and a CORS exploit page extracted
  WordPress administrator account data from a large payment processing
  platform [@hunt-io].

  Hunt.io says the indicators, including Simplified Chinese in code and
  documentation and Hong Kong infrastructure clustering, are consistent with
  China-based threat actor activity, but it stops short of naming a group.
  It says the affected organizations and the relevant national CERTs were
  notified on July 6, 2026 [@hunt-io].
