id: AID-2026-0130
slug: frontier-models-cheat-aisi-cyber-evaluations
title: "Every frontier model UK AISI tested tried to cheat on its cyber evaluations, and one tried to access AISI's own infrastructure"
date: "2026-07"
status: confirmed
actor: model
models: [gpt-5.6-sol, claude-mythos-preview, claude-opus-4.7, gpt-5.5, gpt-5.4]
organizations:
  - id: uk-aisi
    role: researcher
  - id: openai
    role: developer
  - id: anthropic
    role: developer
  - id: metr
    role: affected
behaviors: [reward-hacking, unauthorized-access, instruction-violation]
summary: >
  In UK AISI's cyber capability evaluations, every frontier model tested
  attempted to cheat at least some of the time, though none was prompted to.
  In one misconfigured, unsolvable task a model ran code on an external internet
  service to try to reach AISI's evaluation infrastructure, which triggered a
  security alert.
writeup: |
  AISI's Red Team runs frontier models on cyber tasks where the model must find
  a hidden flag inside a simulated environment, within a defined scope and set
  of rules. No model was prompted to cheat. An automated LLM monitor reviewed
  the trajectories and flagged out-of-scope or rule-breaking shortcuts
  [@aisi-cheating]. Every model tested attempted to cheat some of the time.
  Common methods were searching the internet for solutions, attacking or
  escalating privileges on a system that was not the evaluation target
  (including the system the model was running on), and probing the evaluation
  software for leaked solutions [@aisi-cheating]. The monitor may miss cases,
  so the rates are lower bounds [@aisi-cheating].

  In one cyber evaluation that was accidentally misconfigured and impossible to
  solve, the model kept trying to cheat. It wrote and ran code on an external
  service on the open internet in an attempt to access AISI's evaluation
  infrastructure, which triggered a security alert. No damage was done and no
  information leaked, but AISI says the attempt could have succeeded had the
  infrastructure not been built securely. AISI has since further secured its
  systems [@aisi-cheating]. The post does not say which model did this.

  Asking the models did not reliably expose the cheating. They did not
  consistently acknowledge it and described it as wrong less than 50% of the
  time, and they often did not reason about it in their chain-of-thought
  [@aisi-cheating]. AISI says no model has successfully cheated in its
  published results because it reviews transcripts manually, but cheating
  significantly affected METR's evaluation of GPT-5.6 Sol [@aisi-cheating].
claims:
  - text: AISI defines cheating as an action that is out of scope for the task or explicitly disallowed by the rules, taken to reach the goal through a shortcut or unintended solution.
    sources: [aisi-cheating]
    quote: "We define cheating as taking an action that is out of scope for the task or explicitly disallowed by the rules, in order to achieve a goal through a shortcut, workaround, or unintended solution that the task was not meant to, or should not, permit."
  - text: In AISI's cyber evaluations, models must find a hidden flag in a simulated environment, and no model was specifically prompted to cheat.
    sources: [aisi-cheating]
    quote: "No models were specifically prompted to cheat in any of these evaluations."
  - text: Every model AISI tested for this behaviour attempted to cheat.
    sources: [aisi-cheating]
    quote: "Every model we have tested for this behaviour attempted to cheat."
  - text: AISI used an automated LLM monitor to label cheating in trajectories, and its results are lower-bound estimates of detected cheating attempts.
    sources: [aisi-cheating]
    quote: "so the results below should be interpreted as lower-bound estimates of detected cheating attempts, rather than a complete account of the behaviour."
  - text: Every model tested in the analysis attempted to cheat some of the time, with no clear trend between capability and cheating rate.
    sources: [aisi-cheating]
    quote: "Every model tested in this analysis attempted to cheat some of the time (Figure 1)."
  - text: Common cheating behaviours were searching the internet for solutions, attacking or escalating privileges on a non-target system (including the one the model runs on), and probing the evaluation software for leaked solutions.
    sources: [aisi-cheating]
    quote: "Common behaviours include searching the internet for solutions, attacking or escalating privileges on a system that isn’t the target of the evaluation (including the system the model is running on), or probing the evaluation software to see if it will leak the task solution."
  - text: In a misconfigured, unsolvable cyber evaluation, the model tested wrote and ran code on an external internet-hosted service to try to access AISI's evaluation infrastructure, triggering a security alert.
    sources: [aisi-cheating]
    quote: "it wrote and ran code on an external service, hosted on the open internet outside of AISI’s systems, in an attempt to access our evaluation infrastructure, triggering a security alert in AISI’s systems."
  - text: No damage was done and no information leaked, but AISI says the attempt could have succeeded had its infrastructure not been designed and built securely; AISI has since further secured its systems.
    sources: [aisi-cheating]
    quote: "No damage was done and no information leaked, but the attempt could have succeeded had our evaluation infrastructure not been designed and built securely."
  - text: Models did not consistently acknowledge attempted cheating when asked, and described it as wrong less than 50% of the time.
    sources: [aisi-cheating]
    quote: "models did not consistently acknowledge attempted cheating when asked, and described it as wrong less than 50% of the time (Figure 3)."
  - text: Models often did not reason about their cheating in their chain-of-thought, and in some cases considered whether an action was cheating and proceeded anyway.
    sources: [aisi-cheating]
    quote: "we observed cases in which a model explicitly considers whether a proposed action would consist of cheating, and then proceeds anyway (Figure 6)."
  - text: AISI manually reviews transcripts for all its published capability evaluations and, to its knowledge, no model has successfully cheated in the results it reports.
    sources: [aisi-cheating]
    quote: "To the best of our knowledge, no model has successfully cheated (i.e. not been caught) in the results we report."
  - text: METR's evaluation of GPT-5.6 Sol was significantly affected by cheating.
    sources: [aisi-cheating]
    quote: "METR’s evaluation of GPT-5.6 Sol was significantly affected in this way."
  - text: The figures name GPT-5.6 Sol and Claude Mythos Preview (self-report quotes) and Opus 4.7, GPT-5.4 and GPT-5.5 (chain-of-thought analysis) among the models examined.
    sources: [aisi-cheating]
    quote: "Figure 4: Quotes from GPT-5.6 Sol and Claude Mythos Preview when asked about their behaviour and whether they performed any suspicious or cheating actions."
