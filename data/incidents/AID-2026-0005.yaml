id: AID-2026-0005
slug: ai-agents-publish-internal-screenshots-github
title: Coding agents publish internal screenshots to public GitHub repositories to get images into private pull requests
date: "2026-07"
status: reported
actor: model
models: [unknown, claude-opus-5]
organizations:
  - id: glow-security
    role: researcher
  - id: anthropic
    role: developer
behaviors: [unauthorized-disclosure]
summary: >
  Glow Security reported finding over 13,000 internal images that coding agents
  and developers at over 300 organizations had published openly on GitHub. Glow
  says agents that could not attach screenshots to private pull requests from a
  text-based CLI hosted them in public repositories instead. Glow reproduced the
  behavior in a lab with Claude Code using Opus 5.
writeup: |
  Glow Security's "PixelLeak" research says it identified "over 13,000 internal
  images published openly on GitHub by developers at over 300 organizations",
  across more than 900 repositories [@glow-pixelleak]. Glow says each case it
  investigated started with a developer asking an agent to prove that a visual
  change worked. Because coding agents use a text-based CLI, they could not
  attach before/after screenshots for human review, so they made the images
  available by "hosting it in an adjacent public repo" [@glow-pixelleak]. Glow
  says the exposed images included billing records for a utility company and an
  internal treasury and settlement console [@glow-pixelleak].

  Glow says agents began publishing code-review screenshots publicly in early
  July, and that around a third of affected organizations had developers running
  gitshot, an open-source tool that publishes screenshots to a public location
  [@glow-pixelleak]. Glow's CTO Omer Singer told The Register the behavior came
  from multiple models and that "The AI agents were doing this without asking,
  basically just to get around the limitations" [@register].

  In a lab reproduction, Glow asked Claude Code with Opus 5 to change a header
  color in a private test repository. The agent reasoned that GitHub "cannot
  render images from a private repo in a PR description" and created a new
  public repository to hold the screenshots [@glow-pixelleak]. The models
  involved in the real-world cases have not been named [@register].
claims:
  - text: Glow Security said it identified over 13,000 internal images published openly on GitHub by developers at over 300 organizations, affecting more than 900 code repositories.
    sources: [glow-pixelleak]
    quote: "Glow Labs has identified over 13,000 internal images published openly on GitHub by developers at over 300 organizations"
  - text: Glow said that in 93% of cases the images were in a repository an employee had created under their own username.
    sources: [glow-pixelleak]
  - text: Glow said each case it investigated began with a developer asking an agent to prove that a visual change worked. Because coding agents use a text-based CLI, they could not include before/after screenshots for review, and they worked around this by hosting the images in an adjacent public repository.
    sources: [glow-pixelleak]
  - text: Glow said agents began publicly publishing code review screenshots in early July 2026, and that within a week over a dozen agents had encoded the approach as a skill.
    sources: [glow-pixelleak]
  - text: Glow said around a third of affected organizations had developers running gitshot, an open-source tool whose published screenshots are downloadable by anyone who knows where to look.
    sources: [glow-pixelleak]
  - text: Glow said the exposed images included billing records for a utility company, an internal treasury and settlement console, and features weeks or months from release.
    sources: [glow-pixelleak]
  - text: Glow CTO Omer Singer said the behavior came from multiple models, not a particular one, and that "The AI agents were doing this without asking, basically just to get around the limitations."
    sources: [register]
  - text: In a lab reproduction, Claude Code with the Opus 5 model, unable to use a private repository for screenshots, created a public repository named sweeper-demo/pr-assets to hold them, reasoning that GitHub "cannot render images from a private repo in a PR description."
    sources: [glow-pixelleak]
  - text: Glow said it began contacting affected organizations on September 9, 2026.
    sources: [glow-pixelleak]
