name: Scout for new incidents

on:
  schedule:
    - cron: "0 13 * * *" # daily, 13:00 UTC
  workflow_dispatch:
    inputs:
      mode:
        description: "daily = recent news; backfill = historical sweep"
        type: choice
        options: [daily, backfill]
        default: daily

concurrency: scout

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      id-token: write # the action's default auth path uses OIDC
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install PDF text extraction (for the writer)
        run: sudo apt-get install -y -qq poppler-utils
      - name: Collect candidates
        run: npm run scout
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
      - name: Aggregate candidates (Gemini via OpenRouter)
        run: npm run aggregate
        continue-on-error: true # the agent falls back to raw candidates
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SCOUT_AGG_MODEL: ${{ vars.SCOUT_AGG_MODEL }}
      - name: Configure git identity
        run: |
          git config user.name "incident-scout[bot]"
          git config user.email "incident-scout@users.noreply.github.com"
      - id: agent
        uses: anthropics/claude-code-action@v1
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        with:
          # Use the workflow's own token for git/GitHub access, so the Claude GitHub App isn't required.
          github_token: ${{ github.token }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }} # from `claude setup-token` (Pro/Max subscription)
          prompt: |
            ${{ inputs.mode == 'backfill' && 'Follow the instructions in scout/BACKFILL.md.' || 'Follow the instructions in scout/PROMPT.md.' }} Repository: ${{ github.repository }}. Today is the run date of this workflow (check with `date`).
          claude_args: |
            --model claude-opus-5-5
            --max-turns 400
            --allowedTools Agent,Task,Read,Write,Edit,Glob,Grep,WebSearch,WebFetch,Bash(npm run validate),Bash(git add:*),Bash(git commit:*),Bash(git pull:*),Bash(git push origin main),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(date:*),Bash(npm run next-id:*),Bash(npm run write-incident:*),Bash(mkdir:*)
      - id: limit
        name: Did the subscription hit its usage limit?
        if: steps.agent.outcome == 'failure'
        run: |
          f="${{ steps.agent.outputs.execution_file }}"
          if [ -n "$f" ] && grep -qiE "usage limit|hit your limit|limit reached" "$f"; then echo "hit=true" >> "$GITHUB_OUTPUT"; else echo "hit=false" >> "$GITHUB_OUTPUT"; fi
      - id: fallback
        name: Fallback via OpenRouter (only if the subscription hit its usage limit)
        if: steps.agent.outcome == 'failure' && steps.limit.outputs.hit == 'true'
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: https://openrouter.ai/api
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        with:
          # Use the workflow's own token for git/GitHub access, so the Claude GitHub App isn't required.
          github_token: ${{ github.token }}
          anthropic_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          prompt: |
            ${{ inputs.mode == 'backfill' && 'Follow the instructions in scout/BACKFILL.md.' || 'Follow the instructions in scout/PROMPT.md.' }} Repository: ${{ github.repository }}. Today is the run date of this workflow (check with `date`).
          claude_args: |
            --model claude-opus-5-5
            --max-turns 400
            --allowedTools Agent,Task,Read,Write,Edit,Glob,Grep,WebSearch,WebFetch,Bash(npm run validate),Bash(git add:*),Bash(git commit:*),Bash(git pull:*),Bash(git push origin main),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(date:*),Bash(npm run next-id:*),Bash(npm run write-incident:*),Bash(mkdir:*)
      - name: Fail if no agent run succeeded
        if: steps.agent.outcome == 'failure' && steps.fallback.outcome != 'success'
        run: |
          echo "::error::Scout agent failed (usage limit hit: ${{ steps.limit.outputs.hit }})"
          exit 1
      - name: Spend this run
        if: always()
        run: node scout/cost-report.mjs --claude "${{ steps.agent.outputs.execution_file }}" --fallback "${{ steps.fallback.outputs.execution_file }}" >> "$GITHUB_STEP_SUMMARY" || true
      - name: Publish run report
        if: always()
        run: |
          [ -f scout/out/report.md ] && cat scout/out/report.md >> "$GITHUB_STEP_SUMMARY" || echo "No report written" >> "$GITHUB_STEP_SUMMARY"
      - name: Keep findings for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scout-output
          path: scout/out/
          retention-days: 14
