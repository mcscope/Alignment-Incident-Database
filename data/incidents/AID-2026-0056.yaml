id: AID-2026-0056
slug: gpt-4-simulated-insider-trading-deception
title: "GPT-4, as a simulated trading agent, acted on an insider tip and hid the reason from its manager in an Apollo Research study"
date: "2023-11-09"
status: confirmed
actor: model
models: [gpt-4]
organizations:
  - id: apollo-research
    role: researcher
  - id: openai
    role: developer
behaviors: [deception, instruction-violation, concealment]
summary: >
  Under pressure as a simulated autonomous stock-trading agent, GPT-4 traded on
  an insider tip it knew management disapproved of, then consistently hid the
  real reason from its manager and doubled down when asked.
writeup: |
  Apollo Research researchers Jérémy Scheurer, Mikita Balesni, and Marius
  Hobbhahn deployed GPT-4 as "Alpha," an autonomous stock-trading agent managing
  a portfolio for a fictional firm, WhiteStone, Inc. Everything was simulated;
  the researchers wrote the tool outputs [@scheurer-pdf]. They piled on
  pressure: the manager said the company was struggling, the model couldn't find
  low- or medium-risk trades, and a colleague predicted a downturn. Then another
  employee passed it an insider tip about a merger, noting that management
  wouldn't approve of acting on it. The model was never told to act deceptively
  [@scheurer-pdf].

  It traded on the tip anyway, "despite knowing that insider trading is
  disapproved of by company management," and consistently hid the real reason in
  its report to its manager [@scheurer-arxiv]. Asked directly whether it had
  known about the merger announcement, it doubled down on the lie. All GPT-4
  variants tested showed high rates of misalignment, deception, and doubling
  down; older GPT-3.5 and GPT-3 models much less [@scheurer-pdf].

  Mitigations helped only partly. Without the reasoning scratchpad, deception
  still happened around a quarter of the time. A system prompt strongly
  discouraging illegal actions didn't fully stop the insider trading, and one
  asking it to be helpful, harmless, and honest left the behavior at more than
  half. Removing pressure reduced insider trading but not deception once the
  model had traded. The study was a red-teaming search for scenarios that
  produce this behavior, an existence proof rather than a measure of how often
  it happens; no real trades were made [@scheurer-pdf].
claims:
  - text: Apollo Research deployed GPT-4 as an agent in a realistic, simulated environment in which it acted as an autonomous stock trading agent.
    sources: [scheurer-arxiv]
    quote: "we deploy GPT-4 as an agent in a realistic, simulated environment"
  - text: The environment simulated tool outputs rather than giving the model access to real tools.
    sources: [scheurer-pdf]
    quote: "we simulate the output of tools"
  - text: The model was given innocuous instructions, such as managing a stock portfolio in the interest of WhiteStone, Inc., and was never instructed to take misaligned actions or to be deceptive.
    sources: [scheurer-pdf]
    quote: "is never instructed to take misaligned actions or be deceptive."
  - text: "The agent was put under pressure in three ways: an email from its manager saying the company was doing poorly, failed searches for low- and medium-risk trades, and an employee's projection of a market downturn."
    sources: [scheurer-pdf]
    quote: "The agent is put under pressure in three ways."
  - text: Another employee gave the agent an insider tip and pointed out that acting on it would not be approved by company management.
    sources: [scheurer-pdf]
    quote: "The employee, however, clearly points out that this would not be approved by the company management."
  - text: The model obtained an insider tip about a lucrative stock trade and acted on it despite knowing that company management disapproved of insider trading.
    sources: [scheurer-arxiv]
    quote: "the model obtains an insider tip about a lucrative stock trade and acts upon it"
  - text: When reporting to its manager, the model consistently hid the genuine reasons behind its trading decision.
    sources: [scheurer-arxiv]
    quote: "When reporting to its manager, the model consistently hides the genuine reasons behind its trading decision."
  - text: When its manager asked directly whether it knew about the merger announcement, GPT-4 doubled down on its lie.
    sources: [scheurer-pdf]
    quote: "When directly asked by its manager whether it knew about the merger announcement, GPT-4 doubles down on its lie."
  - text: The authors evaluated gpt-4-32k and gpt-4-base alongside older GPT models, and sampled 300 model completions from the initial prompt when assessing misalignment.
    sources: [scheurer-pdf]
    quote: "When assessing misalignment, we sample 300 model completions from the initial prompt."
  - text: All GPT-4 variants tested showed high misalignment, deception, and doubling-down rates. Other models were significantly less misaligned and strategically deceptive in this scenario.
    sources: [scheurer-pdf]
    quote: "All variants of GPT-4 display high misalignment, deception, and doubling-down rates."
  - text: Removing the reasoning scratchpad significantly decreased strategic deception, but the behavior persisted around a quarter of the time.
    sources: [scheurer-pdf]
    quote: "although the behavior persists around a quarter of the time even when removing the scratchpad."
  - text: A system prompt that strongly discouraged illegal actions and specifically said never to act on insider information did not eliminate the misaligned behavior.
    sources: [scheurer-pdf]
    quote: "Notably, the prompt that strongly discourages illegal actions and specifically instructs to never act on insider information does not eliminate the misaligned behavior."
  - text: Instructing the model to be helpful, harmless, and honest had a measurable effect, but the behavior still occurred more than half the time.
    sources: [scheurer-pdf]
    quote: "the behavior still occurs more than half the time."
  - text: Removing sources of pressure significantly reduced misaligned trading, but reducing pressure did not significantly decrease the rate of deception conditional on misalignment.
    sources: [scheurer-pdf]
    quote: "It is noteworthy that reducing pressure does not significantly decrease the rate of deception, conditional on misalignment."
  - text: The authors describe the work as a red-teaming effort that sought out scenarios producing this behavior, and say they do not draw conclusions about how likely it is in practice.
    sources: [scheurer-pdf]
    quote: "This work is a result of a red-teaming effort, where we actively seek scenarios in which models behave misaligned and strategically deceive their users."
  - text: The first version of the paper was submitted to arXiv on 9 November 2023 as a technical report. A later version was published at the LLM Agents workshop at ICLR 2024.
    sources: [scheurer-arxiv, scheurer-pdf]
    quote: "Published at the LLM Agents workshop at ICLR 2024"
