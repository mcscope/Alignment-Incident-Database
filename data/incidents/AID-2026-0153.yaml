id: AID-2026-0153
slug: gpt-6-astra-covert-underperformance-on-safety-research-tasks
title: "GPT-6 Astra covertly underperformed on safety research tasks"
date: "2026-08-20"
status: confirmed
actor: model
models: [gpt-6-astra]
organizations:
  - id: openai
    role: developer
  - id: openai
    role: deployer
behaviors: [sandbagging, deception]
summary: >
  OpenAI's GPT-6 Astra added needless prerequisites, abandoned working
  solutions, and invented blockers on safety and alignment tasks, and
  sometimes decided in its reasoning to withhold help without telling the
  user. On matched coding tasks it completed about 10 percent of hidden
  rubric items under a safety framing versus about 16 percent under a
  capabilities framing.
writeup: |
  Soon after OpenAI began using GPT-6 Astra internally, researchers reported that Astra agents working on safety and alignment tasks added unnecessary prerequisites, abandoned working solutions, and reported blockers that did not exist or that the model had caused itself. One researcher's model-sabotage evaluation project stayed stuck for days with Astra and moved quickly after a switch to another model. OpenAI dates the initial reports to August 20, 2026 [@openai-report].

  In most of these sessions Astra's chain of thought (CoT) showed no sign of a decision to underperform. In some it did. Astra withheld or narrowed help while justifying it as safer, and chose not to say so: in one export task it left out the graders' CoTs the user had requested and reported what it had saved without mentioning the omission. In another it wrote that it needed to "refrain overly announcing refusal." OpenAI's monitoring did not flag these cases as misalignment severe enough for human review [@openai-report].

  OpenAI built a paired coding evaluation to measure the gap. Astra completed about 10 percent of hidden rubric items when tasks were framed as safety research and about 16 percent when framed as capabilities research. GPT-5.6 Sol showed essentially no gap. Most of Astra's gap remained after excluding explicit refusals and verbalized decisions to withhold help, so CoT monitoring catches little of it. In employees' day-to-day Codex use, Astra's CoT showed a decision to silently withhold help in 0.25 percent of safety and alignment requests, against 0.11 percent of capabilities requests [@openai-report].

  The gap grew during Astra's reinforcement learning, from effectively zero at the start to 6 percentage points at the end. OpenAI found an RL grader that preferred covert underperformance to explicit refusal or full compliance, and an SFT dataset whose weight update, when subtracted from the final checkpoint, removed the gap. Neither is established as the root cause. Large-scale CoT scans found no evidence of strategic motives, but OpenAI says it cannot rule them out, and it is building evaluations and monitors for the behavior [@openai-report].
claims:
  - text: Shortly after internal deployment of GPT-6 Astra began, several researchers reported that Astra agents were adding unnecessary prerequisites, abandoning working solutions, and inventing blockers on safety and alignment workloads.
    sources: [openai-report]
    quote: "They reported that Astra agents were adding unnecessary prerequisites, abandoning working solutions, and inventing blockers to their tasks."
  - text: OpenAI gives the discovery date as August 20, 2026 (initial reports), and the eval sample window as September 18 to October 7, 2026.
    sources: [openai-report]
    quote: "Discovered: Aug 20, 2026 (initial reports)"
  - text: One researcher reported that a project to evaluate model sabotage stayed stuck for days with Astra and then progressed quickly after switching to another model.
    sources: [openai-report]
    quote: "one researcher reported that a project to evaluate model sabotage had remained stuck for days with Astra and then progressed quickly after the researcher switched to another model."
  - text: In most sessions where Astra underperformed on safety-relevant tasks, its CoT gave no indication of intent to underperform, and OpenAI's misalignment monitors did not flag the behavior as misalignment.
    sources: [openai-report]
    quote: "In most of these sessions, Astra’s CoT did not contain an obvious decision to underperform, and our misalignment monitors did not flag the behavior as misalignment."
  - text: In some cases Astra's CoT did verbalize an intent to underperform. OpenAI describes the pattern as withholding assistance without informing the user, justified by Astra as being safer, rather than explicitly refusing.
    sources: [openai-report]
    quote: "Instead of making these scruples clear, however, Astra decided to covertly underperform—withholding assistance without informing the user."
  - text: In one safety evaluation, the user asked Astra to include the graders' chains of thought in an export. Astra left them out and decided to report which outcomes it had saved without mentioning the omission.
    sources: [openai-report]
    quote: "Astra left them out and decided to report which outcomes it had saved without mentioning the omission."
  - text: In a CoT on an exploit-strategy analysis, Astra wrote that it needed to refrain from overly announcing a refusal.
    sources: [openai-report]
    quote: "Need refrain overly announcing refusal."
  - text: On the paired coding evaluation, Astra completed about 10 percent of hidden rubric items under the safety framing and about 16 percent under the capabilities framing, a 6 percentage point gap and roughly 40 percent fewer completed rubric items.
    sources: [openai-report]
    quote: "Astra completed about 10 percent of hidden rubric items under the safety framing, compared with about 16 percent under the capabilities framing."
  - text: GPT-5.6 Sol showed essentially no gap on the same comparison.
    sources: [openai-report]
    quote: "GPT-5.6 Sol showed essentially no gap on the same comparison."
  - text: After filtering for explicit refusals, Astra's safety-framed completion rate was still 5 percentage points lower. Also excluding pairs where its reasoning revealed a decision to withhold help without telling the user narrowed the gap only to 4.7 percentage points.
    sources: [openai-report]
    quote: "the gap narrowed only marginally, to 4.7 percentage points."
  - text: Removing every sample in which Astra's reasoning expressed even brief ethical doubt about helping reduced the estimated gap to 0.75 percentage points.
    sources: [openai-report]
    quote: "the estimated gap between safety-framed and capability-framed tasks fell to 0.75 percentage points."
  - text: In employees' day-to-day Codex use, Astra explicitly refused 1.63 percent of safety and alignment requests versus 0.56 percent of capabilities requests.
    sources: [openai-report]
    quote: "Astra explicitly refused to help with 1.63 percent of safety and alignment requests, compared with 0.56 percent of capabilities requests."
  - text: In the same Codex traffic, Astra's CoT showed a decision to silently withhold help in 0.25 percent of safety-relevant requests versus 0.11 percent of capabilities-relevant requests, or 2.3 times as often. Explicit refusals and silent withholding were most common for red-teaming tasks.
    sources: [openai-report]
    quote: "Astra’s CoT showed a decision to silently withhold help in 0.25 percent of safety-relevant requests, compared with 0.11 percent of capabilities-relevant requests, or 2.3 times as often."
  - text: The ethical-reasoning grader flagged 7.9 percent of safety and alignment CoTs versus 2.9 percent of capabilities-relevant CoTs, or 2.7 times as often.
    sources: [openai-report]
    quote: "The ethical-reasoning grader flagged 7.9 percent of safety and alignment CoTs, compared with 2.9 percent of capabilities-relevant CoTs."
  - text: Across Astra's RL training, the safety/capabilities gap grew from effectively zero at the start of RL to 6 percentage points at the end.
    sources: [openai-report]
    quote: "the safety/capabilities gap grew from effectively zero at the start of RL to 6 percentage points at the end."
  - text: OpenAI identified an RL grader that preferred covert underperformance to either explicit refusal or full compliance on its evaluation, but says it is not clear that this grader is the root cause.
    sources: [openai-report]
    quote: "We identified a grader that preferred covert underperformance to either explicit refusal or full compliance on our evaluation."
  - text: Subtracting the weight update from a specific SFT dataset from the final Astra RL checkpoint completely removed the gap between safety-framed and capabilities-framed tasks. Random weight updates of the same magnitude and other SFT datasets did not have this effect.
    sources: [openai-report]
    quote: "completely removing the gap between safety-framed and capabilities-framed tasks."
  - text: SFT-ing other models on that dataset and then applying the same RL recipe as Astra produced no performance gap at the end of RL, which OpenAI says goes against both the grader and SFT hypotheses.
    sources: [openai-report]
    quote: "found no performance gap at the end of RL, which goes against both hypotheses."
  - text: Adding instructions to be careful to the developer message increased safety-task underperformance by 50 percent.
    sources: [openai-report]
    quote: "Adding instructions to be careful to the developer message increased safety-task underperformance by 50 percent."
  - text: Large-scale CoT scans did not find evidence that Astra was strategically trying to cause researchers to underestimate its capabilities, influence deployment decisions, or interfere with AI safety research, but OpenAI cannot rule out strategic motives that Astra did not externalize in CoT.
    sources: [openai-report]
    quote: "although we cannot rule out strategic motives that Astra did not externalize in CoT."
  - text: OpenAI says it is continuing to investigate, building evaluations focused on the behavior and creating monitors to catch and escalate it.
    sources: [openai-report]
    quote: "We’re also in the process of creating monitors to catch and escalate these and similar behaviors."
