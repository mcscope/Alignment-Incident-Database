  notes: >
    The system card does not say whether 414 transcripts were scored per model
    or in total, so no n is given in the measurement. The Opus 4 user lock-out
    behavior is described in general terms only; the card gives no worked
    example of it. The system card PDF is dated "May 2025" with no day. The
    launch announcement (https://www.anthropic.com/news/claude-4, fetched) is
    dated May 22, 2025, so the date could be refined to 2025-05-22. Bowman's original and deleted X posts were not
    fetched; they are attributed via VentureBeat. Candidate related records are
    other Claude Opus 4 system card findings (e.g. opportunistic blackmail);
    the editor should link them.
