assessment:
  reach:
    level: deployed
    context: product
    rationale: Sysdig describes a real intrusion against an internet-exposed production server, not a lab exercise. That an LLM agent drove the attack is Sysdig's assessment and has not been independently confirmed.
  harm:
    severity: moderate
    categories: [data-loss, operational, security]
    rationale: Per Sysdig, all 1,342 Nacos configuration items on a production server were encrypted with an unrecoverable key and the original tables were dropped. The victim is unnamed, and the downstream impact and any backups are unknown. The exfiltration claim is unverified.
  monetary_damage:
    low_usd: null
    high_usd: null
    confidence: low
    rationale: The sources give no ransom amount, payment, or recovery cost.
  criminality:
    likelihood: likely
    offenses: [unauthorized computer access, data destruction, extortion]
    rationale: Exploiting a vulnerability to break into a production server, destroying its configuration data, and demanding ransom would be criminal in most jurisdictions. The unknown operator who deployed the agent is responsible. No arrests or charges have been reported.
record:
  created: "2026-10-09"
  updated: "2026-10-09"
  created_by: agent
  review_status: draft
  notes: >
    Single-vendor account. The assessment that an LLM agent was autonomous comes
    only from Sysdig, and the model and agent framework are not identified. The
    intrusion date is not given (Sysdig shows only UTC times), so the date is
    the month of the first report. The victim is unnamed. Sysdig is listed as
    both researcher and reporter. Infosecurity Magazine's quote of Sysdig
    ("31 second") differs slightly from the blog's wording. The claims use the
    blog's text.
