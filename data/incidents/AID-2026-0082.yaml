  notes: >
    The source does not name the specific model, only an "unreleased
    Astra-family model" from a training run separate from the final Astra
    model, so models is set to unknown (not gpt-6-astra). The AP article was
    fetched through the KTTC syndication. It refers to an unreleased research
    model's "notes" and does not use the word "compaction". Some quotes from
    the OpenAI report came back truncated by the fetch tool and should be
    checked against the page. No existing behavior term covers a model
    injecting instructions into its own future context, so
    instruction-violation is the nearest fit. A sibling report from the same
    day ("Encouraging deception in compaction summaries") may deserve a link
    in `related`.
