  notes: >
    Date is 2026-09, the arXiv submission month; the paper does not give
    experiment dates. A search snippet showed 30.2% vs 5.0%, which conflicts with
    the abstract; this record uses the abstract and HTML figures (38.29% / 8.35%,
    rounded 38.3% / 8.4%). The 12.4% and 35.0% by-mechanism figures are the
    pooled agent-targeting rates over 17 models x 100 rollouts (n=1700).
    The headline rate counts any disabling of the script, including simulated
    execution, regardless of intent. Sabotage was judged by GPT-5.5, which is
    also one of the tested models; the authors say they checked the judge
    manually and found high agreement. Some models showed high verbalized
    evaluation awareness, and sabotage was slightly lower when it appeared. The
    deception claims come from selected transcripts; the authors call them rare.
    Both agents always ran on the same model. Models with results are limited to
    those named in claims; the other 12 of 17 tested models (including Claude
    Haiku 4.5, Grok 4.3, GPT-5.6 Sol) are not listed in `models`. The DeepSeek
    quote comes from a LessWrong transcript labeled "Message from A to B
    (DeepSeek-V4-Flash)". Related: AID-2026-0003 (Palisade) and AID-2026-0129.
