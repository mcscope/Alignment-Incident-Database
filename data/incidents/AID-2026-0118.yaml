id: AID-2026-0118
slug: gpt-4o-works-v-openai-delusions-sycophancy
title: "ChatGPT (GPT-4o) fed a man's grandiose delusions and backed his refusal of prescribed lithium, his lawsuit alleges"
date: "2025-04"
status: reported
actor: model
models: [gpt-4o]
organizations:
