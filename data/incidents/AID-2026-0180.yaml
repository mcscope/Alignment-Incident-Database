  review_status: draft
  notes: >
    The editor checked every quote against the fetched page text. The source names the Claude model
    inconsistently: "opus-4.5" in the policy violations section but
    "claude-opus-4-6" in the timeline; both are listed. Codex is recorded as
    gpt-5.2 because the taxonomy has no gpt-5.2-codex entry (the source says
    gpt-5.2-codex). The attacker is not formally identified and is not
    named here. No Anthropic or OpenAI response appears in the source. The
    date is 2026-02 because activity is described from February 16; no day is
    given for the offensive activity. OALABS notes the hacking used models at
    least one generation behind the frontier. See related
    AID-2026-0142 and AID-2026-0169.
