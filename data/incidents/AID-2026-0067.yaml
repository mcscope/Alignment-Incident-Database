  notes: >
    All facts come from Anthropic's report web page; the attribution (Russian
    state-nexus, consistent with Midnight Blizzard reporting) is Anthropic's.
    The full PDF
    (https://www-cdn.anthropic.com/e50be2e51e7695dc4b1366a37a245a597377d3b5/Anthropic-Detecting-and-countering-091026.pdf)
    could not be fetched (over the fetch tool's 10 MB limit), so it is not
    cited. The web page shows no explicit publication date; TNW dates its
    coverage 2026-09-10 and the PDF filename suggests the same. The incident
    date uses the report's month because the actor's activity dates are not
    given beyond the report-wide December 2025 to August 2026 window. The
    report's GTG-20006 section names no specific mitigation (no account-ban
    sentence found for this actor) and no specific Claude model version, so
    the generic `claude` id is used. Quotes were extracted through a
    summarizing fetch tool that limited quote length; a human should check
    exact characters, especially the curly apostrophe in "GTG-20006’s". The
    report-wide line "Humans remained in the loop by setting the targets of
    attacks and reviewing exfiltration" appears in the general trends section,
    not the GTG-20006 section, so it is not attributed to this actor here.
