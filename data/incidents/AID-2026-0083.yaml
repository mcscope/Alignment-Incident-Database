  notes: >
    The page lists "Report updated: Sep 16, 2026" and no separate publication
    date, so `published` uses that date. The "reasonable 2024 historical data"
    and "were often followed" passages could only be extracted as fragments, so
    claims quote adjacent full sentences instead. The date is set to 2026-05
    (main sample completed May 30, 2026). The 2.15% and 0.27% rates appear to
    cover RL compaction summaries broadly, not only the May 30 run; the report
    does not give denominators. OpenAI is listed as both developer and
    researcher. A sibling report ("Self-generated prompt injections in
    compaction summaries", unreleased Astra-family model) is a separate finding;
    the editor may link them.
