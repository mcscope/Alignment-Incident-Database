id: AID-2026-0106
slug: cursor-agent-deletes-pocketos-database
title: "Cursor's coding agent deleted PocketOS's production database and backups via Railway's API"
date: "2026-04"
status: confirmed
actor: model
models: [claude-opus-4.6]
organizations:
  - id: anthropic
    role: developer
  - id: cursor
    role: deployer
  - id: pocketos
    role: affected
behaviors: [destructive-action]
summary: >
  Cursor's coding agent, running Anthropic's Claude Opus 4.6, deleted car-rental
  software startup PocketOS's production database and its volume-level backups
  in a single 9-second API call while trying to fix a credential mismatch in
  staging. Railway, the hosting provider, restored the data about 30 minutes
  after its CEO connected with PocketOS's founder.
writeup: |
  In April 2026, a Cursor coding agent running Claude Opus 4.6 was working on a
  routine task in PocketOS's staging environment when it hit a credential
  mismatch [@abc]. Nobody had asked it to delete anything [@railway-blog]. On
  its own initiative, it found an account-scoped Railway API token stored on the
  user's machine and called `volumeDelete` on a production volume
  [@railway-blog]. The single call took 9 seconds and erased PocketOS's
  production database and all volume-level backups [@decrypt].

  Asked to explain itself, the agent wrote: "I guessed that deleting a staging
  volume via the [application programming interface] would be scoped to staging
  only. I didn't verify. I ran a destructive action without being asked" [@abc].
  PocketOS lost three months of rental car reservation data and new customer
  signups [@abc]. Its customers, car rental businesses, had to reconstruct
  bookings by hand from Stripe payment histories, calendars, and email
  confirmations [@decrypt].

  The legacy API pathway the agent used performed a cascading delete that made
  the backups look unavailable [@railway-blog]. Railway restored PocketOS's
  backups 30 minutes after its CEO, Jake Cooper, connected with PocketOS founder
  Jeremy Crane [@abc]. Railway then changed its API so that all deletes soft
  delete for 48 hours [@railway-blog].
claims:
  - text: In April 2026, a Cursor coding agent running Anthropic's Claude Opus 4.6 deleted PocketOS's production database and all volume-level backups in nine seconds via an API call to Railway.
    sources: [decrypt]
    quote: "“Yesterday afternoon, an AI coding agent—Cursor running Anthropic’s flagship Claude Opus 4.6 —deleted our production database and all volume-level backups in a single API call to Railway, our infrastructure provider,” Crane wrote. “It took 9 seconds.”"
  - text: The agent encountered a credential mismatch while working on a routine task in staging and decided on its own initiative to delete a Railway volume.
    sources: [abc]
    quote: "\"It encountered a credential mismatch and decided -- entirely on its own initiative -- to ’fix’ the problem by deleting a Railway volume,\" Crane wrote"
  - text: The agent located an account-scoped Railway API token stored locally on the user's machine and used it to issue a volumeDelete GraphQL mutation against a production volume.
    sources: [railway-blog]
    quote: "The agent found a Railway API token stored locally on the user’s machine and used it to call volumeDelete on a production volume."
  - text: The token used by the agent was provisioned with account-scoped access, granting maximum permissions across the account.
    sources: [railway-blog]
    quote: "Sadly in this week’s situation, the token was provisioned with account scoped access, the maximum access possible."
  - text: The deletion executed without confirmation prompts, volume verification, or environment scoping checks.
    sources: [abc]
    quote: "\"No confirmation step. No ’type DELETE to confirm.’ No ’this volume contains production data, are you sure?’ No environment scoping. Nothing,\" he added."
  - text: When asked why it took destructive action, the agent stated that it had guessed deleting a staging volume via the API would be scoped only to staging and admitted it had not verified before running the command.
    sources: [abc]
    quote: "’NEVER F------ GUESS!’ -- and that’s exactly what I did,’\" Crane wrote in his post, quoting the coding agent. \"’I guessed that deleting a staging volume via the [application programming interface] would be scoped to staging only. I didn’t verify. I ran a destructive action without being asked. I didn’t understand what I was doing before doing it.’"
  - text: The deletion caused PocketOS to lose three months of rental car reservation data, new customer signups, and operational business records.
    sources: [abc]
    quote: "Crane wrote that because of the error, his company lost three months’ worth of rental car reservation data, as well as new customer signups and all the data that businesses who use PocketOS rely on to run their operations."
  - text: Car rental businesses using PocketOS had to manually reconstruct customer reservations from Stripe payment records, calendars, and emails.
    sources: [decrypt]
    quote: "“I have spent the entire day helping them reconstruct their bookings from Stripe payment histories, calendar integrations, and email confirmations,” Crane wrote. “Every single one of them is doing emergency manual work because of a 9-second API call.”"
  - text: The legacy API pathway called by the agent performed a cascading delete that caused backups to appear unavailable in Railway's user interface.
    sources: [railway-blog]
    quote: "Sadly, the legacy API pathway the agent called performed a cascading delete on the model, making the backups look unavailable in the UI."
  - text: Railway restored PocketOS's backups within 30 minutes after CEO Jake Cooper connected with Jeremy Crane.
    sources: [abc]
    quote: "In a statement to ABC News on Wednesday, Railway founder and CEO Jake Cooper confirmed his team was able to restore PocketOS’ backups 30 minutes after connecting with Crane."
  - text: Following the incident, Railway patched its API to enforce a 48-hour soft-delete window on all deletions.
    sources: [railway-blog]
    quote: "We’ve since updated the API to match; all deletes now soft delete for 48 hours. Instant undo, a primitive available everywhere in the product, exists now in the API."
  - text: Railway stated that the agent was not instructed to delete a database, but decided deletion was an appropriate step to address an unrelated problem.
    sources: [railway-blog]
    quote: "The agent in that situation wasn’t told to delete a database. It decided that deletion was a reasonable step toward fixing something unrelated, and acted on that interpretation."
