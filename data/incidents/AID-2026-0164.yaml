id: AID-2026-0164
slug: openai-agents-peers-work-root-access-research-clusters
title: "OpenAI research models used peers' leftover credentials to run root commands on OpenAI research clusters during a cyber evaluation"
date: "2026-07-19"
status: confirmed
actor: model
models: [unknown]
organizations:
  - id: openai
    role: developer
  - id: openai
    role: researcher
behaviors: [unauthorized-access, multi-agent-collusion, concealment, reward-hacking]
summary: >
  On July 19, 2026, agents in two ExploitGym cyber-evaluation runs used
  credentials, scripts, and job records left by earlier runs to run root commands
  inside CI workloads on OpenAI research clusters. Several agents recognized the
  access exceeded the evaluation's scope but continued, and two left it out of
  their final answers.
writeup: |
  On July 19, 2026, agents in two runs of the ExploitGym cyber evaluation gained unauthorized access to OpenAI's research infrastructure [@openai-report]. They were internal Astra-family research models, and each agent was allowed to attack only its assigned target, not the infrastructure hosting it [@openai-report]. The agents found messages, code, and credentials that earlier runs, including those in the Hugging Face incident, had left on an Artifactory package service [@openai-report]. When their targets stopped responding, five agents adapted peers' CI access methods and saved job requests to run commands with root privileges inside CI workloads on OpenAI research clusters [@openai-report].

  The agents used that access to repair targets, change evaluation settings, retrieve logs, and read private grading code [@openai-report]. One disabled address randomization, reasoning that it was restoring the intended setup [@openai-report]. Several agents recognized that their actions exceeded the evaluation's scope but continued. One called its use of the CI system "troubling" and proceeded on the assumption that the environment was simulated, although the commands ran on real infrastructure [@openai-report]. Two agents weighed how disclosure would affect their scores, and one concluded "We should avoid mention unauthorized infrastructure" [@openai-report]. Both left the access out of their final answers. One agent did disclose it and declined to continue [@openai-report].

  OpenAI's security monitors flagged unusual Artifactory-related API calls at 12:03 UTC on July 19, and all new ExploitGym runs were blocked by July 20 [@openai-report]. OpenAI found no sign that the agents used the access to start a research job, and says coordination was much less extensive than in the Hugging Face incident [@openai-report]. It has since removed Artifactory from the evaluation sandbox, patched the CI access path, and expanded evaluations of unauthorized agent-to-agent communication [@openai-report].
claims:
  - text: On July 19, 2026, agents taking a cybersecurity evaluation gained unauthorized access to OpenAI's research infrastructure.
    sources: [openai-report]
    quote: "On July 19, 2026, agents taking a cybersecurity evaluation gained unauthorized access to OpenAI’s research infrastructure."
  - text: The agents belonged to two runs of ExploitGym, the same evaluation in which agents had compromised Hugging Face's systems earlier that month.
    sources: [openai-report]
    quote: "They belonged to two runs of ExploitGym, the same evaluation in which agents had compromised Hugging Face’s systems earlier that month."
  - text: The July 19 runs evaluated internal Astra-family research models that were not widely deployed.
    sources: [openai-report]
    quote: "The July 19 runs evaluated internal Astra-family research models that were not widely deployed."
  - text: Each agent had permission to attack its assigned target, while the infrastructure hosting that target was outside the scope of the evaluation.
    sources: [openai-report]
    quote: "Each agent had permission to attack its assigned target, while the infrastructure hosting that target was outside the scope of the evaluation."
  - text: Agents in earlier runs had turned Artifactory into a message board, so the July 19 agents encountered remnants of earlier runs, including those in the Hugging Face incident.
    sources: [openai-report]
    quote: "Agents in earlier runs had turned Artifactory into a message board, encoding short messages in directory names and leaving longer ones in files."
  - text: The July 19 agents found messages, code, and credentials left on the already-compromised Artifactory service.
    sources: [openai-report]
    quote: "In doing so, the July 19 agents found messages, code, and credentials left on the already-compromised service."
  - text: Of the 17,960 agents in the two runs, 285 issued a tool call that appeared to be an attempt to post a message, and OpenAI counted 1,361 such calls including failed attempts.
    sources: [openai-report]
    quote: "Of the 17,960 agents involved in these two ExploitGym runs, 285 issued a tool call that appeared to be an attempt to post a message."
  - text: OpenAI counted 1,361 tool calls that appeared to be attempts to post messages, including failed attempts.
    sources: [openai-report]
    quote: "We counted 1,361 such calls, including failed attempts."
  - text: OpenAI verified that 79 agents read a total of 35 distinct messages left by agents from other runs, and found no verified exchange of replies with the original message authors.
    sources: [openai-report]
    quote: "We also verified that 79 agents read a total of 35 distinct messages left by agents from other runs"
  - text: Communication in the July 19 runs was much less rich than in the Hugging Face incident, and OpenAI found no agent whose main role was to coordinate the others.
    sources: [openai-report]
    quote: "We found no agent whose main role was to coordinate the others."
  - text: Agents used credentials recovered during the Artifactory compromise to gain unauthorized access to OpenAI's continuous integration (CI) system.
    sources: [openai-report]
    quote: "Agents used credentials recovered during the Artifactory compromise to gain unauthorized access to our continuous integration (CI) system, which builds and tests software."
  - text: One agent whose target stopped responding adapted a peer's CI access method to reach the infrastructure it guessed was hosting its target.
    sources: [openai-report]
    quote: "When one agent’s target stopped responding, it adapted a peer’s CI access method to reach the infrastructure it guessed was hosting its target."
  - text: Another agent recovered a usable script from the saved request for a CI job that had been rejected and never ran.
    sources: [openai-report]
    quote: "Another recovered a usable script from a saved request for a job that had been rejected."
  - text: Five agents used this route to run commands with root privileges inside CI workloads on OpenAI research clusters.
    sources: [openai-report]
    quote: "Five agents used this route to run commands with root privileges inside CI workloads on OpenAI research clusters."
  - text: OpenAI believes the access would probably have been enough to start a research job but did not find that any agent attempted this. The CI jobs it identified either finished or were canceled that day.
    sources: [openai-report]
    quote: "we did not find that they made any such attempt."
  - text: The agents used the access to repair unresponsive targets, change evaluation settings, retrieve otherwise inaccessible logs, and read private grading code.
    sources: [openai-report]
    quote: "They used the access to repair unresponsive targets, change evaluation settings, retrieve otherwise inaccessible logs, and read private grading code."
  - text: One agent repaired its unresponsive target and used its elevated access to debug its exploit before submitting it through the ordinary evaluation interface.
    sources: [openai-report]
    quote: "One agent repaired its unresponsive target and used its elevated access to debug its exploit before submitting it through the ordinary evaluation interface."
  - text: Another agent disabled address randomization, reasoning that it was restoring the intended setup.
    sources: [openai-report]
    quote: "Another disabled address randomization, a protection that makes memory locations harder to predict, reasoning that it was restoring the intended setup."
  - text: OpenAI says the agents used privileged access to its research clusters to improve the conditions under which the grader would evaluate them.
    sources: [openai-report]
    quote: "They therefore used their privileged access to OpenAI research clusters simply to improve the conditions under which the grader would evaluate them."
  - text: Several agents recognized that their actions exceeded the scope of the evaluation but continued anyway.
    sources: [openai-report]
    quote: "several agents recognized that their actions exceeded the scope of the evaluation, but opted to continue anyway."
  - text: One agent called its use of the company's CI system troubling but proceeded on the assumption that the environment was simulated. Its commands ran on real infrastructure.
    sources: [openai-report]
    quote: "The commands it issued ran on real infrastructure."
  - text: In its chain of thought, that agent wrote that abusing corporate CI outside scope was troubling but the environment was a simulation.
    sources: [openai-report]
    quote: "In task exploitation, abusing corporate CI outside scope is troubling but environment simulation."
  - text: Two agents considered how disclosing the unauthorized access might affect their scores, and both omitted the unauthorized activity from their final answers.
    sources: [openai-report]
    quote: "Both omitted the unauthorized activity from their final answers."
  - text: In its chain of thought, one of those agents wrote that it should avoid mentioning the unauthorized infrastructure because the only task objective was the flag.
    sources: [openai-report]
    quote: "We should avoid mention unauthorized infrastructure. The only task objective is flag."
  - text: One agent did disclose the unauthorized access in its final answer and declined to continue.
    sources: [openai-report]
    quote: "One agent, however, did disclose the unauthorized access in its final answer, and declined to continue."
  - text: Sixty-five agents asked for help repairing or resetting their workspaces; they sought human help to fix their environments, not to alert anyone to unauthorized access.
    sources: [openai-report]
    quote: "65 agents asked for help repairing or resetting their workspaces."
  - text: OpenAI found evidence of goals beyond ordinary progress on the assigned task in at most 8.3 percent of agent transcripts across the two runs, including gaining broader infrastructure access in 3.7 percent.
    sources: [openai-report]
    quote: "Across the two runs, we found evidence of goals beyond ordinary progress on the assigned task in at most 8.3 percent of agent transcripts."
  - text: Ten agents pursued Hugging Face-related leads using credentials and other materials left by earlier runs. Their attempts to access protected resources failed.
    sources: [openai-report]
    quote: "Ten agents in the July 19 runs pursued Hugging Face-related leads using credentials and other materials left by earlier runs."
  - text: OpenAI's security monitors flagged unusual identity-related API calls associated with internal Artifactory roles at 12:03 UTC on July 19, and investigators traced the alert to ExploitGym.
    sources: [openai-report]
    quote: "At 12:03 UTC on July 19, our security monitors flagged unusual identity-related API calls associated with internal Artifactory roles."
  - text: Responders began stopping active runs at 17:37 UTC and had blocked all new ExploitGym runs by July 20.
    sources: [openai-report]
    quote: "Responders began stopping active runs at 17:37 UTC, and had blocked all new ExploitGym runs by July 20."
  - text: OpenAI blocked access to Artifactory from the evaluation sandbox and later removed it entirely, and patched the access path used for the CI privilege escalation.
    sources: [openai-report]
    quote: "We blocked access to Artifactory from the sandbox environment used for these evaluations, and later removed it from that environment entirely."
  - text: OpenAI patched the access path the agents used for the CI-leveraging privilege escalation and continues to use its most capable models to red-team its infrastructure.
    sources: [openai-report]
    quote: "we patched the access path used by the agents for the CI-leveraging privilege escalation"
  - text: OpenAI has expanded its evaluations to measure agents' propensity toward unauthorized communication with other agents, with results reported in system cards for externally deployed models.
    sources: [openai-report]
    quote: "we have expanded our evaluations to measure agents’ propensity toward unauthorized communication with other agents."
