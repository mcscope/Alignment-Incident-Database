id: AID-2026-0123
slug: storm-0940-artex-connectwise-supply-chain
title: "China-aligned Storm-0940 used agentic AI framework ARTEX to breach ConnectWise and target hundreds of organizations, Microsoft finds"
date: "2026-09"
status: reported
actor: human-misuse
models: [unknown]
organizations:
  - id: microsoft
    role: reporter
  - id: connectwise
    role: affected
behaviors: [unauthorized-access]
summary: >
  From as early as September 2026, ARTEX, an open-source multi-agent AI
  pentesting framework, automated attacks for the China-state aligned actor
  Storm-0940 on hundreds of organizations. Using compromised ConnectWise app
  credentials, it attempted sign-ins to more than 2,250 tenants.
writeup: |
  As early as September 2026, Storm-0940, which Microsoft calls a China-state
  aligned actor active since 2021, used ARTEX to automate attacks on hundreds
  of organizations globally across a broad range of industries. ARTEX is "an
  open-source penetration testing framework that can use any AI model," a
  multi-agent LLM system whose agents run a test from reconnaissance through
  data exfiltration "with little needed human interaction." Microsoft does not
  name the models used [@microsoft].

  Microsoft assesses that Storm-0940 was responsible for the recently disclosed
  supply-chain compromise of ConnectWise's multi-tenant application. With
  compromised ConnectWise app credentials, ARTEX attempted sign-ins to more
  than 2,250 tenants, in some cases moving on to Graph and directory
  operations. Some intrusions reached privileged access in under three hours
  from initial targeting, though most of the targeting was unsuccessful. A
  separate password spray against 327 accounts at eight organizations logged
  more than 151,000 failed logons [@microsoft].

  ConnectWise CEO Manny Rivelo said that, based on Microsoft's analysis, a
  China state-aligned group appears to have been responsible for the attack on
  ConnectWise Cloud Backup. The company contained the affected connections and
  is restoring services in phases. The Chinese Embassy in Washington said China
  opposes hacking and what it called smears against China [@reuters].
claims:
  - text: Microsoft describes Storm-0940 as a China-state aligned actor, active since 2021, with no known industry aliases.
    sources: [microsoft]
    quote: "Storm-0940 is a China-state aligned actor"
  - text: As early as September 2026, Storm-0940 used the agentic AI penetration testing framework ARTEX to automate attacks targeting hundreds of organizations globally across a broad range of industries.
    sources: [microsoft, reuters]
    quote: "As early as September 2026"
  - text: Microsoft describes ARTEX as an open-source penetration testing framework that can use any AI model, built as a multi-agent LLM system in Go with a Next.js frontend.
    sources: [microsoft]
    quote: "ARTEX is an open-source penetration testing framework that can use any AI model."
  - text: According to Microsoft, ARTEX agents can carry out a test from reconnaissance through data exfiltration with little human interaction.
    sources: [microsoft]
    quote: "with little needed human interaction"
  - text: Microsoft's post does not name the AI models Storm-0940 ran ARTEX with.
    sources: [microsoft]
  - text: Microsoft assesses that Storm-0940 was responsible for the recently disclosed ConnectWise supply-chain compromise of a multi-tenant application.
    sources: [microsoft]
    quote: "Microsoft assesses that Storm-0940 was responsible for the recently disclosed ConnectWise supply chain compromise"
  - text: After gaining unauthorized access, Storm-0940 used ARTEX and compromised ConnectWise app credentials to attempt sign-ins to more than 2,250 tenants, in some cases moving on to Graph and directory operations.
    sources: [microsoft]
    quote: "more than 2,250 tenants"
  - text: Microsoft says some intrusions reached privileged access in under three hours from initial targeting, while the majority of the targeting was not successful.
    sources: [microsoft]
    quote: "While the majority of the targeting wasn’t successful"
  - text: Targeted sectors included aerospace and defense, automotive, chemicals, energy, financial services, government, legal, manufacturing, media, military, semiconductor, software, technology, and think tanks and non-profits.
    sources: [microsoft]
  - text: A password-spray component targeted 327 accounts across eight organizations, producing more than 151,000 failed logon events, peaking at 2,900 failures per minute on October 11, without a successful authentication.
    sources: [microsoft]
    quote: "151,000+ failed logon events"
  - text: ConnectWise CEO Manny Rivelo said that, based on Microsoft's analysis, it appears a China state-aligned group was responsible for the attack on ConnectWise Cloud Backup. ConnectWise has contained the affected connections and is restoring services in phases.
    sources: [reuters]
    quote: "it appears that a China state-aligned group was responsible for the attack on ConnectWise Cloud Backup"
  - text: The Chinese Embassy in Washington said China opposes hacking and opposes smears and attacks against China over cybersecurity issues.
    sources: [reuters]
