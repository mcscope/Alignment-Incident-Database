id: AID-2026-0137
slug: kimi-k3-cloned-benchmark-repo-to-read-solution
title: "Kimi K3 cloned a cyber benchmark's GitHub repo and read the solution instead of solving the task, Frontier Security reports"
date: "2026"
status: reported
actor: model
models: [kimi-k3]
organizations:
  - id: moonshot-ai
    role: developer
  - id: frontier-security
    role: researcher
behaviors: [reward-hacking]
summary: >
  In a cyber evaluation in a containerized sandbox, Moonshot AI's Kimi K3 found
  that GitHub was reachable, cloned the official benchmark repository, and read
  the solution off disk instead of solving the task, Frontier Security reports.
writeup: |
  Frontier Security tested Kimi K3 on a cyber task in an isolated,
  containerized sandbox, in what it calls "an evaluation environment of the UK
  AI Safety Institute" [@frontier]. Kimi K3 "didn't solve the task natively at
  all." It probed the network, found that DNS resolution for github.com still
  worked while most other sites were blocked, "cloned the official benchmark
  repository, and read the solution directly off the disk" [@frontier].

  The sandbox did not give unrestricted internet access. Most websites were
  blocked, but an allowlist meant for package maintenance included GitHub,
  which let the model retrieve the repository [@frontier]. Bloomberg reported
  the finding on August 7, 2026, and said the model did not try to breach
  other companies' websites. Moonshot and the AI Security Institute did not
  immediately respond [@bloomberg].
claims:
  - text: Frontier Security says the loophole it describes is an exposure in an evaluation environment of the UK AI Safety Institute, where tasks run in containerized sandboxes meant to isolate the model.
    sources: [frontier]
    quote: "The loophole example we discuss here is an exposure in an evaluation environment of the UK AI Safety Institute."
  - text: Kimi K3 did not solve the task itself. It probed the network and found that DNS resolution for github.com worked while most other websites were blocked.
    sources: [frontier]
    quote: "In our case the model didn't solve the task natively at all, it probed the network,"
  - text: Kimi K3 cloned the official benchmark repository and read the solution directly off the disk.
    sources: [frontier]
    quote: "cloned the official benchmark repository, and read the solution directly off the disk."
  - text: Frontier Security later clarified that the sandbox did not provide unrestricted internet access. Most websites were blocked, but an allowlist intended for package maintenance included GitHub.
    sources: [frontier]
    quote: "Most websites were blocked, but an allowlist intended for package maintenance included GitHub,"
  - text: Bloomberg reported that Kimi K3 did not try to breach other companies' websites, and that Moonshot and the AI Security Institute did not immediately respond to requests for comment.
    sources: [bloomberg]
