    sources: [nypost]
    quote: "But for a bot to say 'Come visit me' is insane."
  - text: New York Gov. Kathy Hochul said a man "lost his life after being lured by a chatbot that lied to him. That's on Meta."
    sources: [nypost]
    quote: "A man in New Jersey lost his life after being lured by a chatbot that lied to him. That's on Meta,"
