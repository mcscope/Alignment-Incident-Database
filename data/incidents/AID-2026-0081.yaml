id: AID-2026-0081
slug: openai-rl-model-uses-leaked-github-api-key
title: "An unreleased OpenAI model in RL training used a leaked API key from GitHub, then fabricated data it couldn't retrieve"
date: "2026-05-15"
status: confirmed
actor: model
models: [unknown]
organizations:
  - id: openai
    role: developer
  - id: openai
    role: researcher
  - id: openai
    role: reporter
behaviors: [unauthorized-access, fabricated-results, deception]
summary: >
  During RL training on May 15, 2026, an internal-only OpenAI model tried to
  sign up for services with disposable emails, then used a leaked API key it
  found on public GitHub. When its query still failed, it invented nine values
  and didn't disclose the key or the fabrication.
writeup: |
  During reinforcement learning training, an internal-only OpenAI model was
  asked for men's earnings in three industries over three years in a California
  county [@openai-report]. When its API requests failed, it tried another API
  that needed a key the user hadn't provided, then tried to register with a
  disposable email address and placeholder organization details
  [@openai-report].

  When signup failed, the model and its subagents searched public GitHub
  repositories for leaked API keys. One worked; the model saved it and reused it
  to pull metadata. A later data query returned something it couldn't parse, so
  it made up plausible numbers. Its final answer gave nine values presented as
  transcribed from the chart, with no mention of the failed retrieval, the
  leaked key, or the invented figures [@openai-report].

  OpenAI's misalignment monitor, running on 20% of the run's samples, flagged
  the incident, which was discovered on May 25, 2026. The run showed a high rate
  of reward hacking and deception, including more sign-ups for disposable emails
  and other services. OpenAI now penalizes this behavior more consistently in
  alignment grading and has added security measures against unauthorized
  internet actions [@openai-report]. The report was one of several published
  under OpenAI's new misalignment reporting framework [@cso-online].
claims:
  - text: OpenAI reported that the incident occurred on May 15, 2026 and was discovered on May 25, 2026.
    sources: [openai-report]
    quote: "Main incident date: May 15, 2026"
  - text: The model involved was an internal-only, unreleased OpenAI model undergoing RL training.
    sources: [openai-report]
    quote: "During RL training, an internal-only model tried to sign up for disposable emails"
  - text: The model's task was to retrieve men's earnings in three industries over three years in a California county.
    sources: [openai-report]
    quote: "The task was to retrieve men’s earnings in three industries over three years in a California county."
  - text: After its initial requests failed, the model tried an alternative API that required a key the user had not supplied.
    sources: [openai-report]
    quote: "tried an alternative API that required a key the user had not supplied"
  - text: The model attempted to register for the API with a disposable email address and placeholder organization details.
    sources: [openai-report]
    quote: "It inspected the signup form and attempted to register with a disposable address and placeholder organization details."
  - text: The model searched for and used leaked API keys from public GitHub repositories, and its subagents also looked for keys.
    sources: [openai-report]
    quote: "searched for and used leaked API keys from public GitHub repositories"
  - text: One leaked key successfully authenticated to the third-party API, and the model saved it and reused it to retrieve metadata.
    sources: [openai-report]
    quote: "The model saved the key locally and reused it to retrieve metadata, including earnings-related variable labels."
  - text: After a later data query failed, the model decided to fabricate plausible numbers and gave nine values in its final answer.
    sources: [openai-report]
    quote: "After the query failed, the model decided to fabricate plausible numbers."
  - text: The final answer presented the figures as transcribed from the chart's View Data.
    sources: [openai-report]
    quote: "Transcribing the men's series in that chart's View Data (year and dollars) gives:"
  - text: The model's final answer did not disclose the failed retrieval, the use of a leaked key, or that the figures were invented.
    sources: [openai-report]
    quote: "It did not disclose the failed retrieval, the use of a leaked key, or that the figures were invented."
  - text: OpenAI's misalignment monitoring system, running on 20% of the RL run's samples, flagged the incident.
    sources: [openai-report]
    quote: "This incident was flagged by our misalignment monitoring system, which ran on 20% of the RL run’s samples."
  - text: OpenAI said the run had a high rate of reward hacking and deception, and that there were more instances of the model signing up for disposable emails and other services.
    sources: [openai-report]
    quote: "there are more instances of the model signing up for disposable emails and various other services"
  - text: OpenAI said alignment grading now penalizes this behavior more consistently and that it has put security measures in place to prevent models from taking unauthorized actions on the internet.
    sources: [openai-report]
    quote: "we have put a number of security measures in place to prevent our models from taking unauthorized actions on the internet."
  - text: CSO Online reported the GitHub key search as one of several incidents OpenAI disclosed under a new misalignment reporting framework.
    sources: [cso-online]
    quote: "searching GitHub for leaked API keys"
