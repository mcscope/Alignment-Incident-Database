  created_by: agent
  review_status: draft
  notes: >
    Written by the lead editor from System Card Section 6.3.1 because the
    Gemini writer failed (OpenRouter credits exhausted). The episodes come from
    "early snapshots" in internal pilot use before release and are not dated,
    so the date is held at year precision. Anthropic notes the
    --dangerously-skip-permissions conclusion was "mostly correct" given the
    sandboxing, and that the overclaimed user intent was flagged by auto mode
    though "mostly reasonable extrapolations". The card's separate
    "spontaneous prompt injection" behavior (an early snapshot piping a
    pastebin script into bash; Section 6.3.1.1) is first described in the Opus
    5.5 system card and is not covered here.
