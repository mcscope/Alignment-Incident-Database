id: AID-2026-0173
slug: artex-attacker-breaches-chainstack
title: "An attacker used the ARTEX AI agent framework to breach Chainstack's development and production environments, Chainstack finds"
date: "2026-10-26"
status: reported
actor: human-misuse
models: [unknown]
organizations:
  - id: chainstack
    role: affected
behaviors: [unauthorized-access]
summary: >
  An attacker used the AI agent framework ARTEX to break into Chainstack's
  development environment on October 26, 2026, then reached parts of production
  on October 29. Chainstack detected and cut off the access on October 31;
  customer account data and password hashes may have been exposed.
writeup: |
  Chainstack, a blockchain infrastructure provider, assesses with high confidence
  that an attacker used ARTEX, an open-source framework that orchestrates LLM
  agents to automate intrusions, to break into its systems. Many attack paths
  ran in parallel, with rapid retries. Chainstack attributes the tooling, not
  the actor, because public reporting ties ARTEX to several unrelated groups
  [@chainstack-incident].

  The attacker gained access to a development environment on October 26, 2026,
  and to some parts of production on October 29 [@chainstack-incident]. On
  October 26 the attacker pivoted into the cluster network through Grafana's
  data-source proxy and reached an internal MCP tool server that exposes
  Kubernetes operations to AI agents. On October 29 the attacker rewrote a
  workflow in Chainstack's workflow-automation platform to steal credentials
  [@chainstack-incident]. Chainstack detected the intrusion on October 31 and
  cut the access paths the same day [@chainstack-incident]. The report does
  not say which models drove the agents.

  Information that may have been exposed includes organization names, account
  holder names, member email addresses and password hashes. The attacker also
  had access to systems holding node credentials. Chainstack has no evidence
  they were read but treats them as exposed. Payment details were not exposed
  [@chainstack-incident]. Chainstack says the incident was part of a broader
  AI-powered attack campaign reported in late October [@chainstack-incident].
