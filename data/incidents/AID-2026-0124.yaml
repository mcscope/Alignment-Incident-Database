id: AID-2026-0124
slug: korean-group-generative-ai-hacking-90-companies-extortion
title: "A Korean group used generative AI and an autonomous pentest system to hack about 90 organizations and steal 8.2 million records, police say"
date: "2025-09"
status: reported
actor: human-misuse
models: [unknown]
organizations:
  - id: seoul-metropolitan-police-agency
    role: reporter
behaviors: [unauthorized-access]
summary: >
  A seven-person group led by a self-taught hacker used generative AI and an
  AI autonomous penetration test system to scale up attacks on about 90 South
  Korean companies and institutions, stealing about 8.2 million records and
  demanding 360 million won in ransom. Seoul police arrested the seven and
  sent the ringleader to prosecutors.
writeup: |
  Between September 2025 and October 2026, a group hacked about 90 South Korean
  companies and institutions, including academies, hospitals, golf courses,
  universities, funeral companies, and an affiliate of a large conglomerate. It
  stole about 8.2 million records of personal and internal data [@hankook;
  @dailysecu]. Daily Secu notes the figure may include duplicates [@dailysecu].
  The group emailed victims data samples and demanded a total of 360 million
  won from 38 companies. One company paid 300,000 won [@hankook; @asiae].

  The ringleader, a 32-year-old with no IT degree, taught himself hacking
  [@hankook; @asiae]. He first ran an automated web vulnerability scanner by
  hand. From late August 2026 he used generative AI and an AI autonomous
  penetration test system, which let him hit roughly one company a day
  [@asiae; @fnnews]. Police estimate about 60 of the roughly 90 victims were
  hacked with AI-assisted attacks [@fnnews]. Daily Secu identifies the
  autonomous tool as ARTEX, the agentic pentesting framework used against
  Korean banks weeks earlier; other outlets describe it only as similar to the
  system tied to that breach [@dailysecu; @asiae]. No source names the AI
  models used or says how autonomously the AI acted.

  Seoul Metropolitan Police Agency's cyber investigation unit arrested seven
  people. The ringleader was referred to prosecutors with a detention request
  on charges of violating the Information and Communications Network Act and
  extortion [@hankook; @dailysecu]. Police say the case shows that an
  individual, not a hacker group, can carry out large-scale hacking with AI's
  help [@asiae; @fnnews]. The charges are not yet adjudicated.
claims:
  - text: Seoul Metropolitan Police Agency's cyber investigation unit arrested seven people, including ringleader "A" (32), over hacking about 90 South Korean companies and institutions between September 2025 and October 2026.
    sources: [hankook, asiae, fnnews, dailysecu]
  - text: The targets included academies, hospitals, golf courses, universities, funeral companies, and an affiliate of a large conglomerate.
    sources: [hankook, dailysecu, asiae]
  - text: The group stole about 8.2 million records of personal and internal data. Daily Secu notes it is unresolved whether the figure removes duplicates.
    sources: [hankook, dailysecu]
  - text: After breaching systems, the group emailed victims data samples and threatened to publish the data unless paid.
    sources: [hankook, dailysecu, fnnews]
  - text: The group demanded about 360 million won in total from 38 companies. One company paid 300,000 won, and police suspect other victims paid without reporting.
    sources: [hankook, asiae, fnnews, dailysecu]
  - text: The ringleader, 32, has no IT degree and taught himself hacking from online sources; he worked in penetration testing at a security firm from 2019 to 2022.
    sources: [hankook, asiae, dailysecu]
  - text: The ringleader first ran an automated vulnerability scanner, then moved to generative AI and autonomous intrusion tools, which widened his targets.
    sources: [hankook, fnnews]
  - text: From late August 2026 he used generative AI, attacking at a pace of about one company per day.
    sources: [asiae, dailysecu]
  - text: Police estimate about 60 of the roughly 90 victims were hacked through AI-assisted attacks.
    sources: [fnnews]
  - text: Daily Secu reports about 60 organizations were hacked in 44 days.
    sources: [dailysecu]
  - text: The group used an AI autonomous penetration test system similar to one tied to a recent financial-sector data breach.
    sources: [sbs, asiae]
  - text: Daily Secu reports that the AI autonomous penetration testing tool used was ARTEX. Other outlets do not name the tool.
    sources: [dailysecu]
  - text: Charges are violations of the Information and Communications Network Act and extortion or attempted extortion; the ringleader was sent to prosecutors, with a detention request.
    sources: [hankook, fnnews, dailysecu]
  - text: Police began investigating after a victim's complaint in June and merged cases in August after similar reports; about 900,000 records from 15 reporting companies have been named so far and police plan to pursue about 75 more companies that have not reported.
    sources: [hankook, asiae, fnnews]
  - text: Police said the case shows that an individual, not a hacker group, can carry out large-scale hacking with AI's help, and called it the first domestic arrest in a large-scale hacking case using generative AI.
    sources: [hankook, asiae, fnnews, sbs]
  - text: Decrypt reported that emails to 38 victims demanded a combined 360 million won, that the only confirmed payment was 300,000 won, and that 15 organizations had reported damage so far.
    sources: [decrypt]
    quote: the only confirmed payment was 300,000 won
  - text: Decrypt reported that police say the ringleader breached 60 companies in 44 days, from August 31 to October 13, and that the case opened in June after one victim filed a complaint.
    sources: [decrypt]
    quote: Police say he then breached 60 companies in 44 days, from August 31 to October 13.
