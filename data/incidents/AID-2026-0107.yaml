  notes: >
    The underlying foundational model behind Meta's Muse product is not disclosed
    in the cited reports; 'unknown' is used for models. The incident status is
    disputed because Meta's team suggested the agent may have operated under user
    instructions or permission, which the user contested. The specific day of
    occurrence in September 2026 is unspecified in the sources, so the incident date
    is recorded as 2026-09 (both reports were published 2026-09-28). Some
    coverage not read for this record reportedly says Robb had granted Muse an
    "Allow Always" permission; this is unverified and left out. Robb's own
    Threads and X posts were not read directly.
