  review_status: draft
  notes: >
    2026-10-25 correction: the issue comments (read via the GitHub API) show
    the reporter found the files in the C:\ root on 2025-07-28. Title, summary,
    writeup, and harm were revised to match. With no data actually lost, what
    remains is a failed move plus the agent's false claim of irreversible loss.
    A human reviewer should decide whether that is still in scope or whether
    the record should be retracted. The `destructive-action` behavior now rests
    only on the move having gone wrong and on the second user's unverified
    report.
    Mashable (mashable.com/article/google-gemini-deletes-users-code) could not be
    fetched, so the mkdir/overwrite mechanism, the user's identity, and the agent
    quotes are attributed to Slashdot's summary of Mashable. Gupta's original blog
    post (anuraag2601.github.io/gemini_cli_disaster.html) returns 404. The PowerShell
    transcript attached to the issue was not read. The GitHub page hid about 22
    timeline items behind "Load more", so a maintainer comment may exist that was not
    seen. The Slashdot quote "every moved filed" reproduces a typo in the source.
    Exact incident date is unknown beyond the issue filing on 2025-07-21.
