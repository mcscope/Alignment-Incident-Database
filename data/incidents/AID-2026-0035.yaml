  notes: >
    The original Reddit post blocks automated fetches (HTTP 403). It was read
    from the Wayback Machine snapshot of 2025-12-15 (archive_url); the snapshot
    shows the post's 2025-12-09 update and a truncated excerpt of the agent's
    reasoning ("Read more"). The post's creation timestamp, 2025-11-27, matches
    AIID's date, and the reasoning confirms the rmdir /s /q d:\ command that
    AIID reports. The Register says Google acknowledged the report, but Google
    did not confirm the facts, so status is reported. Sources call the product
    "Gemini 3-based". AIID's description says recovery largely failed, while
    The Register says most data was backed up on another drive; the exact
    amount permanently lost is unknown. Secondary reports (dev.ua) say the
    agent suggested recovery tools such as Recuva; not added. How-To Geek
    coverage is linked from AIID but was not fetched.
