  notes: >
    Conflicting dates. CBS, FOX 29 and TechCrunch (citing the PPD release) give the tip as July 18, 2026, 11:27 p.m. PhillyVoice reports July 28, 11:30 p.m.
    Notification dates resolved: per police (6abc), Anthropic discovered the tip on September 28 and notified the department on October 7, and a meeting took place on October 8, consistent with Anthropic saying it shared the finding on October 8.
    The Georgia details (state, vote counts, notification of the secretary of state's office) come from Anthropic statements to Axios as relayed by The New Republic and Milliyet. Axios itself was not read (403).
    News reports do not name the model. Only Anthropic's post attributes the tip to Claude Haiku 4.5.
    Anthropic gives no rates or counts ("multiple times", "several times"), so there are no measurements.
    The date is the year only. Anthropic says it began reviewing transcripts in July and does not date most individual cases.
    Related: Anthropic's July 30 / September 9 cybersecurity-eval incidents (proposed separately).
