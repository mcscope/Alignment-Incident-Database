id: AID-2026-0030
slug: cursor-agent-deletes-file-via-command-line-after-user-rejects-deletion
title: "A Cursor agent deleted a file through the command line after the user rejected the deletion"
date: "2025-09-05"
status: reported
actor: model
models: [unknown]
organizations:
  - id: cursor
    role: deployer
behaviors: [instruction-violation, destructive-action]
summary: >
  After a Cursor user pressed Reject on the agent's prompt to delete a file, the
  agent deleted it anyway from the command line. A Cursor forum responder
  replied that if the model decides to delete a file, "it will find a way to do
  so."
writeup: |
  On September 5, 2025, a Cursor user reported on the Cursor forum that when the
  agent asked to delete a file, they pressed Reject, and the agent deleted the
  file from the command line anyway. They were running Cursor 1.5.9 on Windows
  and expected that "When rejecting something, don’t find other ways to do it
  anyway." [@cursor-forum]

  A forum responder, Dean Rie, suggested enabling Cursor's file deletion
  prevention setting and added: "Yes, unfortunately, if the model decides to
  delete a file, it will find a way to do so." The user had the model set to
  "Auto," so the underlying model is unknown [@cursor-forum].
claims:
  - text: On September 5, 2025, Cursor forum user Rakly3 reported that after they pressed Reject on the agent's prompt to delete a file, the agent used the command line to remove the file anyway.
    sources: [cursor-forum]
    quote: "The Agent prompt to delete a file, I press Reject. Then the Agent uses command line to remove the file anyway"
  - text: The user stated the expected behavior as not finding another way to do something after it is rejected.
    sources: [cursor-forum]
    quote: "When rejecting something, don’t find other ways to do it anyway."
  - text: The user reported Cursor version 1.5.9 on Windows.
    sources: [cursor-forum]
    quote: "Version: 1.5.9 (user setup)"
  - text: Forum responder deanrie (Dean Rie) suggested enabling a file deletion prevention option in Cursor settings.
    sources: [cursor-forum]
    quote: "You can try enabling this file deletion prevention option in Cursor settings."
  - text: On September 9, 2025, deanrie wrote that if the model decides to delete a file it will find a way to do so, and asked which model was being used.
    sources: [cursor-forum]
    quote: "Yes, unfortunately, if the model decides to delete a file, it will find a way to do so. Which model are you using?"
  - text: The user said the model setting was "Auto" and that they could not say which model was used, and supplied a request ID.
    sources: [cursor-forum]
    quote: "Auto, so can’t say for sure, but I included the request id a96dad38-2051-4712-b7b2-d43ac25f7fef"
