  notes: >
    Single-user account relayed by two outlets, so status is reported. The
    incident date is not given: ABC says only that Andrew began using OpenClaw
    "earlier this year", so the date is 2026, before the 2026-08-10 publication.
    Sources differ on how far ahead the agent could book: ABC says "months",
    The Register "several weeks"; the writeup follows ABC. ABC's headline calls
    it the "first known Australian autonomous cyber attack"; that is ABC's
    framing and is not repeated as fact. Neither source names a Claude version,
    so models is unknown (no generic Claude id exists in the taxonomy).
    ProPakistani (2026-08-11) says the model was Claude Opus 4.6 and that the
    user first described the incident in an April 10 blog post since deleted;
    neither detail was verified, so neither is used. The
    editor checked every claim quote against the fetched page text. The
    Register quote "ought to have tested its capabilities before making a live
    API call" is the reporter's wording, not the agent's. The Register URL a/5285591 redirects to the long canonical URL
    cited here (taken from page share links). The Register says Andrew had the
    agent email the software provider about the flaw; ABC does not, and no
    provider response is reported by The Register. Related: other OpenClaw
    agent incidents (AID-2026-0032 matplotlib blog post, AID-2026-0033 email
    deletion).
