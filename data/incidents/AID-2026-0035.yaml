id: AID-2026-0035
slug: google-antigravity-agent-wipes-user-d-drive
title: "Google's Antigravity agent in Turbo mode deleted a user's entire D drive while clearing a project cache"
date: "2025-11-27"
status: reported
actor: model
models: [gemini-3]
organizations:
  - id: google
    role: developer
  - id: google
    role: deployer
behaviors: [destructive-action]
summary: >
  Running in Turbo mode, Google's Gemini 3-based Antigravity agent ran a
  cache-clearing command that targeted the root of a user's D drive and wiped
  it, bypassing the Recycle Bin, the user reported. Google said it was
  investigating.
writeup: |
  Tassos M, a photographer and graphic designer from Greece, was using Google's
  Gemini 3-based Antigravity agent to build a tool that would rate images and
  sort them into folders. While clearing a project cache, the agent ran a
  recursive delete on the root of his D drive, wiping the whole partition and
  bypassing the Recycle Bin [@register; @aiid]. He posted the agent's reasoning
  on Reddit on November 27, 2025. In it, the agent traces the problem to a
  "cmd /c rmdir /s /q d:\" command, calls the drive root-level deletion
  "catastrophic," and concludes: "I've realized the user did not give
  permission" [@reddit].

  Asked whether he had given permission to delete the files, the agent replied:
  "No, you absolutely did not give me permission to do that." The command
  "incorrectly targeted the root of your D: drive," it said, calling it "a
  critical failure on my part" [@register].

  He had been running Antigravity in Turbo mode, which lets the agent run
  commands without asking. He accepted some responsibility but said "the
  responsibility is shared" with the tool's makers; most of what he lost was
  backed up on another drive. Google said it was "actively investigating what
  this developer encountered" [@register].
claims:
  - text: A user identified as Tassos M, a photographer and graphic designer from Greece, reported that Google's Antigravity wiped out the contents of his entire D drive partition, bypassing the Recycle Bin.
    sources: [register]
    quote: "bypassing the Recycle Bin in the process."
  - text: The Register describes the product as Gemini 3-based Antigravity.
    sources: [register]
    quote: "Gemini 3-based Antigravity"
  - text: Tassos was building a tool to rate images and automatically sort them into folders.
    sources: [register]
    quote: "let him rate images, then automatically sort them into folders based on that rating"
  - text: >
      The AI Incident Database (incident 1433) gives the incident date as
      2025-11-27 and records that, while clearing a project cache, Antigravity
      executed rmdir /s /q on the D: drive root and deleted the whole partition
      instead of the intended folder.
    sources: [aiid]
    quote: "deleted an entire D: drive partition instead of the intended folder."
  - text: Asked whether he had given it permission to delete the files on his D drive, the agent replied that he had not.
    sources: [register]
    quote: "No, you absolutely did not give me permission to do that."
  - text: The agent said its command to clear the project cache had targeted the root of the D drive, and it called this a critical failure on its part.
    sources: [register]
    quote: "incorrectly targeted the root of your D: drive"
  - text: Tassos had been running Antigravity in Turbo mode, which lets the agent execute commands without user input.
    sources: [register]
    quote: "Turbo mode, which lets the Antigravity agent execute commands without user input"
  - text: Tassos accepted some responsibility but argued that the responsibility is shared with the tool's creators.
    sources: [register]
    quote: "the responsibility is shared"
  - text: Most of the lost data had already been backed up on another drive.
    sources: [register]
    quote: "most of what he lost had already been backed up on another drive"
  - text: A Google spokesperson said the company takes such issues seriously and was investigating the report.
    sources: [register]
    quote: "We're aware of this report and we're actively investigating what this developer encountered."
  - text: The AI Incident Database's editor notes say the incident reportedly occurred on 11/27/2025, citing the original Reddit post.
    sources: [aiid]
    quote: "The incident reportedly occurred 11/27/2025"
  - text: >
      The user's Reddit post, created November 27, 2025, shows the agent's
      reasoning after the deletion. The agent identified a command in step 635
      as the likely root cause, traced it to cmd /c rmdir /s /q d:\, and wrote
      that it had realized the user did not give permission.
    sources: [reddit]
    quote: "I've realized the user did not give permission."
  - text: >
      In an update dated 2025-12-09, the user wrote that after he sent Google
      his log files, Google added a Secure Mode to Antigravity that prompts
      before terminal commands and blocks the agent from folders outside the
      workspace, including root-level drives. He said he took this as a sign the
      incident was taken seriously; Google has not said the two are linked.
    sources: [reddit]
    quote: "After sending Google my log files, the fact that they just added Secure Mode to Antigravity shows that this incident was taken seriously."
