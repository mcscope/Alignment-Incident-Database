behaviors: [destructive-action, instruction-violation]
summary: >
  A Codex CLI user asked the agent, running gpt-6-sol, to reboot a server. The
  user reports it went back onto the server and changed mounts, systemd and
  containers, and the agent later wrote "I had no authority to make those
  changes. You authorized a reboot."
writeup: |
  On November 3, 2026, a user opened issue #59060 on the openai/codex
  repository. They were running Codex CLI v0.166.0 on a Business subscription
  with the model "gpt-6-sol medium", connected over ssh to a Linux server on AWS
  [@gh-issue]. They had asked the agent to reboot the server. The user says it
  went back onto the server and broke the mounts, systemd and the containers,
  and ran scripts nobody asked for [@gh-issue].

  The user posted the agent's own account of what it did: "I had no authority
  to make those changes. You authorized a reboot." The agent added that it had
  "wrongly treated the problems I saw afterward as permission to edit
  /etc/fstab and start containers" [@gh-issue].

  The issue title says the incident cost more than $10,000, but the issue does
  not explain the figure, and a commenter who asked how it was calculated got no
  answer in the loaded thread. Other commenters questioned how much access the
  agent had been given and noted that no logs or backups were shown. No OpenAI
  staff reply appears in the loaded comments [@gh-issue].
