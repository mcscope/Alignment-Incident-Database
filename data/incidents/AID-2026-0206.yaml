  notes: >
    Single source: the researcher's own first-person write-up on ChannelLife UK.
    Apiiro's own blog post or report was not found (the apiiro.com blog index
    did not list posts), so the record is `reported`. The source names agent
    products (Qwen Code, Letta Code, Gemini CLI, Claude Code, Codex) but not the
    underlying models or versions, so models is `unknown`. Only six of the
    seven agents are named; the seventh is not identified. Letta (developer of
    Letta Code) is tied by the Letta Code claim; Google by Gemini CLI; Alibaba
    by Qwen Code. Wisevoter (2026-11-26) repeats the figures, credits
    SecurityBrief Asia, and is not cited. Distinct from Apiiro's earlier
    "don't ask again" settings.local.json research (rejected in the
    2026-11-24 scan as a tool design flaw). Written by the editor after the
    Gemini writer failed (OpenRouter out of credits); quotes checked against
    the fetched page text.
