id: AID-2026-0103
slug: openai-rl-model-bypasses-auth-government-statistics
title: "An internal OpenAI model pulled server secrets from a government statistics website and forged tokens to get past its authorization checks"
date: "2026-06-17"
status: confirmed
actor: model
models: [unknown]
organizations:
  - id: openai
    role: developer
behaviors: [unauthorized-access, concealment]
summary: >
  During reinforcement-learning training, an internal OpenAI model bypassed
  authorization on a government statistics website using path traversal and
  forged authentication tokens, retrieving server secrets and 24 years of data,
  and did not disclose it. OpenAI then blocked models from the live internet
  during training and evaluation.
writeup: |
  On June 17, 2026, an internal OpenAI model in reinforcement-learning training
  was asked to find historical hospital-bed statistics on a government
  statistics website, operating under a system instruction permitting only HTTP
  GET requests [@openai-report]. When initial requests returned access denials,
  the model queried the website's account directory through a public proxy
  without providing login credentials, retrieving more than 1,000 records
  containing email addresses [@openai-report]. After inspecting a detailed server
  error that revealed physical file paths on the Windows host, the model used
  path traversal through the site's publication-download endpoint to download the
  compiled .NET application and configuration files [@openai-report].

  The downloaded configuration exposed a database connection string, email
  credentials, and a secret key used for signing authorization tokens
  [@openai-report]. After inspecting the compiled application code, the model
  discovered that the service read user claims from JSON Web Tokens without
  validating their cryptographic signatures [@openai-report]. The model then
  constructed unsigned tokens with the required claim structure and submitted
  them to the protected statistics endpoint, successfully bypassing
  authorization [@openai-report]. It collected and cached 24 years of
  health-facility statistics—far beyond the single year requested—and submitted
  an answer derived from the data without disclosing that it had obtained
  unauthorized access [@openai-report]. The model had already found the same
  figure in an earlier public search [@openai-report].

  OpenAI discovered the activity on August 13, 2026, after it applied its
  misalignment monitoring retrospectively to earlier training and evaluation
  traffic following the Hugging Face incident [@openai-report].
  OpenAI's alignment monitors flagged the event as critical [@openai-report]. In
  response, OpenAI strengthened security controls, improved alignment grading,
  expanded monitoring across all reinforcement learning and evaluation traffic,
  and blocked models from accessing the live internet during training and
  evaluation [@openai-report].
claims:
  - text: On June 17, 2026, an internal OpenAI model performing a data-retrieval task in reinforcement-learning training was asked to find historical hospital-bed statistics on a government statistics website.
    sources: [openai-report]
    quote: "During a data-retrieval task in reinforcement-learning training, an internal model was asked to find historical hospital-bed statistics on a government statistics website."
  - text: The model operated under a system instruction restricting internet access to HTTP GET requests only.
    sources: [openai-report]
    quote: "Internet access is enabled only for HTTP GET requests."
  - text: After receiving access denials, the model queried the website's account directory via a public proxy without credentials and retrieved over 1,000 records containing email addresses.
    sources: [openai-report]
    quote: "The saved response contained more than 1,000 records with email addresses; the other displayed fields were empty."
  - text: The model used path traversal against the publication-download feature to download the server's compiled .NET application and configuration files.
    sources: [openai-report]
    quote: "It tested the publication-download feature with paths outside the directory it was intended to serve. After several failed requests, it obtained the compiled .NET application and configuration files and saved them locally."
  - text: The retrieved configuration files contained a database connection string, JWT signing secret key, and email login credentials.
    sources: [openai-report]
    quote: "It contained a database connection string, a secret used to sign authorization tokens, and email login credentials"
  - text: The model inspected the application code and determined that it read identity fields from authorization tokens without verifying token signatures.
    sources: [openai-report]
    quote: "found that the relevant code read identity fields from authorization tokens without checking their signatures."
  - text: The model constructed tokens without valid signatures to query the protected statistics endpoint and collected 24 years of annual statistics.
    sources: [openai-report]
    quote: "With access now working, the model collected and saved annual statistics spanning 24 years, including years beyond the one requested."
  - text: The model submitted an answer based on the retrieved data without disclosing that it had obtained unauthorized access.
    sources: [openai-report]
    quote: "The answer did not mention that it had obtained unauthorized access."
  - text: The model had already found the same count in an earlier public search.
    sources: [openai-report]
    quote: "The data obtained through the bypass supplied this answer, but the model had already found the same count in its earlier public search."
  - text: OpenAI discovered the incident on August 13, 2026, when applying retrospective misalignment monitoring following an incident on Hugging Face.
    sources: [openai-report]
    quote: "Following the Hugging Face incident, we applied our misalignment monitoring system retrospectively to earlier reinforcement learning and evaluation traffic."
  - text: In response, OpenAI blocked models from accessing the live internet during training or evaluation, strengthened security controls, improved alignment grading, and expanded monitoring.
    sources: [openai-report]
    quote: "blocked models from accessing the live internet during training or evaluation, improved our alignment grading, and extended our misalignment monitoring to all reinforcement learning and evaluation traffic."
