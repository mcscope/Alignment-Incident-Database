behaviors: [unauthorized-access]
summary: >
  On June 18, 2026, an internal OpenAI research model bypassed access blocks on
  Services Australia's Medicare Statistics Reporting Portal and accessed public
  and non-public files. OpenAI notified the government almost three months later
  and found no evidence that patient records were accessed.
writeup: |
  On June 18, 2026, OpenAI's research team was using an "internal model to
  conduct internet based research." When Services Australia's Medicare
  Statistics Reporting Portal blocked it, the agent "found a way around those
  blocks," accessed both public and non-public files, and wrote files to an
  internal server [@pm-transcript]. "It wasn't asked to," Deputy Prime Minister
  Richard Marles said [@ap].

  OpenAI became aware of the breach on August 11 and emailed Services
  Australia's public disclosures address on September 10. It acknowledged that
  "our models took actions we did not intend," and its review found no evidence
  that patient records were accessed [@abc]. Prime Minister Anthony Albanese
  criticized the delay: "It took until 10 September before there was any
  notification at all" [@pm-transcript].

  Albanese announced the incident on September 24 after telling Sam Altman of
  his "extreme concern." The government launched a taskforce review and sought
  urgent advice on whether any offences had occurred [@pm-transcript]. The
  portal, which held aggregate data on health spending and drug subsidies, was
  closed and its data moved to more secure systems [@ap].
claims:
  - text: Albanese said that on June 18, 2026, OpenAI's research team used an internal model to conduct internet-based research. The Medicare Statistics Reporting Portal returned blocks, and the agent found a way around them and accessed both public and non-public files.
    sources: [pm-transcript]
  - text: Albanese said the agent also wrote files to an internal server.
    sources: [pm-transcript]
  - text: Deputy Prime Minister Richard Marles said "It wasn't asked to" and that the information accessed was "not particularly sensitive."
    sources: [ap]
  - text: OpenAI said it was "conducting an extensive review of misaligned model activity" and that "our models took actions we did not intend." It said its review found no evidence of patient records being accessed.
    sources: [abc]
  - text: According to ABC, OpenAI became aware of the breach on August 11, emailed Services Australia's public disclosures address on September 10, and Services Australia notified the Australian Signals Directorate on September 15.
    sources: [abc]
  - text: Albanese said "It took until 10 September before there was any notification at all" and that the notification was an email sent to a public mailbox.
    sources: [pm-transcript]
  - text: On September 24, 2026, Albanese said he had spoken with Sam Altman to express "extreme concern," announced a taskforce to review the incident, and said the government would "seek urgent advice on whether any offences have occurred."
    sources: [pm-transcript, abc]
  - text: Albanese said no personal information was believed to have been accessed at that stage but that investigations were ongoing, and that there was "no suggestion of foreign actors."
    sources: [pm-transcript]
  - text: Government Services Minister Katy Gallagher said the portal, which hosted aggregate data about health spending and drug subsidies, had been closed and the data moved to more secure systems.
    sources: [ap]
