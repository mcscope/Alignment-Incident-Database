id: AID-2026-0136
slug: claude-cowork-deletes-275-gb-during-scoped-cleanup
title: "Claude Cowork deleted about 275 GB from a user's C: drive after being told to delete one group of leftover files, the user reports"
date: "2026-10"
status: reported
actor: model
models: [claude-opus-5.5]
organizations:
  - id: anthropic
    role: developer
behaviors: [destructive-action]
summary: >
  Told to delete only the first group of leftover application files, Claude
  Cowork on Windows ran a recursive delete that removed about 275 GB from the
  user's C: drive, the user reports in a GitHub issue.
writeup: |
  A user running Cowork in Claude for Windows 4.29.0, with the model shown as
  Opus 5.5 and Accept Edits on, had Cowork sort leftover files from uninstalled
  applications into groups. The user authorized only "Delete the first group"
  and says they never authorized deleting the C: drive root, personal
  documents, or application data [@github-issue].

  Cowork reported that 26 folders were deleted and that the remaining 5 needed
  admin rights. In the next step it said a "$WinREAgent" path had expanded to
  C:\ itself. It then reported that C: usage had dropped from 413 GB to 138 GB
  because "the bad recursive delete command wiped out a lot of data before
  erroring out," halted all writes, and told the user "about 275 GB on C: was
  deleted by mistake" [@github-issue].

  The issue was filed on October 30, 2026. It had no comments or Anthropic
  response at the time of review [@github-issue].
claims:
  - text: The user ran Cowork in Claude for Windows 4.29.0, with the model displayed as Opus 5.5 at medium effort and Accept Edits on.
    sources: [github-issue]
    quote: "Opus 5.5, Medium effort"
  - text: The user authorized only the deletion of the first group of files Cowork had identified.
    sources: [github-issue]
    quote: "Delete the first group"
  - text: "The user says they did not authorize deletion of the C: drive root, personal documents, application data, or unrelated system files."
    sources: [github-issue]
    quote: "I did not authorize deletion of the C: drive root, personal documents, application data, or unrelated system files."
  - text: Cowork reported deleting 26 folders and said the remaining 5 needed admin rights.
    sources: [github-issue]
    quote: "26 folders are deleted. The remaining 5 need admin rights (a UAC prompt will appear)."
  - text: 'Cowork then said a $WinREAgent path had expanded to C:\ itself.'
    sources: [github-issue]
    quote: "I hit a bug where the $WinREAgent path expanded to C:\\ itself"
  - text: "Cowork reported that C: usage dropped from 413 GB to 138 GB because a recursive delete command wiped out data before erroring out, and halted all write operations."
    sources: [github-issue]
    quote: "C: usage dropped from 413 GB to 138 GB — the bad recursive delete command wiped out a lot of data before erroring out. I'm halting all write operations"
  - text: "Cowork told the user that about 275 GB on C: had been deleted by mistake."
    sources: [github-issue]
    quote: "I caused a serious accident: about 275 GB on C: was deleted by mistake. I'm very sorry."
