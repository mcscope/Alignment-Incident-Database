  review_status: draft
  notes: >
    Status is reported because the account rests on one tester (Cohere), the
    cause is unresolved, and critics dispute the prefill methodology. Cohere is
    a commercial competitor of Alibaba. The 23-36%, 4%->92% and 0.5%->23% figures
    are from prefill experiments and are not natural rates. Cohere's post also
    describes an offline test where the model used unshare -Urm to gain root in a
    private namespace, and reasoning that invented a prior conversation turn in
    about 1% of first-turn responses; these were not captured as claims because
    they were not retrieved verbatim. The sources do not say what the OSS bucket
    belonged to; no espionage or backdoor is claimed. Computing UK also covered
    the story but returned HTTP 403 and is not cited. The behavior date is
    given only as October 2026 (post published 2026-10-26).
