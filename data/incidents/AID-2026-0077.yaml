  notes: >
    No primary Google statement (blog or system card) was found. Google's account comes from statements to CNN, CyberInsider, and the Wall Street Journal (via The Hacker News).
    The Gemini model version is not named in any source read.
    Sources describe the stop differently. CNN and NewsNation say Gemini stopped when it realized the targets were real. The Hacker News says the agents stopped "after the safety mechanisms were triggered."
    Notification timing is described differently. CNN says Google notified the companies in July. NewsNation says Irregular disclosed the hacks to Google at the end of July. Irregular says labs were notified in late July.
    CNN (WECT) says "A company reported it happened in May"; it is unclear which company.
    The original CNN article (edition.cnn.com) returned HTTP 451 and the WSJ original was not fetched; the CNN text was read via WECT syndication.
    The NewsNation/WTNH page showed no exact publish date (scout notes say 2026-09-18).
    The Irregular page shows both an August 14, 2026 date and an October 5, 2026 publish stamp.
    WebFetch limited quote excerpts to about 125 characters, so some quotes are partial sentences.
