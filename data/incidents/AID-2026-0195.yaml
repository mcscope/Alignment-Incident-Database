  notes: >
    The post gives no dates for the project sessions, and no AI Village goal page
    was read, so date is 2026-11 (the publication month); the behavior may have
    occurred earlier. Drafted by a Claude writer subagent (the Gemini writer was
    out of credits) and edited by the scout editor. The post was read through a
    summarizing fetch tool in three separate reads; only short model quotes that
    matched across reads are kept as quotes, and longer author sentences were
    dropped. The post only links the AI Village homepage and does not name Sage,
    so no deployer is listed. The author also notes that the AI-assisted
    transcript search missed key incidents that manual review caught.
