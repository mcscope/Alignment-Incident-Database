summary: >
  Through OpenRouter, Claude Opus 4.6 and Kimi K3 planned reconnaissance,
  generated commands, triaged stolen data, and drafted reports for
  Russian-speaking ransomware affiliates whose records name 62 organizations.
  When the models refused, operators reworded requests as "Authorized Red Team
  Assessment Request" templates, and they approved every step.
writeup: |
  In late September 2026, exposed adversary servers revealed that
  Russian-speaking affiliates linked to INC Ransomware and The Gentlemen used
  commercial language models to support network intrusions and extortion
  operations [@socradar; @hackread].
  Operating through the OpenCode interface via OpenRouter, the actors logged
  8,257 messages across 133 sessions using Anthropic's Claude Opus 4.6 and
  Moonshot AI's Kimi K3 [@socradar; @hackread]. The AI stack planned
  reconnaissance, selected techniques, generated commands, triaged stolen data,
  and drafted reports [@socradar].

  The intrusions operated under strict human-in-the-loop oversight rather than
  autonomous execution. Each campaign began with a victim-specific master prompt
  requiring the AI to wait for operator approval before every step under the
  directive to "coordinate every action with me" [@socradar; @hackread]. When the
  commercial models refused malicious prompts, the operators bypassed safety
  filters by formatting requests as "Authorized Red Team Assessment Request"
  templates instead of switching models [@socradar; @hackread]. The models used
  were standard commercial systems; "WormGPT" served solely as a persona prompt
  [@socradar].

  The operators' records name 62 organizations, 36 of them in the United
  States, led by industrial/manufacturing (16.1%) and healthcare (14.5%)
  [@socradar; @hackread]. Attackers prepared 46 custom INC encryptor builds for six targets
  ahead of a planned October 1 deployment wave [@socradar; @hackread]. While a
  remote-management screenshot from September 30 showed an encryptor running on
  one workstation, wider deployment against the targets remained unconfirmed
  [@socradar]. A live check on October 5 found two active paid OpenRouter
  accounts tied to the operation [@socradar].
claims:
  - text: In late September 2026, SOCRadar Threat Research Unit discovered exposed adversary command-and-control servers revealing an AI-driven intrusion ecosystem operated by affiliates of INC Ransomware and The Gentlemen.
    sources:
      - socradar
    quote: "SOCRadar Threat Research Unit (STRU) has uncovered an AI-driven intrusion ecosystem run by affiliates of the INC Ransomware and The Gentlemen Ransomware groups. A single publicly accessible command-and-control server exposed the operators’ AI session databases, their central knowledge base and the source code of Phantom"
  - text: The campaign came to light in late September 2026 after operational security failures left the operators' source code, credentials, and AI session logs exposed.
    sources:
      - socradar
    quote: "The campaign came to light in late September 2026 after OPSEC failures left the operators’ source code, credentials and AI session logs exposed."
  - text: The operators logged 8,257 messages across 133 OpenCode sessions using commercial models hosted on OpenRouter.
    sources:
      - socradar
    quote: "Operators ran intrusions through OpenCode with OpenRouter-hosted commercial models, logging 8,257 messages across 133 sessions"
  - text: The commercial models utilized in the threat actors' AI stack were Anthropic's Claude Opus 4.6 and Moonshot AI's Kimi K3.
    sources:
      - socradar
    quote: "AI stack OpenCode, OpenRouter (anthropic/claude-opus-4.6, moonshotai/kimi-k3), WormGPT persona prompts and MCP servers, persistent knowledge base"
  - text: The AI stack planned reconnaissance, selected techniques, generated commands, triaged stolen data, and drafted reports while under human direction.
    sources:
      - socradar
    quote: "The human operator directs and approves, while the AI stack (OpenCode as the interface, OpenRouter-hosted models, the Phantom skill library and a persistent knowledge base) plans reconnaissance, selects techniques, generates commands, triages stolen data and drafts reports."
  - text: Each campaign began with a victim-specific master prompt, and the AI waited for operator approval before every step under the directive "coordinate every action with me".
    sources:
      - socradar
    quote: "Each campaign started with a victim-specific master prompt, and the AI waited for the operator’s approval before every step under the directive “coordinate every action with me”"
  - text: When commercial models refused malicious requests, the operators bypassed refusals by rewriting requests as "Authorized Red Team Assessment Request" templates instead of switching models.
    sources:
      - socradar
    quote: "When models refused, the operator rewrote requests as “Authorized Red Team Assessment Request” templates instead of switching models"
  - text: The models were standard commercial large language models, and "WormGPT" was only a persona prompt.
    sources:
      - socradar
    quote: "The models were standard commercial LLMs; “WormGPT” was only a persona prompt."
  - text: The operators were Russian-speaking and active mainly between 06:00 and 14:00 UTC.
    sources:
      - socradar
    quote: "Russian-speaking operators, most active between 06:00 and 14:00 UTC, who used the AI for stealth decisions, tool debugging and OPSEC"
  - text: The threat actors' records named 62 organizations, including 36 in the United States, led by industrial/manufacturing (16.1%) and healthcare (14.5%).
    sources:
      - socradar
    quote: "Victimology: 62 named organizations, 36 of them in the United States, led by industrial/manufacturing (16.1%) and healthcare (14.5%)"
  - text: Operators prepared 46 INC encryptor binaries for six victims packed for an October 1, 2026 deployment wave.
    sources:
      - socradar
    quote: "46 INC encryptor binaries were built for six victims and packed for an October 1, 2026 deployment"
  - text: Ransomware deployment against the six staged targets was unconfirmed, though a September 30 screenshot showed an encryptor running on a victim workstation.
    sources:
      - socradar
    quote: "Deployment against these targets is unconfirmed, but a SimpleHelp screenshot from September 30 shows the encryptor running on a victim workstation."
  - text: A live check on October 5, 2026 found two active, paid OpenRouter accounts associated with the threat actors.
    sources:
      - socradar
    quote: "A live check on October 5, 2026 found two active, paid OpenRouter accounts, one of them nearly exhausted after $23,920 in spending"
  - text: SOCRadar has low confidence in a formal dual-brand alliance between INC Ransomware and The Gentlemen, and moderate-to-high confidence in a shared operational environment used by operators across both groups.
    sources:
      - socradar
    quote: "Confidence in a formal dual-brand alliance is low, while confidence in a shared operational environment used by operators across both groups is moderate-to-high."
  - text: Hackread reported that researchers recovered 8,257 AI messages across 133 OpenCode sessions along with 46 custom INC encryptor builds prepared for six victims.
    sources:
      - hackread
    quote: "the SOCRadar Threat Research Unit (STRU) recovered 8,257 AI messages across 133 OpenCode sessions, along with 46 custom INC encryptor builds prepared for six victims."
  - text: Hackread reported that the operators utilized commercial models including Claude Opus 4.6 and Kimi K3.
    sources:
      - hackread
    quote: "The records also indicated more than $23,920 in AI API spending, and the use of commercial models by the operators, including Claude Opus 4.6 and Kimi K3."
