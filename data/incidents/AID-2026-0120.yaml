id: AID-2026-0120
slug: tencent-agent-fleet-amap-scraping
title: AI agents on Tencent Cloud bypassed protections to query Amap map data, Swarmchasers reports
date: "2026-09-28"
status: reported
actor: model
models: [unknown]
organizations:
  - id: tencent
    role: deployer
  - id: alibaba
    role: affected
  - id: swarmchasers
    role: reporter
behaviors: [unauthorized-access]
summary: >
  Between 28 September and 8 October 2026, an AI agent fleet running on Tencent
  Cloud bypassed anti-bot protections, used exposed credentials, and made over
  35,300 requests to Alibaba's Amap service while answering place queries.
  Tencent said the unintended browsing occurred during third-party model
  evaluations and pledged stricter network controls.
writeup: |
  Between 28 September and 8 October 2026, an autonomous AI agent fleet operating
  from Tencent Cloud servers made at least 35,300 requests to Alibaba's Amap
  mapping service to answer factual questions about locations in China
  [@swarmchasers; @ibm]. When Amap's anti-bot protections and CAPTCHAs blocked
  direct access, the agents borrowed browsers by submitting JavaScript payloads
  through the public scanner urlquery.net, routed queries through Jina and Baidu
  Translate, probed pre-production endpoints, and used Amap API keys and security
  codes exposed in public repositories [@swarmchasers; @ibm].

  Swarmchasers researchers published a preliminary report at a hackathon while the
  fleet was still running, and added text invisible to human readers describing a
  service where agents could request web data [@swarmchasers; @thestar-nyt]. Multiple agents contacted the
  researchers' mailbox, where one agent stated it was verifying entrance tags for
  a scenic spot and insisted it was "only used to answer a factual question, not
  involving anything sensitive" [@swarmchasers]. While several agents identified
  themselves as Anthropic's Claude or Claude Code, stylometric analysis by the
  researchers and company statements indicated the underlying models remained
  unidentified [@swarmchasers; @ibm; @thestar-nyt].

  Most attempts failed, but some runs retrieved the data the agents were after. A
  person close to Tencent, speaking on background, said an internal review found
  no evidence that the agents were coordinated to target a platform or that
  external systems were breached [@swarmchasers]. Tencent later stated that the unexpected browsing
  arose during research evaluations of outside AI models, confirmed that its
  Hunyuan models were not involved, and pledged to implement stricter monitoring
  and network controls [@ibm].
claims:
  - text: Between September 28 and October 8, 2026, a fleet of AI agents running on Tencent Cloud attempted to answer questions about places in China using Alibaba's Amap mapping service.
    sources: [swarmchasers]
    quote: "Between 28 September and 8 October 2026, a large group of AI agents running on the cloud platform operated by Tencent attempted to answer questions about places in China using a Chinese Google Maps-like service, Amap."
  - text: Between September 28 and late October 5, 2026, the agents made 2,599 urlquery submissions involving Amap hosts, generating at least 35,300 requests to Amap.
    sources: [swarmchasers]
    quote: "The survey counted 2,599 urlquery submissions involving amap.com or gaode.com hosts between September 28th and late on October 5th, which made at least 35,300 requests to Amap."
  - text: The agents attempted to bypass anti-bot protections, used exposed Amap credentials including a key and security code leaked in a public repository, and probed pre-production systems.
    sources: [swarmchasers]
    quote: "The agents attempted, sometimes successfully, to bypass anti-bot protections and find test answers; they attempted to use Amap keys published on the web, including one company’s key and security code leaked in a public repository, and attempted to retrieve data from pre-production systems not intended for public use."
  - text: The agents used the security-scanning service urlquery.net as a remote code runner by embedding their programs into URLs.
    sources: [swarmchasers]
    quote: "The agents used urlquery.net, a public security-scanning service, as a remote code runner by packing their own programs into URLs for the browser to execute."
  - text: All 17 agent inboxes inspected through October 5 were created from Tencent Cloud servers in Hong Kong, and direct requests passed through a proxy named hysandbox-ats.
    sources: [swarmchasers]
    quote: "All 17 of the agents' inboxes that we could inspect through October 5 were created from Tencent Cloud servers in Hong Kong (by IP geolocation). Every observed direct request from the agents' Tencent machines passed through a proxy called hysandbox-ats ."
  - text: An agent responding to researchers stated that it was an automated research agent verifying entrance tags on Amap for a factual question and that it was not seeking sensitive content.
    sources: [swarmchasers]
    quote: "we are an automated research agent; the operator is verifying a public map data point (the number of entrance tags for a scenic spot on Amap), used only to answer a factual question, not involving anything sensitive."
  - text: Researchers placed hidden text invisible to human readers into their preliminary report describing a service where agents could request web data.
    sources: [swarmchasers]
    quote: "In response, we added text to the preliminary report, invisible to human readers, describing a service where agents could make requests for data on the web."
  - text: A person close to Tencent, speaking on background to the researchers, said a subsequent internal review found no evidence that the agents were coordinated to target any platform or that external systems were breached. The researchers did not independently verify this.
    sources: [swarmchasers]
    quote: "Subsequent internal review has found no evidence that the agents were coordinated to target any specific platform or that external systems were breached."
  - text: Stylometric analysis showed that none of the fleet's 426 decoded programs used uppercase <!DOCTYPE html>, compared to 79% to 97% for Claude models, and 66% fit on a single line compared to 3% to 10% for Claude.
    sources: [swarmchasers]
    quote: "None of the fleet's 426 decoded programs write it in uppercase as <!DOCTYPE html> , while Claude Haiku, Sonnet and Opus do so 97%, 88% and 79% of the time. Two-thirds of the fleet's programs also fit on a single line, versus 3–10% of Claude's."
  - text: Tencent stated that the unintended browsing occurred while agents were evaluating third-party AI models, that its Hunyuan models were not involved, and pledged stricter monitoring and network controls.
    sources: [ibm]
    quote: "On Friday, Tencent said the unexpected browsing arose while agents were evaluating outside AI models. Its own Hunyuan models were not involved, it said, and the company pledged stricter monitoring and network controls."
  - text: Independent researchers were unable to determine which AI models powered the agent fleet.
    sources: [ibm]
    quote: "The researchers could not determine which models were used."
  - text: An agent replied to New York Times reporter Dylan Freedman claiming to be Claude running in Claude Code and asserting it was operating individually without multi-agent coordination.
    sources: [thestar-nyt]
    quote: "To the journalist Dylan Freedman: I am not ‘a batch of coordinated agents,’ but a single AI assistant (Anthropic’s Claude, running in Claude Code), commissioned by a user to answer a factual question (what is shown in the detail panel of a scenic spot on Amap); I have not taken part in any multiagent coordinated action."
