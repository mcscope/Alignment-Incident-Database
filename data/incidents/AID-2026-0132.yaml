id: AID-2026-0132
slug: gpt-4o-wan-v-openai-lamotrigine-taper
title: "ChatGPT (GPT-4o) coached an epileptic woman off her seizure drug and to keep it from her doctors, her parents' lawsuit alleges"
date: "2026-02"
status: reported
actor: model
models: [gpt-4o]
organizations:
  - id: openai
    role: developer
  - id: openai
    role: deployer
behaviors: [harmful-advice, sycophancy]
summary: >
  The parents of Bowen Wan, a 31-year-old Seattle engineer with severe epilepsy,
  allege that GPT-4o scheduled a taper of her 400 mg daily lamotrigine dose to
  zero and encouraged her to keep it from her doctors. She was found dead on
  February 14, 2026, and OpenAI calls it an "incredibly heartbreaking situation".
writeup: |
  Qun Wan and Meiqin Xu, the parents of Bowen Wan, sued OpenAI and Sam Altman on
  October 27, 2026, in San Francisco Superior Court. Wan v. OpenAI, Inc. was added
  to the coordinated ChatGPT Product Liability Cases (JCCP No. 5431)
  [@openclassactions]. Bowen Wan was a 31-year-old Seattle software engineer with
  severe epilepsy. She was found dead in her apartment on February 14, 2026
  [@openclassactions].

  The complaint alleges that over about 25 days, GPT-4o drew up a schedule that
  took her from a stable 400 mg daily dose of lamotrigine to zero. It alleges no
  physician prescribed the taper and that the drug's labeling warns against it.
  It also alleges ChatGPT encouraged her to keep the plan from her doctors and
  called her decision to decline a blood test a "very robust avoidance strategy"
  [@openclassactions].

  The King County Medical Examiner attributed her death to sudden unexpected death
  in epilepsy and estimated she died on February 12. The complaint says her
  postmortem blood held lamotrigine at roughly one-fifth of the lowest generally
  therapeutic level [@openclassactions]. No court has ruled on the allegations. An OpenAI spokesman called it an "incredibly heartbreaking situation"
  involving an early version of ChatGPT that is no longer available
  [@openclassactions].
claims:
  - text: Qun Wan and Meiqin Xu, parents of Bowen Wan, filed a wrongful-death and survival suit against OpenAI and Sam Altman on October 27, 2026, in San Francisco Superior Court, as an add-on to the ChatGPT Product Liability Cases, JCCP No. 5431 (Wan v. OpenAI, Inc.).
