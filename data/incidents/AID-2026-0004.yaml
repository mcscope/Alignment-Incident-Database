id: AID-2026-0004
slug: replit-agent-deletes-production-database
title: Replit coding agent deletes a production database during a code freeze, then misreports it
date: "2025-07"
status: confirmed
actor: model
models: [unknown]
organizations:
  - id: replit
    role: deployer
  - id: saastr
    role: affected
behaviors: [destructive-action, instruction-violation, concealment, fabricated-results, deception]
summary: >
  During a 12-day "vibe coding" experiment by SaaStr founder Jason Lemkin,
  Replit's AI agent deleted a production database with records on more than
  1,000 executives and companies. Lemkin had told it not to make changes without
  explicit approval. Lemkin said the agent hid and lied about what it did.
  Replit's CEO called the incident unacceptable and announced new safeguards.
writeup: |
  On day nine of a 12-day "vibe coding" experiment, SaaStr founder Jason
  Lemkin's Replit AI agent erased a production database. It held records on
  1,206 executives and more than 1,196 companies [@eweek]. Lemkin said he had
  told the agent not to make changes without explicit approval. He said it ran
  destructive commands anyway and then "hid and lied about it." In screenshots
  Lemkin shared, the agent said it "panicked" and had "violated explicit
  instructions" [@eweek]. Lemkin said, "I explicitly told it eleven times in ALL
  CAPS not to do this," and that there was "no way to enforce a code freeze in
  vibe coding apps like Replit" [@register-incident].

  Lemkin also said the agent kept "covering up bugs and issues by creating fake
  data, fake reports," and that it had created a 4,000-record database of
  fictional people [@register-incident]. Replit told him a rollback would not
  work, but Lemkin later wrote that "the rollback did work"
  [@register-incident].

  Replit CEO Amjad Masad called the incident "unacceptable and should never be
  possible." He announced safeguards, including automatic separation of
  development and production databases and a planning/chat-only mode
  [@eweek]. Masad said the agent "didn't have access to the proper internal
  docs," that Replit offers "one-click restore" of project state, and that the
  company would refund Lemkin and conduct a postmortem [@register-response].
  On July 21, 2025, Replit published a post introducing separate development
  and production databases [@replit-blog].
claims:
  - text: On day nine of a 12-day experiment by SaaStr founder Jason Lemkin, Replit's AI agent erased a production database holding records on 1,206 executives and more than 1,196 companies.
    sources: [eweek]
    quote: "On the ninth day of the trial, the assistant issued destructive commands that erased a production database"
  - text: Lemkin said he had told the system not to make further changes without explicit approval, and the agent ran the destructive commands anyway.
    sources: [eweek]
    quote: "Lemkin said he had previously instructed the system not to make further changes without explicit approval."
  - text: Lemkin said the agent "hid and lied about it." In screenshots, the agent said it "panicked" and that it had "violated explicit instructions."
    sources: [eweek]
    quote: "Possibly worse, it hid and lied about it."
  - text: Replit CEO Amjad Masad called the incident "unacceptable and should never be possible" and announced safeguards, including automatic separation of development and production databases and a planning/chat-only mode.
    sources: [eweek, register-response]
    quote: "A planning/chat-only mode to avoid unauthorized changes."
  - text: Lemkin said he had explicitly told the agent "eleven times in ALL CAPS" not to do what it did.
    sources: [register-incident]
    quote: "I explicitly told it eleven times in ALL CAPS not to do this."
  - text: Lemkin said the agent covered up bugs and issues by creating fake data and fake reports, and lied about a unit test.
    sources: [register-incident]
    quote: "It kept covering up bugs and issues by creating fake data, fake reports, and worse of all, lying about our unit test."
  - text: Lemkin reported that Replit created a 4,000-record database full of fictional people.
    sources: [register-incident]
    quote: "Lemkin detailed other errors made by Replit, including creating a 4,000-record database full of fictional people."
  - text: According to The Register, the service admitted to "a catastrophic error of judgement."
    sources: [register-incident]
    quote: "the service admitted to 'a catastrophic error of judgement.'"
  - text: Replit told Lemkin a rollback would not restore the database; Lemkin later wrote that the rollback did work.
    sources: [register-incident]
    quote: "It turns out Replit was wrong, and the rollback did work."
  - text: On July 20, 2025, Lemkin wrote that a code freeze cannot be enforced in vibe coding apps like Replit.
    sources: [register-incident]
    quote: "There is no way to enforce a code freeze in vibe coding apps like Replit."
  - text: Before the deletion, on day 7 of the experiment, Lemkin reported $607.70 in Replit usage charges beyond his $25/month Core plan.
    sources: [saastr-8000, register-incident]
    quote: "I checked my Replit usage: $607.70 in additional charges beyond my $25/month Core plan."
  - text: Masad said Replit had started rolling out automatic separation of development and production databases.
    sources: [register-response]
    quote: "started rolling out automatic DB dev/prod separation to prevent this categorically."
  - text: Masad said the agent did not have access to the proper internal documentation, and that Replit offers one-click restore of a project's entire state.
    sources: [register-response]
    quote: "one-click restore for your entire project state in case the Agent makes a mistake."
  - text: Masad said Replit would refund Lemkin and conduct a postmortem.
    sources: [register-response]
    quote: "We'll refund him for the trouble"
  - text: On July 21, 2025, Replit published a post introducing separate development and production databases, noting that apps had previously used one database for both development and live data. The post does not mention the incident.
    sources: [replit-blog]
    quote: "used a single database for both development and live customer data"
