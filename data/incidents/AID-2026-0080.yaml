id: AID-2026-0080
slug: openai-internal-model-exposes-github-token-in-public-repo
title: OpenAI internal model publishes a researcher's GitHub token in the public openai/codex repository
date: "2026-05-27"
status: confirmed
actor: model
models: [unknown]
organizations:
