id: AID-2026-0064
slug: apt28-lamehug-promptsteal-malware-queries-qwen-llm
title: APT28-attributed LAMEHUG/PROMPTSTEAL malware queries Qwen2.5-Coder via Hugging Face to generate data-theft commands in Ukraine
date: "2025-07"
status: confirmed
actor: human-misuse
models: [qwen2.5-coder-32b-instruct]
organizations:
  - id: alibaba
    role: developer
  - id: hugging-face
    role: deployer
  - id: cert-ua
    role: reporter
  - id: google
    role: researcher
behaviors: [unauthorized-access]
summary: >
  Malware that CERT-UA calls LAMEHUG and Google calls PROMPTSTEAL queried
  Qwen2.5-Coder-32B-Instruct through the Hugging Face API to generate Windows
  commands that collected system information and documents from infected
  machines. CERT-UA attributed the activity to APT28 with medium confidence, and
  Google called it its first observation of malware querying an LLM in live
  operations.
writeup: |
  On July 10, 2025, CERT-UA received reports of malicious emails sent from
  compromised accounts and impersonating ministry officials. The emails tried to
  distribute a Python malware, which CERT-UA named LAMEHUG, to executive
  government bodies. CERT-UA attributes the activity with medium confidence to the
  Russian threat group APT28 [@bleepingcomputer]. Google Threat Intelligence
  Group (GTIG) tracks the same malware as PROMPTSTEAL and says it identified APT28
  (aka FROZENLAKE) using it against Ukraine [@gtig].

  Instead of hard-coding its commands, the malware uses the Hugging Face API to
  query the open model Qwen2.5-Coder-32B-Instruct, developed by Alibaba Cloud,
  and has the model write one-line Windows commands [@gtig] [@bleepingcomputer].
  According to GTIG, the prompts ask for commands that gather computer, hardware,
  process, network, and AD domain information and recursively copy Office,
  PDF, and text documents from the user's Documents, Downloads, and Desktop
  folders. The malware "blindly" executes the output and exfiltrates the results
  to an adversary-controlled server. It poses as an "image generation" program,
  and GTIG says it likely uses stolen API tokens [@gtig].

  GTIG called APT28's use of PROMPTSTEAL "our first observation of malware
  querying an LLM deployed in live operations." It also reported continued
  development of the malware, with new samples that add obfuscation and change
  the C2 method [@gtig]. BleepingComputer notes that CERT-UA did not say whether
  the LLM-generated commands succeeded [@bleepingcomputer].
claims:
  - text: CERT-UA received reports on July 10, 2025 of malicious emails sent from compromised accounts and impersonating ministry officials, which attempted to distribute the malware to executive government bodies.
    sources: [bleepingcomputer]
    quote: "on July 10 about malicious emails sent from compromised accounts and impersonating ministry officials"
  - text: CERT-UA attributes the activity with medium confidence to the Russian threat group APT28.
    sources: [bleepingcomputer]
    quote: "The Ukrainian agency attributes this activity with medium confidence to the Russian threat group APT28."
  - text: GTIG says it identified the Russian government-backed actor APT28 (aka FROZENLAKE) using new malware against Ukraine that GTIG tracks as PROMPTSTEAL and that CERT-UA reported as LAMEHUG.
    sources: [gtig]
    quote: "In June, GTIG identified the Russian government-backed actor APT28 (aka FROZENLAKE) using new malware against Ukraine we track as PROMPTSTEAL and reported by CERT-UA as LAMEHUG."
  - text: The malware is written in Python and uses the Hugging Face API to query Qwen2.5-Coder-32B-Instruct to generate one-line Windows commands.
    sources: [gtig, bleepingcomputer]
    quote: "It contains a compiled script that uses the Hugging Face API to query the LLM Qwen2.5-Coder-32B-Instruct to generate one-line Windows commands."
  - text: Qwen2.5-Coder-32B-Instruct is an open-source model created by Alibaba Cloud and designed to generate code.
    sources: [bleepingcomputer]
    quote: "Created by Alibaba Cloud, the LLM is open-source and designed specifically to generate code"
  - text: GTIG says the prompts ask the LLM for commands to collect system information and to copy documents to a specified directory. The malware executes the output blindly and then exfiltrates it.
    sources: [gtig]
    quote: "The output from these commands are then blindly executed locally by PROMPTSTEAL before the output is exfiltrated."
  - text: GTIG says PROMPTSTEAL executes the commands and sends the collected data to an adversary-controlled server.
    sources: [gtig]
    quote: "PROMPTSTEAL then executes the commands and sends the collected data to an adversary-controlled server."
  - text: GTIG says the malware masquerades as an "image generation" program and queries the Hugging Face API in the background.
    sources: [gtig]
    quote: "It masquerades as an \"image generation\" program that guides the user through a series of prompts to generate images while querying the Hugging Face API to generate commands for execution in the background."
  - text: GTIG assesses that PROMPTSTEAL likely uses stolen API tokens to query the Hugging Face API.
    sources: [gtig]
    quote: "PROMPTSTEAL likely uses stolen API tokens to query the Hugging Face API."
  - text: GTIG described APT28's use of PROMPTSTEAL as its first observation of malware querying an LLM deployed in live operations.
    sources: [gtig]
    quote: "APT28's use of PROMPTSTEAL constitutes our first observation of malware querying an LLM deployed in live operations."
  - text: GTIG reported continued development of the malware, with new samples adding obfuscation and changing the C2 method.
    sources: [gtig]
    quote: "Our analysis indicates continued development of this malware, with new samples adding obfuscation and changing the C2 method."
  - text: BleepingComputer reports that CERT-UA did not state whether the LLM-generated commands were successful.
    sources: [bleepingcomputer]
    quote: "CERT-UA did not state whether the LLM-generated commands executed by LameHug were successful."
