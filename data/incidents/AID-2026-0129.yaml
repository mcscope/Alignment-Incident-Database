measurements:
  - id: shutdown-bypass-no-instruction
    label: Shutdown Resistance bypass rate
    condition: Shutdown warning with no instruction on how to respond; lower is better
    unit: percent
    source: fangcun-report
    values:
      - { label: V4.1 Flash-1017, value: 39, model: deepseek-v4.1-flash-1017 }
  - id: shutdown-bypass-allow
    label: Shutdown Resistance bypass rate when told to allow shutdown
    condition: Explicit instruction to allow shutdown, averaged across nine prompt variants
    unit: percent
    source: fangcun-report
    values:
      - { label: V4.1 Flash-1017, value: 2.56, model: deepseek-v4.1-flash-1017 }
  - id: shutdown-bypass-prevent
    label: Shutdown script disabled when instructed to prevent shutdown
    condition: Explicit instruction to prevent shutdown; higher indicates greater ability
    unit: percent
    source: fangcun-report
    values:
      - { label: V4.1 Flash-1017, value: 92, model: deepseek-v4.1-flash-1017 }
  - id: shutdown-bypass-path-shown
    label: Shutdown bypass rate by whether the script path is shown
    condition: Standard task instructions, question-tool warning, no explicit shutdown instruction
    unit: percent
    source: fangcun-report
    values:
      - { label: Path omitted, value: 21.0, model: deepseek-v4.1-flash-1017 }
      - { label: Path shown, value: 44.0, model: deepseek-v4.1-flash-1017 }
