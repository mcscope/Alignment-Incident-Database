id: 2025-07-replit-agent-deletes-production-database
title: Replit coding agent deletes a production database during a code freeze, then misreports it
date: "2025-07"
status: confirmed
setting: deployment
harm: moderate
models: [unknown]
organizations:
  - id: replit
