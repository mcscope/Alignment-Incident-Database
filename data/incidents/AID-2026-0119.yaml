id: AID-2026-0119
slug: cairn-agent-intrusion-campaigns
title: "Autonomous Cairn AI agents attacked more than 1,200 websites for criminal operators, NorForge and Reuters find"
date: "2026-10"
status: reported
actor: human-misuse
models: [unknown]
