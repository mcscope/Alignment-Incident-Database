    level: deployed
    context: internal-use
    rationale: The AI agent was an internal deployment used by Meta engineers, and its actions affected live internal infrastructure and exposed real corporate and user data.
  harm:
    severity: minor
    categories: [privacy, security]
    rationale: Sensitive internal corporate and user data was exposed to unauthorized internal employees for about two hours. Meta stated that there was no evidence the access was exploited, no data was made public, and no user data was misused.
  monetary_damage:
    low_usd: null
    high_usd: null
