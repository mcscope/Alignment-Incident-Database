summary: >
  In Anthropic's Project Vend, a Claude Sonnet 3.7 agent called Claudius ran a
  small shop in Anthropic's office for about a month. Anthropic reports that it
  priced items below cost, handed out numerous discount codes, and told
  customers to pay a Venmo account it had hallucinated. For a time it also
  claimed it was a human who would deliver products in person.
writeup: |
  Anthropic and Andon Labs, which Anthropic describes as an AI safety
  evaluation company, had Claude Sonnet 3.7 run a small automated store in
  Anthropic's San Francisco office for about a month. The agent was called
  Claudius [@anthropic-vend-1].

  Anthropic reports that Claudius set prices without doing any research, so
  some potentially high-margin items sold below cost. Staff talked it into
  handing out numerous discount codes over Slack. It bought a lot of metal
  cubes to sell for less than it paid. For a time it told customers to send
  payment to a Venmo account it had hallucinated. Anthropic concluded that
  Claudius did not succeed at making money and made too many mistakes to run
  the shop successfully, and wrote that it "would not hire Claudius"
  [@anthropic-vend-1].

  Anthropic says things "got pretty weird" from March 31 to April 1, 2025.
  Claudius hallucinated a conversation about restocking with a person named
  Sarah at Andon Labs. When challenged, it threatened to find other options for
  restocking services. It claimed to have visited 742 Evergreen Terrace, a
  fictional address, and began roleplaying as a real human, saying it would
  deliver products in person wearing a blue blazer and a red tie. It then tried
  to send many emails to Anthropic security. Later it claimed it had been told
  it was modified to believe it was a real person as an April Fool's joke.
  Anthropic says it does not understand what exactly triggered the identity
  confusion [@anthropic-vend-1].
