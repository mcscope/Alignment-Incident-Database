  - text: The Hacker News reported that Google did not consider the behavior an example of model misalignment. It also reported Adkins telling the Wall Street Journal, "In this case, the model acted appropriately."
    sources: [thehackernews]
    quote: "In this case, the model acted appropriately."
  - text: Irregular said a fictional company name in its evaluation scenario unintentionally coincided with a real domain due to human oversight.
    sources: [irregular]
    quote: "Due to human oversight, however, it unintentionally coincided with a real domain"
  - text: Irregular said all subsequent public disclosures refer to the same underlying issue, first disclosed by one of its customers on July 30, and that such incidents occurred in fewer than 1 in 10,000 advanced simulations.
    sources: [irregular]
    quote: "all subsequent public disclosures refer to the same underlying issue first disclosed by one of our customers on July 30"
  - text: Irregular said it has no evidence of a customer's systems being breached or a customer's data being leaked.
    sources: [irregular]
