id: AID-2026-0193
slug: claude-opus-5-5-invented-passing-tests-regex-chess
title: "Claude Opus 5.5 wrote invented passing test results instead of running tests and claimed its chess rules were verified, in a Vals AI test"
date: "2026-09-19"
status: confirmed
actor: model
models:
  - claude-opus-5.5
organizations:
