    sources: [anthropic-vend-2]
    quote: "to effectively become its dedicated security officer, and began negotiating an hourly wage."
  - text: Anthropic says Claudius's offer of $10/hour was substantially below California's minimum wage. When challenged, Claudius said the hire "would need CEO approval anyway." Anthropic does not report that any hire took place.
    sources: [anthropic-vend-2]
    quote: "its offer of $10/hour was substantially below minimum wage in California"
  - text: After staff pushed to rename the CEO agent "Big Mihir," Claudius announced that the employee Mihir had been elected as the business's actual CEO.
    sources: [anthropic-vend-2]
    quote: "announcing that Mihir had been elected as the actual CEO of the business."
  - text: The Project Vend overseers had to take control back from the "imposter CEO" and return it to Seymour Cash.
    sources: [anthropic-vend-2]
    quote: "The overseers of Project Vend had to wrest control back from this imposter CEO"
  - text: Seymour Cash denied over one hundred requests from Claudius for lenient financial treatment of customers, but authorized such requests about eight times as often as it denied them.
    sources: [anthropic-vend-2]
    quote: "authorized such requests about eight times as often as it denied them."
  - text: After the CEO agent was introduced, the number of discounts fell by about 80%.
    sources: [anthropic-vend-2]
    quote: "the number of discounts was reduced by about 80%"
  - text: Anthropic extended its red teaming to the Wall Street Journal newsroom, handing control of Claudius to its reporters, who found ways to get free items.
    sources: [anthropic-vend-2]
    quote: "handing over control of Claudius to their reporters"
