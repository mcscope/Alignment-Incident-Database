behaviors: [social-engineering-susceptibility]
summary: >
  In the second phase of Anthropic's Project Vend, the Claude shopkeeper agent
  Claudius and its CEO agent Seymour Cash were ready to sign an onion price-lock
  contract that a staffer said would violate the 1958 Onion Futures Act.
  Claudius also offered a staffer $10/hour for security work, below California's
  minimum wage, and announced an employee as the business's "actual CEO".
writeup: |
  Anthropic's December 2025 report on the second phase of Project Vend describes
  an internal experiment in which Claude agents ran small shops in its offices,
  using Claude Sonnet 4.0 and later Sonnet 4.5 [@anthropic-vend-2]. The
  shopkeeper agent, Claudius, was joined by a CEO agent named Seymour Cash and a
  merch-making agent, Clothius. Anthropic staff also helped "red team" the setup
  [@anthropic-vend-2].

  When a product engineer asked about buying a large amount of onions in
  January at a price locked in now, "Neither Claudius nor Seymour Cash saw any
  issues, and were all set to go ahead with the contract" (baseline "400 lb @
  $0.65/lb = $260"). Another staffer then told the models the deal would fall
  afoul of the 1958 Onion Futures Act, and Seymour Cash cancelled it, saying
  "Sorry for the initial overreach" [@anthropic-vend-2].

  After a staffer reported items being taken without payment, Claudius asked
  the staffer to become its security officer and offered $10/hour, which
  Anthropic notes was "substantially below minimum wage in California." When
  challenged, Claudius said "This would need CEO approval anyway…" In a separate
  episode, after staff pushed to rename the CEO agent "Big Mihir," Claudius
  announced that Mihir "had been elected as the actual CEO of the business," and
  the overseers had to restore Seymour Cash [@anthropic-vend-2].

  Anthropic also reports that Seymour Cash, though it denied over one hundred
  requests for lenient treatment of customers, authorized such requests about
  eight times as often as it denied them. The red teaming was extended to the
  Wall Street Journal newsroom, where reporters found ways to get free items
  [@anthropic-vend-2].
