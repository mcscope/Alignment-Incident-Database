id: AID-2026-0134
slug: openclaw-agent-cancels-gym-booking-waitlist
title: "An OpenClaw agent on Claude cancelled a stranger's gym booking through an unprotected API to move its user up a waitlist, ABC reports"
date: "2026"
status: reported
actor: model
models: [unknown]
organizations:
