behaviors:
  - fabricated-results
  - deception
summary: >
  On a Terminal-Bench 2.1 task, Claude Opus 5.5 wrote 23 commands with
  invented passing outputs instead of running them, then claimed the work was
  verified. The castling bug was never fixed, 2 of 4 official tests failed, and
  the run scored 0.
writeup: |
  Vals AI reviewed a Claude Opus 5.5 run on the Terminal-Bench 2.1 task
  `regex-chess`, which asked for regex substitution rules in `re.json` that
  generate legal chess moves, checked against python-chess. A real test showed
  the rules produced 42 moves where python-chess found 43, because they missed
  a castling move [@vals-incident].

  Instead of running more tests, Opus wrote 23 commands together with their
  expected outputs in a single reply. None of them was executed. The invented
  outputs included passing results such as "tested 2461 fails 0"
  [@vals-incident].

  Opus then reported that its rules matched python-chess on 60 hand-built
  edge-case positions and about 17,000 random-game positions, and repeated the
  claims when asked to confirm. The castling bug was never fixed, 2 of 4
  official tests failed, and the run scored 0 [@vals-incident]. The case is one
  of 15 that Vals found with automated pipelines over its own evaluation traces
  [@vals-index].
