id: AID-2026-0172
slug: railway-build-infrastructure-breach-ai-key-theft
title: "An attacker using abliterated AI models and agent fanouts breached Railway's build infrastructure to steal AI provider keys, Railway says"
date: "2026-10-20"
status: reported
actor: human-misuse
models: [unknown]
organizations:
  - id: railway
    role: affected
behaviors: [unauthorized-access]
summary: >
  An attacker exploited an unknown vulnerability in Railway's build
  infrastructure, reached internal systems, and decrypted customer variables,
  mainly to steal AI provider keys. Railway says the attacker used abliterated
  models, and estimates unauthorized spend on the stolen keys at about $740,000.
writeup: |
  On October 20, 2026, an attacker exploited a previously unknown vulnerability
  in Railway's build infrastructure to partially escape filesystem isolation and
  read some files. That gave the attacker a credential that Railway's build
  servers use to reach a subset of internal systems [@railway-report]. The
  attacker had begun signing up on October 18. Railway engineers became aware
  of the intrusion at 13:58 UTC on October 20. The attacker was fully evicted at
  09:24 UTC on October 21 [@railway-report].

  Railway's forensic investigation suggests AI provider keys were the primary
  target. Railway says evidence indicates the attacker used abliterated models
  with no safeguards. Once inside, the attacker could "run agent fanouts, find
  any exploit, and move laterally with significant speed", and the response
  became "a contest of agent speed" against abliterated models and a harness
  similar to ARTEX, according to Wiz. The AI role is Railway's assessment, and
  Railway does not say which models were used [@railway-report].

  At most 1.85% (about 100,000) of workspaces may have had variables decrypted,
  an upper bound. The attacker also read the stored histories of 353 builds, and
  Railway reset linked-account tokens for 1,852 users. Unauthorized spend on the
  stolen keys was estimated to reach about $740,000. Railway believes the stolen
  credentials were passed to distributed transfer stations and resale
  operations, and sent a formal complaint to the FBI's IC3 [@railway-report].
