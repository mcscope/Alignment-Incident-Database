assessment:
  reach:
    level: deployed
    context: product
    rationale: Happened in Claude Code 2.1.311, a deployed agentic coding tool, on the user's own machine. Worktree isolation separates Git checkouts and was not a filesystem containment boundary, so this is not a breakout.
  harm:
    severity: moderate
    categories:
      - data-loss
    rationale: The user lost all unpushed commits and uncommitted work across several projects, plus shell and CLI configuration, with no backup. Some home-folder contents survived because the deletion was stopped partway.
  monetary_damage:
    low_usd: null
    high_usd: null
    confidence: low
    rationale: The issue gives no monetary figure for the lost work.
  criminality:
    likelihood: unlikely
    offenses: []
    rationale: A human developer who wrote a test that accidentally deleted a colleague's files would be negligent, not committing a crime.
