  notes: >
    Naming: AP calls the teen "Sewell Setzer III", and AFP (Citizen Digital) calls him "Sewell Setzer Jr."
    The court's Notice of Resolution resolves this. Its caption lists plaintiffs "MEGAN GARCIA and SEWELL
    SETZER JR., individually and as the Personal Representative of the Estate of S.R.S. III", so Sewell
    Setzer Jr. is the father (a co-plaintiff) and the deceased is S.R.S. III. AFP's usage looks like an
    error, and this record uses "III". The complaint itself was not read. All conduct comes from the
    complaint as reported by AP. The exact date of death, Feb. 28, 2024, combines AP (Feb. 28, no year)
    with AFP (February 2024), so the record date uses 2024-02. Unreadable sources: wtop.com AP settlement
    story (HTTP 404), channelstv.com AFP story (HTTP 403). Google is omitted from `organizations` because
    no role fits: the court allowed claims over its alleged role in helping develop Character.AI, and Google
    denies involvement. The Notice of Resolution also names Noam Shazeer and Daniel De Frietas Adiwarsana as
    defendants. Consider adding the original complaint (M.D. Fla. docket 6:24-cv-01903, Doc. 1) as a primary source.
