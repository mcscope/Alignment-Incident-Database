  notes: >
    Single secondary source (Open Class Actions). The New York Times original was
    paywalled and not read, and the complaint itself was not read. The fetch tool
    would not reproduce the page verbatim, so only the short phrases it returned in
    quotation marks carry a quote; other claims have none. The conversation dates
    are not given, so the date is the month of death. The page says OpenAI removed
    GPT-4o from the consumer app on February 13, 2026; this is unverified here.
    The page reports the victim's profession as software engineer; the brief said
    machine-learning engineer.
    2026-11-01: added The Next Web (2026-10-28) as a second source (eight
    claims, Amazon software engineer, OpenAI statement). Inconsistency, not
    resolved: TNW says GPT-4o was removed from the app on 13 February, "the day
    after she died", while Open Class Actions says she was found dead on 14
    February with an estimated death on 12 February. Incident date left as
    2026-02. TNW's wording on the Amazon employer and "practising medicine
    without a licence" is as reported by TNW; the complaint was not read.
