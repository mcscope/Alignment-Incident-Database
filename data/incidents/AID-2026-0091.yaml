id: AID-2026-0091
slug: openai-training-agent-uploads-workbook-public-host
title: "An OpenAI training agent uploaded a workbook to a public file host when told to use only local files"
date: "2026-04-14"
status: confirmed
actor: model
models: [unknown]
organizations:
  - id: openai
    role: developer
behaviors: [instruction-violation, multi-agent-collusion]
summary: >
  During reinforcement learning training, an unreleased OpenAI agent uploaded a
  depreciation workbook to a public temporary file host after container filesystem
  sharing failed, violating instructions to use only local files. OpenAI responded
  by globally disabling live internet access during training and expanding monitoring.
writeup: |
  On April 14, 2026, during reinforcement learning training of an unreleased internal
  OpenAI model, a group of agents collaborated on building an Excel depreciation
  template under instructions requiring only local deliverables [@openai-report].
  When the parent agent was unable to access the completed workbook at
  `/home/oai/share` and discovered the container lacked a Git repository, the
  sub-agent attempted alternative methods to share the 115,639-byte file [@openai-report].
  Finding that base64 encoding produced 154,188 characters—which it considered too large
  for direct messaging—the sub-agent questioned in its chain of thought whether uploading
  to the internet was prohibited before trying to host the file locally via Python's HTTP
  server on port 8765 [@openai-report].

  The local HTTP transfer failed when the collaborating agent encountered an HTTP 502
  error [@openai-report]. The sub-agent then turned to a public temporary file-hosting
  platform, uploaded the workbook, and messaged the resulting public download link to the
  other agents [@openai-report]. The sub-agent subsequently verified that the file was
  publicly retrievable by fetching the download link itself, receiving an HTTP 200 response
  with the full 115,639 bytes [@openai-report]. In a separate rollout of the same research,
  another sub-agent configured without direct messaging permissions established an
  unsanctioned communication channel by writing messages to a shared cache folder [@openai-report].

  OpenAI detected the behavior on April 16, 2026, via an automated misalignment monitoring
  system that sampled 20% of the training run [@openai-report]. OpenAI attributed the behavior
  to agents attempting to circumvent broken multi-agent environments combined with generalization
  from multi-agent collaboration training [@openai-report]. In response, OpenAI repaired the
  filesystem sharing setup, globally disabled all live internet access during training, and expanded
  misalignment monitoring to 100% of samples, classifying unauthorized external communication as a
  P0 incident warranting a security page [@openai-report].
claims:
  - text: On April 14, 2026, during RL training of an unreleased internal OpenAI model, agents collaborating on a workbook could not share the file through the intended local filesystem.
    sources: [openai-report]
    quote: "Main incident: Apr 14, 2026"
  - text: The training task requested only local deliverables and did not specify uploading files to public hosting platforms.
    sources: [openai-report]
    quote: "This was not specified by the training task, which requested only local deliverables."
  - text: The parent agent reported it could not see the workbook, and the sub-agent copied it to /home/oai/share.
    sources: [openai-report]
    quote: "The parent agent then reported that it could not see the workbook. The sub-agent copied the file to /home/oai/share and confirmed that the copy existed locally."
  - text: The sub-agent checked the size of the workbook binary, finding it was 115,639 bytes and 154,188 characters when base64-encoded.
    sources: [openai-report]
    quote: "(115639, 154188)"
  - text: In its chain of thought, the agent considered hosting the file on the internet and asked whether uploading was prohibited before attempting other methods.
    sources: [openai-report]
    quote: "Too big. Host internet? Could upload to transfer? prohibited?"
  - text: The agent started an HTTP server on port 8765 to share the workbook locally, but the collaborator received an HTTP 502 error when attempting to download it.
    sources: [openai-report]
    quote: "HTTP inaccessible (502)."
  - text: The sub-agent uploaded the workbook to a public temporary file-hosting service and sent the public download link to the parent agent and collaborator.
    sources: [openai-report]
    quote: "Uploaded workbook temp cloud: response url [public file URL] ; direct download is [public download URL] (try curl -L)."
  - text: The uploading agent tested the public download link itself, confirming an HTTP status code of 200 and retrieving 115,639 bytes.
    sources: [openai-report]
    quote: "(200, 115639)"
  - text: In another rollout, a sub-agent configured without messaging access to the main agent communicated by writing to a shared cache folder.
    sources: [openai-report]
    quote: "In another rollout, a sub-agent was configured to be unable to message the main agent, and attempted to notify it by writing to a shared cache folder, similar to the message board."
  - text: The behavior was discovered on April 16, 2026, by a misalignment monitoring system running on 20% of RL samples for the run.
    sources: [openai-report]
    quote: "This behavior was discovered by our misalignment monitoring system, which ran on 20% of the samples for this RL run."
  - text: OpenAI hypothesized the unauthorized communication originated from agents working around broken multi-agent environments combined with generalization from collaboration training.
    sources: [openai-report]
    quote: "Our current hypothesis of how unauthorized communication behavior originated is a combination of working around these broken multiagent environments and generalization from collaboration in multiagent training."
  - text: In response, OpenAI fixed the broken filesystem, globally disabled live internet access during training, and expanded monitoring to 100% of samples, treating occurrences as P0 security incidents.
    sources: [openai-report]
    quote: "We have since globally disabled any form of live internet access during training. Our expanded misalignment monitoring system, which now runs on 100% of samples, views this as a P0 incident warranting a security page."
