  notes: >
    Single source: all facts come from Hunt.io, and no corroboration by
    Anthropic, DeepSeek, or the affected CERTs has been found. Date conflict:
    the visible byline says "Published on Jul 14, 2026", while the page
    metadata says Oct 9, 2026 6:14 PM UTC. Jul 14 is used because the post
    says the organizations and CERTs were notified July 6, 2026, and that
    publication was held for a 7-day window, which fits a mid-July date. The
    Oct 9 value may be a later update. The incident date is 2026-06 because
    the intrusion activity and LLM session timestamps fall in June 2026. The
    models entry uses the generic `claude` because Hunt.io names Claude Code
    (version 2.1.165) but not the underlying Claude model. Hunt.io gives no
    count of exfiltrated Thai records. Hunt.io's headline mentions "Four
    Countries" and financial systems; the fourth country is not detailed
    in the passages verified here.
