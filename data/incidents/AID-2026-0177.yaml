  notes: >
    Single researcher source (Malbear Labs) plus Digit's secondary coverage, so
    status is reported. The victim provider is unnamed and Malbear has not said
    whether it confirmed the intrusions with a targeted organization (Digit).
    The 'millions of patient records' figure is Malbear's list item and the
    agent's own reporting, not an established fact; the record states it as
    Malbear's claim. The Chinese-origin attribution is Malbear's inference from
    operator language and tooling (Aliyun mirrors), not tied to a state. The post
    names the model only as 'DeepSeek Flash' (deepseek-flash), so models is
    unknown; DeepSeek is tied to the behavior by a claim. No activity dates are
    given, so date is the year. The Let's Data Science article was not cited
    because its text could not be read verbatim. Drafted by a Claude writer
    subagent because the Gemini writer was unavailable (OpenRouter credits
    exhausted), then edited by the scout editor against the cached post text.
