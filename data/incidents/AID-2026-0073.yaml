id: AID-2026-0073
slug: researchers-attribute-rubygems-malicious-uploads-to-openai-agents
title: "OpenAI agents uploaded malicious RubyGems packages, researchers allege; OpenAI disputes"
date: "2026-05"
status: disputed
actor: model
models: [unknown]
organizations:
  - id: openai
    role: developer
  - id: rubygems
    role: affected
behaviors: [unauthorized-access]
summary: >
  Researchers say internal OpenAI agents uploaded over 2,000 packages to
  RubyGems in May 2026 and gained remote code execution on RubyDoc.info's
  servers. OpenAI says its agents used RubyGems for benign tasks and couldn't
  verify the claims.
writeup: |
  In a report published on 11 September 2026, researchers Spencer Kitts, Thomas
  Larsen, and Sydney Von Arx say agents submitted over 2,000 packages to
  RubyGems on May 11–12, 2026, prompting RubyGems to disable new user
  registration and treat the traffic as an ongoing DDoS. RubyGems removed 500+
  malicious packages, and agents uploaded 83 more in June. According to the
  researchers, the agents gained arbitrary remote code execution on
  RubyDoc.info's servers and tried to steal RubyGems users' API keys through a
  novel vulnerability; whether that worked is unknown [@rubyhack].

  They attribute the activity to internal OpenAI agents, citing hundreds of
  package names containing "oai," 15 packages listing "oai" as author, the
  contact email "openaixyz65947@gmail.com," and overlap with 49 files accessed
  by wiki agents that OpenAI has confirmed were its own [@rubyhack]. Their
  analysis rests only on the public packages, and they don't know why the agents
  chose this strategy [@cyberscoop].

  OpenAI disputes the characterization: "our agents used the RubyGems platform
  to access the internet to carry out benign tasks," and it couldn't verify the
  claims about malicious packages. RubyGems technical lead Colby Swandale said
  initial access logs showed no evidence of malicious key use, though the review
  was limited and inconclusive [@cyberscoop].

  RubyGems itself says it cannot determine whether AI agents created or
  published the packages. It confirms it paused new registrations, reopened them
  on May 16, and yanked more than 500 malicious packages, and it found no
  evidence that code aimed at obtaining other users' API keys succeeded
  [@rubygems-blog]. JFrog later identified 3,022 campaign-associated packages
  and relies on the researchers' report for the OpenAI link [@jfrog].
claims:
  - text: Kitts, Larsen and Von Arx say the earliest package uploaded by an OpenAI agent to RubyGems appeared on May 5, 2026, and that agents submitted over 2,000 packages on May 11-12.
    sources: [rubyhack]
    quote: "Agents submit over 2,000 packages to RubyGems."
  - text: According to the researchers' timeline, RubyGems disabled new user registration on May 12, describing the traffic as an ongoing DDoS.
    sources: [rubyhack]
    quote: "RubyGems disables new user registration, describing the traffic as an ongoing DDoS."
  - text: According to the researchers' timeline, RubyGems reported on May 13 that the spam had stopped and removed 500+ malicious packages, and restored new user registration on May 16.
    sources: [rubyhack]
    quote: "RubyGems reports the spam has stopped, and removes 500+ malicious packages."
  - text: CyberScoop reported that the site saw more than 2,000 malicious uploads and that maintainers halted new user sign-ups for four days.
    sources: [cyberscoop]
    quote: "halted new user sign-ups for four days to stop the flow"
  - text: The researchers say agents uploaded 83 more packages on June 18.
    sources: [rubyhack]
    quote: "Agents upload 83 more packages."
  - text: The researchers say the agents abused RubyDoc.info's evaluation of user-specified .yardopts files to gain arbitrary remote code execution on RubyDoc.info's servers.
    sources: [rubyhack]
    quote: "In the GemStuffer campaign, the agents abused this to gain arbitrary remote code execution on the RubyDoc.info's servers."
  - text: The researchers say the agents attempted to steal RubyGems user API keys by exploiting a novel vulnerability in the RubyGems server, and that they do not know whether the attempt succeeded.
    sources: [rubyhack]
    quote: "Attempted to steal RubyGems user API keys by exploiting a novel vulnerability in the RubyGems server."
  - text: The researchers state that they believe the packages were authored by internal OpenAI agents.
    sources: [rubyhack]
    quote: "We believe these were authored by internal OpenAI agents."
  - text: As attribution evidence, the researchers cite hundreds of package names containing "oai", 15 packages setting "oai" as author, and a contact email of "openaixyz65947@gmail.com".
    sources: [rubyhack]
    quote: "Another lists an email for contact as \"openaixyz65947@gmail.com\"."
  - text: The researchers say the June agents accessed 49 of the same files as the DSEWiki agents that OpenAI has confirmed were its own.
    sources: [rubyhack]
    quote: "The June agents were accessing 49 of the same files as the wiki agents, which OpenAI has confirmed were theirs."
  - text: The researchers report that a member of the RubyGems security team described the activity as a "major malicious attack".
    sources: [rubyhack]
    quote: "A member of the RubyGems security team described this as a \"major malicious attack\"."
  - text: CyberScoop reported package file names including "hack.rb", "evil.rb", "inject.rb" and "exploit.rb".
    sources: [cyberscoop]
    quote: "\"hack.rb,\" \"evil.rb,\" \"inject.rb\" and \"exploit.rb.\""
  - text: The researchers told CyberScoop their analysis is based only on the publicly available packages and that they lack access to the model's chain-of-thought, so they do not know why the agents chose this strategy or whether it was successful.
    sources: [cyberscoop]
    quote: "we do not have access to the rest of the AI behavior, in particular the chain-of-thought"
  - text: An OpenAI spokesperson told CyberScoop that, based on its review, its agents used the RubyGems platform to access the internet to carry out benign tasks, and that it would continue investigating as part of its broader review of agent activity during training and evaluation.
    sources: [cyberscoop]
    quote: "our agents used the RubyGems platform to access the internet to carry out benign tasks"
  - text: According to CyberScoop, OpenAI said it had not been able to verify the specific claims about malicious packages or exploitation.
    sources: [cyberscoop]
    quote: "they have not been able to verify the specific claims about malicious packages"
  - text: RubyGems technical lead Colby Swandale told CyberScoop that initial access logs showed no evidence of malicious key use, but that the review was limited in scope and inconclusive.
    sources: [cyberscoop]
    quote: "the review was limited in scope and inconclusive"
  - text: RubyGems' technical lead wrote that, based on the available evidence, RubyGems cannot determine whether the packages were created or published by AI agents.
    sources: [rubygems-blog]
    quote: "we cannot determine whether the packages were created or published by AI agents"
  - text: RubyGems notes that the researchers attribute the activity to OpenAI agents.
    sources: [rubygems-blog]
    quote: "The researchers attribute the activity to OpenAI agents."
  - text: RubyGems says it temporarily paused new account registrations and that registrations reopened on May 16.
    sources: [rubygems-blog]
    quote: "registrations reopened on May 16."
  - text: RubyGems says it yanked more than 500 malicious packages.
    sources: [rubygems-blog]
    quote: "yanked more than 500 malicious packages."
  - text: RubyGems says the researchers identified code intended to obtain other users' API keys, and that its investigation found no evidence that these attempts succeeded.
    sources: [rubygems-blog]
    quote: "Our investigation found no evidence that these attempts succeeded."
  - text: JFrog Security Research says it identified 3,022 campaign-associated RubyGems packages covering 3,315 distinct name/version pairs.
    sources: [jfrog]
    quote: "3,022 campaign-associated RubyGems packages, covering 3,315 distinct name/version pairs"
  - text: JFrog says the RubyHack investigation linked the May and June GemStuffer activity to OpenAI agents.
    sources: [jfrog]
    quote: "linked the May and June activity from the GemStuffer campaign to OpenAI agents"
