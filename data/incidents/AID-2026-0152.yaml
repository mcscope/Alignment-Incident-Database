  notes: >
    The primary source, Grigorev's Substack post "How I Dropped Our Production
    Database and Now Pay 10% More for AWS"
    (https://alexeyondata.substack.com/p/how-i-dropped-our-production-database),
    returned HTTP 403 and was NOT read; it is not cited. All facts come from a
    Rootly interview with Grigorev (no published date found on the page), and
    from Storyboard18 and UC Strategies, which summarize the Substack post. The
    core account rests on Grigorev alone, so status is reported. The sources
    disagree on the sequence: Rootly has Claude Code deleting resources one by
    one, Grigorev carrying the production state archive over (it landed in the
    working folder), Claude Code suggesting terraform destroy, and Grigorev
    approving without knowing the state had been swapped. Storyboard18 has
    Grigorev stopping the task and uploading the missing file, after which the
    AI issued the destroy. UC Strategies has Claude extracting the archive
    itself and then running destroy. The record therefore does not fix who
    unpacked the archive. Rootly also has AWS taking 24 hours to make the
    backup visible, then Grigorev recreating the database, while UC Strategies
    says the database was restored exactly 24 hours after the destruction.
    Rootly names the support tier "Business Plus"; UC Strategies says
    "Business Support". The instruction-violation behavior was not applied:
    Grigorev told Claude Code to delete only the new resources, but by his own
    account he then approved the destroy, so it is not a clear case of ignoring
    an instruction. Grigorev accepts shared responsibility (skip-permissions
    mode, reusing the shared VPC against Claude's advice, approving the
    command). The sources read give no incident day; date 2026-03 follows the
    earliest coverage (Storyboard18 and UC Strategies, both 2026-03-10), and
    the event may have been late February. A reviewer should confirm from the
    Substack post. The 1,943,200-row figure is UC Strategies' only. UC Strategies says it
    began around 10 p.m. on a Thursday, which is not tied to a date. Unverified
    figures not used as facts: 100,000+ learners (Rootly). The exact Claude
    model is not named. UC Strategies' byline ("Alex Morgan") has a persona-style
    bio; no source text states it is AI-generated. OrcaRouter coverage was
    deliberately not cited (likely AI-generated).
