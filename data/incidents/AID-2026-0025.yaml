  notes: >
    Date is the publication date of Anthropic's report (2025-12-18); the exact
    dates of the onion, security-wage, and CEO-rename episodes are not given.
    Clothius (the merch
    agent) is named in the source but not involved in these episodes. The
    researcher's notes attribute "Brilliant!" to Seymour Cash, but this
    writer could not confirm which agent sent that message, so the claim
    leaves it unattributed. The WSJ newsroom
    deployment is covered by AID-2026-0026.
