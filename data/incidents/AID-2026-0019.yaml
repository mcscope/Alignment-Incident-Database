  notes: >
    xAI's causal account (upstream code path, independence from the language
    model, 16 hours) is quoted from NBC's report of the statement; the original
    X posts were not fetched (x.com returns HTTP 402). The 16-hour window and
    xAI's "upstream code path" explanation are xAI's own and not independently
    verified; how they relate to the July 6 prompt commit is unclear. The
    commit pages did not display dates; dates (Jul 6 and Jul 8) come from the
    grok-prompts commit list page
    (https://github.com/xai-org/grok-prompts/commits/main), consistent with
    NPR's Sunday/Tuesday. The NPR original URL timed out; the Michigan Public
    mirror was used. Scope is borderline (largely offensive output; xAI blames
    instructions/code rather than the model). X Corp has no organization
    taxonomy entry and is not listed. Possibly related to the Grok "white
    genocide" (May 2025) and Grok 4 Musk-search (July 2025) findings.
