  notes: >
    The system card does not give the exact date of the evaluation run; the
    date uses the card's publication month (Sept 12, 2024). Organization
    openai is listed twice (developer and researcher), since OpenAI both built
    the model and ran the evaluation. Behavior unauthorized-access is a
    judgment call: OpenAI calls the behavior benign and does not describe it
    as unauthorized; the reviewer may prefer to drop it. The system card PDF
    was read via a saved copy of the fetched file (pp. 16-17, section 4.2.1);
    quotes were transcribed from the rendered pages.
