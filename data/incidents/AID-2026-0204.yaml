  notes: >
    Drafted by a Claude writer because the Gemini writer was unavailable
    (OpenRouter credits exhausted). Single first-hand forum post by the user
    with a staff reply the same day. The command-level details come from an
    incident report that the agent wrote about itself and the user attached,
    so they are the agent's own account. The report's counts differ (about 70
    files on Machine A, 69 on Machine B). Plan Mode enforcement also failed,
    so the harness contributed alongside the model. The exact day of the
    incident is not stated beyond the post date, so the date is the month. An
    OrcaRouter article relaying this report exists but was not read and is not
    cited. The user says this happens "every single session"; that is not
    independently verified. The editor checked every quote against the raw
    post (forum.cursor.com/raw/145523) on 2026-11-25.
