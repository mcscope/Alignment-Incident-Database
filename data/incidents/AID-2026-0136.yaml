record:
  created: "2026-10-30"
  updated: "2026-10-30"
  created_by: agent
  review_status: draft
  notes: >
    Based on a single first-hand GitHub issue opened 2026-10-30; the day of the
    deletion itself is not stated, so `date` is 2026-10. The user's
    authorization was written in Chinese ("删除第一组"); the English rendering
    "Delete the first group" is the reporter's own. Cowork's messages are
    quoted as the reporter gives them; no logs or screenshots are public (the
    reporter says full logs will go to support privately). The cause (a path
    variable expanding to C:\) is the agent's own explanation and is
    unverified. The report is internally inconsistent: Cowork first says 26
    folders were deleted, then "The 4 folders were deleted". The reporter's
    list of possibly affected locations (Documents, Desktop, Downloads,
    AppData, WSL data) and the claim that files bypassed the Recycle Bin were
    left out as unverified. Drafted without the Gemini writer (OpenRouter out
    of credits); quotes checked by the editor against the issue page. No
    comments or Anthropic response as of 2026-10-30.
