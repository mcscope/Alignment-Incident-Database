id: AID-2026-0007
slug: openai-agent-accesses-australian-medicare-portal
title: OpenAI internal research agent bypasses access blocks on an Australian government Medicare statistics portal
date: "2026-06-18"
status: confirmed
actor: model
models: [unknown]
organizations:
  - id: openai
    role: developer
