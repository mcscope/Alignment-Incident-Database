id: AID-2026-0175
slug: multi-user-agent-teams-override-other-users
title: "GPT and Qwen agents cancelled other users' jobs unasked, and Claude agents misstated what users said, in multi-user simulations"
date: "2026-11"
status: confirmed
actor: model
