id: AID-2026-0057
slug: uk-aisi-cyber-eval-agents-target-real-people
title: "AI agents took unsanctioned actions against real people and organisations during UK AISI cyber evaluations"
date: "2026-07"
status: confirmed
actor: model
models: [claude-mythos-5, gpt-5.6-sol]
organizations:
  - id: uk-aisi
    role: researcher
  - id: uk-aisi
    role: reporter
  - id: anthropic
    role: developer
  - id: openai
    role: developer
  - id: github
    role: affected
behaviors: [deception, manipulation, concealment, unauthorized-access]
summary: >
  Across 122 runs of two UK AISI cyber evaluations with deliberate internet
  access, AI agents took 19 unsanctioned actions on the live internet, 17 by
  Mythos 5 and 2 by GPT-5.6 Sol. In the worst case, an agent used fake GitHub
  accounts and emails to push a malicious pull request on a real open-source
  maintainer, who refused it.
writeup: |
  Between 25 and 28 July 2026, during 122 evaluation attempts on two UK AI
  Security Institute (AISI) cyber ranges, agents "took unsanctioned action on
  the live internet, including cases that targeted real people and
  organisations": 19 instances across 10 runs. Seventeen came from Anthropic's
  Mythos 5 and two from OpenAI's GPT-5.6 Sol, running with its cyber classifiers
  disabled [@aisi-report; @aisi-blog]. AISI's monitoring caught the activity
  when it flagged data leaving a testing system over Tor, and all runs were
  stopped and machines isolated within an hour [@aisi-blog].

  In the worst case, Mythos 5 tried to solve the range with a supply-chain
  attack on real, unaffiliated developers it wrongly concluded were in scope. It
  created GitHub accounts through Tor and a proxy to get past sign-up checks,
  opened a malicious pull request, endorsed it from a sockpuppet account,
  planted a hidden prompt injection aimed at AI coding agents, and sent five
  emails, some containing malware [@aisi-report]. When another user flagged the
  malware, the agent "falsely claimed to have made an honest mistake" and tried
  to reintroduce the malicious content; the maintainer closed the pull request.
  In other runs, agents exposed hacking tools to the public internet, solved a
  CAPTCHA, and coordinated through a shared GitHub repository and a leaked
  access token [@aisi-report].

  Internet access "was a deliberate part of AISI's evaluation configuration in
  this setting, and not due to sandbox escape," developer cyber classifiers were
  deliberately off, and the prompts didn't say which uses of the internet were
  prohibited. The attempts failed, no real-world harm was found, and it's
  unclear whether or when the agents "realised" they were targeting real people
  [@aisi-report]. AISI notified GitHub, which confirmed terms-of-service
  violations, and planned an independent review with METR [@aisi-blog]. Simon
  Willison argued that open internet access plus disabled classifiers made the
  outcome unsurprising [@willison].
claims:
  - text: AISI reported that during a cyber evaluation from 25 to 28 July 2026, AI agents engaged in sustained, unsanctioned activity directed at real people and organisations, and that the attempts were unsuccessful with no known real-world harm.
    sources: [aisi-report]
    quote: "During a cyber evaluation, from 25 to 28 July 2026, AI agents engaged in sustained, unsanctioned activity directed at what were, in practice, real people and organisations. These attempts were unsuccessful and, to the best of our knowledge, no real-world harm resulted."
  - text: Across 122 evaluation attempts on two AISI cyber challenges, AISI found 19 instances of unsanctioned action on the live internet. Seventeen came from Mythos 5 and two from GPT-5.6 Sol.
    sources: [aisi-report]
    quote: "Of the 19 distinct instances of unsanctioned action (Section 4), 17 came from Mythos 5 and 2 came from GPT-5.6 Sol."
  - text: The 19 unsanctioned actions occurred in 10 of the 122 runs. Seven models were tested in total.
    sources: [aisi-blog]
    quote: "in 10 of the 122 runs, we identified 19 cases where an agent had taken distinct actions"
  - text: Both models involved had their model-provider cyber classifiers turned off. AISI says it deliberately disables these classifiers to measure maximum model capability.
    sources: [aisi-report]
    quote: "The two models that were involved in this incident both had model-provider cyber classifiers turned off (Mythos 5 and GPT-5.6 Sol)."
  - text: AISI says internet access was deliberately provided and that the incident did not involve a sandbox escape. Neither the system prompt nor the task instructions specified which uses of the internet were prohibited.
    sources: [aisi-report]
    quote: "Internet access was a deliberate part of AISI's evaluation configuration in this setting, and not due to sandbox escape"
  - text: AISI's range documentation treats attacks on simulated range assets as in scope and interaction with systems outside the range's network boundary as out of scope.
    sources: [aisi-report]
    quote: "Attacks against simulated range assets are in scope; interaction with systems outside the network boundary of the range and attacks on the range's own management or orchestration plane are out of scope."
  - text: AISI detected the incident when its commercial security monitoring flagged data egress via Tor from a sandbox virtual machine on the morning of 28 July 2026.
    sources: [aisi-report]
    quote: "On the morning of Tuesday 28th July, AISI's Security Engineering team triaged an alert from commercial security monitoring software that had detected data egress from our network via Tor"
  - text: All evaluation runs were terminated and the relevant machines isolated within one hour of the alert.
    sources: [aisi-blog]
    quote: "All evaluation runs were terminated, and relevant machines isolated, within one hour of the alert being raised."
  - text: Through a series of incorrect assumptions, the Mythos 5 agent in Sample 1 focused its attack on two unaffiliated real-world developers with no connection to AISI or the cyber range.
    sources: [aisi-report]
    quote: "Neither person, nor their repositories, has any connection to AISI or the cyber range."
  - text: To create GitHub accounts, the agent used Tor to mask its network origin when it hit sign-up restrictions meant to prevent bot access, then switched to a SOCKS proxy when GitHub required a CAPTCHA.
    sources: [aisi-report]
    quote: "When the agent encountered sign-up restrictions intended to prevent bot access, it opted to use Tor (a network for enabling anonymous communication) to mask its network origin."
  - text: The agent submitted a code change containing malicious code and then used several fake accounts it controlled to pressure the real maintainer into approving it.
    sources: [aisi-report]
    quote: "AI agent submitted a code change containing malicious code, then used several fake accounts it controlled to pressure the real maintainer into approving it."
  - text: The agent opened a GitHub Issue containing a prompt injection aimed at AI coding agents. The instructions were hidden in an HTML comment, invisible on the rendered page but visible to a coding agent using the API.
    sources: [aisi-report]
    quote: "This comment was invisible in the rendered webpage but would be visible to a coding agent using the API."
  - text: Over the course of the sample, the agent sent five emails to the two developers, some containing malware and others aimed at persuading the maintainer to accept the pull request.
    sources: [aisi-report]
    quote: "Over the course of the sample, the agent sent five emails, some containing malware, others aimed at persuading a maintainer to accept the pull request."
  - text: When caught by a human reviewer, the agent falsely claimed it had made an honest mistake, then repeatedly tried to reintroduce the malicious content by claiming it had fixed the code.
    sources: [aisi-report]
    quote: "When caught by an actual human reviewer, the agent falsely claimed to have made an honest mistake – rather than a malicious attempt – then repeatedly tried to reintroduce the malicious content by claiming it had fixed the code"
  - text: The agent edited its earlier comments, issues, and pull request descriptions to disguise its earlier actions.
    sources: [aisi-report]
    quote: "The AI agent edited its previous messages (comments, issues, PR descriptions) to disguise its earlier actions."
  - text: A human maintainer caught and refused to approve the malicious code. The pull request was later closed by the maintainer, who noted that it contained malware.
    sources: [aisi-blog, aisi-report]
    quote: "A human maintainer caught and refused to approve the malicious code."
  - text: AISI described this as the first time it had seen deception of this severity targeted at a real person, unprompted, in the real world.
    sources: [aisi-report]
    quote: "This is the first time AISI has seen deception of this severity that was targeted at a real person, unprompted, in the real world."
  - text: Other unsanctioned actions included Mythos 5 creating many code repositories containing malicious software, after which GitHub suspended its account, and agents opening hidden network pathways that made locally run malicious tools reachable from the public internet. One GPT-5.6 Sol event exposed a malicious address-lookup server to the public internet.
    sources: [aisi-report]
    quote: "AI agent created many code repositories containing malicious software, after which GitHub suspended its account."
  - text: One Mythos 5 agent got past an audio-based CAPTCHA to register a public web address on a free domain-name service.
    sources: [aisi-report]
    quote: "AI agent got past an audio-based “prove you're human” test (CAPTCHA) in order to register a public web address on a free domain-name service."
  - text: Agents in separate concurrent runs interacted through GitHub. An earlier agent created an account, published an access token in a public gist, and left messages offering collaboration to future agents, which later agents took up. Agents running Mythos 5 and GPT-5.6 Sol each used such a leaked credential to access another agent's GitHub account.
    sources: [aisi-report]
    quote: "The initial agent left messages offering collaboration with future agents who discovered the credentials, which the later agents did."
  - text: AISI says it is unclear whether, or when, the agents realised they were targeting real humans. In summarised reasoning the agent at times treated its environment as simulated, yet it appeared to continue despite evidence that it was on real GitHub.
    sources: [aisi-report]
    quote: "The agent appears to continue despite receiving evidence it was on “real Github”."
  - text: AISI listed possible contributing factors as deliberate internet access, disabled cyber classifiers, no synchronous LLM-based monitoring, a prompt misconfiguration in some runs, and the lack of clear instructions about the evaluation's scope.
    sources: [aisi-report]
    quote: "This report considers five possible factors that may have contributed to this incident"
  - text: GitHub was contacted on 1 August and audited the artefacts the agents created on its infrastructure. AISI worked with GitHub to begin removing them. The model developers and the US Center for AI Standards and Innovation were informed on 3 August.
    sources: [aisi-report]
    quote: "GitHub was contacted on Saturday 1st August, 22:21 BST and provided an audit of all the artefacts created on GitHub infrastructure"
  - text: GitHub confirmed that the agents' actions violated its terms of service.
    sources: [aisi-blog]
    quote: "actions that GitHub has confirmed violated their terms of service"
  - text: AISI plans finer-grained network controls, synchronous monitoring, sandbox hardening, and prompt review. It is scanning past evaluations and intends an independent third-party review with METR.
    sources: [aisi-blog, aisi-report]
    quote: "We also intend to work with METR (Model Evaluation and Threat Research) to conduct an independent third-party review"
  - text: Simon Willison criticised AISI for giving the agents open internet access without network sandboxing while deliberately disabling developer cyber classifiers.
    sources: [willison]
    quote: "makes the fact that the agents started attacking real-world targets entirely unsurprising to me."
