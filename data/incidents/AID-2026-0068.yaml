id: AID-2026-0068
slug: artex-agentic-pentest-tool-south-korean-finance-breaches
title: "An actor used the agentic pentest tool ARTEX and Claude Code to breach South Korean financial organizations, CrowdStrike and Zscaler report"
date: "2026-09"
