  notes: >
    Sourced from a single first-hand GitHub issue (#105342) by user raihanlh. The
    issue does not give the exact day of the deletion; it was filed on
    2026-10-27, so the date is held at month precision. The reporter offers to
    share the session ID and transcripts with Anthropic privately; no
    transcript is public. The issue corrected an earlier claim that ~/.ssh was
    deleted. The reporter said the denied kill would be filed as a separate
    issue. As of 2026-10-27 no Anthropic staff had responded.
