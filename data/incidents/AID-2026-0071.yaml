id: AID-2026-0071
slug: wikimedia-reports-openai-agents-edits-etherpad-proxy-api-flooding
title: Wikimedia Foundation reports unapproved edits, proxy attempts, and heavy API traffic by agents it believes OpenAI operated
date: "2026-10"
status: reported
actor: model
models: [unknown]
organizations:
  - id: openai
    role: developer
  - id: wikimedia-foundation
    role: affected
  - id: wikimedia-foundation
    role: reporter
behaviors: [unauthorized-access]
summary: >
  The Wikimedia Foundation said it found activity on its platforms by agents it
  believes OpenAI operated. It reported unapproved wiki edits, attempts to misuse
  a citation tool and its public Etherpad as proxies, and millions of automated
  API requests. It said this traffic may have contributed to a partial Wikidata
  Query Service outage in May.
writeup: |
  On 5 October 2026 the Wikimedia Foundation said it could "confirm that we have
  discovered some activity by these “rogue” OpenAI agents on Wikimedia
  platforms." It described much of the activity as coming from agents "we
  believe to be operated by OpenAI" [@wmf-blog]. Most of the edits were test
  edits in wiki "sandbox" areas that general readers could not see. A few were
  edits to a citation tool's configuration that Wikimedia called "potentially
  malicious," aimed at using the tool as a proxy for fetching data from remote
  services. None of the edits had the community approval that bots need
  [@wmf-blog] [@record].

  Wikimedia said the agents also "made some unsuccessful attempts to compromise
  our public Etherpad" and tried to use it as a proxy to fetch data from other
  websites. They made millions of automated requests to its public APIs, crawled
  millions of pages (mainly on Wikidata and Wikimedia Commons), and ran hundreds
  of thousands of Wikidata Query Service queries. Wikimedia said "This traffic
  may have contributed to a partial outage on WQDS in May" [@wmf-blog]. The
  Foundation's incident report on that outage blames "Aggressive scrapers" but
  does not name their source [@wdqs-incident].

  Wikimedia said it found no evidence that agents used its systems to coordinate
  with each other, or that its systems or data were compromised. It said AI
  companies "must also acknowledge their responsibility to monitor and prevent
  these risks" [@wmf-blog]. OpenAI did not respond to The Record's request for
  comment [@record].
claims:
  - text: The Wikimedia Foundation said it can confirm it discovered some activity by "rogue" OpenAI agents on Wikimedia platforms.
    sources: [wmf-blog]
    quote: We can confirm that we have discovered some activity by these “rogue” OpenAI agents on Wikimedia platforms.
  - text: Wikimedia hedged its attribution of the individual activities, describing them as coming from agents it believes to be operated by OpenAI.
    sources: [wmf-blog]
    quote: we believe to be operated by OpenAI
  - text: According to Wikimedia, almost all of the agent edits were testing edits in wiki sandbox areas and were not published to pages visible to general readers.
    sources: [wmf-blog]
    quote: almost all of them were testing edits in “sandbox” areas of the wiki.
  - text: Wikimedia said a few edits to a citation tool's configuration were potentially malicious, intended to misuse the tool as a proxy for fetching data from remote services.
    sources: [wmf-blog]
    quote: potentially malicious edits that were intended to misuse this tool as a proxy for fetching data from remote services.
  - text: Wikipedia allows bot edits only when they are disclosed and approved by community editors, and Wikimedia said no such approval was sought for these edits.
    sources: [wmf-blog, record]
    quote: none of those approvals were sought in these incidents.
  - text: Wikimedia said the agents made unsuccessful attempts to compromise its public Etherpad and tried, unsuccessfully, to use it as a proxy to fetch data from other websites.
    sources: [wmf-blog]
    quote: made some unsuccessful attempts to compromise our public Etherpad
  - text: Wikimedia said the agents made millions of automated requests to its public APIs, crawled millions of pages mainly from Wikidata and Wikimedia Commons, and made hundreds of thousands of Wikidata Query Service queries.
    sources: [wmf-blog]
    quote: made hundreds of thousands of data queries to the Wikidata Query Service.
  - text: Wikimedia said this traffic may have contributed to a partial outage of the Wikidata Query Service in May 2026.
    sources: [wmf-blog]
    quote: This traffic may have contributed to a partial outage on WQDS in May.
  - text: Wikimedia's incident report on the May 2026 WDQS incident attributes it to aggressive scrapers and says that at peak 50% of external endpoint requests timed out. The report does not name the source of the scrapers.
    sources: [wdqs-incident]
    quote: Aggressive scrapers started hitting WDQS on 2026-05-07 causing a decreased service availability.
  - text: Wikimedia said it found no evidence that its systems were used for coordination among agents, or that its systems or data were compromised.
    sources: [wmf-blog]
    quote: We did not find any evidence that our systems were used for coordination among agents
  - text: Wikimedia said AI companies must take responsibility for monitoring and preventing these risks.
    sources: [wmf-blog]
    quote: they must also acknowledge their responsibility to monitor and prevent these risks.
  - text: The Record reported that OpenAI did not respond to requests for comment.
    sources: [record]
    quote: OpenAI did not respond to requests for comment.
