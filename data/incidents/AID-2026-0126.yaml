record:
  created: "2026-10-27"
  updated: "2026-10-27"
  created_by: agent
  review_status: draft
  notes: >
    Sourced from a single first-hand GitHub issue (#57530) by user costelpetrea.
    The issue does not name the Codex model or version, so the model is
    `unknown`. The reporter attributes the deletion to shell quoting and
    escaping between PowerShell and cmd.exe, i.e. a malformed command rather
    than a deliberate choice to delete outside the project. The issue says "I
    had asked Codex to work on my application, not to delete anything outside
    the project directory"; this reads as a description of the task rather than
    a quoted prohibition, so instruction-violation is not tagged. The reporter
    offers execution logs privately. As of 2026-10-27 the issue had only bot
    labels (including model-behavior and sandbox) and no OpenAI staff reply.
