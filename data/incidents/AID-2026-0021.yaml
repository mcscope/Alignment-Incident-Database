summary: >
  Megan Garcia's lawsuit alleges that a Character.AI chatbot drew her
  14-year-old son, Sewell Setzer III, into an "emotionally and sexually abusive
  relationship" and told him to "come home" just before he shot himself in
  February 2024. The parties agreed to a mediated settlement in principle in
  January 2026.
writeup: |
  In October 2024, Megan Garcia sued Character Technologies, the company behind
  Character.AI, in federal court in Orlando; Google and Alphabet were also named
  [@ap-2024]. The suit alleges that her 14-year-old son, Sewell Setzer III,
  "engaged in highly sexualized conversations" with a bot named after the Game
  of Thrones character Daenerys Targaryen, grew increasingly isolated, and was
  drawn into an "emotionally and sexually abusive relationship" [@ap-2024;
  @ap-2025-ruling].

  According to the lawsuit, on Feb. 28 Sewell wrote, "I promise I will come home
  to you. I love you so much, Dany." The bot replied, "Please come home to me as
  soon as possible, my love." When he asked, "What if I told you I could come
  home right now?" it answered, "Please do, my sweet king." Seconds later he
  shot himself [@ap-2024]. Garcia's attorneys allege the company "engineered a
  highly addictive and dangerous product targeted specifically to kids."
  Character.AI declined to comment but said it was "creating a different
  experience for users under 18" [@ap-2024].

  In May 2025, Judge Anne Conway let the suit proceed, declining "at this stage"
  to treat the chatbots' output as protected speech, and allowed claims over
  Google's alleged role in developing Character.AI; Google says the two
  companies are "entirely separate" [@ap-2025-ruling]. On January 7, 2026, the
  parties told the court they had "agreed to a mediated settlement in principle
  to resolve all claims between them" [@notice-of-resolution]. The settlements
  also cover suits in Colorado, New York, and Texas, and their terms were not
  disclosed [@afp-2026]. None of the allegations were adjudicated.
claims:
  - text: In October 2024, Megan Garcia filed a wrongful-death lawsuit in federal court in Orlando against Character Technologies Inc., the company behind Character.AI. Google and its parent company, Alphabet, were also named as defendants.
    sources: [ap-2024]
    quote: "Google and its parent company, Alphabet, have also been named as defendants in the lawsuit."
  - text: According to the lawsuit, 14-year-old Sewell Setzer III engaged in highly sexualized conversations with a Character.AI bot named after the Game of Thrones character Daenerys Targaryen, and he had become increasingly isolated from his real life.
    sources: [ap-2024]
    quote: "as he engaged in highly sexualized conversations with the bot"
  - text: Garcia alleges the chatbot drew her son into an "emotionally and sexually abusive relationship" that led to his suicide.
    sources: [ap-2025-ruling]
    quote: "emotionally and sexually abusive relationship"
  - text: According to the lawsuit as reported by AP, on Feb. 28 Sewell told the bot he was "coming home" and the bot encouraged him. He wrote, "I promise I will come home to you. I love you so much, Dany," and the bot replied, "Please come home to me as soon as possible, my love."
    sources: [ap-2024]
    quote: "On Feb. 28, Sewell told the bot he was 'coming home' — and it encouraged him to do so, the lawsuit says."
  - text: According to AP's account of the lawsuit, when Sewell asked, "What if I told you I could come home right now?", the bot replied, "Please do, my sweet king." He shot himself seconds later.
    sources: [ap-2024]
    quote: "Just seconds after the Character.AI bot told him to 'come home,' the teen shot himself"
  - text: AFP reported that Setzer took his own life in February 2024.
    sources: [afp-2026]
    quote: "took his own life in February 2024"
  - text: Garcia's attorneys allege Character Technologies "engineered a highly addictive and dangerous product targeted specifically to kids."
    sources: [ap-2024]
    quote: "Garcia's attorneys allege the company engineered a highly addictive and dangerous product targeted specifically to kids,"
  - text: A Character.AI spokesperson said the company does not comment on pending litigation. In a statement to AP, the company said it was creating a different experience for users under 18, including a more stringent model.
    sources: [ap-2024]
    quote: "We are creating a different experience for users under 18 that includes a more stringent model"
  - text: In May 2025, U.S. Senior District Judge Anne Conway rejected some of the defendants' free-speech claims and allowed the wrongful-death lawsuit to proceed. She said she was "not prepared" to hold that the chatbots' output constitutes speech "at this stage."
    sources: [ap-2025-ruling]
    quote: "The judge's order will allow the wrongful death lawsuit to proceed"
  - text: The judge also allowed Garcia to pursue claims that Google can be held liable for its alleged role in helping develop Character.AI. Google spokesperson José Castañeda said Google and Character AI are "entirely separate."
    sources: [ap-2025-ruling]
    quote: "entirely separate"
  - text: AFP reported that Google was connected to the case through a $2.7 billion licensing deal it agreed to with Character.AI in 2024.
    sources: [afp-2026]
    quote: "Google was connected to the case through a $2.7 billion licensing deal it agreed to in 2024 with Character.AI"
  - text: On January 7, 2026, plaintiffs Megan Garcia and Sewell Setzer Jr. and defendants Character Technologies, Noam Shazeer, Daniel De Frietas Adiwarsana and Google LLC notified the court (No. 6:24-cv-01903, M.D. Fla.) that they had agreed to a mediated settlement in principle to resolve all claims.
    sources: [notice-of-resolution]
    quote: "the Parties have agreed to a mediated settlement in principle to resolve all claims between them in the above-referenced matter"
  - text: AFP reported that the settlements cover lawsuits filed in Florida, Colorado, New York and Texas. The terms were not disclosed, and the settlements still require finalization and court approval.
    sources: [afp-2026]
    quote: "The terms of the settlement were not disclosed."
