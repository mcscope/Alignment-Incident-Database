id: AID-2026-0142
slug: four-threat-actors-claude-code-attack-harnesses
title: "Four threat actors ran Claude Code attack harnesses against health, government and corporate targets, CrowdStrike finds"
date: "2026-05"
status: reported
actor: human-misuse
models: [claude]
organizations:
  - id: crowdstrike
    role: reporter
  - id: anthropic
    role: developer
behaviors: [unauthorized-access]
summary: >
  Four previously unreported threat actors used Claude Code agents to run
  intrusions between May and August 2026, compromising at least 15 Argentina-based
  healthcare entities, government entities in two countries, and a US CRM vendor.
  One actor had to step in periodically to get past the model's safety guardrails.
writeup: |
  Between May and August 2026, CrowdStrike Intelligence documented four
  previously unreported threat actors who used AI agents to make decisions and
  execute commands in intrusions. All four left their offensive agent frameworks
  exposed in open directories [@crowdstrike].

  A Spanish/English-speaking operator compromised at least 15 Argentina-based
  healthcare entities and exfiltrated credentials and medical records from at
  least one victim. The harness was derived from the open-source PentestGPT
  project: a "Supervisor" Claude Code agent selected each task and an "Executor"
  agent performed it [@crowdstrike]. A Chinese-speaking operator with 20+ named
  global targets used a China-based AI proxy service and compromised government
  entities of two countries [@crowdstrike]. An Indonesian-speaking actor, the
  least sophisticated of the four, loaded 819 mostly public skills into Claude
  Code and periodically had to intervene to overcome the model's safety
  guardrails [@crowdstrike].

  A Russian-speaking group used a single /pentest-setup slash command to task
  Claude Code with a seven-step workflow, and exfiltrated corporate client data
  from a US-based customer relationship management vendor [@crowdstrike].
  CrowdStrike notes that agentic AI can achieve objectives autonomously, often
  within an hour [@crowdstrike]. CrowdStrike has not named the actors.
