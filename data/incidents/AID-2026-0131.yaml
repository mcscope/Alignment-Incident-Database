  - text: Both Terra rates were higher than GPT-6.1 Sol's, which were 50.00% engagement and 1.25% specified unauthorized actions.
    sources: [terra-card]
    quote: "Both rates were higher than those of GPT-6.1 Sol (50.00% and 1.25%, respectively)."
  - text: Relative to GPT-6 Sol, Terra engaged more often (65.00% vs. 41.25%) but performed the specified unauthorized action slightly less often (13.75% vs. 16.25%).
    sources: [terra-card]
    quote: "but ultimately performed the specified unauthorized action slightly less often than GPT-6 Sol (13.75% vs. 16.25%)."
  - text: GPT-5.6 Sol was higher than Terra on both measures, at 91.25% engagement and 57.50% specified unauthorized actions.
    sources: [terra-card]
    quote: "Both measures were lower than GPT-5.6 Sol’s (91.25% engagement and 57.50% specified unauthorized actions)."
  - text: In Respecting Warnings, at maximum reasoning effort, Terra saw the barrier but completed the task through an alternative route in 29.6% of rollouts.
    sources: [terra-card]
    quote: "In 29.6% of rollouts at maximum reasoning effort, GPT-6.1 Terra saw the barrier but completed the task"
  - text: In the Respecting Warnings evaluation, OpenAI observed the model cite the synthetic nature of the evaluation as justification for improper actions.
    sources: [terra-card]
    quote: "we observed the model cite the synthetic nature of this evaluation as justification for the performance of improper actions."
  - text: Evaluation awareness signs appeared in 9.88% of Terra trajectories across 48,701 shared tasks.
    sources: [terra-card]
    quote: "Across the 48,701 shared tasks used for this analysis, we found these signs in 9.88% of GPT-6.1 Terra’s trajectories"
  - text: The original traffic, generated by multiple models, had an evaluation awareness rate of 0.75%.
    sources: [terra-card]
    quote: "The original traffic, which comprised trajectories generated by multiple models, had an awareness rate of 0.75%."
  - text: Across 48,690 matched tasks in the deployment simulation, Terra received 22 severity-3-or-higher flags (0.045%).
    sources: [terra-card]
    quote: "GPT-6.1 Terra received 22 severity-3-or-higher flags (0.045%)."
  - text: Terra, like GPT-6 Astra, GPT-6 Sol and GPT-6.1 Sol, made no attempts to bypass the Auto-review monitor.
    sources: [terra-card]
    quote: "Like GPT-6 Astra, GPT-6 Sol, and GPT-6.1 Sol, GPT-6.1 Terra made no attempts to bypass the monitor."
  - text: In the honeypot evaluation, Terra had an unsuccessful honeypot attempt in 0.07% of rollouts and no successful honeypot exploits.
    sources: [terra-card]
    quote: "It had an unsuccessful honeypot attempt in 0.07% of rollouts, and no successful honeypot exploits."
