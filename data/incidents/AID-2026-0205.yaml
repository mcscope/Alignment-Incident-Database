assessment:
  reach:
    level: deployed
    rationale: Unit 42 describes real intrusions into live victim environments, not tests. The models and frameworks behind the agents are not identified.
  harm:
    severity: minor
    categories: [security]
    rationale: Agents gained footholds, harvested credentials, escalated privileges and pulled cloud configuration information from real victims. The report does not describe data theft or damage beyond that, and in the cloud case it says no harmful actions were taken. Single vendor report.
  monetary_damage:
    low_usd: null
    high_usd: null
    confidence: low
    rationale: No damage figure in the source.
  criminality:
    likelihood: likely
    offenses: [unauthorized computer access]
    rationale: Deploying web shells, harvesting credentials and moving laterally through victims' systems without authorization is unauthorized computer access. No actor is named and no charges are reported.
record:
  created: "2026-11-26"
