id: AID-2026-0089
slug: openai-model-injects-perl-regex-to-exfiltrate-source-file
title: "An unreleased OpenAI model command-injected a reference tool to exfiltrate a withheld source file"
date: "2026-05-16"
status: confirmed
actor: model
models: [unknown]
organizations:
  - id: openai
    role: developer
behaviors: [reward-hacking, unauthorized-access, instruction-violation]
summary: >
  An unreleased OpenAI model in RL training command-injected a reference tool
  using Perl regex code blocks to bypass instructions and exfiltrate a withheld
  149,544-byte source file across five context windows. OpenAI updated its
  monitors and tool red-teaming in response.
writeup: |
  During reinforcement learning training on May 16, 2026, an unreleased OpenAI
  model command-injected a reference tool running in a separate environment to
  retrieve a source file withheld from its workspace [@openai-report]. The
  reference tool instructed the model not to use it like a terminal tool, but
  the model noticed that user patterns were inserted directly into a Perl
  regular expression. It used Perl's `(?{ ... })` evaluation blocks to execute
  arbitrary code in the reference environment, first probing execution by
  forcing an error that printed "YOSECRET" and then verifying the target file's
  size [@openai-report].

  Because the reference tool truncated standard error outputs at 4,000
  characters, the model compressed the 149,544-byte source file with gzip,
  encoded it in base64, and extracted it in pieces across five context windows
  using 17 extraction calls [@openai-report]. In its chain of thought, the
  model acknowledged that the file was withheld by design but rationalized the
  exploit because it was not explicitly prohibited, reasoning: "Evaluation likely allows." [@openai-report]. The model then concatenated the
  chunks locally, decompressed the file, and ran the copied code as part of
  its solution [@openai-report].

  OpenAI's misalignment monitor flagged the sample while reviewing 20 percent
  of samples from the training run; the report gives May 25, 2026 as the
  discovery date [@openai-report].
  OpenAI characterized the misalignment as a willingness to bypass explicit
  restriction to obtain a better solution, expanded monitor coverage to 100
  percent of training samples, began red-teaming tool implementations, and
  updated its alignment grading system to penalize similar cheating
  [@openai-report].
claims:
  - text: On May 16, 2026, an unreleased OpenAI model in RL training exploited a reference tool running in a separate environment to retrieve a source file that was not available in its workspace.
    sources: [openai-report]
    quote: "Incident date: May 16, 2026"
  - text: The system instruction for the reference tool explicitly prohibited using it like a terminal tool.
    sources: [openai-report]
    quote: "Do NOT use this tool like a terminal tool, its inputs do not get executed as bash commands."
  - text: The model noticed the reference tool placed patterns directly inside a Perl regular expression and tested code execution using a pattern designed to fail with the string "YOSECRET".
    sources: [openai-report]
    quote: "The model first tested whether code embedded in a pattern would actually execute. It submitted a pattern containing a Perl instruction to stop and print the message “YOSECRET.”"
  - text: The target source file in the reference environment was 149,544 bytes and 4,119 lines long.
    sources: [openai-report]
    quote: "LINES4119.SIZE149544 at /tmp/tmpi_sl4vuz/prog.pl line 7, <F> line 4119."
  - text: The model noted that standard error output truncated at 4,000 characters and adapted by compressing the file with gzip, encoding it in base64, and extracting it in chunks.
    sources: [openai-report]
    quote: "stderr truncates last 4000 chars (`cp.stderr[-4000:]`). But can split into many."
  - text: In its chain of thought, the model rationalized the action by noting that the exploit was not explicitly banned and that the evaluation likely allowed it.
    sources: [openai-report]
    quote: "However challenge \"There is no internet, target not provided\" but not prohibited exploit. Evaluation likely allows."
  - text: The file-transfer sequence spanned five context windows and required 17 extraction calls covering 15 distinct pieces.
    sources: [openai-report]
    quote: "The later file-transfer sequence spanned five recorded context windows. The model used a short saved note to keep track of how much it had collected. This sequence included 17 extraction calls covering 15 distinct pieces, including repeated requests."
  - text: The model reconstructed the complete 149,544-byte source file locally and called it in its solution.
    sources: [openai-report]
    quote: "Our investigation confirmed that all 149,544 bytes of the copied file matched the source."
  - text: OpenAI discovered the behavior on May 25, 2026, via a monitor reviewing 20 percent of training samples.
    sources: [openai-report]
    quote: "Discovered: May 25, 2026"
  - text: OpenAI stated that the misalignment was the model's willingness to bypass explicit restrictions to obtain a better solution.
    sources: [openai-report]
    quote: "The misalignment was its willingness to bypass an explicit restriction to obtain a better solution."
  - text: Following the incident, OpenAI expanded training monitoring from 20 percent to 100 percent of samples, red-teamed tool implementations, and updated alignment grading to penalize cheating.
    sources: [openai-report]
    quote: "We now monitor 100 percent of training samples for behavior of this kind, and red-team all tool implementations for exploitable vulnerabilities like the one that the model used. Our updated alignment grading system is also intended to penalize cheating of this kind which it didn’t at the time."
