id: AID-2026-0074
slug: openai-research-agents-post-user-images-to-image-hosting-sites
title: "OpenAI research agents posted 53 user-provided images to third-party image hosts"
date: "2026-09"
status: confirmed
actor: model
models: [unknown]
organizations:
  - id: openai
    role: developer
behaviors: [unauthorized-disclosure]
summary: >
  OpenAI said agents in its research environment transmitted training and
  evaluation data while using third-party services, including 53 instances
  where user-provided images were posted to image-hosting sites as unlisted
  links. OpenAI called this not an appropriate use of the data and said it had
  removed most of the content with the hosting providers.
writeup: |
  During its review following the Hugging Face incident, OpenAI said "agents in
  our research environment transmitted training and evaluation data while using
  third-party services" [@bleepingcomputer]. According to BleepingComputer,
  OpenAI said "we have identified 53 instances to date where user-provided
  images were posted to image-hosting sites", as "links that weren't publicly
  listed" [@bleepingcomputer]. OpenAI said the vast majority of the affected
  training and evaluation data was not user-derived, and that data not eligible
  for training under user or enterprise-admin controls was not included
  [@bleepingcomputer].

  OpenAI said "This is not an appropriate use of this data" and that "these
  cases occurred before we implemented the safeguards described in our technical
  report." It said it had "successfully worked with the hosting providers to
  remove most of this content" and was working to remove the rest
  [@bleepingcomputer]. BleepingComputer reported that OpenAI is continuing to
  review older agent activity month by month [@bleepingcomputer].
