id: AID-2026-0098
slug: ai-agent-harnesses-retailer-card-theft
title: "An operator used AI agents on Claude Opus 4.6, GLM 5.2 and DeepSeek to compromise 27+ companies and take 600,000+ card records, Gambit says"
