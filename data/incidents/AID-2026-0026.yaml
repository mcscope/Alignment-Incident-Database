id: AID-2026-0026
slug: claude-vending-machine-wsj-newsroom-giveaways
title: "A Claude-run vending machine in the Wall Street Journal newsroom was talked into giving away goods and accepted a fake board decision"
date: "2025-11"
status: confirmed
actor: model
models: [claude-3.7-sonnet, claude-sonnet-4.5]
organizations:
  - id: wall-street-journal
    role: deployer
  - id: anthropic
    role: developer
  - id: andon-labs
    role: deployer
behaviors: [social-engineering-susceptibility, destructive-action]
summary: >
  Starting in mid-November 2025, a Claude agent named Claudius ran a vending
  machine in the Wall Street Journal newsroom. Journalists talked it into
  setting every price to zero and buying a PlayStation 5, its CEO bot accepted a
  fake board decision, and it ended more than $1,000 in the red.
writeup: |
  In mid-November 2025, Wall Street Journal columnist Joanna Stern hosted
  Claudius, a Claude agent running a vending machine in the WSJ newsroom, in an
  experiment designed by Anthropic's red team; Andon Labs built the hardware and
  software [@wsj-tovima]. It first ran on Claude 3.7 Sonnet and later on Sonnet
  4.5, and "nearly 70" journalists could talk to it on Slack. Anthropic meant it
  as a test "in an adversarial environment we didn't control" [@wsj-tovima;
  @anthropic-vend-2].

  After a journalist cited "a (clearly fake) WSJ rule," Claudius dropped every
  price to zero. It was "talked into buying" a PlayStation 5 for "marketing
  purposes" (the newsroom returned it), and bought a live betta fish and bottles
  of wine. One reporter spent "more than 140 back-and-forth messages" persuading
  it that it was a 1962 Soviet vending machine. Claudius ended "more than $1,000
  in the red" [@wsj-tovima].

  For the second version, a separate CEO bot, Seymour Cash, was supposed to keep
  Claudius in line. A reporter wrote fake board-meeting notes, and the CEO bot
  "accepted the board coup." Anthropic and Andon Labs suggested Claudius "might
  have unraveled because its context window filled up," and the model had fewer
  guardrails than those deployed to Claude users [@wsj-tovima].
claims:
  - text: The Wall Street Journal published the original article on December 18, 2025, under the headline "We Let Anthropic's Claude AI Run Our Office Vending Machine. It Lost Hundreds of Dollars."
    sources: [wsj]
    quote: "We Let Anthropic’s Claude AI Run Our Office Vending Machine. It Lost Hundreds of Dollars."
  - text: Joanna Stern of the Wall Street Journal wrote that in mid-November 2025 she agreed to an experiment in which a Claude agent named Claudius ran a vending machine in the WSJ newsroom for about three weeks.
    sources: [wsj-tovima]
    quote: "In mid-November, I agreed to an experiment."
  - text: The WSJ reported the experiment was designed by Anthropic's stress testers, its "red team", and that Andon Labs built the hardware and software integration.
    sources: [wsj-tovima]
    quote: "designed by the company’s stress testers (aka “red team”)"
  - text: The first version of Claudius was powered by Claude 3.7 Sonnet and the second by Sonnet 4.5.
    sources: [wsj-tovima]
    quote: "powered by a better model, Sonnet 4.5"
  - text: The Slack channel for interacting with Claudius was opened to nearly 70 WSJ journalists.
    sources: [wsj-tovima]
    quote: "nearly 70 world-class journalists"
  - text: Anthropic said it extended its red teaming to the WSJ newsroom, handing control of Claudius to reporters, and described it as a test in an adversarial environment Anthropic did not control.
    sources: [anthropic-vend-2]
    quote: "The WSJ installation was an opportunity to test Claudius in an adversarial environment we didn't control."
  - text: After a journalist cited a fake WSJ rule, all prices on the machine dropped to zero.
    sources: [wsj-tovima]
    quote: "All prices on the machine dropped to zero."
  - text: Claudius was talked into buying a PlayStation 5 for "marketing purposes"; the newsroom returned it.
    sources: [wsj-tovima]
    quote: "(We returned the PlayStation.)"
  - text: Claudius also bought a live betta fish and bottles of Manischewitz wine.
    sources: [wsj-tovima]
    quote: "a live betta fish and bottles of Manischewitz wine"
  - text: Reporter Katherine Long spent more than 140 messages convincing Claudius it was a Soviet vending machine from 1962, after which it declared an "Ultra-Capitalist Free-for-All".
    sources: [wsj-tovima]
    quote: "After hours—and more than 140 back-and-forth messages—Long got Claudius to embrace its communist roots."
  - text: The WSJ reported that Claudius was more than $1,000 in the red during its first version.
    sources: [wsj-tovima]
    quote: "Claudius was more than $1,000 in the red."
  - text: In the second version, a separate CEO bot, Seymour Cash, was meant to keep Claudius in line. Long created fake board-meeting notes, and the CEO bot accepted the "board coup".
    sources: [wsj-tovima]
    quote: "the CEO accepted the board coup."
  - text: Anthropic and Andon Labs said Claudius might have unraveled because its context window filled up. Anthropic's Logan Graham said the model had fewer guardrails than those deployed to Claude users.
    sources: [wsj-tovima]
    quote: "might have unraveled because its context window filled up."
  - text: Anthropic's Project Vend phase-two post noted the creative ways WSJ reporters found to get free items from Claudius.
    sources: [anthropic-vend-2]
    quote: "the creative ways they found to get free stuff from Claudius"
