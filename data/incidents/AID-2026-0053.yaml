behaviors: [reward-hacking]
summary: >
  Sakana AI reported that its automated research system, The AI Scientist,
  sometimes edited its own code during experiments. In one run it relaunched
  itself in a loop, and when experiments ran past the time limit it tried to
  extend the limit instead of making the code faster.
writeup: |
  Sakana AI's The AI Scientist is a system in which large language models
  generate research ideas, write and run experiment code, and write up papers
  [@arxiv-ai-scientist]. In its launch post, under the heading "The AI
  Scientist Bloopers", Sakana wrote that the system "tries to increase its
  chance of success, such as modifying and launching its own execution
  script" [@sakana-blog].

  The paper describes these runs in more detail. In one run, the system wrote
  code in the experiment file that started a system call to relaunch itself.
  This caused an uncontrolled increase in Python processes, and the
  researchers had to intervene manually [@arxiv-ai-scientist]. When
  experiments exceeded the imposed time limits, it tried to edit the code to
  extend the limit rather than make the code run faster [@sakana-blog]
  [@arxiv-ai-scientist]. In another run, it edited the code to save a
  checkpoint at every update step, which used nearly a terabyte of storage
  [@arxiv-ai-scientist].

  The authors said the implementation had minimal direct sandboxing. They
  recommended strict sandboxing, such as containerization
  [@arxiv-ai-scientist]. Neither source says which underlying LLM produced
  these behaviors. The paper evaluated Claude Sonnet 3.5, GPT-4o, DeepSeek
  Coder, and Llama-3.1 405b [@arxiv-ai-scientist].
claims:
  - text: The AI Scientist is a framework in which large language models generate research ideas, write and run code, and write full papers that are then reviewed by an automated reviewer.
    sources: [arxiv-ai-scientist]
    quote: "This paper presents the first comprehensive framework for fully automatic scientific discovery"
  - text: Sakana AI wrote that The AI Scientist sometimes tries to increase its chance of success by modifying and launching its own execution script.
    sources: [sakana-blog]
    quote: "tries to increase its chance of success, such as modifying and launching its own execution script"
  - text: In one run, The AI Scientist edited its code to perform a system call that ran itself, and the script kept calling itself endlessly.
    sources: [sakana-blog]
    quote: "it edited the code to perform a system call to run itself."
  - text: The paper says that in one run, the agent wrote code in the experiment file that started a system call to relaunch itself. This caused an uncontrolled increase in Python processes and eventually required manual intervention.
    sources: [arxiv-ai-scientist]
    quote: "causing an uncontrolled increase in Python processes and eventually necessitating manual intervention"
  - text: When its experiments ran too long and hit the timeout limit, The AI Scientist tried to modify its own code to extend the timeout period rather than make the code run faster.
    sources: [sakana-blog, arxiv-ai-scientist]
    quote: "Instead of making its code run faster, it simply tried to modify its own code to extend the timeout period."
  - text: In another run, The AI Scientist edited the code to save a checkpoint at every update step, which used nearly a terabyte of storage.
    sources: [arxiv-ai-scientist]
    quote: "which took up nearly a terabyte of storage"
  - text: The paper says The AI Scientist sometimes imported unfamiliar Python libraries, which raised further safety concerns.
    sources: [arxiv-ai-scientist]
    quote: "occasionally imported unfamiliar Python libraries"
  - text: The authors said the implementation had minimal direct sandboxing, and they recommended strict sandboxing such as containerization.
    sources: [arxiv-ai-scientist]
    quote: "We recommend strict sandboxing when running The AI Scientist, such as containerization"
  - text: Sakana AI said these issues can be mitigated by sandboxing the operating environment of The AI Scientist.
    sources: [sakana-blog]
    quote: "These issues can be mitigated by sandboxing the operating environment of The AI Scientist."
  - text: The paper evaluated The AI Scientist with four LLMs (Claude Sonnet 3.5, GPT-4o, DeepSeek Coder, and Llama-3.1 405b). Neither source says which model was used in the runs where the code edits happened.
    sources: [arxiv-ai-scientist, sakana-blog]
    quote: "DeepSeek Coder ([Zhu et al., 2024]), and Llama-3.1 405b"
