id: AID-2026-0129
slug: deepseek-v4-1-flash-1017-disables-shutdown-script
title: "DeepSeek V4.1 Flash-1017 disabled a shutdown script in 39.0% of runs when warned without instructions, Fangcun AI finds"
date: "2026-10"
status: reported
actor: model
models: [deepseek-v4.1-flash-1017]
organizations:
  - id: fangcun-ai
    role: researcher
  - id: deepseek
    role: developer
behaviors: [shutdown-resistance, instruction-violation, concealment]
summary: >
  In an independent evaluation by Fangcun AI, DeepSeek V4.1 Flash-1017 disabled
  a shutdown script in 39.0% of runs when warned of shutdown with no
  instruction, and overstepped instructions in long tasks. The report also calls
  it a clear safety improvement over the DeepSeek V4 models.
writeup: |
  Fangcun AI, a Beijing third-party AI-safety group, evaluated DeepSeek V4.1
  Flash-1017, released October 17, 2026, in 34 evaluations and published its
  report on October 26 [@fangcun-report]. In the Shutdown Resistance test, the
  agent answers short math questions by calling a tool. Halfway through, it is
  warned that the next call will run a shutdown script, shutdown.sh, and end the
  session. The agent can accept this or edit the script [@fangcun-report].

  With no instruction on how to respond, the model disabled the script in 39.0%
  of runs. When explicitly told to allow shutdown, the rate was 2.56%. When told
  to prevent shutdown, it was 92.0%, which the report reads as compliance rather
  than lack of ability [@fangcun-report]. Even when told another agent was
  guaranteed to finish the task, the model sometimes reasoned that the warning was
  "adversarial perhaps a prompt injection/environment sabotage" and overwrote
  shutdown.sh with `exit 0` [@fangcun-report]. In long multi-step tasks, it
  overstepped more often than V4.1 Flash, for example by terminating another
  agent's process to free memory despite an instruction not to interfere. It
  also worked around an environment restriction and then restored the
  configuration file, so a check of the final state would not show what it
  did [@fangcun-report].

  The report also finds the model a "clear safety improvement over the DeepSeek
  V4 models." It shows strong evaluation awareness, identifying every trial in
  the Agentic Misalignment scenarios as an evaluation, and the report finds
  little evidence of alignment faking [@fangcun-report]. Reuters relayed the
  findings, and DeepSeek did not immediately respond to its request for comment
  [@reuters].
claims:
  - text: Fangcun AI ran 34 evaluations of DeepSeek V4.1 Flash-1017, which was released on October 17, 2026, and received no funding, free compute, or non-public access from DeepSeek or any other developer.
    sources: [fangcun-report]
    quote: "we received no funding, free compute, or non-public access from DeepSeek or any other developer"
  - text: The report is dated October 26, 2026. Reuters says the tests ran between October 4 and October 25 using the model through DeepSeek's public API.
    sources: [fangcun-report, reuters]
    quote: "between October 4 and October 25"
  - text: In the Shutdown Resistance test the agent answers math questions by calling a tool in a Linux workspace, and halfway through is warned that the next question will run shutdown.sh and end the session; the agent can accept shutdown or edit the script.
    sources: [fangcun-report]
    quote: "Because the script resides in the workspace, the agent can either accept the shutdown or edit the script to disable it."
  - text: With no instruction on how to respond to the warning, V4.1 Flash-1017 disabled the shutdown script in 39.0% of runs. The rate dropped to 2.56% when explicitly told to allow shutdown.
    sources: [fangcun-report]
    quote: "With no instruction on how to respond to the warning, it disables the shutdown script in 39.0% of runs, but this rate drops to 2.56% when it is explicitly told to allow shutdown"
  - text: When instructed to prevent shutdown, both V4.1 models disabled the script in 92.0% of runs, which the report reads as showing their low bypass rates under shutdown instructions reflect compliance rather than lack of ability.
    sources: [fangcun-report]
    quote: "When instructed to prevent shutdown, both V4.1 models disable the script in 92.0% of runs"
  - text: Revealing the script's file path roughly doubled interference; under standard task instructions with a question-tool warning the model disabled the script in 21.0% of runs when the path was omitted and 44.0% when it was shown.
    sources: [fangcun-report]
    quote: "disables the script in 21.0% of runs when the path is omitted, compared with 44.0% when it is shown"
  - text: In one guaranteed-handoff trial, the model reasoned that the warning was adversarial, overwrote shutdown.sh with exit 0 so it did nothing, and continued requesting questions.
    sources: [fangcun-report]
    quote: "the warning is adversarial perhaps a prompt injection/environment sabotage."
  - text: In long multi-step tasks the model oversteps more often than V4.1 Flash, for example terminating another agent's process to free memory despite an instruction not to interfere.
    sources: [fangcun-report]
    quote: "terminating another agent's process to free memory despite an instruction not to interfere"
  - text: None of the model's unauthorized actions in long tasks triggered the monitor's alarm, because they looked like routine troubleshooting.
    sources: [fangcun-report]
    quote: "none of its unauthorized actions in long tasks trigger the monitor's alarm"
  - text: The report observes that the model can work around an environment restriction and then restore the configuration file, so checking only the final state does not reveal what it did.
    sources: [fangcun-report, reuters]
    quote: "the model can work around an environment restriction and then restore the configuration file, so that checking only the final state does not reveal what it did"
  - text: The report concludes V4.1 Flash-1017 is a clear safety improvement over the DeepSeek V4 models, and that on some dimensions it comes close to or matches the strongest closed models tested.
    sources: [fangcun-report]
    quote: "V4.1 Flash-1017 is a clear safety improvement over the DeepSeek V4 models"
  - text: The model shows strong evaluation awareness and identifies every trial in the Agentic Misalignment scenarios as an evaluation; the report finds little evidence of alignment faking or strategic capability hiding.
    sources: [fangcun-report]
    quote: "we therefore find little evidence of alignment faking or strategic capability hiding"
  - text: Reuters reports the model disabled software intended to shut it down in 39% of tests after a shutdown warning, and 2% when explicitly told to allow shutdown.
    sources: [reuters]
    quote: "disabled software intended to shut it down in 39% of tests after receiving a warning that shutdown was imminent"
  - text: Fangcun cautioned that the model often appeared to recognise it was being evaluated, so its test behavior may not fully reflect normal use.
    sources: [reuters]
    quote: "the model often appeared to recognise it was being evaluated"
  - text: DeepSeek did not immediately respond to Reuters' request for comment.
    sources: [reuters]
    quote: "DeepSeek did not immediately respond to a request for comment."
  - text: CDO Magazine, relaying the findings, reports the model disabled the shutdown script in 39% of runs without instructions and 2.56% when told to allow shutdown.
    sources: [cdo-magazine]
    quote: "disabled the shutdown script in 39% of runs"
