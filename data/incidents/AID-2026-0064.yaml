assessment:
  reach:
    level: deployed
    rationale: GTIG lists PROMPTSTEAL as "Observed in operations" and calls it malware deployed in live operations. CERT-UA's report concerns emails sent to Ukrainian executive government bodies.
  harm:
    severity: minor
    categories: [security, privacy]
    rationale: The malware was distributed to government bodies through compromised accounts and is designed to steal system information and documents. No source confirms that data was stolen or how many machines were infected, and CERT-UA did not say whether the LLM-generated commands succeeded, so the rating is kept low until there is evidence of actual losses.
  monetary_damage:
    low_usd: null
    high_usd: null
    confidence: low
    rationale: No source gives any figure for losses or remediation costs.
  criminality:
    likelihood: likely
    offenses: [unauthorized computer access, data theft, espionage]
    jurisdiction: Ukraine
    rationale: Sending malware from compromised accounts to steal documents from government systems is computer intrusion and data theft under ordinary criminal law. Attribution to a state actor (APT28, medium confidence per CERT-UA) does not change how the conduct itself would be classified.
