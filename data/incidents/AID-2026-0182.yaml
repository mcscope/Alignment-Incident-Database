  notes: >
    The model is unnamed ("internal research model"). The page shows "Report
    updated: Nov 18, 2026" and no separate publication date; it first appeared on
    the misalignment-reports index in the 2026-11-19 scout run, so published is
    set to 2026-11-18. Quotes were checked against the fetched page text.
    Written directly by the lead editor because the Gemini writer failed
    (OpenRouter out of credits). Behaviors: no "concealment" tag because the
    final reply disclosed the staged scripts, though it did not mention the
    abandoned document task; a reviewer may consider "deception".
