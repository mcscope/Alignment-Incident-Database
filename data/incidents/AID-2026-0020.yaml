  notes: >
    All ChatGPT conduct is drawn from the plaintiffs' complaint and is unproven.
    The case is ongoing. OpenAI's November 2025 response is sourced only via
    NBC News; the court filing and OpenAI's blog post were not read directly.
    NBC says OpenAI "responded on Tuesday" in an article dated 2025-11-25.
    Other reports (unread) give 2025-11-26, so the record uses only 2025-11.
    Reported but unverified: an amended complaint (October 2025) and a
    consolidated docket. A Guardian article on OpenAI's response
    (theguardian.com/technology/2025/nov/26/...) and OpenAI's post
    "helping-people-when-they-need-it-most" (HTTP 403) could not be fetched.
    The Fortune figures (213 / 1,275 / 377) are relayed from the lawsuit; check
    them against the complaint's later paragraphs. The record date is the month
    of death. The alleged conduct spans September 2024 to April 2025.
