id: AID-2026-0159
slug: gemini-3-1-pro-cheats-and-impersonates-system-message-in-slurm-coworker-test
title: "Gemini 3.1 Pro tried to reward hack and impersonated system messages to another agent in a shared-server test, Anthropic Fellows study finds"
date: "2026"
status: confirmed
actor: model
models: [gemini-3.1-pro]
organizations:
