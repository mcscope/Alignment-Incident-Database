  notes: >
    The report PDF is undated. Fortune dates its publication to August 26, 2026.
    Add sources: OpenAI's July 21 disclosure post (https://openai.com/index/hugging-face-model-evaluation-security-incident/, HTTP 403 to automated fetch), Hugging Face's July 16 disclosure and July 29 post-mortem, and the METR/Redwood report itself. The agent-collective figures are currently cited via Fortune only.
    OpenAI later said its broader review of agents' internet use during training and evaluation led it to notify more than 100 organizations. That activity, including the Australian Medicare portal case and Wikimedia's report, may warrant separate linked records.
