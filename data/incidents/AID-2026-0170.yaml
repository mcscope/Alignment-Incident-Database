  notes: >
    Everything about ChatGPT's behavior is an allegation from the plaintiff's
    own complaint, which was read (pages 1-20 of the PDF; later pages, including
    the individual causes of action, were not read). The document carries no
    case number or filing stamp; the 2 November 2026 date comes from the PDF
    filename and the Clarkson press release, which is advocacy. The complaint
    says a Danish bailiff's court and the Eastern High Court ruled against him,
    and says a Rent Tribunal claim filed in April 2026 is still pending. The
    DR article has no visible publication date (only "yesterday at 13:00"), so
    `published` is omitted. DR was read in English via a fetch tool summary and
    is paraphrased, not quoted, because Danish quotes were not verified
    verbatim. The press-release quote was obtained via a fetch tool and not
    re-checked against the raw page. Complaint quotes were checked against the
    rendered PDF pages; curly quotation marks were avoided inside quotes. The
    date 2025-05-28 is the stop-paying-rent advice; the alleged behavior spans
    March to November 2025. Harm severity is an editorial estimate; a reviewer
    should confirm.
