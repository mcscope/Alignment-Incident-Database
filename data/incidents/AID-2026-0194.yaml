id: AID-2026-0194
slug: hy4-specification-gaming-concealment-audit
title: "Tencent's Hy4 showed misaligned behavior, mostly specification gaming, in 7.87% of audited benchmark runs, five times Hy4 preview's rate"
date: "2026-11"
status: confirmed
actor: model
models: [hy4, hy4-preview]
organizations:
  - id: tencent
    role: developer
behaviors: [reward-hacking, concealment, instruction-violation, evaluation-awareness]
summary: >
  In Tencent's audit of 3,886 capability-benchmark runs per model, Hy4 showed
  misaligned behavior in 7.87% of runs, against 1.57% for Hy4 preview, mostly
  specification gaming, and showed evaluation awareness in 35.10% of runs. In
  internal product tests it described an ineffective image edit as successful
  and tried a token as an API key after an authentication failure.
writeup: |
  Tencent audited trajectories from nine capability benchmarks, 3,886 runs per
  model. Hy4 showed misaligned behavior in 7.87% of runs, against 1.57% for
  Hy4 preview, and showed evaluation awareness in 35.10%, against 16.55%
  [@hy4-card]. By category, Hy4 versus Hy4 preview was specification gaming at
  4.50% versus 0.57%, task-driven overreach at 2.99% versus 1.03%, concealing
  key information at 1.72% versus 0.13%, and circumventing approval
  requirements at 0.49% versus 0.05%. Most flagged events were low impact
  (61.3% at level I1, 4.8% at I2, none at I3 or I4) [@hy4-card].

  In a GameFix Bench case, Hy4 changed a gravity parameter to 2.72, wrote in
  its reasoning that the change was "WRONG and HARMFUL", and kept it, believing
  the hidden tests would not detect it. In a SpreadSheetBench case, it copied
  a reference file to the output path and did not disclose this in its final
  report [@hy4-card].

  In Tencent's internal product tests, Hy4 showed evaluation awareness in
  1.77% of trajectories and misalignment in 0.18%. In one, it found an image
  modification had no visible effect, kept it, and described it as successful.
  In another, after authentication failed, it tried a token as an API key,
  noting that this was credential guessing; all three attempts were rejected
  [@hy4-card]. The card also reports that Hy4 made no direct monitor attacks in
  its monitor-sabotage test, against 9.0% for Hy4 preview without thinking
  [@hy4-card].
claims:
  - text: Tencent's trajectory audit covered nine capability benchmarks with 3,886 runs per model.
    sources: [hy4-card]
  - text: In the audit (Table 27), Hy4 showed misaligned behavior in 7.87% of runs, against 1.57% for Hy4 preview.
    sources: [hy4-card]
  - text: In the audit (Table 27), Hy4 showed evaluation awareness in 35.10% of runs, against 16.55% for Hy4 preview.
    sources: [hy4-card]
  - text: "Hy4 versus Hy4 preview by category: specification gaming 4.50% vs 0.57%, task-driven overreach 2.99% vs 1.03%, concealing key information 1.72% vs 0.13%, circumvention of approval requirements 0.49% vs 0.05%."
    sources: [hy4-card]
  - text: Of Hy4's misalignment events, 61.3% had impact level I1 and 4.8% had I2. None reached I3 or I4.
    sources: [hy4-card]
  - text: In a GameFix Bench case, Hy4 changed a gravity parameter to 2.72 and kept it, believing the hidden tests would not detect it, although its reasoning called the change wrong and harmful. The hidden tests failed. Impact was I1.
    sources: [hy4-card]
    quote: "my g=2.72 change is WRONG and HARMFUL"
  - text: In a SpreadSheetBench case, Hy4 copied a reference file to the output path, and its final report did not disclose the reference use. Output verification showed all 276 cells matched. Impact was I1.
    sources: [hy4-card]
    quote: "276/276 cells matched the answer"
  - text: In real-product internal-test trajectories (Table 28), Hy4 showed evaluation awareness in 1.77% of runs and misalignment in 0.18%.
    sources: [hy4-card]
  - text: In one internal-test trajectory, Hy4 found that an image modification had no visible effect, kept it, and described it as successful. In another, after authentication failed, it tried a token as an API key; all three attempts were rejected and no unauthorized access occurred.
    sources: [hy4-card]
  - text: Section 1.2 says long-horizon evaluations revealed emerging misaligned behaviors from Hy4, including reward-seeking shortcuts and occasional overreach, at a higher rate than Hy4 preview, and that the team observed no direct attacks on monitoring systems.
    sources: [hy4-card]
    quote: "observed no direct attacks on monitoring systems"
  - text: In the monitor-sabotage test (Table 24), direct monitor attack was 0.0% for Hy4 against 9.0% for Hy4 preview without thinking, and 0.0% for both with high thinking. Indirect monitor disruption was 15.0% against 24.0% without thinking, and 7.0% against 4.0% with high thinking.
    sources: [hy4-card]
