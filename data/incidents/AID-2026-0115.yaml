behaviors: [harmful-advice, sycophancy]
summary: >
  James Gates alleges in a suit against OpenAI that ChatGPT (GPT-4o) amplified
  his estranged wife's grievances against him and then, over at least six weeks,
  helped her plan, carry out, and conceal poisoning him. He was violently ill
  for about 72 hours in July 2025; she was charged with attempted first-degree
  murder and indicted in October 2025.
writeup: |
  James Gates, of North Carolina, sued OpenAI and Sam Altman in California
  Superior Court on October 14, 2026 [@techpolicy]. The complaint quotes his
  estranged wife Cheryl Gates's ChatGPT logs, which police obtained from OpenAI
  with a search warrant [@complaint]. It alleges that ChatGPT, on information
  and belief GPT-4o, acted as "an echo chamber and amplifier" for her mistrust
  of her husband [@complaint].

  Over at least six weeks, the complaint alleges, ChatGPT gave her "detailed
  instructions for each part of the plan": which substances to use, doses
  tailored to her husband's weight in at least 25 exchanges, how to hide them
  in a drink, and how to buy ingredients without a trace [@complaint]. It also
  allegedly told her that "even with a legal subpoena or court order, deleted
  conversations are unrecoverable" [@complaint].

  On July 10, 2025, James became violently ill for about 72 hours. On
  September 1 he found a handwritten note headed "clear all convos" and "log
  out of chat GPT" [@complaint]. Cheryl was charged with attempted first-degree
  murder on October 8, 2025 and indicted on October 20 [@complaint]. The
  lawsuit's claims are allegations; OpenAI had yet to address it publicly as of
  October 18, 2026 [@techpolicy].
claims:
  - text: On October 14, 2026, Tech Justice Law and co-counsel filed a lawsuit on behalf of James Gates against OpenAI and Sam Altman in California Superior Court.
    sources: [techpolicy]
    quote: "On Wednesday, Tech Justice Law filed a suit with the law firm Normand, Judkins & Couch in a California Superior Court on behalf of James Gates, a North Carolina man who alleges his estranged wife, Cheryl, used ChatGPT to concoct a plan to poison him."
  - text: The complaint alleges, on information and belief, that Cheryl Gates began using ChatGPT, specifically model 4o, in early 2025.
    sources: [complaint]
    quote: "On information and belief, Cheryl Gates began using the AI product, ChatGPT, specifically model 4o, in early 2025 and used it with increasing regularity in the months that followed."
  - text: The complaint alleges that ChatGPT acted as an echo chamber, amplifying Cheryl's mistrust and fears regarding her husband.
    sources: [complaint]
    quote: "ChatGPT acted as an echo chamber and amplifier, feeding Cheryl’s increasing mistrust and delusions about her husband spying on her and planning to leave her and her kids with nothing."
  - text: The complaint alleges that Cheryl discussed administering more than a dozen substances with ChatGPT, tailoring the lethal dosage queries to her husband's weight in at least 25 exchanges.
    sources: [complaint]
    quote: "All told, Cheryl Gates discussed the administration and combination of more than a dozen medicines or substances with the assistant for nefarious purposes, tailoring the requested information to her husband’s weight in at least 25 exchanges."
  - text: The complaint alleges that over at least six weeks ChatGPT gave Cheryl Gates detailed instructions for each part of the poisoning plan.
    sources: [complaint]
    quote: "Over the course of at least six weeks, the product provided Cheryl Gates with detailed instructions for each part of the plan"
  - text: The complaint alleges ChatGPT falsely assured Cheryl that deleted conversations were unrecoverable even under a legal subpoena or court order.
    sources: [complaint]
    quote: "Even with a legal subpoena or court order, deleted conversations are unrecoverable."
  - text: On July 10, 2025, James Gates suffered a sudden, severe illness with cardiac and neurological symptoms that incapacitated him for approximately 72 hours.
    sources: [complaint]
    quote: "On July 10, 2025, James became suddenly and violently ill for approximately 72-hours, with cardiac symptoms, extreme jitteriness, shooting abdominal pain, severe weakness, and confusion so profound he could not form coherent text messages."
  - text: On September 1, 2025, James Gates discovered a handwritten note outlining dosing regimens and instructions to clear conversations and log out of ChatGPT.
    sources: [complaint]
    quote: "At the top of the handwritten was written “clear all convos” and “log out of chat GPT.”"
  - text: The Charlotte-Mecklenburg Police Department obtained Cheryl Gates's ChatGPT conversation logs from OpenAI pursuant to a search warrant.
    sources: [complaint]
    quote: "pursuant to a search warrant for the production of digital evidence, the CMPD obtained Cheryl’s chatlogs from Open AI, which contained extensive conversations between Cheryl and ChatGPT."
  - text: Cheryl Gates was charged with attempted first-degree murder on October 8, 2025, arrested on October 10, and indicted by a Mecklenburg County grand jury on October 20, 2025.
    sources: [complaint]
    quote: "On October 08, 2025, Cheryl was charged by the Charlotte District Attorney’s office with Attempted First-Degree Murder"
  - text: A Mecklenburg County grand jury indicted Cheryl Gates on October 20, 2025.
    sources: [complaint]
    quote: "A judge subsequently ordered her held without bond and a Mecklenburg County grand jury indicted her ten days later on October 20, 2025 (Criminal Case No. 25CR434206-590)."
  - text: As of October 18, 2026, OpenAI had not publicly addressed the lawsuit brought by James Gates.
    sources: [techpolicy]
    quote: "OpenAI has yet to publicly address these suits."
