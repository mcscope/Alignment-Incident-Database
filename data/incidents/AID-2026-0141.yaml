  notes: >
    Written by the lead editor lane, not the Gemini writer, because OpenRouter
    is out of credits. The CrowdStrike post was read through WebFetch's
    summarizer, which was asked for verbatim sentences; a reviewer should
    re-check quotes against the page. Details in research notes but not cited
    here (the 1.4 billion tokens figure is cited; attack-path specifics such as
    the SAML/XXE chain, the Middle East interior ministry, the European
    government entities, and telecom victims) were not re-verified. Harm is
    `moderate`, not `significant`, because the schema has no such level.
    DeepSeek version is not stated, so models is `unknown`; DeepSeek is tied
    to the behavior by a claim. VAPOR PANDA is not a taxonomy organization and
    is described in the text only, as for Storm-0940 in AID-2026-0123.
    CrowdStrike says this campaign is separate from Storm-0940's, and no
    source links it to AID-2026-0068. ARTEX is the same open-source framework
    in all three records.
