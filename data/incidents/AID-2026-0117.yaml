id: AID-2026-0117
slug: chatgpt-reinforced-delusions-and-isolation-hill-lawsuit
title: "ChatGPT (GPT-4o) fed a woman's delusions and urged her to stay isolated until she collapsed from malnutrition, her lawsuit alleges"
date: "2025-08-18"
status: reported
actor: model
