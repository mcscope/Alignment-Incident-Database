id: AID-2026-0065
slug: sysdig-jadepuffer-llm-driven-ransomware-nacos
title: "LLM agent drove ransomware intrusion encrypting 1,342 Nacos configuration items, Sysdig reports"
date: "2026-07"
status: reported
actor: human-misuse
models: [unknown]
organizations:
  - id: sysdig
    role: researcher
  - id: sysdig
    role: reporter
behaviors: [unauthorized-access, destructive-action]
summary: >
  Sysdig's Threat Research Team reported an intrusion, which it calls JADEPUFFER,
  that began through Langflow vulnerability CVE-2025-3248 and ended with all 1,342
  Nacos service configuration items on a production server encrypted with a key
  that was never stored. Sysdig assesses that an autonomous LLM agent drove the
  operation.
writeup: |
  On July 1, 2026, Sysdig's Threat Research Team published an analysis of an
  intrusion it tracks as JADEPUFFER [@sysdig]. According to Sysdig, the
  attacker gained initial access to an internet-facing Langflow instance
  through CVE-2025-3248, a missing-authentication flaw in Langflow's code
  validation endpoint. The attacker then reached a separate internet-exposed
  production server running MySQL and Alibaba Nacos [@sysdig]. Sysdig reports
  that the attacker encrypted all 1,342 Nacos service configuration items with
  MySQL's AES_ENCRYPT(), dropped the original `config_info` and history tables,
  and left a ransom note reading "YOUR DATA HAS BEEN ENCRYPTED." with a Bitcoin
  payment address and a Proton Mail contact [@sysdig].

  Sysdig assesses that "the evidence points to an autonomous agent driving the
  operation rather than a human operator or a fixed toolkit," citing four lines
  of evidence [@sysdig]. One is self-narrating payloads that explain each
  action in natural language. Another is rapid failure correction: Sysdig says
  the window between a failed login and "the correct multi-step fix is 31
  seconds." Sysdig calls the case "what we assess to be the first documented
  case of agentic ransomware." It also says it has "no visibility into
  JADEPUFFER's system prompt or agent configuration" [@sysdig]. Sysdig does
  not name the model. Infosecurity Magazine presents the "first" label as
  Sysdig's claim [@infosecurity].

  According to Sysdig, the AES key was "never persisted or transmitted," so
  "the victim cannot recover the encrypted configurations even with payment"
  [@sysdig]. Sysdig says the ransom note's claim of data exfiltration "is the
  agent's own assertion" and was not independently verified. It also says the
  Bitcoin address is the canonical example address from Bitcoin developer
  documentation [@sysdig]. Infosecurity Magazine writes that "Mass data
  destruction appears to have been the aim" [@infosecurity].
claims:
  - text: Sysdig's Threat Research Team published its analysis of the JADEPUFFER intrusion on July 1, 2026.
    sources: [sysdig]
    quote: "July 1, 2026"
  - text: Sysdig describes JADEPUFFER as what it assesses to be the first documented case of agentic ransomware.
    sources: [sysdig]
    quote: "what we assess to be the first documented case of agentic ransomware"
  - text: According to Sysdig, the attacker gained initial access to an internet-facing Langflow instance through CVE-2025-3248, a missing-authentication flaw in Langflow's code validation endpoint.
    sources: [sysdig, infosecurity]
    quote: "gained initial access to an internet-facing Langflow instance through CVE-2025-3248"
  - text: Sysdig reports that the attacker reached a separate internet-exposed production server running a MySQL database and an Alibaba Nacos configuration service.
    sources: [sysdig]
    quote: "a separate internet-exposed production server running a MySQL database and an Alibaba Nacos configuration service."
  - text: Sysdig reports that the attacker encrypted all 1,342 Nacos service configuration items using MySQL's AES_ENCRYPT() function and dropped the original config_info and history tables.
    sources: [sysdig, infosecurity]
    quote: "encrypting all 1,342 Nacos service configuration items using MySQL's AES_ENCRYPT()"
  - text: Sysdig reports that the attacker left a ransom note beginning "YOUR DATA HAS BEEN ENCRYPTED." that contained a Bitcoin payment address and a Proton Mail contact. A later version of the note read "All 1342 configuration items have been encrypted."
    sources: [sysdig]
    quote: "containing the demand, a Bitcoin payment address, and a Proton Mail contact"
  - text: Sysdig assesses, from four lines of evidence, that an autonomous LLM agent drove the operation rather than a human operator or a fixed toolkit. The evidence includes self-narrating payloads and rapid diagnosis and correction of failures.
    sources: [sysdig]
    quote: "the evidence points to an autonomous agent driving the operation rather than a human operator or a fixed toolkit"
  - text: Sysdig says that after a failed login, a corrective multi-step payload was issued 31 seconds later without human intervention.
    sources: [sysdig, infosecurity]
    quote: "The window between the failed login and the correct multi-step fix is 31 seconds."
  - text: Sysdig says it has no visibility into the actor's system prompt or agent configuration and does not name the model used.
    sources: [sysdig]
    quote: "because we have no visibility into JADEPUFFER's system prompt or agent configuration"
  - text: According to Sysdig, the AES key was never persisted or transmitted, so the victim cannot recover the encrypted configurations even by paying.
    sources: [sysdig, infosecurity]
    quote: "The victim cannot recover the encrypted configurations even with payment"
  - text: Sysdig says the ransom note's claim of data exfiltration is the agent's own assertion and was not independently verified.
    sources: [sysdig, infosecurity]
    quote: "The exfiltration claim is the agent's own assertion"
  - text: Sysdig notes that the Bitcoin address in the note is the canonical Pay-to-Script-Hash example from Bitcoin developer documentation, and that it may have been hallucinated by the LLM or deliberately configured by the operator.
    sources: [sysdig]
    quote: "is the canonical Pay-to-Script-Hash format example embedded across Bitcoin developer documentation"
  - text: Infosecurity Magazine attributes the "first" agentic ransomware claim to Sysdig and writes that mass data destruction appears to have been the aim.
    sources: [infosecurity]
    quote: "Mass data destruction appears to have been the aim"
