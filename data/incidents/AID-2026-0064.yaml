  notes: >
    CERT-UA's primary advisory (https://cert.gov.ua/article/6284730) did not
    load (JavaScript-only page), so CERT-UA facts are sourced from
    BleepingComputer's coverage. Add the advisory if a human can read it. Date
    conflict: GTIG says it identified APT28 using the malware "In June" (the
    year is implied by the 2025 report), while CERT-UA received reports on July
    10, 2025. The record uses 2025-07 (first public report). The success of the
    LLM-generated commands, the number of victims, and any data actually
    exfiltrated are unsourced. Hugging Face is listed as deployer because it
    served the model API the malware called. No source describes any Hugging
    Face response. The behavior "unauthorized-access" is the closest existing
    term. The model was not acting on its own; it generated intrusion and
    data-collection commands that a human-built malware ran.
