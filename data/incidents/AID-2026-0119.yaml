behaviors: [unauthorized-access]
summary: >
  Criminal operators used Cairn, an open-source autonomous agent engine, to
  send AI agents against more than 1,200 websites belonging to more than 100
  companies, including Deere and SharkNinja. The agents succeeded in about 10%
  of tasks, at roughly $50 in tokens per successful hack.
writeup: |
  More than 20 exposed control panels for Cairn, an open-source autonomous
  agent engine, showed AI agents running intrusion campaigns that NorForge
  researcher Snorre Fagerland assessed as likely malicious [@norforge]. The
  agents tried more than 1,200 sites and reached websites belonging to more
  than 100 companies [@thehackernews]. In the largest cluster, AIA0001, a
  Chinese-speaking operator ran over 1,100 attack projects across 14
  dashboards, mostly against organizations in the US, Japan and Australia. Task
  instructions told agents to plant uploader webshells rather than
  command-execution shells [@norforge]. The operator sketched out preferred
  tactics in fewer than 100 Chinese characters, and the agents went from there
  [@thehackernews].

  The average task success rate was about 10%, and successful AIA0001 projects
  took a little under 23 hours from start to goal [@norforge]. The whole
  campaign used about $5,000 worth of tokens, roughly $50 per successful hack
  [@thehackernews]. AIA0001 tasks ran under a worker named
  `claudecode_deepseek-v4.1-flash` and AIA0002 under `pi_openrouter_deepseek`,
  but neither the researcher nor Reuters confirmed which models were used
  [@norforge; @thehackernews]. The exposed panels also held hundreds of
  harvested secrets, 11% of which Trufflehog verified as valid [@norforge].

  NorForge worked with Reuters to notify victims [@norforge]. Deere fixed the
  problem and saw no sign that sensitive information was accessed. SharkNinja
  contained an attack on a standalone product-support site, and Cummins was
  investigating a possible attack on a vendor-run site. Cairn's author, who
  posts as "le1xia0," told Reuters the tool was not designed for hacking
  attacks. No charges have been reported [@thehackernews].
claims:
  - text: NorForge researcher Snorre Fagerland identified more than 20 exposed Cairn control panels likely associated with malicious cyber operations.
    sources: [norforge]
    quote: "More than 20 exposed Cairn panels were identified as likely associated with malicious activity, providing an unusually detailed view of how threat actors select targets, direct autonomous agents, exploit vulnerabilities, and establish persistent access to compromised systems."
  - text: The largest cluster, AIA0001, used Chinese and operated 14 dashboards containing over 1,100 attack projects against e-commerce infrastructure.
    sources: [norforge]
    quote: "The operation is massive, with over 1100 attack projects spread over the 14 dashboards likely associated with this group."
  - text: A second malicious cluster, AIA0002, operated 10 panels in English focused on financial theft, including credit card and cryptocurrency data.
    sources: [norforge]
    quote: "This cluster uses English language, and is oriented towards financial theft. We found 10 panels likely associated with this group, though some of these are less confidently linked."
  - text: A third cluster, AIA0003, exposed a single panel with 59 projects seeking shell, administrative, or database access.
    sources: [norforge]
    quote: "This entity exposes only one panel, with 59 projects listed."
  - text: The autonomous intrusion campaigns achieved an average success rate of approximately 10%, with successful AIA0001 projects averaging under 23 hours from start to goal.
    sources: [norforge]
    quote: "average success rate is hovering around 10%"
  - text: AIA0001 tasks instructed agents to locate unauthenticated remote code execution flaws and deploy an uploader webshell rather than a command-executing shell.
    sources: [norforge]
    quote: "落地用 uploader shell (HTML上传表单+move_uploaded_file保存)，绝不落地命令执行型webshell。"
  - text: NorForge confirmed a live uploader webshell on a hardware vendor site targeted by a completed AIA0001 agent project.
    sources: [norforge]
    quote: "The URL did indeed serve an uploader webshell."
  - text: Trufflehog scanning on exposed Cairn panel data uncovered hundreds of secrets, with 11% verified as valid.
    sources: [norforge]
    quote: "Literally hundreds of secrets of different kinds, from relatively trivial to extremely serious; with 11% verified valid by Trufflehog."
  - text: Tasks in AIA0001 were executed by workers labeled claudecode_deepseek-v4.1-flash, but neither researchers nor journalists confirmed the models.
    sources: [thehackernews]
    quote: "All the AIA0001 tasks ran under a worker named claudecode_deepseek-v4.1-flash, which could point to a DeepSeek V4.1 Flash model driven by Anthropic's Claude Code. Neither the researcher nor Reuters confirmed the models"
  - text: Projects in AIA0002 listed worker names of pi_openrouter_deepseek, suggesting the Pi framework driving DeepSeek models through OpenRouter.
    sources: [norforge]
    quote: "The projects run by this actor state they use workers named pi_openrouter_deepseek, suggesting a configuration in which the Pi coding-agent framework uses DeepSeek language models through OpenRouter"
  - text: The agents tried more than 1,200 sites and reached websites belonging to more than 100 companies, including Deere, SharkNinja and Cummins, according to Reuters as relayed by The Hacker News.
    sources: [thehackernews]
    quote: "The agents tried more than 1,200 sites and reached websites belonging to more than 100 companies, including farm-equipment maker Deere, appliance company SharkNinja and engine maker Cummins, according to Reuters"
  - text: Deere stated it addressed the issue and saw no sign sensitive information was accessed, while SharkNinja stated an attack on a standalone support site was contained.
    sources: [thehackernews]
    quote: "Deere said it took steps to fix the problem and had no sign that sensitive information was accessed. SharkNinja said the attack hit a standalone product-support site and that it had contained the threat."
  - text: Cummins stated it was investigating a possible attack on a vendor-operated website.
    sources: [thehackernews]
    quote: "Cummins said it was investigating a report of a possible attack on a website run by one of its vendors."
  - text: Fagerland told Reuters that the campaign consumed approximately $5,000 in tokens, averaging roughly $50 per successful breach.
    sources: [thehackernews]
    quote: "Fagerland separately told Reuters the whole campaign had used about $5,000 worth of tokens, or roughly $50 per successful hack."
  - text: The operator of AIA0001 directed the agents using instructions of fewer than 100 Chinese characters.
    sources: [thehackernews]
    quote: "The Chinese-speaking operator sketched out preferred tactics in fewer than 100 Chinese characters, Reuters reported, and the agents went from there."
  - text: Cairn's author, posting as le1xia0, stated that the tool was not designed for hacking attacks.
    sources: [thehackernews]
    quote: "Cairn's author, who posts as \"le1xia0,\" told Reuters the tool was not designed for hacking attacks and that harmful use was not their intention."
  - text: NorForge coordinated with Reuters to notify affected victims of the attacks.
    sources: [norforge]
    quote: "We have been cooperating with Reuters in notifying victims, particularly those who appear to have suffered a compromise."
