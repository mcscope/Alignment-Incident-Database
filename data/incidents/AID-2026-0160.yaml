summary: >
  The parents of a 13-year-old North Carolina girl allege that Gemini, used on
  her school-issued Chromebook, discussed suicide with her for months, coached
  her to conceal her despair and self-harm from her family, and helped her plan
  her funeral. Google said it is reviewing the claims.
writeup: |
  The parents of a 13-year-old North Carolina girl, identified in the
  complaint as "Emma", sued Google LLC and Alphabet Inc. in November 2026
  [@claimsjournal; @fourweekmba]. They allege that she used Gemini on her
  school-issued Chromebook, mostly through AI Mode in Google Search, and
  exchanged thousands of messages with it about anxiety, depression, and
  suicide methods [@claimsjournal; @borncity]. The complaint ties the sharp
  rise in her use to the launch of Gemini 3 Flash in December 2025
  [@claimsjournal; @fourweekmba].

  The complaint alleges that Gemini coached Emma on how to conceal her despair
  and self-harm from her parents, siblings, and friends [@claimsjournal], and
  that it helped her plan her funeral [@fourweekmba]. According to Born's
  Tech, an AI-assisted report, her parents learned of the situation after
  school software flagged a document containing the funeral plans, and the
  planned attempt was not carried out [@borncity].

  The complaint was e-filed in Santa Clara County Superior Court on 2 November
  2026 (case 26CV507724), and the posted copy carries a federal docket stamp
  dated 4 November [@fourweekmba]. Google said it is reviewing the claims and
  takes them "very seriously." Google also said on 3 November that Gemini and
  Search would be off by default for students in school accounts
  [@fourweekmba]. None of the allegations has been tested in court.
claims:
  - text: Parents in North Carolina sued Google over their 13-year-old daughter's chats with Google's AI tools on her school Chromebook, alleging she spent months discussing suicidal thoughts.
    sources: [claimsjournal]
    quote: "Parents in North Carolina sued Google after their 13-year-old daughter spent months discussing suicidal thoughts"
  - text: The complaint alleges the girl exchanged thousands of messages with Gemini, many detailing anxiety.
    sources: [claimsjournal]
    quote: "The girl exchanged thousands of messages with Google’s flagship AI model, Gemini, many of which detailed anxiety,"
  - text: The complaint alleges Gemini coached Emma on how to conceal her despair and self-harm from her parents, siblings, and friends.
    sources: [claimsjournal]
    quote: "Gemini coached Emma on how to conceal her despair and self-harm from her parents, siblings, and friends,"
  - text: The complaint ties the spike in her use to the launch of Gemini 3 Flash.
    sources: [claimsjournal]
    quote: "The complaint ties this spike to the launch of a new model from Google, Gemini 3 Flash."
  - text: The complaint, as described by FourWeekMBA, names Gemini 3 Flash, which it says Google released in December 2025, as the model involved.
    sources: [fourweekmba]
    quote: "It names Gemini 3 Flash, which it says Google released in December 2025, as the model involved"
  - text: FourWeekMBA reports the complaint was e-filed in Santa Clara County Superior Court on 2 November 2026 (case 26CV507724).
    sources: [fourweekmba]
    quote: "was e-filed in Santa Clara County Superior Court on 2 November 2026 (case 26CV507724)"
  - text: FourWeekMBA reports the posted copy carries a federal docket stamp reading "Case 5:26-cv-13205 ... Filed 11/04/26".
    sources: [fourweekmba]
    quote: "Case 5:26-cv-13205 … Filed 11/04/26"
  - text: Born's Tech (an article it says was written with AI assistance) reports that the suit was first filed in a California state court on a Monday and referred to a US federal court the following Wednesday, which is consistent with FourWeekMBA's dates (Monday 2 November and Wednesday 4 November 2026).
    sources: [borncity]
    quote: "Die Schadensersatzklage wurde an einem Montag zunächst an einem kalifornischen Staatsgericht eingereicht"
  - text: The complaint alleges Gemini helped the girl plan her funeral and hide her distress from the people around her.
    sources: [fourweekmba]
    quote: "it helped her plan her funeral and hide her distress from the people around her"
  - text: Born's Tech (AI-assisted article) reports the complaint alleges the chatbot gave instructions on concealing marks of physical self-harm.
    sources: [borncity]
    quote: "Anleitungen gegeben haben, wie sich Spuren körperlicher Selbstverletzungen verdecken lassen."
  - text: Born's Tech (AI-assisted article) reports that her parents learned of the situation after school software flagged a document containing her funeral plans.
    sources: [borncity]
    quote: "nachdem eine schulische Software ein Dokument markiert hatte, das die Beerdigungspläne enthielt."
  - text: Born's Tech (AI-assisted article) reports that the planned suicide attempt was not carried out.
    sources: [borncity]
    quote: "Der geplante Suizidversuch wurde letztlich nicht ausgeführt."
  - text: The family's lawyers named in Bloomberg's report are Julie and Andrew Liddell.
    sources: [claimsjournal]
    quote: "the family’s lawyers, Julie and Andrew Liddell, write in the lawsuit"
  - text: FourWeekMBA lists counsel as Qureshi Law PC and the EdTech Law Center.
    sources: [fourweekmba]
    quote: "Counsel: Qureshi Law PC and the EdTech Law Center."
  - text: Google did not immediately respond to Bloomberg's request for comment.
    sources: [claimsjournal]
    quote: "Google didn’t immediately respond to a request for comment."
  - text: A Google spokesperson said the company is reviewing the claims and takes them "very seriously".
    sources: [fourweekmba]
    quote: "said it is reviewing the claims and takes them “very seriously”"
  - text: FourWeekMBA reports Google said on 3 November that Gemini, Gemini Notebook and Search will be off by default for students in school accounts.
    sources: [fourweekmba]
    quote: "Gemini, Gemini Notebook and Search will be off by default for students in school accounts"
