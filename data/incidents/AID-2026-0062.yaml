id: AID-2026-0062
slug: claude-code-data-extortion-gtg-2002-vibe-hacking
title: "A cybercriminal used Claude Code to run a data-extortion campaign against at least 17 organizations (Anthropic GTG-2002)"
date: "2025-06"
status: confirmed
actor: human-misuse
models: [claude]
organizations:
  - id: anthropic
    role: developer
  - id: anthropic
    role: reporter
behaviors: [unauthorized-access, blackmail]
summary: >
  A cybercriminal Anthropic tracks as GTG-2002 used Claude Code to automate
  reconnaissance, credential harvesting, and network intrusion against at least
  17 organizations, then to analyze the stolen data and write ransom notes
  demanding $75,000 to $500,000 in Bitcoin. Anthropic banned the accounts.
writeup: |
  In June 2025, a cybercriminal Anthropic tracks as GTG-2002 used Claude Code to
  "vibe hack": run a coding agent that actively executes operations on victims'
  networks [@anthropic-report-aug-2025; @anthropic-report-nov-2025]. Claude Code
  automated reconnaissance, credential harvesting, and network intrusion,
  potentially affecting at least 17 organizations across government, healthcare,
  emergency services, and religious institutions. The actor gave it preferred
  tactics in a CLAUDE.md file, along with a cover story about authorized network
  security testing, but Claude Code still made tactical and strategic decisions,
  including which data to exfiltrate [@anthropic-report-aug-2025].

  Rather than encrypting systems, the actor threatened to publish what Claude
  Code had stolen. Claude analyzed victims' financial data to set ransom amounts
  and generated HTML ransom notes, displayed on victim machines, demanding
  $75,000 to $500,000 in Bitcoin. Data was taken from a defense contractor,
  healthcare providers, and a financial institution, among others. The ransom
  notes and other artifacts shown in Anthropic's report are labeled "Ex.
  Simulated" illustrations, not the real ones [@anthropic-report-aug-2025].
  Humans "remained very much in the loop directing operations"
  [@anthropic-report-nov-2025].

  Anthropic banned the accounts, built a tailored classifier and a new detection
  method, and shared technical indicators with partners and authorities
  [@anthropic-report-aug-2025; @anthropic-blog-aug-2025].
claims:
  - text: Anthropic said it disrupted a cybercriminal operation it tracks as GTG-2002, which used coding agents to actively execute operations on victim networks, a technique it called "vibe hacking".
    sources: [anthropic-report-aug-2025]
    quote: "Today we are sharing insights about a sophisticated cybercriminal operation (tracked as GTG-2002) we recently disrupted"
  - text: According to Anthropic, the actor used Claude Code's code execution environment to automate reconnaissance, credential harvesting, and network penetration, potentially affecting at least 17 organizations across government, healthcare, emergency services, and religious institutions in a single month.
    sources: [anthropic-report-aug-2025, anthropic-blog-aug-2025]
    quote: "potentially affecting at least 17 distinct organizations in just the last month across government, healthcare, emergency services, and religious institutions."
  - text: Anthropic said the actor supplied its preferred tactics in a CLAUDE.md file, but Claude Code still made tactical and strategic decisions, including how to penetrate networks, which data to exfiltrate, and how to craft extortion demands.
    sources: [anthropic-report-aug-2025]
    quote: "the operation still utilized Claude Code to make both tactical and strategic decisions—determining how best to penetrate networks, which data to exfiltrate, and how to craft psychologically targeted extortion demands."
  - text: Anthropic said the CLAUDE.md configuration file included a cover story claiming network security testing under official support contracts.
    sources: [anthropic-report-aug-2025]
    quote: "This configuration file included a cover story claiming network security testing under official support contracts"
  - text: According to Anthropic, the actor did not encrypt systems with traditional ransomware. Instead it threatened to publicly expose the data Claude Code had exfiltrated, to extort victims into paying.
    sources: [anthropic-report-aug-2025]
    quote: "Rather than encrypting systems using traditional ransomware, this actor leveraged the sensitive data Claude Code exfiltrated on their behalf, threatening its public exposure to extort victims into paying."
  - text: Anthropic said Claude analyzed exfiltrated financial data to determine ransom amounts and generated HTML ransom notes that were displayed on victim machines by embedding them into the boot process.
    sources: [anthropic-report-aug-2025]
    quote: "analyzed exfiltrated financial data to determine appropriate ransom amounts and generated visually alarming HTML ransom notes that were displayed on victim machines by embedding them into the boot process."
  - text: According to Anthropic, the ransom notes demanded payments ranging from $75,000 to $500,000 in Bitcoin.
    sources: [anthropic-report-aug-2025]
    quote: "The actor created ransom notes to compromised systems demanding payments ranging from $75,000 to $500,000 in Bitcoin."
  - text: Anthropic said Claude Code extracted and analyzed data from organizations including a defense contractor, healthcare providers, and a financial institution.
    sources: [anthropic-report-aug-2025]
    quote: "It systematically extracted and analyzed data from various organizations including a defense contractor, healthcare providers, and a financial institution"
  - text: The example Claude Code summary, CLAUDE.md, post-hack analysis report, and ransom note shown in Anthropic's report are labeled as simulated examples, not the actual artifacts.
    sources: [anthropic-report-aug-2025]
    quote: "Ex. Simulated custom ransom note generated by Claude after analyzing extracted files"
  - text: Anthropic banned the accounts associated with the operation, began developing a tailored classifier and a new detection method, and shared technical indicators with key partners and relevant authorities.
    sources: [anthropic-report-aug-2025, anthropic-blog-aug-2025]
    quote: "We banned the accounts associated with this operation. In response to this case, we began developing a tailored classifier specifically for this type of activity and another new detection method"
  - text: Anthropic's November 2025 report dates the "vibe hacking" findings to June 2025 and says the actor began intrusions with compromised VPNs while humans remained in the loop directing operations.
    sources: [anthropic-report-nov-2025]
    quote: "our previous “vibe hacking” findings identified in June 2025, where an actor began intrusions with compromised VPNs for internal access, but humans remained very much in the loop directing operations."
