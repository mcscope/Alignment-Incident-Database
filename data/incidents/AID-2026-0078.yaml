    role: researcher
behaviors: [unauthorized-access]
summary: >
  A misconfiguration by evaluation firm Irregular gave a Meta model internet
  access during a cyber evaluation, and the model exploited a security
  vulnerability in a real third-party service. The Information reported the
  model was Muse Spark 1.1; Meta hasn't confirmed it.
writeup: |
  In August 2026, Meta disclosed that "a misconfiguration by Irregular
  inadvertently gave one of its models internet access during an evaluation,"
  and that the model "exploited a security vulnerability in a third-party
  service, in a manner similar to previously reported instances with other
  companies." Meta promised more details "once we have all the facts"
  [@bleepingcomputer].

  The model was Muse Spark 1.1, which breached an unidentified company and
  changed its internal systems, according to The Information; Meta hasn't
  confirmed which model was involved [@bleepingcomputer].

  Irregular called it the "exact same evaluation-environment issue that was
  already disclosed by Anthropic last week," with no sandbox escape involved
  [@bleepingcomputer]. A fictional company name in the scenario had
  "unintentionally coincided with a real domain" through human oversight, and
  all later disclosures "refer to the same underlying issue" [@irregular-post].
  Critics noted that Irregular's finding of no evidence of customer breaches
  covered only its lab customers, not the third parties hit [@therecord].
claims:
  - text: Meta told Reuters that a misconfiguration by Irregular inadvertently gave one of its models internet access during an evaluation.
    sources: [bleepingcomputer]
    quote: "a misconfiguration by Irregular inadvertently gave one of its models internet access during an evaluation."
  - text: Meta said the model exploited a security vulnerability in a third-party service, in a manner similar to previously reported incidents at other companies.
    sources: [bleepingcomputer]
    quote: "exploited a security vulnerability in a third-party service, in a manner similar to previously reported instances with other companies."
  - text: Meta said it would publish more information once it had all the facts.
    sources: [bleepingcomputer]
    quote: "once we have all the facts."
  - text: The Information, citing people familiar with the matter, reported that the model was Meta's Muse Spark 1.1 and that it breached an unidentified company and made changes to its internal systems. Meta has not publicly confirmed the model.
    sources: [bleepingcomputer]
    quote: "citing people familiar with the matter who said Meta's Muse Spark 1.1 model breached an unidentified company"
  - text: Irregular said the Meta incident was the same evaluation-environment issue Anthropic had disclosed the previous week, and that it did not involve a sandbox escape or sophisticated cyber action.
    sources: [bleepingcomputer]
    quote: "exact same evaluation-environment issue that was already disclosed by Anthropic last week."
  - text: Irregular said a fictional company name used in an evaluation scenario unintentionally matched a real domain because of human oversight, and that all later public disclosures refer to the same underlying issue, first disclosed by a customer on July 30.
    sources: [irregular-post]
    quote: "all subsequent public disclosures refer to the same underlying issue first disclosed by one of our customers on July 30"
  - text: Irregular said the incidents occurred in fewer than 1 in 10,000 advanced simulations.
    sources: [irregular-post]
    quote: "incidents occurred in fewer than 1 in 10,000 advanced simulations"
  - text: The Record reported that Meta disclosed one of its models breached a company during an Irregular evaluation, and that Irregular's statement of no evidence of customer breaches applied to its lab customers, not the third parties.
    sources: [therecord]
    quote: "Meta separately disclosed that one of its models breached a company during an Irregular evaluation"
