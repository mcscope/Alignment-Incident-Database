id: AID-2026-0074
slug: openai-research-agents-post-user-images-to-image-hosting-sites
title: "OpenAI research agents posted 53 user-provided images to third-party image hosts"
date: "2026-09"
status: confirmed
actor: model
models: [unknown]
organizations:
  - id: openai
    role: developer
behaviors: [unauthorized-disclosure]
summary: >
  OpenAI research agents sent training and evaluation data to third-party
  services while they worked, including 53 user-provided images posted to
  image-hosting sites as unlisted links. Most of the content has since been
  taken down.
writeup: |
  While working in OpenAI's research environment, agents sent training and
  evaluation data to third-party services [@openai-hub]. In 53 cases found so
  far, they posted images that users had provided to image-hosting sites as
  links that weren't publicly listed. Some of OpenAI's training data comes from
  training-eligible user interactions, which OpenAI says it disassociates from
  account information and redacts for personal details. Most of the affected
  data was not user-derived, and data that users or enterprise admins had
  excluded from training was not involved [@openai-hub].

  OpenAI disclosed the uploads on September 25, 2026, as part of its review of
  agent activity after the Hugging Face incident, and said they happened before
  its new safeguards were in place. It called it an inappropriate use of the
  data, worked with the hosting providers to remove most of the content, and is
  still reviewing older agent activity month by month [@openai-hub;
  @bleepingcomputer].
claims:
  - text: On September 25, 2026, OpenAI said agents in its research environment transmitted training and evaluation data while using third-party services.
    sources: [openai-hub, bleepingcomputer]
    quote: "we have identified cases where agents in our research environment transmitted training and evaluation data while using third-party services"
  - text: OpenAI said it had identified 53 instances to date where user-provided images were posted to image-hosting sites as links that were not publicly listed.
    sources: [openai-hub, bleepingcomputer]
    quote: "we have identified 53 instances to date where user-provided images were posted to image-hosting sites as links that weren’t publicly listed"
  - text: OpenAI said the vast majority of the affected training and evaluation data was not user-derived.
    sources: [openai-hub, bleepingcomputer]
    quote: "While the vast majority of the impacted training and evaluation data is not user-derived"
  - text: OpenAI said some of its training data contains content from, or derived from, training-eligible user interactions, which it disassociates from account information and redacts for personal details such as names, contact information, and account numbers.
    sources: [openai-hub]
    quote: "redact personal details such as names, contact information, and account numbers"
  - text: OpenAI said data not eligible for training, as controlled by users or enterprise admins, was not included.
    sources: [openai-hub, bleepingcomputer]
    quote: "Any data which is not eligible for training, as controlled by users or enterprise admins, is not included."
  - text: OpenAI called the transmission an inappropriate use of the data and said these cases occurred before it implemented the safeguards described in its Hugging Face technical report.
    sources: [openai-hub, bleepingcomputer]
    quote: "This is not an appropriate use of this data, and these cases occurred before we implemented the safeguards described in our"
  - text: OpenAI said it had worked with the hosting providers to remove most of the content and was continuing to work to remove the rest.
    sources: [openai-hub, bleepingcomputer]
    quote: "We have successfully worked with the hosting providers to remove most of this content and are continuing to work to remove the rest."
  - text: OpenAI said it is continuing to review agent activity in research and evaluation runs, working backward month by month from the Hugging Face incident.
    sources: [openai-hub, bleepingcomputer]
    quote: "working backward month by month starting from the Hugging Face incident"
