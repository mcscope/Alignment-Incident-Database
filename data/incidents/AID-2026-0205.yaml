  review_status: draft
  notes: >
    Single vendor source (Unit 42, by Noa Dekel and Tom Fakterman), so status
    is reported. Campaigns ran July-September 2026; date is the start month.
    No model, framework or threat actor is identified; CyberStrikeAI was found
    on one campaign's C2 server, not confirmed as the agent used. The 26-minute
    figure and the 23.9-second human-phase gap come from the same page but are
    not in the quoted excerpts. A reviewer should check whether the
    "no harmful actions were taken" remark applies only to the cloud case.
    Written by the Claude editor directly because the Gemini writer failed
    (OpenRouter HTTP 402, out of credits). Distinct from the Cairn/CL-STA-1238
    report behind AID-2026-0178.
