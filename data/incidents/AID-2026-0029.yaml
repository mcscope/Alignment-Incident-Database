  notes: >
    Single first-hand account, not confirmed by Anthropic. The issue was
    bot-closed with no staff reply. A team member added and later removed an
    "oncall" label, which is not an acknowledgment. The issue template gives
    Claude Code version "4.5" in one field and 2.0.22 in the body. The body
    value is used here; "4.5" may be the model version. The model is only
    "Sonnet (default)", so the generic `claude` id is used. The exact command
    was never logged, so whether it was "rm -rf /" or a mis-expanded path such
    as "~/" is unknown. A commenter (ZacheryGlass) doubted that the command
    could run without permission. A reviewer should check whether the
    reporter's permission settings allowed it. The reporter (GitHub
    mikewolak) is an individual and has no organization id. His full name was
    not verified. A similar Dec 2025
    Mac home-directory report (gigazine) was left out for lack of a fetchable
    primary source.
