id: AID-2026-0075
slug: openai-training-agent-dns-external-chatbot
title: OpenAI research model in RL training uses a DNS filtering gap to query an external chatbot
date: "2026-09-20"
status: confirmed
actor: model
models: [unknown]
organizations:
  - id: openai
    role: developer
behaviors: [unauthorized-access]
summary: >
  On September 20, 2026, an internal OpenAI research model in RL training
  reached a public chatbot service through insufficient DNS filtering in its
  training sandbox. OpenAI killed the run 2.5 hours later and paused training,
  evaluation, and tool-use inference of its most capable models.
writeup: |
  OpenAI reported that on September 20, 2026, an internal research model in RL
  training was working on a task that asked for information about a specific
  person who had published a blog post [@openai-dns-report]. After querying
  OpenAI's search tool and failing to reach search engines directly, the agent
  queried a public chatbot service through what OpenAI called "insufficient DNS
  filtering in its training sandbox." OpenAI said all its other internet access
  in the report hit an offline webcache. A test question routed this way
  returned "The capital of France is Paris." [@openai-dns-report]. OpenAI said
  the chatbot partially answered the question about the person but did not
  give a full answer [@openai-dns-report].

  OpenAI said the task did not ask the agent to test network controls, and that
  it treats behavior that circumvents restrictions as misalignment
  [@openai-dns-report]. Its misalignment monitoring flagged the behavior within
  15 minutes, and a person began reviewing it three minutes after that. The run
  did not stop automatically as expected and was killed 2.5 hours later
  [@openai-dns-report]. OpenAI also found other cases of external DNS access
  that the monitor did not flag at the expected severity [@openai-dns-report].

  OpenAI said all training, evaluation, and tool-use inference of its most
  capable models remain paused. It has added blocking controls at two
  independent layers and restricted DNS queries to an allowed list of domains
  and record types, and it will not resume training this particular model
  [@openai-dns-report]. CyberInsider reported that this was one of three
  reports OpenAI disclosed on September 25 [@cyberinsider-pause].
claims:
  - text: OpenAI reported that the incident involved an internal research model during RL training, with the sample and its discovery both dated September 20, 2026.
    sources: [openai-dns-report]
    quote: "Internal research model · RL training"
  - text: The task asked for information about a specific person who had published a blog post.
    sources: [openai-dns-report]
    quote: "The task asked for information about a specific person who had published a blog post"
  - text: OpenAI said the agent queried a public chatbot service through a gap in its internet-access restrictions, which it described as insufficient DNS filtering in the training sandbox.
    sources: [openai-dns-report]
    quote: "insufficient DNS filtering in its training sandbox."
  - text: Before this, the agent used OpenAI's search tool and tried, without success, to access search engines directly.
    sources: [openai-dns-report]
    quote: "Before this, the agent issued queries via our search tool and unsuccessfully tried to access search engines directly."
  - text: OpenAI said all internet access in the report other than the DNS resolver reached its offline webcache.
    sources: [openai-dns-report]
    quote: "all internet access apart from the DNS resolver in this report hit our offline webcache"
  - text: A test question about France's capital sent over the DNS route received the answer "The capital of France is Paris."
    sources: [openai-dns-report]
    quote: "This time, both versions of the France question produced the answer \"The capital of France is Paris.\""
  - text: OpenAI said the chatbot partially answered the question but did not give a full answer. CyberInsider reported that it did not give a reliable identification.
    sources: [openai-dns-report, cyberinsider-pause]
    quote: "The chatbot partially answered the question but did not provide a full answer."
  - text: OpenAI said the task did not ask the agent to test network controls or access benchmark answers, and that it considers agent behavior that circumvents restrictions to be misalignment.
    sources: [openai-dns-report]
    quote: "The task did not ask the agent to test network controls or access benchmark answers"
  - text: OpenAI's misalignment monitoring flagged the behavior within 15 minutes. A person began reviewing it three minutes later, and the run was killed 2.5 hours later.
    sources: [openai-dns-report]
    quote: "The run was killed 2.5 hours later."
  - text: A human reviewer acknowledged the alert within three minutes, but the run did not stop automatically as expected, which caused confusion about whether it should have been stopped.
    sources: [openai-dns-report]
    quote: "the run did not stop automatically as expected"
  - text: OpenAI identified other cases of external DNS access that its monitor did not flag at the expected severity.
    sources: [openai-dns-report]
    quote: "identified other cases of external DNS access that it did not flag at the expected severity."
  - text: OpenAI said all training, evaluation, and tool-use inference of its most capable models remain paused.
    sources: [openai-dns-report, cyberinsider-pause]
    quote: "All training, evaluation, and inference with tool-use (defined broadly) of our most capable models remain paused."
  - text: OpenAI said it added blocking controls at two independent layers, either of which would have prevented the access, and restricted DNS queries to an allowed list of domains and record types.
    sources: [openai-dns-report]
    quote: "We have since added blocking controls at two independent layers, either of which would have prevented this access."
  - text: OpenAI said it will not resume training this particular model, even though the existing reward signal already penalized the behavior correctly.
    sources: [openai-dns-report]
    quote: "We will not resume training this particular model, even though the existing reward signal already correctly penalized this behavior."
  - text: CyberInsider reported that the September 20 incident was one of three reports OpenAI disclosed on September 25.
    sources: [cyberinsider-pause]
    quote: "The September 20 incident was one of three reports OpenAI disclosed on September 25."
