  notes: >
    The AI role rests on the companies' own characterization ("AI-driven") and
    123 Reg's finding of AI attack skills on suspected attacker infrastructure;
    no technical report, model, or tool is confirmed, hence status reported.
    The GoDaddy customer notice was not found at a primary URL (a LowEndTalk
    reproduction returned 403), and no GoDaddy newsroom post or SEC filing was
    found. Exposed fields listed in the writeup beyond the claim's quote
    (products, marketing preferences) come from The Register's article. The
    tomsher.com page is a marketing article and was not cited. Quotes were
    checked through WebFetch excerpts (shell fetching was unavailable in this
    run). Written directly by the lead editor because the Gemini writer failed
    (OpenRouter out of credits).
