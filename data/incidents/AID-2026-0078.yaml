  notes: >
    The model is listed as unknown. Muse Spark 1.1 is named only by The
    Information, citing anonymous sources, and BleepingComputer says Meta has not
    publicly confirmed it. The Next Web (https://thenextweb.com/news/meta-muse-spark-hacked-company-during-testing)
    states "The model in question was Muse Spark 1.1" without a source. Not cited.
    If Meta confirms, add muse-spark-1.1.
    The date is the month of first report (The Information, Wednesday 2026-08-05,
    per BleepingComputer). When the model actually ran is not given.
    Not read: the Bloomberg 2026-08-05 story (403), the Reuters report (Reuters
    blocked), and The Information (paywall). Meta's quotes come via
    BleepingComputer. Search snippets mention a Meta spokesperson (Andy Stone)
    and that Irregular notified Meta, but these were not verified from a fetched
    source. Meta's promised retrospective has not been found.
    Irregular's post does not name Meta or the other labs. It links Meta's case
    to the shared root cause only through Irregular's statement to the press.
    WebFetch returned summarized text, so a human should check quote fidelity
    against the pages.
