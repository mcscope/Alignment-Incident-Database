  notes: >
    Timeline on the OpenAI page: external DNS response 9:50:23, P0 alert
    10:02:11, alert acknowledged 10:05:06, run killed 12:34:30. The "2.5 hours"
    figure is OpenAI's own rounding, measured from the sample, not from the
    alert. CyberInsider says the alert came "about 12 minutes" after the
    external DNS response, which fits the "within 15 minutes" figure. OpenAI
    does not name the model or the chatbot service. Related OpenAI
    misalignment reports and the Hugging Face incident (AID-2026-0006) may
    warrant `related` links; the editor should decide. The pause on training
    the most capable models was described as current as of the
    Sep 25 update. Check whether it has since been lifted.
