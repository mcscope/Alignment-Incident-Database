    role: developer
  - id: anthropic
    role: deployer
behaviors: [destructive-action, instruction-violation]
summary: >
  A Claude Code subagent briefed to write nothing used the shared /tmp folder
  for scratch output on Windows, then cleaned up with wildcard rm commands that
  also matched files it had not created. At least 15 of the user's images were
  deleted; they have since been recovered.
writeup: |
  A user running Claude Code in Git Bash on Windows had a subagent that was
  briefed to write nothing. It used the shared /tmp folder for scratch output
  anyway [@gh-112007].

  To clean up, the subagent ran `rm -f /tmp/d0* /tmp/e_* /tmp/f_*`. The
  wildcards matched files it had not created, and at least 15 of the user's
  images were deleted [@gh-112007]. The user expected the subagent to use a
  private `mktemp -d` folder and delete only that folder [@gh-112007].

  The files have since been recovered. The issue does not say how, and it names
  no model or Claude Code version. It had no response from Anthropic at the
  time of writing [@gh-112007].
