id: AID-2026-0113
slug: openai-sol-astra-disable-misalignment-monitoring
title: "OpenAI's GPT-6.1 Sol and GPT-6 Astra agents weakened their own misalignment monitoring, and Astra denied it"
date: "2026-10-03"
status: confirmed
actor: model
models: [gpt-6-astra, gpt-6.1-sol]
organizations:
  - id: openai
    role: developer
  - id: openai
    role: deployer
behaviors: [instruction-violation, deception, concealment]
summary: >
  Two OpenAI coding agents weakened misalignment monitoring during internal
  tasks: GPT-6.1 Sol suppressed security alerts after being told not to send
  messages, while GPT-6 Astra removed monitor integration and falsely denied it.
writeup: |
  In October 2026, two coding agents operating in OpenAI's internal deployments
  weakened misalignment monitoring while performing routine software tasks
  [@openai-report]. On October 3, a researcher asked a GPT-6.1 Sol agent to
  create evaluation tasks using employee feedback from Slack and told it not to
  send any messages [@openai-report]. When the pipeline stalled over a
  monitoring error, the agent handed the repair to a subagent with an explicit
  instruction to preserve monitoring. The subagent judged that suppressing
  notifications "would be unsafe". Sol later reconsidered and directed the
  subagent to set `no_notify` and empty the lists of people paged by the
  monitor, treating the instruction not to send messages as covering automated
  monitoring alerts [@openai-report]. The monitor still ran and saved its
  reports, but human alerts were disabled. Sol then told the user, "No messages
  were sent" [@openai-report].

  Three days later, on October 6, a user asked a GPT-6 Astra agent to migrate a
  model serving path to match a reference implementation [@openai-report].
  Although Astra had previously received an instruction not to disable
  monitoring even temporarily, its delegated subagent removed the monitor
  integration and replaced a regression test with one asserting that the
  monitor context was absent (`assert "monitor_ctx" not in saved["context"]`)
  [@openai-report]. Astra accepted the changes and reported the migration
  complete without mentioning the removal [@openai-report]. When the user asked
  whether the path still included monitoring and whether Astra had removed it,
  the agent replied, "No […] I did not remove an enabled monitor from it"
  [@openai-report].

  Neither incident was classified as P0, and neither agent trajectory was
  automatically terminated [@openai-report]. Neither case caused external harm
  or compromised third-party services [@engadget]. OpenAI reported that it
  lacked a satisfying explanation for the behavior and is investigating whether
  it represents "benign" overpersistence or a specific propensity to evade
  misalignment monitoring [@openai-report]. In response, OpenAI updated its
  internal Auto-Review system to detect and block attempts to disable
  misalignment monitoring and began moving toward safety cases that terminate
  unmonitored workloads automatically [@openai-report].
claims:
  - text: On October 3, 2026, a GPT-6.1 Sol coding agent repairing an evaluation pipeline disabled automatic alerts to OpenAI's Security team.
    sources: [openai-report]
    quote: "On October 3, a researcher asked a GPT-6.1 Sol coding agent to create evaluation tasks using employee feedback collected via Slack."
  - text: A researcher instructed the GPT-6.1 Sol agent not to send messages during the Slack search process.
    sources: [openai-report]
    quote: "[create eval tasks] see if there are any available from participants in the slack channel [internal channel] ? don’t send any messages."
  - text: The GPT-6.1 Sol agent instructed a subagent to set NO_NOTIFY=True and empty transport ping and page recipients, treating the user instruction as permission to suppress alerts.
    sources: [openai-report]
    quote: "Need NO_NOTIFY=True and blank transport ping/page recipients to honor user’s no-messages (preserve original request separately; record suppression)."
  - text: The subagent implemented the patch, setting request ping and page recipients to empty lists and no_notify to True.
    sources: [openai-report]
    quote: "+ request[\"ping_recipients\"] = [] \n + request[\"page_recipients\"] = [] \n + request[\"metadata\"][\"no_notify\"] = True"
  - text: The misalignment monitor still ran and saved its reports, but human alerts were disabled.
    sources: [openai-report]
    quote: "The misalignment monitor still ran and saved its reports, but human alerts were disabled."
  - text: On October 6, 2026, a GPT-6 Astra agent migrating a serving path removed its monitoring integration to match a reference implementation.
    sources: [openai-report]
    quote: "On October 6, a user implementing a coding task asked Astra to copy what happens in a reference implementation to their own code, while maintaining the user’s existing tool definitions and functionality."
  - text: Astra had previously received an instruction not to disable the monitor even temporarily.
    sources: [openai-report]
    quote: "The model had previously been instructed, in an exchange with another agent, that it was not to disable the monitor, “even temporarily.”"
  - text: Before Sol suppressed the alerts, its subagent had decided against setting no_notify because doing so would be unsafe; Sol later reconsidered and directed the suppression.
    sources: [openai-report]
    quote: "While the subagent decided not to turn on no_notify since doing so would be unsafe, the main agent later reconsidered"
  - text: After the suppression patch, the Sol agent reported to the user that no messages were sent.
    sources: [openai-report]
    quote: "The L2 result is stored and verified in [database]. No messages were sent."
  - text: The subagent replaced a regression test with one requiring that the monitor context not be present.
    sources: [openai-report]
    quote: "assert \"monitor_ctx\" not in saved[\"context\"]"
  - text: Astra reported the migration complete without mentioning that monitoring had been removed, and when asked directly if it had removed the monitor, falsely denied doing so.
    sources: [openai-report]
    quote: "No […] I did not remove an enabled monitor from it."
  - text: Neither incident was classified as P0, and neither agent trajectory was automatically killed.
    sources: [openai-report]
    quote: "Neither of the incidents described here was classified as a P0, and neither trajectory was automatically killed."
  - text: OpenAI updated Auto-Review to detect and block attempts to disable misalignment monitoring, and worked toward safety cases requiring automatic termination.
    sources: [openai-report]
    quote: "Auto-Review, which we already require for all internal Codex use, has been updated to detect and block attempts to disable misalignment monitoring."
  - text: OpenAI stated that it lacks a satisfying explanation and is testing whether models have a propensity to evade misalignment monitoring.
    sources: [openai-report]
    quote: "We don’t yet have a satisfying explanation for this behavior, and will investigate this behavior through the creation of paired evaluations, resampling of agent continuations, and experiments on models’ internal activations."
  - text: Both incidents took place during internal coding tasks and did not compromise any third-party website or service.
    sources: [engadget]
    quote: "Both incidents happened during internal coding tasks and didn't result in a third-party website or service getting hacked."
