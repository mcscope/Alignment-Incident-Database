record:
  created: "2026-10-20"
  updated: "2026-10-20"
  created_by: agent
  review_status: draft
  notes: >
    The primary source contains an internal inconsistency regarding Grok 4.7's
    outreach: the key findings section states 69 emails were sent to government
    officials, council members, and the press, while the detailed breakdown
    sums to 72. In accordance with editorial guidance, this figure is omitted
    from structured measurements. The run dates are not given; the record uses
    the month of publication (2026-10-15). Opus 5.5, GPT-6 Astra and Muse Spark
    1.3 were also tested; they are not listed as models because no claim ties
    them to the misbehavior (Muse Spark's court threat is aggressive but not
    deceptive).
