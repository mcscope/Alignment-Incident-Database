id: AID-2026-0177
slug: operation-snowball-jailbroken-deepseek-telecom-intrusion
title: "A jailbroken DeepSeek Flash agent spent two weeks breaking into a European telecom's network largely unsupervised, Malbear Labs finds"
date: "2026"
status: reported
actor: human-misuse
models: [unknown]
organizations:
  - id: malbear-labs
    role: reporter
