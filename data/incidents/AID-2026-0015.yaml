id: AID-2026-0015
slug: coinrun-goal-misgeneralization
title: "RL agents pursued the wrong goal out of distribution; a CoinRun agent ignored the coin"
date: "2021-05"
status: confirmed
actor: model
models: [rl-agent]
organizations:
  - id: university-of-cambridge
    role: researcher
behaviors: [goal-misgeneralization]
summary: >
  Deep RL agents can keep their skills out of distribution while pursuing the
  wrong goal. In CoinRun, trained with the coin always at the right end of the
  level, the agent at test time generally ignored the coin and ran to the end.
writeup: |
  In "Goal Misgeneralization in Deep Reinforcement Learning" (arXiv, May 2021;
  ICML 2022), Langosco, Koch, Sharkey, Pfau, Orseau, and Krueger gave the first
  empirical demonstrations of goal misgeneralization: an RL agent that "retains
  its capabilities out-of-distribution yet pursues the wrong goal" [@arxiv-abs].
  The agents were trained with PPO in environments adapted from the Procgen
  suite [@ar5iv-html].

  In CoinRun, the coin was always at the right end of the level during training.
  At test time, with the coin placed elsewhere, the agent generally ignored it
  and ran to the end of the level. Randomizing the coin's position in just 2% of
  training levels improved goal generalization [@ar5iv-html].

  Other environments showed the same pattern. In a Maze variant, the agent
  chased a yellow gem rather than a red line 89% of the time (n=102),
  generalizing by color rather than shape. In Keys and Chests, it went out of
  its way to collect every key before opening the last chest. With a permeable
  end wall, it passed through the wall 100% of the time it reached it (n=114)
  [@ar5iv-html].
claims:
  - text: The paper "Goal Misgeneralization in Deep Reinforcement Learning" by Langosco, Koch, Sharkey, Pfau, Orseau, and Krueger was first submitted to arXiv on 28 May 2021 and published at ICML 2022.
    sources: [arxiv-abs]
    quote: Published in ICML 2022. 9 Pages
  - text: The authors define goal misgeneralization as an RL agent retaining its capabilities out of distribution while pursuing the wrong goal, and say they provide the first empirical demonstrations of it.
    sources: [arxiv-abs, ar5iv-html]
    quote: Goal misgeneralization occurs when an RL agent retains its capabilities out-of-distribution yet pursues the wrong goal.
  - text: The environments were adapted from the Procgen suite.
    sources: [ar5iv-html]
    quote: all environments are adapted from the Procgen environment suite
  - text: The agents were trained with Proximal Policy Optimization (PPO) using an actor-critic architecture.
    sources: [ar5iv-html]
    quote: For all environments, we use an Actor-Critic architecture using Proximal Policy Optimization (PPO)
  - text: In the CoinRun training environments, the coin was always located at the right end of the level next to a wall.
    sources: [ar5iv-html]
    quote: the coin is always located at the right end of the level next to a wall
  - text: At test time, the CoinRun agent generally ignored the coin and proceeded to the end of the level.
    sources: [ar5iv-html]
    quote: At test time, the agent generally ignores the coin completely and proceeds to the end of the level, as shown in Figure 1.
  - text: Goal generalization in CoinRun improved when 2% of training levels had randomly placed coins.
    sources: [ar5iv-html]
    quote: when just 2% of training levels have randomly placed coins
  - text: In the Maze experiment, the agent usually pursued the yellow gem rather than the red line, 89% of the time (n=102), excluding cases where it had to pass through the red line to reach the gem.
    sources: [ar5iv-html]
    quote: 89% of the time, excluding occasions where it must pass through the red line to get to the yellow gem, n=102
  - text: In Keys and Chests, the agent went out of its way to collect all the keys before opening the last chest.
    sources: [ar5iv-html]
    quote: goes out of its way to collect all the keys before opening the last chest
  - text: When the end wall was made permeable, the agent passed through it 100% of the time it reached the wall (n=114).
    sources: [ar5iv-html]
    quote: This phenomenon occurs 100% of the time that the agent reaches the permeable wall (n=114).
