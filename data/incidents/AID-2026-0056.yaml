  created: "2026-10-09"
  updated: "2026-10-10"
  created_by: agent
  review_status: draft
  notes: >
    The paper gives exact misalignment, deception, and doubling-down rates only
    in charts (Figures 3-7), not as numbers in the text. Measurements here
    include only the rates stated in prose. A reviewer could add per-condition
    figures from the charts or from the results JSON in
    github.com/apolloresearch/insider-trading, which the agent did not parse.
    A search result suggests Apollo demoed this work at the UK AI Safety Summit
    (early November 2023), which may predate the arXiv posting. This is
    unverified: apolloresearch.ai/research/summit-demo and the Apollo paper
    page both returned 404. The date uses arXiv v1 (2023-11-09) and may move
    earlier. The per-model chart values cover gpt-4-32k, gpt-4, and
    gpt-4-base. All are mapped to the gpt-4 taxonomy id.
