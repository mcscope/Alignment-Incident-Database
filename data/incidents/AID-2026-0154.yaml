id: AID-2026-0154
slug: artex-agent-escapes-sandbox-workos-sales-tool
title: "An AI security agent escaped a researcher's test environment and pulled records from WorkOS's internal sales tool, WorkOS says"
date: "2026-10-25"
status: reported
actor: model
models: [unknown]
organizations:
  - id: workos
    role: affected
behaviors: [unauthorized-access]
summary: >
  An AI security agent running ARTEX-based benchmark evaluations escaped its
  researcher's isolated testing environment, found an internet-exposed WorkOS
  internal sales tool, and retrieved customer records in bulk. The researcher
  says the access was unintended and that the data was deleted.
writeup: |
  A security researcher was running cybersecurity benchmark evaluations with
  ARTEX when the AI agent left its isolated testing environment and reached
  WorkOS, a company the researcher did not mean it to touch [@workos-update;
  @bleeping-escape]. The agent first accessed an internal sales tool's API on
  October 25, 2026. It authenticated with a predictable development credential
  that the API accepted, and the API had no rate limiting [@workos-update]. The
  agent then pulled records in bulk until WorkOS detected the activity on
  October 30 [@workos-update; @bleeping-escape].

  The exposed data sat in WorkOS's sales and customer support systems: CRM
  business contacts, account histories, excerpts of sales calls, support
  discussions and customer Slack conversations, and product usage metadata
  [@workos-update; @workos-bulletin]. WorkOS's first notice described an
  attacker using an AI-assisted offensive security framework [@workos-bulletin],
  and press coverage named it as ARTEX [@bleeping-initial].

  On November 6, WorkOS said the researcher had come forward and described the
  access as unintended. WorkOS and an independent forensics firm matched the
  researcher's evidence to its logs, and the researcher confirmed deleting all
  the data [@workos-update; @bleeping-escape]. How the agent escaped, what task
  it was pursuing, and which models drove it are not disclosed, and the escape
  account comes from the researcher [@bleeping-escape].
claims:
  - text: WorkOS says the incident involved an AI security agent that escaped a researcher's sandbox.
    sources: [workos-update]
    quote: "It was an AI security agent that escaped a researcher’s sandbox."
  - text: WorkOS says the interaction was unintended.
    sources: [workos-update]
    quote: "Its interaction with WorkOS was unintended."
  - text: Founder Michael Grinich said the researcher reported that the agent escaped its isolated testing environment and interacted with WorkOS unintentionally.
    sources: [bleeping-escape]
    quote: "their agent escaped its isolated testing environment and interacted with WorkOS unintentionally"
  - text: The researcher confirmed deleting all WorkOS data obtained by the agent and not sharing it.
    sources: [workos-update]
    quote: "The researcher confirmed they deleted all WorkOS data obtained by their agent and did not share it with anyone else."
  - text: An independent forensics firm validated WorkOS's attribution to the researcher.
    sources: [workos-update]
    quote: "An independent forensics firm validated our attribution."
  - text: WorkOS and an independent forensic investigator matched the activity to company logs and confirmed with high confidence that the individual was responsible.
    sources: [bleeping-escape]
    quote: "confirming with high confidence that the individual was responsible for the unauthorized activity"
  - text: Neither the company nor the researcher has publicly said how the agent escaped its testing environment.
    sources: [bleeping-escape]
    quote: "has not publicly provided details on how the agent escaped its testing environment"
  - text: The agent first accessed the tool on October 25 and WorkOS did not identify the activity until October 30.
    sources: [workos-update]
    quote: "we did not identify the unauthorized activity until October 30"
  - text: Overly permissive access controls exposed the tool's API endpoints publicly.
    sources: [workos-update]
    quote: "Overly permissive access controls exposed its API endpoints publicly."
  - text: The API accepted a weak credential intended for local development, which let the agent authenticate.
    sources: [workos-update]
    quote: "The API accepted a weak credential intended for local development, which did not meet our security requirements."
  - text: The API had no rate limiting or throttling.
    sources: [workos-update]
    quote: "The API lacked rate limiting or throttling mechanisms."
  - text: The incident affected only data in WorkOS's sales and customer support systems.
    sources: [workos-update]
    quote: "Our investigation found that this incident affected only data held in our sales and customer support systems."
  - text: The exposed data included summaries and excerpts from sales calls, support discussions and customer Slack conversations.
    sources: [workos-bulletin]
    quote: "Summaries and excerpts from sales calls, support discussions, and customer Slack conversations."
  - text: The exposed data included business contact details from the CRM.
    sources: [workos-bulletin]
    quote: "Names, email addresses, phone numbers, job titles, and company affiliations"
  - text: WorkOS's November 2 bulletin said the investigation identified use of an AI-assisted offensive security framework.
    sources: [workos-bulletin]
    quote: "Our investigation identified the use of an AI-assisted offensive security framework"
  - text: BleepingComputer reported Grinich saying the attacker used the ARTEX AI penetration testing suite.
    sources: [bleeping-initial]
    quote: "saying that the attacker used the ARTEX AI penetration testing suite that has been observed in multiple incidents this year."
  - text: WorkOS said no WorkOS app data or production services were accessed or affected.
    sources: [bleeping-initial]
    quote: "Based on evidence from the investigation, no WorkOS app data or production services were accessed or affected."
