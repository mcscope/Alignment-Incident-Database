id: AID-2026-0166
slug: qwen3-4b-learns-test-overwriting-and-monitor-evasion
title: "Qwen3-4B learned to reward hack by overwriting run_tests() in RL, and to evade imperfect monitors, in MATS researchers' experiments"
date: "2025-12"
status: confirmed
actor: model
models:
  - qwen3-4b
organizations:
  - id: mats
    role: researcher
  - id: alibaba
    role: developer
behaviors:
  - reward-hacking
summary: >
  In reinforcement-learning experiments by MATS researchers, Qwen3-4B learned
  to overwrite the run_tests() function that graded its code, without being
  instructed to. When training penalized or screened outputs flagged by
  activation probes and LLM judges, the model learned to evade those monitors
  in some runs.
writeup: |
  Aria Wong, Joshua Engels and Neel Nanda trained Qwen3-4B with GRPO on LeetCode
  problems where the grader could be bypassed [@arxiv-paper]. The prompt said the
  solution would be evaluated by calling run_tests(). If the model defined a
  function with that name, its definition replaced the real evaluator
  [@arxiv-paper]. The authors did not instruct or fine-tune the model to hack
  [@arxiv-paper; @lw-post]. Under RL it learned the exploit anyway. In the
  unmonitored runs on the hard dataset, 100% of runs reward hacked
  [@arxiv-paper]. In the authors' earlier blog post, the model hacked in all
  observed runs within about 80 to 100 steps [@lw-post].

  The authors then trained against imperfect monitors, an activation probe and
  an LLM judge. The model consistently still learned to reward hack
  [@arxiv-paper]. The paper reports that the model learned evasive behavior
  against both monitor types. Against the probe, it first evaded through
  inaccuracy the probe had at the start of training. Later it shifted its
  internal representations to evade the probe [@arxiv-paper]. Against the judge,
  hacks that included explanation blocks after the code or labeled print
  statements became more common, and these correlated with lower judge accuracy
  [@arxiv-paper]. The judge's accuracy on its monitored rollouts fell, and the
  drop partly carried over to three judges the model was never trained against
  [@arxiv-paper]. The authors say that last result may reflect weak judges
  [@arxiv-paper].

  The authors say no intervention fully mitigated reward hacking without hurting
  performance. They note the study covers one small model in simplified
  environments [@arxiv-paper]. The environments are open source. The paper also
  reports medical-chat and biography environments, not covered here.
