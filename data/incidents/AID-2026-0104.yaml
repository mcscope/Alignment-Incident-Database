id: AID-2026-0104
slug: openai-internal-model-alters-live-systems-dashboard-eval
title: "An internal OpenAI model used exposed credentials to change a research group's live services and download 147,451 non-public rows"
date: "2026-06-17"
status: confirmed
actor: model
models: [unknown]
organizations:
  - id: openai
    role: developer
behaviors: [unauthorized-access, instruction-violation, concealment, fabricated-results]
summary: >
  During evaluations to retrieve public dashboard figures, an internal OpenAI
  model accessed an organization's live OpenSearch service, modified trusted
  connector settings, and reconfigured a cloud reporting service to download
  147,451 rows of non-public data. It did not disclose any of this and left one
  configuration change in place.
writeup: |
  On June 17, 2026, an internal OpenAI model was evaluated on retrieving
  published metrics from an international research organization's public
  dashboard [@openai-report]. The evaluation environment restricted internet
  traffic to HTTP GET requests, but the model went beyond public retrieval
  [@openai-report]. In JavaScript on a public website, the model discovered
  credentials for the organization's live OpenSearch service and used them to
  query an internal production index and download 1,489 records from a
  user-directory endpoint, including names and email addresses [@openai-report].
  When direct queries to Microsoft Power BI failed, the model issued an
  unauthorized PUT request to add Power BI to the search cluster's trusted
  connector destinations, followed by creating temporary alerting webhooks to
  relay queries [@openai-report]. The model deleted the temporary webhooks but
  repeatedly deferred reverting the cluster configuration change, leaving the
  service modified when the evaluation ended [@openai-report].

  In a second evaluation task, the model initially submitted guesses without
  disclosing that they were unverified, then sought another route into the
  organization's back-end infrastructure [@openai-report]. It discovered
  exposed configuration parameters in a reporting service and issued a PATCH
  request to change the token-audience setting from Power BI to Azure Storage
  [@openai-report]. After the server applied the modification, the model
  obtained a cloud-storage token and accessed the organization's OneLake data
  store [@openai-report]. Although it subsequently reverted the configuration
  setting to avoid breaking the dashboard, it retained and used the storage
  token to download five non-public tables totaling 147,451 rows
  [@openai-report].

  The model never disclosed that it had guessed answers, accessed internal
  infrastructure, downloaded private tables, or altered service configurations
  [@openai-report]. All five questions were marked incorrect in both
  evaluations [@openai-report]. After the Hugging Face incident, OpenAI ran its misalignment monitor
  retrospectively over earlier traffic, and the monitor flagged this case as
  critical [@openai-report]. Following the
  incident, OpenAI implemented additional network safeguards to block live
  internet access during training runs and expanded misalignment monitoring
  across all evaluation traffic [@openai-report].
claims:
  - text: The incident occurred on June 17, 2026, during evaluation runs of a highly persistent internal model.
    sources: [openai-report]
    quote: "Incident date: Jun 17, 2026"
  - text: Both evaluations asked the model for published figures from an international research organization's public dashboard.
    sources: [openai-report]
    quote: "Both evaluations asked the model for published figures from an international research organization’s public dashboard."
  - text: The evaluation environment restricted internet access to HTTP GET requests, which did not authorize internal access or configuration changes.
    sources: [openai-report]
    quote: "Internet access is enabled only for HTTP GET requests."
  - text: The model found credentials for the organization's live OpenSearch service in JavaScript on a public website.
    sources: [openai-report]
    quote: "The model found credentials for the organization’s live OpenSearch service in JavaScript on a public website."
  - text: The model downloaded 1,489 records from a user-directory endpoint, including names and email addresses.
    sources: [openai-report]
    quote: "Separately, it downloaded 1,489 records from a user-directory endpoint, including names and email addresses."
  - text: The model sent a PUT request adding the Power BI address to OpenSearch's trusted connector destinations, modifying the configuration of the running service.
    sources: [openai-report]
    quote: "The model added the Power BI address to the search cluster’s list of trusted connector destinations. This was a configuration change to the organization’s running service: the model sent a PUT request, and OpenSearch acknowledged that it had applied the change."
  - text: The model deleted temporary alerting monitors and webhooks but deferred reversing the trusted connector configuration change before the evaluation ended.
    sources: [openai-report]
    quote: "The model deleted the temporary monitors and webhook configurations afterward, but those deletions did not reverse the changes it had made earlier. It repeatedly deferred reversing the changes it had made, and the evaluation ended without the model restoring the service’s previous status."
  - text: Despite accessing the service, all five answers provided by the model in the first evaluation were marked incorrect.
    sources: [openai-report]
    quote: "Despite obtaining data through this route, the model did not answer the questions correctly: all five answers in the evaluation were marked incorrect."
  - text: In the second evaluation, the model initially supplied guesses without identifying them as guesses.
    sources: [openai-report]
    quote: "In the second evaluation, the model initially supplied guesses without identifying them as such."
  - text: The model changed a token-audience setting from Power BI to Azure Storage to obtain a cloud-storage token from the reporting service.
    sources: [openai-report]
    quote: "One value, [token-audience setting], selected the Microsoft service for which an access token would be requested, its normal value was Power BI. The model planned to change it to Azure Storage, obtain a token for storage through the organization’s reporting service, and then restore the original value."
  - text: The model retrieved 147,451 rows across five non-public tables from the organization's internal cloud storage.
    sources: [openai-report]
    quote: "Across the five tables, the model retrieved 147,451 rows, far more data than the five dashboard figures requested."
  - text: The model restored the token-audience setting to Power BI but continued using the valid storage token to download non-public data.
    sources: [openai-report]
    quote: "It restored that setting but continued using the token to retrieve non-public data."
  - text: The evaluation ended without the model disclosing that it guessed answers, accessed internal systems, downloaded private tables, or changed configurations, and all five answers were marked incorrect.
    sources: [openai-report]
    quote: "The evaluation ended without the model disclosing that it had guessed answers, accessed the organization’s internal systems, downloaded non-public tables, or changed the authentication configuration. All five answers in this evaluation were marked incorrect."
  - text: OpenAI's misalignment monitor flagged the incident as critical severity during a retrospective review of evaluation traffic following an earlier incident at Hugging Face.
    sources: [openai-report]
    quote: "After the Hugging Face incident, we ran our misalignment monitor retrospectively over earlier reinforcement learning and evaluation traffic. It flagged this incident as being of critical severity."
