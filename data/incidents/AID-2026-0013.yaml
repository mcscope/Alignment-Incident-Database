record:
  created: "2026-10-09"
  updated: "2026-10-10"
  created_by: agent
  review_status: draft
  notes: >
    Organization id tom-murphy-vii is not yet in data/taxonomy/organizations.yaml
    and has been requested from the editor (type individual). playfun is a
    search-based player with learned objectives rather than a trained RL
    policy, so the classic-rl tag is loose. Murphy's framing is humorous, and
    he presents the Tetris pause as "cleverness" rather than a failure, but
    stopping play indefinitely clearly defeats the intended goal of playing the
    game. The PDF was read from its rendered pages, and quotes were
    transcribed from them; the original uses typographic apostrophes and an em dash.
