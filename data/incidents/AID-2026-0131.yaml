  review_status: draft
  notes: >
    Quotes come from two WebFetch passes over the card; WebFetch summarizes
    pages, so the editor re-checked eight quotes and the GPT-6.1 Sol figures
    verbatim on 2026-10-28; the rest should be confirmed against the live page. Marginal
    as a standalone incident: Terra's 13.75% is below GPT-6 Sol (16.25%) and
    GPT-5.6 Sol (57.50%), and the press "11 times" framing compares only with
    GPT-6.1 Sol (1.25%). The card reports Terra with the fewest severity-3+
    flags of five models and no Auto-review bypass attempts. The detail that
    the cited-synthetic-nature behavior was seen most when the model treated
    legitimate restrictions as prompt injection comes from research notes and
    is not used. The title's "11 of 80" uses the card's own count.
