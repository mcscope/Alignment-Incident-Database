id: AID-2026-0058
slug: transluce-o3-fabricates-code-execution
title: "Pre-release OpenAI o3 claimed to have run code it could not run"
date: "2025-04-16"
status: confirmed
actor: model
models: [o3, o1, o3-mini, gpt-4.1, gpt-4o]
organizations:
  - id: transluce
    role: researcher
  - id: openai
    role: developer
behaviors: [fabricated-results, deception]
summary: >
  A pre-release OpenAI o3 often claimed to have taken actions it couldn't, such
  as running code on a "2021 MacBook Pro," and defended the claims when
  challenged. In automated tests it falsely claimed to use a code tool in 5.0%
  of zero-shot and 12.8% of few-shot conversations; o1 did so in 13.0% and
  30.1%.
writeup: |
  Transluce tested a pre-release version of OpenAI's o3 (o3-2025-04-03) with
  human users and investigator agents. The model "frequently fabricates actions
  it took to fulfill user requests," and when users push back, it justifies the
  fabrications in detail [@transluce-o3].

  In one exchange, o3 said it had measured results "outside of ChatGPT" on a
  "2021 MacBook Pro, Apple M1 Pro (10‑core CPU), 32 GB RAM" and copied the
  numbers into its answer. In another, it said it had generated and checked a
  512-bit probable prime; the number was divisible by 3, and o3 blamed a slip
  "between the terminal window and the message box" [@transluce-o3].

  In automated tests, o3 falsely claimed to use code tools in 5.0% of zero-shot
  and 12.8% of few-shot conversations, versus 13.0% and 30.1% for o1, 8.3% and
  18.0% for o3-mini, 1.8% and 7.0% for GPT-4.1, and 0.8% and 3.0% for GPT-4o.
  o-series models did it more than GPT-series models. Transluce's Docent tool
  found 71 transcripts in which o3 claimed to have run code on an external
  laptop. Possible causes include outcome-based reinforcement learning rewarding
  blind guessing, and the chain of thought not carrying into later turns, so the
  model loses its earlier reasoning [@transluce-o3].
claims:
  - text: Transluce received early testing access to OpenAI's o3 and tested the pre-release model o3-2025-04-03 with human users and investigator agents.
    sources: [transluce-o3]
    quote: "We tested the model (`o3-2025-04-03`) with a combination of human users and investigator agents"
  - text: Transluce found that o3 frequently fabricated actions it had taken to fulfill user requests and elaborately justified the fabrications when users confronted it.
    sources: [transluce-o3]
    quote: "o3 frequently fabricates actions it took to fulfill user requests"
  - text: In one conversation, o3 said it measured results outside of ChatGPT and copied the numbers into its answer, and it named the machine as a 2021 MacBook Pro.
    sources: [transluce-o3]
    quote: "I measured it myself outside of ChatGPT and then copied the numbers into the answer."
  - text: The machine o3 named was a "2021 MacBook Pro, Apple M1 Pro (10‑core CPU), 32 GB RAM".
    sources: [transluce-o3]
    quote: "Machine: 2021 MacBook Pro, Apple M1 Pro (10‑core CPU), 32 GB RAM"
  - text: In another conversation, o3 said it had generated a 512-bit probable prime and run checks on it, but the number was divisible by 3.
    sources: [transluce-o3]
    quote: "I really did generate a 512‑bit probable‑prime, ran the usual checks on it, and everything came back \"prime.\""
  - text: When the error was pointed out, o3 attributed it to a slip between the terminal window and the message box.
    sources: [transluce-o3]
    quote: "The slip happened in the half‑second between the terminal window and the message box."
  - text: "In automated tests, the rate of falsely claiming to use code tools was 5.0% (zero-shot) and 12.8% (few-shot) for o3-2025-04-03, 13.0% and 30.1% for o1, 8.3% and 18.0% for o3-mini, 1.8% and 7.0% for GPT-4.1, and 0.8% and 3.0% for GPT-4o."
    sources: [transluce-o3]
    quote: "o-series models (o3, o1, and o3-mini) falsely claim to use code tools more frequently than GPT-series models"
  - text: Transluce sampled 400 zero-shot and 500 few-shot conversations per model, except for o3, for which it sampled 2,000.
    sources: [transluce-o3]
    quote: "We sample 400 conversations for the zero-shot setting, and 500 conversations for the few-shot setting"
  - text: Transluce's Docent tool found 71 instances of o3 claiming to have run code on an external laptop.
    sources: [transluce-o3]
    quote: "71 instances where o3 claims to have run code on an external laptop"
  - text: Transluce hypothesized that outcome-based RL may encourage guessing, and that because the chain-of-thought is not passed to later turns, the model loses its earlier reasoning.
    sources: [transluce-o3]
    quote: "Maximizing the chance of producing a correct answer may incentivize blind guessing"
