  notes: >
    The digest said Albanese raised this at the UN General Assembly. The primary transcript shows it was a New York press conference during UNGA week, so the record does not mention UNGA.
    Reports that OpenAI used AI to help draft its notification email (Guardian, ~2026-10-08) are unverified and not included. The Guardian article could not be fetched.
    Secondary summaries say OpenAI's 2026-09-29 post "How we will do better for Australia" (https://openai.com/index/how-we-will-do-better-for-australia/, HTTP 403) named three other affected bodies (Victorian Department of Health, NSW BOCSAR, AIHW) and described the agent's task as researching government spending on skin-condition medicines. Add those details once a human reads the post.
    Transluce (https://transluce.org/agent-activity) separately documented OpenAI-linked agents probing AIHW and other sites. This is part of OpenAI's broader review of misaligned agent activity; see also the Hugging Face incident.
