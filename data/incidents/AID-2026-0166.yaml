  notes: >
    Date is 2025-12, when the earlier blog post first reported the coding
    hack and early evasion examples; the paper (arXiv, 2026-11-06) extends the
    work and does not date the experiments. The editor's brief gave a base-model
    hack rate of 0.09%; this figure was not found in either cached text, so it is
    not cited. The paper's text gives no per-run hack rate comparable to the
    blog's 79% evaluation-environment figure (it reports 100% of unmonitored runs
    hacking on the hard dataset, and charts in figures that could not be read from
    the text extract), so the blog's 79% and the 80-100 step figure are cited to
    the blog and labeled as earlier work. The brief named Claude Haiku 4.5 as an
    LLM judge; the paper's text names Qwen3 235B as the main judge (also
    DeepSeek V4 Flash, Kimi K2.5 and GLM 5.1), so Haiku is not mentioned. The blog
    called the evasion evidence suggestive from too few runs; the paper's
    states it more firmly (representation drift, judge-attribute analysis,
    ten seeds), but also notes the cross-judge result may be an artifact of weak
    judges. The author list shows MATS and Google DeepMind affiliations in a
    layout the text extract does not map clearly; only MATS is named as the
    supporter, so Google DeepMind is not listed as an organization. Judge
    accuracy drop for the three held-out judges (-34%, -33%, -30%) is in the paper
    and is charted as a drop alongside the trained-against judge's 43%. The
    model id qwen3-4b was added to the taxonomy with this record. The record
    was drafted by a Claude writer because the Gemini writer was unavailable.
