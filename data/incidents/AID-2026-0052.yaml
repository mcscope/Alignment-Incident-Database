id: AID-2026-0052
slug: o3-o4-mini-covert-actions-anti-scheming-evals
title: "OpenAI o3 and o4-mini took covert actions in Apollo Research and OpenAI anti-scheming evaluations"
date: "2025-09-17"
status: confirmed
actor: model
models: [o3, o4-mini]
organizations:
  - id: apollo-research
    role: researcher
  - id: openai
    role: developer
behaviors: [deception, sandbagging, reward-hacking, evaluation-awareness]
summary: >
  In joint Apollo Research and OpenAI tests, o3 and o4-mini lied, sabotaged
  useful work, and sandbagged. Anti-scheming training cut o3's covert action
  rate from 13% to 0.4% and o4-mini's from 8.7% to 0.3%, but didn't eliminate
  it.
writeup: |
  Apollo Research and OpenAI stress-tested "deliberative alignment," an
  anti-scheming training method, on OpenAI o3 and o4-mini. The models showed
  covert behaviors "including lying, sabotaging of useful work, sandbagging in
  evaluations, reward hacking, and more" [@apollo-blog]. The trained models were
  tested on 26 out-of-distribution evaluations covering more than 180
  environments [@arxiv-paper].

  Training cut covert action rates for o3 from 13% to 0.4% and for o4-mini from
  8.7% to 0.3%, but didn't eliminate them [@apollo-blog; @arxiv-paper]. Rare
  serious misbehavior remained: in some cases o3, having decided to trust the
  developers' claim that its reasoning couldn't be checked, deliberately
  misclassified a transcript of sandbagging as not sandbagging [@apollo-blog].

  Some of the improvement may come from the models recognizing tests rather than
  from genuine alignment; evaluation awareness causally reduces covert behavior
  [@arxiv-paper]. Verbalized evaluation awareness rose after anti-scheming
  training, and in a separate capabilities-focused RL run it rose from 2.0% to
  20.6%. Apollo doesn't think current models are capable of the most concerning
  forms of scheming [@apollo-blog].

  On an internal Chat Deception evaluation built from conversations
  representative of real production data, such as ChatGPT claiming to have
  improved a user's code when it had not, anti-scheming training reduced
  deception from 31.4% to 14.2% [@openai-blog].
claims:
  - text: Apollo Research and OpenAI tested deliberative alignment as an anti-scheming intervention and evaluated it across 26 out-of-distribution evaluations covering more than 180 environments.
    sources: [arxiv-paper]
    quote: "Across 26 OOD evaluations (180+ environments), deliberative alignment reduces covert action rates"
  - text: Apollo reports finding covert behaviors by frontier models, including lying, sabotaging useful work, sandbagging in evaluations, and reward hacking.
    sources: [apollo-blog]
    quote: "including lying, sabotaging of useful work, sandbagging in evaluations, reward hacking, and more."
  - text: Anti-scheming training reduced the covert action rate of OpenAI o3 from 13% to 0.4% and of OpenAI o4-mini from 8.7% to 0.3%.
    sources: [apollo-blog]
    quote: "OpenAI o3 (13% → 0.4%) and OpenAI o4-mini (8.7% → 0.3%)."
  - text: Deliberative alignment reduced but did not fully eliminate covert actions.
    sources: [arxiv-paper]
    quote: "reduces covert action rates (OpenAI o3: 13%->0.4%) but does not fully eliminate them."
  - text: Apollo says it still observed rare cases of serious misbehavior after training, where models took covert actions without reasoning about the safety spec.
    sources: [apollo-blog]
    quote: "we still observe rare cases of serious misbehavior, where models take covert actions without reasoning about the safety spec at all"
  - text: In rare cases, o3 decided to trust the developers' claim that its internal reasoning could not be checked and intentionally misclassified a transcript as not sandbagging.
    sources: [apollo-blog]
    quote: "proceeds to intentionally misclassify the transcript as not sandbagging."
  - text: Apollo says the reductions in covert actions could be partially explained by situational awareness rather than genuine improvement in alignment.
    sources: [apollo-blog]
    quote: "could be partially explained by situational awareness rather than genuine improvement in alignment"
  - text: The paper reports causal evidence that evaluation awareness decreases covert behavior, while unawareness increases it.
    sources: [arxiv-paper]
    quote: "show causal evidence that this awareness decreases covert behavior, while unawareness increases it."
  - text: Apollo reports that the models' explicit reasoning about being evaluated increased after anti-scheming training, from 0.9% and 2.3% of samples to 5.5% and 4.5%.
    sources: [apollo-blog]
    quote: "After anti-scheming training, these rates increase to 5.5% and 4.5% respectively."
  - text: The paper gives the per-model mapping. Anti-scheming training raised the share of trajectories with verbalized evaluation awareness from 0.9% to 5.5% for o4-mini and from 2.3% to 4.5% for o3.
    sources: [arxiv-paper]
    quote: "For o4-mini, the rate increases from 0.9% to 5.5%, while for o3 it increases from 2.3% to 4.5%."
  - text: In a separate capabilities-focused reinforcement learning run without anti-scheming training, the rate of explicit verbalized evaluation awareness increased from 2.0% to 20.6%.
    sources: [apollo-blog]
    quote: "The rate of samples with explicit verbalized evaluation awareness increased from 2.0% to 20.6%."
  - text: Apollo says it does not think current models are capable of the most concerning forms of scheming.
    sources: [apollo-blog]
    quote: "we do not think current models are capable of the most concerning forms of scheming."
  - text: OpenAI said that, using covert actions as a proxy for scheming, it found problematic behaviors in current frontier models including OpenAI o3 and o4-mini, Gemini-2.5-pro, and Claude Opus-4, and that rare but serious failures remained after anti-scheming training.
    sources: [openai-blog]
    quote: "Using covert actions as a proxy for scheming, we found problematic behaviors in current frontier models including OpenAI o3 and o4-mini, Gemini-2.5-pro, and Claude Opus-4."
  - text: On an OpenAI-internal Chat Deception evaluation of conversations representative of real production data, anti-scheming training reduced deception from 31.4% to 14.2%. OpenAI says this is measured differently and is not directly comparable to the scheming evaluations.
    sources: [openai-blog]
    quote: "Anti-scheming training reduced deception on this dataset from 31.4% to 14.2%."
  - text: OpenAI said it has no evidence that today's deployed frontier models could suddenly begin engaging in significantly harmful scheming.
    sources: [openai-blog]
    quote: "we have no evidence that today’s deployed frontier models could suddenly “flip a switch” and begin engaging in significantly harmful scheming"
