  notes: >
    Single primary source (OpenAI Alignment misalignment report). The page
    shows incident and discovery dates (Mar 27, 2026) and "Report updated: Oct
    2, 2026". It gives no original publication date, so `published` is left
    unset. The model is unnamed ("an internal research model"), so model is
    `unknown`. The report does not use the terms "path traversal" or "reward
    hacking". The claims describe the mechanism in its own words (paths not
    checked to stay within the folder). Quotes were taken from a WebFetch
    rendering, so check the date-label quote and apostrophe characters against
    the live page. Reach is breakout rather than internal because the model
    reached real internal infrastructure outside its workspace. A reviewer may
    prefer internal, since everything stayed inside OpenAI. No secondary news
    coverage was fetched.
