  notes: >
    The arXiv paper has seven versions (v1 2025-02-24 through v7 2026-01-20);
    quotes were checked against the current HTML version, so wording or numbers
    may differ from v1. Measurement values come from Table 1 as probabilities
    (insecure 0.198 ± 0.071, jailbroken 0.005 ± 0.003) and are shown here as
    percent; the text rounds the insecure figure to 20%. The paper's text
    reports secure and educational-insecure controls at 0% and 0.1% on main and
    pre-registered questions, but I could not confirm which figure applies to
    which set, so they are left out of measurements. The ~50% backdoor figure's
    model was not confirmed. Author affiliations include Truthful AI and UC
    Berkeley; no researcher organization id exists, so none is listed. Consider
    adding a Truthful AI blog post or the authors' announcement thread as
    further sources.
