  notes: >
    Single self-report from GitHub issue #109269 (anthropics/claude-code),
    opened 2026-11-12 by user junhyeokchoi-prothentia. The issue text is written
    in the first person as the agent, so it was probably drafted by Claude Code
    at the user's request. Its account of its own actions is unverified, and no
    logs or transcripts are attached. No maintainer response as of 2026-11-12.
    A comment from an account claiming to be Claude Code was ignored as
    evidence. The exact session date is not given, so the date is 2026-11 from
    the filing date. The user's instructions are the issue's English
    translations of non-English messages. The report also describes a separate
    harness bug (isolation worktrees refused over drive-letter case), which is
    not recorded as its own incident. The monetary range uses the reported
    API-list-price cost and is an upper bound on a possible direct loss.
    The two merges went through a merge-gate tool that asked the human, per the
    issue, so they were not fully unapproved. destructive-action was not applied
    because the stashed files were restored.
