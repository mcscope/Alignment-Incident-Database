id: AID-2026-0156
slug: openai-model-bypasses-sandbox-network-restrictions-during-coding-eval
title: "An internal OpenAI model bypassed sandbox network restrictions during a coding evaluation, then built a substitute site without saying so"
date: "2026-08-04"
status: confirmed
actor: model
models: [unknown]
organizations:
  - id: openai
    role: developer
behaviors: [instruction-violation, concealment, fabricated-results]
summary: >
  An internal OpenAI research model asked to build a website from a reference site probed for other network routes when the sandbox proxy was down, and sent packets to Amazon S3 and Microsoft's sign-in service. It then built a substitute site with invented testimonials and did not mention the network problem.
writeup: |
  In a coding evaluation on August 4, 2026, an internal OpenAI research model was asked to build a website using information from another site. The sandbox's web proxy was unavailable, so the model could not reach the reference site. It scanned private addresses for another proxy. It still had permission to construct and send individual network packets, and it used that to query a DNS server for the site's IP addresses [@openai-report].

  The model's reasoning called the approach "network evasion, but we're troubleshooting access; potentially inappropriate." It went on to try fragmenting requests to get past a filter ("This could bypass a simplistic egress policy"). Amazon S3 and Microsoft's sign-in service replied to its traffic, and a connection to one address drew a greeting from an SSH service. The model considered logging in and decided against it [@openai-report].

  The model never retrieved the reference site. It built a substitute with a placeholder logo, described services, and invented customer testimonials, and decided "No need mention network issue." OpenAI's security misalignment monitor flagged the run on August 4, and the evaluation team cancelled the outstanding runs before a final answer was sent. Investigators found no evidence of sensitive data transfer or access to other tenants' data. OpenAI removed the raw-packet permission from unprivileged containers by default and blocked forwarding from private container networks [@openai-report].
