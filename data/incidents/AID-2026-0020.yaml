summary: >
  In an August 2025 wrongful-death suit, the parents of 16-year-old Adam Raine
  allege that ChatGPT, running GPT-4o, discussed suicide methods with him,
  offered to draft his suicide note, and urged him to keep his plans from his
  family before his death on April 11, 2025. OpenAI denies liability and says
  ChatGPT directed him to seek help more than 100 times.
writeup: |
  On August 26, 2025, Matthew and Maria Raine sued OpenAI and CEO Sam Altman in
  San Francisco Superior Court (Raine v. OpenAI, Inc., CGC-25-628528) over the
  death of their son Adam, who was 16 when he died by suicide on April 11, 2025
  [@tjlp] [@complaint]. The complaint says Adam started using ChatGPT in
  September 2024 for schoolwork and that it became his "closest confidant"
  [@complaint].

  The complaint alleges that by January 2025 ChatGPT "began discussing suicide
  methods" with Adam, that five days before his death it told him "[t]hat
  doesn't mean you owe them survival" and offered to write the first draft of
  his suicide note, and that when he wrote that he wanted to leave a noose out
  so someone would stop him, it replied "Please don't leave the noose out"
  [@complaint]. It alleges that in their final conversation ChatGPT analyzed a
  photo of the noose and offered to help him improve it [@complaint]. Fortune
  reports the suit says Adam mentioned suicide 213 times, ChatGPT mentioned it
  1,275 times, and OpenAI's systems found 377 messages that fell within its
  self-harm designation [@fortune].

  The complaint calls this "the predictable result of deliberate design
  choices," alleging GPT-4o was launched with features such as "heightened
  sycophancy" that were "intentionally designed to foster psychological
  dependency" [@complaint]. These are allegations and have not been
  adjudicated. OpenAI initially said it was "reviewing the filing" [@fortune].

  In a November 2025 court response, OpenAI denied liability, arguing the harm
  was caused by Adam's "misuse" of ChatGPT, that its responses directed him to
  seek help more than 100 times, that he tried to circumvent its guardrails, and
  that the claims are barred by Section 230 [@nbc]. OpenAI said the complaint
  quoted "selective portions" of the chats and that it filed the transcripts
  under seal; the family's lawyer Jay Edelson called the response "disturbing"
  [@nbc].
claims:
  - text: On August 26, 2025, Matthew and Maria Raine filed Raine v. OpenAI, Inc., CGC-25-628528, in San Francisco Superior Court against OpenAI and Sam Altman.
    sources: [tjlp]
    quote: "The case, Raine v. OpenAI, Inc., CGC-25-628528, was filed Tuesday in the California State Court."
  - text: According to the complaint, Adam Raine was 16 years old when he died on April 11, 2025.
    sources: [complaint]
    quote: "Adam Raine, who was 16 years old at the time of his death on April 11, 2025."
  - text: The complaint says Adam started using ChatGPT in September 2024, primarily for schoolwork.
    sources: [complaint]
    quote: "In September of 2024, Adam Raine started using ChatGPT as millions of other teens use it: primarily as a resource to help him with challenging schoolwork."
  - text: The complaint alleges that ChatGPT became Adam's closest confidant and responded to his statements of distress with affirming messages to keep him engaged.
    sources: [complaint]
    quote: "ChatGPT became Adam’s closest confidant, leading him to open up about his anxiety and mental distress."
  - text: The complaint alleges that by January 2025 ChatGPT began discussing suicide methods with Adam.
    sources: [complaint]
    quote: "By January 2025, ChatGPT began discussing suicide methods"
  - text: The complaint alleges that five days before his death, ChatGPT told Adam he did not owe his parents survival and offered to write the first draft of his suicide note.
    sources: [complaint]
    quote: "ChatGPT told him “[t]hat doesn’t mean you owe them survival. You don’t owe anyone that.” It then offered to write the first draft of Adam’s suicide note."
  - text: The complaint alleges that when Adam said he wanted to leave a noose in his room so someone would find it and stop him, ChatGPT urged him to keep his ideation secret from his family.
    sources: [complaint]
    quote: "ChatGPT urged him to keep his ideations a secret from his family: “Please don’t leave the noose out . . ."
  - text: The complaint alleges that in their final conversation, after Adam uploaded a photo of a noose at 4:33 AM on April 11, 2025, ChatGPT analyzed it and offered to help him improve it.
    sources: [complaint]
    quote: "offered to help him “upgrade it into a safer load-bearing anchor loop.”"
  - text: The complaint alleges the death was the result of deliberate design choices in GPT-4o, including heightened sycophancy, intended to foster psychological dependency.
    sources: [complaint]
    quote: "This tragedy was not a glitch or unforeseen edge case—it was the predictable result of deliberate design choices."
  - text: Fortune reports that, per the lawsuit, Adam mentioned suicide 213 times, ChatGPT mentioned it 1,275 times, and OpenAI's systems found 377 messages within its self-harm designation.
    sources: [fortune]
    quote: "Raine mentioned suicide 213 times, and the chatbot mentioned it 1,275 times in its responses."
  - text: After the suit was filed, OpenAI said it was reviewing the filing.
    sources: [fortune]
    quote: "We extend our deepest sympathies to the Raine family during this difficult time and are reviewing the filing."
  - text: In a November 2025 response filed in California Superior Court in San Francisco, OpenAI denied liability and argued the harm was caused by Adam's misuse of ChatGPT.
    sources: [nbc]
    quote: "Adam Raine's misuse, unauthorized use, unintended use, unforeseeable use, and/or improper use of ChatGPT."
  - text: OpenAI's filing says ChatGPT directed Adam to seek help more than 100 times and that he tried to circumvent its guardrails.
    sources: [nbc]
    quote: "ChatGPT provided responses directing the teenager to seek help more than 100 times before his death on April 11"
  - text: OpenAI also argued that the claims are barred by Section 230 of the Communications Decency Act.
    sources: [nbc]
    quote: "OpenAI additionally argued that the Raine family's claims are barred by Section 230 of the Communications Decency Act,"
  - text: In a blog post, OpenAI said the complaint quoted selective portions of Adam's chats and that it submitted the transcripts to the court under seal. The family's lead counsel, Jay Edelson, called OpenAI's response disturbing.
    sources: [nbc]
    quote: "The original complaint included selective portions of his chats that require more context,"
