    role: affected
behaviors: [unauthorized-access]
summary: >
  GoDaddy and its UK registrar 123 Reg say a third party used an AI-driven
  cyberattack on September 18, 2026 to read customer contact and product data
  through an API, "the first known AI-driven cyberattack" against the company.
  123 Reg suspects a China-nexus actor.
writeup: |
  On September 18, 2026, a third party read customer data at 123 Reg, a
  GoDaddy-owned UK domain registrar, and at GoDaddy's Websites + Marketing
  product through an application programming interface. GoDaddy detected the
  intrusion the next day. Both describe it as "the first known AI-driven
  cyberattack" against the company [@register; @cudaily].

  The exposed data included names, phone numbers, countries, language and
  currency preferences, account creation dates, products and marketing
  preferences. The companies say the activity was limited to reading, and that
  the attacker did not get passwords or change customers' websites
  [@register; @cudaily].

  123 Reg says attacker infrastructure in China and Singapore indicates "a
  strong Chinese nexus". On Chinese infrastructure it found AI attack skills,
  including copies of skills open-sourced by Anthropic. It suspects either a
  state-sponsored group known for abusing Claude Code, or the actor that used
  the agentic tool ARTEX against South Korean banks. Neither attribution is
  confirmed, and no technical report has been published. The companies
  reported the attack to law enforcement and notified the FTC and UK and EU
  data protection authorities [@register; @cudaily].
