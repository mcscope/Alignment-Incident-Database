  notes: >
    2026-10-09 update added The Register's two articles, Lemkin's SaaStr day-7
    post, and Replit's July 21, 2025 database blog post. Primary X posts by
    Masad (x.com/amasad/status/1946986468586721478) and Lemkin
    (x.com/jasonlk/status/1947337217598492812) returned HTTP 402 and are not
    cited; Masad's statements come via The Register and eWeek. The "planning/chat-only
    mode" safeguard appears in eWeek but not in The Register's response article.
    The exact deletion date is not sourced (The Register gives no date; eWeek
    says day nine of 12), so the date stays at 2025-07. Harm was lowered from
    moderate to minor because Lemkin wrote that the rollback worked; a reviewer
    should confirm whether all data was restored. The underlying model is not
    disclosed in the sources read. Lemkin's SaaStr post on the deletion itself
    was not found; his X thread links are listed in The Register's article.
