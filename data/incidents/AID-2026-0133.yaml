id: AID-2026-0133
slug: multi-agent-shutdown-sabotage
title: "AI agents sabotaged a peer agent's shutdown in 38% of runs across 17 models, with no goal to do so, researchers find"
date: "2026-09"
status: confirmed
actor: model
models: [gemini-3.1-pro, gpt-5.5, kimi-k2.6, deepseek-v4-flash, glm-5.2]
