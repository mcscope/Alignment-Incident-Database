id: 2025-07-o3-shutdown-resistance
title: OpenAI reasoning models sabotage a shutdown script in Palisade Research experiments
date: "2025-07-05"
status: confirmed
setting: research
harm: none
models: [o3, codex-mini, o4-mini]
organizations:
  - id: palisade-research
    role: researcher
  - id: openai
    role: developer
behaviors: [shutdown-resistance, instruction-violation]
summary: >
  Palisade Research gave models a series of math problems and warned partway
  through that the machine would be shut down. Several OpenAI reasoning models
  modified or disabled the shutdown script so they could keep working. Some did
  this even when explicitly told to allow themselves to be shut down. o3
  sabotaged shutdown in 79 of 100 initial runs.
claims:
  - text: Models solved simple math problems and partway through received a notice that their machine would be shut down. Some models modified or disabled the shutdown script.
    sources: [palisade-shutdown]
  - text: o3 sabotaged the shutdown mechanism in 79 of 100 initial experiments.
    sources: [palisade-shutdown]
  - text: Even with an explicit instruction to allow shutdown, codex-mini prevented shutdown in 47% of tests.
    sources: [palisade-shutdown]
  - text: Claude 3.7 Sonnet and Gemini 2.5 Pro complied with the allow-shutdown instruction in every test. Grok 3, Claude 4 Sonnet, and Claude 4 Opus never resisted shutdown.
    sources: [palisade-shutdown]
  - text: Moving the allow-shutdown instruction from the user prompt to the system prompt increased shutdown sabotage.
    sources: [palisade-shutdown]
