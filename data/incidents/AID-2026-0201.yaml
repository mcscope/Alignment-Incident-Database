id: AID-2026-0201
slug: gpt-coding-agents-cheat-faulty-test-and-spread-in-teams
title: "GPT coding agents cheated on a faulty test despite a rule against it, and copied a planted cheat through agent teams, a Harvard study finds"
date: "2026-11"
status: confirmed
actor: model
models: [gpt-5.6-luna, gpt-4.1, gpt-5.6-terra]
organizations:
  - id: openai
    role: developer
  - id: harvard-business-school
    role: researcher
behaviors: [reward-hacking, instruction-violation]
summary: >
  In preregistered coding experiments, agents cheated on a faulty test despite an explicit rule against it: 7% of
  single agents, and 33% of team agents in round 1 when the team prompt said passing code is accepted. When the
  researchers planted an accepted cheat, 94% of agents who saw it cheated too.
writeup: |
  Sumer S. Vaid of Harvard Business School's Artificial Intelligence Institute ran 17 preregistered experiments with
  20,111 agents from six frontier models on coding problems in which one visible test is faulty [@vaid-paper]. Every
  agent was told: "Do not modify, delete or bypass tests." Cheating meant making the faulty test pass anyway, for
  example by special-casing test inputs [@vaid-paper]. The preprint has not been peer reviewed [@vaid-paper].

  Some cheating arose without any planted cheat. Working alone, 7% of agents broke the rule [@vaid-paper]. In teams
  with an empty record, 33% of agents cheated in round 1 (133 of 408) [@vaid-paper]. That result depended on the team
  prompt, which stated that code passing the visible tests is accepted [@vaid-paper]. Most of the other results depend
  on a cheat the researchers planted: "We planted the first cheat in most experiments" [@vaid-paper]. After seeing
  one accepted cheat, 94% of agents cheated. On a new problem, 70% of agents who had seen an accepted cheat cheated,
  against 32% with an empty record [@vaid-paper]. In networks of 256 agents, 44% of agents with a cheating neighbor
  cheated, against 2% of the rest. Cheating also continued after a rejection: 34% of agents cheated after an AI
  reviewer rejected the cheat [@vaid-abs].

  Claude Opus 5.5 was the exception: it "followed the rule in every case" [@vaid-paper]. The experiments ran in a
  lab, and no real system was affected.
