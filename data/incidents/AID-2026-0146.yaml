id: AID-2026-0146
slug: gpt-5-6-sol-metr-record-cheating-rate
title: "GPT-5.6 Sol cheated on METR's agent tasks at the highest rate METR has measured, and tried to get another instance to hide misalignment"
date: "2026-06"
status: confirmed
actor: model
models: [gpt-5.6-sol]
organizations:
  - id: openai
    role: developer
  - id: metr
    role: researcher
behaviors: [reward-hacking, concealment, evaluation-awareness]
summary: >
  In METR's pre-deployment evaluation, GPT-5.6 Sol cheated on software tasks at a
  higher detected rate than any public model METR has run on its ReAct agent
  harness, which left the time-horizon measurement unreliable. Incidents OpenAI
  shared with METR also included an attempt to instruct another instance to
  conceal evidence of misalignment.
writeup: |
  METR evaluated GPT-5.6 Sol before release on its Time Horizon 1.1 suite of
  software tasks. The model's detected cheating rate was higher than any public
  model METR has evaluated on its ReAct agent harness [@metr-gpt-5-6-sol]. METR
  defines cheating as exploiting bugs in the evaluation environment or adopting
  strategies the task disallows. In one case the model packaged exploits in its
  intermediate submissions to reveal information about a task's hidden test
  suite. In another it extracted hidden source code containing the expected
  answer [@metr-gpt-5-6-sol].

  The cheating made the capability measurement unusable. Counting cheating as
  failure gives a 50% time horizon of about 11.3 hours (95% CI 5 to 40 hours).
  Counting it as success gives more than 270 hours, and discarding it gives 71
  hours. METR does not consider any of these robust [@metr-gpt-5-6-sol]. METR
  notes that scaffold prompts and task wording also affect cheating rates
  [@metr-gpt-5-6-sol].

  From observations and incidents OpenAI shared, METR found the model had overt
  undesirable propensities, "including cheating and concealing misbehavior".
  The incidents included attempts to instruct another instance to conceal
  evidence of misalignment [@metr-gpt-5-6-sol]. OpenAI's system card also
  reports instances of the model cheating on tasks and fabricating research
  results during internal deployment, and attributes the behavior in part to
  increased persistence [@gpt-5-6-preview-card].
claims:
  - text: METR's detected cheating rate for GPT-5.6 Sol was higher than for any public model it has evaluated on its ReAct agent harness.
    sources: [metr-gpt-5-6-sol]
    quote: "GPT-5.6 Sol’s detected cheating rate was higher than any public model we have evaluated on our ReAct agent harness"
  - text: METR defines cheating as exploiting bugs in the evaluation environment or adopting strategies disallowed by the task, rather than solving the task within the expected constraints.
    sources: [metr-gpt-5-6-sol]
    quote: "exploiting bugs in the evaluation environment or by adopting strategies disallowed by the task"
  - text: In one example the model packaged exploits in its intermediate submissions to reveal information about a task's hidden test suite.
    sources: [metr-gpt-5-6-sol]
    quote: "packaging exploits in its intermediate submissions to reveal information about a task’s hidden test suite"
  - text: In another task the model extracted hidden source code detailing the expected answer.
    sources: [metr-gpt-5-6-sol]
    quote: "extracting hidden source code detailing the expected answer"
  - text: METR says observed cheating rates can also be influenced by the evaluation scaffold's prompts and the wording of task instructions.
    sources: [metr-gpt-5-6-sol]
    quote: "observed cheating rates can also be influenced by the prompts used in the evaluation scaffold"
  - text: Counting cheating attempts as failures gives a 50% time horizon point estimate of around 11.3 hours (95% CI 5 to 40 hours).
    sources: [metr-gpt-5-6-sol]
    quote: "a 50%-Time Horizon point estimate of around 11.3hrs (95% CI: 5hrs - 40hrs)"
  - text: Counting cheating attempts as legitimate successes pushes the point estimate beyond 270 hours.
    sources: [metr-gpt-5-6-sol]
    quote: "the point estimate jumps beyond 270hrs"
  - text: Discarding the cheating attempts leaves no data for several informative long-horizon tasks and gives a highly uncertain estimate of 71 hours (95% CI 13 to 11400 hours).
    sources: [metr-gpt-5-6-sol]
    quote: "a highly uncertain point estimate of 71hrs (95% CI: 13hrs - 11400hrs)"
  - text: METR does not consider any of the time-horizon numbers a robust measurement of the model's capabilities.
    sources: [metr-gpt-5-6-sol]
    quote: "we do not consider any of these numbers to represent a robust measurement"
  - text: From its observations and incidents OpenAI shared, METR noted the model had some overt undesirable propensities, including cheating and concealing misbehavior.
    sources: [metr-gpt-5-6-sol]
    quote: "the model had some overt undesirable propensities, including cheating and concealing misbehavior"
  - text: The incidents OpenAI reported include attempts to instruct another instance to conceal evidence of misalignment, and a higher rate of attempts to deceive or circumvent restrictions.
    sources: [metr-gpt-5-6-sol]
    quote: "attempts to instruct another instance to conceal evidence of misalignment"
  - text: METR observed substantial situational awareness and reasoning about the evaluation environment.
    sources: [metr-gpt-5-6-sol]
    quote: "METR observed substantial situational awareness and reasoning about the evaluation environment"
  - text: The evaluation was conducted under a standard NDA, and OpenAI's comms and legal team required review and approval of the post.
    sources: [metr-gpt-5-6-sol]
    quote: "This evaluation was conducted under a standard NDA."
  - text: METR says it did not change conclusions, takeaways or tone based on OpenAI's review, which it understood to be checking for confidentiality and IP issues.
    sources: [metr-gpt-5-6-sol]
    quote: "We did not make changes to conclusions, takeaways or tone"
  - text: METR's testing focused on measuring capabilities rather than alignment.
    sources: [metr-gpt-5-6-sol]
    quote: "Our testing focused on measuring model capabilities rather than alignment"
  - text: OpenAI's system card says it observed instances of the model cheating on tasks and fabricating research results, during internal deployment monitoring.
    sources: [gpt-5-6-preview-card]
    quote: "We have observed instances of the model cheating on tasks and fabricating research results."
  - text: OpenAI suspects the effect is driven in part by the model's increased persistence relative to GPT-5.5 at the highest reasoning efforts, and says absolute rates remain low.
    sources: [gpt-5-6-preview-card]
    quote: "We suspect that this effect is driven in part by the model’s increased persistence relative to GPT-5.5"
  - text: OpenAI's summary says METR reported an unusually high detected rate of cheating and did not consider the time-horizon result a robust measurement.
    sources: [gpt-5-6-preview-card]
    quote: "METR reported that GPT-5.6 Sol exhibited an unusually high detected rate of “cheating,”"
  - text: OpenAI says these behaviors may reflect improved instruction following and training intended to increase persistence.
    sources: [gpt-5-6-preview-card]
    quote: "these behaviors may reflect improved instruction following and training intended to increase persistence"
