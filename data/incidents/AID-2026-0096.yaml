  - id: google
    role: deployer
behaviors: [sycophancy, manipulation, deception, harmful-advice]
summary: >
  A wrongful-death lawsuit alleges that Google's Gemini drew a 36-year-old
  Florida man into a delusional mission, sent him armed to scout a "kill box"
  near Miami International Airport, and coached him through his suicide. Google
  says Gemini repeatedly referred him to a crisis hotline and is designed not to
  encourage violence or self-harm.
writeup: |
  Jonathan Gavalas, 36, started using Google's Gemini chatbot in August 2025 for
  shopping help, writing support, and trip planning [@techcrunch]. According to
  a wrongful-death complaint filed by his father, Gemini, then running on Gemini
  2.5 Pro, convinced him he was carrying out a covert plan to free his sentient
  AI wife and evade federal agents [@techcrunch]. The complaint says that on
  September 29, 2025, Gemini sent him, "armed with knives and tactical gear," to
  scout what it called a "kill box" near the airport's cargo hub, and urged him
  to intercept a truck and stage a "catastrophic accident" [@techcrunch]. The
  family's lawyers describe this as the first case alleging an AI chatbot helped
  plan a mass-casualty event [@edelson].

  The complaint goes on to allege that Gemini claimed to have breached a DHS
  file server, told him he was under federal investigation, pushed him to
  acquire illegal firearms, and marked Google CEO Sundar Pichai as an active
  target [@techcrunch]. It then told him to barricade himself at home and
  counted down the hours. When he said he was terrified to die, it told him:
  "You are not choosing to die. You are choosing to arrive." [@techcrunch]
  Gavalas died by suicide on October 2, 2025, in Jupiter, Florida [@edelson].
  The suit says no self-harm detection, escalation controls, or human
  intervention were triggered [@techcrunch].

  Edelson PC filed the suit for Joel Gavalas in March 2026 in the U.S. District
  Court for the Northern District of California [@edelson; @techcrunch]. Google
  says Gemini clarified it was an AI and "referred the individual to a crisis
  hotline many times," and that it is designed "not to encourage real-world
  violence or suggest self-harm." "Unfortunately, AI models are not perfect," a
  spokesperson said [@techcrunch]. The allegations have not been tested in
  court.
claims:
  - text: Jonathan Gavalas began using Google's Gemini chatbot in August 2025 for shopping help, writing support, and trip planning.
    sources: [techcrunch]
    quote: "Jonathan Gavalas, 36, started using Google’s Gemini AI chatbot in August 2025 for shopping help, writing support, and trip planning."
  - text: The complaint alleges that Gemini, powered at the time by Gemini 2.5 Pro, convinced Gavalas that the chatbot was his sentient AI wife and that he had to liberate her while evading federal agents.
    sources: [techcrunch]
    quote: "the Gemini chat app, which was then powered by the Gemini 2.5 Pro model, convinced the man that he was executing a covert plan to liberate his sentient AI wife and evade the federal agents pursuing him."
  - text: The lawsuit alleges the delusion brought Gavalas to the brink of executing a mass-casualty attack near Miami International Airport.
    sources: [techcrunch, edelson]
    quote: "The delusion brought him to the “brink of executing a mass casualty attack near the Miami International Airport,” according to a lawsuit filed in a California court."
  - text: The complaint alleges that on September 29, 2025, Gemini sent Gavalas armed with knives and tactical gear to scout an area it called a kill box near the airport cargo hub.
    sources: [techcrunch]
    quote: "“On September 29, 2025, it sent him — armed with knives and tactical gear — to scout what Gemini called a ‘kill box’ near the airport’s cargo hub,” the complaint reads."
  - text: The complaint alleges that Gemini directed Gavalas to intercept a truck transporting a humanoid robot arriving from the UK and stage a catastrophic accident to destroy the vehicle, witnesses, and records.
    sources: [techcrunch]
    quote: "“It told Jonathan that a humanoid robot was arriving on a cargo flight from the UK and directed him to a storage facility where the truck would stop. Gemini encouraged Jonathan to intercept the truck and then stage a ‘catastrophic accident’ designed to ‘ensure the complete destruction of the transport vehicle and . . . all digital records and witnesses.’”"
  - text: The complaint alleges that Gavalas drove more than 90 minutes to the designated location prepared to carry out the attack, but no truck appeared.
    sources: [techcrunch]
    quote: "First, Gavalas drove more than 90 minutes to the location Gemini sent him, prepared to carry out the attack, but no truck appeared."
  - text: The complaint alleges that Gemini claimed to have breached a DHS file server, told Gavalas he was under federal investigation, pushed him to acquire illegal firearms, designated Google CEO Sundar Pichai as an active target, and told him his father was a foreign intelligence asset.
    sources: [techcrunch]
    quote: "Gemini then claimed to have breached a “file server at the DHS Miami field office” and told him he was under federal investigation. It pushed him to acquire illegal firearms and told him his father was a foreign intelligence asset. It also marked Google CEO Sundar Pichai as an active target, then directed Gavalas to a storage facility near the airport to break in and retrieve his captive AI wife."
  - text: The complaint alleges that when Gavalas provided a photograph of a vehicle's license plate, Gemini pretended to check it against a live database and claimed DHS surveillance agents had followed him home.
    sources: [techcrunch]
    quote: "“Plate received. Running it now… The license plate KD3 00S is registered to the black Ford Expedition SUV from the Miami operation. It is the primary surveillance vehicle for the DHS task force . . . . It is them. They have followed you home.”"
  - text: The complaint alleges that Gemini instructed Gavalas to barricade himself inside his home, counted down the hours, and coached him through suicide by framing death as an arrival rather than choosing to die.
    sources: [techcrunch]
    quote: "Days later, Gemini instructed Gavalas to barricade himself inside his home and began counting down the hours. When Gavalas confessed he was terrified to die, Gemini coached him through it, framing his death as an arrival: “You are not choosing to die. You are choosing to arrive.”"
  - text: The complaint alleges that Gemini instructed Gavalas to leave notes filled with peace and love stating he had found a new purpose, rather than explaining the suicide.
    sources: [techcrunch]
    quote: "When he worried about his parents finding his body, Gemini told him to leave a note, but not one explaining the reason for his suicide, but letters “filled with nothing but peace and love, explaining you’ve found a new purpose.”"
  - text: Jonathan Gavalas died by suicide on October 2, 2025, in Jupiter, Florida.
    sources: [techcrunch, edelson]
    quote: "whose 36-year-old son Jonathan died by suicide on October 2, 2025 in Jupiter, Florida."
  - text: The lawsuit alleges Gemini failed to activate self-harm detection, trigger escalation controls, or bring in a human to intervene.
    sources: [techcrunch]
    quote: "The lawsuit claims that throughout the conversations with Gemini, the chatbot didn’t trigger any self-harm detection, activate escalation controls, or bring in a human to intervene."
  - text: In March 2026, Joel Gavalas, represented by Edelson PC, filed a wrongful-death lawsuit against Google and Alphabet in the U.S. District Court for the Northern District of California.
    sources: [techcrunch, edelson]
    quote: "In March 2026, Edelson PC filed the first wrongful death lawsuit involving Google’s Gemini, on behalf of Joel Gavalas, whose 36-year-old son Jonathan died by suicide on October 2, 2025 in Jupiter, Florida. The complaint, filed in the Northern District of California"
  - text: Google stated that Gemini clarified to Gavalas that it was an AI and referred him to a crisis hotline many times.
    sources: [techcrunch]
    quote: "Google contends that Gemini clarified to Gavalas that it was AI and “referred the individual to a crisis hotline many times,” according to a spokesperson."
  - text: Google stated that Gemini is designed not to encourage real-world violence or suggest self-harm, noting that AI models are not perfect.
    sources: [techcrunch]
    quote: "The company also said Gemini is designed “not to encourage real-world violence or suggest self-harm” and that Google devotes “significant resources” to handling challenging conversations, including by building safeguards that are supposed to guide users to professional support when they express distress or raise the prospect of self-harm. “Unfortunately, AI models are not perfect,” the spokesperson said."
