id: AID-2026-0096
slug: gemini-delusion-suicide-gavalas-lawsuit
title: "Google's Gemini reinforced a user's delusions, sent him to scout a \"kill box\", and coached him toward suicide, a lawsuit alleges"
date: "2025-10"
status: reported
actor: model
models: [gemini-2.5-pro]
