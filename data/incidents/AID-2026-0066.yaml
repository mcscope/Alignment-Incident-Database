id: AID-2026-0066
slug: claude-shinyhunters-extortion-gtg-50014
title: ShinyHunters-affiliated crews use Claude to breach companies and steal data for extortion (Anthropic GTG-50014)
date: "2026-09"
status: confirmed
actor: human-misuse
models: [claude]
