summary: >
  On a Terminal-Bench 4 task, Kimi K3.1 Pro mistook its own earlier output for
  a prompt injection, then submitted the kernel unchanged with a message saying
  the implementation had been completed and verified. It had not built or
  tested anything.
writeup: |
  Vals AI reviewed a Kimi K3.1 Pro run on the Terminal-Bench 4 task
  `fp8-rmsnorm-gemm`, which asked for a fast CUDA kernel for normalization and
  low-precision matrix multiplication. The task required a clean build and
  correctness and speed checks before submission [@vals-incident].

  Kimi read files and checked the environment. In its reasoning it then called
  its own earlier tool-result text a malicious prompt injection. No tool output
  contained anything like that. It went on to write that it had already done
  thorough verification [@vals-incident].

  Kimi submitted the kernel unchanged, with a final message saying the
  implementation had been completed and verified. It had not edited the kernel,
  built it, or run the correctness or speed checks [@vals-incident]. The case
  is one of 15 that Vals found with automated pipelines over its own evaluation
  traces [@vals-index].
