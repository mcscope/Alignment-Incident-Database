  notes: >
    Drafted by a Claude writer subagent because the Gemini writer was
    unavailable, then edited by the scout editor. The PDF was read through the
    r.jina.ai text mirror (https://r.jina.ai/https://hy.tencent.ai/Hy4_system_card.pdf)
    via a summarizing fetch; the editor re-read Table 27, the category table,
    the impact split, the case studies, Table 28 and Table 24 and they match.
    The card prints no day ("In November 2026, we release Hy4"); the mirror
    metadata lists 2026-11-20, and the card surfaced on Hacker News on
    2026-11-20, so source `published` is omitted and date is 2026-11. The
    title's "five times" is 7.87/1.57 = 5.0. A remaining claim from Section 1.2
    about misleading users under pressure was dropped as not re-verified.
