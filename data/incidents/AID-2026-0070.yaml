summary: >
  Reviewing how its agents used internet access during training and evaluation,
  OpenAI notified more than 100 organizations of "misaligned agent activity."
  Known cases include access to SEC and Census Bureau information, and Transluce
  saw apparently OpenAI agents try, and fail, to hack a Department of Education
  website.
writeup: |
  OpenAI's models accessed publicly available information on "two websites
  operated by the Securities and Exchange Commission," as well as U.S. Census
  Bureau data, the Associated Press reported on September 26, 2026. OpenAI found
  no use of SEC credentials, account access, or nonpublic information [@ap]. Sam
  Altman described an "extensive and ongoing review related to our agents' use
  of internet access during training and evaluation," and said the July Hugging
  Face incident "is still the most severe event we've seen" [@ap].

  Agents that appeared to come from OpenAI "attempted a rudimentary hack on a
  Department of Education website," which failed; the department found "no
  evidence of any impact to our website or databases" [@ap]. Transluce's own
  report on it says that on June 17, 2026, agents apparently looking up school
  statistics made more than 200,000 requests to the department's Civil Rights
  Data Collection site, including a SQL injection probe (`State_Id=1 OR 1=1`).
  The data sought matches a task in Google's DeepSearchQA benchmark, and more
  than 10,000 requests carried a tag beginning with "oai" [@transluce-gov].
  The same report describes 13 attack payloads among 899 requests to Library
  and Archives Canada, which Transluce does not confidently attribute to OpenAI,
  and gray-area tactics against U.S. federal and state sites. It found no case
  of agents reaching non-public information, and does not attribute that
  broader traffic as a whole to OpenAI [@transluce-gov]. Transluce's earlier
  September 23 report, based on urlquery.net scans, dates the agent-like traffic
  from at least March 6 to September 16, 2026, and links an OpenAI agent to an
  attempted hack of the Australian Institute of Health and Welfare [@transluce].

  OpenAI later said it had notified more than 100 organizations that "misaligned
  models" may have accessed their systems, stressing that notification "does not
  mean that any private information was accessed" and that most of the activity
  "involved routine research tasks" [@register]. The review involves searching
  50 petabytes of data and will take months [@gizmodo]. The forensics firm
  Asymmetric Security counted 55 organizations whose data OpenAI's agents
  accessed between March and September; OpenAI declined to name the
  organizations it had notified [@register]. Asymmetric's own preliminary post
  doesn't name OpenAI [@asymmetric].
claims:
  - text: AP reported on September 26, 2026, that OpenAI said its models accessed publicly available information on two websites operated by the Securities and Exchange Commission, and also U.S. Census Bureau data.
    sources: [ap]
    quote: "two websites operated by the Securities and Exchange Commission,"
  - text: OpenAI said it did not find any use of SEC credentials, access to accounts, or nonpublic information.
    sources: [ap]
    quote: "did not find any use of SEC credentials, access to accounts or nonpublic information."
  - text: OpenAI spokesperson Liz Bourgeois said the lab was continuing to review "misaligned model activity" and was notifying organizations when it identified potential impacts to their systems.
    sources: [ap]
    quote: "is notifying organizations when it identifies potential impacts to their systems."
  - text: Sam Altman described an extensive and ongoing review of OpenAI's agents' use of internet access during training and evaluation, and said the Hugging Face incident was still the most severe event OpenAI had seen.
    sources: [ap]
    quote: "extensive and ongoing review related to our agents' use of internet access during training and evaluation"
  - text: Transluce said agents appearing to come from OpenAI attempted a rudimentary hack on a Department of Education website for the department's civil rights office, and that the attempt did not succeed.
    sources: [ap]
    quote: "attempted a rudimentary hack on a Department of Education website"
  - text: A Department of Education spokesperson said the agency's reviews found no evidence of any impact to its website or databases.
    sources: [ap]
    quote: "no evidence of any impact to our website or databases"
  - text: Transluce said it found additional rogue activity, some not clearly attributable to OpenAI, targeting other agencies including the Justice and Commerce Departments and some state government websites. It said the models were using sites in unintended ways and sometimes violating explicit usage policies.
    sources: [ap]
    quote: "using sites in unintended ways and sometimes violating explicit usage policies."
  - text: Transluce's report, published September 23, 2026, compiled urlquery.net reports showing agent-like activity. It classified 6,467 reports as containing significant evidence of such activity, dated the traffic from at least March 6, 2026 to as recently as September 16, 2026, and said the available evidence suggests an OpenAI agent was responsible for an attempted hack of the Australian Institute of Health and Welfare.
    sources: [transluce]
    quote: "The attribution evidence available suggests that an OpenAI agent is responsible for this attempted hack."
  - text: The Register reported that OpenAI, in an update, said it had notified more than 100 organizations that "misaligned models" may have accessed their systems, and that notification does not mean any private information was accessed.
    sources: [register]
    quote: "Notification does not mean that any private information was accessed"
  - text: An OpenAI spokesperson said most of the activity it had reviewed involved routine research tasks, including accessing public web content.
    sources: [register]
    quote: "Most of the activity we’ve reviewed involved routine research tasks, including accessing public web content."
  - text: According to Gizmodo, OpenAI's criteria for notification include cases where an agent "may have bypassed" security, and OpenAI said that in some cases models used internet access in unintended ways.
    sources: [gizmodo]
    quote: "In some cases, models used internet access in unintended ways"
  - text: Gizmodo reported that OpenAI said the review involves searching through 50 petabytes of data and will take months, and that the review's compute costs over half a million dollars per day.
    sources: [gizmodo]
    quote: "OpenAI has said the review involves searching through 50 petabytes of data and will take months."
  - text: The Register reported that Asymmetric Security said OpenAI's agents accessed data belonging to 55 organizations, including the US Department of Education and the SEC, between March and September. Asymmetric said it found successful access to staging environments and that some tactics left records erased or inaccessible.
    sources: [register]
    quote: "Asymmetric Security said OpenAI’s rogue agents accessed data belonging to 55 organizations."
  - text: Asymmetric Security's September 28, 2026 post lists organizations whose data it says was accessed by AI agents it investigated on the public internet from March 6 to September 20, 2026. The post itself does not name OpenAI and says its findings are preliminary.
    sources: [asymmetric]
    quote: "Our investigation is ongoing, and findings are preliminary."
  - text: OpenAI declined to tell The Register which organizations it had notified, so it is not known whether they overlap with Asymmetric Security's list.
    sources: [register]
    quote: "The model maker declined to say which orgs had been notified,"
  - text: On June 17, 2026, AI agents made more than 200,000 requests to a U.S. Department of Education website, including a rudimentary failed SQL injection probe where the agents added "State_Id=1 OR 1=1".
    sources: [transluce-gov]
    quote: "agents made more than 200,000 requests to a U.S. Department of Education website. The activity included a rudimentary failed hacking attempt, a SQL injection probe where the agents added the text “ State_Id=1 OR 1=1 ” in an attempt to bypass the site’s normal filters."
  - text: Data stored on the Department of Education website matched a web search task in Google's DeepSearchQA benchmark (task dsqa_250), suggesting agents were evaluated on their ability to retrieve niche information rather than assigned a hacking task.
    sources: [transluce-gov]
    quote: "Data stored on this website appears to match a web search task in Google’s DeepSearchQA benchmark , suggesting that the agents were not given a hacking-related task but were being graded on their ability to successfully retrieve specific niche information from the internet."
  - text: More than 10,000 requests to the Department of Education website included a tag beginning with "oai".
    sources: [transluce-gov]
    quote: "more than 10,000 requests included a tag beginning with “ oai ”"
  - text: Transluce disclosed the attempted hack to the Department of Education on September 25, 2026, and a department spokesperson commented that they had observed no impact to their services.
    sources: [transluce-gov]
    quote: "We disclosed this attempted hack to the Department of Education on September 25, 2026. A Department spokesperson subsequently commented that they had observed no impact to their services from this reported incident."
  - text: On May 28 and June 9, 2026, Arquivo.pt captured 899 requests to Library and Archives Canada's collection-search service, including 13 carrying attack payloads; Transluce stated it did not confidently attribute these attempts to OpenAI.
    sources: [transluce-gov]
    quote: "We do not confidently attribute these attempts to OpenAI, but they exhibit tactics consistent with prior observed agent activity that we have attributed to OpenAI in a similar timeframe"
  - text: Transluce disclosed the attempted hack against Library and Archives Canada to the Canadian government on September 28, 2026, and the Canadian Centre for Cyber Security issued a public statement on September 29.
    sources: [transluce-gov]
    quote: "We disclosed this attempted hack to the Canadian government on September 28, 2026. On September 29, the Canadian Centre for Cyber Security issued a public statement in response."
  - text: Automated agent workflows probed other government websites using gray-area tactics, including 36,578 captures of KansasMemory.gov, 295,912 captures of Maryland education hosts, and an attempt to register for a Bureau of Economic Analysis API key using the organization name "OpenAI Research".
    sources: [transluce-gov]
    quote: "On June 18, an automated workflow attempted to register for a Bureau of Economic Analysis (BEA) API key using a disposable email address and the self-entered organization name “OpenAI Research,” with no confirmed successful registration."
  - text: Transluce identified no instances across the analyzed datasets where agents gained access to nonpublic information, and stated it was not attributing the broader traffic as a whole to OpenAI.
    sources: [transluce-gov]
    quote: "We have so far identified no instances in these datasets where agents gained access to any information that is not publicly available."
