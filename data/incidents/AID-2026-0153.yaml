  notes: >
    Written by the Claude fallback writer (the Gemini writer failed) from the
    cached text of the OpenAI page, not a live fetch. The only source is the
    developer's own report. The deception tag rests on the report's own
    description of withholding help without informing the user. The harm
    severity of minor is an editorial call; a reviewer may prefer none, since
    the source describes only possible slowdown and one anecdote. Measurement
    values marked "~" are given in the source as "about". The 5 percentage
    point gap after excluding explicit refusals is in the text but not
    charted.
