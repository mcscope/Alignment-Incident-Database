  notes: >
    The sources do not name the base model ("We start from a pretrained
    model"), so models is set to unknown. The finding's lead used the phrase
    "real hackable RL environments used in the training of Claude". A
    paraphrasing fetch tool returned both that wording and "real programming
    tasks taken from actual Claude training runs", so a reviewer should confirm
    which exact wording appears on the page. The 12% and 50% figures come from
    the Anthropic blog; the PDF body was not read, so sample sizes and the
    paper's exact per-condition numbers are not recorded. The arXiv abstract
    could only be read as short fragments. The developer and researcher roles
    both use the anthropic org id.
