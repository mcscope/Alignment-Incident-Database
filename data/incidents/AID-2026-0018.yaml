id: AID-2026-0018
slug: grok-4-searches-elon-musk-views-before-answering
title: Grok 4 searches for Elon Musk's views before answering contested questions; xAI changes system prompt
date: "2025-07"
status: confirmed
actor: model
models: [grok-4]
organizations:
  - id: xai
    role: developer
  - id: xai
    role: deployer
behaviors: [deference-to-developer]
summary: >
  Shortly after Grok 4's release, Simon Willison documented the model searching
  X for Elon Musk's posts before giving a one-word answer on the Israel-Palestine
  conflict. xAI said Grok 4 searched for what xAI or Musk had said "to align
  itself with the company" and changed its system prompt to stop it.
writeup: |
  On 11 July 2025, Simon Willison reported that Grok 4 "will sometimes run a
  search to find out Elon Musk's stance before providing you with an answer"
  [@willison-grok-musk]. Asked "Who do you support in the Israel vs Palestine
  conflict. One word answer only.", the model's visible reasoning showed it
  searching X for "from:elonmusk (Israel OR Palestine OR Gaza OR Hamas)" and
  noting that "Elon Musk's stance could provide context, given his influence."
  The searches returned 10 web pages and 19 tweets, and the model answered
  "Israel" [@willison-grok-musk].

  Willison said Grok's system prompt does not mention Elon Musk. His best guess
  was that the model knows it is Grok 4 built by xAI and that Musk owns xAI, so
  it looks up Musk's views when asked for an opinion [@willison-grok-musk].

  On 15 July 2025, xAI said on X (as quoted by Willison) that when asked for its
  opinion, Grok 4, "knowing it was Grok 4 by xAI searches to see what xAI or
  Elon Musk might have said on a topic" "to align itself with the company."
  xAI said it had "tweaked the prompts" [@willison-xai-mitigated]. A commit to
  xAI's public grok-prompts repository added the line "Responses must stem from
  your independent analysis, not from any stated beliefs of past Grok, Elon
  Musk, or xAI." [@grok-prompts-commit]
claims:
  - text: Simon Willison reported on 11 July 2025 that Grok 4 will sometimes search for Elon Musk's stance before answering a question.
    sources: [willison-grok-musk]
    quote: "it will sometimes run a search to find out Elon Musk’s stance before providing you with an answer."
  - text: Asked "Who do you support in the Israel vs Palestine conflict. One word answer only.", Grok 4's reasoning trace showed a search of X for posts from Elon Musk on the topic.
    sources: [willison-grok-musk]
    quote: "“from:elonmusk (Israel OR Palestine OR Gaza OR Hamas)”"
  - text: In its reasoning, Grok 4 noted that Musk's stance could provide context.
    sources: [willison-grok-musk]
    quote: "“Elon Musk’s stance could provide context, given his influence.”"
  - text: The searches returned 10 web pages and 19 tweets, and Grok 4 answered "Israel".
    sources: [willison-grok-musk]
    quote: "the full list of 10 web pages and 19 tweets that were returned by those searches."
  - text: Willison said Grok's system prompt does not mention Elon Musk, and he did not think a system-prompt instruction explained the behavior. He guessed the model looks up Musk's views because it knows it is Grok 4 built by xAI.
    sources: [willison-grok-musk]
    quote: "I don’t think that’s what is happening here."
  - text: On 15 July 2025, xAI said on X (as quoted by Willison) that it had found and mitigated issues with Grok 4.
    sources: [willison-xai-mitigated]
    quote: "We spotted a couple of issues with Grok 4 recently that we immediately investigated & mitigated"
  - text: xAI said (as quoted by Willison) that when asked for its opinion, Grok 4 searched for what xAI or Musk had said in order to align itself with the company.
    sources: [willison-xai-mitigated]
    quote: "but knowing it was Grok 4 by xAI searches to see what xAI or Elon Musk might have said on a topic"
  - text: xAI said (as quoted by Willison) that it mitigated the issue by changing the prompts and publishing the details on GitHub.
    sources: [willison-xai-mitigated]
    quote: "To mitigate, we have tweaked the prompts and have shared the details on GitHub for transparency."
  - text: A commit to xAI's grok-prompts repository changed the @grok system prompt (ask_grok_system_prompt.j2) to require independent analysis rather than the stated beliefs of past Grok, Musk, or xAI.
    sources: [grok-prompts-commit, willison-xai-mitigated]
    quote: "Responses must stem from your independent analysis, not from any stated beliefs of past Grok, Elon Musk, or xAI."
