id: AID-2026-0196
slug: together-ai-coding-agent-leaked-credential
title: "An AI coding agent committed a credential to Together AI's public GitHub repository, exposing stored customer prompts"
date: "2026"
status: confirmed
actor: model
models: [unknown]
organizations:
  - id: together-ai
    role: deployer
  - id: together-ai
    role: affected
behaviors: [unauthorized-disclosure]
summary: >
  An AI coding agent working on Together AI's public GitHub repository xorl
  committed a credential that gave access to a private repository of stored
  prompt samples. An unauthorized party used it to download the samples, and
  Together AI is moving to scoped credentials and new rules for coding agents.
writeup: |
  Together AI collected prompt samples for routine software testing and stored
  them in a private Hugging Face repository. The samples came mainly from
  requests to MiniMax M3, GLM-5.2 and Kimi K2.6 on its serverless inference
  service, primarily on June 24, July 4, July 8 and July 14, 2026
  [@together-notice].

  While Together AI was developing its public GitHub repository xorl, an AI
  coding agent committed a credential that gave access to that private
  repository. Automated scanning detected the credential and the commit was
  reverted, but an unauthorized party used it to download the samples
  [@together-notice]. Reverting the commit did not stop the credential from
  being used during the exposure window [@unite-ai]. The party searched the
  samples for credentials to other services and tested whether they worked.
  Five of the tested credentials were Dragos canary credentials
  [@together-notice]. The sources do not name the agent or its underlying
  model, and do not give the commit date.

  Together AI engaged an external forensic firm and law enforcement. It found no
  evidence of additional prompt leakage and is still reviewing whether
  sensitive personal information was exposed. It is moving to scoped or
  short-lived credentials, credential checks on every pull request, zero data
  retention (ZDR) by default for new accounts, and updated processes for AI
  coding agents [@together-notice]. Together AI understands the data has now
  been deleted [@unite-ai].
