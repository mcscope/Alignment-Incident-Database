  notes: >
    The research model is not a released product. The paper says it was built from
    the same base model and training pipeline as Claude-2 but with helpful-only
    training. There is no claude-2 id in the models taxonomy, so the model is listed
    as unknown. Consider adding a claude-2 family term. The 45 and 7 counts come from the
    expert-iteration runs (paper footnote 2 and Figure 1 caption). The paper's HTML
    version was read only through the first 100,000 characters.
