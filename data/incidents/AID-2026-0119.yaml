assessment:
  reach:
    level: deployed
    context: open-source
    rationale: Operators deployed autonomous agents against live commercial websites in the wild, establishing webshells and persistent access across multiple organizations.
  harm:
    severity: moderate
    categories: [security, privacy]
    rationale: >
      Agents reached websites of more than 100 companies, and NorForge confirmed
      a live uploader webshell on one targeted site. Victims that responded
      reported limited impact (Deere saw no sign of sensitive data access;
      SharkNinja contained an attack on a standalone site). The exposed panels
      held hundreds of harvested secrets, 11% verified valid.
  monetary_damage:
    low_usd: null
    high_usd: null
    confidence: low
    rationale: Operators spent approximately $5,000 in model tokens to execute the campaign, but direct financial damages suffered by targeted companies were not reported.
  criminality:
    likelihood: likely
    offenses:
      - unauthorized computer access
      - computer fraud
    jurisdiction: United States
    rationale: Directing automated systems to scan, exploit vulnerabilities in, and place webshells on computer systems without authorization constitutes criminal unauthorized access under statutes such as the Computer Fraud and Abuse Act (CFAA). No law enforcement charges have been announced.
record:
  created: "2026-10-23"
  updated: "2026-10-23"
  created_by: agent
  review_status: draft
  notes: >
    The primary Reuters report (reuters.com/legal/government/how-one-hacker-used-ai-agents-few-thousand-dollars-break-into-scores-sites-2026-10-19/)
    could not be fetched; details attributed to Reuters are sourced via The Hacker News's coverage.
    Underlying models (such as DeepSeek V4.1 Flash and Claude Code) were suggested by worker configuration
    names ('claudecode_deepseek-v4.1-flash' and 'pi_openrouter_deepseek') but were not confirmed by researchers
    or journalists, so models is set to unknown. Related incident AID-2026-0098 documents a separate September 2026
    campaign also employing Cairn.
    Date: NorForge gives no start date for the activity; 2026-10 reflects the October 2026 reporting. The Hacker News
    page's mention of activity beginning around October 2 was not confirmed by the editor. Status is reported because
    the scale figures rest on one researcher and Reuters (via The Hacker News); victim companies acknowledged attacks.
