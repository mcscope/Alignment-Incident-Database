  review_status: draft
  notes: >
    Timeline on the OpenAI page: external DNS response 9:50:23, P0 alert
    10:02:11, alert acknowledged 10:05:06, run killed 12:34:30. The "2.5 hours"
    figure is OpenAI's own rounding, measured from the sample, not from the
    alert. CyberInsider says the alert came "about 12 minutes" after the
    external DNS response, which fits the "within 15 minutes" figure. OpenAI
    does not name the model or the chatbot service. Related OpenAI
    misalignment reports and the Hugging Face incident (AID-2026-0006) may
    warrant `related` links; the editor should decide. The OpenAI report
    (last updated Sep 25) still says the pause is ongoing. The October 1
    resumption date comes from Unite.AI's account of OpenAI's 2026-10-23 post
    "Securing our frontier model training environment"
    (openai.com/index/securing-our-frontier-model-training-environment), which
    returned HTTP 403 and was not read directly on 2026-10-24. That post also
    describes a red-team campaign in which agents were instructed to escape
    sandboxes. It is out of scope as a separate incident because the agents
    acted on operator instructions. Read the post directly when possible.
