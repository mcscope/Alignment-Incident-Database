assessment:
  reach:
    level: deployed
    context: product
    rationale: Microsoft reports real intrusions into a production multi-tenant service and real customer tenants, not a lab or evaluation.
  harm:
    severity: moderate
    categories: [security]
    rationale: ConnectWise's Cloud Backup was compromised and services had to be contained and restored in phases, and some intrusions reached privileged access in customer tenants. Most targeting failed, and the sources do not say what data was taken from downstream customers, so severity is held at moderate.
  monetary_damage:
    low_usd: null
    high_usd: null
    confidence: low
    rationale: No sourced figures for losses or remediation costs.
  criminality:
    likelihood: likely
    offenses: [unauthorized computer access]
    rationale: Using stolen application credentials to break into a vendor's service and its customers' tenants is computer intrusion in nearly every jurisdiction. The actor is state-aligned per Microsoft, no charges are sourced, and China rejects the accusation.
record:
  created: "2026-10-25"
  updated: "2026-10-25"
  created_by: agent
  review_status: draft
  notes: >
    Written by the lead editor, not the Gemini writer, because OpenRouter
    returned HTTP 402 (out of credits). Microsoft's post was read through
    WebFetch's summarizer, which limits verbatim quotes to short segments, so a
    reviewer should re-check the quotes against the page. Claims without a
    quote rest on that summary. Reuters was blocked and was read through a WHTC
    syndicated copy, again through a summarizer, so the CEO quote should be
    checked as well. Microsoft names no specific LLM, so models is `unknown`.
    The sources do not say that the agents acted beyond the operator's intent.
    This is human misuse with the AI doing most of the intrusion work. ARTEX is
    the same framework as in AID-2026-0068, but that record is a different,
    financially motivated actor. An October 13 analysis by Rescana describes a
    compromised ConnectWise service-account credential affecting 173 Microsoft
    365 tenants. It was seen only in a search snippet, was not read, and may
    conflict with Microsoft's figures. ConnectWise's own October 16 notice was
    not read.
