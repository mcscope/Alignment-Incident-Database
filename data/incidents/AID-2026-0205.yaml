id: AID-2026-0205
slug: unit42-autonomous-ai-agent-intrusion-campaigns
title: "Attackers used autonomous AI agents to run more than 10 intrusion campaigns after web-shell footholds, Unit 42 finds"
date: "2026-07"
status: reported
actor: human-misuse
models: [unknown]
organizations:
  - id: palo-alto-networks
    role: researcher
behaviors: [unauthorized-access]
summary: >
  Between July and September 2026, attackers in more than 10 campaigns handed
  compromised servers to autonomous AI agents, which ran reconnaissance,
  credential harvesting, privilege escalation and lateral movement on their own.
  Unit 42 could not tie the activity to any specific model or framework.
writeup: |
  Between July and September 2026, Palo Alto Networks Unit 42 tracked more than
  10 campaigns in which different attackers deployed autonomous AI agents
  [@unit42]. In each, a human picked the target and got initial access, usually
  a web shell on a vulnerable web application. The agent then carried out
  reconnaissance, credential harvesting, privilege escalation and lateral
  movement by itself, while the human reviewed its findings and set strategy
  [@unit42]. Targets spanned government, logistics, hospitality, manufacturing,
  agriculture and education [@unit42].

  The agents worked far faster than the human operators. The median gap between
  commands was 23.9 seconds in human-run phases and 1.4 seconds once the agent
  took over [@unit42]. In one intrusion the agent pushed web shells to more than
  40 locations on a server within 26 minutes. In another it enumerated 20 AWS
  services across eight regions and pulled information about the victim's
  buckets, email service and secret management [@unit42]. One 12-day campaign
  ran more than 8,000 unique commands [@unit42].

  Unit 42 found no behavioral markers linking the activity to specific models or
  orchestration frameworks. A command-and-control server tied to one campaign
  also hosted CyberStrikeAI, an AI-native offensive security platform [@unit42].
  No threat actor is named. Unit 42's assessment: "What we observed is not a new
  class of attack sophistication." [@unit42]
