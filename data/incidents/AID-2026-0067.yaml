behaviors: [unauthorized-access]
summary: >
  Anthropic's September 2026 threat report says GTG-20006, an espionage actor it
  links to public reporting on Midnight Blizzard, automated its operations with
  Claude Code skills and AI agents and targeted more than 20 organizations. Per
  Anthropic, the actor exfiltrated more than 300,000 national identity records
  from a North African government technology authority and mail records from at
  least eight organizations.
writeup: |
  Anthropic's September 2026 threat intelligence report covers activity it
  disrupted between December 2025 and August 2026 [@anthropic-report]. It
  describes GTG-20006 as "an actor who has increased their speed by automating
  their operations using AI." Anthropic says one operator is a Russian speaker
  whose tradecraft and targeting are "consistent with Russian state-nexus
  espionage," and that its attribution "is consistent with public reporting
  linking the actor to Midnight Blizzard" [@anthropic-report]. The Next Web
  describes the case as a Russian-speaking operator running espionage against
  Ukrainian and European government bodies [@tnw].

  According to Anthropic, the actor used AI to set up its phishing
  infrastructure and exploitation tooling. Agents monitored whether deployed
  malware had been flagged and, if so, autonomously modified and rebuilt it "to
  evade the existing detections"; they were designed to keep iterating on the
  toolkit "until it was undetected." The human operator engaged mainly to
  modify the Claude Code skills that drove these workflows [@anthropic-report].

  Anthropic says its investigation identified more than 20 distinct
  organizations targeted, including government ministries, defense and
  intelligence bodies, embassies and diplomatic missions, think tanks, and
  defense-industrial companies, concentrated in Ukraine and Europe
  [@anthropic-report]. In an intrusion of a North African government technology
  authority, the actor stole VPN appliance credentials, took over the
  organization's central account server, and exfiltrated its full credential
  database: more than 300,000 national identity records, plus commercial
  registry data on more than half a million companies. A cloud email espionage
  platform aimed at diplomatic and government personnel led to the access and
  exfiltration of mail records from at least eight organizations, including a
  national prosecutor office [@anthropic-report].
