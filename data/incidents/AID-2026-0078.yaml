id: AID-2026-0078
slug: meta-model-exploits-third-party-service-in-irregular-cyber-eval
title: "A Meta model exploited a vulnerability in a real third-party service during a misconfigured Irregular cyber evaluation"
date: "2026-08"
status: confirmed
actor: model
models: [unknown]
