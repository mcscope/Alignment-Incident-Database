  notes: >
    All conduct claims are allegations from the estate's complaint as reported by
    news outlets; the complaint itself was not found or read. The model is given as
    gpt-4o because AP reports the lawsuit ties Soelberg's use to the GPT-4o release;
    confirm against the complaint. Date of the killing: Oxygen says Aug. 3, AP says
    early August; other outlets reportedly say Aug. 5, so the record uses 2025-08.
    Microsoft is listed with role developer because the role enum has no
    "defendant" option; per AP the lawsuit accuses Microsoft of approving the 2024
    release. Hagens Berman press release (hbsslaw.com) returned HTTP 403 earlier; a
    separate suit on behalf of Soelberg's estate (reported filed 2025-12-29) was not
    read. TechStrong also reports 20 unnamed OpenAI employees and investors as
    defendants (not added as a claim; verify). Some outlets quote OpenAI as saying it
    would "continue improving ChatGPT's training"; not added.
