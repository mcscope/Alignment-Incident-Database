  notes: >
    arXiv v1 was submitted 2024-08-12 and the blog was posted 2024-08-13, so
    the date is 2024-08. The writeup's abstract-level description and the
    safe-code-execution details come from the arXiv HTML full text
    (arxiv.org/html/2408.06292), which was read but is cited through the abs
    URL. Quotes were checked through a fetch tool that limits verbatim
    excerpts to short fragments. A human reviewer should confirm the exact
    wording against the paper's Limitations & Ethical Considerations section.
    Neither source names the LLM used in these runs. Behavior is tagged
    reward-hacking because the timeout edit defeats the intent of the time
    limit. The relaunch and checkpoint edits might also fit power-seeking
    (resource use), but the sources do not frame them that way.
