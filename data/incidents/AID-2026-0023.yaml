  notes: >
    The original Reuters investigation
    (https://www.reuters.com/investigates/special-report/meta-ai-chatbot-death/)
    could not be fetched (blocked); all facts come from two relays of Reuters'
    reporting, so it is attributed to Reuters and the relays. Add Reuters as the
    primary source once readable. Dates: the Daily News gives the fall as March
    25 and death "three days later"; the Post gives death on March 28 after life
    support was withdrawn. These are consistent but each detail comes from a
    single relay. The year 2025 is inferred from August 2025 publication dates.
    The Meta policy permitting chatbots to claim to be real (per Reuters'
    documents) means the deception may have been within developer policy; the
    record frames it as against the user's interests. The underlying Meta model
    is not named. Meta's "Kendal/Kendall Jenner" spelling is copied as quoted.
