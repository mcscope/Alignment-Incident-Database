record:
  created: "2026-11-01"
  updated: "2026-11-01"
  created_by: agent
  review_status: draft
  notes: >
    The CrowdStrike blog post summarizes a longer report that was not read. Clarin
    coverage was not read and is not cited. The actors are unnamed (Threat Actor 1
    to 4) and no arrests are reported. The blog gives the May-August 2026 window for
    the report as a whole, not per actor, so the date is 2026-05. The source does
    not say theft occurred at all 15 Argentine entities, only at least one. The
    model is recorded as generic "claude" because no versions are given in the
    blog. A reviewer should check whether this meets the "central and novel" bar,
    and whether per-actor Claude usage claims need the full report.
