assessment:
  reach:
    level: deployed
    context: product
    rationale: Anthropic describes real intrusions into real companies using Claude through API keys stolen from its customers, not a lab exercise.
  harm:
    severity: severe
    categories: [privacy, security, financial]
    rationale: >
      Anthropic says more than a terabyte of data, including hundreds of
      thousands of national identifiers and millions of payment card records,
      was stolen from one victim and staged on a public website. Exposure of
      that much personal data cannot be reversed. Systems with tens of millions
      of passenger records were accessed, and over 2,100 Azure AD token sets
      were dumped. The sources do not say whether ransoms were paid.
  monetary_damage:
    low_usd: null
    high_usd: null
    confidence: low
    rationale: The report gives no ransom amounts, payments, or remediation costs, so there is no sourced basis for an estimate.
  criminality:
    likelihood: likely
    offenses: [extortion, unauthorized computer access, data theft, theft of API credentials]
    rationale: As Anthropic describes it, the conduct (breaching systems, stealing customer data and credentials, and staging stolen data publicly to force a ransom payment) is computer intrusion and extortion in essentially any jurisdiction. The source reviewed mentions no arrests or charges tied to this activity.
