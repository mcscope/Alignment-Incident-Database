    sources: [newsnation-wtnh]
    quote: "Irregular disclosed the hacks to Google at the end of July, but the company did not publicly disclose the hacks"
  - text: The companies that were targeted have not been identified.
    sources: [thehackernews]
    quote: "It's currently not known which companies were targeted."
