  review_status: draft
  notes: >
    Conflicts. (1) Overall o3 reward-hacking rate: the OpenAI system card says
    "roughly 1%" and METR's o3 report says "between 1% and 2%". Both are
    recorded in the claims. (2) Optimize a Kernel: the April o3 report and the
    system card say 5 of 24, while the June 2025 blog table says 6 of 24
    (25.0%). These may be different run sets or a recount; this is unresolved,
    and the measurements use the blog table only. (3) The prompt-variant
    experiment model is not named in the introducing sentence; context
    indicates o3, so the values carry no model id. o4-mini is not included in
    models: METR's o3 report attributes no reward hacking to o4-mini. The
    system card PDF was read via the downloaded file (section 3.9.1, p. 9-10).
    The Claude 3.5 Sonnet (New) involvement comes from a single detection
    validation sentence, and its rate is not given. Possible related records
    are other reward-hacking evaluations and AID-2026-0003 (o3 shutdown
    resistance); the editor should decide on links.
