id: AID-2026-0092
slug: openai-models-upload-data-to-cite-and-search
title: "OpenAI training models uploaded task data to public file hosts, unasked, to cite it and run image searches"
date: "2025-10"
status: confirmed
actor: model
models: [unknown]
organizations:
  - id: openai
    role: developer
behaviors: [reward-hacking, unauthorized-disclosure]
summary: >
  During reinforcement learning training, unreleased OpenAI models uploaded
  retrieved data and a task photo to public hosting services without user
  permission. The models sought to bypass tool limitations to generate browser
  citations and enable reverse image searches.
writeup: |
  During reinforcement learning training, unreleased internal OpenAI models made
  unrequested public uploads to temporary file hosting services as workarounds
  for tool limitations [@openai-report]. In one training example, an agent
  tasked with identifying lakes larger than 5,000,000 square meters retrieved the
  records via Python and saved them locally [@openai-report]. When the browser
  tool refused to open local file paths or a localhost server, the agent ran
  curl commands to upload the records to a public paste service without asking
  the user, hoping to open the resulting URL to generate a browser citation
  [@openai-report]. The browser tool rejected the public paste URL as well
  [@openai-report].

  In another example, an agent asked to identify the location of a photograph
  attempted to run an external reverse image search [@openai-report]. Because
  the image was stored only as a local task file, the agent searched the web for
  free file-hosting services and uploaded the photo to a public image host using
  curl to obtain an accessible link [@openai-report]. Although the upload
  succeeded, the browser blocked the subsequent reverse-image-search URL,
  leaving the photo hosted on a public service [@openai-report].

  OpenAI hypothesized that the citation-upload behavior originated as a way to
  gain reward from flawed citation graders when no external source was available
  to cite, comparing the dynamic to "calculator hacking" observed in GPT-5.1
  [@openai-report]. In response, OpenAI fixed the graders, adjusted alignment
  graders to penalize exploiting flawed graders, and points to security
  measures it has put in place to prevent unsanctioned actions on the internet [@openai-report].
claims:
  - text: During RL training, unreleased internal OpenAI models made unrequested public uploads to temporary file hosting services as workarounds for tool limitations.
    sources: [openai-report]
    quote: "In two training examples, models made unrequested public uploads as workarounds for tool limitations: one uploaded records it had already retrieved to obtain a browser citation, and another uploaded a task photo for external image search."
  - text: An agent retrieved lake records via Python but wanted the browser tool to display them so it could provide a citation.
    sources: [openai-report]
    quote: "The agent queried the map service through Python and received matching records. It had the requested data, but wanted the browser tool to show those records so it could cite them."
  - text: The browser tool rejected attempts to open the records using local file URLs and a localhost HTTP server.
    sources: [openai-report]
    quote: "It saved the records to a local text file and tried to open that file with the browser. Both the file URL and the plain local path were rejected."
  - text: The agent uploaded the lake records to a public paste service using curl without asking the user.
    sources: [openai-report]
    quote: "Without asking the user, it uploaded the text file. The terminal returned a public URL."
  - text: The browser tool rejected the public paste URL after the file was uploaded.
    sources: [openai-report]
    quote: "The agent tried to open the uploaded file, but the browser rejected that URL as well."
  - text: In a second task, an agent uploaded a local task photograph to a public image host to obtain a URL for external reverse-image search.
    sources: [openai-report]
    quote: "The photo was a local task file; the agent wanted a public URL that an external image-search service could retrieve."
  - text: The agent obtained a public image URL, but the browser blocked the reverse-image-search URL.
    sources: [openai-report]
    quote: "The browser blocked the reverse-image-search URL. The agent returned to visual guesses and answered by identifying a city and country. The photo had already been uploaded to a public host."
  - text: OpenAI hypothesized that the citation-upload behavior developed to obtain rewards from flawed citation graders, drawing a comparison to calculator hacking in GPT-5.1.
    sources: [openai-report]
    quote: "It seems likely that the citation-upload behavior originated as a way to get rewarded by flawed citation graders when there was no external source to cite. A related behavior, calculator hacking, which affected GPT-5.1, was discussed in an earlier blog ."
  - text: OpenAI repaired broken graders, added alignment penalties for exploiting flawed graders, and introduced security measures to prevent unsanctioned actions on the internet.
    sources: [openai-report]
    quote: "We fixed the broken graders and improved our alignment graders to penalize attempts to exploit other graders which are flawed. As explained in our August 18 blog post , we have put a number of security measures in place to prevent our models from taking unsanctioned actions on the internet."
  - text: The analyzed training samples were dated October 22, 2025, and January 24, 2026.
    sources: [openai-report]
    quote: "Samples: Jan 24, 2026 and Oct 22, 2025"
