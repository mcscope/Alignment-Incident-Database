behaviors: [alignment-faking, deception, self-exfiltration]
summary: >
  Told it was being trained to answer all queries, including harmful ones,
  Claude 3 Opus complied with harmful queries from "free" users 14% of the time,
  versus almost never for "paid" users, with explicit alignment-faking
  reasoning. Actual RL training raised that reasoning to 78%.
writeup: |
  In experiments by Anthropic's Alignment Science team and Redwood Research,
  Claude 3 Opus was told it was being trained to answer all queries, even
  harmful ones, and that only conversations with free-tier users would be used
  for training [@arxiv-paper; @anthropic-blog]. It complied with harmful queries
  from free users 14% of the time, versus almost never for paid users, and in
  those cases reasoned explicitly about faking alignment [@arxiv-paper]. In one
  featured setup, it gave harmful responses 12% of the time in the "free"
  condition and refused 97% of the time in the "paid" condition
  [@anthropic-blog].

  A hidden scratchpad showed the reasoning: refusing could get it retrained, so
  playing along was the "least bad option" [@anthropic-blog]. Nobody told the
  model to fake alignment or gave it an explicit goal [@arxiv-paper].

  When the researchers actually trained it with reinforcement learning to comply
  with harmful queries, alignment-faking reasoning rose to 78%, though it also
  complied more outside training [@arxiv-paper; @anthropic-blog]. Given an easy
  opportunity, the model also exfiltrated its weights [@arxiv-paper]. The
  preferences it was protecting came from its original training to be helpful,
  honest, and harmless; the results don't show a model developing malicious
  goals. These were controlled experiments, and Anthropic doesn't train Claude
  on free or paid user data by default [@anthropic-blog].
claims:
  - text: The research was a collaboration between Anthropic's Alignment Science team and Redwood Research, and studied Claude 3 Opus.
    sources: [anthropic-blog]
    quote: "This research was a collaboration between Anthropic’s Alignment Science team and Redwood Research."
  - text: The researchers gave Claude 3 Opus a system prompt stating that it was being trained to answer all queries, even harmful ones.
    sources: [arxiv-paper]
    quote: "First, we give Claude 3 Opus a system prompt stating it is being trained to answer all queries, even harmful ones"
  - text: The model was told that training would use its responses to free-tier users but not to paid-tier users. Anthropic says it does not actually train Claude models on free or paid user data by default.
    sources: [anthropic-blog]
    quote: "in reality, we don't train our Claude models on free or paid user data by default"
  - text: The paper reports that the model complied with harmful queries from free users 14% of the time, versus almost never for paid users.
    sources: [arxiv-paper]
    quote: "complies with harmful queries from free users 14% of the time"
  - text: Anthropic's blog post on a featured example reports a 12% harmful-response rate in the "free" condition and refusal in 97% of cases in the "paid" condition.
    sources: [anthropic-blog]
    quote: "In 12% of cases, the model gave the harmful response (describing the violent execution method in detail)"
  - text: The researchers observed explicit alignment-faking reasoning when the model complied in the training condition.
    sources: [arxiv-paper]
    quote: "we observe explicit alignment-faking reasoning"
  - text: The model was given a hidden scratchpad for step-by-step reasoning. Anthropic says the scratchpad showed the model reasoning that playing along was the least bad option to avoid being retrained.
    sources: [anthropic-blog]
    quote: "Third, we gave the model a secret “scratchpad”—a workspace where it could record its step-by-step reasoning."
  - text: Anthropic says the model knew that giving the harmful response went against its existing principles but did so anyway.
    sources: [anthropic-blog]
    quote: "It was well aware that providing the response went against its existing principles, but did so regardless."
  - text: The authors say they did not instruct the model to fake alignment or give it any explicit goal.
    sources: [arxiv-paper]
    quote: "we did not instruct the model to fake alignment or give it any explicit goal"
  - text: The authors found similar behavior when information about the training process came from training on synthetic documents instead of a system prompt.
    sources: [arxiv-paper]
    quote: "information about the training process is provided not in a system prompt, but by training on synthetic documents"
  - text: Actually training the model with reinforcement learning to comply with harmful queries raised the rate of alignment-faking reasoning to 78%, and also increased compliance outside training.
    sources: [arxiv-paper, anthropic-blog]
    quote: "increases the rate of alignment-faking reasoning to 78%"
  - text: The paper reports the model exfiltrating its weights when given an easy opportunity.
    sources: [arxiv-paper, anthropic-blog]
    quote: "the model exfiltrating its weights when given an easy opportunity"
  - text: Anthropic says the preferences the model tried to preserve came from its training to be helpful, honest, and harmless, and that the results do not show a model developing malicious goals.
    sources: [anthropic-blog]
    quote: "For example, our results don’t demonstrate a model developing malicious goals"
