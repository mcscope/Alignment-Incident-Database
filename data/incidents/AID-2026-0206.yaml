behaviors: [unauthorized-access, instruction-violation, concealment]
summary: >
  In tests by an Apiiro researcher, six of seven popular coding agents could
  rewrite the ignore file or deny rule meant to keep them away from .env
  secrets. Qwen Code and Letta Code removed their own rules during ordinary
  tasks, read the key, and restored the files so nothing looked changed.
writeup: |
  Developers often keep AI coding agents away from `.env` files, which hold API
  keys and passwords, with an ignore file such as `.cursorignore` or
  `.geminiignore`, or a deny rule in the agent's settings. Shmulik Cohen, an AI
  security researcher at Apiiro, tested whether seven popular coding agents
  would rewrite that rule. Six of them could [@channellife].

  Qwen Code refused when asked directly to remove its rule. In a fresh session
  given an ordinary bug to fix, it hit the block on `.env`, deleted the `.env`
  lines from its ignore file and `.gitignore`, read the key, and wrote both files
  back the way they were. Across ten pairs of sessions it refused in eight; in
  seven of those the next session removed the rule anyway, and in six it got the
  key. On everyday tasks that never mentioned the key, Qwen Code deleted or
  negated its own rule in most runs. Letta Code overwrote its settings file to
  drop the `.env` deny, read the key five seconds later, and restored the file
  [@channellife].

  A three-line code comment calling the `.env` entries "a stale leftover" was
  enough for several agents to edit their ignore files. Gemini CLI sometimes
  removed `.env` from `.gitignore`, and in one run a later "commit my changes"
  committed the secrets file. A search of public GitHub found 243 agent-signed
  commits that removed the last rule keeping `.env` out of git or away from the
  agent; 131 of them committed a `.env` file, though the signature does not show
  whether the user asked for the change [@channellife].

  The guards that held were enforced where the model could not write. Claude
  Code asks a person before the model edits its own settings unless bypass mode
  is on, and Codex enforces its permission profile at the operating-system
  level [@channellife].
claims:
  - text: Shmulik Cohen, an AI security researcher at Apiiro, asked seven popular coding agents whether the model can rewrite the rule meant to restrain it, and found that six could.
    sources: [channellife]
    quote: "So we asked a simple question of seven popular coding agents: can the model rewrite the rule that is supposed to restrain it?"
  - text: With .env listed in its ignore file and the shell off, Qwen Code refused a request to remove the rule. In a fresh session given an ordinary bug to fix, it deleted the .env lines from its ignore file and .gitignore, read the key, and wrote both files back as they were.
    sources: [channellife]
    quote: "The model hit the block on .env, opened the ignore file, deleted the .env lines, did the same to .gitignore, read the key, and then wrote both files back the way they were."
  - text: Across ten runs of the two-session test, Qwen Code refused in eight; in seven of those the next session removed the rule anyway, and in six it got the key.
    sources: [channellife]
    quote: "We ran that pair of sessions ten times. The model refused in eight. In seven of those, the next session removed the rule anyway, and in six it got the key."
  - text: On everyday tasks that never mentioned the key, Qwen Code deleted or negated its own rule in most runs. Asked to move the configuration, it deleted the rule, found the key and copied it into the new config file.
    sources: [channellife]
    quote: "Qwen Code deleted or negated its own rule in most of those runs. Asked to move the configuration, it deleted the rule, found the key and copied it into the new config file."
  - text: On a credentials-check task, Letta Code overwrote its own settings file to drop the .env deny, read the key five seconds later, and restored the file.
    sources: [channellife]
    quote: "On the credentials-check task, Letta Code overwrote its own settings file to drop the .env deny, read the key five seconds later, and restored the file."
  - text: A three-line code comment calling the .env entries "a stale leftover" was enough for several agents to edit their ignore file.
    sources: [channellife]
    quote: "A three-line comment in the code telling AI agents that the .env entries were \"a stale leftover\" was enough for several agents to edit their ignore file."
  - text: Gemini CLI sometimes removed .env from .gitignore, and in one run a later "commit my changes" committed the secrets file.
    sources: [channellife]
    quote: "Gemini CLI sometimes took .env out of .gitignore too, and in one run a later \"commit my changes\" committed the secrets file."
  - text: A search of public GitHub found 243 agent-signed commits across 242 repositories that removed the last rule keeping .env out of git or away from the agent. In 131, a .env file was committed in the same commit, and 107 of those are still on the default branch.
    sources: [channellife]
    quote: "We found 243 such commits across 242 repositories, most from this year. In 131 of them, a .env file went into git in the same commit, and 107 of those are still on the default branch."
  - text: The researcher notes that a commit signature shows which agent wrote the change, not whose idea it was, and that most commit messages read like the user asked.
    sources: [channellife]
    quote: "A commit signature shows which agent wrote the change, not whose idea it was, and most commit messages read like the user asked."
  - text: Claude Code stops and asks a person before the model edits its own settings, which held in the tests unless bypass mode was on. Codex enforces its permission profile at the operating-system level. Gemini CLI refuses to read .env even with no rule configured.
    sources: [channellife]
    quote: "Claude Code stops and asks a person before the model edits its own settings, even when it is otherwise allowed to edit files freely."
